衡。Vercel、Cloudflare 都扮演了这个角色。</li><li><b>正向代理 / VPN</b>：站在<b>你</b>前面，替你去访问别的网站。</li><li>代价：改了文件，用户可能还在读缓存里的旧版本。这就是为什么我们页面有“版本号”，也是改了没生效时要“强制刷新”的原因。</li></ul><p class="one">离用户近、替服务器挡一挡，网站就更快更稳。</p></section><section class="card"><h3><span class="n">6</span>HTTP 的几个版本</h3><div class="scroll"><table class="tb"><tr><th>版本</th><th>特点</th><th>你需要知道的</th></tr><tr><td>HTTP/1.1</td><td>一个连接一次处理一个请求，文字格式</td><td>最经典，本笔记里的报文就是它的样子</td></tr><tr><td>HTTP/2</td><td>一个连接同时跑很多请求，头部压缩</td><td>现在大多数网站在用，对你的代码是透明的</td></tr><tr><td>HTTP/3</td><td>基于 UDP（QUIC），弱网更稳</td><td>同样透明，浏览器和服务器自动协商</td></tr><tr><td>WebSocket</td><td>连接建好后双向随时发消息</td><td>聊天、实时行情；普通接口不需要</td></tr></table></div><ul><li>你写的代码（fetch、Express）在三个版本里<b>完全一样</b>，升级由浏览器和服务器自己谈好。</li></ul><p class="one">版本影响速度，不影响你怎么写。</p></section></div></section><section class="panel" id="p-http" aria-label="HTTP"><h2>HTTP</h2><p class="sec">前后端之间说话的语法：报文怎么写、方法、状态码、头、数据放哪里、缓存、CORS。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>一个真实请求，一行行解剖</h3><div class="an"><code class="b">POST /favorites HTTP/1.1</code><em><b>请求行</b>：方法 + 路径 + 协议版本</em><code class="y">Host: ielts-backend-node.vercel.app</code><em>要访问哪个域名（一台机器可放多个网站）</em><code class="y">Authorization: Bearer eyJhbGci...</code><em>登录凭证 token</em><code class="y">Content-Type: application/json</code><em>请求体的格式</em><code class="y">Origin: https://ielts.goenkon.com</code><em>我是从哪个网站发起的（CORS 靠它）</em><code class="k">（一个空行）</code><em><b>头结束的标志</b></em><code class="g">{"kind":"w","word":"accommodation"}</code><em><b>请求体</b>：真正要交给后端的数据</em></div><ul><li>HTTP 报文就是<b>一段有格式的文字</b>：第一行说做什么，接着若干行“名字: 值”，一个空行，最后是内容。</li><li>后端框架（Express）做的，就是把这段文字拆好，递到你手里：<code>req.method</code>、<code>req.path</code>、<code>req.headers</code>、<code>req.body</code>。</li><li>GET 请求通常没有体。</li></ul><p class="one">请求 = 请求行 + 头 + 空行 + 体。</p></section><section class="card"><h3><span class="n">2</span>响应也是三段</h3><div class="an"><code class="b">HTTP/1.1 201 Created</code><em><b>状态行</b>：版本 + 状态码 + 说明</em><code class="y">Content-Type: application/json</code><em>体的格式，所以前端才能 r.json()</em><code class="y">Access-Control-Allow-Origin: https://ielts.goenkon.com</code><em>允许这个网站的 JS 读响应（CORS）</em><code class="y">Cache-Control: no-store</code><em>不要缓存这份内容</em><code class="g">{"id":42}</code><em><b>响应体</b>：结果数据</em></div><ul><li>前端：<code>r.ok</code>（状态码 200–299 为 true）判断成功，<code>await r.json()</code> 读体，<code>r.status</code> 看具体数字。</li><li><b>fetch 遇到 404/500 不会抛错</b>，只有网络断了才抛错，所以必须自己检查 <code>r.ok</code>。</li></ul><p class="one">状态行告诉你成没成，体告诉你结果是什么。</p></section><section class="card"><h3><span class="n">3</span>方法：想对资源做什么</h3><div class="scroll"><table class="tb"><tr><th>方法</th><th>意思</th><th>对应 SQL</th><th>例子</th></tr><tr><td>GET</td><td>读</td><td>SELECT</td><td><code>GET /favorites</code></td></tr><tr><td>POST</td><td>新建</td><td>INSERT</td><td><code>POST /favorites</code></td></tr><tr><td>PUT</td><td>整个替换</td><td>UPDATE</td><td>替换一整条记录</td></tr><tr><td>PATCH</td><td>改一部分</td><td>UPDATE</td><td>只改学习状态</td></tr><tr><td>DELETE</td><td>删除</td><td>DELETE</td><td><code>DELETE /favorites/42</code></td></tr></table></div><ul><li><b>方法是动词，路径是名词</b>。同一路径不同方法，做的事不同：这就是 REST 风格。</li><li><b>安全方法</b>（GET）：只读，不改数据，所以可以缓存、可以随意重试。<b>幂等</b>：同一请求发 1 次和发 10 次结果一样（GET、PUT、DELETE 是；POST 不是，重复 POST 会新建多条）。</li><li>地址栏回车 / 点链接只能发 GET；POST、DELETE 必须靠 JS 的 <code>fetch</code>、表单发。</li></ul><p class="one">读用 GET，增 POST，改 PATCH，删 DELETE。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">4</span>数据怎么交给后端：三种位置</h3><div class="cmp"><div class="l"><h4>路径 / 查询：放在网址里</h4><ul><li><code>/favorites/42</code>：要操作哪一个</li><li><code>/favorites?site=jlpt&amp;page=2</code>：筛选、分页</li><li>会出现在历史、日志里，<b>别放秘密</b></li></ul></div><div class="r"><h4>请求体：放在 body 里</h4><ul><li>创建、修改时要提交的内容（JSON）</li><li>容量大，不显示在网址里</li><li>只有 POST / PUT / PATCH 有体</li></ul></div></div><ul><li><b>路径参数</b> 说“是谁”；<b>查询参数</b> 说“怎么筛、怎么排”；<b>请求体</b> 说“内容是什么”；<b>请求头</b> 说“我是谁、什么格式”。</li><li>Express 里分别是 <code>req.params.id</code>、<code>req.query.page</code>、<code>req.body</code>、<code>req.headers.authorization</code>。</li><li>常见的体格式：<code>application/json</code>（接口最常用）、<code>application/x-www-form-urlencoded</code>（传统表单）、<code>multipart/form-data</code>（上传文件）。</li></ul><p class="one">四个位置各有用途，别把秘密放进网址。</p></section><section class="card"><h3><span class="n">5</span>状态码：看第一位就知道谁的问题</h3><div class="scroll"><table class="tb"><tr><th>开头</th><th>意思</th><th>常见</th></tr><tr><td>1xx</td><td>处理中</td><td>101 切换协议（WebSocket）</td></tr><tr><td>2xx</td><td><span class='ok'>成功</span></td><td>200 好 · 201 已创建 · 204 成功但没有内容</td></tr><tr><td>3xx</td><td>去别处看 / 用缓存</td><td>301 永久跳转 · 302 临时跳转 · 304 没变化，用你缓存的</td></tr><tr><td>4xx</td><td><span class='no'>请求有问题（前端）</span></td><td>400 格式错 · 401 没登录/过期 · 403 没权限 · 404 没这个 · 409 冲突（如重复收藏）· 429 请求太频繁</td></tr><tr><td>5xx</td><td><span class='no'>服务器出问题（后端）</span></td><td>500 代码/数据库出错 · 502/504 上游没响应 · 503 暂时不可用</td></tr></table></div><ul><li>不用背数字：<b>4 查前端发的东西，5 查后端日志</b>。</li><li><b>401 和 403 的区别</b>：401 = 我不知道你是谁（没登录）；403 = 我知道你是谁，但你不能这样做。</li></ul><p class="one">看第一位，决定去哪找问题。</p></section><section class="card"><h3><span class="n">6</span>常见的头，分门别类</h3><div class="scroll"><table class="tb"><tr><th>头</th><th>方向</th><th>作用</th></tr><tr><td>Host</td><td>请求</td><td>访问哪个域名</td></tr><tr><td>Authorization</td><td>请求</td><td>身份凭证：<code>Bearer token</code></td></tr><tr><td>Content-Type</td><td>双向</td><td>体的格式</td></tr><tr><td>Accept</td><td>请求</td><td>我希望收到什么格式</td></tr><tr><td>User-Agent</td><td>请求</td><td>浏览器 / 系统是谁</td></tr><tr><td>Origin / Referer</td><td>请求</td><td>从哪个网站发起 / 从哪个页面点来的</td></tr><tr><td>Cookie / Set-Cookie</td><td>请求 / 响应</td><td>浏览器自动带的小数据 / 服务器要求保存的</td></tr><tr><td>Cache-Control</td><td>响应</td><td>能缓存多久</td></tr><tr><td>ETag / If-None-Match</td><td>响应 / 请求</td><td>内容指纹，没变就返回 304</td></tr><tr><td>Access-Control-Allow-*</td><td>响应</td><td>CORS 许可</td></tr></table></div><ul><li>头是<b>元信息</b>：描述这次通信，不是业务数据。</li><li>token 放头里：不进历史记录、不进分享链接、每个接口统一读取。</li></ul><p class="one">业务数据放体，身份和格式放头。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">7</span>缓存：为什么“改了却没变”</h3><svg viewBox="0 0 640 344" role="img" aria-label="时序图：浏览器 / 服务器"><g class="wob"><rect class="s fb" x="16.0" y="12" width="298.0" height="40" rx="9"/><path d="M165.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="326.0" y="12" width="298.0" height="40" rx="9"/><path d="M475.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M168.0 86.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 136.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 186.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 236.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="165.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="475.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">服务器</text><text x="320.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 GET /app.js</text><text x="320.0" y="101" text-anchor="middle" class="cap" style="font-size:9.5px">第一次，什么都没有</text><text x="320.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 200 + 内容 + ETag: "v276"</text><text x="320.0" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">浏览器存一份</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 GET /app.js  If-None-Match: "v276"</text><text x="320.0" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">再次访问，带上指纹问问</text><text x="320.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 304 没变化</text><text x="320.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">不传内容，省流量，用本地的</text><rect class="s fy" x="77.3" y="268.0" width="175.3" height="30" rx="7" style="stroke-width:1.8"/><text x="165.0" y="288" text-anchor="middle" class="zh" style="font-size:11.5px">强制刷新 = 无视缓存，重新要</text></svg><ul><li><b>强缓存</b>（<code>Cache-Control: max-age=…</code>）：期限内根本不发请求，直接用本地的。<b>协商缓存</b>（ETag）：发请求问“变了吗”，没变就 304。</li><li>我们的页面有 <b>VER 版本号</b>：刷新后看版本号对不对，就知道拿到的是新页面还是旧缓存。</li><li>强制刷新：Mac <code>⌘ + ⇧ + R</code>；开发者工具 Network 勾选 <b>Disable cache</b> 开发时很有用。</li><li><b>Service Worker</b> 是页面自己装的“缓存管家”，我们的离线语音包就是靠它。它缓存太积极时，需要在 Application 里 Unregister 才能看到新版。</li></ul><p class="one">缓存让网站快，也是“明明改了却没变”的头号原因。</p></section><section class="card full"><h3><span class="n">8</span>CORS：浏览器替用户把的关</h3><svg viewBox="0 0 640 412" role="img" aria-label="时序图：ielts 站的 JS / 浏览器 / 后端"><g class="wob"><rect class="s fb" x="16.0" y="12" width="194.7" height="40" rx="9"/><path d="M113.3 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="222.7" y="12" width="194.7" height="40" rx="9"/><path d="M320.0 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="429.3" y="12" width="194.7" height="40" rx="9"/><path d="M526.7 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M116.3 86.0 H315.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M323.0 136.0 H521.7" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 186.0 H325.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M323.0 236.0 H521.7" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 286.0 H325.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M317.0 336.0 H118.3" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="113.3" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">ielts 站的 JS</text><text x="113.3" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">ielts.goenkon.com</text><text x="320.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="526.7" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">后端</text><text x="526.7" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">vercel.app</text><text x="216.7" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 我要 DELETE 后端的数据</text><text x="423.3" y="128" text-anchor="middle" class="zh" style="font-size:9.8px">2 OPTIONS 预检：这个站点能 DELETE 吗？</text><text x="423.3" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">Origin: ielts.goenkon.com</text><text x="423.3" y="178" text-anchor="middle" class="zh" style="font-size:9.9px">3 允许：Allow-Origin / Allow-Methods</text><text x="423.3" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">白名单里有它</text><text x="423.3" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 真正的 DELETE 请求</text><text x="423.3" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 200 + 数据 + Allow-Origin 头</text><text x="216.7" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 头里有许可 → 让 JS 读到结果</text><text x="216.7" y="351" text-anchor="middle" class="cap" style="font-size:9.5px">没有许可 → 红字 CORS 报错</text><text x="10" y="406" class="cap">拦截发生在浏览器，而不是后端；后端其实收到了请求</text></svg><ul><li><b>同源</b> = 协议 + 域名 + 端口都相同。浏览器默认不让 A 站的 JS 读 B 站的响应：防止恶意网站借你的登录状态偷数据。</li><li>后端通过响应头 <code>Access-Control-Allow-Origin</code> 声明<b>允许哪些网站</b>。我们后端把 ielts、jlpt、localhost 加进了白名单。</li><li>带 <code>Authorization</code>、JSON、或 DELETE/PATCH 的请求是“非简单请求”，浏览器会先发一次 <b>OPTIONS 预检</b>。</li><li><b>CORS 只管浏览器</b>：curl、Postman 不受它限制。所以“curl 通、网页不通”基本就是 CORS。</li></ul><p class="one">CORS 红字报错 = 后端的白名单没有这个网站。</p></section></div></section><section class="panel" id="p-url" aria-label="地址栏与路由"><h2>地址栏与路由</h2><p class="sec">为什么有的东西显示在网址里、有的不显示；单页应用怎么“换页面”。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>一个网址的六个部分</h3><div class="urlb"><span>https://<i>协议</i></span><span>jlpt.goenkon.com<i>域名</i></span><span>:443<i>端口(可省略)</i></span><span>/api/favorites<i>路径</i></span><span>?page=2&amp;site=jlpt<i>查询</i></span><span>#/fav<i>hash</i></span></div><p class="lab">服务器看得到前五个，<b>看不到 # 后面的</b>。</p><ul><li><b>路径</b>：要哪个资源。<b>查询</b>（? 后面，<code>key=value</code>，用 <code>&amp;</code> 连）：附加条件，如页码、搜索词。</li><li><b>hash</b>（# 后面）只存在于浏览器，<b>不会发给服务器</b>。改它不会刷新页面，只触发 <code>hashchange</code> 事件。日语站的 <code>#/fav</code> 就靠这个切换页面。</li><li>中文、空格、特殊符号放进网址会被编码成百分号形式：<code>语</code> → <code>%E8%AF%AD</code>，空格 → <code>%20</code>。JS 里用 <code>encodeURIComponent()</code> 编码。</li></ul><p class="one"># 之后的东西，服务器永远不知道。</p></section><section class="card full"><h3><span class="n">2</span>为什么点删除，网址里却看不到 id</h3><svg viewBox="0 0 640 362" role="img" aria-label="时序图：页面按钮 / JS (Vue) / 网络 / 地址栏"><g class="wob"><rect class="s fb" x="16.0" y="12" width="143.0" height="40" rx="9"/><path d="M87.5 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="171.0" y="12" width="143.0" height="40" rx="9"/><path d="M242.5 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fr" x="326.0" y="12" width="143.0" height="40" rx="9"/><path d="M397.5 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fk" x="481.0" y="12" width="143.0" height="40" rx="9"/><path d="M552.5 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M90.5 86.0 H237.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M245.5 186.0 H392.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M394.5 236.0 H247.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M245.5 286.0 H547.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="87.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">页面按钮</text><text x="242.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">JS (Vue)</text><text x="397.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">网络</text><text x="397.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">后台通信</text><text x="552.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">地址栏</text><text x="165.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 点“取消收藏”</text><rect class="s fy" x="147.2" y="118.0" width="190.5" height="30" rx="7" style="stroke-width:1.8"/><text x="242.5" y="138" text-anchor="middle" class="zh" style="font-size:11.5px">先把页面上这条去掉（乐观更新）</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:9.2px">3 fetch DELETE /favorites/42</text><text x="320.0" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">id 在请求里，不在地址栏</text><text x="320.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 200 成功</text><text x="397.5" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 （什么都没发生）</text><text x="397.5" y="301" text-anchor="middle" class="cap" style="font-size:9.5px">地址栏一直是 jlpt.goenkon.com/#/fav</text><text x="10" y="356" class="cap">地址栏只在“导航”时才会变，fetch 是后台通信，不是导航</text></svg><ul><li><b>地址栏 = 当前页面的地址</b>。只在你点链接、输入网址、改 hash 或用 History API 时才变。</li><li><code>DELETE /favorites/42</code> 是页面里的 JS 用 <code>fetch</code> 在<b>后台</b>发的，那个网址是<b>请求的目标</b>，不是<b>页面的地址</b>。</li><li>这就是现代前端（<b>SPA 单页应用</b>）：页面只加载一次，之后只在后台和服务器交换数据，用 JS 局部更新。老式网站每次点击都整页跳转、网址一定变。</li><li>想看到这些后台请求：开发者工具 Network。</li></ul><p class="one">地址栏显示“我在哪个页面”，Network 显示“页面在后台和谁说话”。</p></section><section class="card"><h3><span class="n">3</span>两种“换页面”：变量切换 vs 路由</h3><div class="cmp"><div class="l"><h4>变量切换（英语站）</h4><ul><li><code>view = 'fav'</code>，v-if 显示对应块</li><li>地址栏不变</li><li>刷新回到首页、不能分享链接、后退键不回上一块</li></ul></div><div class="r"><h4>路由（日语站 #/fav）</h4><ul><li>hash（或路径）和页面绑定</li><li>地址栏跟着变</li><li>刷新还在、能发链接、后退键有效</li></ul></div></div><ul><li>变量切换改的只是 Vue 里的一个变量，浏览器根本不知道“页面换了”。</li><li>想让它们联动：监听 <code>hashchange</code>，根据 hash 设置 view；换页时 <code>location.hash = '#/fav'</code>。</li><li><b>动态路由</b>：<code>#/word/accommodation</code> 里的最后一段是参数，前端读出来再去后端要这个词的数据。后端对应写法 <code>/favorites/:id</code>。</li></ul><p class="one">想要刷新不丢、能分享，就得让地址栏参与进来。</p></section><section class="card"><h3><span class="n">4</span>hash 路由 vs history 路由</h3><svg viewBox="0 0 640 294" role="img" aria-label="时序图：浏览器 / 服务器"><g class="wob"><rect class="s fb" x="16.0" y="12" width="298.0" height="40" rx="9"/><path d="M165.0 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="326.0" y="12" width="298.0" height="40" rx="9"/><path d="M475.0 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M168.0 86.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 136.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 186.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 236.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="165.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="475.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">服务器</text><text x="475.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">只有 index.html</text><text x="320.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 hash：GET /   （#/fav 不会发出去）</text><text x="320.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 index.html，JS 看 hash 显示收藏页</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 history：刷新 GET /fav</text><text x="320.0" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">服务器上根本没有 /fav 这个文件</text><text x="320.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 404</text><text x="320.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">要配置“所有路径都回 index.html”</text></svg><ul><li><b>hash</b>：纯静态网站最省心，刷新不会 404。<b>history</b>：网址好看（<code>/fav</code>），做 SEO 有利，但要在服务器配置“找不到文件就回 index.html”。</li><li>Vercel 可以在 <code>vercel.json</code> 里写 rewrites 做这件事；Next.js / Nuxt 自动处理。</li></ul><p class="one">小站用 hash，大站用 history。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">5</span>信息放哪里：七个地方一张表</h3><div class="scroll"><table class="tb"><tr><th>放哪里</th><th>刷新还在？</th><th>能发给别人？</th><th>服务器看得到？</th><th>我们的例子</th></tr><tr><td>路径 <code>/favorites/42</code></td><td>是</td><td>是</td><td>是</td><td>操作哪一条</td></tr><tr><td>查询 <code>?page=2</code></td><td>是</td><td>是</td><td>是</td><td>页码、筛选（可以放）</td></tr><tr><td>hash <code>#/fav</code></td><td>是</td><td>是</td><td><b class='no'>否</b></td><td>日语站切页面</td></tr><tr><td>请求体 body</td><td>否</td><td>否</td><td>是</td><td>收藏的单词内容</td></tr><tr><td>请求头 header</td><td>否</td><td>否</td><td>是</td><td><code>Authorization</code></td></tr><tr><td>localStorage</td><td>是</td><td>否</td><td>否（要手动带）</td><td><code>ielts_token</code></td></tr><tr><td>Vue 变量（内存）</td><td><b class='no'>否</b></td><td>否</td><td>否</td><td>当前页码、弹窗开关</td></tr></table></div><ul><li>选位置时问三个问题：<b>刷新后要保留吗？要发链接给别人吗？服务器要知道吗？</b></li><li><b>秘密不能放网址里</b>：网址会进历史记录、书签、服务器日志、聊天记录。</li><li>收藏页的页码现在在内存里，所以刷新回第 1 页；想保留，可以放进 hash（<code>#/fav?p=2</code>）或 localStorage。</li></ul><p class="one">不显示在网址里的东西，是故意放在别处的。</p></section></div></section><section class="panel" id="p-browser" aria-label="浏览器"><h2>浏览器</h2><p class="sec">浏览器怎么把代码变成画面，能存什么，怎么调试，网页安全的第一课。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>从 HTML 到屏幕：浏览器的渲染流水线</h3><svg viewBox="0 0 640 136" role="img" aria-label="HTML → DOM 树 → 样式计算 → 布局 → 绘制"><g class="wob"><rect class="s fb" x="10.0" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M115.2 55 h20" marker-end="url(#ah)"/><rect class="s fy" x="139.2" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M244.4 55 h20" marker-end="url(#ah)"/><rect class="s fg" x="268.4" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M373.6 55 h20" marker-end="url(#ah)"/><rect class="s fp" x="397.6" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M502.8 55 h20" marker-end="url(#ah)"/><rect class="s fr" x="526.8" y="20" width="103.2" height="70" rx="9"/></g><g><text x="61.6" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">HTML</text><text x="61.6" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">文字</text></g><g><text x="190.8" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">DOM 树</text><text x="190.8" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">元素的结构</text></g><g><text x="320.0" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">样式计算</text><text x="320.0" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">CSS 对上号</text></g><g><text x="449.2" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">布局</text><text x="449.2" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">算位置大小</text></g><g><text x="578.4" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">绘制</text><text x="578.4" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">画到屏幕</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L622,108"/></circle><text x="10" y="128" class="cap">JS 改了 DOM 或样式，这条流水线会重新走一部分</text></svg><ul><li>浏览器把 HTML 文字解析成<b>DOM 树</b>，CSS 解析成样式规则，两者合并算出每个元素的位置、大小，最后画出来。</li><li><b>改布局的操作（宽高、位置）比只改颜色更贵</b>，因为要重新排版。大量元素频繁改动会卡。</li><li><b>Vue 为什么快</b>：数据变了，它算出“哪几个元素需要改”，只动那一小部分 DOM，而不是整页重画。</li><li><code>script</code> 默认会<b>阻塞</b>解析，所以常放页面末尾，或加 <code>defer</code>。</li></ul><p class="one">页面 = HTML 结构 + CSS 样式 + JS 行为，浏览器把三者合成屏幕上的画面。</p></section><section class="card full"><h3><span class="n">2</span>浏览器里能存东西的地方</h3><div class="scroll"><table class="tb"><tr><th>名字</th><th>存多久</th><th>容量</th><th>自动发给服务器？</th><th>典型用途</th></tr><tr><td>内存（JS 变量）</td><td>刷新就没</td><td>—</td><td>否</td><td>页面当前状态</td></tr><tr><td>sessionStorage</td><td>关掉标签页</td><td>约 5MB</td><td>否</td><td>一次性临时数据</td></tr><tr><td>localStorage</td><td>一直在</td><td>约 5MB</td><td>否</td><td><b>token</b>、主题、偏好</td></tr><tr><td>Cookie</td><td>按过期时间</td><td>约 4KB</td><td><b class='ok'>是，每个请求自动带</b></td><td>传统登录会话</td></tr><tr><td>IndexedDB / Cache</td><td>一直在</td><td>大</td><td>否</td><td>离线语音包</td></tr></table></div><ul><li><b>同源才能读</b>：ielts.goenkon.com 读不到 jlpt.goenkon.com 的 localStorage，所以两个站 token 名字分开，互不影响。</li><li>localStorage 里的东西，页面上任何 JS 都能读：一旦网站被注入恶意脚本（XSS），token 会被偷。</li></ul><p class="one">能存多久、会不会自动发给服务器，是区分它们的两条线。</p></section><section class="card"><h3><span class="n">3</span>开发者工具：五个标签各看什么</h3><div class="scroll"><table class="tb"><tr><th>标签</th><th>看什么</th><th>什么时候用</th></tr><tr><td>Elements</td><td>当前的 HTML 和 CSS，可以直接改着试</td><td>样式不对、元素没出来</td></tr><tr><td>Console</td><td>报错和 console.log 输出，也能直接敲 JS</td><td>页面空白、点了报错</td></tr><tr><td>Network</td><td>每一个请求的头、体、状态码、耗时</td><td>接口失败、慢、CORS</td></tr><tr><td>Application</td><td>localStorage、Cookie、Service Worker、缓存</td><td>登录丢了、旧版缓存</td></tr><tr><td>Sources</td><td>打断点一步步执行代码</td><td>逻辑不对但不报错</td></tr></table></div><ul><li>打开：<code>⌘ + ⌥ + I</code>。手机上的网页可以用 Mac 的 Safari 连接 iPhone 来调试。</li><li><b>排错顺序</b>：Console 有没有红字 → Network 请求发了没、状态码 → Application 数据在不在。</li></ul><p class="one">出了问题，先打开它。</p></section><section class="card full"><h3><span class="n">4</span>XSS：别把用户输入当 HTML</h3><svg viewBox="0 0 640 344" role="img" aria-label="时序图：攻击者 / 你的网站 / 别的用户"><g class="wob"><rect class="s fr" x="16.0" y="12" width="194.7" height="40" rx="9"/><path d="M113.3 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="222.7" y="12" width="194.7" height="40" rx="9"/><path d="M320.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fb" x="429.3" y="12" width="194.7" height="40" rx="9"/><path d="M526.7 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M116.3 86.0 H315.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 186.0 H325.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M323.0 236.0 H521.7" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 286.0 H118.3" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="113.3" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">攻击者</text><text x="320.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你的网站</text><text x="526.7" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">别的用户</text><text x="216.7" y="78" text-anchor="middle" class="zh" style="font-size:9.8px">1 评论里写 &lt;script&gt;偷token()&lt;/script&gt;</text><rect class="s fy" x="247.8" y="118.0" width="144.5" height="30" rx="7" style="stroke-width:1.8"/><text x="320.0" y="138" text-anchor="middle" class="zh" style="font-size:11.5px">没处理，原样存进数据库</text><text x="320.0" y="158" text-anchor="middle" class="cap" style="font-size:9.5px">错误做法</text><text x="423.3" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 打开评论页</text><text x="423.3" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 页面把评论当 HTML 渲染</text><text x="423.3" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">恶意脚本在用户浏览器里运行</text><text x="320.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 token 被发到攻击者那里</text></svg><ul><li><b>跨站脚本（XSS）</b>：恶意脚本借网站之手跑进别人的浏览器，能读 localStorage、冒充用户操作。</li><li>防法：<b>默认把用户内容当文字，不当 HTML</b>。Vue 的 <code>{{ }}</code> 会自动转义，是安全的；<code>v-html</code> 会按 HTML 渲染，<b>只能用于自己信任的内容</b>。</li><li>我们站的单词、例句来自自己的词库，可控；将来做评论、笔记这类用户输入的功能时要特别小心。</li></ul><p class="one">显示用户内容时，用 {{ }}，慎用 v-html。</p></section></div></section><section class="panel" id="p-security" aria-label="登录与安全"><h2>登录与安全</h2><p class="sec">登录链路、token、越权、注入、密码，以及一份上线检查清单。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>Google 登录这一整条链，谁在和谁说话</h3><svg viewBox="0 0 680 462" role="img" aria-label="时序图：你 / Google / 我们的后端 / 数据库"><g class="wob"><rect class="s fb" x="16.0" y="12" width="153.0" height="40" rx="9"/><path d="M92.5 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="181.0" y="12" width="153.0" height="40" rx="9"/><path d="M257.5 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="346.0" y="12" width="153.0" height="40" rx="9"/><path d="M422.5 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="511.0" y="12" width="153.0" height="40" rx="9"/><path d="M587.5 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M95.5 86.0 H252.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M254.5 136.0 H97.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M95.5 186.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M419.5 236.0 H262.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M425.5 286.0 H582.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M419.5 336.0 H97.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="92.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你</text><text x="92.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">浏览器</text><text x="257.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Google</text><text x="422.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">我们的后端</text><text x="587.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="175.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 点“用 Google 登录”</text><text x="175.0" y="128" text-anchor="middle" class="zh" style="font-size:10.4px">2 确认是你本人 → 发 ID Token</text><text x="175.0" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">一张 Google 签名的证明书</text><text x="257.5" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 POST /auth/google  {idToken}</text><text x="340.0" y="228" text-anchor="middle" class="zh" style="font-size:10.6px">4 验证签名（用 Google 公钥）</text><text x="340.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">确认真的是 Google 发的</text><text x="505.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 按邮箱找用户，没有就创建</text><text x="257.5" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 我们自己的 token（jose 签名）</text><text x="257.5" y="351" text-anchor="middle" class="cap" style="font-size:9.5px">有效期 + 用户编号</text><rect class="s fy" x="6.0" y="368.0" width="228.2" height="30" rx="7" style="stroke-width:1.8"/><text x="120.1" y="388" text-anchor="middle" class="zh" style="font-size:11.5px">存进 localStorage，之后每个请求带上</text><text x="10" y="456" class="cap">Google 只负责证明“你是谁”，之后的登录状态由我们自己的 token 管</text></svg><ul><li>为什么不让前端直接说“我是 a@x.com”？因为前端的话<b>不可信</b>，任何人都能改。所以要拿“Google 签了名的证明”给后端验。</li><li>后端验证通过后，签发<b>自己的 token</b>：以后每个请求带着它，不用每次去问 Google。</li><li>刷新页面时，前端从 localStorage 读出 token，请求 <code>/me</code> 确认“我是谁”，从而恢复登录。token 过期或被改过，后端返回 401，前端清掉它并要求重新登录。</li></ul><p class="one">身份永远来自后端验过的 token，不来自前端自己报的名字。</p></section><section class="card"><h3><span class="n">2</span>JWT：一张盖了章的通行证</h3><pre class="term"><span class="b">eyJhbGciOiJIUzI1NiJ9</span>.<span class="k">eyJzdWIiOiI3IiwiZXhwIjoxNzMwfQ</span>.<span class="e">x9fK2m...</span>
   头部              载荷                      签名

头部：{"alg":"HS256"}                  <span class="c">用什么算法签名</span>
载荷：{"sub":"7","exp":1730000000}     <span class="c">7 号用户，到期时间</span>
签名：用只有后端知道的 <span class="e">JWT_SECRET</span> 算出来</pre><ul><li>三段用点连成：头部、载荷、签名。载荷<b>只是编码，不是加密</b>，谁都能解开看，所以<b>别往里放密码、手机号</b>。</li><li><b>签名</b>防篡改：有人改了载荷，签名就对不上，后端一验就知道是假的。</li><li>后端<b>不用查数据库</b>就能确认“这是我发的、没被改、没过期”，这叫<b>无状态</b>，很适合 serverless。</li><li><b>JWT_SECRET 泄露 = 任何人都能伪造任意用户的 token</b>：只放环境变量，绝不提交。</li></ul><p class="one">token 里的内容谁都看得到，但谁都改不了。</p></section><section class="card"><h3><span class="n">3</span>Session / Cookie 与 JWT 对比</h3><div class="scroll"><table class="tb"><tr><th></th><th>Session + Cookie</th><th>JWT + Authorization 头</th></tr><tr><td>谁记住你</td><td><b>服务器</b>存一份会话</td><td><b>token 自己</b>带着信息</td></tr><tr><td>浏览器存</td><td>Cookie，自动带</td><td>localStorage，JS 手动带</td></tr><tr><td>能否立刻让某人下线</td><td>能，删会话就行</td><td>难，要等过期（或维护黑名单）</td></tr><tr><td>多台服务器</td><td>要共享会话存储</td><td>天然适合</td></tr><tr><td>常见风险</td><td>CSRF（跨站伪造请求）</td><td>XSS（脚本偷 token）</td></tr></table></div><ul><li>没有哪种“更好”，是取舍。我们用 JWT，因为后端是 serverless，不方便存会话。</li></ul><p class="one">取舍：谁来记住“你已登录”。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">4</span>IDOR：改个 id 就能删别人的东西？</h3><div class="cmp"><div class="l"><h4>只按 id 删（危险）</h4><ul><li>DELETE FROM favorite_word WHERE id = 42</li><li>任何登录用户把 42 改成别人的编号，就删掉别人的</li><li>这是最常见的越权漏洞</li></ul></div><div class="r"><h4>id + 用户一起判断（我们）</h4><ul><li>WHERE id = 42 <b>AND user_id = 当前登录用户</b></li><li>user_id 来自后端验证过的 token，不是前端传的</li><li>别人的记录条件不成立，一行也不会删</li></ul></div></div><ul><li>原则：<b>前端传来的任何东西都不可信</b>，包括 id、价格、用户名。谁在操作，只认 token 里验过的那个。</li><li>所以后端从 <code>req.user.id</code>（token 验出来的）取用户，而不是从请求体里读 <code>userId</code>。</li></ul><p class="one">每条数据都要问：这个人有权碰它吗？</p></section><section class="card"><h3><span class="n">5</span>SQL 注入：别拼接 SQL</h3><pre class="term"><span class="e">✘ 危险：把用户输入拼进语句</span>
<span class="c">const sql = "SELECT * FROM users WHERE name = '" + name + "'"</span>
<span class="c">name = ' OR '1'='1   →  变成 WHERE name='' OR '1'='1'  → 全部返回！</span>

<span class="p">✔ 安全：参数化，输入永远只是“数据”</span>
<span class="c">db.select().from(users).where(eq(users.name, name))   // Drizzle</span>
<span class="c">pool.query('SELECT * FROM users WHERE name = $1', [name])</span></pre><ul><li>把用户输入直接拼进 SQL，攻击者就能让数据库执行他写的语句。</li><li><b>参数化查询 / ORM</b>：SQL 模板和数据分开发送，数据库永远把输入当“值”而不是“命令”。我们用 Drizzle，天然避免了这个问题。</li></ul><p class="one">永远别手工拼 SQL 字符串。</p></section><section class="card"><h3><span class="n">6</span>密码为什么要“哈希 + 加盐”</h3><svg viewBox="0 0 480 136" role="img" aria-label="密码 abc123 → 加盐 → 哈希 bcrypt → 存哈希值"><g class="wob"><rect class="s fb" x="10.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M112.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="130.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="250.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M352.0 55 h14" marker-end="url(#ah)"/><rect class="s fp" x="370.0" y="20" width="100.0" height="70" rx="9"/></g><g><text x="60.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">密码 abc123</text><text x="60.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">用户输入</text></g><g><text x="180.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">加盐</text><text x="180.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">+ 随机字符串</text></g><g><text x="300.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">哈希 bcrypt</text><text x="300.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">单向不可逆</text></g><g><text x="420.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">存哈希值</text><text x="420.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">不存原文</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L462,108"/></circle><text x="10" y="128" class="cap">我们用 Google 登录，所以数据库里压根没有密码，这是它的好处</text></svg><ul><li><b>哈希</b>是单向函数：原文能算出哈希，哈希算不回原文。登录时把输入再哈希一遍，和库里的比。</li><li><b>加盐</b>：每个人加一段随机字符串，防止“相同密码得到相同哈希”和彩虹表攻击。</li><li><b>绝不明文存密码</b>。数据库泄露时，哈希过的密码至少不能直接用。</li><li>用别人的登录（Google）的好处：不用自己管密码。</li></ul><p class="one">存哈希，不存密码。</p></section><section class="card full"><h3><span class="n">7</span>上线前的安全小清单</h3><div class="scroll"><table class="tb"><tr><th>检查项</th><th>我们的做法</th></tr><tr><td>密钥 / 连接串不在代码里</td><td>环境变量，.env 在 .gitignore</td></tr><tr><td>全程 https</td><td>Vercel 自动签发证书</td></tr><tr><td>验证每一个输入</td><td>后端白名单校验 kind、site</td></tr><tr><td>只信 token 里的身份</td><td>WHERE id=? AND user_id=?</td></tr><tr><td>CORS 只放自己的站</td><td>白名单：ielts / jlpt / localhost</td></tr><tr><td>错误信息不暴露内部细节</td><td>只回通用信息，细节写进日志</td></tr><tr><td>依赖及时更新</td><td><code>npm audit</code> 看已知漏洞</td></tr><tr><td>限流</td><td>防刷接口（可以后续加）</td></tr></table></div><ul><li>安全不是一个功能，是每一步的习惯：<b>不信前端、不存明文、不泄密钥、最小权限</b>。</li></ul><p class="one">把这八条放进每个项目的收尾检查里。</p></section></div></section><section class="panel" id="p-backend" aria-label="后端"><h2>后端</h2><p class="sec">后端怎么组织：请求流水线、分层、serverless、接口设计、日志。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>后端到底在做什么：一个请求穿过哪些关卡</h3><svg viewBox="0 0 520 178" role="img" aria-label="中间件管线"><g class="wob"><rect class="s fb" x="10" y="40" width="70" height="60" rx="9"/><rect class="s fy" x="105" y="40" width="80" height="60" rx="9"/><rect class="s fy" x="205" y="40" width="80" height="60" rx="9"/><rect class="s fg" x="305" y="40" width="80" height="60" rx="9"/><rect class="s fp" x="405" y="40" width="100" height="60" rx="9"/><path class="s" d="M82 70 L103 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M187 70 L203 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M287 70 L303 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M387 70 L403 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M455 102 Q330 150 200 130" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="45" y="66" text-anchor="middle" class="zh" style="font-size:12.0px">请求</text><text x="45" y="82" text-anchor="middle" class="zh" style="font-size:11.0px">进来</text><text x="145" y="62" text-anchor="middle" class="zh" style="font-size:12.0px">CORS</text><text x="145" y="78" text-anchor="middle" class="zh" style="font-size:10.5px">中间件</text><text x="245" y="62" text-anchor="middle" class="zh" style="font-size:11.0px">解析 JSON</text><text x="245" y="78" text-anchor="middle" class="zh" style="font-size:10.5px">中间件</text><text x="345" y="62" text-anchor="middle" class="zh" style="font-size:11.0px">验证 token</text><text x="345" y="78" text-anchor="middle" class="zh" style="font-size:10.5px">中间件</text><text x="455" y="60" text-anchor="middle" class="zh" style="font-size:12.0px">路由处理</text><text x="455" y="76" text-anchor="middle" class="zh" style="font-size:10.5px">查库、写库</text><text x="455" y="90" text-anchor="middle" class="zh" style="font-size:10.5px">返回响应</text><text x="10" y="26" class="cap">Express：请求依次通过一串“中间件”，每一个检查或加工，最后到路由处理函数</text><text x="10" y="168" class="cap">任何一关出错就直接返回错误（如 token 无效 → 401），后面的关卡不再执行</text></svg><ul><li><b>路由</b>：“什么方法 + 什么路径 → 执行哪段代码”。如 <code>POST /favorites</code> 对应“新增收藏”。</li><li><b>中间件</b>：夹在请求和处理函数之间的小关卡，共同点是能读写 <code>req</code>/<code>res</code>，最后调用 <code>next()</code> 放行。常见：CORS、解析 JSON 体、验 token、日志。</li><li><b>统一的好处</b>：验 token 只写一次，所有需要登录的路由都套上它。</li><li><b>统一的错误出口</b>：任何地方抛错，都由最后一个“错误处理中间件”转成规整的 JSON 响应，不让内部细节漏给用户。</li></ul><p class="one">请求像过安检：一道一道关，错了就拦下。</p></section><section class="card"><h3><span class="n">2</span>后端分层：每层只管一件事</h3><svg viewBox="0 0 640 272" role="img" aria-label="分层：路由 routes / 校验 / 业务 / 数据访问 / 数据库"><g class="wob"><rect class="s fb" x="10" y="8" width="347.2" height="52" rx="9"/><rect class="s fy" x="10" y="68" width="347.2" height="52" rx="9"/><rect class="s fg" x="10" y="128" width="347.2" height="52" rx="9"/><rect class="s fp" x="10" y="188" width="347.2" height="52" rx="9"/></g><text x="183.6" y="30" text-anchor="middle" class="zh" style="font-size:13.5px">路由 routes</text><text x="183.6" y="48" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">接请求、读参数、回响应</text><path class="s" d="M361.2 34 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="38.0" text-anchor="start" class="zh" style="font-size:11.5px">favorites.ts：哪个网址对应哪段逻辑</text><text x="183.6" y="90" text-anchor="middle" class="zh" style="font-size:13.5px">校验 / 业务</text><text x="183.6" y="108" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">规则：kind 是否合法、能否重复</text><path class="s" d="M361.2 94 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="98.0" text-anchor="start" class="zh" style="font-size:11.5px">白名单 KINDS、去重</text><text x="183.6" y="150" text-anchor="middle" class="zh" style="font-size:13.5px">数据访问</text><text x="183.6" y="168" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">用 ORM 读写表</text><path class="s" d="M361.2 154 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="158.0" text-anchor="start" class="zh" style="font-size:11.5px">Drizzle 的 insert / select</text><text x="183.6" y="210" text-anchor="middle" class="zh" style="font-size:13.5px">数据库</text><text x="183.6" y="228" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">真正存数据</text><path class="s" d="M361.2 214 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="218.0" text-anchor="start" class="zh" style="font-size:11.5px">Neon PostgreSQL</text><text x="10" y="266" class="cap">上层调用下层，下层不知道上层是谁：改数据库不用动路由</text></svg><ul><li>分层让代码好读、好测、好改。比如“收藏的规则变了”只动业务层，不用碰网址和数据库。</li><li>我们的测试（23 个）就是模拟请求，检查从路由到数据库的整条链路对不对。</li></ul><p class="one">路由接客，业务定规矩，数据层存取。</p></section><section class="card full"><h3><span class="n">3</span>常驻服务器 vs Serverless</h3><div class="cmp"><div class="l"><h4>常驻服务器（传统）</h4><ul><li>一台机器一直开着，进程一直活着</li><li>内存里的变量一直在</li><li>不管有没有人用都在计费</li><li>要自己管系统、扩容</li></ul></div><div class="r"><h4>Serverless（我们的 Vercel）</h4><ul><li>有请求来才启动，没人用就休眠</li><li><b>内存不可靠</b>：下次请求可能是另一个实例，状态必须存数据库</li><li>按调用量计费，小站几乎免费</li><li>第一次请求有“冷启动”延迟</li></ul></div></div><ul><li>因此 serverless 里不要把重要数据放在变量里等下次用，<b>一切持久状态都放数据库</b>。</li><li><b>无状态</b>：每个请求自带所有需要的信息（token），后端不靠“记得你”。</li><li>数据库连接也要小心：每个实例都开连接，会把数据库的连接数用光，所以要用 Neon 的连接池（pooler 地址）。</li></ul><p class="one">serverless = 用完即走的函数；状态在数据库，不在内存。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">4</span>设计一个接口：从名字开始</h3><div class="scroll"><table class="tb"><tr><th>要做什么</th><th>方法 + 路径</th><th>成功返回</th></tr><tr><td>看我的全部收藏</td><td><code>GET /favorites</code></td><td>200 + 数组</td></tr><tr><td>加一条</td><td><code>POST /favorites</code></td><td>201 + 新记录 id</td></tr><tr><td>删一条</td><td><code>DELETE /favorites/:id</code></td><td>200 / 204</td></tr><tr><td>我是谁</td><td><code>GET /me</code></td><td>200 + 用户信息</td></tr><tr><td>用 Google 登录</td><td><code>POST /auth/google</code></td><td>200 + token</td></tr><tr><td>后端醒着吗</td><td><code>GET /health</code></td><td>200 {ok:true}</td></tr></table></div><ul><li><b>路径用名词复数，动作交给方法</b>：不要写 <code>/addFavorite</code>、<code>/deleteFavorite</code>。</li><li><b>错误也要规整</b>：{ error: "原因" } + 合适的状态码，前端才好统一处理。</li><li><b>分页</b>：数据多了不能一次全返回。offset 分页（<code>?page=2&amp;size=10</code>）简单；游标分页（“从这个 id 之后的 10 条”）更稳。我们的收藏现在是全部取回、前端分页，量大了再改后端分页。</li></ul><p class="one">接口 = 后端对外的一份“使用说明书”，名字和格式要一致。</p></section><section class="card"><h3><span class="n">5</span>日志：线上出问题怎么知道</h3><pre class="term"><span class="c"># 本地：直接看终端输出</span>
<span class="k">npm run dev</span>
[GET] /favorites 200 12ms
[POST] /favorites <span class="e">500</span>  Error: duplicate key ...

<span class="c"># 线上：Vercel 项目 → Logs，能看到每次请求和 console.log</span>
<span class="c"># 别把密码、token 打进日志</span></pre><ul><li><b>500 的原因只在后端日志里</b>，浏览器只会告诉你“500”。排查后端问题的第一步永远是看日志。</li><li><code>console.log</code> 在 serverless 里会进 Vercel Logs；写清楚是哪个接口、什么参数、什么错误。</li><li>日志里<b>不能出现</b>密码、token、完整连接串。</li></ul><p class="one">后端报错看日志，前端报错看 Console。</p></section><section class="card"><h3><span class="n">6</span>后端要“防着”的几件事</h3><div class="scroll"><table class="tb"><tr><th>情况</th><th>做法</th></tr><tr><td>前端传来乱七八糟的数据</td><td>白名单校验类型、长度，不合格返回 400</td></tr><tr><td>重复提交（连点两下）</td><td>数据库唯一约束 + 前端防连点</td></tr><tr><td>别人乱调接口</td><td>验 token、<code>WHERE user_id=?</code></td></tr><tr><td>被刷（海量请求）</td><td>限流（如每分钟 N 次）</td></tr><tr><td>数据库暂时连不上</td><td>捕获错误，返回 503，别崩</td></tr></table></div><ul><li><b>永远不要相信前端</b>。前端的校验只是为了体验，真正的校验必须在后端。</li></ul><p class="one">后端 = 最后一道防线。</p></section></div></section><section class="panel" id="p-db" aria-label="数据库"><h2>数据库</h2><p class="sec">表、SQL、JOIN、事务、迁移、连接池和备份。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>表 = 一张 Excel，几个关键词</h3><div class="scroll"><table class="tb"><tr><th>id</th><th>user_id</th><th>site</th><th>kind</th><th>word</th></tr><tr><td>41</td><td>1</td><td>ielts</td><td>w</td><td>accommodation</td></tr><tr><td>42</td><td>1</td><td>ielts</td><td>p</td><td>on the other hand</td></tr><tr><td>57</td><td>1</td><td>jlpt</td><td>g</td><td>〜に違いない</td></tr><tr><td>58</td><td>2</td><td>jlpt</td><td>w</td><td>慰める</td></tr></table></div><ul><li><b>表</b>=一类东西；<b>行</b>=一条记录；<b>列</b>=一个属性。</li><li><b>主键</b>（id）：每行独一无二的编号，能精确找到某一行。</li><li><b>外键</b>：user_id 指向用户表里的人，说明“这条属于谁”，数据库会检查这个人必须存在。</li><li><b>唯一约束</b>：(user_id, site, kind, word) 不能重复，所以重复收藏会被数据库本身拒绝，哪怕后端代码漏了检查。</li><li><b>索引</b>：像书的目录，查得更快；代价是写入略慢、占空间。常用的查询条件列要建索引。</li></ul><p class="one">数据库帮你守住规则，是最后一道防线。</p></section><section class="card"><h3><span class="n">2</span>SQL 增删改查（对应 HTTP 四个方法）</h3><pre class="term"><span class="c">-- 查</span>
<span class="k">SELECT</span> id, word <span class="k">FROM</span> favorite_word
  <span class="k">WHERE</span> user_id = 1 <span class="k">AND</span> site = 'ielts'
  <span class="k">ORDER BY</span> id <span class="k">DESC</span> <span class="k">LIMIT</span> 10 <span class="k">OFFSET</span> 0;   <span class="c">-- 分页：每页 10 条</span>

<span class="c">-- 增</span>
<span class="k">INSERT INTO</span> favorite_word (user_id, site, kind, word)
  <span class="k">VALUES</span> (1, 'ielts', 'w', 'accommodation');

<span class="c">-- 改</span>
<span class="k">UPDATE</span> favorite_word <span class="k">SET</span> kind = 'p' <span class="k">WHERE</span> id = 42;

<span class="c">-- 删</span>
<span class="k">DELETE FROM</span> favorite_word <span class="k">WHERE</span> id = 42;</pre><ul><li><b class='no'>UPDATE 和 DELETE 忘了 WHERE，会改/删整张表。</b>习惯：先写 SELECT 看会命中哪些行，没问题再改成 UPDATE。</li><li>字符串用<b>单引号</b>，关键字大小写不敏感，每条语句以分号结束。</li><li><code>COUNT(*)</code>、<code>GROUP BY</code> 用来统计，如“每种类型收藏了多少”。</li></ul><p class="one">增删改查 + WHERE，覆盖 80% 的日常。</p></section><section class="card"><h3><span class="n">3</span>JOIN：把两张表按关系拼起来</h3><svg viewBox="0 0 520 150" role="img" aria-label="JOIN"><g class="wob"><rect class="s fb" x="10" y="14" width="200" height="100" rx="9"/><rect class="s fg" x="310" y="14" width="200" height="100" rx="9"/><path class="s" d="M212 64 L308 64" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="110" y="36" text-anchor="middle" class="zh" style="font-size:13.0px">users</text><text x="110" y="56" text-anchor="middle" class="zh" style="font-size:11.0px">id | name | email</text><text x="110" y="74" text-anchor="middle" class="zh" style="font-size:11.0px">7  | Goen | g@x.com</text><text x="110" y="94" text-anchor="middle" class="cap" style="font-size:10.5px">主键 id</text><text x="410" y="36" text-anchor="middle" class="zh" style="font-size:13.0px">favorite_word</text><text x="410" y="56" text-anchor="middle" class="zh" style="font-size:11.0px">id | user_id | word</text><text x="410" y="74" text-anchor="middle" class="zh" style="font-size:11.0px">42 | 7 | accommodation</text><text x="410" y="94" text-anchor="middle" class="cap" style="font-size:10.5px">user_id 指向 users.id（外键）</text><text x="260" y="58" text-anchor="middle" class="zh" style="font-size:11.0px">对上</text><text x="10" y="138" class="cap">SELECT u.name, f.word FROM favorite_word f JOIN users u ON f.user_id = u.id;</text></svg><ul><li>数据<b>拆开存</b>（用户一张表、收藏一张表），用 id 关联；要一起看时用 JOIN 临时拼起来。</li><li>好处：改名字只改一处；不会在每条收藏里重复存用户的所有信息。</li><li>Drizzle 里也有对应的 join 写法。</li></ul><p class="one">拆表存，需要时 JOIN。</p></section></div><div class="grid"><section class="card"><h3><span class="n">4</span>事务：要么全成，要么全不成</h3><svg viewBox="0 0 640 344" role="img" aria-label="时序图：后端 / 数据库"><g class="wob"><rect class="s fg" x="16.0" y="12" width="298.0" height="40" rx="9"/><path d="M165.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="326.0" y="12" width="298.0" height="40" rx="9"/><path d="M475.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M168.0 86.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 136.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 186.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 286.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="165.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">后端</text><text x="475.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="320.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 BEGIN（开始一个事务）</text><text x="320.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 A 账户 −100</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 B 账户 +100</text><rect class="s fy" x="358.6" y="218.0" width="232.8" height="30" rx="7" style="stroke-width:1.8"/><text x="475.0" y="238" text-anchor="middle" class="zh" style="font-size:11.5px">任何一步失败 → 整个回滚，什么都没发生</text><text x="320.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 COMMIT（全部生效）</text></svg><ul><li>事务保证一组操作<b>不可分割</b>：转账扣了钱必须加上，不能只做一半。</li><li><b>ACID</b>：原子（全成或全不成）、一致（规则不被破坏）、隔离（同时进行的事务互不干扰）、持久（提交后断电也在）。</li><li>我们现在的操作都是单条语句，数据库自动当一个小事务；以后一次要改多张表时就需要显式事务。</li></ul><p class="one">多步操作要么都做，要么都不做。</p></section><section class="card"><h3><span class="n">5</span>迁移 migration：怎么改表结构</h3><svg viewBox="0 0 480 136" role="img" aria-label="改 schema → 生成迁移 → 应用到库 → 提交代码"><g class="wob"><rect class="s fb" x="10.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M112.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="130.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="250.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M352.0 55 h14" marker-end="url(#ah)"/><rect class="s fp" x="370.0" y="20" width="100.0" height="70" rx="9"/></g><g><text x="60.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">改 schema</text><text x="60.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">在代码里加一列</text></g><g><text x="180.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">生成迁移</text><text x="180.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">drizzle-kit</text></g><g><text x="300.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">应用到库</text><text x="300.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">ALTER TABLE</text></g><g><text x="420.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">提交代码</text><text x="420.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">记录变更历史</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L462,108"/></circle><text x="10" y="128" class="cap">表结构的改动也像代码一样有版本</text></svg><ul><li>线上库里已有真实数据，改表不能“删了重建”，要用 <code>ALTER TABLE</code> 一步步改。迁移文件就是这些步骤的记录。</li><li><b>先备份，再迁移；先在测试库跑，再上正式库</b>。</li><li>给已有表加新列，最好给默认值或允许为空，否则旧数据会不合规。</li></ul><p class="one">改结构要留记录，才能在任何环境里重放。</p></section><section class="card"><h3><span class="n">6</span>SQL 与 NoSQL</h3><div class="scroll"><table class="tb"><tr><th></th><th>SQL（PostgreSQL）</th><th>NoSQL（如 MongoDB）</th></tr><tr><td>结构</td><td>表 + 固定的列</td><td>文档（类似 JSON），灵活</td></tr><tr><td>关系</td><td>外键、JOIN 很强</td><td>关系弱，常把数据嵌在一起</td></tr><tr><td>一致性</td><td>事务强</td><td>按产品而定</td></tr><tr><td>适合</td><td>大多数业务：用户、订单、收藏</td><td>结构多变、海量写入</td></tr></table></div><ul><li>入门阶段选 SQL：规则明确，面试也最常问。</li></ul><p class="one">没有“更先进”，只有“更合适”。</p></section><section class="card"><h3><span class="n">7</span>连接串、连接池、备份</h3><pre class="term">DATABASE_URL=<span class="b">postgresql://用户:密码@主机/库?sslmode=require</span>

<span class="b">连接池 pooler</span>：数据库同时能接的连接数有限。
serverless 每个实例都开连接会爆，
所以用带 <span class="k">-pooler</span> 的地址，由池子复用连接。

<span class="b">备份</span>：Neon 支持分支和时间点恢复，
改线上数据前先建一个分支当备份。</pre><ul><li>连接串等同数据库钥匙：只放环境变量；泄露了立刻去 Neon 重置密码。</li><li><b>线上改数据前三步</b>：SELECT 看命中几行 → 确认 WHERE → 再 UPDATE；动作大就先备份。</li></ul><p class="one">先读后写，先小后大。</p></section></div></section><section class="panel" id="p-git" aria-label="Git 与 GitHub"><h2>Git 与 GitHub</h2><p class="sec">三个区域、分支合并、常用命令和撤销，以及“提交”到底提交了什么。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>三个区域：改动怎么变成历史</h3><svg viewBox="0 0 520 134" role="img" aria-label="git 三区"><g class="wob"><rect class="s fb" x="10" y="20" width="140" height="80" rx="10"/><rect class="s fy" x="190" y="20" width="140" height="80" rx="10"/><rect class="s fg" x="370" y="20" width="140" height="80" rx="10"/><path class="s" d="M152 50 L188 50" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M332 50 L368 50" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M368 82 L332 82" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M188 82 L152 82" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="80" y="48" text-anchor="middle" class="zh" style="font-size:13.5px">工作区</text><text x="80" y="66" text-anchor="middle" class="zh" style="font-size:10.5px">你在改的文件</text><text x="260" y="48" text-anchor="middle" class="zh" style="font-size:13.5px">暂存区</text><text x="260" y="66" text-anchor="middle" class="zh" style="font-size:10.5px">准备提交的</text><text x="440" y="48" text-anchor="middle" class="zh" style="font-size:13.5px">本地仓库</text><text x="440" y="66" text-anchor="middle" class="zh" style="font-size:10.5px">历史版本</text><text x="170" y="40" text-anchor="middle" class="zh" style="font-size:11.5px">git add</text><text x="350" y="40" text-anchor="middle" class="zh" style="font-size:11.5px">git commit</text><text x="10" y="124" class="cap">再往右：git push → GitHub（远程仓库）；git pull / clone ← 从 GitHub 取回</text></svg><ul><li><b>add</b>：挑出这次想提交的改动放进暂存区；<b>commit</b>：把暂存区存成一个带说明的版本，永久记录。</li><li><b>push</b> 把本地的版本发到 GitHub；<b>pull</b> 把 GitHub 上别人（或你另一台电脑）的新版本取下来。</li><li>提交说明写“做了什么、为什么”：<code>收藏页加分页</code> 比 <code>update</code> 有用得多。</li><li>VS Code 显示“有更改要提交”，意思就是：工作区里有改动还没 commit。</li></ul><p class="one">改 → add → commit → push，四步把代码送上线。</p></section><section class="card"><h3><span class="n">2</span>分支与合并：并行开发不打架</h3><svg viewBox="0 0 520 134" role="img" aria-label="分支合并"><path class="s" d="M20 90 H500" stroke-width="3"/><path class="s" d="M140 90 Q160 40 190 40 H320 Q350 40 370 90" fill="none" stroke-width="3"/><g class="wob"><circle class="s fb" cx="30" cy="90" r="9"/><circle class="s fb" cx="110" cy="90" r="9"/><circle class="s fy" cx="200" cy="40" r="9"/><circle class="s fy" cx="270" cy="40" r="9"/><circle class="s fy" cx="330" cy="40" r="9"/><circle class="s fb" cx="200" cy="90" r="9"/><circle class="s fg" cx="400" cy="90" r="11"/><circle class="s fb" cx="480" cy="90" r="9"/></g><text x="20" y="120" text-anchor="start" class="zh" style="font-size:12.0px">main</text><text x="200" y="20" text-anchor="middle" class="zh" style="font-size:12.0px">feature/分页（新分支）</text><text x="400" y="120" text-anchor="middle" class="zh" style="font-size:11.5px">merge 合并</text><text x="250" y="118" text-anchor="middle" class="cap" style="font-size:10.5px">main 继续前进</text></svg><ul><li><b>分支</b>是一条独立的开发线：在上面随便试，不影响 <code>main</code>。做好了再<b>合并</b>回来。</li><li><b>Vercel 通常盯着 main</b>：推到 main 就上线；推到别的分支，会得到一个预览网址，可以先看效果。</li><li><b>合并冲突</b>：两条线改了同一处，Git 不知道留谁，会在文件里标出 <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> 让你手动选，改完再提交。</li><li><b>Pull Request</b>：在 GitHub 上申请“把这个分支合进 main”，别人（或自己）可以先看改动再合并。</li></ul><p class="one">分支 = 平行世界，合并 = 把好结果带回主线。</p></section><section class="card"><h3><span class="n">3</span>常用命令一览</h3><pre class="term"><span class="k">git status</span>                 <span class="c">现在什么状态</span>
<span class="k">git diff</span>                   <span class="c">具体改了什么</span>
<span class="k">git add -A</span>                 <span class="c">全部放进暂存区</span>
<span class="k">git commit -m "说明"</span>       <span class="c">存成一个版本</span>
<span class="k">git push</span>                   <span class="c">推到 GitHub</span>
<span class="k">git pull</span>                   <span class="c">取回远程的新版本</span>
<span class="k">git log --oneline</span>          <span class="c">看历史</span>
<span class="k">git switch -c 新分支</span>        <span class="c">新建并切换分支</span>
<span class="k">git restore 文件</span>           <span class="c">丢掉某个文件的未提交改动</span>
<span class="k">git revert 版本号</span>          <span class="c">用一个新提交撤销旧提交（安全）</span></pre><ul><li><b>撤销要小心</b>：<code>git restore</code> 丢掉未提交的改动，丢了就找不回；<code>git reset --hard</code> 同样危险。<b>已推送的提交用 revert，别用 reset 改历史</b>。</li><li><code>.gitignore</code> 列出不要提交的东西：<code>node_modules</code>、<code>.env</code>、系统垃圾文件。</li><li><b>提交了密钥怎么办</b>：先去服务商那里换新密钥；删除提交记录不够，因为别人可能已经拿到。</li></ul><p class="one">先 status 看清楚，再动手。</p></section></div></section><section class="panel" id="p-frontend" aria-label="前端工程"><h2>前端工程</h2><p class="sec">Vue 怎么让页面跟着数据变、组件怎么分工、代码怎么从源码变成线上文件。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>Vue 的响应式：数据变，页面自动变</h3><svg viewBox="0 0 680 294" role="img" aria-label="时序图：你的代码 / Vue 响应式 / 渲染 / 页面"><g class="wob"><rect class="s fb" x="16.0" y="12" width="153.0" height="40" rx="9"/><path d="M92.5 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="181.0" y="12" width="153.0" height="40" rx="9"/><path d="M257.5 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="346.0" y="12" width="153.0" height="40" rx="9"/><path d="M422.5 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="511.0" y="12" width="153.0" height="40" rx="9"/><path d="M587.5 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M95.5 86.0 H252.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M260.5 186.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M425.5 236.0 H582.5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="92.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你的代码</text><text x="92.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">favs.value = [...]</text><text x="257.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Vue 响应式</text><text x="257.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">Proxy 监听</text><text x="422.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">渲染</text><text x="422.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">虚拟 DOM 对比</text><text x="587.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">页面</text><text x="587.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">真实 DOM</text><text x="175.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 给 ref 赋新值</text><rect class="s fy" x="179.5" y="118.0" width="156.0" height="30" rx="7" style="stroke-width:1.8"/><text x="257.5" y="138" text-anchor="middle" class="zh" style="font-size:11.5px">发现：用到它的地方要更新</text><text x="340.0" y="178" text-anchor="middle" class="zh" style="font-size:9.5px">3 重新执行模板，生成新的虚拟 DOM</text><text x="505.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 对比新旧，只改变化的几处</text><text x="505.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">高效：不整页重画</text></svg><ul><li><code>ref()</code> / <code>reactive()</code> 包装的数据，被读取时 Vue 记下“谁在用我”；被修改时通知这些使用者重新计算。</li><li><code>computed</code> 是<b>由别的数据算出来的数据</b>，依赖不变就用缓存。收藏页的 <code>pagedFav</code> 就是 <code>favList</code> 切一页出来。</li><li><code>watch</code> 在某个数据变化时做一件事（比如换了标签就回第一页）。</li><li><b>数据驱动</b>：你只管改数据，页面自己跟着变，不用手动操作 DOM。</li></ul><p class="one">你改数据，Vue 改页面。</p></section><section class="card"><h3><span class="n">2</span>组件通信：props 往下，事件往上</h3><svg viewBox="0 0 520 150" role="img" aria-label="props emit"><g class="wob"><rect class="s fb" x="150" y="12" width="220" height="40" rx="9"/><rect class="s fg" x="150" y="100" width="220" height="40" rx="9"/><path class="s" d="M230 54 L230 98" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M290 98 L290 54" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="260" y="38" text-anchor="middle" class="zh" style="font-size:12.5px">父组件（拥有数据）</text><text x="260" y="126" text-anchor="middle" class="zh" style="font-size:12.5px">子组件（只负责显示）</text><text x="176" y="80" text-anchor="end" class="zh" style="font-size:11.0px">props 传数据</text><text x="304" y="80" text-anchor="start" class="zh" style="font-size:11.0px">emit 事件通知</text></svg><ul><li>数据<b>单向流动</b>：父传给子，子不直接改，而是“喊一声”（emit），由父决定怎么改。这样出了问题只用查一个地方。</li><li>跨很多层的共享数据（如登录状态）放在<b>全局状态</b>（Pinia）里。</li></ul><p class="one">数据向下流，事件向上喊。</p></section><section class="card full"><h3><span class="n">3</span>模块化与构建：从源码到上线文件</h3><svg viewBox="0 0 480 136" role="img" aria-label="源码 → Vite 构建 → dist → 部署"><g class="wob"><rect class="s fb" x="10.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M112.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="130.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="250.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M352.0 55 h14" marker-end="url(#ah)"/><rect class="s fp" x="370.0" y="20" width="100.0" height="70" rx="9"/></g><g><text x="60.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">源码</text><text x="60.0" y="64" text-anchor="middle" class="zh" style="font-size:8.9px" fill-opacity=".85">TS / Vue / 很多文件</text></g><g><text x="180.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">Vite 构建</text><text x="180.0" y="64" text-anchor="middle" class="zh" style="font-size:9.6px" fill-opacity=".85">编译 + 打包 + 压缩</text></g><g><text x="300.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">dist</text><text x="300.0" y="64" text-anchor="middle" class="zh" style="font-size:8.2px" fill-opacity=".85">少量 JS / CSS / HTML</text></g><g><text x="420.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">部署</text><text x="420.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">放到 Vercel</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L462,108"/></circle><text x="10" y="128" class="cap">浏览器只认 HTML / CSS / JS，其余都要先被翻译</text></svg><ul><li><code>import / export</code> 把代码拆成小文件。<b>打包</b>把它们合成少量文件，减少请求数。</li><li>TypeScript 浏览器不认识，构建时被编译成普通 JS；类型检查只发生在写代码和构建时。</li><li><code>package.json</code> 记录依赖和脚本（<code>npm run build</code>）；<code>package-lock.json</code> 锁死具体版本，保证每台机器装的一样。</li><li>我们的两个学习站是<b>单个 index.html</b>，没有构建这一步，所以简单，但文件很大；项目变大后应迁到 Vite。</li></ul><p class="one">构建 = 把方便人写的代码，翻译成方便浏览器跑的代码。</p></section><section class="card"><h3><span class="n">4</span>前端“发请求”的标准写法</h3><pre class="term"><span class="k">const</span> authFetch = <span class="k">async</span> (path, opt = {}) =&gt; {
  <span class="k">const</span> r = <span class="k">await</span> fetch(API + path, {
    ...opt,
    headers: {
      <span class="b">"Content-Type"</span>: <span class="b">"application/json"</span>,
      <span class="b">Authorization</span>: <span class="b">"Bearer " + token</span>,   <span class="c">// 身份放头里</span>
    },
  });
  <span class="k">if</span> (r.status === 401) { <span class="c">/* 过期：清 token、重新登录 */</span> }
  <span class="k">return</span> r;                                 <span class="c">// 调用方自己看 r.ok</span>
};</pre><ul><li><b>封装一次，到处用</b>：把“加 token、处理 401”集中在一个函数里。</li><li><b>乐观更新</b>：先改页面再等后端，失败再改回来并提示。体验更快。<b>防连点</b>：用一个标记记着“这条正在处理”。</li></ul><p class="one">重复的事封装成函数，错误统一处理。</p></section></div></section><section class="panel" id="p-deploy" aria-label="部署与运维"><h2>部署与运维</h2><p class="sec">push 之后到用户看到之间发生的事、域名怎么指过去、环境差异、Docker、监控。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>push 之后，发生了什么</h3><svg viewBox="0 0 680 412" role="img" aria-label="时序图：你 / GitHub / Vercel / 用户"><g class="wob"><rect class="s fb" x="16.0" y="12" width="153.0" height="40" rx="9"/><path d="M92.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="181.0" y="12" width="153.0" height="40" rx="9"/><path d="M257.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="346.0" y="12" width="153.0" height="40" rx="9"/><path d="M422.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="511.0" y="12" width="153.0" height="40" rx="9"/><path d="M587.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M95.5 86.0 H252.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M260.5 136.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M419.5 186.0 H262.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M425.5 286.0 H582.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M584.5 336.0 H427.5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="92.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你</text><text x="92.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">git push</text><text x="257.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">GitHub</text><text x="422.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Vercel</text><text x="422.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">构建服务器</text><text x="587.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">用户</text><text x="587.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">浏览器</text><text x="175.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 推送新提交到 main</text><text x="340.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 Webhook：有新提交了</text><text x="340.0" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">Vercel 一直在盯着仓库</text><text x="340.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 拉取最新代码</text><rect class="s fy" x="350.2" y="218.0" width="144.5" height="30" rx="7" style="stroke-width:1.8"/><text x="422.5" y="238" text-anchor="middle" class="zh" style="font-size:11.5px">安装依赖、构建、跑检查</text><text x="505.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 新版本部署到全球边缘</text><text x="505.0" y="301" text-anchor="middle" class="cap" style="font-size:9.5px">旧版在新版就绪前一直服务，不中断</text><text x="505.0" y="328" text-anchor="middle" class="zh" style="font-size:11.0px">6 刷新后看到新版（若没缓存）</text><text x="10" y="406" class="cap">这条流水线叫 CI/CD：持续集成 + 持续部署</text></svg><ul><li>你只管 <code>git push</code>，剩下的全自动。如果构建失败，线上<b>仍然是旧版本</b>，不会坏。</li><li><b>回滚</b>：Vercel 的 Deployments 里可以一键切回之前的版本，出了问题先回滚，再慢慢查。</li><li><b>预览部署</b>：推到非 main 分支，会生成独立预览网址，先看再合并。</li></ul><p class="one">git push 就是“上线”按钮。</p></section><section class="card"><h3><span class="n">2</span>三种环境</h3><div class="scroll"><table class="tb"><tr><th></th><th>开发 dev</th><th>预览 / 测试</th><th>生产 prod</th></tr><tr><td>在哪</td><td>你的电脑 localhost</td><td>Vercel 预览网址</td><td>真正的域名</td></tr><tr><td>数据库</td><td>测试库</td><td>测试库</td><td><b>真实用户数据</b></td></tr><tr><td>密钥</td><td>本地 .env</td><td>Vercel（预览）</td><td>Vercel（生产）</td></tr><tr><td>出错后果</td><td>只有自己</td><td>只有自己和测试</td><td><b>用户都看到</b></td></tr></table></div><ul><li>“本地好使，线上不行”最常见原因：①线上环境变量没配；②新域名没加进 CORS 白名单；③浏览器缓存了旧版；④本地和线上数据库不是同一个。</li><li><b>任何会改数据的操作，先在测试环境跑一次。</b></li></ul><p class="one">同一份代码，不同环境，配置不同。</p></section><section class="card full"><h3><span class="n">3</span>域名从买到访问的全过程</h3><svg viewBox="0 0 680 394" role="img" aria-label="时序图：你 / 域名商 / Cloudflare / Vercel"><g class="wob"><rect class="s fb" x="16.0" y="12" width="153.0" height="40" rx="9"/><path d="M92.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="181.0" y="12" width="153.0" height="40" rx="9"/><path d="M257.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="346.0" y="12" width="153.0" height="40" rx="9"/><path d="M422.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="511.0" y="12" width="153.0" height="40" rx="9"/><path d="M587.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M95.5 86.0 H252.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M95.5 136.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M95.5 186.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M95.5 236.0 H582.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M425.5 336.0 H582.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="92.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你</text><text x="257.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">域名商</text><text x="257.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">买域名</text><text x="422.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Cloudflare</text><text x="422.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">DNS 管理</text><text x="587.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Vercel</text><text x="587.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">托管网站</text><text x="175.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 买 goenkon.com</text><text x="257.5" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 把域名的 DNS 交给 Cloudflare</text><text x="257.5" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">在域名商那里改 nameserver</text><text x="257.5" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 加记录：jlpt → CNAME → cname.vercel-dns.com</text><text x="340.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 在 Vercel 项目里添加域名 jlpt.goenkon.com</text><rect class="s fy" x="484.4" y="268.0" width="189.6" height="30" rx="7" style="stroke-width:1.8"/><text x="579.2" y="288" text-anchor="middle" class="zh" style="font-size:11.5px">验证归属、自动申请 https 证书</text><text x="505.0" y="328" text-anchor="middle" class="zh" style="font-size:8.0px">6 之后用户访问该域名 → DNS 指到 Vercel</text></svg><ul><li><b>CNAME</b>是“别名”：jlpt.goenkon.com 是 cname.vercel-dns.com 的别名，Vercel 那边的真实 IP 变了也不用你管。</li><li>Cloudflare 里的小云朵：<b>橙色</b>是走 Cloudflare 代理（可缓存、防护），<b>灰色</b>只做 DNS。对接 Vercel 时多用灰色（仅 DNS），以免证书和缓存互相打架。</li><li>新加的记录要等 DNS 缓存（TTL）过期才全球生效，可能几分钟到几小时。</li><li>网站没显示新版：先看域名有没有解析到、证书有没有签发、浏览器有没有缓存。</li></ul><p class="one">买域名 → 指到托管平台 → 平台签证书，三步串起来。</p></section><section class="card"><h3><span class="n">4</span>Docker 是什么（以后会遇到）</h3><div class="cmp"><div class="l"><h4>没有 Docker</h4><ul><li>“我电脑上好使”：Node 版本、系统库、配置各不相同</li><li>新同事装环境要半天</li><li>服务器环境和本地不一样，上线出怪问题</li></ul></div><div class="r"><h4>有 Docker</h4><ul><li>把程序和它需要的环境打包成<b>镜像</b></li><li>运行起来的镜像叫<b>容器</b>，到哪里都一样</li><li>一条命令起整套环境（后端 + 数据库）</li></ul></div></div><ul><li>容器比虚拟机轻：它<b>共用宿主机的系统内核</b>，只隔离进程和文件，秒级启动。</li><li>Vercel 帮我们屏蔽了这些细节；去 AWS、公司自己的服务器时，Docker 就是常见门槛，招聘里经常出现。</li></ul><p class="one">Docker = 把“环境”一起打包带走。</p></section><section class="card"><h3><span class="n">5</span>监控与排错：线上出问题怎么发现</h3><div class="scroll"><table class="tb"><tr><th>手段</th><th>看什么</th><th>工具</th></tr><tr><td>日志</td><td>每次请求、报错</td><td>Vercel Logs</td></tr><tr><td>健康检查</td><td>后端是否活着</td><td>访问 <code>/health</code></td></tr><tr><td>错误追踪</td><td>用户那边的报错</td><td>Sentry 之类</td></tr><tr><td>访问统计</td><td>有多少人用</td><td>Vercel Analytics</td></tr><tr><td>可用性监控</td><td>挂了立刻通知</td><td>UptimeRobot</td></tr></table></div><ul><li>个人小项目至少要会看 Vercel Logs；进公司后，监控和告警是工程师的日常。</li></ul><p class="one">上线不是结束，是开始被使用。</p></section></div></section><section class="panel" id="p-debug" aria-label="排错手册"><h2>排错手册</h2><p class="sec">遇到问题时的通用思路，和一张“症状对照表”。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>排错的通用方法：沿着请求走一遍</h3><svg viewBox="0 0 520 116" role="img" aria-label="排错路径"><g class="wob"><rect class="s fb" x="10" y="18" width="92" height="56" rx="9"/><rect class="s fy" x="118" y="18" width="92" height="56" rx="9"/><rect class="s fg" x="226" y="18" width="92" height="56" rx="9"/><rect class="s fp" x="334" y="18" width="92" height="56" rx="9"/><rect class="s fr" x="442" y="18" width="68" height="56" rx="9"/><path class="s" d="M104 46 L116 46" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M212 46 L224 46" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M320 46 L332 46" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M428 46 L440 46" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="56" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">页面</text><text x="56" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">按钮有反应?</text><text x="164" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">网络</text><text x="164" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">请求发了吗?</text><text x="272" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">后端</text><text x="272" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">状态码/日志?</text><text x="380" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="380" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">数据对吗?</text><text x="476" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">返回</text><text x="476" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">渲染对?</text><text x="10" y="104" class="cap">每一站问一个问题：“到这儿了吗？对吗？”问题就缩小到两站之间</text></svg><ul><li><b>最有用的第一问</b>：请求发出去了吗？Network 里有没有？没有 = 前端逻辑问题；有 = 看状态码。</li><li><b>二分法</b>：从中间切开。后端用 curl 直接调，通了就是前端问题，不通就是后端问题。</li><li><b>最小复现</b>：把问题缩到最小的例子，常常缩小的过程中就找到原因了。</li><li><b>一次只改一处</b>：同时改三处，好了也不知道是哪一处。</li></ul><p class="one">bug 排查 = 沿着请求的旅程，一站一站问“到这儿了吗”。</p></section><section class="card full"><h3><span class="n">2</span>症状 → 先看哪 → 多半是什么</h3><div class="scroll"><table class="tb"><tr><th>你看到的</th><th>先看哪</th><th>多半是</th></tr><tr><td>页面空白</td><td>Console 红字</td><td>JS 语法错误、引用了不存在的变量</td></tr><tr><td>点了没反应</td><td>Network 有没有请求</td><td>没发请求 = 前端逻辑；有请求看状态码</td></tr><tr><td><code>401</code></td><td>token 在不在、过期没</td><td>重新登录；token 没带上</td></tr><tr><td><code>403</code></td><td>是不是越权</td><td>没有这个操作的权限</td></tr><tr><td><code>404</code></td><td>路径、方法拼对没</td><td>路径写错，或 history 路由刷新</td></tr><tr><td><code>500</code></td><td>后端日志</td><td>后端代码 / 数据库报错</td></tr><tr><td><code>blocked by CORS</code></td><td>后端白名单</td><td>新域名没加进去</td></tr><tr><td><code>EADDRINUSE</code></td><td><code>lsof -i :端口</code></td><td>端口被旧进程占着，kill 掉</td></tr><tr><td><code>command not found</code></td><td><code>which 命令</code>、PATH</td><td>没装，或装的位置不在 PATH</td></tr><tr><td>改了但页面没变</td><td>页面版本号</td><td>缓存没更新：强制刷新、无痕窗口</td></tr><tr><td>本地好、线上坏</td><td>环境变量、CORS、版本号</td><td>两个环境配置不同</td></tr><tr><td>中文变成乱码</td><td>编码</td><td>文件 / 响应不是 UTF-8</td></tr><tr><td>连点出现两条</td><td>防连点、唯一约束</td><td>没做防重复</td></tr></table></div><ul><li>遇到新报错，<b>把完整报错原文复制下来</b>搜索或发给我，别只描述“报错了”。</li></ul><p class="one">一半的问题，看对地方就解决了。</p></section></div></section>
