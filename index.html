    <span class="hl-c">//   日语站（site === "jlpt"）：完全不看前端传来的 kind，一律用 JLPT_KIND（"w"）。</span>
    <span class="hl-c">//     这样即使有人还开着旧版页面、仍然发 kind:"g"，也会被存成 "w"，不会报错，也不会再产生新的类型。</span>
    <span class="hl-c">//   英语站：和以前一样，没传就默认 "w"，传了就用传的值（下面会检查它必须是 w 或 p）。</span>
    <span class="hl-k">const</span> kind = site === <span class="hl-s">"jlpt"</span> ? <span class="hl-t">JLPT_KIND</span> : body.kind === <span class="hl-k">undefined</span> ? <span class="hl-t">DEFAULT_KIND</span> : body.kind;
    <span class="hl-c">// trim()：去掉前后空格，避免 "abc " 和 "abc" 被当成两个词。不是字符串就当作空字符串（后面会被拒绝）。</span>
    <span class="hl-k">const</span> word = <span class="hl-k">typeof</span> body.word === <span class="hl-s">"string"</span> ? body.word.trim() : <span class="hl-s">""</span>;
    <span class="hl-c">// status 没传（undefined 或 null）就用默认值 "unknown"。</span>
    <span class="hl-k">const</span> status = body.status === <span class="hl-k">undefined</span> || body.status === <span class="hl-k">null</span> ? <span class="hl-s">"unknown"</span> : body.status;

    <span class="hl-c">// 任何一项不合格，就拒绝：</span>
    <span class="hl-k">if</span> (
      !isKind(kind) || <span class="hl-c">// kind 不是 w、p 之一（日语站上面已经固定成 w，这里一定能通过）</span>
      !isSite(site) || <span class="hl-c">// site 不是合法站点</span>
      word === <span class="hl-s">""</span> || <span class="hl-c">// 词是空的</span>
      word.length &gt; <span class="hl-t">MAX_WORD_LENGTH</span> || <span class="hl-c">// 词太长</span>
      <span class="hl-k">typeof</span> status !== <span class="hl-s">"string"</span> || <span class="hl-c">// status 不是字符串</span>
      status.length &gt; <span class="hl-t">MAX_STATUS_LENGTH</span> <span class="hl-c">// status 太长</span>
    ) {
      <span class="hl-c">// 400 表示"你发来的请求有问题"。</span>
      res.status(400).json({ error: <span class="hl-s">"bad_request"</span> });
      <span class="hl-k">return</span>;
    }

    <span class="hl-c">// 【防重复】Java 版是"先查有没有，没有再存"，中间有个间隙（连点两下可能存成两条）。</span>
    <span class="hl-c">// 这里直接尝试插入，如果撞上联合唯一约束就什么都不做（onConflictDoNothing），再把已有的那条查出来返回。</span>
    <span class="hl-c">// 对应的 SQL：INSERT INTO favorite_word (user_id, site, kind, word, status) VALUES (...)</span>
    <span class="hl-c">//             ON CONFLICT DO NOTHING RETURNING id, site, kind, word, status;</span>
    <span class="hl-c">// 这个"检查+写入"是数据库一次性原子完成的，所以不管多少个请求同时到达，都不会产生重复。</span>
    <span class="hl-k">const</span> inserted = <span class="hl-k">await</span> db
      .insert(favoriteWord) <span class="hl-c">// INSERT INTO favorite_word</span>
      .values({ userId, site, kind, word, status }) <span class="hl-c">// 要插入的值（id 和 createdAt 由数据库自动填）</span>
      .onConflictDoNothing() <span class="hl-c">// 撞上唯一约束就跳过，不报错</span>
      .returning(publicColumns); <span class="hl-c">// returning：把刚插入的这一行（带上数据库分配的 id）返回给我们</span>

    <span class="hl-c">// inserted 是数组：长度 &gt; 0 说明真的插入了新行。</span>
    <span class="hl-k">if</span> (inserted.length &gt; 0) {
      res.json(inserted[0]); <span class="hl-c">// 新建成功，返回带 id 的记录</span>
      <span class="hl-k">return</span>;
    }

    <span class="hl-c">// 没插入新行：说明这个用户已经收藏过同一条。</span>
    <span class="hl-c">// 把已有的那条找出来返回（和 Java 版行为一致：连点两次，第二次直接返回已有的）。</span>
    <span class="hl-c">// 查询条件就是联合唯一约束的那四列：同一个用户、同一个站、同一种类型、同一个词。</span>
    <span class="hl-k">const</span> [existing] = <span class="hl-k">await</span> db
      .select(publicColumns)
      .<span class="hl-k">from</span>(favoriteWord)
      .where(
        and(
          eq(favoriteWord.userId, userId),
          eq(favoriteWord.site, site),
          eq(favoriteWord.kind, kind),
          eq(favoriteWord.word, word),
        ),
      )
      .limit(1);
    res.json(existing);
  });

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 删：DELETE /favorites/3</span>
  <span class="hl-c">// 对应 Java：@DeleteMapping("/favorites/{id}") delete(...)  →  findByIdAndUserId(...).ifPresent(delete)</span>
  <span class="hl-c">// 路径里的 :id 是占位符，对应 Java 的 {id}，实际的值（比如 "3"）在 req.params.id 里。</span>
  <span class="hl-c">// ==========================================================================</span>
  router.delete(<span class="hl-s">"/favorites/:id"</span>, <span class="hl-k">async</span> (req, res) =&gt; {
    <span class="hl-k">const</span> userId = getUserId(res);
    <span class="hl-c">// 路径里取到的永远是字符串，要检查并转成数字。</span>
    <span class="hl-k">const</span> id = parseId(req.params.id);
    <span class="hl-k">if</span> (id === <span class="hl-k">null</span>) {
      res.status(400).json({ error: <span class="hl-s">"bad_id"</span> });
      <span class="hl-k">return</span>;
    }

    <span class="hl-c">// 对应的 SQL：DELETE FROM favorite_word WHERE id = ? AND user_id = ?</span>
    <span class="hl-c">// 条件里带上 user_id 是安全的关键：是自己的才删得掉，别人的这条匹配不到，什么都不会发生。</span>
    <span class="hl-c">// 找不到时不报错（和 Java 版一致：安静地什么都不做）。</span>
    <span class="hl-k">await</span> db.delete(favoriteWord).where(and(eq(favoriteWord.id, id), eq(favoriteWord.userId, userId)));

    <span class="hl-c">// 204 表示"成功了，而且没有内容要返回"。前端只检查 r.ok，204 也算成功。</span>
    <span class="hl-c">// .end()：结束响应（因为没有内容要发，不用 json）。</span>
    res.status(204).end();
  });

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 改：PUT /favorites/3，请求体里带新的 word 和/或 status</span>
  <span class="hl-c">// 对应 Java：@PutMapping("/favorites/{id}") update(...)</span>
  <span class="hl-c">// ==========================================================================</span>
  router.put(<span class="hl-s">"/favorites/:id"</span>, <span class="hl-k">async</span> (req, res) =&gt; {
    <span class="hl-k">const</span> userId = getUserId(res);
    <span class="hl-k">const</span> id = parseId(req.params.id);
    <span class="hl-k">if</span> (id === <span class="hl-k">null</span>) {
      res.status(400).json({ error: <span class="hl-s">"bad_id"</span> });
      <span class="hl-k">return</span>;
    }
    <span class="hl-k">const</span> body = req.body ?? {};

    <span class="hl-c">// 只修改前端传了的字段（kind 和 site 创建后不允许改：一条收藏属于哪个站、是什么类型都固定）。</span>
    <span class="hl-c">// Java 版是把 word 和 status 都直接覆盖，前端只传一个时另一个会被改成 null；这里只改传了的，更稳。</span>
    <span class="hl-c">// "word?: string" 里的 ? 表示"这个字段可选，可以没有"。</span>
    <span class="hl-k">const</span> changes: { word?: string; status?: string } = {};

    <span class="hl-c">// 传了 word：检查并整理，通过才记进 changes。</span>
    <span class="hl-k">if</span> (body.word !== <span class="hl-k">undefined</span>) {
      <span class="hl-k">const</span> word = <span class="hl-k">typeof</span> body.word === <span class="hl-s">"string"</span> ? body.word.trim() : <span class="hl-s">""</span>;
      <span class="hl-k">if</span> (word === <span class="hl-s">""</span> || word.length &gt; <span class="hl-t">MAX_WORD_LENGTH</span>) {
        res.status(400).json({ error: <span class="hl-s">"bad_request"</span> });
        <span class="hl-k">return</span>;
      }
      changes.word = word;
    }
    <span class="hl-c">// 传了 status：同样检查。</span>
    <span class="hl-k">if</span> (body.status !== <span class="hl-k">undefined</span>) {
      <span class="hl-k">if</span> (<span class="hl-k">typeof</span> body.status !== <span class="hl-s">"string"</span> || body.status.length &gt; <span class="hl-t">MAX_STATUS_LENGTH</span>) {
        res.status(400).json({ error: <span class="hl-s">"bad_request"</span> });
        <span class="hl-k">return</span>;
      }
      changes.status = body.status;
    }
    <span class="hl-c">// Object.keys(changes)：changes 里有几个字段。一个都没有，说明前端什么都没要改，直接拒绝。</span>
    <span class="hl-k">if</span> (<span class="hl-t">Object</span>.keys(changes).length === 0) {
      res.status(400).json({ error: <span class="hl-s">"nothing_to_update"</span> });
      <span class="hl-k">return</span>;
    }

    <span class="hl-c">// 下面的数据库操作可能因为"撞唯一约束"而失败，所以用 try...catch 接住。</span>
    <span class="hl-k">try</span> {
      <span class="hl-c">// 对应的 SQL：UPDATE favorite_word SET word = ?, status = ? WHERE id = ? AND user_id = ?</span>
      <span class="hl-c">//             RETURNING id, site, kind, word, status</span>
      <span class="hl-c">// 同样带 user_id 条件：别人的收藏改不了。</span>
      <span class="hl-c">//   update(表)     UPDATE favorite_word</span>
      <span class="hl-c">//   set(changes)   SET 后面的内容就是 changes 里有的字段</span>
      <span class="hl-c">//   where(...)     WHERE id = ? AND user_id = ?</span>
      <span class="hl-c">//   returning(...) 把更新后的行返回</span>
      <span class="hl-k">const</span> updated = <span class="hl-k">await</span> db
        .update(favoriteWord)
        .set(changes)
        .where(and(eq(favoriteWord.id, id), eq(favoriteWord.userId, userId)))
        .returning(publicColumns);

      <span class="hl-k">if</span> (updated.length === 0) {
        <span class="hl-c">// 找不到（编号不存在，或者是别人的）。</span>
        <span class="hl-c">// Java 版返回 null（前端看到 200 + 空内容），这里改成标准的 404 "找不到"。</span>
        <span class="hl-c">// 注意：不区分"不存在"和"是别人的"，这样攻击者没法靠回复探测"某个编号存不存在"。</span>
        res.status(404).json({ error: <span class="hl-s">"not_found"</span> });
        <span class="hl-k">return</span>;
      }
      res.json(updated[0]);
    } <span class="hl-k">catch</span> (err) {
      <span class="hl-c">// 把 word 改成"自己已经收藏过的另一条"，会撞上联合唯一约束 → 409 表示"冲突"。</span>
      <span class="hl-k">if</span> (isUniqueViolation(err)) {
        res.status(409).json({ error: <span class="hl-s">"duplicate"</span> });
        <span class="hl-k">return</span>;
      }
      <span class="hl-c">// 其他错误：重新抛出，交给 create-app.ts 里统一的错误处理（回复 500）。</span>
      <span class="hl-k">throw</span> err;
    }
  });

  <span class="hl-k">return</span> router;
}</pre>
<pre data-key="src/routes/auth.ts" data-project="node" data-path="ielts-backend-node/src/routes/auth.ts" data-lines="144"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// routes/auth.ts —— 登录接口 POST /auth/google 和 "我是谁" 接口 GET /me</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】AuthController.java（里面的 googleLogin 方法和 me 方法）</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、什么是"接口"（API / 路由）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 前端和后端之间通过 HTTP 请求通信。一个请求由"方法 + 路径"决定要干什么：</span>
<span class="hl-c">//   POST /auth/google   →  "我要用 Google 证明书登录"</span>
<span class="hl-c">//   GET  /me            →  "告诉我，我是谁"</span>
<span class="hl-c">// 方法的习惯含义：GET=读取，POST=新建/提交，PUT=修改，DELETE=删除。</span>
<span class="hl-c">// 后端要做的，就是为每一组"方法 + 路径"写一个处理函数。这就叫"路由"。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、登录流程一共四步，和 Java 版完全一样：</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   ① 把前端发来的 Google 证明书交给 verifyGoogle 去核对，不通过就 401；</span>
<span class="hl-c">//   ② 按 Google 给的唯一编号 sub 去数据库找这个用户，没有就新建</span>
<span class="hl-c">//      （所以"注册"和"登录"是同一个流程，用户不需要单独注册）；</span>
<span class="hl-c">//   ③ 用我们自己数据库里的用户编号，发一张我们自己的 token</span>
<span class="hl-c">//      （Google 的证明书到此用完，之后前端只用我们的 token）；</span>
<span class="hl-c">//   ④ 返回 token 和用户信息。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// eq：Drizzle 提供的"等于"条件，用在 where 里。eq(列, 值) 对应 SQL 的 列 = 值。</span>
<span class="hl-k">import</span> { eq } <span class="hl-k">from</span> <span class="hl-s">"drizzle-orm"</span>;
<span class="hl-c">// Router：Express 提供的"小路由表"，用来把一组相关的接口放在一起。</span>
<span class="hl-k">import</span> { <span class="hl-t">Router</span> } <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-c">// RequestHandler：Express 里"处理请求的函数"的类型（只用于类型检查）。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">RequestHandler</span> } <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-c">// getUserId：从门卫放进去的口袋里取出用户编号（见 middleware.ts）。</span>
<span class="hl-k">import</span> { getUserId } <span class="hl-k">from</span> <span class="hl-s">"../auth/middleware.js"</span>;
<span class="hl-c">// appUser：用户表的描述（见 schema.ts）。</span>
<span class="hl-k">import</span> { appUser } <span class="hl-k">from</span> <span class="hl-s">"../db/schema.js"</span>;
<span class="hl-c">// AppUserRow：用户表"一行"的类型。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">AppUserRow</span> } <span class="hl-k">from</span> <span class="hl-s">"../db/schema.js"</span>;
<span class="hl-c">// Deps：零件清单的类型（见 deps.ts）。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">Deps</span> } <span class="hl-k">from</span> <span class="hl-s">"../deps.js"</span>;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// toView：把数据库里的用户行（带所有字段）转成"给前端看的版本"（只带需要的字段）。</span>
<span class="hl-c">// 对应 Java 的 toView 和 record UserView。</span>
<span class="hl-c">// googleSub 等内部信息不给出去：返回给前端的东西越少越安全。</span>
<span class="hl-c">// 把"转换"单独写成函数，是为了登录和 /me 两处不重复写。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">function</span> toView(u: <span class="hl-t">AppUserRow</span>) {
  <span class="hl-k">return</span> { id: u.id, email: u.email, name: u.name, picture: u.picture };
}

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// authRoutes：创建"登录相关"的小路由表。</span>
<span class="hl-c">// 参数 deps：需要的零件（数据库、token 工具、Google 核对函数）。</span>
<span class="hl-c">// 参数 requireAuth：门卫，由外面递进来（见 create-app.ts）。这里的 /me 接口要用它。</span>
<span class="hl-c">// 返回 Router，由 create-app.ts 用 app.use(...) 挂到主程序上。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> authRoutes(deps: <span class="hl-t">Deps</span>, requireAuth: <span class="hl-t">RequestHandler</span>): <span class="hl-t">Router</span> {
  <span class="hl-c">// Router()：创建一个空的小路由表，后面往里面登记接口。</span>
  <span class="hl-c">// 对应 Java 里一个 @RestController 类。</span>
  <span class="hl-k">const</span> router = <span class="hl-t">Router</span>();

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// POST /auth/google —— 登录</span>
  <span class="hl-c">// 对应 Java：@PostMapping("/auth/google")</span>
  <span class="hl-c">// router.post(路径, 处理函数)：登记"方法是 POST、路径是 /auth/google"的处理函数。</span>
  <span class="hl-c">// 处理函数的参数 (req, res)：req 是这次收到的请求，res 是用来回复的对象。</span>
  <span class="hl-c">// 对应 Java 里 Spring 帮你从请求里取出参数传进方法；这里自己从 req 里取。</span>
  <span class="hl-c">// async：函数里要用 await 等待数据库，所以声明为异步函数。</span>
  <span class="hl-c">// ==========================================================================</span>
  router.post(<span class="hl-s">"/auth/google"</span>, <span class="hl-k">async</span> (req, res) =&gt; {
    <span class="hl-c">// 请求体 JSON：{"idToken":"..."}。express.json() 中间件已经把它解析成了 req.body 对象。</span>
    <span class="hl-c">// 前端没带请求体时 req.body 是 undefined，所以用 ?.（可选链）安全地取：</span>
    <span class="hl-c">//   req.body?.idToken：req.body 存在就取它的 idToken，不存在就得到 undefined，不会报错。</span>
    <span class="hl-c">// typeof ... === "string"：确认它真的是字符串（前端可能乱传数字、对象），不是就用空字符串代替。</span>
    <span class="hl-c">// 对应 Java：@RequestBody GoogleLoginRequest body（前端乱传的多余字段会被丢掉，这里同样只取 idToken）。</span>
    <span class="hl-k">const</span> idToken = <span class="hl-k">typeof</span> req.body?.idToken === <span class="hl-s">"string"</span> ? req.body.idToken : <span class="hl-s">""</span>;

    <span class="hl-c">// ① 核对证明书。通过返回用户资料 g，不通过返回 null。</span>
    <span class="hl-c">// await：这一步要联网问 Google（可能要几百毫秒），等它完成再继续；等待期间 Node.js 可以处理别的请求。</span>
    <span class="hl-k">const</span> g = <span class="hl-k">await</span> deps.verifyGoogle(idToken);
    <span class="hl-k">if</span> (g === <span class="hl-k">null</span>) {
      <span class="hl-c">// 401 表示"你没有通过身份验证"。内容和 Java 版一样：{"error":"invalid_google_token"}</span>
      <span class="hl-c">// 回复之后必须 return，否则下面的代码还会继续执行（对同一个请求回复两次会报错）。</span>
      res.status(401).json({ error: <span class="hl-s">"invalid_google_token"</span> });
      <span class="hl-k">return</span>;
    }

    <span class="hl-c">// ② 找或建用户。</span>
    <span class="hl-c">// Java 版写法："先查，没有再 save"。查和写之间有一个间隙：同一个人第一次登录时如果点了两下，</span>
    <span class="hl-c">// 两个请求可能都查到"没有"，然后都去插入，第二个会撞上 google_sub 的唯一约束而报错。</span>
    <span class="hl-c">// 这叫"竞态条件"：两个并发的操作，结果取决于谁先谁后。</span>
    <span class="hl-c">// 这里改成"先尝试插入，如果 google_sub 已经存在就什么都不做"，然后再查出来。</span>
    <span class="hl-c">// 这样不管并发多少个请求，结果都一样：最终只有一行，大家拿到的都是同一个用户。</span>
    <span class="hl-c">// 对应的 SQL：INSERT INTO app_user (...) VALUES (...) ON CONFLICT (google_sub) DO NOTHING;</span>
    <span class="hl-c">//            SELECT * FROM app_user WHERE google_sub = ? LIMIT 1;</span>
    <span class="hl-k">await</span> deps.db
      .insert(appUser) <span class="hl-c">// INSERT INTO app_user</span>
      .values({ googleSub: g.sub, email: g.email, name: g.name, picture: g.picture }) <span class="hl-c">// 要插入的值。id 和 createdAt 由数据库自动填</span>
      .onConflictDoNothing({ target: appUser.googleSub }); <span class="hl-c">// ON CONFLICT (google_sub) DO NOTHING：撞上唯一约束就跳过</span>

    <span class="hl-c">// 查询：</span>
    <span class="hl-c">//   select()：SELECT *（所有列）；</span>
    <span class="hl-c">//   from(appUser)：FROM app_user；</span>
    <span class="hl-c">//   where(eq(appUser.googleSub, g.sub))：WHERE google_sub = ?（参数会被安全地"参数化"，不会被注入）；</span>
    <span class="hl-c">//   limit(1)：最多一行。</span>
    <span class="hl-c">// 返回的是数组，用 [user] 把第一个元素取出来（数组解构）。</span>
    <span class="hl-k">const</span> [user] = <span class="hl-k">await</span> deps.db.select().<span class="hl-k">from</span>(appUser).where(eq(appUser.googleSub, g.sub)).limit(1);
    <span class="hl-k">if</span> (!user) {
      <span class="hl-c">// 理论上不会发生（刚插入或本来就存在）。万一发生，抛异常，由 create-app.ts 里的错误处理中间件回复 500。</span>
      <span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">Error</span>(<span class="hl-s">"登录后找不到用户，数据库状态异常"</span>);
    }

    <span class="hl-c">// ③ 用我们自己系统里的用户编号发 token。</span>
    <span class="hl-c">// 注意这里用的是 user.id（我们数据库的编号），不是 Google 的 sub。</span>
    <span class="hl-c">// 这样以后就算换掉 Google 登录，我们自己系统里的身份体系也不用动。</span>
    <span class="hl-k">const</span> token = <span class="hl-k">await</span> deps.jwt.create(user.id);

    <span class="hl-c">// ④ 返回 200 + token 和用户信息，对象会被自动转成 JSON 文字。</span>
    <span class="hl-c">// 形状和 Java 版 LoginResponse 一样：{"token":"...","user":{...}}</span>
    res.json({ token, user: toView(user) });
  });

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// GET /me —— "我是谁"</span>
  <span class="hl-c">// 对应 Java：@GetMapping("/me")</span>
  <span class="hl-c">// 前端每次打开页面，会带着存好的 token 来问一次"我现在是谁"，用来恢复登录状态。</span>
  <span class="hl-c">// Java 版的 /me 在方法内部自己验 token；这里直接复用门卫 requireAuth（效果相同：不合格就 401），代码更短。</span>
  <span class="hl-c">// router.get(路径, 门卫, 处理函数)：请求先过 requireAuth，放行了才会执行最后的处理函数。</span>
  <span class="hl-c">// ==========================================================================</span>
  router.get(<span class="hl-s">"/me"</span>, requireAuth, <span class="hl-k">async</span> (req, res) =&gt; {
    <span class="hl-c">// 这里已经通过了门卫，userId 一定可信（来自验证过的 token，不是前端随便传的）。</span>
    <span class="hl-k">const</span> userId = getUserId(res);
    <span class="hl-c">// SELECT * FROM app_user WHERE id = ? LIMIT 1</span>
    <span class="hl-k">const</span> [user] = <span class="hl-k">await</span> deps.db.select().<span class="hl-k">from</span>(appUser).where(eq(appUser.id, userId)).limit(1);
    <span class="hl-k">if</span> (!user) {
      <span class="hl-c">// token 是真的，但用户后来被删除了：也要当成没登录。</span>
      res.status(401).json({ error: <span class="hl-s">"unauthorized"</span> });
      <span class="hl-k">return</span>;
    }
    res.json(toView(user));
  });

  <span class="hl-c">// 把登记好接口的小路由表交出去，由 create-app.ts 挂到主程序上。</span>
  <span class="hl-k">return</span> router;
}</pre>
<pre data-key="src/auth/google.ts" data-project="node" data-path="ielts-backend-node/src/auth/google.ts" data-lines="105"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// google.ts —— 向 Google 核对登录证明书</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】GoogleTokenVerifier.java</span>
<span class="hl-c">//   （Java 用 Google 官方的 google-api-client；这里用 Google 官方的 Node.js 版 google-auth-library）</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、"用 Google 登录"到底发生了什么</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   1. 用户在前端点"用 Google 登录"，弹出 Google 自己的登录窗口。用户在 Google 的页面上输入密码——</span>
<span class="hl-c">//      我们的网站和后端从头到尾都碰不到用户的 Google 密码。</span>
<span class="hl-c">//   2. 登录成功后，Google 给前端一张"证明书"，叫 idToken（一段很长的字符串，格式是 JWT）。</span>
<span class="hl-c">//      内容大意是："我 Google 证明：这个人是 xxx@gmail.com，是发给 yyy 这个网站（Client ID）的。"</span>
<span class="hl-c">//      证明书上有 Google 用自己的私钥盖的"签名"。</span>
<span class="hl-c">//   3. 前端把这张证明书发给我们后端。</span>
<span class="hl-c">//   4. 后端不能直接相信它：任何人都可以随手编一段文字发过来冒充。所以必须核对，通过才算数。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、核对四件事（google-auth-library 会替我们做①②③，我们自己做④）</span>
<span class="hl-c">//   ① 签名是不是 Google 签的：库会自动下载 Google 公开的"公钥"来验证。</span>
<span class="hl-c">//      （非对称加密：Google 用私钥签名，任何人都可以用公钥验证"这确实是私钥的主人签的"，但没法伪造。）</span>
<span class="hl-c">//   ② 是不是"发给我们网站"的：证明书里的 aud（audience，受众）必须等于我们的 Client ID。</span>
<span class="hl-c">//      否则别的网站拿到的证明书，也能拿来登录我们的网站。</span>
<span class="hl-c">//   ③ 有没有过期：证明书里有 exp（过期时间）。</span>
<span class="hl-c">//   ④ 邮箱是不是 Google 验证过的：email_verified 必须为 true。</span>
<span class="hl-c">// 全部通过，才算"这个人确实是这个 Google 账号"。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// OAuth2Client：Google 官方库里的工具类，里面有核对证明书的方法，也会缓存 Google 的公钥。</span>
<span class="hl-k">import</span> { <span class="hl-t">OAuth2Client</span> } <span class="hl-k">from</span> <span class="hl-s">"google-auth-library"</span>;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// GoogleUser：核对通过后，从证明书里取出的用户信息。</span>
<span class="hl-c">// 对应 Java 里嵌套的 record GoogleUser。</span>
<span class="hl-c">// export：让别的文件能用这个类型（比如测试里要造假的用户）。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">interface</span> <span class="hl-t">GoogleUser</span> {
  sub: string; <span class="hl-c">// Google 给这个账号的唯一编号（subject），永远不变，我们用它识别"同一个人"</span>
  email: string | <span class="hl-k">null</span>; <span class="hl-c">// 邮箱。"string | null" 表示可能没有（null）</span>
  name: string | <span class="hl-k">null</span>; <span class="hl-c">// 显示名字</span>
  picture: string | <span class="hl-k">null</span>; <span class="hl-c">// 头像图片地址</span>
}

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// VerifyGoogle：核对函数的"形状"（函数类型）。</span>
<span class="hl-c">// 读法：一个函数，接收 idToken（字符串），返回一个 Promise（"承诺"，将来会得到结果的东西），</span>
<span class="hl-c">//       结果是 GoogleUser（通过）或 null（不通过）。</span>
<span class="hl-c">// 【Promise 是什么】异步操作（比如联网）不会立刻有结果，JavaScript 用 Promise 代表"将来会有的结果"。</span>
<span class="hl-c">// 用 await 可以"等它有结果"；有 await 的函数必须声明为 async，它的返回值自动被包成 Promise。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 把它单独定义成一个类型，是为了测试时可以换成"假的核对函数"（不用真的去连 Google），</span>
<span class="hl-c">// 就像 Java 里可以用测试替身代替真实的 GoogleTokenVerifier。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">type</span> <span class="hl-t">VerifyGoogle</span> = (idToken: string) =&gt; <span class="hl-t">Promise</span>&lt;<span class="hl-t">GoogleUser</span> | <span class="hl-k">null</span>&gt;;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// createGoogleVerifier：创建真正向 Google 核对的函数。</span>
<span class="hl-c">// 参数 clientId：我们自己的 Google Client ID（Google 控制台里创建的，前端也在用同一个）。</span>
<span class="hl-c">// 返回值：一个 VerifyGoogle 函数。</span>
<span class="hl-c">// 【闭包】返回的那个函数"记住"了外面的 clientId 和 client。即使 createGoogleVerifier 已经执行完，</span>
<span class="hl-c">// 返回的函数里仍然能用它们。这和 Java 里"对象的成员变量"起的作用类似。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> createGoogleVerifier(clientId: string): <span class="hl-t">VerifyGoogle</span> {
  <span class="hl-c">// 创建一个 OAuth2Client。放在外层（只创建一次），同一个实例处理后面所有请求，</span>
  <span class="hl-c">// 它缓存的 Google 公钥才能被反复使用，不用每次登录都重新下载。</span>
  <span class="hl-k">const</span> client = <span class="hl-k">new</span> <span class="hl-t">OAuth2Client</span>();

  <span class="hl-c">// 返回真正的核对函数。async (idToken) =&gt; {...} 是一个"异步箭头函数"。</span>
  <span class="hl-k">return</span> <span class="hl-k">async</span> (idToken) =&gt; {
    <span class="hl-c">// 防御：前端没传，或传的不是字符串（比如数字、对象），直接判失败，不必去问 Google。</span>
    <span class="hl-c">// typeof x !== "string"：检查 x 的运行时类型。TypeScript 的类型在运行时不存在，</span>
    <span class="hl-c">// 所以对"从网络来的数据"必须这样手动检查。</span>
    <span class="hl-k">if</span> (!idToken || <span class="hl-k">typeof</span> idToken !== <span class="hl-s">"string"</span>) <span class="hl-k">return</span> <span class="hl-k">null</span>;

    <span class="hl-k">try</span> {
      <span class="hl-c">// 这一行里，库会依次：下载并缓存 Google 的公钥 → 验签名 → 检查 aud、iss（签发者）、exp。</span>
      <span class="hl-c">// audience: clientId 就是上面的 ②：只接受发给我们 Client ID 的证明书。</span>
      <span class="hl-c">// 任何一项不通过都会抛异常，被下面的 catch 接住。</span>
      <span class="hl-c">// { idToken, audience: clientId }：对象简写，idToken 等同于 idToken: idToken。</span>
      <span class="hl-k">const</span> ticket = <span class="hl-k">await</span> client.verifyIdToken({ idToken, audience: clientId });

      <span class="hl-c">// getPayload()：取出证明书里的"内容"部分（里面有 sub、email、name 等）。</span>
      <span class="hl-k">const</span> p = ticket.getPayload();
      <span class="hl-c">// 内容为空，或者没有 sub（唯一编号），都不能用，判失败。</span>
      <span class="hl-k">if</span> (!p || !p.sub) <span class="hl-k">return</span> <span class="hl-k">null</span>;

      <span class="hl-c">// ④ 邮箱没被 Google 验证过的，不接受。（和 Java 版一样）</span>
      <span class="hl-c">// !== true：必须严格等于 true；undefined（没有这个字段）也算不通过。</span>
      <span class="hl-k">if</span> (p.email_verified !== <span class="hl-k">true</span>) <span class="hl-k">return</span> <span class="hl-k">null</span>;

      <span class="hl-c">// 核对通过，整理成我们自己的 GoogleUser 格式返回。</span>
      <span class="hl-c">// ?? null：如果字段不存在（undefined），统一换成 null，让类型和 GoogleUser 一致。</span>
      <span class="hl-k">return</span> {
        sub: p.sub,
        email: p.email ?? <span class="hl-k">null</span>,
        name: p.name ?? <span class="hl-k">null</span>,
        picture: p.picture ?? <span class="hl-k">null</span>,
      };
    } <span class="hl-k">catch</span> {
      <span class="hl-c">// 网络问题、证明书格式错误、签名不对、过期……一律当作验证失败。</span>
      <span class="hl-c">// 这里故意不区分原因：对调用方来说只有"通过 / 不通过"两种结果；</span>
      <span class="hl-c">// 也不把失败原因告诉前端，避免给攻击者提供试探的线索。</span>
      <span class="hl-k">return</span> <span class="hl-k">null</span>;
    }
  };
}</pre>
<pre data-key="src/auth/jwt.ts" data-project="node" data-path="ielts-backend-node/src/auth/jwt.ts" data-lines="108"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// jwt.ts —— 发 token、验 token</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】JwtService.java（用的是 java-jwt 库；这里用 Node.js 世界常见的 jose 库，做的事完全一样）</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、为什么要有"我们自己的 token"</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 用户用 Google 登录成功后，我们要发给前端一张"通行证"（token）。</span>
<span class="hl-c">// 之后前端每个请求都带上它，后端不用每次都去问 Google（慢、而且 Google 的证明书一小时就过期），</span>
<span class="hl-c">// 只要检查这张通行证是不是我们自己盖过章、有没有过期。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、JWT 的结构</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// token 的样子是三段用点连起来的字符串："头部.内容.签名"：</span>
<span class="hl-c">//   头部：说明用什么算法签名（我们用 HS256 = 用一个密钥做 HMAC-SHA256 运算）</span>
<span class="hl-c">//   内容：里面放 sub（subject，主人：用户编号）、iat（issued at，发行时间）、exp（expiration，过期时间）</span>
<span class="hl-c">//   签名：用密钥对"头部.内容"做运算得到的一串值。</span>
<span class="hl-c">//         【原理】HMAC 是一种"带密钥的哈希"：同样的输入 + 同样的密钥，一定得到同样的结果；</span>
<span class="hl-c">//         但不知道密钥的人，没法算出正确的结果。所以任何人改动了"内容"，签名就对不上，验证会失败。</span>
<span class="hl-c">// 【重要】头部和内容只是 Base64 编码（一种把二进制变成可见字符的编码方式），没有加密，</span>
<span class="hl-c">// 任何人拿到 token 都能读出里面的内容。所以里面只放用户编号，不放邮箱等资料。</span>
<span class="hl-c">// "签名"保证的是"没被篡改、确实是我们发的"，而不是"内容保密"。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、密钥（secret）的作用</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 就是你在 Vercel 里填的 APP_JWT_SECRET，相当于"印章"。发证时用它盖章，验证时用它核对章。</span>
<span class="hl-c">// 只有后端知道它。泄露了，别人就能自己造任意用户的通行证。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// jose：一个处理 JWT 的库。</span>
<span class="hl-c">//   SignJWT：造（签发）token 的工具类；</span>
<span class="hl-c">//   jwtVerify：验证 token 的函数。</span>
<span class="hl-k">import</span> { jwtVerify, <span class="hl-t">SignJWT</span> } <span class="hl-k">from</span> <span class="hl-s">"jose"</span>;

<span class="hl-c">// 有效期：7 天。写成有名字的常量，以后改只改这一处，看代码的人也知道 "7d" 是什么。</span>
<span class="hl-c">// （jose 能识别 "7d" 这种写法：d=天，h=小时，m=分钟。）</span>
<span class="hl-c">// 过期后用户需要重新用 Google 登录一次。</span>
<span class="hl-k">const</span> <span class="hl-t">EXPIRE</span> = <span class="hl-s">"7d"</span>;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// JwtService：这个对象提供两个方法。用 interface 描述它的"形状"，调用它的代码只依赖形状。</span>
<span class="hl-c">// 对应 Java 里 JwtService 类的 create 和 verify 两个方法。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">interface</span> <span class="hl-t">JwtService</span> {
  <span class="hl-c">/** 给某个用户发 token。参数：我们数据库里的用户编号。返回：token 字符串（包在 Promise 里）。 */</span>
  create(userId: number): <span class="hl-t">Promise</span>&lt;string&gt;;
  <span class="hl-c">/** 验证 token。通过就返回里面的用户编号；不通过（被篡改、过期、格式错）返回 null。 */</span>
  verify(token: string): <span class="hl-t">Promise</span>&lt;number | <span class="hl-k">null</span>&gt;;
}

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// createJwtService：创建 JwtService。参数 secret 是签名密钥（字符串）。</span>
<span class="hl-c">// 对应 Java：Spring 创建 JwtService 时通过构造器 + @Value 把密钥递进来。</span>
<span class="hl-c">// 这里是调用方（index.ts）把密钥作为参数传进来。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> createJwtService(secret: string): <span class="hl-t">JwtService</span> {
  <span class="hl-c">// 密钥必须是"字节数组"，所以把字符串转成字节（UTF-8 编码）。</span>
  <span class="hl-c">// 【计算机基础】计算机里文字最终都是字节（0~255 的数字）。UTF-8 是把文字变成字节的一种规则。</span>
  <span class="hl-c">// 启动时转一次，之后每次发/验都复用同一个 key，不用每次重新转换。</span>
  <span class="hl-c">// 对应 Java：Algorithm.HMAC256(secret) 在构造器里造好、整个程序复用。</span>
  <span class="hl-k">const</span> key = <span class="hl-k">new</span> <span class="hl-t">TextEncoder</span>().encode(secret);

  <span class="hl-c">// 返回一个对象，里面有 create 和 verify 两个方法，符合上面 JwtService 的形状。</span>
  <span class="hl-c">// 这两个方法都能使用外面的 key（闭包）。</span>
  <span class="hl-k">return</span> {
    <span class="hl-c">// async create(userId)：异步方法，因为签名运算用的是浏览器/Node 的加密接口，是异步的。</span>
    <span class="hl-k">async</span> create(userId) {
      <span class="hl-c">// 链式调用：每个方法返回自己，可以一直点下去，最后的 sign 才真正生成结果。（和 Java 版的写法一样）</span>
      <span class="hl-k">return</span> (
        <span class="hl-k">new</span> <span class="hl-t">SignJWT</span>({}) <span class="hl-c">// 额外的自定义内容：我们没有，所以是空对象 {}</span>
          .setProtectedHeader({ alg: <span class="hl-s">"HS256"</span> }) <span class="hl-c">// 头部：声明算法是 HS256</span>
          .setSubject(<span class="hl-t">String</span>(userId)) <span class="hl-c">// sub：token 的主人。只放用户编号，转成字符串存（JWT 规范要求 sub 是字符串）</span>
          .setIssuedAt() <span class="hl-c">// iat：发行时间，不传参数就默认是"现在"</span>
          .setExpirationTime(<span class="hl-t">EXPIRE</span>) <span class="hl-c">// exp：过期时间 = 现在 + 7 天。过了这个时间验证会失败</span>
          .sign(key) <span class="hl-c">// 用密钥对"头部.内容"做运算得到签名，拼成完整 token 字符串。返回 Promise</span>
      );
    },

    <span class="hl-c">// async verify(token)：验证 token，返回用户编号或 null。</span>
    <span class="hl-k">async</span> verify(token) {
      <span class="hl-c">// try ... catch：和 Java 一样。先试着执行 try 里的代码，中途抛出异常就跳到 catch。</span>
      <span class="hl-c">// jwtVerify 在任何不合格的情况下都是"抛异常"而不是"返回 false"，所以必须用 try 接住。</span>
      <span class="hl-k">try</span> {
        <span class="hl-c">// jwtVerify 会做三件事（和 Java 版 JWT.require(algo).build().verify(token) 一样）：</span>
        <span class="hl-c">//   ① 用我们的密钥重新算一遍签名，和 token 里带的对比，不一样就抛异常（被改过或不是我们发的）；</span>
        <span class="hl-c">//   ② 检查 exp，过期就抛异常；</span>
        <span class="hl-c">//   ③ 检查格式是否合法。</span>
        <span class="hl-c">// algorithms: ["HS256"]：明确只接受 HS256。</span>
        <span class="hl-c">//   这是防御一类著名的攻击：攻击者把头部改成 alg: "none"（"不需要签名"），</span>
        <span class="hl-c">//   如果验证方不限制算法，就可能被骗过。这里白名单只允许我们用的那一种。</span>
        <span class="hl-c">// { payload }：从返回的对象里只取 payload（"内容"部分）。这叫"解构赋值"。</span>
        <span class="hl-k">const</span> { payload } = <span class="hl-k">await</span> jwtVerify(token, key, { algorithms: [<span class="hl-s">"HS256"</span>] });

        <span class="hl-c">// payload.sub 是当初放进去的用户编号（字符串），用 Number(...) 转回数字。</span>
        <span class="hl-k">const</span> id = <span class="hl-t">Number</span>(payload.sub);
        <span class="hl-c">// 防御：必须是"安全范围内的正整数"。万一 sub 缺失（得到 NaN）或不是数字，当作验证失败。</span>
        <span class="hl-c">// Number.isSafeInteger：是整数，并且在 JS 能精确表示的范围内。</span>
        <span class="hl-c">// 条件 ? 值1 : 值2：三元运算符，条件为真返回 id，否则返回 null。</span>
        <span class="hl-k">return</span> <span class="hl-t">Number</span>.isSafeInteger(id) &amp;&amp; id &gt; 0 ? id : <span class="hl-k">null</span>;
      } <span class="hl-k">catch</span> {
        <span class="hl-c">// 所有失败情况（篡改、过期、格式错）都到这里。</span>
        <span class="hl-c">// 我们不关心具体原因，统一返回 null，让调用方当作"未登录"。</span>
        <span class="hl-k">return</span> <span class="hl-k">null</span>;
      }
    },
  };
}</pre>
<pre data-key="src/auth/middleware.ts" data-project="node" data-path="ielts-backend-node/src/auth/middleware.ts" data-lines="107"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// middleware.ts —— "门卫"：检查请求有没有带有效的 token</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】AuthInterceptor.java + WebAuthConfig.java</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、为什么需要门卫</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 收藏接口每个都要知道"是谁在请求"。如果每个接口里都写一遍"取 token、验证、解出 userId"，</span>
<span class="hl-c">// 代码会重复，而且迟早有一个接口会漏写，造成"没登录也能访问"的严重漏洞。</span>
<span class="hl-c">// 所以在这些接口前面统一站一个门卫，一次写完，所有被它保护的接口自动生效。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、HTTP 请求怎么带 token</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// HTTP 请求由三部分组成：请求行（方法+路径）、请求头（一组"名字: 值"）、请求体。</span>
<span class="hl-c">// token 放在请求头里：  Authorization: Bearer eyJhbGciOi...</span>
<span class="hl-c">// "Bearer"（持有者）是一种约定的写法，意思是"谁持有这张证，谁就是主人"。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、概念对照</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   Java 的 HandlerInterceptor.preHandle  ==  Express 的"中间件"（一个带 next 的函数）</span>
<span class="hl-c">//   preHandle 返回 true（放行）            ==  调用 next()</span>
<span class="hl-c">//   preHandle 返回 false（拦住）           ==  不调用 next()，自己直接回复 401</span>
<span class="hl-c">//   request.setAttribute("userId", ...)    ==  res.locals.userId = ...</span>
<span class="hl-c">//   WebAuthConfig 里 addPathPatterns       ==  在路由文件里写 router.use("/favorites", requireAuth)</span>
<span class="hl-c">// 前端类比：Vue Router 的 beforeEach 导航守卫。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// 这些都是 Express 提供的"类型"（只用来做类型检查，所以用 import type）：</span>
<span class="hl-c">//   Request：请求对象的类型；Response：响应对象的类型；NextFunction：next 函数的类型。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">NextFunction</span>, <span class="hl-t">Request</span>, <span class="hl-t">Response</span> } <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-c">// JwtService：验 token 的工具的类型（见 jwt.ts）。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">JwtService</span> } <span class="hl-k">from</span> <span class="hl-s">"./jwt.js"</span>;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// extractBearerToken：从请求头里取出 token。</span>
<span class="hl-c">// 请求头 Authorization 的格式是 "Bearer eyJhbGci..."，</span>
<span class="hl-c">// 必须以 "Bearer "（注意末尾有一个空格）开头，后面才是 token 本身。</span>
<span class="hl-c">// 对应 Java 的：authorization.startsWith("Bearer ") 和 substring("Bearer ".length())</span>
<span class="hl-c">// 导出（export）这个函数，是因为别的地方也可能要用同样的取法，不重复写。</span>
<span class="hl-c">// 返回类型 string | null：取到了返回 token 字符串，取不到返回 null。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> extractBearerToken(req: <span class="hl-t">Request</span>): string | <span class="hl-k">null</span> {
  <span class="hl-c">// req.get("Authorization")：读取请求头。HTTP 头的名字不区分大小写，这个方法也不区分。</span>
  <span class="hl-c">// 没有这个头时返回 undefined。</span>
  <span class="hl-k">const</span> header = req.get(<span class="hl-s">"Authorization"</span>);
  <span class="hl-c">// 没有这个头，或者不是以 "Bearer " 开头，都当作"没带 token"。</span>
  <span class="hl-k">if</span> (!header || !header.startsWith(<span class="hl-s">"Bearer "</span>)) <span class="hl-k">return</span> <span class="hl-k">null</span>;
  <span class="hl-c">// 去掉前面的 "Bearer " 这 7 个字符（含空格），剩下的就是 token。</span>
  <span class="hl-c">// slice(n)：从第 n 个字符开始截取到末尾。"Bearer ".length 是 7。</span>
  <span class="hl-k">return</span> header.slice(<span class="hl-s">"Bearer "</span>.length);
}

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// createRequireAuth：创建门卫。</span>
<span class="hl-c">// 参数 jwt：验 token 的工具（由外面递进来，对应 Java 里构造器注入 JwtService）。</span>
<span class="hl-c">// 返回的是一个中间件函数 (req, res, next) =&gt; ...，Express 每次收到请求会依次调用经过的中间件。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> createRequireAuth(jwt: <span class="hl-t">JwtService</span>) {
  <span class="hl-c">// 返回一个命名的异步函数。给它起名字 requireAuth，出错时报错信息里能看到名字，方便排查。</span>
  <span class="hl-k">return</span> <span class="hl-k">async</span> <span class="hl-k">function</span> requireAuth(req: <span class="hl-t">Request</span>, res: <span class="hl-t">Response</span>, next: <span class="hl-t">NextFunction</span>) {
    <span class="hl-c">// ① 预检请求（OPTIONS）直接放行。</span>
    <span class="hl-c">// 浏览器在发"真正的请求"之前，会先发一个 OPTIONS 请求问"我可以跨域访问吗"，它不带 token。</span>
    <span class="hl-c">// 如果我们也拦它，浏览器就以为跨域被禁止，真正的请求永远发不出去。</span>
    <span class="hl-c">// （在我们的程序里，预检其实已经被前面的 CORS 中间件处理掉了，到不了这里；</span>
    <span class="hl-c">//  保留这一句是双保险，也和 Java 版一致。）</span>
    <span class="hl-k">if</span> (req.method === <span class="hl-s">"OPTIONS"</span>) {
      next(); <span class="hl-c">// 放行</span>
      <span class="hl-k">return</span>; <span class="hl-c">// 结束本函数，下面的检查不用做了</span>
    }

    <span class="hl-c">// ② 取 token。</span>
    <span class="hl-k">const</span> token = extractBearerToken(req);
    <span class="hl-c">// ③ 验 token：有 token 才去验，验通过得到 userId（数字），不通过得到 null；没有 token 直接是 null。</span>
    <span class="hl-k">const</span> userId = token ? <span class="hl-k">await</span> jwt.verify(token) : <span class="hl-k">null</span>;

    <span class="hl-k">if</span> (userId === <span class="hl-k">null</span>) {
      <span class="hl-c">// 走到这里说明：没带 token、格式不对、token 是假的或过期了。</span>
      <span class="hl-c">// 直接回复 401 并拦住（不调用 next，所以后面真正的接口代码根本不会执行）。</span>
      <span class="hl-c">// 401 的意思是"你没有通过身份验证"。错误内容和 Java 版一样：{"error":"unauthorized"}</span>
      res.status(401).json({ error: <span class="hl-s">"unauthorized"</span> });
      <span class="hl-k">return</span>;
    }

    <span class="hl-c">// 验证通过：把用户编号存进"这一次请求"自带的小口袋 res.locals。</span>
    <span class="hl-c">// 这个口袋只在这一次请求中有效，请求结束就没了，不同请求之间互不影响（同时有一万人访问，各有各的口袋）。</span>
    <span class="hl-c">// 【重点】userId 只能从验证过的 token 里来，绝不从前端的请求体或路径里取。</span>
    <span class="hl-c">// 否则坐在前端的人把请求里的 userId 改成别人的，就能读写别人的收藏（这类漏洞叫 IDOR，不安全的直接对象引用）。</span>
    res.locals.userId = userId;
    <span class="hl-c">// 放行：继续去执行后面真正的接口代码。</span>
    next();
  };
}

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// getUserId：在接口里取出门卫放进去的用户编号。</span>
<span class="hl-c">// 对应 Java 的 @RequestAttribute(AuthInterceptor.USER_ID)。</span>
<span class="hl-c">// 只在经过 requireAuth 之后的接口里调用才安全；万一没有，抛错而不是悄悄返回一个默认值——</span>
<span class="hl-c">// 因为"悄悄返回默认值"意味着可能用错误的用户身份去读写数据，比直接崩溃危险得多。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> getUserId(res: <span class="hl-t">Response</span>): number {
  <span class="hl-c">// res.locals 的类型是"任意"，所以这里先取出来，再自己检查它是不是数字。</span>
  <span class="hl-k">const</span> id = res.locals.userId;
  <span class="hl-c">// typeof id !== "number"：不是数字（说明门卫没放过值，代码写错了位置）。</span>
  <span class="hl-k">if</span> (<span class="hl-k">typeof</span> id !== <span class="hl-s">"number"</span>) <span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">Error</span>(<span class="hl-s">"getUserId 被用在了没有经过 requireAuth 的地方"</span>);
  <span class="hl-k">return</span> id;
}</pre>
<pre data-key="src/db/schema.ts" data-project="node" data-path="ielts-backend-node/src/db/schema.ts" data-lines="145"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// schema.ts —— 描述数据库里有哪些表、每张表有哪些列</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】AppUser.java 和 FavoriteWord.java（两个带 @Entity 的类）</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、关系型数据库的基本概念（计算机基础）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   表（table）：像一张 Excel 表格，一类数据一张表。</span>
<span class="hl-c">//   列（column）：表格的竖列，规定"每条记录有哪些属性"（比如 email、name）。</span>
<span class="hl-c">//   行（row）：表格的一横行，一条具体的记录（比如某一个用户）。</span>
<span class="hl-c">//   主键（primary key）：每一行的唯一编号，用来精确指向某一行。</span>
<span class="hl-c">//   外键（foreign key）：一列里的值必须是另一张表主键里真实存在的值，用来表示"这行属于那张表的哪一行"。</span>
<span class="hl-c">//   索引（index）：数据库额外维护的"目录"。没有索引，查询要从第一行翻到最后一行；有索引，直接定位。</span>
<span class="hl-c">//   约束（constraint）：数据库自己执行的规则，比如"不能为空""不能重复"。违反时数据库直接拒绝写入。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、这份文件的角色</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// Java 里：你写一个类，贴上 @Entity、@Id、@Column，Hibernate 在启动时"对照类去建表"（ddl-auto=update）。</span>
<span class="hl-c">// Node.js 的 Drizzle 里：你用代码描述每张表（pgTable），然后用命令行工具 drizzle-kit</span>
<span class="hl-c">// 根据这份描述"生成建表的 SQL 文件"，再执行到数据库里。</span>
<span class="hl-c">// 区别是：Java 是"启动时偷偷帮你改表"，这里是"建表语句写成文件，看得见、可以检查、可以放进 git"。</span>
<span class="hl-c">// 上线后数据库里有真实数据，这种"看得见的、一步步的改动"更安全。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 这份描述同时有两个用途：</span>
<span class="hl-c">//   ① drizzle-kit 读它，生成建表 SQL（见 drizzle 文件夹里的 0000_init.sql）；</span>
<span class="hl-c">//   ② 业务代码读它，写类型安全的查询（写错列名，编辑器当场报错）。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【重要】改了这个文件，不会自动改数据库！必须运行 npm run db:generate 生成新的 SQL，</span>
<span class="hl-c">// 再运行 npm run db:migrate 执行到数据库里。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// 从 drizzle-orm 导入"描述 PostgreSQL 表"用的积木。</span>
<span class="hl-c">//   pgTable    ：声明一张表</span>
<span class="hl-c">//   bigserial  ：自增的大整数列（对应 Java 的 @GeneratedValue(strategy = IDENTITY) + Long）</span>
<span class="hl-c">//   bigint     ：普通大整数列</span>
<span class="hl-c">//   text       ：不限长度的文字列（PostgreSQL 里 text 和 varchar 性能一样，所以直接用 text）</span>
<span class="hl-c">//   timestamp  ：时间列</span>
<span class="hl-c">//   uniqueIndex：联合唯一索引（"这几列合起来不能重复"）</span>
<span class="hl-c">//   index      ：普通索引（加快查询，不影响数据）</span>
<span class="hl-k">import</span> { bigint, bigserial, index, pgTable, text, timestamp, uniqueIndex } <span class="hl-k">from</span> <span class="hl-s">"drizzle-orm/pg-core"</span>;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 用户表 app_user</span>
<span class="hl-c">// 【对应 Java】AppUser.java，@Table(name = "app_user")</span>
<span class="hl-c">// 表名叫 app_user 而不叫 user：user 是数据库保留字，当表名会出错。这一点和 Java 版一样。</span>
<span class="hl-c">//</span>
<span class="hl-c">// pgTable("表名", { 列定义 })：第一个参数是数据库里真实的表名，第二个参数是各列。</span>
<span class="hl-c">// export const appUser：导出一个叫 appUser 的变量，代码里用它来代表这张表。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">const</span> appUser = pgTable(<span class="hl-s">"app_user"</span>, {
  <span class="hl-c">// 主键：每个用户的编号，由数据库自动递增分配（1、2、3……）。</span>
  <span class="hl-c">// bigserial("id", ...)：括号里第一个参数是数据库里的列名。</span>
  <span class="hl-c">// { mode: "number" }：在 JS 里用普通 number 表示。</span>
  <span class="hl-c">// （数据库的 bigint 可能超出 JS number 能精确表示的范围（约 9×10^15），但我们的用户数远远到不了，所以放心。）</span>
  <span class="hl-c">// .primaryKey()：声明它是主键（唯一、不为空，数据库自动给它建索引）。</span>
  <span class="hl-c">// 对应 Java：@Id + @GeneratedValue(strategy = IDENTITY) + private Long id</span>
  id: bigserial(<span class="hl-s">"id"</span>, { mode: <span class="hl-s">"number"</span> }).primaryKey(),

  <span class="hl-c">// Google 给每个账号的唯一编号（证明书里叫 sub），永远不变。我们用它来识别"同一个人"。</span>
  <span class="hl-c">// .notNull() 对应 @Column(nullable = false)：这一列不允许为空。</span>
  <span class="hl-c">// .unique() 对应 @Column(unique = true)：不允许两行有相同的值。</span>
  <span class="hl-c">// 括号里的 "google_sub" 是数据库里的列名（下划线风格，数据库的习惯）；</span>
  <span class="hl-c">// 左边的 googleSub 是代码里的名字（驼峰风格，JS 的习惯）。Drizzle 负责两边互相转换。</span>
  googleSub: text(<span class="hl-s">"google_sub"</span>).notNull().unique(),

  <span class="hl-c">// 邮箱、名字、头像地址：只当资料，不当身份（邮箱可能会变，用户也可能改名字，所以不拿它们识别人）。</span>
  <span class="hl-c">// 没有 .notNull()，所以可以为空（null）。</span>
  email: text(<span class="hl-s">"email"</span>),
  name: text(<span class="hl-s">"name"</span>),
  picture: text(<span class="hl-s">"picture"</span>),

  <span class="hl-c">// 第一次登录的时间。</span>
  <span class="hl-c">// defaultNow()：让数据库在插入时自动填入当前时间，所以代码里不用再像 Java 那样手写 this.createdAt = Instant.now()。</span>
  <span class="hl-c">// withTimezone: true：带时区存储，避免服务器时区不同造成的混乱。</span>
  createdAt: timestamp(<span class="hl-s">"created_at"</span>, { withTimezone: <span class="hl-k">true</span> }).notNull().defaultNow(),
});

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 收藏表 favorite_word</span>
<span class="hl-c">// 【对应 Java】FavoriteWord.java</span>
<span class="hl-c">// 相比 Java 版，新增了 site 列（区分"这条收藏是英语站的还是日语站的"），</span>
<span class="hl-c">// 并且直接把"联合唯一约束"做进了表里（这是我们之前说的上线前保险）。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【关系】一个用户可以有很多条收藏（一对多）。</span>
<span class="hl-c">// 每条收藏用 user_id 指回它的主人。所有人的收藏都放在这一张表里，查询时用 WHERE user_id = ? 筛选。</span>
<span class="hl-c">// 这是关系型数据库的标准做法，不是"每人一张表"。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">const</span> favoriteWord = pgTable(
  <span class="hl-s">"favorite_word"</span>,
  {
    <span class="hl-c">// 这条收藏记录自己的编号（自增）。</span>
    id: bigserial(<span class="hl-s">"id"</span>, { mode: <span class="hl-s">"number"</span> }).primaryKey(),

    <span class="hl-c">// 这条收藏属于哪个用户：存 app_user.id。</span>
    <span class="hl-c">// .references(() =&gt; appUser.id)：外键。数据库会保证这里填的编号一定是 app_user 里真实存在的用户，</span>
    <span class="hl-c">//   填一个不存在的编号，数据库直接拒绝。</span>
    <span class="hl-c">//   写成函数 () =&gt; appUser.id 而不是直接写 appUser.id，是为了避免"表定义的先后顺序"问题。</span>
    <span class="hl-c">// onDelete: "cascade"：如果用户被删除，他的收藏跟着一起删，不会留下"没有主人的收藏"。</span>
    <span class="hl-c">// Java 版没有外键，这里多了一层数据库级别的保护。</span>
    userId: bigint(<span class="hl-s">"user_id"</span>, { mode: <span class="hl-s">"number"</span> })
      .notNull()
      .references(() =&gt; appUser.id, { onDelete: <span class="hl-s">"cascade"</span> }),

    <span class="hl-c">// 【新增】这条收藏属于哪个站："ielts" 或 "jlpt"。</span>
    <span class="hl-c">// 两个站共用一个后端和一个数据库，靠这一列把数据分开。</span>
    <span class="hl-c">// .default("ielts")：插入时没给这一列的值，数据库就填 "ielts"（兼容还没有 site 的旧前端）。</span>
    site: text(<span class="hl-s">"site"</span>).notNull().<span class="hl-k">default</span>(<span class="hl-s">"ielts"</span>),

    <span class="hl-c">// 类型："w" 是单词，"p" 是短语。由前端判断（没有空格是单词，有空格是短语）。</span>
    kind: text(<span class="hl-s">"kind"</span>).notNull(),

    <span class="hl-c">// 单词或短语本身，比如 "accommodation"、"on the other hand"。</span>
    word: text(<span class="hl-s">"word"</span>).notNull(),

    <span class="hl-c">// 状态，默认 "unknown"（不认识）。</span>
    status: text(<span class="hl-s">"status"</span>).notNull().<span class="hl-k">default</span>(<span class="hl-s">"unknown"</span>),

    <span class="hl-c">// 收藏的时间，数据库自动填。</span>
    createdAt: timestamp(<span class="hl-s">"created_at"</span>, { withTimezone: <span class="hl-k">true</span> }).notNull().defaultNow(),
  },
  <span class="hl-c">// 第三个参数：表级别的约束和索引，返回一个数组。t 就是上面这张表的各列（t.userId 就是 userId 那一列）。</span>
  (t) =&gt; [
    <span class="hl-c">// 联合唯一：同一个用户、同一个站、同一种类型、同一个词，只能有一行。</span>
    <span class="hl-c">// 这就是之前说的"让数据库自己拒绝重复"：就算用户连点两下、两个请求同时到达，</span>
    <span class="hl-c">// 数据库在写入的那一刻原子地检查（"原子"= 不可分割，检查和写入之间不会被别人插队），</span>
    <span class="hl-c">// 第二个会被拒绝，不会出现重复收藏。</span>
    <span class="hl-c">// 对应 Java 里建议加的 @UniqueConstraint(columnNames = {"user_id", "kind", "word"})，这里多加了 site。</span>
    uniqueIndex(<span class="hl-s">"favorite_word_user_site_kind_word_uq"</span>).on(t.userId, t.site, t.kind, t.word),

    <span class="hl-c">// 按用户查收藏是最常见的查询（列表接口），给 user_id 建索引加快它。</span>
    <span class="hl-c">// 索引像书的目录：没有目录要从头翻到尾，有目录直接翻到那一页。数据多了以后差别明显。</span>
    <span class="hl-c">// （代价：写入时数据库要多维护一份目录，略慢一点，但读远比写多，所以划算。）</span>
    index(<span class="hl-s">"favorite_word_user_idx"</span>).on(t.userId),
  ],
);

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 从表描述里"推导"出行的类型，写业务代码时用。</span>
<span class="hl-c">// typeof appUser：取变量 appUser 的类型；</span>
<span class="hl-c">// $inferSelect：Drizzle 提供的"推导"功能，意思是"从数据库查出来的一行长什么样（所有列都有）"。</span>
<span class="hl-c">// 好处：以后给表加了一列，这个类型自动跟着变，不用手动同步。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">type</span> <span class="hl-t">AppUserRow</span> = <span class="hl-k">typeof</span> appUser.$inferSelect;
<span class="hl-k">export</span> <span class="hl-k">type</span> <span class="hl-t">FavoriteRow</span> = <span class="hl-k">typeof</span> favoriteWord.$inferSelect;</pre>
<pre data-key="src/db/client.ts" data-project="node" data-path="ielts-backend-node/src/db/client.ts" data-lines="67"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// client.ts —— 创建"连接数据库的工具"</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】Spring Data JPA 自动配置好的数据源 + 各个 Repository 背后的 EntityManager。</span>
<span class="hl-c">// Java 里这一整套是 Spring 看到 pom.xml 里有 JPA、application.properties 里有 datasource.url 后自动配好的。</span>
<span class="hl-c">// 这里我们手动写出来，只有几行，你能清楚看到"数据库连接是怎么来的"。</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、后端怎么和数据库说话（计算机基础）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 数据库（Neon 上的 PostgreSQL）是另一台机器上运行的另一个程序，后端和它通过网络通信。</span>
<span class="hl-c">// 后端把一条 SQL 文字发过去（比如 SELECT * FROM app_user WHERE id = 1），数据库执行后把结果发回来。</span>
<span class="hl-c">// 要连上它，需要知道：在哪台机器（主机名）、用什么账号密码、连哪个数据库。</span>
<span class="hl-c">// 这些全部写在一串连接地址里，就是你的 DATABASE_URL，格式大致是：</span>
<span class="hl-c">//   postgresql://用户名:密码@主机/数据库名?参数</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、什么是 ORM，Drizzle 在这里做什么</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 直接拼 SQL 字符串又长又容易写错（还可能被"SQL 注入"攻击：有人把恶意 SQL 当作单词提交上来）。</span>
<span class="hl-c">// ORM（对象关系映射）让你用代码来描述查询，它在背后帮你生成安全的 SQL，参数都会被正确"转义/参数化"。</span>
<span class="hl-c">// Java 里是 JPA/Hibernate，Node.js 里我们用 Drizzle。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// neon：Neon 官方提供的函数，用来创建"通过 HTTP 访问 Neon 数据库"的工具。</span>
<span class="hl-k">import</span> { neon } <span class="hl-k">from</span> <span class="hl-s">"@neondatabase/serverless"</span>;
<span class="hl-c">// PgDatabase：Drizzle 里"任意一种 PostgreSQL 数据库"的通用类型（只用来标注类型，所以 import type）。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">PgDatabase</span> } <span class="hl-k">from</span> <span class="hl-s">"drizzle-orm/pg-core"</span>;
<span class="hl-c">// drizzle：把底层数据库连接，包装成 Drizzle 的数据库对象。</span>
<span class="hl-c">// "drizzle-orm/neon-http"：专门对接 Neon HTTP 驱动的那一版。</span>
<span class="hl-k">import</span> { drizzle } <span class="hl-k">from</span> <span class="hl-s">"drizzle-orm/neon-http"</span>;
<span class="hl-c">// import * as schema：把 schema.ts 里 export 的所有东西（appUser、favoriteWord 等表描述）</span>
<span class="hl-c">// 收集成一个叫 schema 的对象。要告诉 Drizzle "我们有哪几张表"。</span>
<span class="hl-k">import</span> * <span class="hl-k">as</span> schema <span class="hl-k">from</span> <span class="hl-s">"./schema.js"</span>;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// Db：我们业务代码里统一使用的"数据库工具"的类型。</span>
<span class="hl-c">// 它是 Drizzle 对 PostgreSQL 数据库的抽象。无论底下接的是线上的 Neon，还是本地/测试用的 PGlite，</span>
<span class="hl-c">// 业务代码都只认这个类型，不关心底下是谁。</span>
<span class="hl-c">// 这就是"依赖注入"的好处，和 Java 里 Controller 只依赖 Repository 接口、不关心实现是同一个道理。</span>
<span class="hl-c">// （第二个泛型参数 typeof schema：告诉它这个数据库里有哪些表。</span>
<span class="hl-c">//   第一个泛型参数写 any：不同驱动的"查询结果格式"类型不同，业务代码用不到，所以放宽。）</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 下面这行是给代码检查工具（eslint）看的：这里故意使用了 any，请不要报警告。</span>
<span class="hl-c">// eslint-disable-next-line @typescript-eslint/no-explicit-any</span>
<span class="hl-k">export</span> <span class="hl-k">type</span> <span class="hl-t">Db</span> = <span class="hl-t">PgDatabase</span>&lt;any, <span class="hl-k">typeof</span> schema&gt;;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// createNeonDb：连接线上的 Neon 数据库。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【为什么用 neon-http 驱动】</span>
<span class="hl-c">// 传统后端（比如你的 Java 版）启动后一直活着，和数据库保持一条长连接，用"连接池"复用</span>
<span class="hl-c">// （连接池 = 提前建好几条连接放着，要用时借一条，用完还回去，省得每次重新建立连接）。</span>
<span class="hl-c">// 但 Vercel 这类平台是"函数式"的：没有请求时程序被暂停，有请求才唤醒，而且可能同时起很多个实例。</span>
<span class="hl-c">// 如果每个实例都开长连接，数据库的连接数很快会被占满（数据库能同时接受的连接数是有限的）。</span>
<span class="hl-c">// Neon 提供的 HTTP 驱动换了个思路：每条 SQL 通过一次 HTTPS 请求发给 Neon，不占长连接。</span>
<span class="hl-c">// 这对"唤醒—处理—休眠"的运行方式最合适。（Neon 官方文档对 Vercel 也是这样建议的。）</span>
<span class="hl-c">// 代价：它不支持多条语句组成的"事务"（事务 = 一组操作要么全成功、要么全失败）。</span>
<span class="hl-c">// 我们目前每个接口只做单条语句，用不到事务。以后如果需要，可以换成 WebSocket 驱动。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> createNeonDb(databaseUrl: string): <span class="hl-t">Db</span> {
  <span class="hl-c">// neon(url)：返回一个能执行 SQL 的函数 sql。url 里带了用户名、密码、主机、数据库名。</span>
  <span class="hl-c">// 注意：此时还没有真正联网；到第一次执行查询时才会发出 HTTPS 请求。</span>
  <span class="hl-k">const</span> sql = neon(databaseUrl);
  <span class="hl-c">// drizzle(...)：把 sql 函数包装成 Drizzle 数据库对象，并把 schema（表描述）告诉它，</span>
  <span class="hl-c">// 这样写查询时，表名、列名都能被编辑器检查，拼错了会立刻标红。</span>
  <span class="hl-k">return</span> drizzle({ client: sql, schema });
}</pre>

<pre data-key="drizzle.config.ts" data-project="node" data-path="ielts-backend-node/drizzle.config.ts" data-lines="20"><span class="hl-c">// drizzle.config.ts —— 给命令行工具 drizzle-kit 看的配置（不是运行时代码）。</span>
<span class="hl-c">// 【对应 Java】大致相当于 application.properties 里 spring.jpa.hibernate.ddl-auto 那一部分的职责：</span>
<span class="hl-c">// 决定"表结构怎么同步到数据库"。区别是这里由你手动执行命令，而不是程序启动时自动改。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 用法：</span>
<span class="hl-c">//   npm run db:generate   根据 src/db/schema.ts 的变化，生成新的建表/改表 SQL 文件，放进 drizzle/ 文件夹</span>
<span class="hl-c">//   npm run db:migrate    把 drizzle/ 里还没执行过的 SQL 文件依次执行到 DATABASE_URL 指向的数据库</span>
<span class="hl-k">import</span> <span class="hl-s">"dotenv/config"</span>; <span class="hl-c">// 读取项目根目录的 .env 文件，把里面的变量放进 process.env（只在你本机用）</span>
<span class="hl-k">import</span> { defineConfig } <span class="hl-k">from</span> <span class="hl-s">"drizzle-kit"</span>;

<span class="hl-k">export</span> <span class="hl-k">default</span> defineConfig({
  schema: <span class="hl-s">"./src/db/schema.ts"</span>, <span class="hl-c">// 表描述写在哪</span>
  out: <span class="hl-s">"./drizzle"</span>, <span class="hl-c">// 生成的 SQL 文件放哪</span>
  dialect: <span class="hl-s">"postgresql"</span>, <span class="hl-c">// 数据库类型</span>
  dbCredentials: {
    <span class="hl-c">// 优先用 DATABASE_URL_UNPOOLED（Neon 的"直连"地址）：改表结构最好别走连接池。</span>
    <span class="hl-c">// 没有就用 DATABASE_URL。两个都没有时给空字符串，generate 不需要连数据库，不会报错。</span>
    url: process.env.<span class="hl-t">DATABASE_URL_UNPOOLED</span> ?? process.env.<span class="hl-t">DATABASE_URL</span> ?? <span class="hl-s">""</span>,
  },
});</pre>
<pre data-key="test/api.test.ts" data-project="node" data-path="ielts-backend-node/test/api.test.ts" data-lines="341"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// test/api.test.ts —— 接口的自动化测试（共 22 个）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】JUnit + MockMvc 写的 Controller 测试。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、用到的两个工具</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   vitest   ：测试框架（对应 JUnit）。提供三个核心函数：</span>
<span class="hl-c">//                describe("一组测试的名字", () =&gt; {...})   把相关的测试分成一组</span>
<span class="hl-c">//                it("这个测试检查什么", async () =&gt; {...})  一个具体的测试</span>
<span class="hl-c">//                expect(实际结果).toBe(期望结果)            断言：不符合预期，这个测试就失败</span>
<span class="hl-c">//   supertest：假浏览器（对应 MockMvc）。request(app).get("/health") 会直接把请求交给 Express 程序，</span>
<span class="hl-c">//              不需要真的开端口，速度很快，也不会和别的程序抢端口。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、每个测试的固定套路（"3A"：准备 Arrange → 执行 Act → 断言 Assert）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   1. makeApp()：得到一个全新的、数据库是空的程序（见 helpers.ts）；</span>
<span class="hl-c">//   2. 用 request(app) 发请求（有的先 login 拿 token）；</span>
<span class="hl-c">//   3. expect(...) 检查状态码和返回内容。</span>
<span class="hl-c">// 每个测试开头都清空数据库，所以测试之间不会互相影响，顺序也无所谓。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、怎么运行</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   npm test          运行全部测试，最后显示通过几个、失败几个</span>
<span class="hl-c">// 看到 22 passed 就说明：改动没有破坏已有功能。改完代码、推送之前都应该跑一次。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// request：假浏览器。</span>
<span class="hl-k">import</span> request <span class="hl-k">from</span> <span class="hl-s">"supertest"</span>;
<span class="hl-c">// describe、it、expect：测试框架的三个核心函数。</span>
<span class="hl-k">import</span> { describe, expect, it } <span class="hl-k">from</span> <span class="hl-s">"vitest"</span>;
<span class="hl-c">// 我们自己的小工具（见 helpers.ts）：过期 token、登录、造干净的程序。</span>
<span class="hl-k">import</span> { expiredToken, login, makeApp } <span class="hl-k">from</span> <span class="hl-s">"./helpers.js"</span>;

<span class="hl-c">// --------------------------------------------------------------------------</span>
<span class="hl-c">// 这一组：健康检查接口，被前端用来"悄悄叫醒后端和数据库"。</span>
<span class="hl-c">// --------------------------------------------------------------------------</span>
describe(<span class="hl-s">"健康检查"</span>, () =&gt; {
  it(<span class="hl-s">"GET /health 返回 ok（并且真的查了一次数据库）"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> res = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/health"</span>);
    expect(res.status).toBe(200);
    expect(res.body).toEqual({ ok: <span class="hl-k">true</span> });
  });
});

<span class="hl-c">// --------------------------------------------------------------------------</span>
<span class="hl-c">// 这一组：登录流程。重点检查：假证明书进不来；同一个人不会被注册两次（包括同时点两下的竞态情况）；</span>
<span class="hl-c">// 返回的用户信息不泄露内部字段；token 的各种"不合格"情况都被拦住。</span>
<span class="hl-c">// --------------------------------------------------------------------------</span>
describe(<span class="hl-s">"登录 /auth/google 和 /me"</span>, () =&gt; {
  it(<span class="hl-s">"假证明书 → 401"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> res = <span class="hl-k">await</span> request(app).post(<span class="hl-s">"/auth/google"</span>).send({ idToken: <span class="hl-s">"bad"</span> });
    expect(res.status).toBe(401);
    expect(res.body).toEqual({ error: <span class="hl-s">"invalid_google_token"</span> });
  });

  it(<span class="hl-s">"没有请求体 → 401（不崩溃）"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> res = <span class="hl-k">await</span> request(app).post(<span class="hl-s">"/auth/google"</span>);
    expect(res.status).toBe(401);
  });

  it(<span class="hl-s">"第一次登录自动注册；同一个人再登录，用户编号不变"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> a1 = <span class="hl-k">await</span> login(app, <span class="hl-s">"alice"</span>);
    <span class="hl-k">const</span> a2 = <span class="hl-k">await</span> login(app, <span class="hl-s">"alice"</span>);
    <span class="hl-k">const</span> b = <span class="hl-k">await</span> login(app, <span class="hl-s">"bob"</span>);
    expect(a1.status).toBe(200);
    expect(a1.user.id).toBe(a2.user.id);
    expect(b.user.id).not.toBe(a1.user.id);
  });

  it(<span class="hl-s">"返回的用户信息里没有 googleSub 等内部字段"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> a = <span class="hl-k">await</span> login(app, <span class="hl-s">"alice"</span>);
    expect(<span class="hl-t">Object</span>.keys(a.user).sort()).toEqual([<span class="hl-s">"email"</span>, <span class="hl-s">"id"</span>, <span class="hl-s">"name"</span>, <span class="hl-s">"picture"</span>]);
  });

  it(<span class="hl-s">"同一个人同时发两次首次登录，只会有一个用户"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> [r1, r2] = <span class="hl-k">await</span> <span class="hl-t">Promise</span>.all([
      request(app).post(<span class="hl-s">"/auth/google"</span>).send({ idToken: <span class="hl-s">"google:carol"</span> }),
      request(app).post(<span class="hl-s">"/auth/google"</span>).send({ idToken: <span class="hl-s">"google:carol"</span> }),
    ]);
    expect(r1.status).toBe(200);
    expect(r2.status).toBe(200);
    expect(r1.body.user.id).toBe(r2.body.user.id);
  });

  it(<span class="hl-s">"/me：带有效 token → 返回自己；不带、格式错、被篡改、过期 → 401"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> a = <span class="hl-k">await</span> login(app, <span class="hl-s">"alice"</span>);

    <span class="hl-k">const</span> ok = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/me"</span>).set(<span class="hl-s">"Authorization"</span>, <span class="hl-s">`Bearer ${a.token}`</span>);
    expect(ok.status).toBe(200);
    expect(ok.body.email).toBe(<span class="hl-s">"alice@example.com"</span>);

    expect((<span class="hl-k">await</span> request(app).get(<span class="hl-s">"/me"</span>)).status).toBe(401);
    expect((<span class="hl-k">await</span> request(app).get(<span class="hl-s">"/me"</span>).set(<span class="hl-s">"Authorization"</span>, a.token)).status).toBe(401); <span class="hl-c">// 少了 "Bearer "</span>
    expect((<span class="hl-k">await</span> request(app).get(<span class="hl-s">"/me"</span>).set(<span class="hl-s">"Authorization"</span>, <span class="hl-s">`Bearer ${a.token}x`</span>)).status).toBe(401); <span class="hl-c">// 签名被改</span>
    <span class="hl-k">const</span> expired = <span class="hl-k">await</span> expiredToken(a.user.id);
    expect((<span class="hl-k">await</span> request(app).get(<span class="hl-s">"/me"</span>).set(<span class="hl-s">"Authorization"</span>, <span class="hl-s">`Bearer ${expired}`</span>)).status).toBe(401);
  });
});

<span class="hl-c">// --------------------------------------------------------------------------</span>
<span class="hl-c">// 这一组：收藏的增删改查。重点检查：必须登录；输入的各种不合格数据都被拒绝；</span>
<span class="hl-c">// 重复收藏被数据库兜住；每个人只看得到自己的；站点之间互不干扰；</span>
<span class="hl-c">// 以及最重要的安全测试——别人不能删/改我的收藏（IDOR）。</span>
<span class="hl-c">// --------------------------------------------------------------------------</span>
describe(<span class="hl-s">"收藏 /favorites"</span>, () =&gt; {
  it(<span class="hl-s">"没有 token 时，四个接口全部 401"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    expect((<span class="hl-k">await</span> request(app).get(<span class="hl-s">"/favorites"</span>)).status).toBe(401);
    expect((<span class="hl-k">await</span> request(app).post(<span class="hl-s">"/favorites"</span>).send({ kind: <span class="hl-s">"w"</span>, word: <span class="hl-s">"x"</span> })).status).toBe(401);
    expect((<span class="hl-k">await</span> request(app).put(<span class="hl-s">"/favorites/1"</span>).send({ status: <span class="hl-s">"x"</span> })).status).toBe(401);
    expect((<span class="hl-k">await</span> request(app).delete(<span class="hl-s">"/favorites/1"</span>)).status).toBe(401);
  });

  it(<span class="hl-s">"新增：整理空格、默认状态、返回带编号的记录，且不泄露 userId"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> a = <span class="hl-k">await</span> login(app, <span class="hl-s">"alice"</span>);
    <span class="hl-k">const</span> res = <span class="hl-k">await</span> request(app)
      .post(<span class="hl-s">"/favorites"</span>)
      .set(<span class="hl-s">"Authorization"</span>, <span class="hl-s">`Bearer ${a.token}`</span>)
      .send({ kind: <span class="hl-s">"w"</span>, word: <span class="hl-s">"  accommodation  "</span> });
    expect(res.status).toBe(200);
    expect(res.body).toMatchObject({ kind: <span class="hl-s">"w"</span>, word: <span class="hl-s">"accommodation"</span>, status: <span class="hl-s">"unknown"</span>, site: <span class="hl-s">"ielts"</span> });
    expect(<span class="hl-k">typeof</span> res.body.id).toBe(<span class="hl-s">"number"</span>);
    expect(res.body.userId).toBeUndefined();
  });

  <span class="hl-c">// it("描述", async 函数)：定义一个测试用例，描述是给人看的，函数里是具体步骤。</span>
  it(<span class="hl-s">"日语站不分类型：传什么 kind 都存成 w，同一段文字只有一条"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-c">// makeApp()：造一个干净的、装配好的程序（内存数据库，每个测试开始前都是空的）。</span>

    <span class="hl-c">// 之后每个请求都要在请求头里带上 token，后端才知道"这是 alice"。</span>
    <span class="hl-k">const</span> h = { <span class="hl-t">Authorization</span>: <span class="hl-s">`Bearer ${a.token}`</span> };
    <span class="hl-c">// 第一步：模拟旧版日语站页面，收藏语法时还传 kind = "g"。</span>

    <span class="hl-c">// 期望：不报错（200），而且存进去的 kind 是 "w"，不是前端传的 "g"。</span>
    expect(r.status).toBe(200);
    expect(r.body).toMatchObject({ site: <span class="hl-s">"jlpt"</span>, kind: <span class="hl-s">"w"</span>, word: <span class="hl-s">"〜に違いない"</span> });
    <span class="hl-c">// 第二步：再用 kind = "w"（或者干脆不传）收藏同样的文字。</span>
    <span class="hl-c">// 因为日语站的类型都被固定成 w，这次和第一次是"完全相同"的收藏，唯一约束会挡住重复，直接返回已有那条。</span>
    <span class="hl-k">const</span> w = <span class="hl-k">await</span> request(app).post(<span class="hl-s">"/favorites"</span>).set(h).send({ word: <span class="hl-s">"〜に違いない"</span>, site: <span class="hl-s">"jlpt"</span> });
    <span class="hl-c">// 期望：两次拿到的是同一条记录（编号相同），数据库里只有一行。</span>
    expect(w.body.id).toBe(r.body.id);
    <span class="hl-k">const</span> list = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/favorites?site=jlpt"</span>).set(h);
    expect(list.body).toHaveLength(1);
  });

  <span class="hl-c">// 测试：英语站不能传 "g"。g 已经从允许的类型里去掉了，英语站只认 w 和 p。</span>

  it(<span class="hl-s">"不传 kind：默认当作 w（日语站不区分单词和短语）"</span>, <span class="hl-k">async</span> () =&gt; {

    expect(r1.status).toBe(200);
    expect(r1.body).toMatchObject({ site: <span class="hl-s">"jlpt"</span>, kind: <span class="hl-s">"w"</span>, word: <span class="hl-s">"食べる"</span> });

    expect(r2.body.id).toBe(r1.body.id); <span class="hl-c">// 重复收藏仍然去重</span>
    <span class="hl-k">const</span> list = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/favorites?site=jlpt"</span>).set(h);

  it(<span class="hl-s">"安全：别人不能删、不能改我的收藏（IDOR）"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();

    <span class="hl-c">// Bob 试图改、删 Alice 的收藏</span>

    expect(del.status).toBe(204); <span class="hl-c">// 对 Bob 来说"安静地什么都没发生"，和 Java 版一致</span>

    <span class="hl-c">// Alice 的收藏完好无损</span>
    <span class="hl-k">const</span> list = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/favorites"</span>).set(ha);

  it(<span class="hl-s">"改：只改传了的字段；删：自己的能删掉"</span>, <span class="hl-k">async</span> () =&gt; {

<span class="hl-c">// --------------------------------------------------------------------------</span>
<span class="hl-c">// 这一组：跨域规则。白名单里的网站会收到"允许访问"的响应头，其他网站收不到（浏览器因此会拦下它们）。</span>
<span class="hl-c">// --------------------------------------------------------------------------</span>
describe(<span class="hl-s">"CORS 跨域"</span>, () =&gt; {
  it(<span class="hl-s">"允许的网站：预检和正式请求都带上允许头"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> pre = <span class="hl-k">await</span> request(app)
      .options(<span class="hl-s">"/favorites"</span>)
      .set(<span class="hl-s">"Origin"</span>, <span class="hl-s">"https://ielts.goenkon.com"</span>)
      .set(<span class="hl-s">"Access-Control-Request-Method"</span>, <span class="hl-s">"DELETE"</span>)
      .set(<span class="hl-s">"Access-Control-Request-Headers"</span>, <span class="hl-s">"authorization,content-type"</span>);
    expect(pre.status).toBe(204);
    expect(pre.headers[<span class="hl-s">"access-control-allow-origin"</span>]).toBe(<span class="hl-s">"https://ielts.goenkon.com"</span>);
    expect(pre.headers[<span class="hl-s">"access-control-allow-methods"</span>]).toContain(<span class="hl-s">"DELETE"</span>);
    expect(pre.headers[<span class="hl-s">"access-control-allow-headers"</span>]?.toLowerCase()).toContain(<span class="hl-s">"authorization"</span>);

    <span class="hl-k">const</span> jl = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/health"</span>).set(<span class="hl-s">"Origin"</span>, <span class="hl-s">"https://jlpt.goenkon.com"</span>);
    expect(jl.headers[<span class="hl-s">"access-control-allow-origin"</span>]).toBe(<span class="hl-s">"https://jlpt.goenkon.com"</span>);
  });

  it(<span class="hl-s">"不在名单里的网站：不带允许头（浏览器会拦下）"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> res = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/health"</span>).set(<span class="hl-s">"Origin"</span>, <span class="hl-s">"https://evil.example.com"</span>);
    expect(res.headers[<span class="hl-s">"access-control-allow-origin"</span>]).toBeUndefined();
  });
});

<span class="hl-c">// --------------------------------------------------------------------------</span>
<span class="hl-c">// 这一组：杂项。不存在的路径返回 404；老的 Java 练习接口确实没有被带过来。</span>
<span class="hl-c">// --------------------------------------------------------------------------</span>
describe(<span class="hl-s">"其他"</span>, () =&gt; {
  it(<span class="hl-s">"不存在的路径 → 404 JSON"</span>, <span class="hl-k">async</span> () =&gt; {
    <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();
    <span class="hl-k">const</span> res = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/nope"</span>);
