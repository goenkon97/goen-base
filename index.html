<template id="tpl-sx-sql">
<div class="sx" v-pre>
<div class="sx-wrap"><div class="sx-chips"><span class="sx-chip">和数据库说话的语言</span><span class="sx-chip">Neon = 云上的 PostgreSQL</span><span class="sx-chip">增删改查 + 约束</span></div><h1 class="sx-h1">SQL 语法（PostgreSQL）</h1><p class="sx-intro">不管后端用 Java 还是 Node，最后都是在对数据库说 SQL。ORM（JPA、Drizzle）只是帮你把方法翻译成 SQL。读得懂 SQL，就看得懂日志、也能自己去 Neon 后台查数据。</p><nav class="sx-nav" aria-label="章节"><a href="#sql-table">表、行、列、约束</a><a href="#sql-crud">增删改查</a><a href="#sql-query">筛选、分组、连表</a><a href="#sql-tx">事务与索引</a></nav><section class="sx-sec" id="sql-table"><h2>表、行、列、约束</h2><p class="sx-desc">先把「表长什么样」想清楚。</p><div class="sx-grid"><article class="sx-item"><h3><code>CREATE TABLE</code></h3><p class="sx-what">建表：每列写名字、类型、约束。这是我们收藏表的样子（drizzle 生成的 0000_init.sql 简化版）。</p><pre class="code"><code><span class="hl-k">CREATE</span> <span class="hl-k">TABLE</span> favorite_word (
  id         <span class="hl-k">BIGSERIAL</span> <span class="hl-k">PRIMARY</span> <span class="hl-k">KEY</span>,                <span class="hl-c">-- 主键，自动递增</span>
  user_id    <span class="hl-k">BIGINT</span> <span class="hl-k">NOT</span> <span class="hl-k">NULL</span> <span class="hl-k">REFERENCES</span> app_user(id) <span class="hl-k">ON</span> <span class="hl-k">DELETE</span> <span class="hl-k">CASCADE</span>,  <span class="hl-c">-- 外键：属于哪个用户</span>
  site       <span class="hl-k">TEXT</span> <span class="hl-k">NOT</span> <span class="hl-k">NULL</span> <span class="hl-k">DEFAULT</span> <span class="hl-s">'ielts'</span>,
  kind       <span class="hl-k">TEXT</span> <span class="hl-k">NOT</span> <span class="hl-k">NULL</span>,
  word       <span class="hl-k">TEXT</span> <span class="hl-k">NOT</span> <span class="hl-k">NULL</span>,
  status     <span class="hl-k">TEXT</span> <span class="hl-k">NOT</span> <span class="hl-k">NULL</span> <span class="hl-k">DEFAULT</span> <span class="hl-s">'unknown'</span>,
  created_at <span class="hl-k">TIMESTAMPTZ</span> <span class="hl-k">NOT</span> <span class="hl-k">NULL</span> <span class="hl-k">DEFAULT</span> now()
);
<span class="hl-k">CREATE</span> <span class="hl-k">UNIQUE</span> <span class="hl-k">INDEX</span> favorite_word_uq <span class="hl-k">ON</span> favorite_word (user_id, site, kind, word);  <span class="hl-c">-- 联合唯一</span></code></pre></article><article class="sx-item"><h3><code>约束</code></h3><p class="sx-what"><b>PRIMARY KEY</b> 主键（唯一 + 非空）；<b>NOT NULL</b> 必须有值；<b>UNIQUE</b> 不能重复；<b>DEFAULT</b> 不填时的默认值；<b>REFERENCES</b> 外键（值必须在另一张表里存在）。</p><p class="sx-tip"><b>记住</b>约束是数据库帮你守的最后一道门：代码有漏洞，约束也能挡住坏数据。</p></article></div></section><section class="sx-sec" id="sql-crud"><h2>增删改查</h2><p class="sx-desc">四句话覆盖 90% 的日常。</p><div class="sx-grid"><article class="sx-item"><h3><code>SELECT 查</code></h3><p class="sx-what">选哪些列、从哪张表、满足什么条件、怎么排序、取几条。</p><pre class="code"><code><span class="hl-k">SELECT</span> id, word, status <span class="hl-k">FROM</span> favorite_word
<span class="hl-k">WHERE</span> user_id = 1 <span class="hl-k">AND</span> site = <span class="hl-s">'jlpt'</span>     <span class="hl-c">-- 字符串用单引号</span>
<span class="hl-k">ORDER</span> <span class="hl-k">BY</span> id <span class="hl-k">DESC</span>                        <span class="hl-c">-- 最新的在前</span>
<span class="hl-k">LIMIT</span> 10 <span class="hl-k">OFFSET</span> 0;                      <span class="hl-c">-- 分页：第一页 10 条</span></code></pre></article><article class="sx-item"><h3><code>INSERT 增</code></h3><p class="sx-what">插入一行。PostgreSQL 的 <b>RETURNING</b> 能把刚插入的行（带自动生成的 id）直接返回。</p><pre class="code"><code><span class="hl-k">INSERT</span> <span class="hl-k">INTO</span> favorite_word (user_id, site, kind, word)
<span class="hl-k">VALUES</span> (1, <span class="hl-s">'jlpt'</span>, <span class="hl-s">'w'</span>, <span class="hl-s">'慰める'</span>)
<span class="hl-k">ON</span> <span class="hl-k">CONFLICT</span> <span class="hl-k">DO</span> <span class="hl-k">NOTHING</span>        <span class="hl-c">-- 撞上唯一约束就跳过（我们防重复靠它）</span>
<span class="hl-k">RETURNING</span> id, word;</code></pre></article><article class="sx-item"><h3><code>UPDATE 改</code></h3><p class="sx-what">改哪张表、改成什么、改哪些行。<b>一定要写 WHERE</b>。</p><pre class="code"><code><span class="hl-k">UPDATE</span> favorite_word <span class="hl-k">SET</span> status = <span class="hl-s">'known'</span>
<span class="hl-k">WHERE</span> id = 3 <span class="hl-k">AND</span> user_id = 1;   <span class="hl-c">-- 带上 user_id：只能改自己的</span></code></pre></article><article class="sx-item"><h3><code>DELETE 删</code></h3><p class="sx-what">删哪些行。<b>一定要写 WHERE</b>，不写就是删整张表。</p><pre class="code"><code><span class="hl-k">DELETE</span> <span class="hl-k">FROM</span> favorite_word <span class="hl-k">WHERE</span> id = 3 <span class="hl-k">AND</span> user_id = 1;</code></pre><p class="sx-tip"><b>记住</b>改和删之前，先用同样的 WHERE 跑一次 SELECT，看看会影响哪几行。</p></article></div></section><section class="sx-sec" id="sql-query"><h2>筛选、分组、连表</h2><p class="sx-desc">进阶查询。</p><div class="sx-grid"><article class="sx-item"><h3><code>WHERE 常用条件</code></h3><p class="sx-what">比较、范围、模糊匹配、空值判断。</p><pre class="code"><code><span class="hl-k">WHERE</span> kind <span class="hl-k">IN</span> (<span class="hl-s">'w'</span>, <span class="hl-s">'p'</span>)
<span class="hl-k">WHERE</span> word <span class="hl-k">LIKE</span> <span class="hl-s">'ab%'</span>          <span class="hl-c">-- 以 ab 开头</span>
<span class="hl-k">WHERE</span> status <span class="hl-k">IS</span> <span class="hl-k">NULL</span>           <span class="hl-c">-- 判断空值不能用 = NULL</span>
<span class="hl-k">WHERE</span> created_at &gt; now() - interval <span class="hl-s">'7 days'</span></code></pre></article><article class="sx-item"><h3><code>GROUP BY + COUNT</code></h3><p class="sx-what">分组统计。HAVING 是「分组以后再筛选」。</p><pre class="code"><code><span class="hl-c">-- 每个站点、每种类型各有多少条收藏</span>
<span class="hl-k">SELECT</span> site, kind, <span class="hl-k">COUNT</span>(*) <span class="hl-k">AS</span> n
<span class="hl-k">FROM</span> favorite_word
<span class="hl-k">GROUP</span> <span class="hl-k">BY</span> site, kind
<span class="hl-k">HAVING</span> <span class="hl-k">COUNT</span>(*) &gt; 0
<span class="hl-k">ORDER</span> <span class="hl-k">BY</span> site;</code></pre></article><figure class="sx-fig"><svg viewBox="0 0 640 162" role="img" aria-label="JOIN：用 favorite_word.user_id = app_user.id 把两张表「对上」，一次查出「谁收藏了什么」"><g filter="url(#sxwob)"><rect x="16" y="14" width="250" height="112" rx="8" class="sx-s" fill="var(--card)"/><rect x="16" y="14" width="250" height="28" rx="8" class="sx-s" fill="var(--blue)"/><rect x="374" y="14" width="250" height="138" rx="8" class="sx-s" fill="var(--card)"/><rect x="374" y="14" width="250" height="28" rx="8" class="sx-s" fill="var(--mint)"/><path d="M266 82 C 320 82, 320 82, 374 82" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M266 82 C 320 82, 320 108, 374 108" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M266 108 C 320 108, 320 134, 374 134" class="sx-s sx-dash" marker-end="url(#sxah)"/></g><text x="141.0" y="33" text-anchor="middle" font-size="13" font-weight="700" class="">app_user</text><text x="78.5" y="60" text-anchor="middle" font-size="11" font-weight="700" class="sx-sub">id</text><text x="203.5" y="60" text-anchor="middle" font-size="11" font-weight="700" class="sx-sub">name</text><text x="78.5" y="86" text-anchor="middle" font-size="11.5" class="">1</text><text x="203.5" y="86" text-anchor="middle" font-size="11.5" class="">Goen</text><text x="78.5" y="112" text-anchor="middle" font-size="11.5" class="">2</text><text x="203.5" y="112" text-anchor="middle" font-size="11.5" class="">Amy</text><text x="499.0" y="33" text-anchor="middle" font-size="13" font-weight="700" class="">favorite_word</text><text x="436.5" y="60" text-anchor="middle" font-size="11" font-weight="700" class="sx-sub">user_id</text><text x="561.5" y="60" text-anchor="middle" font-size="11" font-weight="700" class="sx-sub">word</text><text x="436.5" y="86" text-anchor="middle" font-size="11.5" class="">1</text><text x="561.5" y="86" text-anchor="middle" font-size="11.5" class="">abandon</text><text x="436.5" y="112" text-anchor="middle" font-size="11.5" class="">1</text><text x="561.5" y="112" text-anchor="middle" font-size="11.5" class="">reduce</text><text x="436.5" y="138" text-anchor="middle" font-size="11.5" class="">2</text><text x="561.5" y="138" text-anchor="middle" font-size="11.5" class="">hence</text></svg><figcaption>JOIN：用 favorite_word.user_id = app_user.id 把两张表「对上」，一次查出「谁收藏了什么」</figcaption></figure><article class="sx-item"><h3><code>JOIN 连表</code></h3><p class="sx-what"><b>INNER JOIN</b>：两边都对得上才要；<b>LEFT JOIN</b>：左表全要，右表对不上就填 NULL。</p><pre class="code"><code><span class="hl-k">SELECT</span> u.name, f.word
<span class="hl-k">FROM</span> favorite_word f
<span class="hl-k">JOIN</span> app_user u <span class="hl-k">ON</span> u.id = f.user_id      <span class="hl-c">-- 连接条件</span>
<span class="hl-k">WHERE</span> f.site = <span class="hl-s">'ielts'</span>;

<span class="hl-c">-- 每个用户有几条收藏（没有收藏的用户也列出来，显示 0）</span>
<span class="hl-k">SELECT</span> u.name, <span class="hl-k">COUNT</span>(f.id)
<span class="hl-k">FROM</span> app_user u <span class="hl-k">LEFT</span> <span class="hl-k">JOIN</span> favorite_word f <span class="hl-k">ON</span> f.user_id = u.id
<span class="hl-k">GROUP</span> <span class="hl-k">BY</span> u.name;</code></pre></article></div></section><section class="sx-sec" id="sql-tx"><h2>事务与索引</h2><p class="sx-desc">数据正确和查询速度。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 200" role="img" aria-label="事务：几步操作捆成一个整体，不会出现「扣了钱但没到账」这种一半的状态"><g filter="url(#sxwob)"><rect x="14" y="74" width="150" height="52" rx="10" class="sx-s" fill="var(--blue)"/><rect x="245" y="16" width="170" height="52" rx="10" class="sx-s" fill="var(--mint)"/><rect x="245" y="132" width="170" height="52" rx="10" class="sx-s" fill="var(--pink)"/><rect x="490" y="74" width="136" height="52" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M164 92 C 200 92, 210 42, 243 42" class="sx-s" marker-end="url(#sxah)"/><path d="M164 112 C 200 112, 210 158, 243 158" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M415 42 C 450 42, 460 92, 488 92" class="sx-s" marker-end="url(#sxah)"/><path d="M415 158 C 450 158, 460 112, 488 112" class="sx-s sx-dash" marker-end="url(#sxah)"/></g><text x="89.0" y="96" text-anchor="middle" font-size="13" font-weight="700" class="">BEGIN</text><text x="89.0" y="114" text-anchor="middle" font-size="10.5" class="sx-sub">开始一组操作</text><text x="330.0" y="38" text-anchor="middle" font-size="13" font-weight="700" class="">全部成功</text><text x="330.0" y="56" text-anchor="middle" font-size="10.5" class="sx-sub">COMMIT 一起生效</text><text x="330.0" y="154" text-anchor="middle" font-size="13" font-weight="700" class="">中途出错</text><text x="330.0" y="172" text-anchor="middle" font-size="10.5" class="sx-sub">ROLLBACK 全部撤销</text><text x="558.0" y="96" text-anchor="middle" font-size="13" font-weight="700" class="">数据库</text><text x="558.0" y="114" text-anchor="middle" font-size="10.5" class="sx-sub">要么全变、要么全不变</text><text x="200" y="58" text-anchor="middle" font-size="11" class="sx-good">正常</text><text x="200" y="150" text-anchor="middle" font-size="11" class="sx-bad">出错</text></svg><figcaption>事务：几步操作捆成一个整体，不会出现「扣了钱但没到账」这种一半的状态</figcaption></figure><article class="sx-item"><h3><code>BEGIN / COMMIT / ROLLBACK</code></h3><p class="sx-what">把几条语句包成一个事务。</p><pre class="code"><code><span class="hl-k">BEGIN</span>;
<span class="hl-k">UPDATE</span> account <span class="hl-k">SET</span> balance = balance - 100 <span class="hl-k">WHERE</span> id = 1;
<span class="hl-k">UPDATE</span> account <span class="hl-k">SET</span> balance = balance + 100 <span class="hl-k">WHERE</span> id = 2;
<span class="hl-k">COMMIT</span>;      <span class="hl-c">-- 两条一起生效；中途出错就 ROLLBACK，两条都不生效</span></code></pre></article><article class="sx-item"><h3><code>索引</code></h3><p class="sx-what">像书的目录，让「按某列查」变快。主键和 UNIQUE 自带索引；经常出现在 WHERE 里的列（比如 user_id）应该加索引。代价是写入稍慢、占空间。</p><pre class="code"><code><span class="hl-k">CREATE</span> <span class="hl-k">INDEX</span> favorite_word_user_idx <span class="hl-k">ON</span> favorite_word (user_id);</code></pre></article></div></section></div>
</div>
</template>
<template id="tpl-sx-vue">
<div class="sx" v-pre>
<div class="sx-wrap"><div class="sx-chips"><span class="sx-chip">我们三个网站的前端框架</span><span class="sx-chip">响应式：数据变，页面自动变</span><span class="sx-chip">CDN 全局版 + Vue Router</span></div><h1 class="sx-h1">Vue 3 语法</h1><p class="sx-intro">你做过前端，Vue 应该不陌生，这里把我们网站里用到的写法集中整理一下，方便对照后端：模板语法、响应式、计算属性、组件、路由、和后端通信。</p><nav class="sx-nav" aria-label="章节"><a href="#vue-reactive">响应式：数据驱动页面</a><a href="#vue-tpl">模板语法</a><a href="#vue-comp">组件与路由</a><a href="#vue-api">和后端通信</a></nav><section class="sx-sec" id="vue-reactive"><h2>响应式：数据驱动页面</h2><p class="sx-desc">Vue 的核心：你只改数据，页面由 Vue 去更新。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 96" role="img" aria-label="响应式：Vue 在你读数据时记下依赖，在你改数据时通知这些地方更新"><g filter="url(#sxwob)"><rect x="10.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--blue)"/><path d="M151.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="170.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M312.0 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="331.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--pink)"/><path d="M472.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="491.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--mint)"/></g><text x="79.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">ref / reactive</text><text x="79.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">包一层「会被追踪」的数据</text><text x="239.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">模板里用到它</text><text x="239.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">Vue 记下「谁依赖它」</text><text x="400.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">数据被改</text><text x="400.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">count.value++</text><text x="560.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">自动重新渲染</text><text x="560.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">只更新用到它的地方</text></svg><figcaption>响应式：Vue 在你读数据时记下依赖，在你改数据时通知这些地方更新</figcaption></figure><article class="sx-item"><h3><code>ref / reactive</code></h3><p class="sx-what"><b>ref</b> 包任何值，在 JS 里要用 <code>.value</code> 读写（模板里不用）；<b>reactive</b> 只能包对象，直接读写属性。</p><pre class="code"><code><span class="hl-k">const</span> { createApp, ref, reactive } = <span class="hl-t">Vue</span>;
createApp({
  setup() {
    <span class="hl-k">const</span> page = ref(1);                 <span class="hl-c">// JS 里：page.value</span>
    <span class="hl-k">const</span> user = reactive({ name: <span class="hl-s">"Goen"</span> });
    <span class="hl-k">const</span> next = () =&gt; page.value++;
    <span class="hl-k">return</span> { page, user, next };         <span class="hl-c">// 返回的东西模板里能用</span>
  },
}).mount(<span class="hl-s">"#app"</span>);</code></pre></article><article class="sx-item"><h3><code>computed</code></h3><p class="sx-what">根据别的数据算出来的值，依赖不变就不会重算（有缓存）。</p><pre class="code"><code><span class="hl-k">const</span> favs = ref([]);
<span class="hl-k">const</span> favCount = computed(() =&gt; favs.value.length);   <span class="hl-c">// favs 变了它才重新算</span>
<span class="hl-k">const</span> today = computed(() =&gt; { <span class="hl-k">const</span> d = now.value; <span class="hl-k">return</span> d.getDate(); });</code></pre></article><article class="sx-item"><h3><code>watch / 生命周期</code></h3><p class="sx-what"><b>watch</b>：某个数据变了就执行一段代码；<b>onMounted</b>：组件画到页面上之后执行；<b>onUnmounted</b>：组件被移除时执行（清定时器）。</p><pre class="code"><code>watch(() =&gt; route.path, (to, <span class="hl-k">from</span>) =&gt; { window.scrollTo(0, 0); });
onMounted(() =&gt; { timer = setInterval(tick, 30000); });
onUnmounted(() =&gt; clearInterval(timer));   <span class="hl-c">// 不清掉，离开页面后定时器还在跑</span></code></pre></article></div></section><section class="sx-sec" id="vue-tpl"><h2>模板语法</h2><p class="sx-desc">写在 HTML 里的指令。</p><div class="sx-grid"><article class="sx-item"><h3><code>插值 {{ }} 与 v-bind（:）</code></h3><p class="sx-what"><code>{{ }}</code> 显示数据（会自动转义，安全）；<code>:属性</code> 把属性绑到数据上。</p><pre class="code"><code>&lt;p&gt;第 {{ page }} 页&lt;/p&gt;
&lt;img :src=<span class="hl-s">"user.picture"</span> :alt=<span class="hl-s">"user.name"</span>&gt;
&lt;div :<span class="hl-k">class</span>=<span class="hl-s">"{ on: isFav }"</span> :style=<span class="hl-s">"{ '--c': color }"</span>&gt;&lt;/div&gt;</code></pre></article><article class="sx-item"><h3><code>v-on（@）事件</code></h3><p class="sx-what">监听事件。修饰符：<b>.stop</b> 阻止冒泡、<b>.prevent</b> 阻止默认行为、<b>.self</b> 只在点到自己时触发。</p><pre class="code"><code>&lt;button @click=<span class="hl-s">"next"</span>&gt;下一页&lt;/button&gt;
&lt;button @click.stop=<span class="hl-s">"toggleFav('w', w.k)"</span>&gt;收藏&lt;/button&gt;
&lt;div <span class="hl-k">class</span>=<span class="hl-s">"mask"</span> @click.self=<span class="hl-s">"close"</span>&gt;...&lt;/div&gt;</code></pre></article><article class="sx-item"><h3><code>v-if / v-show / v-for</code></h3><p class="sx-what"><b>v-if</b> 条件为假时根本不渲染；<b>v-show</b> 只是隐藏（频繁切换用它）；<b>v-for</b> 循环，一定要配 <b>:key</b>。</p><pre class="code"><code>&lt;p v-<span class="hl-k">if</span>=<span class="hl-s">"!authUser"</span>&gt;请先登录&lt;/p&gt;
&lt;aside v-show=<span class="hl-s">"open"</span>&gt;抽屉&lt;/aside&gt;
&lt;div v-<span class="hl-k">for</span>=<span class="hl-s">"f in favs"</span> :key=<span class="hl-s">"f.id"</span>&gt;{{ f.word }}&lt;/div&gt;</code></pre></article><article class="sx-item"><h3><code>v-model / v-html / v-pre</code></h3><p class="sx-what"><b>v-model</b> 表单双向绑定；<b>v-html</b> 按 HTML 渲染（只能用于自己可控的内容，否则有 XSS 风险）；<b>v-pre</b> 让 Vue 跳过这一块，原样显示。</p><pre class="code"><code>&lt;input v-model=<span class="hl-s">"keyword"</span> placeholder=<span class="hl-s">"搜索"</span>&gt;
&lt;code v-html=<span class="hl-s">"viewer.html"</span>&gt;&lt;/code&gt;      <span class="hl-c">&lt;!-- 我们代码库里，代码是自己构建时上色的，可控 --&gt;</span>
&lt;div v-pre&gt;{{ 这里不会被当成插值 }}&lt;/div&gt;</code></pre></article></div></section><section class="sx-sec" id="vue-comp"><h2>组件与路由</h2><p class="sx-desc">把页面拆成一块块，再用路由切换。</p><div class="sx-grid"><article class="sx-item"><h3><code>组件 + props / emit</code></h3><p class="sx-what">组件是可复用的一块界面。父组件通过 <b>props</b> 往下传数据，子组件通过 <b>emit</b> 往上发事件。</p><pre class="code"><code><span class="hl-k">const</span> <span class="hl-t">FavButton</span> = {
  props: { on: <span class="hl-t">Boolean</span> },
  emits: [<span class="hl-s">"toggle"</span>],
  template: <span class="hl-s">`&lt;button :class="{ on }" @click="$emit('toggle')"&gt;★&lt;/button&gt;`</span>,
};
<span class="hl-c">// 父组件里：&lt;fav-button :on="isFav(w)" @toggle="toggleFav(w)"&gt;&lt;/fav-button&gt;</span></code></pre></article><article class="sx-item"><h3><code>Vue Router</code></h3><p class="sx-what"><b>routes</b> 表写「网址 → 组件」；<b>router-view</b> 是占位框；<b>router-link</b> 是不刷新页面的链接；<b>children</b> 是嵌套路由。秘密基地的后端笔记就是这样做的。</p><pre class="code"><code><span class="hl-k">const</span> router = createRouter({
  history: createWebHashHistory(),          <span class="hl-c">// 网址里带 #，静态托管刷新也不会 404</span>
  routes: [
    { path: <span class="hl-s">"/"</span>, component: <span class="hl-t">Home</span> },
    { path: <span class="hl-s">"/backend"</span>, component: <span class="hl-t">BackendLayout</span>, children: [
        { path: <span class="hl-s">""</span>, component: <span class="hl-t">BkIndex</span> },     <span class="hl-c">// /backend</span>
        { path: <span class="hl-s">"java"</span>, component: <span class="hl-t">BkJava</span> },  <span class="hl-c">// /backend/java</span>
    ] },
  ],
});
createApp({}).use(router).mount(<span class="hl-s">"#app"</span>);
<span class="hl-c">// 模板里：&lt;router-link to="/backend/java"&gt;Java&lt;/router-link&gt;  &lt;router-view&gt;&lt;/router-view&gt;</span></code></pre></article></div></section><section class="sx-sec" id="vue-api"><h2>和后端通信</h2><p class="sx-desc">前端这一侧的「登录 + 收藏」。</p><div class="sx-grid"><article class="sx-item"><h3><code>带 token 的请求</code></h3><p class="sx-what">登录拿到 token 存进 localStorage，之后每个请求带上 Authorization 头；遇到 401 就清掉登录状态。</p><pre class="code"><code><span class="hl-k">async</span> <span class="hl-k">function</span> authFetch(path, opt = {}) {
  <span class="hl-k">const</span> headers = { <span class="hl-t">Authorization</span>: <span class="hl-s">"Bearer "</span> + localStorage.getItem(<span class="hl-s">"jlpt_token"</span>), ...opt.headers };
  <span class="hl-k">if</span> (opt.body) headers[<span class="hl-s">"Content-Type"</span>] = <span class="hl-s">"application/json"</span>;
  <span class="hl-k">const</span> r = <span class="hl-k">await</span> fetch(<span class="hl-t">API_BASE</span> + path, { ...opt, headers });
  <span class="hl-k">if</span> (r.status === 401) { logout(); <span class="hl-k">return</span> <span class="hl-k">null</span>; }   <span class="hl-c">// 登录失效</span>
  <span class="hl-k">return</span> r;
}

<pre data-key="CorsConfig.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/CorsConfig.java" data-lines="61"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// CorsConfig.java —— 跨域设置：允许哪些网站访问我们的后端</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/create-app.ts 里的 cors(...) 中间件</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、为什么需要 CORS（计算机基础）</span>
<span class="hl-c">// 浏览器有一条安全规则叫"同源策略"：网页里的 JavaScript，默认不允许读取"另一个源"的网站返回的内容。</span>
<span class="hl-c">// "源"= 协议 + 域名 + 端口，三者只要有一个不同，就算不同的源：</span>
<span class="hl-c">//   前端页面：http://localhost:5500      后端：http://localhost:8080      端口不同 → 不同源</span>
<span class="hl-c">// 这条规则是为了保护用户：否则任何恶意网站的脚本，都能借你的浏览器去读你登录过的别的网站的数据。</span>
<span class="hl-c">// 如果后端想让某个网站的页面访问自己，就要在回复的响应头里明确声明：</span>
<span class="hl-c">//   Access-Control-Allow-Origin: http://localhost:5500</span>
<span class="hl-c">// 浏览器看到这个"放行条"，才会把结果交给页面。这套机制就叫 CORS（跨源资源共享）。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、预检请求</span>
<span class="hl-c">// 浏览器在发 PUT/DELETE，或带了 Authorization 头的请求之前，会先自动发一个 OPTIONS 请求，</span>
<span class="hl-c">// 问后端"我这样跨域访问，你允许吗？"，这叫"预检"。后端答应了，浏览器才发真正的请求。</span>
<span class="hl-c">// 下面的配置就是在回答这个问题。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、重要认识</span>
<span class="hl-c">// 拦住请求的是"浏览器"，不是后端。请求其实已经到了后端。而且 CORS 只约束浏览器：</span>
<span class="hl-c">// curl、Postman、别的服务器调用我们根本不受它管，所以它不能当作安全防线，真正的防线是登录验证。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// Configuration：贴在类上的标签，见下面类定义处的说明。</span>
<span class="hl-k">import</span> org.springframework.context.annotation.<span class="hl-t">Configuration</span>;
<span class="hl-c">// CorsRegistry：跨域规则的"登记簿"，往里面登记"哪些路径允许哪些来源访问"。</span>
<span class="hl-k">import</span> org.springframework.web.servlet.config.annotation.<span class="hl-t">CorsRegistry</span>;
<span class="hl-c">// WebMvcConfigurer：Spring 提供的"自定义 Web 设置"接口，里面有一批默认什么都不做的方法，</span>
<span class="hl-c">// 我们只需要重写想改的那一个（这里是 addCorsMappings）。</span>
<span class="hl-k">import</span> org.springframework.web.servlet.config.annotation.<span class="hl-t">WebMvcConfigurer</span>;

<span class="hl-c">// @Configuration：给 Spring 的"配置类"便利贴。Spring 启动时会读这个类，</span>
<span class="hl-c">// 找到里面重写的方法并调用，让我们有机会修改 Web 的设置。</span>
<span class="hl-a">@Configuration</span>
<span class="hl-c">// implements WebMvcConfigurer：我们"承诺"实现这个接口。接口是一份"合同"，规定了要有哪些方法；</span>
<span class="hl-c">// 实现了它，Spring 才知道怎么调用我们的类。</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">CorsConfig</span> <span class="hl-k">implements</span> <span class="hl-t">WebMvcConfigurer</span> {

    <span class="hl-c">// @Override：声明"我重写了接口里规定的这个方法"。如果方法名或参数写错，编译器会立刻报错，起保护作用。</span>
    <span class="hl-c">// 这个方法在 Spring 启动时被调用一次，让我们把跨域规则登记进 registry。</span>
    <span class="hl-a">@Override</span>
    <span class="hl-k">public</span> <span class="hl-k">void</span> addCorsMappings(<span class="hl-t">CorsRegistry</span> registry) {
        <span class="hl-c">// 告诉浏览器：这两个来源的页面，可以访问我的所有接口</span>
        <span class="hl-c">// addMapping("/**")：规则适用于哪些路径。/** 表示"所有路径"。</span>
        registry.addMapping(<span class="hl-s">"/**"</span>)
                <span class="hl-c">// allowedOrigins：允许哪些来源（网站）。</span>
                <span class="hl-c">//   http://localhost:5500 是你本机用 Live Server 开前端的地址；</span>
                <span class="hl-c">//   https://ielts.goenkon.com 是线上的英语站。</span>
                <span class="hl-c">// 注意：来源必须写完整且完全一致（协议、域名、端口），少一个字符都匹配不上。</span>
                <span class="hl-c">// 日语站上线时，要把 https://jlpt.goenkon.com 也加进来。</span>
                .allowedOrigins(<span class="hl-s">"http://localhost:5500"</span>, <span class="hl-s">"https://ielts.goenkon.com"</span>)
                <span class="hl-c">// allowedMethods：允许前端使用哪些 HTTP 方法。OPTIONS 就是上面说的预检请求。</span>
                .allowedMethods(<span class="hl-s">"GET"</span>, <span class="hl-s">"POST"</span>, <span class="hl-s">"PUT"</span>, <span class="hl-s">"DELETE"</span>, <span class="hl-s">"OPTIONS"</span>)
                <span class="hl-c">// allowedHeaders("*")：允许前端在请求里带任意请求头</span>
                <span class="hl-c">// （比如放 token 的 Authorization、声明 JSON 的 Content-Type）。</span>
                .allowedHeaders(<span class="hl-s">"*"</span>);
    }
}</pre>
<pre data-key="WebAuthConfig.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/WebAuthConfig.java" data-lines="50"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// WebAuthConfig.java —— 登记"哪些网址要过门卫（AuthInterceptor）"</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/routes/favorites.ts 里的 router.use("/favorites", requireAuth)</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、为什么要有这个类</span>
<span class="hl-c">// AuthInterceptor 只是"门卫本人"，写好了。但门卫要站在哪几扇门前，需要有人登记。</span>
<span class="hl-c">// 这个类就是登记簿：告诉 Spring"这个拦截器，管这些网址"。没登记的网址，不会经过门卫。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、【很重要】漏登记 = 接口裸奔</span>
<span class="hl-c">// 如果以后新写了一个需要登录的接口，但忘了把它的路径加到这里，Spring 不会报任何错，</span>
<span class="hl-c">// 这个接口就没有任何保护了，没登录也能访问。所以新增需要登录的接口时，必须记得检查这里。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// Configuration：贴在类上，意思是"这是一个配置类，启动时 Spring 要读它，按里面的内容做设置"。</span>
<span class="hl-k">import</span> org.springframework.context.annotation.<span class="hl-t">Configuration</span>;
<span class="hl-c">// InterceptorRegistry：拦截器的"登记簿"，我们往里面登记"哪个拦截器，管哪些网址"。</span>
<span class="hl-k">import</span> org.springframework.web.servlet.config.annotation.<span class="hl-t">InterceptorRegistry</span>;
<span class="hl-c">// WebMvcConfigurer：Spring 提供的"自定义 Web 设置"的接口。</span>
<span class="hl-c">// 我们实现它，并重写其中的 addInterceptors 方法，Spring 启动时会调用，让我们登记拦截器。</span>
<span class="hl-k">import</span> org.springframework.web.servlet.config.annotation.<span class="hl-t">WebMvcConfigurer</span>;

<span class="hl-a">@Configuration</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">WebAuthConfig</span> <span class="hl-k">implements</span> <span class="hl-t">WebMvcConfigurer</span> {

    <span class="hl-c">// 门卫对象。private：只有本类能用；final：只在构造器里赋值一次。</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">AuthInterceptor</span> authInterceptor; <span class="hl-c">// 上面那道门，由 Spring 递进来</span>

    <span class="hl-c">// 构造器。我们自己没有写 new WebAuthConfig(...)：</span>
    <span class="hl-c">// Spring 看到这个类带 @Configuration，就自己 new 它；看到构造器要一个 AuthInterceptor，</span>
    <span class="hl-c">// 就去对象仓库里找（AuthInterceptor 上贴了 @Component，所以仓库里有），自动递进来。这就是"依赖注入"。</span>
    <span class="hl-k">public</span> <span class="hl-t">WebAuthConfig</span>(<span class="hl-t">AuthInterceptor</span> authInterceptor) {
        <span class="hl-c">// this.authInterceptor 是这个对象自己的字段，右边的 authInterceptor 是传进来的参数。</span>
        <span class="hl-k">this</span>.authInterceptor = authInterceptor;
    }

    <span class="hl-c">// 重写接口方法：Spring 启动时调用一次，让我们登记拦截器。</span>
    <span class="hl-a">@Override</span>
    <span class="hl-k">public</span> <span class="hl-k">void</span> addInterceptors(<span class="hl-t">InterceptorRegistry</span> registry) {
        <span class="hl-c">// 登记：这道门（authInterceptor），负责检查这些网址：</span>
        <span class="hl-c">//   /favorites     收藏接口本身</span>
        <span class="hl-c">//   /favorites/**  它下面所有的子路径（比如 /favorites/12）；** 表示"任意层级的任意内容"</span>
        <span class="hl-c">// 没写进来的网址（比如 /auth/google、/me）不会经过这道门。</span>
        <span class="hl-c">// /auth/google 必须放行，否则没人能登录；/me 我们已经自己检查过了。</span>
        registry.addInterceptor(authInterceptor)
                .addPathPatterns(<span class="hl-s">"/favorites"</span>, <span class="hl-s">"/favorites/**"</span>);
    }
}</pre>
<pre data-key="AuthInterceptor.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/AuthInterceptor.java" data-lines="96"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// AuthInterceptor.java —— "门卫"：检查请求有没有带合格的 token</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/auth/middleware.ts 里的 requireAuth</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、拦截器是什么</span>
<span class="hl-c">// 请求到达 Controller 方法之前，可以先经过一个或多个"拦截器"。拦截器的 preHandle 方法返回：</span>
<span class="hl-c">//   true  → 放行，请求继续去执行 Controller 方法；</span>
<span class="hl-c">//   false → 拦住，Controller 方法不会被执行，回复由拦截器自己写。</span>
<span class="hl-c">// 好处：每个需要登录的接口不用各自检查 token，统一在门口检查一次。</span>
<span class="hl-c">// （拦截哪些网址，由 WebAuthConfig 登记。）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、token 怎么送来（HTTP 基础）</span>
<span class="hl-c">// HTTP 请求由"请求行 + 请求头 + 请求体"组成。登录之后，前端每次请求都在请求头里带上：</span>
<span class="hl-c">//   Authorization: Bearer eyJhbGciOi...（后面是 token）</span>
<span class="hl-c">// Bearer 的意思是"持有者"：谁拿着这张票，谁就是票上的那个人。所以 token 绝不能泄露。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、核心原则：用户编号只能来自验证过的 token</span>
<span class="hl-c">// 通过验证后，我们把 userId 放进请求对象里。后面的 Controller 只信这个 userId，</span>
<span class="hl-c">// 绝不信前端自己在请求体或网址里传的"我是几号用户"，否则任何人都能冒充别人。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// HttpServletRequest：代表"这一次收到的 HTTP 请求"，可以读请求头、请求方法，也可以临时存放数据。</span>
<span class="hl-c">// （jakarta.servlet 是 Java Web 的底层标准，Tomcat 就实现了这套标准。）</span>
<span class="hl-k">import</span> jakarta.servlet.http.<span class="hl-t">HttpServletRequest</span>;
<span class="hl-c">// HttpServletResponse：代表"这一次要发回去的 HTTP 回复"，可以设状态码、响应头、回复内容。</span>
<span class="hl-k">import</span> jakarta.servlet.http.<span class="hl-t">HttpServletResponse</span>;
<span class="hl-c">// Component：贴在类上，意思是"启动时请 Spring new 一个这个类的对象，放进对象仓库备用"。</span>
<span class="hl-k">import</span> org.springframework.stereotype.<span class="hl-t">Component</span>;
<span class="hl-c">// HandlerInterceptor：Spring 规定的"拦截器"接口，里面有 preHandle 等方法。</span>
<span class="hl-c">// Handler 指的就是"处理请求的 Controller 方法"。</span>
<span class="hl-k">import</span> org.springframework.web.servlet.<span class="hl-t">HandlerInterceptor</span>;

<span class="hl-c">// @Component：让 Spring 自动创建这个对象。WebAuthConfig 的构造器需要一个 AuthInterceptor，</span>
<span class="hl-c">// Spring 就是从这里创建好的对象里取出来递过去的。</span>
<span class="hl-a">@Component</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">AuthInterceptor</span> <span class="hl-k">implements</span> <span class="hl-t">HandlerInterceptor</span> {

    <span class="hl-c">// 存放用户编号时用的"名字"。public static final：全局可访问的常量，不能修改。</span>
    <span class="hl-c">// 相当于往请求对象里的"口袋"放东西时贴的标签；Controller 取的时候用同样的名字。</span>
    <span class="hl-c">// 写成常量，是避免两边手打字符串，拼错一个字母就取不到。</span>
    <span class="hl-k">public</span> <span class="hl-k">static</span> <span class="hl-k">final</span> <span class="hl-t">String</span> <span class="hl-t">USER_ID</span> = <span class="hl-s">"userId"</span>;

    <span class="hl-c">// 用来验 token 的工具，由 Spring 通过构造器递进来。final：赋值一次后不再改变。</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">JwtService</span> jwtService;

    <span class="hl-c">// 构造器注入：Spring 创建 AuthInterceptor 时，发现需要一个 JwtService，</span>
    <span class="hl-c">// 就从对象仓库里取（JwtService 上贴了 @Service，所以仓库里有）并传进来。我们自己不用写 new。</span>
    <span class="hl-k">public</span> <span class="hl-t">AuthInterceptor</span>(<span class="hl-t">JwtService</span> jwtService) {
        <span class="hl-k">this</span>.jwtService = jwtService;
    }

    <span class="hl-c">// 重写接口方法：每个被登记的请求到来时，Spring 先调用这个方法。</span>
    <span class="hl-c">// 参数 request：这次的请求；response：这次的回复；handler：即将执行的 Controller 方法（这里用不到）。</span>
    <span class="hl-c">// throws Exception：声明方法里可能抛出异常，调用者要处理（下面 getWriter().write 可能抛 IOException）。</span>
    <span class="hl-a">@Override</span>
    <span class="hl-k">public</span> boolean preHandle(<span class="hl-t">HttpServletRequest</span> request, <span class="hl-t">HttpServletResponse</span> response, <span class="hl-t">Object</span> handler)
            <span class="hl-k">throws</span> <span class="hl-t">Exception</span> {

        <span class="hl-c">// 浏览器在发跨域请求（带 Authorization 头、或 PUT/DELETE）之前，会先发一个 OPTIONS "预检"请求。</span>
        <span class="hl-c">// 预检请求本来就不会带 token，如果也被拦成 401，浏览器会认为"后端不允许跨域"，真正的请求根本发不出去。</span>
        <span class="hl-c">// 所以 OPTIONS 一律放行（它通不通过 CORS 的检查，由 CorsConfig 负责）。</span>
        <span class="hl-c">// 把常量写在前面 "OPTIONS".equals(...)：即使 getMethod() 为 null 也不会报空指针。</span>
        <span class="hl-k">if</span> (<span class="hl-s">"OPTIONS"</span>.equals(request.getMethod())) {
            <span class="hl-k">return</span> <span class="hl-k">true</span>;
        }

        <span class="hl-c">// 读取请求头 Authorization 的内容。前端没带这个头，得到 null。</span>
        <span class="hl-t">String</span> authorization = request.getHeader(<span class="hl-s">"Authorization"</span>);

        <span class="hl-c">// 必须同时满足：① 头存在（不是 null，要先判断，否则下一句会空指针）；② 以 "Bearer " 开头（注意有一个空格）。</span>
        <span class="hl-k">if</span> (authorization != <span class="hl-k">null</span> &amp;&amp; authorization.startsWith(<span class="hl-s">"Bearer "</span>)) {
            <span class="hl-c">// substring(n)：截取从第 n 个字符到末尾。"Bearer ".length() 是 7，所以去掉前 7 个字符，剩下纯 token。</span>
            <span class="hl-c">// jwtService.verify 检查三件事：签名对不对（有没有被篡改）、有没有过期、格式对不对。</span>
            <span class="hl-c">// 通过返回用户编号（Long），不通过返回 null。</span>
            <span class="hl-t">Long</span> userId = jwtService.verify(authorization.substring(<span class="hl-s">"Bearer "</span>.length()));

            <span class="hl-c">// 返回了编号，说明 token 是我们签发的、没被改过、没过期。</span>
            <span class="hl-k">if</span> (userId != <span class="hl-k">null</span>) {
                <span class="hl-c">// 把用户编号放进"这一次请求"的口袋里。后面的 Controller 用 @RequestAttribute("userId") 就能取出来。</span>
                <span class="hl-c">// 口袋只属于这一次请求，请求结束就丢掉，不同请求之间不会串。</span>
                request.setAttribute(<span class="hl-t">USER_ID</span>, userId);
                <span class="hl-k">return</span> <span class="hl-k">true</span>; <span class="hl-c">// 放行：继续去执行 Controller 方法</span>
            }
        }

        <span class="hl-c">// 走到这里，说明没带 token，或者 token 不合格：直接写出 401 回复，不让请求进入 Controller。</span>
        <span class="hl-c">// 401 Unauthorized 的含义是"你还没有通过身份验证"。（403 是"知道你是谁，但你没权限"，两者不同。）</span>
        response.setStatus(<span class="hl-t">HttpServletResponse</span>.<span class="hl-t">SC_UNAUTHORIZED</span>);        <span class="hl-c">// 状态码 401</span>
        response.setContentType(<span class="hl-s">"application/json;charset=UTF-8"</span>);      <span class="hl-c">// 告诉浏览器内容是 JSON，用 UTF-8 编码</span>
        response.getWriter().write(<span class="hl-s">"{\"error\":\"unauthorized\"}"</span>);     <span class="hl-c">// 写出回复内容（\" 是字符串里的双引号）</span>
        <span class="hl-k">return</span> <span class="hl-k">false</span>; <span class="hl-c">// 拦住：Controller 方法不会被执行</span>
    }
}</pre>
<pre data-key="GoogleTokenVerifier.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/GoogleTokenVerifier.java" data-lines="100"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// GoogleTokenVerifier.java —— 核对 Google 发来的"身份证明书"（idToken）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/auth/google.ts</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、为什么要核对</span>
<span class="hl-c">// 用户点击"用 Google 登录"，Google 会给前端一个 idToken（一串很长的文字），代表"Google 证明：这个人是某某"。</span>
<span class="hl-c">// 前端把它交给我们的后端。但前端传来的东西，任何人都可以伪造，所以后端必须核对它是不是 Google 真的签发的。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、核对的原理（密码学基础：数字签名）</span>
<span class="hl-c">// idToken 是一个 JWT，由 header.payload.signature 三段组成。</span>
<span class="hl-c">// Google 用它的"私钥"对内容生成了签名；任何人都可以用 Google 公开的"公钥"检查签名对不对：</span>
<span class="hl-c">//   · 签名对 → 内容没被改过，确实是 Google 签发的；</span>
<span class="hl-c">//   · 签名不对 → 伪造的。</span>
<span class="hl-c">// 私钥只有 Google 持有，所以别人造不出合格的签名。这个库（google-api-client）会自动去 Google 官网下载并缓存公钥。</span>
<span class="hl-c">// 它一共核对：签名、有没有过期、签发者是不是 Google、"受众(audience)"是不是我们自己的 Client ID。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、受众（audience）为什么重要</span>
<span class="hl-c">// 证明书里写着"这张证明是发给哪个应用的"。如果不核对，别的应用拿到的合格证明书也能拿来登录我们的系统。</span>
<span class="hl-c">// 所以我们设置 audience = 我们自己的 Client ID，不是发给我们的一律拒绝。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// GoogleIdToken：代表一张已解析的 Google 身份证明书。</span>
<span class="hl-k">import</span> com.google.api.client.googleapis.auth.oauth2.<span class="hl-t">GoogleIdToken</span>;
<span class="hl-c">// GoogleIdTokenVerifier：Google 官方提供的核对工具，我们用 Builder 构造它。</span>
<span class="hl-k">import</span> com.google.api.client.googleapis.auth.oauth2.<span class="hl-t">GoogleIdTokenVerifier</span>;
<span class="hl-c">// NetHttpTransport：用 Java 自带的网络功能发 HTTP 请求（用来下载 Google 公钥）。</span>
<span class="hl-k">import</span> com.google.api.client.http.javanet.<span class="hl-t">NetHttpTransport</span>;
<span class="hl-c">// GsonFactory：解析 JSON 的工具（证明书里的内容是 JSON）。</span>
<span class="hl-k">import</span> com.google.api.client.json.gson.<span class="hl-t">GsonFactory</span>;
<span class="hl-c">// Value：贴在参数/字段上，意思是"把配置文件里某个设置的值填进来"。</span>
<span class="hl-k">import</span> org.springframework.beans.factory.annotation.<span class="hl-t">Value</span>;
<span class="hl-c">// Component：贴在类上，请 Spring 创建这个类的对象放进仓库。</span>
<span class="hl-k">import</span> org.springframework.stereotype.<span class="hl-t">Component</span>;

<span class="hl-c">// IOException：网络读写出错（比如连不上 Google 下载公钥）。</span>
<span class="hl-k">import</span> java.io.<span class="hl-t">IOException</span>;
<span class="hl-c">// GeneralSecurityException：安全/加密相关的错误（比如签名算法出错）。</span>
<span class="hl-k">import</span> java.security.<span class="hl-t">GeneralSecurityException</span>;
<span class="hl-c">// Collections：集合工具类，下面用它造一个只含一个元素的列表。</span>
<span class="hl-k">import</span> java.util.<span class="hl-t">Collections</span>;

<span class="hl-c">// @Component：启动时 Spring 自动 new 一个，放进仓库；AuthController 的构造器需要它，Spring 会递过去。</span>
<span class="hl-a">@Component</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">GoogleTokenVerifier</span> {

    <span class="hl-c">// 核对通过后，返回给调用方的"用户资料"。record 是只装数据的简洁写法（自动生成构造器和取值方法）。</span>
    <span class="hl-c">// 写在类的里面，叫"嵌套类型"，外面用 GoogleTokenVerifier.GoogleUser 来称呼。</span>
    <span class="hl-c">//   sub     ：Google 给这个账号的唯一编号，永远不变，用来识别"同一个人"；</span>
    <span class="hl-c">//   email   ：邮箱；name：名字；picture：头像地址。</span>
    <span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">GoogleUser</span>(<span class="hl-t">String</span> sub, <span class="hl-t">String</span> email, <span class="hl-t">String</span> name, <span class="hl-t">String</span> picture) {}

    <span class="hl-c">// Google 官方的核对工具对象。final：只在构造器里创建一次，之后所有请求共用。</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">GoogleIdTokenVerifier</span> verifier;

    <span class="hl-c">// 构造器。@Value("${google.client-id}")：Spring 创建对象时，去 application.properties 里</span>
    <span class="hl-c">// 找 google.client-id 这一项，把它的值填进参数 clientId。</span>
    <span class="hl-c">// 这样 Client ID 写在配置文件里，不写死在代码中；换一个 Client ID 只改配置，不用改代码。</span>
    <span class="hl-k">public</span> <span class="hl-t">GoogleTokenVerifier</span>(<span class="hl-a">@Value</span>(<span class="hl-s">"${google.client-id}"</span>) <span class="hl-t">String</span> clientId) {
        <span class="hl-c">// Builder 模式：先用 Builder 一项项设置，最后 .build() 得到成品。</span>
        <span class="hl-c">// new NetHttpTransport()：负责联网下载 Google 的公钥；</span>
        <span class="hl-c">// GsonFactory.getDefaultInstance()：负责解析 JSON。</span>
        <span class="hl-k">this</span>.verifier = <span class="hl-k">new</span> <span class="hl-t">GoogleIdTokenVerifier</span>.<span class="hl-t">Builder</span>(<span class="hl-k">new</span> <span class="hl-t">NetHttpTransport</span>(), <span class="hl-t">GsonFactory</span>.getDefaultInstance())
                <span class="hl-c">// 设置"受众"：只接受发给我们这个 Client ID 的证明书。需要一个列表，所以用 singletonList 包成只有一项的列表。</span>
                .setAudience(<span class="hl-t">Collections</span>.singletonList(clientId))
                .build();
    }

    <span class="hl-c">// 核对一张证明书。参数：前端传来的 idToken 字符串。</span>
    <span class="hl-c">// 返回：核对通过 → 用户资料；不通过 → null。这样调用方只需判断"是不是 null"。</span>
    <span class="hl-k">public</span> <span class="hl-t">GoogleUser</span> verify(<span class="hl-t">String</span> idTokenString) {
        <span class="hl-c">// 前端没传，或传了空白字符串，直接判为无效，不必联网。isBlank()：空或只有空格。</span>
        <span class="hl-k">if</span> (idTokenString == <span class="hl-k">null</span> || idTokenString.isBlank()) <span class="hl-k">return</span> <span class="hl-k">null</span>;
        <span class="hl-k">try</span> {
            <span class="hl-c">// 真正的核对：检查签名、过期时间、签发者、受众。</span>
            <span class="hl-c">// 通过返回 GoogleIdToken 对象，不通过返回 null；联网出问题则抛异常。</span>
            <span class="hl-t">GoogleIdToken</span> idToken = verifier.verify(idTokenString);
            <span class="hl-k">if</span> (idToken == <span class="hl-k">null</span>) <span class="hl-k">return</span> <span class="hl-k">null</span>;   <span class="hl-c">// 核对没通过</span>

            <span class="hl-c">// 取出证明书里的内容（payload，即"载荷"），里面是 Google 对这个人的声明。</span>
            <span class="hl-t">GoogleIdToken</span>.<span class="hl-t">Payload</span> p = idToken.getPayload();
            <span class="hl-c">// 只接受"邮箱已经被 Google 验证过"的账号，防止有人用没验证的邮箱冒充。</span>
            <span class="hl-c">// Boolean.TRUE.equals(x)：x 是 true 才为真；x 是 false 或 null 都为假（比 x == true 安全，不会空指针）。</span>
            <span class="hl-k">if</span> (!<span class="hl-t">Boolean</span>.<span class="hl-t">TRUE</span>.equals(p.getEmailVerified())) <span class="hl-k">return</span> <span class="hl-k">null</span>;

            <span class="hl-c">// 把需要的字段取出来，包成我们自己的 GoogleUser 返回。</span>
            <span class="hl-k">return</span> <span class="hl-k">new</span> <span class="hl-t">GoogleUser</span>(
                    p.getSubject(),             <span class="hl-c">// sub：Google 给这个账号的唯一编号，永远不变</span>
                    p.getEmail(),               <span class="hl-c">// 邮箱</span>
                    (<span class="hl-t">String</span>) p.get(<span class="hl-s">"name"</span>),     <span class="hl-c">// 名字：p.get 返回 Object，(String) 是强制类型转换</span>
                    (<span class="hl-t">String</span>) p.get(<span class="hl-s">"picture"</span>)); <span class="hl-c">// 头像地址</span>
        } <span class="hl-k">catch</span> (<span class="hl-t">GeneralSecurityException</span> | <span class="hl-t">IOException</span> | <span class="hl-t">IllegalArgumentException</span> e) {
            <span class="hl-c">// 核对过程中出了任何问题（签名算法错误、连不上 Google、证明书格式不对），一律当作"证明书无效"。</span>
            <span class="hl-c">// | 表示"这几种异常都用同一段处理"。</span>
            <span class="hl-k">return</span> <span class="hl-k">null</span>;
        }
    }
}</pre>
<pre data-key="JwtService.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/JwtService.java" data-lines="98"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// JwtService.java —— 发放和验证"我们自己的通行证"（JWT token）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/auth/jwt.ts</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、为什么有两种 token</span>
<span class="hl-c">// Google 的 idToken 只用来"证明你是谁"，用完就丢，只在登录那一刻用。</span>
<span class="hl-c">// 登录成功后，我们自己发一张 token，之后前端每次请求都带这张，不再找 Google。</span>
<span class="hl-c">// 好处：不依赖 Google 的网络、速度快，有效期和内容由我们自己决定。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、JWT 的结构</span>
<span class="hl-c">// token 是三段用点连起来的文字：header.payload.signature</span>
<span class="hl-c">//   header   ：说明用的签名算法（我们用 HS256）；</span>
<span class="hl-c">//   payload  ：内容。我们放：sub = 用户编号，iat = 签发时间，exp = 过期时间；</span>
<span class="hl-c">//   signature：签名。用"密钥 + 前两段内容"通过 HMAC-SHA256 算出来的一串值。</span>
<span class="hl-c">// 前两段只是 Base64 编码，不是加密，任何人都能解码看到内容。所以【绝对不要在 payload 里放密码等机密】。</span>
<span class="hl-c">// 它保证的不是"保密"，而是"防篡改"：谁改了 payload 里的任何一个字，签名就对不上，验证会失败。</span>
<span class="hl-c">// 而生成合格签名需要密钥，密钥只有服务器知道，别人伪造不了。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、HMAC 是什么</span>
<span class="hl-c">// HMAC = 用一把密钥给内容"盖章"的算法：同样的内容 + 同样的密钥，一定得到同样的结果；</span>
<span class="hl-c">// 改动内容或换了密钥，结果就完全不同。服务器验证时重新算一遍，对不上就是假的。</span>
<span class="hl-c">// 所以【密钥必须保密且足够长】，泄露了别人就能给自己签任意用户的 token。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// JWT：java-jwt 库的入口类，用它来造 token（JWT.create()）和验 token（JWT.require()）。</span>
<span class="hl-k">import</span> com.auth0.jwt.<span class="hl-t">JWT</span>;
<span class="hl-c">// Algorithm：签名算法的封装，比如 Algorithm.HMAC256(密钥)。</span>
<span class="hl-k">import</span> com.auth0.jwt.algorithms.<span class="hl-t">Algorithm</span>;
<span class="hl-c">// JWTVerificationException：验证失败时抛出的异常（签名不对、过期、格式错误等都是它的子类）。</span>
<span class="hl-k">import</span> com.auth0.jwt.exceptions.<span class="hl-t">JWTVerificationException</span>;
<span class="hl-c">// Value：把配置文件里的设置值填进参数。</span>
<span class="hl-k">import</span> org.springframework.beans.factory.annotation.<span class="hl-t">Value</span>;
<span class="hl-c">// Service：和 @Component 作用相同，只是表示"这是业务逻辑/服务类"，让代码更易读。</span>
<span class="hl-k">import</span> org.springframework.stereotype.<span class="hl-t">Service</span>;

<span class="hl-c">// Instant：表示时间线上的一个精确时刻（UTC），适合记录签发和过期时间。</span>
<span class="hl-k">import</span> java.time.<span class="hl-t">Instant</span>;
<span class="hl-c">// ChronoUnit：时间单位（天、小时、秒……），用来做"加几天"的计算。</span>
<span class="hl-k">import</span> java.time.temporal.<span class="hl-t">ChronoUnit</span>;

<span class="hl-c">// @Service：Spring 启动时 new 一个放进仓库。AuthInterceptor 和 AuthController 的构造器都需要它，</span>
<span class="hl-c">// 它们拿到的是同一个对象（整个程序里只有一个 JwtService）。</span>
<span class="hl-a">@Service</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">JwtService</span> {

    <span class="hl-c">// token 的有效期：7 天。static final：属于类、不可修改的常量。过期后用户需要重新登录。</span>
    <span class="hl-c">// 为什么不设很久：token 一旦被偷，对方在有效期内都能冒充用户，期限越短风险越小。</span>
    <span class="hl-k">private</span> <span class="hl-k">static</span> <span class="hl-k">final</span> long <span class="hl-t">EXPIRE_DAYS</span> = 7;

    <span class="hl-c">// 签名算法对象（已经装好了密钥），签名和验证都用它。</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">Algorithm</span> algo;

    <span class="hl-c">// 构造器。@Value("${app.jwt-secret}")：从 application.properties 读 app.jwt-secret 的值作为密钥。</span>
    <span class="hl-c">// 线上这个值来自环境变量 APP_JWT_SECRET（配置文件里写的是 ${APP_JWT_SECRET:默认值}），</span>
    <span class="hl-c">// 线上必须设置成一长串随机字符，绝不能用默认值，也绝不能提交到 GitHub。</span>
    <span class="hl-k">public</span> <span class="hl-t">JwtService</span>(<span class="hl-a">@Value</span>(<span class="hl-s">"${app.jwt-secret}"</span>) <span class="hl-t">String</span> secret) {
        <span class="hl-c">// HMAC256：用 HMAC-SHA256 算法，用 secret 作为密钥。</span>
        <span class="hl-k">this</span>.algo = <span class="hl-t">Algorithm</span>.<span class="hl-t">HMAC256</span>(secret);
    }

    <span class="hl-c">// 发 token：给一个用户编号，返回一个 token 字符串。</span>
    <span class="hl-k">public</span> <span class="hl-t">String</span> create(long userId) {
        <span class="hl-c">// 取当前时刻。先存成变量，是为了"签发时间"和"过期时间"基于同一个时刻计算。</span>
        <span class="hl-t">Instant</span> now = <span class="hl-t">Instant</span>.now();

        <span class="hl-c">// 链式调用：一项项设置 payload，最后 sign 签名得到完整 token。</span>
        <span class="hl-k">return</span> <span class="hl-t">JWT</span>.create()
                <span class="hl-c">// sub（subject，主题）：这张 token 属于谁。放用户编号。payload 里放字符串，所以把数字转成文字。</span>
                .withSubject(<span class="hl-t">String</span>.valueOf(userId))
                <span class="hl-c">// iat（issued at）：签发时间。</span>
                .withIssuedAt(now)
                <span class="hl-c">// exp（expires at）：过期时间 = 现在 + 7 天。验证时库会自动检查，过期的直接判为无效。</span>
                .withExpiresAt(now.plus(<span class="hl-t">EXPIRE_DAYS</span>, <span class="hl-t">ChronoUnit</span>.<span class="hl-t">DAYS</span>))
                <span class="hl-c">// 用密钥签名，生成最后一段 signature，并把三段拼成完整字符串。</span>
                .sign(algo);
    }

    <span class="hl-c">// 验 token：合格返回用户编号，不合格返回 null。</span>
    <span class="hl-c">// 返回 Long（对象，可以是 null）而不是 long（基本类型，不能是 null），是为了能用 null 表示"不合格"。</span>
    <span class="hl-k">public</span> <span class="hl-t">Long</span> verify(<span class="hl-t">String</span> token) {
        <span class="hl-k">try</span> {
            <span class="hl-c">// JWT.require(algo).build()：造一个验证器，要求用同样的算法和密钥。</span>
            <span class="hl-c">// .verify(token)：验证 ——</span>
            <span class="hl-c">//    ① 重新计算签名，和 token 里带的对比（防篡改）；</span>
            <span class="hl-c">//    ② 检查 exp 有没有过期；</span>
            <span class="hl-c">//    ③ 格式是否合规。</span>
            <span class="hl-c">// 任何一项不过，抛 JWTVerificationException。通过则返回解码后的内容。</span>
            <span class="hl-c">// .getSubject()：取出 sub（用户编号，文字），Long.valueOf 把它转回数字。</span>
            <span class="hl-k">return</span> <span class="hl-t">Long</span>.valueOf(<span class="hl-t">JWT</span>.require(algo).build().verify(token).getSubject());
        } <span class="hl-k">catch</span> (<span class="hl-t">JWTVerificationException</span> e) {
            <span class="hl-c">// 验证失败（被篡改、过期、乱写的文字）：统一返回 null，由调用方决定怎么回复（通常是 401）。</span>
            <span class="hl-k">return</span> <span class="hl-k">null</span>;
        }
    }
}</pre>
<pre data-key="AuthController.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/AuthController.java" data-lines="137"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// AuthController.java —— 登录接口 POST /auth/google 和 "我是谁" 接口 GET /me</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/routes/auth.ts</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、登录流程（四步）</span>
<span class="hl-c">//   ① 把前端发来的 Google 证明书交给 GoogleTokenVerifier 核对，不通过就 401；</span>
<span class="hl-c">//   ② 按 Google 给的唯一编号 sub 去数据库找用户，没有就新建</span>
<span class="hl-c">//      （所以"注册"和"登录"是同一个流程，用户不需要单独注册）；</span>
<span class="hl-c">//   ③ 用我们数据库里的用户编号，发一张我们自己的 token（Google 的证明书到此用完）；</span>
<span class="hl-c">//   ④ 返回 token 和用户信息。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、之后前端怎么用</span>
<span class="hl-c">// 前端把 token 存起来（localStorage），以后每次请求头带 Authorization: Bearer &lt;token&gt;。</span>
<span class="hl-c">// 打开页面时调用 GET /me 问"我现在是谁"，用来恢复登录状态。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// HttpStatus：HTTP 状态码的枚举，写 HttpStatus.UNAUTHORIZED 比直接写数字 401 更易读。</span>
<span class="hl-k">import</span> org.springframework.http.<span class="hl-t">HttpStatus</span>;
<span class="hl-c">// ResponseEntity：封装完整的 HTTP 回复（状态码 + 内容）。</span>
<span class="hl-k">import</span> org.springframework.http.<span class="hl-t">ResponseEntity</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">GetMapping</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">PostMapping</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RequestBody</span>;
<span class="hl-c">// RequestHeader：取出请求头里的某一项。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RequestHeader</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RestController</span>;

<span class="hl-c">// Map：键值对集合。Map.of("error", "xxx") 会被转成 JSON {"error":"xxx"}。</span>
<span class="hl-k">import</span> java.util.<span class="hl-t">Map</span>;

<span class="hl-a">@RestController</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">AuthController</span> {

    <span class="hl-c">// ---- 三个"数据形状"，用 record 写在类里面，因为只有这个 Controller 用 ----</span>

    <span class="hl-c">// 登录请求体的形状。前端发来 {"idToken":"..."}，只取 idToken，别的多余字段会被丢掉。</span>
    <span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">GoogleLoginRequest</span>(<span class="hl-t">String</span> idToken) {}

    <span class="hl-c">// 返回给前端的"用户资料"。只包含前端需要的字段，没有 googleSub 等内部信息：返回的越少越安全。</span>
    <span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">UserView</span>(<span class="hl-t">Long</span> id, <span class="hl-t">String</span> email, <span class="hl-t">String</span> name, <span class="hl-t">String</span> picture) {}

    <span class="hl-c">// 登录成功的回复：{"token":"...","user":{...}}。</span>
    <span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">LoginResponse</span>(<span class="hl-t">String</span> token, <span class="hl-t">UserView</span> user) {}

    <span class="hl-c">// ---- 三个"零件"，都由 Spring 通过构造器递进来（依赖注入）----</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">GoogleTokenVerifier</span> googleTokenVerifier; <span class="hl-c">// 负责向 Google 核对证明书</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">AppUserRepository</span> userRepository;        <span class="hl-c">// 负责读写数据库里的 app_user 表</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">JwtService</span> jwtService;                   <span class="hl-c">// 负责发 token、验 token</span>

    <span class="hl-c">// 构造器：Spring 创建 AuthController 时，看到它需要这三样，就去仓库里找（它们分别贴了 @Component、</span>
    <span class="hl-c">// 是 Spring Data 自动生成的、贴了 @Service）并按顺序传进来。</span>
    <span class="hl-k">public</span> <span class="hl-t">AuthController</span>(<span class="hl-t">GoogleTokenVerifier</span> googleTokenVerifier,
                          <span class="hl-t">AppUserRepository</span> userRepository,
                          <span class="hl-t">JwtService</span> jwtService) {
        <span class="hl-k">this</span>.googleTokenVerifier = googleTokenVerifier;
        <span class="hl-k">this</span>.userRepository = userRepository;
        <span class="hl-k">this</span>.jwtService = jwtService;
    }

    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-c">// POST /auth/google —— 登录</span>
    <span class="hl-c">// ResponseEntity&lt;?&gt;：问号表示"回复内容的类型不固定"（成功时是 LoginResponse，失败时是 Map），所以用通配符。</span>
    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-a">@PostMapping</span>(<span class="hl-s">"/auth/google"</span>)
    <span class="hl-k">public</span> <span class="hl-t">ResponseEntity</span>&lt;?&gt; googleLogin(<span class="hl-a">@RequestBody</span> <span class="hl-t">GoogleLoginRequest</span> body) {

        <span class="hl-c">// ① 核对证明书。通过返回用户资料 g，不通过返回 null。</span>
        <span class="hl-t">GoogleTokenVerifier</span>.<span class="hl-t">GoogleUser</span> g = googleTokenVerifier.verify(body.idToken());

        <span class="hl-k">if</span> (g == <span class="hl-k">null</span>) {
            <span class="hl-c">// 401：未通过身份验证。回复内容 {"error":"invalid_google_token"}。</span>
            <span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.status(<span class="hl-t">HttpStatus</span>.<span class="hl-t">UNAUTHORIZED</span>).body(<span class="hl-t">Map</span>.of(<span class="hl-s">"error"</span>, <span class="hl-s">"invalid_google_token"</span>));
        }

        <span class="hl-c">// ② 找或建用户。</span>
        <span class="hl-c">// findByGoogleSub 返回 Optional：有就是已有的用户；</span>
        <span class="hl-c">// orElseGet(() -&gt; ...)：没有时才执行箭头函数里的代码——新建一个 AppUser 并 save（INSERT）。</span>
        <span class="hl-c">// 局限：这是"先查后写"，同一个人第一次登录时如果同时发出两个请求，</span>
        <span class="hl-c">// 可能两个都查不到、都去插入，第二个会撞上 google_sub 的唯一约束报错。</span>
        <span class="hl-c">// 这叫"竞态条件"。Node 版改成了"INSERT ... ON CONFLICT DO NOTHING 再查询"来避免它。</span>
        <span class="hl-t">AppUser</span> user = userRepository.findByGoogleSub(g.sub())
                .orElseGet(() -&gt; userRepository.save(<span class="hl-k">new</span> <span class="hl-t">AppUser</span>(g.sub(), g.email(), g.name(), g.picture())));

        <span class="hl-c">// ③ 用我们系统里的用户编号发 token。注意用的是 user.getId()（我们数据库的编号），不是 Google 的 sub。</span>
        <span class="hl-c">// 这样以后就算换掉 Google 登录，我们自己系统的身份体系也不用动。</span>
        <span class="hl-t">String</span> token = jwtService.create(user.getId());

        <span class="hl-c">// ④ 200 + 回复内容（token 和用户信息，会被自动转成 JSON）。</span>
        <span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.ok(<span class="hl-k">new</span> <span class="hl-t">LoginResponse</span>(token, toView(user)));
    }

    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-c">// GET /me —— 我是谁</span>
    <span class="hl-c">// 这个路径没有登记到拦截器，所以在方法内部自己验证 token（Node 版直接复用了门卫）。</span>
    <span class="hl-c">// @RequestHeader(value = "Authorization", required = false)：取请求头 Authorization 的值；</span>
    <span class="hl-c">//   required = false 表示"没带这个头也不要报错"，没带时得到 null，由我们自己返回 401。</span>
    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-a">@GetMapping</span>(<span class="hl-s">"/me"</span>)
    <span class="hl-k">public</span> <span class="hl-t">ResponseEntity</span>&lt;?&gt; me(<span class="hl-a">@RequestHeader</span>(value = <span class="hl-s">"Authorization"</span>, required = <span class="hl-k">false</span>) <span class="hl-t">String</span> authorization) {

        <span class="hl-c">// 没带请求头，或格式不是 "Bearer xxx"：当作没登录。</span>
        <span class="hl-k">if</span> (authorization == <span class="hl-k">null</span> || !authorization.startsWith(<span class="hl-s">"Bearer "</span>)) {
            <span class="hl-k">return</span> unauthorized();
        }

        <span class="hl-c">// 去掉前 7 个字符 "Bearer "，剩下纯 token。</span>
        <span class="hl-t">String</span> token = authorization.substring(<span class="hl-s">"Bearer "</span>.length());

        <span class="hl-c">// 验证 token：通过返回用户编号，不通过返回 null。</span>
        <span class="hl-t">Long</span> userId = jwtService.verify(token);
        <span class="hl-k">if</span> (userId == <span class="hl-k">null</span>) {
            <span class="hl-k">return</span> unauthorized();
        }

        <span class="hl-c">// 按编号找用户。.&lt;ResponseEntity&lt;?&gt;&gt;map(...) 是显式指定转换后的类型，避免编译器推断出错。</span>
        <span class="hl-c">//   找到了 → 返回 200 + 用户资料；</span>
        <span class="hl-c">//   没找到（token 是真的，但用户后来被删了）→ orElseGet 执行 unauthorized，当作没登录。</span>
        <span class="hl-c">// this::unauthorized 是方法引用，等价于 () -&gt; this.unauthorized()。</span>
        <span class="hl-k">return</span> userRepository.findById(userId)
                .&lt;<span class="hl-t">ResponseEntity</span>&lt;?&gt;&gt;map(u -&gt; <span class="hl-t">ResponseEntity</span>.ok(toView(u)))
                .orElseGet(<span class="hl-k">this</span>::unauthorized);
    }

    <span class="hl-c">// 把数据库里的用户（字段多）转成给前端看的版本（只带需要的字段）。</span>
    <span class="hl-c">// 单独写成方法，是为了登录和 /me 两处不重复。private：只在本类内使用。</span>
    <span class="hl-k">private</span> <span class="hl-t">UserView</span> toView(<span class="hl-t">AppUser</span> u) {
        <span class="hl-k">return</span> <span class="hl-k">new</span> <span class="hl-t">UserView</span>(u.getId(), u.getEmail(), u.getName(), u.getPicture());
    }

    <span class="hl-c">// 统一生成 401 回复 {"error":"unauthorized"}，避免多处重复写。</span>
    <span class="hl-k">private</span> <span class="hl-t">ResponseEntity</span>&lt;?&gt; unauthorized() {
        <span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.status(<span class="hl-t">HttpStatus</span>.<span class="hl-t">UNAUTHORIZED</span>).body(<span class="hl-t">Map</span>.of(<span class="hl-s">"error"</span>, <span class="hl-s">"unauthorized"</span>));
    }
}</pre>
<pre data-key="AppUser.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/AppUser.java" data-lines="75"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// AppUser.java —— 用户表 app_user 对应的 Java 类</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/db/schema.ts 里的 appUser</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、什么是 JPA / Hibernate / ORM</span>
<span class="hl-c">// 关系型数据库里存的是表和行，Java 里用的是类和对象，两者的"语言"不同。</span>
<span class="hl-c">// ORM（对象关系映射）负责在两边翻译：一个类 ↔ 一张表，一个对象 ↔ 一行，一个字段 ↔ 一列。</span>
<span class="hl-c">// JPA 是 Java 规定的标准写法（@Entity 等标签），Hibernate 是实际干活的实现。</span>
<span class="hl-c">// 我们在类上贴标签，Hibernate 启动时对照这个类帮我们建表（ddl-auto=update），</span>
<span class="hl-c">// 之后保存对象时自动生成 INSERT，读取时自动生成 SELECT，我们几乎不用手写 SQL。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、为什么表名叫 app_user 而不叫 user</span>
<span class="hl-c">// user 在很多数据库里是保留字（有特殊含义的词），拿来当表名会出错。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// jakarta.persistence.*：JPA 的所有标签（@Entity、@Table、@Id、@Column 等），用 * 一次全部导入。</span>
<span class="hl-k">import</span> jakarta.persistence.*;
<span class="hl-c">// Instant：时间线上的一个精确时刻。</span>
<span class="hl-k">import</span> java.time.<span class="hl-t">Instant</span>;

<span class="hl-c">// @Entity：这个类对应数据库里的一张表。Hibernate 会管理它的对象。</span>
<span class="hl-a">@Entity</span>  <span class="hl-c">// 便利贴：这个类对应数据库里的一张表</span>
<span class="hl-c">// @Table(name = "app_user")：指定表名。不写的话默认用类名。</span>
<span class="hl-a">@Table</span>(name = <span class="hl-s">"app_user"</span>)
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">AppUser</span> {

    <span class="hl-c">// @Id：这个字段是主键（每一行的唯一编号，用来精确指向某一行）。</span>
    <span class="hl-a">@Id</span>
    <span class="hl-c">// @GeneratedValue(strategy = IDENTITY)：编号由数据库自己递增生成（1、2、3……），我们不用手动设置。</span>
    <span class="hl-c">// 对象刚 new 出来时 id 是 null，保存（INSERT）之后，数据库生成的编号会被填回这个字段。</span>
    <span class="hl-a">@GeneratedValue</span>(strategy = <span class="hl-t">GenerationType</span>.<span class="hl-t">IDENTITY</span>)
    <span class="hl-c">// Long（大写）是对象类型，可以是 null，适合"还没保存、还没有编号"的状态。</span>
    <span class="hl-k">private</span> <span class="hl-t">Long</span> id;  <span class="hl-c">// 我们自己系统里的用户编号，由数据库生成</span>

    <span class="hl-c">// @Column(unique = true, nullable = false)：</span>
    <span class="hl-c">//   unique = true  → 数据库保证这一列不会有两行相同的值（同一个 Google 账号只能对应一个用户）；</span>
    <span class="hl-c">//   nullable = false → 这一列不允许为空。</span>
    <span class="hl-c">// 字段名 googleSub 会按命名规则自动变成数据库里的列名 google_sub（驼峰 → 下划线）。</span>
    <span class="hl-c">// 存的是 Google 给账号的唯一编号 sub，永远不变，用它来识别"同一个人"。</span>
    <span class="hl-a">@Column</span>(unique = <span class="hl-k">true</span>, nullable = <span class="hl-k">false</span>)
    <span class="hl-k">private</span> <span class="hl-t">String</span> googleSub;

    <span class="hl-c">// 下面几项没有贴标签：默认就是普通列，允许为空。</span>
    <span class="hl-k">private</span> <span class="hl-t">String</span> email;     <span class="hl-c">// 邮箱：可能会变，所以只当资料，不当身份</span>
    <span class="hl-k">private</span> <span class="hl-t">String</span> name;      <span class="hl-c">// 显示的名字</span>
    <span class="hl-k">private</span> <span class="hl-t">String</span> picture;   <span class="hl-c">// 头像地址</span>
    <span class="hl-k">private</span> <span class="hl-t">Instant</span> createdAt;  <span class="hl-c">// 第一次登录的时间</span>

    <span class="hl-c">// 无参构造器：JPA 的要求。Hibernate 从数据库读出一行时，先用它 new 一个空对象，再把各列的值填进去。</span>
    <span class="hl-c">// protected：只给 Hibernate 和同包的类用，我们自己的代码不该调用它。</span>
    <span class="hl-k">protected</span> <span class="hl-t">AppUser</span>() {}  <span class="hl-c">// 给 JPA 从数据库读数据时用</span>

    <span class="hl-c">// 我们自己创建新用户时用的构造器。id 不用传，保存时由数据库生成。</span>
    <span class="hl-k">public</span> <span class="hl-t">AppUser</span>(<span class="hl-t">String</span> googleSub, <span class="hl-t">String</span> email, <span class="hl-t">String</span> name, <span class="hl-t">String</span> picture) {
        <span class="hl-k">this</span>.googleSub = googleSub;
        <span class="hl-k">this</span>.email = email;
        <span class="hl-k">this</span>.name = name;
        <span class="hl-k">this</span>.picture = picture;
        <span class="hl-k">this</span>.createdAt = <span class="hl-t">Instant</span>.now();  <span class="hl-c">// 创建这个对象的这一刻</span>
    }

    <span class="hl-c">// getter：取值方法。字段是 private 的（封装：外面不能随便改），要读就通过这些方法。</span>
    <span class="hl-c">// 这里只有 getter、没有 setter，说明用户资料创建后不让外部随意修改。</span>
    <span class="hl-c">// Jackson（转 JSON 的工具）也是通过 getter 找到字段的，不过我们返回给前端的是 UserView，不直接返回这个类，</span>
    <span class="hl-c">// 免得把内部信息（比如 googleSub）也一起暴露出去。</span>
    <span class="hl-k">public</span> <span class="hl-t">Long</span> getId() { <span class="hl-k">return</span> id; }
    <span class="hl-k">public</span> <span class="hl-t">String</span> getGoogleSub() { <span class="hl-k">return</span> googleSub; }
    <span class="hl-k">public</span> <span class="hl-t">String</span> getEmail() { <span class="hl-k">return</span> email; }
    <span class="hl-k">public</span> <span class="hl-t">String</span> getName() { <span class="hl-k">return</span> name; }
    <span class="hl-k">public</span> <span class="hl-t">String</span> getPicture() { <span class="hl-k">return</span> picture; }
    <span class="hl-k">public</span> <span class="hl-t">Instant</span> getCreatedAt() { <span class="hl-k">return</span> createdAt; }
}</pre>
<pre data-key="AppUserRepository.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/AppUserRepository.java" data-lines="40"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// AppUserRepository.java —— 操作用户表的"仓库"（数据访问层）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】auth.ts 里用 deps.db.select().from(appUser)... 写的查询</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、Repository 是什么</span>
<span class="hl-c">// 它是一个"接口"（只有方法声明，没有方法体）。神奇的是：我们一行实现代码都不写，</span>
<span class="hl-c">// Spring Data JPA 在启动时会自动生成一个实现类，并创建它的对象放进仓库，供别处注入使用。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、继承 JpaRepository&lt;AppUser, Long&gt; 就自带这些方法</span>
<span class="hl-c">//   save(user)     保存/更新      → INSERT / UPDATE</span>
<span class="hl-c">//   findById(id)   按主键查       → SELECT ... WHERE id = ?</span>
<span class="hl-c">//   findAll()      查全部         → SELECT *</span>
<span class="hl-c">//   deleteById(id) 按主键删       → DELETE</span>
<span class="hl-c">//   count()        数一共多少行</span>
<span class="hl-c">// 尖括号里的两个类型：&lt;AppUser, Long&gt; = 管理哪个实体（AppUser）、它的主键是什么类型（Long）。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、"按方法名自动生成查询"</span>
<span class="hl-c">// 想按别的条件查，只需按规则起方法名，Spring 解析名字生成 SQL：</span>
<span class="hl-c">//   findByGoogleSub = find（查）+ By + GoogleSub（googleSub 字段）</span>
<span class="hl-c">//   → SELECT * FROM app_user WHERE google_sub = ?</span>
<span class="hl-c">// 名字里的 GoogleSub 必须和 AppUser 类里的字段名对应，写错了启动时就会报错。</span>
<span class="hl-c">// 参数用 ? 占位（预编译），不是拼字符串，所以不会被 SQL 注入攻击。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// JpaRepository：Spring Data JPA 提供的"仓库"接口，带着上面那些现成方法。</span>
<span class="hl-k">import</span> org.springframework.data.jpa.repository.<span class="hl-t">JpaRepository</span>;
<span class="hl-c">// Optional：一个"盒子"，里面要么装着一个值，要么是空的。</span>
<span class="hl-k">import</span> java.util.<span class="hl-t">Optional</span>;

<span class="hl-k">public</span> <span class="hl-k">interface</span> <span class="hl-t">AppUserRepository</span> <span class="hl-k">extends</span> <span class="hl-t">JpaRepository</span>&lt;<span class="hl-t">AppUser</span>, <span class="hl-t">Long</span>&gt; {

    <span class="hl-c">// 按 Google 编号找用户。</span>
    <span class="hl-c">// 返回 Optional&lt;AppUser&gt; 而不是直接返回 AppUser：因为可能找不到（新用户第一次登录）。</span>
    <span class="hl-c">// Optional 逼着调用方正视"可能没有"，避免忘记判断而空指针。常用写法：</span>
    <span class="hl-c">//   .orElseGet(() -&gt; 找不到时执行这里创建) / .isPresent() / .orElse(默认值)</span>
    <span class="hl-t">Optional</span>&lt;<span class="hl-t">AppUser</span>&gt; findByGoogleSub(<span class="hl-t">String</span> googleSub);
}</pre>
<pre data-key="FavoriteWordController.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/FavoriteWordController.java" data-lines="149"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// FavoriteWordController.java —— 收藏本的四个接口：查、增、删、改</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/routes/favorites.ts</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、四个接口（REST 风格：用 HTTP 方法表示动作，用路径表示资源）</span>
<span class="hl-c">//   GET    /favorites        查看"我的"所有收藏</span>
<span class="hl-c">//   POST   /favorites        新增一条</span>
<span class="hl-c">//   DELETE /favorites/{id}   删除一条</span>
<span class="hl-c">//   PUT    /favorites/{id}   修改一条</span>
<span class="hl-c">// 全部需要登录：WebAuthConfig 把这些路径交给了 AuthInterceptor，没带合格 token 的请求走不到这里。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、核心安全原则（贯穿所有方法）</span>
<span class="hl-c">//   ① userId 一律来自 @RequestAttribute —— 那是拦截器验过 token 放进去的，可信；</span>
<span class="hl-c">//      绝不接受前端在请求体或网址里传 userId；</span>
<span class="hl-c">//   ② 删除、修改都用 findByIdAndUserId（编号 + 用户编号同时匹配），防止越权操作别人的数据。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、一次请求是怎么流转的（以 POST 为例）</span>
<span class="hl-c">//   浏览器 → Tomcat 收到 HTTP 请求 → CORS 检查 → AuthInterceptor 验 token →</span>
<span class="hl-c">//   Spring 把请求体 JSON 转成 NewFavoriteWord → 调用 add() → 返回值转成 JSON → 回复浏览器。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// ResponseEntity：对"HTTP 回复"的完整封装，能同时设置状态码、响应头、内容。</span>
<span class="hl-c">// 普通返回对象时，状态码固定是 200；要返回 400 等其它状态码，就用 ResponseEntity。</span>
<span class="hl-k">import</span> org.springframework.http.<span class="hl-t">ResponseEntity</span>;
<span class="hl-c">// 下面几个 xxxMapping：把"HTTP 方法 + 路径"登记到方法上。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">DeleteMapping</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">GetMapping</span>;
<span class="hl-c">// PathVariable：取出网址路径里 {id} 位置的那一段。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">PathVariable</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">PostMapping</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">PutMapping</span>;
<span class="hl-c">// RequestAttribute：取出请求"口袋"里的值（拦截器放进去的 userId）。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RequestAttribute</span>;
<span class="hl-c">// RequestBody：把请求体里的 JSON 转成 Java 对象。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RequestBody</span>;
<span class="hl-c">// RestController：这个类处理 HTTP 请求，返回值直接转成 JSON 作为回复。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RestController</span>;

<span class="hl-k">import</span> java.util.<span class="hl-t">List</span>;

<span class="hl-c">// @RestController：启动时 Spring 扫描到它，创建一个对象（整个程序只有这一个，所有请求共用它）。</span>
<span class="hl-c">// 因为是多个请求共用的，所以类里不要存"某个用户的临时数据"，否则会串。我们这里只存 repository，没有问题。</span>
<span class="hl-a">@RestController</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">FavoriteWordController</span> {

    <span class="hl-c">// 操作收藏表的仓库，由 Spring 通过构造器递进来。</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">FavoriteWordRepository</span> repository;

    <span class="hl-c">// 构造器注入：Spring 创建 Controller 时，自动找到 Spring Data 生成的 Repository 实现并传进来。</span>
    <span class="hl-k">public</span> <span class="hl-t">FavoriteWordController</span>(<span class="hl-t">FavoriteWordRepository</span> repository) {
        <span class="hl-k">this</span>.repository = repository;
    }

    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-c">// GET /favorites —— 查看我的所有收藏</span>
    <span class="hl-c">// @RequestAttribute(AuthInterceptor.USER_ID) Long userId：</span>
    <span class="hl-c">//   从请求口袋里取名为 "userId" 的值，赋给参数 userId。</span>
    <span class="hl-c">//   这个值是拦截器验证 token 之后放进去的（所以一定可信、一定存在）。</span>
    <span class="hl-c">// 返回 List&lt;FavoriteWord&gt;：Spring 自动把它转成 JSON 数组 [{...},{...}]，状态码 200。</span>
    <span class="hl-c">// 没有收藏时返回空数组 []，不是 null。</span>
    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-a">@GetMapping</span>(<span class="hl-s">"/favorites"</span>)
    <span class="hl-k">public</span> <span class="hl-t">List</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; list(<span class="hl-a">@RequestAttribute</span>(<span class="hl-t">AuthInterceptor</span>.<span class="hl-t">USER_ID</span>) <span class="hl-t">Long</span> userId) {
        <span class="hl-c">// 只查这个用户自己的：SELECT * FROM favorite_word WHERE user_id = ?</span>
        <span class="hl-k">return</span> repository.findByUserId(userId);
    }

    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-c">// POST /favorites —— 新增一条收藏</span>
    <span class="hl-c">// @RequestBody NewFavoriteWord request：把请求体 JSON 转成 NewFavoriteWord 对象。</span>
    <span class="hl-c">// 返回 ResponseEntity&lt;FavoriteWord&gt;：因为可能返回 400（参数不对）或 200（成功），所以需要它。</span>
    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-a">@PostMapping</span>(<span class="hl-s">"/favorites"</span>)
    <span class="hl-k">public</span> <span class="hl-t">ResponseEntity</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; add(<span class="hl-a">@RequestAttribute</span>(<span class="hl-t">AuthInterceptor</span>.<span class="hl-t">USER_ID</span>) <span class="hl-t">Long</span> userId,
                                            <span class="hl-a">@RequestBody</span> <span class="hl-t">NewFavoriteWord</span> request) {
        <span class="hl-c">// 校验前端数据（前端数据不可信，永远要在后端再检查一遍）。</span>
        <span class="hl-c">// kind 只能是 "w" 或 "p"。把字面量写在前面 "w".equals(...)：即使 request.kind() 是 null 也不会空指针。</span>
        boolean kindOk = <span class="hl-s">"w"</span>.equals(request.kind()) || <span class="hl-s">"p"</span>.equals(request.kind());
        <span class="hl-c">// word 不能是 null，也不能是空白（只有空格也算空白）。先判断 null 再调用 isBlank()，顺序不能反。</span>
        boolean wordOk = request.word() != <span class="hl-k">null</span> &amp;&amp; !request.word().isBlank();
        <span class="hl-k">if</span> (!kindOk || !wordOk) {
            <span class="hl-c">// 400 Bad Request：请求本身有问题（是前端的错）。.build() 表示不带回复内容。</span>
            <span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.badRequest().build();
        }

        <span class="hl-c">// trim()：去掉首尾空格。"  hello " 和 "hello" 应当被视为同一个词。</span>
        <span class="hl-t">String</span> word = request.word().trim();

        <span class="hl-c">// 状态没传（null）就用默认值 "unknown"。三元运算符：条件 ? 值1 : 值2。</span>
        <span class="hl-t">String</span> status = request.status() == <span class="hl-k">null</span> ? <span class="hl-s">"unknown"</span> : request.status();

        <span class="hl-c">// 查重：这个用户是不是已经收藏过这个词？</span>
        <span class="hl-c">// .orElse(null)：有就取出来，没有就得到 null。</span>
        <span class="hl-c">// 重复收藏时，直接返回已有的那条，不再新增一行（幂等：重复点击也不会出现重复数据）。</span>
        <span class="hl-c">// 这一步只是应用层的检查，并发时可能漏网；Node 版在数据库里加了联合唯一索引做兜底，更严谨。</span>
        <span class="hl-t">FavoriteWord</span> existing = repository.findByUserIdAndKindAndWord(userId, request.kind(), word).orElse(<span class="hl-k">null</span>);
        <span class="hl-k">if</span> (existing != <span class="hl-k">null</span>) {
            <span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.ok(existing);
        }

        <span class="hl-c">// 创建新对象。userId 用的是 token 里的（可信），不是前端传的。</span>
        <span class="hl-t">FavoriteWord</span> item = <span class="hl-k">new</span> <span class="hl-t">FavoriteWord</span>(userId, request.kind(), word, status);

        <span class="hl-c">// save：执行 INSERT。返回的对象带着数据库刚生成的 id。ResponseEntity.ok(...)：状态码 200，内容是这条收藏。</span>
        <span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.ok(repository.save(item));
    }

    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-c">// DELETE /favorites/{id} —— 删除一条收藏</span>
    <span class="hl-c">// 路径里的 {id} 是占位符：访问 /favorites/12 时，@PathVariable 把 12 取出来赋给参数 id。</span>
    <span class="hl-c">// 返回 void：没有内容，状态码 200。</span>
