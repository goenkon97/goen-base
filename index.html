    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-a">@DeleteMapping</span>(<span class="hl-s">"/favorites/{id}"</span>)
    <span class="hl-k">public</span> <span class="hl-k">void</span> delete(<span class="hl-a">@RequestAttribute</span>(<span class="hl-t">AuthInterceptor</span>.<span class="hl-t">USER_ID</span>) <span class="hl-t">Long</span> userId,
                       <span class="hl-a">@PathVariable</span> <span class="hl-t">Long</span> id) {
        <span class="hl-c">// 同时按编号和用户编号查：只有"这条存在，并且属于我"才会找到。</span>
        <span class="hl-c">// ifPresent：找到了才执行括号里的箭头函数（lambda）；找不到就什么都不做。</span>
        <span class="hl-c">// 想删别人的收藏？找不到，所以什么也不会发生。</span>
        <span class="hl-c">// 箭头函数 item -&gt; repository.delete(item)：参数 item 就是找到的那条，对它执行删除。</span>
        repository.findByIdAndUserId(id, userId).ifPresent(item -&gt; repository.delete(item));
    }

    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-c">// PUT /favorites/{id} —— 修改一条收藏（改单词内容和状态）</span>
    <span class="hl-c">// -------------------------------------------------------------------------</span>
    <span class="hl-a">@PutMapping</span>(<span class="hl-s">"/favorites/{id}"</span>)
    <span class="hl-k">public</span> <span class="hl-t">FavoriteWord</span> update(<span class="hl-a">@RequestAttribute</span>(<span class="hl-t">AuthInterceptor</span>.<span class="hl-t">USER_ID</span>) <span class="hl-t">Long</span> userId,
                               <span class="hl-a">@PathVariable</span> <span class="hl-t">Long</span> id,
                               <span class="hl-a">@RequestBody</span> <span class="hl-t">NewFavoriteWord</span> request) {
        <span class="hl-c">// 同样用"编号 + 用户编号"查：只能改自己的。找不到得到 null。</span>
        <span class="hl-t">FavoriteWord</span> item = repository.findByIdAndUserId(id, userId).orElse(<span class="hl-k">null</span>);

        <span class="hl-k">if</span> (item == <span class="hl-k">null</span>) {
            <span class="hl-c">// 找不到（不存在或不是我的）：返回 null，Spring 会回复 200 和空内容。</span>
            <span class="hl-c">// 更规范的做法是返回 404，这里为了保持简单没有做。</span>
            <span class="hl-k">return</span> <span class="hl-k">null</span>;
        }

        <span class="hl-c">// 修改对象里的值。注意：这里没有校验 word 是否为空、也没有处理改成已存在的词，属于待完善的地方。</span>
        item.setWord(request.word());
        item.setStatus(request.status());

        <span class="hl-c">// save：对象已有 id，Hibernate 就生成 UPDATE 语句（没有 id 才是 INSERT）。返回更新后的对象。</span>
        <span class="hl-k">return</span> repository.save(item);
    }
}</pre>
<pre data-key="NewFavoriteWord.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/NewFavoriteWord.java" data-lines="18"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// NewFavoriteWord.java —— 前端发来的"新增 / 修改收藏"的请求体的形状</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、为什么单独定义一个类，而不直接用 FavoriteWord</span>
<span class="hl-c">// 前端发来的数据【不可信】。如果直接接收 FavoriteWord，前端就可能顺手带上 id、userId，</span>
<span class="hl-c">// 试图指定自己是别人（越权）。所以专门定义一个只含"允许前端决定"的字段的类：</span>
<span class="hl-c">// 只有 kind、word、status，没有 id，也没有 userId（userId 只能来自验证过的 token）。</span>
<span class="hl-c">// 前端多传的字段会被忽略。这种"专门接收请求的数据类"常被称为 DTO（数据传输对象）。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、record 自动帮我们生成构造器和取值方法（request.kind()、request.word()、request.status()）。</span>
<span class="hl-c">// 前端发来的 JSON：{"kind":"w","word":"accommodation","status":"unknown"}</span>
<span class="hl-c">// Spring 里的 Jackson 会按字段名把它转成这个对象。缺的字段会是 null。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">NewFavoriteWord</span>(<span class="hl-t">String</span> kind, <span class="hl-t">String</span> word, <span class="hl-t">String</span> status) {
}</pre>
<pre data-key="FavoriteWord.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/FavoriteWord.java" data-lines="82"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// FavoriteWord.java —— 收藏表（表名默认 favorite_word）对应的 Java 类</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/db/schema.ts 里的 favoriteWord</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、一个对象 = 表里的一行</span>
<span class="hl-c">// 每收藏一个单词，就是一个 FavoriteWord 对象，保存后在数据库里变成一行：</span>
<span class="hl-c">//   id | user_id | kind | word           | status</span>
<span class="hl-c">//   1  | 3       | w    | accommodation  | unknown</span>
<span class="hl-c">// 所有用户的收藏都放在这一张表里，靠 user_id 区分"这条是谁的"，查询时用 WHERE user_id = ? 筛选。</span>
<span class="hl-c">// 这是关系型数据库的标准做法（一对多：一个用户有很多条收藏），不是"每人一张表"。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、字段名 → 列名的自动转换</span>
<span class="hl-c">// 驼峰命名的 userId，会自动变成数据库里下划线风格的 user_id。没有贴 @Table，所以表名默认是类名转换后的 favorite_word。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、这个类还会被直接转成 JSON 返回给前端</span>
<span class="hl-c">// 所以前端收到的每条收藏长这样：{"id":1,"kind":"w","word":"accommodation","status":"unknown"}。</span>
<span class="hl-c">// 注意：下面故意没有写 getUserId()，所以返回的 JSON 里不会出现 userId，不暴露多余信息。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// 下面四个标签都来自 JPA 标准。这里用逐个导入的写法（AppUser 里是用 * 一次导入全部，效果一样）。</span>
<span class="hl-c">// Entity：这个类对应一张表。</span>
<span class="hl-k">import</span> jakarta.persistence.<span class="hl-t">Entity</span>;
<span class="hl-c">// GeneratedValue：主键的值由谁生成。</span>
<span class="hl-k">import</span> jakarta.persistence.<span class="hl-t">GeneratedValue</span>;
<span class="hl-c">// GenerationType：生成方式的选项（IDENTITY、SEQUENCE 等）。</span>
<span class="hl-k">import</span> jakarta.persistence.<span class="hl-t">GenerationType</span>;
<span class="hl-c">// Id：标记主键字段。</span>
<span class="hl-k">import</span> jakarta.persistence.<span class="hl-t">Id</span>;

<span class="hl-c">// @Entity：Hibernate 启动时看到它，就会对照这个类去建表 / 更新表（ddl-auto=update）。</span>
<span class="hl-a">@Entity</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">FavoriteWord</span> {

    <span class="hl-c">// @Id：主键。每条收藏有自己的编号，用来精确指向某一条（比如删除第 12 条）。</span>
    <span class="hl-a">@Id</span>
    <span class="hl-c">// IDENTITY：编号由数据库自增（1、2、3……），我们不用管。</span>
    <span class="hl-a">@GeneratedValue</span>(strategy = <span class="hl-t">GenerationType</span>.<span class="hl-t">IDENTITY</span>)
    <span class="hl-k">private</span> <span class="hl-t">Long</span> id;

    <span class="hl-c">// 这条收藏属于哪个用户：存的是 app_user 表里的用户编号。</span>
    <span class="hl-c">// 查"我的收藏"就是 WHERE user_id = 我的编号。</span>
    <span class="hl-c">// 这里只是一个普通数字列，没有声明数据库级的外键约束（Node 版做了，所以 Node 版更严谨）。</span>
    <span class="hl-k">private</span> <span class="hl-t">Long</span> userId;

    <span class="hl-c">// 类型："w" 是单词（word），"p" 是短语（phrase）。由前端判断，后端在 Controller 里校验只能是这两个值。</span>
    <span class="hl-k">private</span> <span class="hl-t">String</span> kind;

    <span class="hl-c">// 单词或短语本身，比如 "accommodation"、"on the other hand"。</span>
    <span class="hl-k">private</span> <span class="hl-t">String</span> word;

    <span class="hl-c">// 状态，比如 "unknown"（不认识）。前端自己约定有哪些值。</span>
    <span class="hl-k">private</span> <span class="hl-t">String</span> status;

    <span class="hl-c">// 无参构造器：Hibernate 从数据库读出一行时，先 new 一个空对象再逐列填值，需要它。</span>
    <span class="hl-c">// protected：外部代码不该直接用空对象。</span>
    <span class="hl-k">protected</span> <span class="hl-t">FavoriteWord</span>() {
    }

    <span class="hl-c">// 我们自己创建新收藏时用的构造器。id 不用传：保存时数据库生成，并填回这个对象。</span>
    <span class="hl-k">public</span> <span class="hl-t">FavoriteWord</span>(<span class="hl-t">Long</span> userId, <span class="hl-t">String</span> kind, <span class="hl-t">String</span> word, <span class="hl-t">String</span> status) {
        <span class="hl-k">this</span>.userId = userId;
        <span class="hl-k">this</span>.kind = kind;
        <span class="hl-k">this</span>.word = word;
        <span class="hl-k">this</span>.status = status;
    }

    <span class="hl-c">// getter：Jackson 转 JSON 时靠它们找出要输出的字段（getKind → "kind"）。</span>
    <span class="hl-c">// 【注意】故意没有 getUserId()，所以 JSON 里不会有 userId。</span>
    <span class="hl-k">public</span> <span class="hl-t">Long</span> getId() { <span class="hl-k">return</span> id; }
    <span class="hl-k">public</span> <span class="hl-t">String</span> getKind() { <span class="hl-k">return</span> kind; }
    <span class="hl-k">public</span> <span class="hl-t">String</span> getWord() { <span class="hl-k">return</span> word; }
    <span class="hl-k">public</span> <span class="hl-t">String</span> getStatus() { <span class="hl-k">return</span> status; }

    <span class="hl-c">// setter：修改接口（PUT）需要改这两项，所以提供了 setter。</span>
    <span class="hl-c">// kind 和 userId 没有 setter：创建后不允许改（类型不变，也不能把收藏转给别人）。</span>
    <span class="hl-c">// 对一个已保存的对象调 setter 再 save，Hibernate 会生成 UPDATE 语句。</span>
    <span class="hl-k">public</span> <span class="hl-k">void</span> setWord(<span class="hl-t">String</span> word) { <span class="hl-k">this</span>.word = word; }
    <span class="hl-k">public</span> <span class="hl-k">void</span> setStatus(<span class="hl-t">String</span> status) { <span class="hl-k">this</span>.status = status; }
}</pre>
<pre data-key="FavoriteWordRepository.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/FavoriteWordRepository.java" data-lines="40"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// FavoriteWordRepository.java —— 操作收藏表的"仓库"</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】src/routes/favorites.ts 里的 deps.db.select()/insert()/delete()...</span>
<span class="hl-c">//</span>
<span class="hl-c">// 和 AppUserRepository 同一个套路：只写接口，不写实现，Spring Data JPA 按方法名自动生成 SQL。</span>
<span class="hl-c">// 方法名规则：find + By + 字段名，多个条件用 And 连接。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// JpaRepository：自带 save、findById、findAll、delete 等现成方法。</span>
<span class="hl-k">import</span> org.springframework.data.jpa.repository.<span class="hl-t">JpaRepository</span>;

<span class="hl-c">// List：有序列表，可以装多条结果。</span>
<span class="hl-k">import</span> java.util.<span class="hl-t">List</span>;
<span class="hl-c">// Optional：装 0 个或 1 个结果的盒子。</span>
<span class="hl-k">import</span> java.util.<span class="hl-t">Optional</span>;

<span class="hl-c">// &lt;FavoriteWord, Long&gt;：管理的实体是 FavoriteWord，主键类型是 Long。</span>
<span class="hl-k">public</span> <span class="hl-k">interface</span> <span class="hl-t">FavoriteWordRepository</span> <span class="hl-k">extends</span> <span class="hl-t">JpaRepository</span>&lt;<span class="hl-t">FavoriteWord</span>, <span class="hl-t">Long</span>&gt; {

    <span class="hl-c">// 查某个用户的全部收藏。</span>
    <span class="hl-c">// 生成的 SQL：SELECT * FROM favorite_word WHERE user_id = ?</span>
    <span class="hl-c">// 返回 List：可能有 0 条、1 条或很多条；没有时返回空列表（不是 null）。</span>
    <span class="hl-c">// 这是列表接口的核心——只返回"我的"，别人的收藏根本查不出来。</span>
    <span class="hl-t">List</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; findByUserId(<span class="hl-t">Long</span> userId);

    <span class="hl-c">// 按【收藏编号 + 用户编号】同时匹配来找一条。</span>
    <span class="hl-c">// 生成的 SQL：SELECT * FROM favorite_word WHERE id = ? AND user_id = ?</span>
    <span class="hl-c">// 【安全的关键】删除和修改都用它，而不是光按 id 找。</span>
    <span class="hl-c">// 这样用户 A 即使知道（或猜到）用户 B 的某条收藏编号，也找不到、改不了、删不掉别人的数据。</span>
    <span class="hl-c">// 不做这一步的漏洞叫 IDOR（不安全的对象直接引用），是最常见的越权漏洞之一。</span>
    <span class="hl-t">Optional</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; findByIdAndUserId(<span class="hl-t">Long</span> id, <span class="hl-t">Long</span> userId);

    <span class="hl-c">// 按【用户 + 类型 + 单词】找一条，用来判断"这个用户是不是已经收藏过这个词"。</span>
    <span class="hl-c">// 生成的 SQL：SELECT * FROM favorite_word WHERE user_id = ? AND kind = ? AND word = ?</span>
    <span class="hl-c">// 用于防止重复收藏。</span>
    <span class="hl-t">Optional</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; findByUserIdAndKindAndWord(<span class="hl-t">Long</span> userId, <span class="hl-t">String</span> kind, <span class="hl-t">String</span> word);
}</pre>
<pre data-key="HelloController.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/HelloController.java" data-lines="36"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// HelloController.java —— 我们写的第一个接口：GET /hello（练手用，上线时可以删）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Node 版】没有对应（Node 版没有带这个练习接口）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、这个文件的作用</span>
<span class="hl-c">// 验证"后端能跑、前端能连上"。访问 http://localhost:8080/hello，浏览器会看到：</span>
<span class="hl-c">//   {"message":"Hello,Ielts!","version":1}</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、什么是"接口"</span>
<span class="hl-c">// 前端和后端之间通过 HTTP 请求通信。一个请求由"方法 + 路径"决定要干什么，</span>
<span class="hl-c">// 后端要做的，就是为每一组"方法 + 路径"写一个处理方法。这里：GET + /hello → hello() 方法。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// GetMapping：贴在方法上的标签，意思是"当有人用 GET 方式访问某个网址时，调用这个方法"。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">GetMapping</span>;
<span class="hl-c">// RestController：贴在类上的标签，见下面类定义处的说明。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RestController</span>;

<span class="hl-c">// @RestController：告诉 Spring 两件事：</span>
<span class="hl-c">//   ① 这个类要在启动时被扫描到，并由 Spring 帮你 new 出一个对象放进容器（整个程序只有这一个对象，所有请求共用）；</span>
<span class="hl-c">//   ② 这个类里每个方法的返回值，直接作为 HTTP 回复的内容（对象会被自动转成 JSON），而不是去找一个 HTML 页面。</span>
<span class="hl-a">@RestController</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">HelloController</span> {
    <span class="hl-c">// @GetMapping("/hello")：Spring 启动时把"GET /hello"登记到网址表里，指向下面这个方法。</span>
    <span class="hl-c">// 请求到来时，Spring 查表找到它，调用它，再把返回值转成 JSON 发回给浏览器。</span>
    <span class="hl-a">@GetMapping</span>(<span class="hl-s">"/hello"</span>)
    <span class="hl-c">// 返回类型是 Greeting（见 Greeting.java）。方法名 hello 随便取，不影响网址。</span>
    <span class="hl-k">public</span> <span class="hl-t">Greeting</span> hello() {
        <span class="hl-c">// new Greeting(...)：按 Greeting 这张"图纸"造一个对象，两个参数依次对应 message 和 version。</span>
        <span class="hl-c">// 这个对象被返回后，Spring 里负责转 JSON 的 Jackson 会读出它的字段，变成 {"message":"Hello,Ielts!","version":1}。</span>
        <span class="hl-k">return</span> <span class="hl-k">new</span> <span class="hl-t">Greeting</span>(<span class="hl-s">"Hello,Ielts!"</span>,1);
    }
}</pre>
<pre data-key="Greeting.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/Greeting.java" data-lines="19"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// Greeting.java —— /hello 接口返回的数据的"形状"（练手用）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【什么是 record】</span>
<span class="hl-c">// record 是 Java 的一种特殊类，专门用来"只装数据"：括号里写出字段，Java 自动帮你生成</span>
<span class="hl-c">//   · 构造器（new Greeting("...", 1) 时用）；</span>
<span class="hl-c">//   · 同名的取值方法（greeting.message()、greeting.version()）；</span>
<span class="hl-c">//   · equals、hashCode、toString。</span>
<span class="hl-c">// 不用像传统的类那样自己写一大堆 get/set。record 里的值一旦创建就不能再改（不可变）。</span>
<span class="hl-c">// 返回它时，Spring 的 JSON 转换器（Jackson）会读出每个字段，生成 {"message":"...","version":1}。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-c">// public record Greeting(...)：声明一个 record。括号里每一项就是一个字段：</span>
<span class="hl-c">//   String message：文字，字段名 message；</span>
<span class="hl-c">//   int version：整数，字段名 version（int 是基本类型，永远有值，不能是 null）。</span>
<span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">Greeting</span>(<span class="hl-t">String</span> message, int version) {
}</pre>
<pre data-key="WrongItemController.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/WrongItemController.java" data-lines="90"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// WrongItemController.java —— 错题的增删改查（练手用，数据存在内存里）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 一、这是什么</span>
<span class="hl-c">// 我们学写接口的第一个练习：不连数据库，用一个 ArrayList（内存里的列表）存数据。</span>
<span class="hl-c">//   GET    /wrong-items        查看全部</span>
<span class="hl-c">//   POST   /wrong-items        新增</span>
<span class="hl-c">//   DELETE /wrong-items/{id}   删除</span>
<span class="hl-c">//   PUT    /wrong-items/{id}   修改</span>
<span class="hl-c">// 这些接口【没有】登录检查（WebAuthConfig 没登记它们），任何人都能访问。上线前应删除这几个练习文件。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、重要缺点（也是为什么后来要用数据库）</span>
<span class="hl-c">// 数据放在内存里：重启就丢；多个用户共享同一个列表；多线程同时修改还可能出错。</span>
<span class="hl-c">// 因为 Tomcat 同时用多个线程处理请求，两个请求同时改 ArrayList 是不安全的。</span>
<span class="hl-c">// 真正的项目里数据应当放数据库，由数据库保证并发时的正确性。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">GetMapping</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">PostMapping</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">DeleteMapping</span>;
<span class="hl-c">// PathVariable：取出路径里 {id} 那一段。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">PathVariable</span>;
<span class="hl-c">// RequestBody：把请求体 JSON 转成 Java 对象。</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RequestBody</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">RestController</span>;
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">PutMapping</span>;

<span class="hl-c">// ArrayList：可以动态增删的列表，数据存在内存里。</span>
<span class="hl-k">import</span> java.util.<span class="hl-t">ArrayList</span>;
<span class="hl-k">import</span> java.util.<span class="hl-t">List</span>;

<span class="hl-a">@RestController</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">WrongItemController</span> {

    <span class="hl-c">// 用来存所有错题的列表。&lt;WrongItem&gt;：规定里面只能放 WrongItem。</span>
    <span class="hl-c">// 因为 Controller 只有一个对象（所有请求共用），所以这个列表也是全体请求共用的。</span>
    <span class="hl-c">// new ArrayList&lt;&gt;()：尖括号里省略的类型由编译器自己推断。</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">List</span>&lt;<span class="hl-t">WrongItem</span>&gt; items = <span class="hl-k">new</span> <span class="hl-t">ArrayList</span>&lt;&gt;();
    <span class="hl-c">// 下一个要分配的编号。从 1 开始，每新增一条加 1。</span>
    <span class="hl-k">private</span> int nextId = 1;

    <span class="hl-c">// GET /wrong-items：直接返回整个列表，Spring 转成 JSON 数组。</span>
    <span class="hl-a">@GetMapping</span>(<span class="hl-s">"/wrong-items"</span>)
    <span class="hl-k">public</span> <span class="hl-t">List</span>&lt;<span class="hl-t">WrongItem</span>&gt; list() {
        <span class="hl-k">return</span> items;
    }

    <span class="hl-c">// POST /wrong-items：新增。</span>
    <span class="hl-a">@PostMapping</span>(<span class="hl-s">"/wrong-items"</span>)
    <span class="hl-k">public</span> <span class="hl-t">WrongItem</span> add(<span class="hl-a">@RequestBody</span> <span class="hl-t">NewWrongItem</span> request) {
        <span class="hl-c">// nextId++：先用当前值，再加 1。第一条得到 1，nextId 变成 2。</span>
        <span class="hl-c">// 编号由后端分配，前端不能决定。</span>
        <span class="hl-t">WrongItem</span> item = <span class="hl-k">new</span> <span class="hl-t">WrongItem</span>(nextId++, request.text());
        items.add(item);
        <span class="hl-c">// 返回新建的这一条（带着编号），前端就能知道它的编号。</span>
        <span class="hl-k">return</span> item;
    }

    <span class="hl-c">// DELETE /wrong-items/{id}：删除。</span>
    <span class="hl-a">@DeleteMapping</span>(<span class="hl-s">"/wrong-items/{id}"</span>)
    <span class="hl-k">public</span> <span class="hl-k">void</span> delete(<span class="hl-a">@PathVariable</span> int id) {

        <span class="hl-c">// removeIf：遍历列表，凡是满足条件的都删掉。</span>
        <span class="hl-c">// item -&gt; item.id() == id 是箭头函数：对每个 item，判断它的编号是否等于要删的 id。</span>
        items.removeIf(item -&gt; item.id() == id);
    }

    <span class="hl-c">// PUT /wrong-items/{id}：修改。</span>
    <span class="hl-a">@PutMapping</span>(<span class="hl-s">"/wrong-items/{id}"</span>)
    <span class="hl-k">public</span> <span class="hl-t">WrongItem</span> update(<span class="hl-a">@PathVariable</span> int id, <span class="hl-a">@RequestBody</span> <span class="hl-t">NewWrongItem</span> request) {

        <span class="hl-c">// 逐个查看，找到编号相同的那一条。</span>
        <span class="hl-k">for</span> (int i = 0; i &lt; items.size(); i++) {
            <span class="hl-k">if</span> (items.get(i).id() == id) {
                <span class="hl-c">// record 是不可变的（创建后不能改字段），所以不是改旧的，而是造一个新的替换。</span>
                <span class="hl-t">WrongItem</span> updated = <span class="hl-k">new</span> <span class="hl-t">WrongItem</span>(id, request.text());

                <span class="hl-c">// set(位置, 新对象)：把列表中第 i 个位置替换成新对象。</span>
                items.set(i, updated);

                <span class="hl-k">return</span> updated;
            }
        }

        <span class="hl-c">// 没找到：返回 null（Spring 回复 200 和空内容；更规范是返回 404）。</span>
        <span class="hl-k">return</span> <span class="hl-k">null</span>;
    }
}</pre>
<pre data-key="WrongItem.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/WrongItem.java" data-lines="13"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// WrongItem.java —— 一条错题（练手用，数据只存在内存里，重启就没了）</span>
<span class="hl-c">//</span>
<span class="hl-c">// record：只装数据的简洁写法，自动生成构造器、取值方法 id()、text()。</span>
<span class="hl-c">//   int id     ：错题编号，由后端分配；</span>
<span class="hl-c">//   String text：错题内容。</span>
<span class="hl-c">// 这是我们学 Controller 的第一个"增删改查"练习，数据没有存数据库。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">WrongItem</span>(int id, <span class="hl-t">String</span> text) {
}</pre>
<pre data-key="NewWrongItem.java" data-project="java" data-path="ielts-backend/src/main/java/com/goenkon/ielts/NewWrongItem.java" data-lines="11"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// NewWrongItem.java —— 前端发来的"新增 / 修改错题"的请求体（练手用）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 请求体 JSON：{"text":"这道题错了"}，Spring 自动转成这个对象，通过 request.text() 取值。</span>
<span class="hl-c">// 为什么不直接让前端传 WrongItem：编号 id 应该由后端分配，不该由前端决定。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-k">package</span> com.goenkon.ielts;

<span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">NewWrongItem</span>(<span class="hl-t">String</span> text) {
}</pre>
<pre data-key="src/index.ts" data-project="node" data-path="ielts-backend-node/src/index.ts" data-lines="69"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// index.ts —— 线上（Vercel）的入口文件</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】IeltsBackendApplication.java 里的 main 方法：整个程序从这里开始"点着"。</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、两种运行方式的区别（计算机基础，很重要）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// ① 传统方式（你的 Java 版、你本机的 dev/server.ts）：</span>
<span class="hl-c">//    程序是一个"进程"，启动后一直活着，占用一个端口（比如 8080），一直等请求。</span>
<span class="hl-c">//    进程一直占用内存，不管有没有人访问。要付"一直开着"的钱。</span>
<span class="hl-c">//</span>
<span class="hl-c">// ② 函数式/无服务器方式（Vercel）：</span>
<span class="hl-c">//    没有请求时，你的代码被暂停（甚至根本不存在）；请求来了才启动或唤醒，处理完又暂停。</span>
<span class="hl-c">//    只在处理请求时才计费。这就是免费额度能撑住的原因，也是"闲置后第一次请求会慢"的原因</span>
<span class="hl-c">//    （叫"冷启动"：要重新把你的代码加载进内存）。</span>
<span class="hl-c">//    所以这个文件里顶层的代码（不在任何函数里的），每次冷启动运行一次，</span>
<span class="hl-c">//    之后同一个实例处理多个请求时，会复用这里创建好的对象（数据库工具、密钥等）。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【Vercel 怎么用它】Vercel 会在 src/index.ts 这类约定好的位置寻找一个 Express 程序，</span>
<span class="hl-c">// 把它当作一个"函数"部署。我们只需要把 app 作为默认导出（export default）。</span>
<span class="hl-c">// 注意：这里不需要 app.listen(8080)。端口、HTTP 解析，都是 Vercel 平台替我们做的；</span>
<span class="hl-c">// 本地开发要自己监听端口，见 dev/server.ts。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// express：Web 框架（对应 Java 的 Spring MVC）。</span>
<span class="hl-c">// 这里是"默认导入"：import 名字 from "包名"，拿到那个包默认导出的东西。</span>
<span class="hl-k">import</span> express <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-c">// 下面是"具名导入"：{ } 里写要拿的东西的名字，必须和对方 export 的名字一致。</span>
<span class="hl-c">// "./auth/google.js" 这种以 ./ 开头的是本项目内的文件（相对路径）；不带 ./ 的（如 "express"）是 npm 安装的第三方包。</span>
<span class="hl-k">import</span> { createGoogleVerifier } <span class="hl-k">from</span> <span class="hl-s">"./auth/google.js"</span>; <span class="hl-c">// 造"向 Google 核对证明书"的函数</span>
<span class="hl-k">import</span> { createJwtService } <span class="hl-k">from</span> <span class="hl-s">"./auth/jwt.js"</span>; <span class="hl-c">// 造"发/验 token"的工具</span>
<span class="hl-k">import</span> { loadConfig } <span class="hl-k">from</span> <span class="hl-s">"./config.js"</span>; <span class="hl-c">// 读取环境变量配置</span>
<span class="hl-k">import</span> { createNeonDb } <span class="hl-k">from</span> <span class="hl-s">"./db/client.js"</span>; <span class="hl-c">// 造"连接 Neon 数据库"的工具</span>
<span class="hl-k">import</span> { createApp } <span class="hl-k">from</span> <span class="hl-s">"./create-app.js"</span>; <span class="hl-c">// 把所有零件装配成完整的 Express 程序</span>

<span class="hl-c">// 读取配置（环境变量）。</span>
<span class="hl-c">// 生产环境缺少密钥会直接抛错，让部署失败而不是带着隐患上线。</span>
<span class="hl-k">const</span> config = loadConfig();

<span class="hl-c">// 线上必须有数据库地址。没有的话，后面什么都做不了，所以立刻失败并说明原因。</span>
<span class="hl-c">// !config.databaseUrl：! 是"取反"。undefined 和空字符串都算"假"，取反后为真，于是进入 if。</span>
<span class="hl-k">if</span> (!config.databaseUrl) {
  <span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">Error</span>(<span class="hl-s">"缺少环境变量 DATABASE_URL（Neon 数据库的连接地址）"</span>);
}

<span class="hl-c">// 在这里把零件一个个造好，递给 createApp。</span>
<span class="hl-c">// 这就是 Java 里 Spring 自动做的"依赖注入"，只是我们手动写出来了，一眼能看清每个零件从哪来。</span>
<span class="hl-c">//   db：数据库工具，用配置里的地址连 Neon</span>
<span class="hl-c">//   jwt：发/验 token 的工具，用配置里的密钥</span>
<span class="hl-c">//   verifyGoogle：核对 Google 证明书的函数，用配置里的 Client ID</span>
<span class="hl-c">//   corsOrigins：允许哪些网站访问</span>
<span class="hl-c">// 经过上面的 if，TypeScript 能确定 config.databaseUrl 此时一定是字符串，所以这里可以直接传。</span>
<span class="hl-k">const</span> innerApp = createApp({
  db: createNeonDb(config.databaseUrl),
  jwt: createJwtService(config.jwtSecret),
  verifyGoogle: createGoogleVerifier(config.googleClientId),
  corsOrigins: config.corsOrigins,
});

<span class="hl-c">// 为什么再包一层：Vercel 是通过"这个入口文件里 import 了 express"来识别 Express 程序的。</span>
<span class="hl-c">// create-app.ts 里才 import 了 express，这里再建一个空的外层 app，把完整的程序挂在它下面，</span>
<span class="hl-c">// 对外行为完全一样，只是让入口文件满足 Vercel 的识别方式。</span>
<span class="hl-c">// express() 创建一个新的 Express 程序；app.use(innerApp) 表示"所有请求，都交给 innerApp 去处理"。</span>
<span class="hl-k">const</span> app = express();
app.use(innerApp);

<span class="hl-c">// export default：把 app 作为这个文件"对外交出去的那个东西"。Vercel 会 import 它，并在每次请求到来时调用它。</span>
<span class="hl-k">export</span> <span class="hl-k">default</span> app;</pre>
<pre data-key="dev/server.ts" data-project="node" data-path="ielts-backend-node/dev/server.ts" data-lines="90"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// dev/server.ts —— 本地开发入口（在你自己的电脑上跑）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】在 IntelliJ 里点 Run 启动 Spring Boot。</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 和线上入口 src/index.ts 的区别：</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   1. 这里要自己 listen 一个端口。端口 8080 和 Java 版一样，所以前端里的 API_BASE = "http://localhost:8080" 不用改。</span>
<span class="hl-c">//      【端口是什么】一台电脑上同时运行着很多网络程序，IP 地址只能找到"这台电脑"，</span>
<span class="hl-c">//      端口号（0~65535）用来区分"这台电脑上的哪一个程序"。程序"监听"某个端口，</span>
<span class="hl-c">//      操作系统就会把发往这个端口的网络数据交给它。同一个端口同一时间只能被一个程序占用</span>
<span class="hl-c">//      （你之前遇到的"旧后端还占着 8080"就是这个原因）。</span>
<span class="hl-c">//   2. 没设置 DATABASE_URL 时，用本地文件当数据库（data/pglite 文件夹）。</span>
<span class="hl-c">//      这相当于 Java 版的 H2 文件数据库 data/ielts：不用注册任何账号，重启后数据还在。</span>
<span class="hl-c">//      PGlite 是一个能在 Node.js 进程里直接运行的真 PostgreSQL（不是模拟），所以和线上的 Neon 行为一致。</span>
<span class="hl-c">//      设置了 DATABASE_URL（比如你的 .env 里有）就连线上的 Neon。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 运行：npm run dev（改了代码会自动重启，由 tsx watch 实现）</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// "import 'dotenv/config'"：只执行、不取东西的导入。</span>
<span class="hl-c">// 它的作用是：读取项目根目录的 .env 文件，把里面每一行"名字=值"放进环境变量（process.env）。</span>
<span class="hl-c">// 必须放在最前面：后面的代码（loadConfig）读环境变量时，.env 的内容已经就位。</span>
<span class="hl-k">import</span> <span class="hl-s">"dotenv/config"</span>;
<span class="hl-c">// node:fs：Node.js 自带的"文件系统"模块（前缀 node: 表示这是内置模块，不是 npm 下载的）。</span>
<span class="hl-c">// mkdirSync：同步地创建文件夹。"同步"= 做完才继续往下执行（开发启动阶段，等一下没关系）。</span>
<span class="hl-k">import</span> { mkdirSync } <span class="hl-k">from</span> <span class="hl-s">"node:fs"</span>;
<span class="hl-k">import</span> { createGoogleVerifier } <span class="hl-k">from</span> <span class="hl-s">"../src/auth/google.js"</span>; <span class="hl-c">// 核对 Google 证明书</span>
<span class="hl-k">import</span> { createJwtService } <span class="hl-k">from</span> <span class="hl-s">"../src/auth/jwt.js"</span>; <span class="hl-c">// 发/验 token</span>
<span class="hl-k">import</span> { loadConfig } <span class="hl-k">from</span> <span class="hl-s">"../src/config.js"</span>; <span class="hl-c">// 读配置</span>
<span class="hl-k">import</span> { createNeonDb } <span class="hl-k">from</span> <span class="hl-s">"../src/db/client.js"</span>; <span class="hl-c">// 连线上 Neon</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">Db</span> } <span class="hl-k">from</span> <span class="hl-s">"../src/db/client.js"</span>; <span class="hl-c">// 数据库工具的类型</span>
<span class="hl-k">import</span> * <span class="hl-k">as</span> schema <span class="hl-k">from</span> <span class="hl-s">"../src/db/schema.js"</span>; <span class="hl-c">// 表描述（本地数据库也要用）</span>
<span class="hl-k">import</span> { createApp } <span class="hl-k">from</span> <span class="hl-s">"../src/create-app.js"</span>; <span class="hl-c">// 装配 Express 程序</span>

<span class="hl-c">// 读取配置。.env 已经被 dotenv 读进环境变量，所以 DATABASE_URL 有没有设置会在这里体现出来。</span>
<span class="hl-k">const</span> config = loadConfig();

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// createDevDb：决定本地开发用哪个数据库，并把它准备好。</span>
<span class="hl-c">// 返回 Promise&lt;Db&gt;：异步函数的返回值被包在 Promise 里，因为准备数据库可能要等一会儿。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">async</span> <span class="hl-k">function</span> createDevDb(): <span class="hl-t">Promise</span>&lt;<span class="hl-t">Db</span>&gt; {
  <span class="hl-c">// 设置了 DATABASE_URL：连线上的 Neon（你现在的 .env 就是这种情况）。</span>
  <span class="hl-k">if</span> (config.databaseUrl) {
    console.log(<span class="hl-s">"使用 DATABASE_URL 指向的数据库（线上 Neon 或你自己指定的）"</span>);
    <span class="hl-k">return</span> createNeonDb(config.databaseUrl);
  }

  <span class="hl-c">// 没设置：用本地文件数据库。</span>
  <span class="hl-c">// 下面三个包只在本地开发时用，所以用"动态 import"（import(...) 是函数形式，运行到这里才加载），</span>
  <span class="hl-c">// 不影响线上：线上永远走不到这里，也就不会去加载它们（它们甚至没有安装在线上）。</span>
  <span class="hl-k">const</span> { <span class="hl-t">PGlite</span> } = <span class="hl-k">await</span> <span class="hl-k">import</span>(<span class="hl-s">"@electric-sql/pglite"</span>);
  <span class="hl-k">const</span> { drizzle } = <span class="hl-k">await</span> <span class="hl-k">import</span>(<span class="hl-s">"drizzle-orm/pglite"</span>);
  <span class="hl-k">const</span> { migrate } = <span class="hl-k">await</span> <span class="hl-k">import</span>(<span class="hl-s">"drizzle-orm/pglite/migrator"</span>);

  console.log(<span class="hl-s">"没有设置 DATABASE_URL：使用本地文件数据库 ./data/pglite"</span>);
  <span class="hl-c">// PGlite 只会创建 data/pglite 这一层，不会自动创建它的上级文件夹 data，所以先确保 data 存在。</span>
  <span class="hl-c">// recursive: true：文件夹已经存在时不报错（并且必要时连上级一起创建）。</span>
  mkdirSync(<span class="hl-s">"./data"</span>, { recursive: <span class="hl-k">true</span> });
  <span class="hl-c">// 创建本地数据库，数据存在这个文件夹里，重启不丢。</span>
  <span class="hl-c">// （给它一个路径 = 存在硬盘上；不给路径 = 只存在内存里，程序结束就没了，测试时用那种。）</span>
  <span class="hl-k">const</span> client = <span class="hl-k">new</span> <span class="hl-t">PGlite</span>(<span class="hl-s">"./data/pglite"</span>);
  <span class="hl-c">// 把它包装成 Drizzle 数据库对象，并告诉它我们有哪些表。</span>
  <span class="hl-k">const</span> db = drizzle({ client, schema });
  <span class="hl-c">// 启动时把 drizzle/ 里的建表 SQL 执行一遍（已经执行过的会自动跳过）。</span>
  <span class="hl-c">// 线上用 `npm run db:migrate` 手动执行，本地为了省事自动执行。</span>
  <span class="hl-k">await</span> migrate(db, { migrationsFolder: <span class="hl-s">"./drizzle"</span> });
  <span class="hl-k">return</span> db;
}

<span class="hl-c">// 装配程序：和线上的 src/index.ts 是同一个套路，只是数据库换成 createDevDb() 的结果。</span>
<span class="hl-k">const</span> app = createApp({
  <span class="hl-c">// 顶层 await：直接在文件最外层使用 await，等数据库准备好再往下（ESM 模块支持这种写法）。</span>
  db: <span class="hl-k">await</span> createDevDb(),
  jwt: createJwtService(config.jwtSecret),
  verifyGoogle: createGoogleVerifier(config.googleClientId),
  corsOrigins: config.corsOrigins,
});

<span class="hl-c">// 端口：环境变量 PORT 有就用它，没有就用 8080。</span>
<span class="hl-c">// 环境变量读出来是字符串，Number(...) 转成数字。</span>
<span class="hl-k">const</span> port = <span class="hl-t">Number</span>(process.env.<span class="hl-t">PORT</span> ?? 8080);
<span class="hl-c">// listen：让这个进程占用端口，开始等待 HTTP 请求。对应 Spring Boot 启动时的"Tomcat started on port 8080"。</span>
<span class="hl-c">// 第二个参数是"监听成功后执行一次"的回调函数。</span>
<span class="hl-c">// 此后，Node.js 进程不会退出：它一直在"事件循环"里等待新的请求到来，来一个处理一个。</span>
app.listen(port, () =&gt; {
  console.log(<span class="hl-s">`后端已启动：http://localhost:${port}  （试试访问 /health）`</span>);
});</pre>
<pre data-key="src/config.ts" data-project="node" data-path="ielts-backend-node/src/config.ts" data-lines="140"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// config.ts —— 读取配置（整个程序"有哪些可调的设置"，全部集中在这一个文件）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】application.properties + 各处的 @Value("${...}")</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、为什么需要"配置"这个概念</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 同一份代码要在不同的地方运行：你的 Mac（开发）、Vercel（线上）、测试环境。</span>
<span class="hl-c">// 这些地方有些东西是不一样的：数据库地址不同、密钥不同、允许访问的网站不同。</span>
<span class="hl-c">// 如果把这些值直接写死在代码里，每换一个地方就得改代码、重新提交，既麻烦，又会把密码写进 GitHub。</span>
<span class="hl-c">// 所以做法是：代码里只写"我需要一个叫 DATABASE_URL 的值"，具体的值由运行环境在启动时提供。</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 二、环境变量是什么（计算机基础）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 操作系统启动每个进程（一个正在运行的程序）时，可以随手递给它一组"名字=值"的文字，</span>
<span class="hl-c">// 这组东西就叫环境变量。进程活着的期间，它们存放在这个进程自己的内存里，进程可以随时读取。</span>
<span class="hl-c">//   · 在你的 Mac 上：dotenv 这个库会读 .env 文件，把里面的每一行 "名字=值" 放进环境变量（只用于本地开发）。</span>
<span class="hl-c">//   · 在 Vercel 上：你在网页的 Environment Variables 里填的值，Vercel 会在启动我们的程序时传进去。</span>
<span class="hl-c">// 在 Node.js 里，用 process.env.名字 来读取，读出来永远是"字符串"，或者 undefined（没设置）。</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 三、这个文件的设计</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 所有"读取环境变量"的动作都集中在这里。其他文件需要配置，只从这里拿，不再自己去碰 process.env。</span>
<span class="hl-c">// 好处：以后想知道"这个程序到底有哪些配置项"，只看这一个文件就够了。</span>
<span class="hl-c">// 本文件的内容：① 一个类型声明（Config）② 几个默认值常量 ③ 一个读取函数（loadConfig）。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 【interface 是什么】</span>
<span class="hl-c">// interface 是 TypeScript 的"类型声明"：描述一个对象应该长什么样（有哪些字段、每个字段是什么类型）。</span>
<span class="hl-c">// 它只在你写代码、编辑器检查错误的时候起作用；程序真正运行时，这些类型信息已经被擦除，不存在了。</span>
<span class="hl-c">// （这是 TypeScript 和 Java 最大的区别之一：Java 的类型在运行时还存在，TypeScript 的不存在。）</span>
<span class="hl-c">// 所以不能指望 TypeScript 的类型去"拦住"前端发来的错误数据，那些必须在运行时手动检查。</span>
<span class="hl-c">// 关键字 export：让别的文件可以 import 它。不写 export 的东西，只有本文件自己能用。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">interface</span> <span class="hl-t">Config</span> {
  <span class="hl-c">/** 数据库连接地址。没有设置时为 undefined（本地开发会改用本地文件数据库）。
   *  "string | undefined" 的意思：它要么是一个字符串，要么是 undefined（没有值）。 */</span>
  databaseUrl: string | <span class="hl-k">undefined</span>;
  <span class="hl-c">/** 签发/验证我们自己 token 的密钥。对应 application.properties 里的 app.jwt-secret。 */</span>
  jwtSecret: string;
  <span class="hl-c">/** Google Client ID。对应 google.client-id。后端用它核对"证明书是不是发给我们网站的"。 */</span>
  googleClientId: string;
  <span class="hl-c">/** 允许跨域访问后端的网站列表。对应 Java 的 CorsConfig。"string[]" 表示"字符串组成的数组"。 */</span>
  corsOrigins: string[];
  <span class="hl-c">/** 是否是生产环境（上线运行）。true 表示在 Vercel 上正式跑，false 表示本地开发或测试。 */</span>
  isProduction: boolean;
}

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 默认的 Google Client ID。</span>
<span class="hl-c">// const：声明一个"不能被重新赋值"的变量（常量）。Java 里对应 final。</span>
<span class="hl-c">// 它是公开信息（前端页面里本来就写着，并不是密码），所以可以放在代码里。</span>
<span class="hl-c">// 和 Java 版 application.properties 里的 google.client-id 是同一个。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">const</span> <span class="hl-t">DEFAULT_GOOGLE_CLIENT_ID</span> =
  <span class="hl-s">"575466444996-0fbl5i1mdfp7b4rmv80kiec6j954d46c.apps.googleusercontent.com"</span>;

<span class="hl-c">// 默认允许访问后端的网站：英语站和日语站。</span>
<span class="hl-c">// 数组用方括号 [] 表示，里面的元素用逗号隔开。</span>
<span class="hl-k">const</span> <span class="hl-t">DEFAULT_CORS_ORIGINS</span> = [<span class="hl-s">"https://ielts.goenkon.com"</span>, <span class="hl-s">"https://jlpt.goenkon.com"</span>];

<span class="hl-c">// 只在"不是生产环境"时额外允许的本地地址（你用 Live Server 在 5500 端口开前端页面）。</span>
<span class="hl-c">// 对应 Java 版 CorsConfig 里的 http://localhost:5500。</span>
<span class="hl-c">// 上线（生产环境）时不开放，减少不必要的入口：线上没有任何人需要从 localhost 访问它。</span>
<span class="hl-k">const</span> <span class="hl-t">DEV_CORS_ORIGINS</span> = [<span class="hl-s">"http://localhost:5500"</span>, <span class="hl-s">"http://127.0.0.1:5500"</span>];

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// loadConfig：读取配置并整理成一个 Config 对象。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 参数 env：环境变量的"来源"。默认值 = process.env（真实的环境变量）。</span>
<span class="hl-c">//   NodeJS.ProcessEnv 是 Node.js 提供的类型，意思是"一组名字对应字符串（或 undefined）的集合"。</span>
<span class="hl-c">//   把它写成参数、而不是在函数里直接读 process.env，是为了测试时可以传入假的环境变量。</span>
<span class="hl-c">//   这和 Java 里"通过构造器把依赖传进来"是同一个思路：</span>
<span class="hl-c">//   不要在函数内部偷偷读全局的东西，从外面传进来更容易测试。</span>
<span class="hl-c">// 返回值 Config：上面声明的类型。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> loadConfig(env: <span class="hl-t">NodeJS</span>.<span class="hl-t">ProcessEnv</span> = process.env): <span class="hl-t">Config</span> {
  <span class="hl-c">// NODE_ENV 是 Node.js 世界的约定：线上平台（包括 Vercel）会把它设成 "production"。</span>
  <span class="hl-c">// === 是"严格相等"：类型和值都必须相同才算相等。JavaScript 里一般都用 === 而不用 ==，</span>
  <span class="hl-c">// 因为 == 会偷偷做类型转换（比如 0 == "" 为 true），容易出隐蔽的 bug。</span>
  <span class="hl-k">const</span> isProduction = env.<span class="hl-t">NODE_ENV</span> === <span class="hl-s">"production"</span>;

  <span class="hl-c">// ?? 是"空值合并运算符"：左边是 undefined 或 null 时，才用右边的值。</span>
  <span class="hl-c">// 为什么不用 ||？因为 || 在左边是空字符串 ""、数字 0 时也会换成右边的；</span>
  <span class="hl-c">// 这里我们想表达的是"只有真的没设置，才用默认值"，所以用 ??。</span>
  <span class="hl-c">// 这一行的意思：读环境变量 APP_JWT_SECRET，没设置就当作空字符串。</span>
  <span class="hl-k">const</span> jwtSecret = env.<span class="hl-t">APP_JWT_SECRET</span> ?? <span class="hl-s">""</span>;

  <span class="hl-k">if</span> (isProduction) {
    <span class="hl-c">// 【安全】生产环境必须设置真密钥，并且足够长。</span>
    <span class="hl-c">// Java 版的做法是"没设置就用代码里公开的默认值"，这很危险：</span>
    <span class="hl-c">// 默认值写在代码里，谁都看得到，等于任何人都能用它伪造登录通行证。</span>
    <span class="hl-c">// 这里改成"没设置就直接启动失败"：宁可程序起不来，也不要带着不安全的状态上线。</span>
    <span class="hl-c">// .length 是字符串的长度（字符个数）。小于 32 就拒绝。</span>
    <span class="hl-k">if</span> (jwtSecret.length &lt; 32) {
      <span class="hl-c">// throw：抛出异常，让程序在这里中断。Java 里同样叫 throw。</span>
      <span class="hl-c">// 在 Vercel 上，这会让这次部署/启动失败，你能在日志里看到下面这句话。</span>
      <span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">Error</span>(<span class="hl-s">"生产环境必须设置环境变量 APP_JWT_SECRET，且至少 32 个字符"</span>);
    }
  }

  <span class="hl-c">// 解析 CORS_ORIGINS：把 "a,b" 这样用逗号隔开的字符串，拆成数组 ["a","b"]。</span>
  <span class="hl-c">// 这是"链式调用"：每一步的结果交给下一步继续处理。逐步看：</span>
  <span class="hl-c">//   (env.CORS_ORIGINS ?? "")   取环境变量，没设置就用空字符串（保证后面的 split 一定有字符串可拆）</span>
  <span class="hl-c">//   .split(",")                按逗号切开，得到字符串数组。空字符串切开得到 [""]（一个空元素）</span>
  <span class="hl-c">//   .map((s) =&gt; s.trim())      对每个元素执行：去掉前后空格。(s) =&gt; ... 是"箭头函数"，相当于 Java 的 lambda</span>
  <span class="hl-c">//   .filter(Boolean)           丢掉"假值"元素。空字符串 "" 在 JS 里算假值，所以空元素被丢掉</span>
  <span class="hl-k">const</span> fromEnv = (env.<span class="hl-t">CORS_ORIGINS</span> ?? <span class="hl-s">""</span>)
    .split(<span class="hl-s">","</span>)
    .map((s) =&gt; s.trim())
    .filter(<span class="hl-t">Boolean</span>);

  <span class="hl-c">// 环境变量里有就用它；没有（数组长度为 0）就用默认的两个域名。</span>
  <span class="hl-c">// a ? b : c 是"三元运算符"：a 为真取 b，否则取 c。</span>
  <span class="hl-k">const</span> baseOrigins = fromEnv.length &gt; 0 ? fromEnv : <span class="hl-t">DEFAULT_CORS_ORIGINS</span>;

  <span class="hl-c">// 生产环境：就用 baseOrigins；非生产环境：再追加上本地地址。</span>
  <span class="hl-c">// [...baseOrigins, ...DEV_CORS_ORIGINS]：... 是"展开运算符"，把一个数组的元素逐个摊开放进新数组里，</span>
  <span class="hl-c">// 效果是把两个数组拼成一个新数组（不会修改原来的两个数组）。</span>
  <span class="hl-k">const</span> corsOrigins = isProduction ? baseOrigins : [...baseOrigins, ...<span class="hl-t">DEV_CORS_ORIGINS</span>];

  <span class="hl-c">// 把所有配置装进一个对象返回。{ 名字: 值, ... } 是 JavaScript 创建对象的写法。</span>
  <span class="hl-k">return</span> {
    <span class="hl-c">// env.DATABASE_URL || undefined：|| 在左边是假值（包括空字符串）时取右边。</span>
    <span class="hl-c">// 这里用 || 是故意的：如果有人把它设成了空字符串，也应该当作"没有设置"。</span>
    databaseUrl: env.<span class="hl-t">DATABASE_URL</span> || <span class="hl-k">undefined</span>,
    <span class="hl-c">// 本地开发没设置密钥时，用一个仅限本机的默认值（和 Java 版一样的思路，但只在非生产环境才允许，</span>
    <span class="hl-c">// 因为上面的 if 已经保证了：生产环境走到这里时 jwtSecret 一定是足够长的真密钥）。</span>
    jwtSecret: jwtSecret || <span class="hl-s">"local-dev-only-secret-please-change-0123456789"</span>,
    <span class="hl-c">// 没有设置 GOOGLE_CLIENT_ID 就用上面的默认值。</span>
    googleClientId: env.<span class="hl-t">GOOGLE_CLIENT_ID</span> || <span class="hl-t">DEFAULT_GOOGLE_CLIENT_ID</span>,
    <span class="hl-c">// 属性名和变量名相同时，可以只写一次（简写）。等同于 corsOrigins: corsOrigins</span>
    corsOrigins,
    isProduction,
  };
}</pre>
<pre data-key="src/deps.ts" data-project="node" data-path="ielts-backend-node/src/deps.ts" data-lines="49"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// deps.ts —— "程序运行需要的外部零件"清单（Dependencies，依赖）</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】Spring 的依赖注入容器（IoC 容器）。</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、什么是"依赖"，什么是"依赖注入"</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一个功能要工作，常常需要别的东西帮忙：处理登录需要"数据库"和"核对 Google 的工具"，</span>
<span class="hl-c">// 这些被需要的东西就叫"依赖"。</span>
<span class="hl-c">// 有两种拿到依赖的方式：</span>
<span class="hl-c">//   ① 自己在内部创建：   const db = 连接真实数据库();      （写死了，测试时也只能连真实数据库）</span>
<span class="hl-c">//   ② 从外面递进来：     function 处理登录(db) { ... }     （谁来调用，谁决定递哪一个）</span>
<span class="hl-c">// 第 ② 种叫"依赖注入"。它的好处：</span>
<span class="hl-c">//   · 正式运行时递进去真的 Neon 数据库；</span>
<span class="hl-c">//   · 测试时递进去内存里的假数据库、假的 Google 核对函数，不用联网、不用真账号。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【Java 里怎么做】你只在构造器里写"我需要 A、B、C"，Spring 启动时自动 new 好并递进来，你看不到接线过程。</span>
<span class="hl-c">// 【这里怎么做】没有 Spring 那个自动容器。我们把"需要哪些零件"写成一个清单（下面的 Deps），</span>
<span class="hl-c">// 在程序入口处（src/index.ts 或 dev/server.ts）手动把零件造好，一次性递给 createApp。</span>
<span class="hl-c">// 接线过程完全可见：想知道谁依赖谁，看这个清单就行。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 本文件只有"类型声明"，没有任何可运行的逻辑，所以编译后这个文件几乎是空的。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// import type { ... }：只导入"类型"，不导入真正的代码。</span>
<span class="hl-c">// 写成 import type 的好处：明确告诉编译器"这里只是为了检查类型"，编译后这一行会被完全删掉，</span>
<span class="hl-c">// 不会造成文件之间不必要的运行时依赖。</span>
<span class="hl-c">// 路径里的 .js：我们的项目是 ESM 模块（package.json 里 "type": "module"），</span>
<span class="hl-c">// ESM 规定 import 本地文件时必须写完整的扩展名。虽然源文件是 .ts，但写的是 .js，</span>
<span class="hl-c">// 因为编译、运行后文件的扩展名是 .js，TypeScript 会自动对应到同名的 .ts 文件。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">JwtService</span> } <span class="hl-k">from</span> <span class="hl-s">"./auth/jwt.js"</span>;
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">VerifyGoogle</span> } <span class="hl-k">from</span> <span class="hl-s">"./auth/google.js"</span>;
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">Db</span> } <span class="hl-k">from</span> <span class="hl-s">"./db/client.js"</span>;

<span class="hl-c">// Deps：一个对象的"形状"，列出 createApp 需要收到的全部零件。</span>
<span class="hl-c">// 以后新增零件（比如发邮件的工具），只要在这里加一行，然后在入口处把它造出来递进去。</span>
<span class="hl-k">export</span> <span class="hl-k">interface</span> <span class="hl-t">Deps</span> {
  <span class="hl-c">/** 数据库工具。对应 Java 的各个 Repository 背后的数据库连接。
   *  所有读写数据库的代码都通过它。 */</span>
  db: <span class="hl-t">Db</span>;
  <span class="hl-c">/** 发 token、验 token。对应 JwtService。 */</span>
  jwt: <span class="hl-t">JwtService</span>;
  <span class="hl-c">/** 向 Google 核对登录证明书。对应 GoogleTokenVerifier。
   *  类型 VerifyGoogle 是一个"函数的类型"：给一段字符串，返回用户信息或 null。 */</span>
  verifyGoogle: <span class="hl-t">VerifyGoogle</span>;
  <span class="hl-c">/** 允许跨域访问的网站列表。对应 CorsConfig。 */</span>
  corsOrigins: string[];
}</pre>

<pre data-key="src/create-app.ts" data-project="node" data-path="ielts-backend-node/src/create-app.ts" data-lines="196"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// create-app.ts —— 把所有零件装配成一个完整的 Express 程序</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】IeltsBackendApplication.java（程序入口）+ CorsConfig.java（跨域设置）</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、Express 的核心概念：中间件（middleware）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// Express 程序本质上是一条"流水线"。每个请求进来，会依次经过你用 app.use(...) 挂上去的一个个"环节"，</span>
<span class="hl-c">// 每个环节是一个函数，叫"中间件"，形如 (req, res, next) =&gt; { ... }：</span>
<span class="hl-c">//   req  = request，这次收到的请求（里面有网址、请求头、请求体……）</span>
<span class="hl-c">//   res  = response，用来回复的对象</span>
<span class="hl-c">//   next = 一个函数，调用它表示"我处理完了，交给下一个环节"</span>
<span class="hl-c">// 一个环节有两种选择：</span>
<span class="hl-c">//   · 调用 next()：放行，让请求继续往下走；</span>
<span class="hl-c">//   · 直接用 res 回复（不调用 next）：请求到此为止，后面的环节不会再执行。</span>
<span class="hl-c">// 所以"代码从上到下的顺序，就是请求经过的顺序"。顺序很重要，下面每一层的位置都是有意安排的。</span>
<span class="hl-c">// 对应 Java：Spring 里 Filter / Interceptor / Controller 是由框架按规则自动串起来的；</span>
<span class="hl-c">// Express 里全部由你亲手按顺序挂上去，更直观，但也要自己保证顺序对。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【一个请求在这个程序里的旅程】（对应 Java 版"请求在 Spring 里的旅程"）</span>
<span class="hl-c">//   1. 平台（Vercel 或本地 Node.js）收到 HTTP 请求，交给 Express</span>
<span class="hl-c">//   2. cors：如果是跨域预检（OPTIONS）就直接应答；否则加上允许跨域的响应头</span>
<span class="hl-c">//   3. express.json：把请求体里的 JSON 文字解析成 JS 对象，放进 req.body</span>
<span class="hl-c">//   4. 路由表：按"方法 + 路径"找到对应的处理函数（/health、/auth/google、/me、/favorites……）</span>
<span class="hl-c">//   5. 需要登录的路径先过门卫 requireAuth，不合格直接 401</span>
<span class="hl-c">//   6. 执行处理函数，把结果用 res.json 发回去</span>
<span class="hl-c">//   7. 任何地方抛出的错误，由最后的错误处理中间件统一回复 500</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// cors：处理"跨域"的现成中间件（第三方包）。</span>
<span class="hl-k">import</span> cors <span class="hl-k">from</span> <span class="hl-s">"cors"</span>;
<span class="hl-c">// express：Web 框架本身。</span>
<span class="hl-k">import</span> express <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-c">// "import type"：只导入类型、不导入真正的代码（编译后这行消失）。</span>
<span class="hl-c">// ErrorRequestHandler 是 Express 提供的类型：描述"错误处理中间件"这种函数应该长什么样。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">ErrorRequestHandler</span> } <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-c">// sql：drizzle 提供的"写原始 SQL 片段"的标签函数，下面 /health 里用来执行 select 1。</span>
<span class="hl-k">import</span> { sql } <span class="hl-k">from</span> <span class="hl-s">"drizzle-orm"</span>;
<span class="hl-c">// createRequireAuth：造"门卫"（检查登录的中间件）的函数。</span>
<span class="hl-k">import</span> { createRequireAuth } <span class="hl-k">from</span> <span class="hl-s">"./auth/middleware.js"</span>;
<span class="hl-c">// Deps：本程序需要的零件清单的类型（见 deps.ts）。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">Deps</span> } <span class="hl-k">from</span> <span class="hl-s">"./deps.js"</span>;
<span class="hl-c">// authRoutes：登录相关的接口（/auth/google、/me）。</span>
<span class="hl-k">import</span> { authRoutes } <span class="hl-k">from</span> <span class="hl-s">"./routes/auth.js"</span>;
<span class="hl-c">// favoriteRoutes：收藏相关的接口（/favorites）。</span>
<span class="hl-k">import</span> { favoriteRoutes } <span class="hl-k">from</span> <span class="hl-s">"./routes/favorites.js"</span>;

<span class="hl-c">// createApp：接收所有零件（deps），返回装配好的 Express 程序。</span>
<span class="hl-c">// 把它写成"函数"而不是直接在文件顶层创建，是因为：</span>
<span class="hl-c">//   · 线上入口（index.ts）递真零件给它；</span>
<span class="hl-c">//   · 测试（test/helpers.ts）递假零件给它；</span>
<span class="hl-c">// 同一套装配逻辑，两种用法，互不干扰。</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> createApp(deps: <span class="hl-t">Deps</span>) {
  <span class="hl-c">// express() 创建一个全新的 Express 程序对象，此时它还没有任何环节、任何接口。</span>
  <span class="hl-k">const</span> app = express();
  <span class="hl-c">// 默认情况下 Express 会在每个响应头里写 "X-Powered-By: Express"，等于告诉所有人"我用的是 Express"。</span>
  <span class="hl-c">// 关掉它，少给攻击者一点线索（比如针对某个框架版本的已知漏洞）。</span>
  app.disable(<span class="hl-s">"x-powered-by"</span>);

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 第 2 层：CORS（对应 Java 的 CorsConfig）</span>
  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 【为什么需要 CORS】浏览器有一条安全规则叫"同源策略"：</span>
  <span class="hl-c">// 网页 https://ielts.goenkon.com 里的 JavaScript，默认不允许读取另一个网站（我们的后端</span>
  <span class="hl-c">// https://ielts-backend-node.vercel.app）返回的内容。因为否则任何恶意网站都能借你的浏览器去读你登录过的别的网站。</span>
  <span class="hl-c">// 除非后端在响应头里明确声明"我允许这个网站来访问"，浏览器才放行。这套"声明机制"就叫 CORS。</span>
  <span class="hl-c">//</span>
  <span class="hl-c">// 【预检请求】浏览器在发 PUT/DELETE 或带 Authorization 头的请求之前，会先自动发一个 OPTIONS 请求，</span>
  <span class="hl-c">// 问后端"我这样跨域访问，你允许吗？"，这叫"预检"。后端答应了，浏览器才会发真正的请求。</span>
  <span class="hl-c">// cors 中间件会自动应答预检，我们不用手写。</span>
  <span class="hl-c">//</span>
  <span class="hl-c">// 注意：CORS 只约束"浏览器"。curl、Postman、别的服务器调用我们，根本不受它管，所以它不是安全防线，</span>
  <span class="hl-c">// 真正的安全靠登录验证（token）。CORS 的作用是：别的网站的页面无法借用户的浏览器来调用我们的接口。</span>
  <span class="hl-c">//</span>
  <span class="hl-c">// new Set(数组)：创建一个"集合"。集合里的元素不重复，而且判断"有没有某个元素"比数组快（has 方法）。</span>
  <span class="hl-k">const</span> allowed = <span class="hl-k">new</span> <span class="hl-t">Set</span>(deps.corsOrigins);
  app.use(
    <span class="hl-c">// cors({...}) 返回一个中间件函数，括号里是它的设置项。</span>
    cors({
      <span class="hl-c">// origin：决定"放不放行某个来源"的函数。</span>
      <span class="hl-c">// 参数 origin：浏览器请求里带的 Origin 头，表示"发这个请求的网页来自哪个网站"（比如 https://ielts.goenkon.com）。</span>
      <span class="hl-c">// 参数 callback：用它回报结果。callback(错误, 是否放行)：第一个参数没有错误就传 null，第二个参数 true=放行。</span>
      <span class="hl-c">// 逻辑：没有 Origin（!origin 为真），说明不是浏览器发的（比如 curl 或服务器之间调用），不受 CORS 管，放行；</span>
      <span class="hl-c">//       有 Origin，就看它在不在我们的白名单里。</span>
      origin: (origin, callback) =&gt; callback(<span class="hl-k">null</span>, !origin || allowed.has(origin)),
      <span class="hl-c">// 允许使用哪些 HTTP 方法。</span>
      methods: [<span class="hl-s">"GET"</span>, <span class="hl-s">"POST"</span>, <span class="hl-s">"PUT"</span>, <span class="hl-s">"DELETE"</span>, <span class="hl-s">"OPTIONS"</span>],
      <span class="hl-c">// 允许前端在请求里带哪些自定义请求头。</span>
      <span class="hl-c">// Authorization：放 token 的头；Content-Type：声明请求体是 JSON。不在列表里的头，浏览器会拒绝发送。</span>
      allowedHeaders: [<span class="hl-s">"Authorization"</span>, <span class="hl-s">"Content-Type"</span>],
      <span class="hl-c">// 让浏览器把预检结果缓存 10 分钟（600 秒）。这段时间内同样的跨域请求不用每次先发一个 OPTIONS，更快。</span>
      maxAge: 600,
    }),
  );

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 第 3 层：解析 JSON 请求体</span>
  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 前端用 fetch 发请求时，请求体是一段 JSON 文字（比如 {"word":"abc"}）。</span>
  <span class="hl-c">// 网络上传输的只是文字，要变成 JS 对象才方便用。express.json() 就负责这件事：</span>
  <span class="hl-c">// 解析成功后，把结果放进 req.body，后面的处理函数直接用 req.body.word 就能取到。</span>
  <span class="hl-c">// limit: "10kb"：请求体最大 10KB。我们的请求只有几十个字，限制小一点，能挡住恶意发来的超大请求</span>
  <span class="hl-c">// （否则有人发一个几百 MB 的请求，会把服务器内存撑爆）。</span>
  app.use(express.json({ limit: <span class="hl-s">"10kb"</span> }));

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 健康检查 / 唤醒接口：GET /health</span>
  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 专门给前端"页面一打开就悄悄叫醒后端"用的。</span>
  <span class="hl-c">// 免费方案的后端和数据库闲置一段时间会休眠，第一次请求要等它们醒来（冷启动，要好几秒）。</span>
  <span class="hl-c">// 前端页面一加载就请求一下这个接口：它会执行一条最简单的 SQL（select 1），</span>
  <span class="hl-c">// 这样后端程序和数据库都被叫醒了，等用户点收藏时已经是醒着的。</span>
  <span class="hl-c">// 它不需要登录，也不返回任何数据。</span>
  <span class="hl-c">//</span>
  <span class="hl-c">// app.get("/health", 处理函数)：当收到"方法是 GET、路径是 /health"的请求时，执行处理函数。</span>
  <span class="hl-c">//   对应 Java 的 @GetMapping("/health")。</span>
  <span class="hl-c">// async：声明这是一个"异步函数"，里面可以用 await。</span>
  <span class="hl-c">//   【为什么需要异步（计算机基础）】Node.js 只有一个主线程（Java 的 Tomcat 是一请求一线程）。</span>
  <span class="hl-c">//   访问数据库要通过网络，要等几十毫秒到几秒。如果主线程傻等，这段时间其他所有请求都被卡住。</span>
  <span class="hl-c">//   所以 Node.js 的做法是：发出数据库请求后，主线程先去处理别的请求，等数据库回复了再回来继续往下执行。</span>
  <span class="hl-c">//   await 就是"在这里等结果，但等的时候不要卡住整个程序"。</span>
  <span class="hl-c">// (_req, res)：参数名前面加下划线，表示"这个参数我们用不上"（这里不需要读请求的内容）。</span>
  app.get(<span class="hl-s">"/health"</span>, <span class="hl-k">async</span> (_req, res) =&gt; {
    <span class="hl-c">// try...catch：试着执行 try 里的代码；中途出了错（抛出异常），就跳到 catch 里处理。</span>
    <span class="hl-k">try</span> {
      <span class="hl-c">// deps.db.execute(sql`select 1`)：向数据库发送一条最简单的 SQL，意思是"返回数字 1"。</span>
      <span class="hl-c">// 没有任何实际用途，只是为了确认数据库连得通、并且把它叫醒。</span>
      <span class="hl-c">// sql`...` 是"标签模板字符串"：反引号里的内容被当作 SQL 片段处理。</span>
      <span class="hl-k">await</span> deps.db.execute(sql<span class="hl-s">`select 1`</span>);
      <span class="hl-c">// res.json(对象)：把 JS 对象转成 JSON 文字，设置好响应头，发回给前端。状态码默认 200（成功）。</span>
      res.json({ ok: <span class="hl-k">true</span> });
    } <span class="hl-k">catch</span> {
      <span class="hl-c">// 数据库连不上或出错：回复 503，表示"服务暂时不可用"。</span>
      <span class="hl-c">// res.status(503) 设置状态码，.json(...) 发出内容；两个方法可以连着写（链式调用）。</span>
      res.status(503).json({ ok: <span class="hl-k">false</span> });
    }
  });

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 门卫（对应 Java 的 AuthInterceptor）</span>
  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 造出"检查登录"的中间件，把验证 token 的工具（deps.jwt）交给它。</span>
  <span class="hl-c">// 注意：这里只是"造出来"，还没有挂到任何路径上。哪些路径要经过它，由各路由文件自己用 router.use 决定。</span>
  <span class="hl-k">const</span> requireAuth = createRequireAuth(deps.jwt);

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 第 4 层：路由</span>
  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// authRoutes(...) / favoriteRoutes(...) 各返回一个"小路由表"（Router）。</span>
  <span class="hl-c">// app.use(小路由表)：把它整个挂到主程序上，里面登记的所有接口就生效了。</span>
  <span class="hl-c">// 为什么要拆成多个文件：一个文件放一类接口，对应 Java 里一个 Controller 类一个文件。</span>
  app.use(authRoutes(deps, requireAuth)); <span class="hl-c">// /auth/google、/me</span>
  app.use(favoriteRoutes(deps, requireAuth)); <span class="hl-c">// /favorites</span>

  <span class="hl-c">// 兜底：以上所有接口都没匹配到的请求，走到这里，返回 404（找不到）。</span>
  <span class="hl-c">// 这个中间件没有写路径，所以匹配"所有请求"；因为排在所有路由之后，只有前面都没处理的请求才会到这里。</span>
  <span class="hl-c">// 这就是为什么你访问根网址 / 会看到 {"error":"not_found"}。</span>
  app.use((_req, res) =&gt; {
    res.status(404).json({ error: <span class="hl-s">"not_found"</span> });
  });

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 第 7 层：统一的错误处理</span>
  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 不管请求在哪一环抛出了错误（我们的代码、数据库、JSON 解析失败……），Express 都会跳过中间的环节，</span>
  <span class="hl-c">// 直接找"错误处理中间件"。它的特征是：函数有 4 个参数 (err, req, res, next)。</span>
  <span class="hl-c">// 必须写满 4 个参数，Express 靠"参数个数是 4"来识别它，哪怕有的参数用不上也不能省。</span>
  <span class="hl-c">// const onError: ErrorRequestHandler = ... ：给变量标注类型，让编辑器检查参数用法对不对。</span>
  <span class="hl-k">const</span> onError: <span class="hl-t">ErrorRequestHandler</span> = (err, _req, res, _next) =&gt; {
    <span class="hl-c">// 前端发来的 JSON 格式不对（比如少了个引号）：这是前端的错，回复 400（"请求有问题"）。</span>
    <span class="hl-c">// err?.type：?. 是"可选链"，err 是 undefined/null 时不会报错，直接得到 undefined。</span>
    <span class="hl-c">// "entity.parse.failed" 是 express.json 在解析失败时给错误打的标记。</span>
    <span class="hl-k">if</span> (err?.<span class="hl-k">type</span> === <span class="hl-s">"entity.parse.failed"</span>) {
      res.status(400).json({ error: <span class="hl-s">"bad_json"</span> });
      <span class="hl-c">// return：这里已经回复了，立刻结束函数，后面的代码不要再执行（否则会对同一个请求回复两次）。</span>
      <span class="hl-k">return</span>;
    }
    <span class="hl-c">// 请求体超过 10KB（上面 limit 设置的）：回复 413（"请求内容太大"）。</span>
    <span class="hl-k">if</span> (err?.<span class="hl-k">type</span> === <span class="hl-s">"entity.too.large"</span>) {
      res.status(413).json({ error: <span class="hl-s">"too_large"</span> });
      <span class="hl-k">return</span>;
    }
    <span class="hl-c">// 其余都是我们自己代码或数据库的问题：</span>
    <span class="hl-c">// 在日志里记下详细原因（你在 Vercel 的 Logs 页面能看到，方便排查），</span>
    <span class="hl-c">// 但只给前端一个笼统的 500（"服务器内部错误"），不把内部细节（比如 SQL 语句、表名）暴露出去，</span>
    <span class="hl-c">// 因为这些细节会帮攻击者了解我们的内部结构。</span>
    console.error(<span class="hl-s">"[server error]"</span>, err);
    res.status(500).json({ error: <span class="hl-s">"server_error"</span> });
  };
  <span class="hl-c">// 错误处理中间件必须挂在最后，这样前面任何环节抛的错误它都能接住。</span>
  app.use(onError);

  <span class="hl-c">// 返回装配好的程序，由调用方决定怎么运行它（线上交给 Vercel，本地 listen 端口，测试交给 supertest）。</span>
  <span class="hl-k">return</span> app;
}</pre>
<pre data-key="src/routes/favorites.ts" data-project="node" data-path="ielts-backend-node/src/routes/favorites.ts" data-lines="364"><span class="hl-c">// ============================================================================</span>
<span class="hl-c">// routes/favorites.ts —— 收藏的四个接口：查、增、删、改</span>
<span class="hl-c">//</span>
<span class="hl-c">// 【对应 Java】FavoriteWordController.java + FavoriteWordRepository.java + NewFavoriteWord.java</span>
<span class="hl-c">//   - Controller 的四个方法      ==  下面的 router.get / post / delete / put</span>
<span class="hl-c">//   - Repository 里的查询方法    ==  直接写在每个接口里的 Drizzle 查询（项目小，不再单独分一层）</span>
<span class="hl-c">//   - NewFavoriteWord（接收前端数据的 record） ==  下面 POST 里手动检查并整理前端传来的数据的那一段</span>
<span class="hl-c">//</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// 一、四个接口一览（这就是常说的 CRUD：Create 增 / Read 查 / Update 改 / Delete 删）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   GET    /favorites        查：列出我的收藏（可选 ?site=jlpt，不写就是英语站）</span>
<span class="hl-c">//   POST   /favorites        增：收藏一个词</span>
<span class="hl-c">//   DELETE /favorites/:id    删：取消收藏</span>
<span class="hl-c">//   PUT    /favorites/:id    改：修改词或状态</span>
<span class="hl-c">// 这套"用路径表示东西、用方法表示动作"的风格叫 REST 风格。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 二、设计思路（和 Java 版一致）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">//   - 后端只记"谁收藏了什么文字"，单词释义、例句等详情数据仍然在前端，收藏本里用这段文字去匹配，不靠 ID。</span>
<span class="hl-c">//   - kind 只有两种，而且只有英语站在用：</span>
<span class="hl-c">//       w = word 单词；p = phrase 短语。</span>
<span class="hl-c">//     英语站：前端判断，文字里没有空格是单词，有空格是短语。</span>
<span class="hl-c">//     日语站：【约定】收藏不分类型。单词、语法都只是"一段文字"，后端一律存成 w（前端传什么都不看）。</span>
<span class="hl-c">//       为什么还要存一个 w，而不是空着：kind 列不允许为空，而且它是"防重复"联合唯一约束的一部分，</span>
<span class="hl-c">//       全部固定成同一个值，才能保证同一段文字在日语站只收藏一次。</span>
<span class="hl-c">//       （以前给日语站的语法加过 g，后来按"日语不分类型"的约定去掉了；数据库里留下的 g 记录照样能查到、能删除。）</span>
<span class="hl-c">//     这就是"所有站、所有类型共用一张表，用 site、kind 两列区分"的好处：规则改了，表结构不用动。</span>
<span class="hl-c">//   - 同一个人对同一个文字只能有一条收藏（数据库的联合唯一约束保证）。</span>
<span class="hl-c">//   - 【新增】site：区分英语站（ielts）和日语站（jlpt），两个站共用一个后端和数据库。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 三、安全核心（面试时可以讲的重点）</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// userId 永远从 token 来（getUserId），绝不读前端请求里的 userId。</span>
<span class="hl-c">// 并且删除、修改时的查询条件是 "id = ? AND user_id = ?"：</span>
<span class="hl-c">//   如果只用 id 查，坐在前端的人把 id 改成别人的，就能删别人的收藏（IDOR 漏洞）。</span>
<span class="hl-c">//   带上 userId 一起查，查不到就是"不是你的"，当作不存在处理。</span>
<span class="hl-c">//</span>
<span class="hl-c">// 四、前端传来的一切都不可信</span>
<span class="hl-c">// ────────────────────────────────────────────────────────────────────────────</span>
<span class="hl-c">// TypeScript 的类型在程序运行时已经不存在了，它管不住从网络来的数据。</span>
<span class="hl-c">// 任何人都可以用 curl 直接发一个乱七八糟的请求。所以每个字段都要在运行时手动检查：</span>
<span class="hl-c">// 是不是字符串、是不是合法的值、长不长得离谱。</span>
<span class="hl-c">// ============================================================================</span>

<span class="hl-c">// and、asc、eq：Drizzle 提供的查询条件积木。</span>
<span class="hl-c">//   eq(列, 值)：列 = 值；</span>
<span class="hl-c">//   and(条件1, 条件2, ...)：几个条件同时成立；</span>
<span class="hl-c">//   asc(列)：按这一列从小到大排序。</span>
<span class="hl-k">import</span> { and, asc, eq } <span class="hl-k">from</span> <span class="hl-s">"drizzle-orm"</span>;
<span class="hl-c">// Router：Express 的"小路由表"。</span>
<span class="hl-k">import</span> { <span class="hl-t">Router</span> } <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-c">// RequestHandler：处理请求的函数的类型（只用于类型检查）。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">RequestHandler</span> } <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-c">// getUserId：取出门卫放进去的用户编号。</span>
<span class="hl-k">import</span> { getUserId } <span class="hl-k">from</span> <span class="hl-s">"../auth/middleware.js"</span>;
<span class="hl-c">// favoriteWord：收藏表的描述（见 schema.ts）。</span>
<span class="hl-k">import</span> { favoriteWord } <span class="hl-k">from</span> <span class="hl-s">"../db/schema.js"</span>;
<span class="hl-c">// Deps：零件清单类型。</span>
<span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">Deps</span> } <span class="hl-k">from</span> <span class="hl-s">"../deps.js"</span>;

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 规则常量：写成有名字的常量，改规则只改这一处。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// "as const"：告诉 TypeScript 把这个数组当作"固定不变的字面量"，而不是普通的"字符串数组"。</span>
<span class="hl-c">// 这样下面推导出的类型就是 "w" | "p"（只能是这两个值），而不是 string（任意字符串）。</span>
<span class="hl-c">// 两个值：w = word（单词），p = phrase（短语）。只有英语站用得到这个区分。</span>
<span class="hl-c">// 【约定】日语站的收藏不分类型：不管前端传什么，都统一存成 "w"（见下面的 JLPT_KIND 和 POST 里的处理）。</span>
<span class="hl-c">//   以前为日语站的语法加过 "g"，现在去掉了。数据库里已有的 "g" 记录不用管：查询时照样会返回，前端不看类型。</span>
<span class="hl-c">// 以后如果还想收藏别的东西（比如"文章"），只要在这个数组里再加一个字母，校验就会放行。</span>
<span class="hl-k">const</span> <span class="hl-t">KINDS</span> = [<span class="hl-s">"w"</span>, <span class="hl-s">"p"</span>] <span class="hl-k">as</span> <span class="hl-k">const</span>; <span class="hl-c">// 允许的类型：w 单词、p 短语（英语站用）</span>
<span class="hl-k">const</span> <span class="hl-t">SITES</span> = [<span class="hl-s">"ielts"</span>, <span class="hl-s">"jlpt"</span>] <span class="hl-k">as</span> <span class="hl-k">const</span>; <span class="hl-c">// 允许的站点。以后新增站点只需要在这里加</span>
<span class="hl-k">const</span> <span class="hl-t">DEFAULT_SITE</span> = <span class="hl-s">"ielts"</span>; <span class="hl-c">// 前端不传 site 时的默认值（兼容现在还没有 site 的前端）</span>
<span class="hl-k">const</span> <span class="hl-t">DEFAULT_KIND</span> = <span class="hl-s">"w"</span>; <span class="hl-c">// 前端不传 kind 时的默认值</span>
<span class="hl-c">// 日语站固定使用的类型。为什么要固定成一个值，而不是"不存类型"：</span>
<span class="hl-c">//   ① 数据库的 kind 列是 NOT NULL（必须有值），而且在"防重复"的联合唯一约束 (用户, 站点, 类型, 文字) 里；</span>
<span class="hl-c">//   ② 如果日语站有的存 w、有的存别的，同一段文字就能被收藏两次（类型不同就不算重复）。</span>
<span class="hl-c">//   所以干脆规定：日语站一律是 "w"。这样"同一个人、同一段文字"在日语站最多只有一条。</span>
<span class="hl-k">const</span> <span class="hl-t">JLPT_KIND</span> = <span class="hl-s">"w"</span>;
<span class="hl-k">const</span> <span class="hl-t">MAX_WORD_LENGTH</span> = 200; <span class="hl-c">// 单词/短语最长字数。Java 版没有这个限制，这里加上，防止有人塞进一大段垃圾数据</span>
<span class="hl-k">const</span> <span class="hl-t">MAX_STATUS_LENGTH</span> = 32; <span class="hl-c">// status 最长字数，同样是防垃圾数据</span>

<span class="hl-c">// 从上面的数组推导出类型：</span>
<span class="hl-c">//   typeof KINDS    取变量 KINDS 的类型（一个只读的元组 readonly ["w","p"]）；</span>
<span class="hl-c">//   [number]        "取这个数组里任意一个元素的类型"，于是得到联合类型 "w" | "p"。</span>
<span class="hl-c">// 联合类型的意思：值只能是列出的这几个之一。</span>
<span class="hl-k">type</span> <span class="hl-t">Kind</span> = (<span class="hl-k">typeof</span> <span class="hl-t">KINDS</span>)[number];
<span class="hl-k">type</span> <span class="hl-t">Site</span> = (<span class="hl-k">typeof</span> <span class="hl-t">SITES</span>)[number];

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 类型守卫函数：检查一个"未知的值"是不是合法的 Kind / Site。</span>
<span class="hl-c">// (v: unknown)：参数类型是 unknown，表示"可能是任何东西，使用前必须先检查"。</span>
<span class="hl-c">// 返回类型 "v is Kind"：这是 TypeScript 的特殊写法。意思是：</span>
<span class="hl-c">//   如果这个函数返回 true，编译器就把 v 当作 Kind 类型；后面的代码里 v 就能被安全地当作 "w" | "p" 使用。</span>
<span class="hl-c">// KINDS.includes(...)：数组是否包含这个值。</span>
<span class="hl-c">// （对应 Java 里的 kindOk、wordOk 检查）</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">const</span> isKind = (v: unknown): v is <span class="hl-t">Kind</span> =&gt; <span class="hl-t">KINDS</span>.includes(v <span class="hl-k">as</span> <span class="hl-t">Kind</span>);
<span class="hl-k">const</span> isSite = (v: unknown): v is <span class="hl-t">Site</span> =&gt; <span class="hl-t">SITES</span>.includes(v <span class="hl-k">as</span> <span class="hl-t">Site</span>);

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// 要返回给前端的列。注意不包含 userId：前端不需要知道，也不应该知道。</span>
<span class="hl-c">// 对应 Java：FavoriteWord 故意不给 userId 写 getter，所以 JSON 里不会出现它。</span>
<span class="hl-c">// 后面的查询用 select(publicColumns) 只取这几列，所以数据库返回的结果里本来就没有 userId。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">const</span> publicColumns = {
  id: favoriteWord.id,
  site: favoriteWord.site,
  kind: favoriteWord.kind,
  word: favoriteWord.word,
  status: favoriteWord.status,
};

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// isUniqueViolation：检查"是不是撞了唯一约束"。</span>
<span class="hl-c">// PostgreSQL 撞唯一约束时，错误里的 code 是 "23505"（这是 PostgreSQL 规定的错误码）。</span>
<span class="hl-c">// Drizzle 可能把原始错误包在 cause 里（"包装异常"，Java 里也有 getCause()），所以两层都看。</span>
<span class="hl-c">// err 的类型是 unknown，所以先用 "as" 断言成我们期望的形状，再读取字段；?. 保证字段不存在时不报错。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">function</span> isUniqueViolation(err: unknown): boolean {
  <span class="hl-k">const</span> e = err <span class="hl-k">as</span> { code?: string; cause?: { code?: string } };
  <span class="hl-k">return</span> e?.code === <span class="hl-s">"23505"</span> || e?.cause?.code === <span class="hl-s">"23505"</span>;
}

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// parseId：把路径里的 id（字符串）转成数字。不是正整数就返回 null。</span>
<span class="hl-c">// 对应 Java：@PathVariable Long id（传了非数字 Spring 会自动回 400；这里自己检查）。</span>
<span class="hl-c">// 参数 raw：路径里取到的原始文字，可能是 undefined。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">function</span> parseId(raw: string | <span class="hl-k">undefined</span>): number | <span class="hl-k">null</span> {
  <span class="hl-c">// /^\d+$/ 是"正则表达式"：^ 开头，\d+ 一个或多个数字，$ 结尾——整个字符串必须全是数字。</span>
  <span class="hl-c">// 这样 "12abc"、"-3"、"1.5"、"" 都会被挡掉。</span>
  <span class="hl-k">if</span> (!raw || !/^\d+$/.test(raw)) <span class="hl-k">return</span> <span class="hl-k">null</span>;
  <span class="hl-k">const</span> n = <span class="hl-t">Number</span>(raw);
  <span class="hl-c">// 再检查：在 JS 能精确表示的整数范围内，并且大于 0。</span>
  <span class="hl-k">return</span> <span class="hl-t">Number</span>.isSafeInteger(n) &amp;&amp; n &gt; 0 ? n : <span class="hl-k">null</span>;
}

<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-c">// favoriteRoutes：创建"收藏相关"的小路由表。</span>
<span class="hl-c">// 参数 deps：零件；参数 requireAuth：门卫。返回 Router。</span>
<span class="hl-c">// ---------------------------------------------------------------------------</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> favoriteRoutes(deps: <span class="hl-t">Deps</span>, requireAuth: <span class="hl-t">RequestHandler</span>): <span class="hl-t">Router</span> {
  <span class="hl-k">const</span> router = <span class="hl-t">Router</span>();
  <span class="hl-c">// 给数据库起个短名字，下面写起来不用每次都写 deps.db。</span>
  <span class="hl-k">const</span> db = deps.db;

  <span class="hl-c">// 对应 Java：WebAuthConfig 里 addPathPatterns("/favorites", "/favorites/**")</span>
  <span class="hl-c">// router.use("/favorites", requireAuth)：凡是以 /favorites 开头的请求，都先过门卫。</span>
  <span class="hl-c">// 没列在里面的路径（比如 /auth/google、/health）不会经过这道门。</span>
  <span class="hl-c">// 【注意】以后新写了需要登录的接口，必须记得让它经过 requireAuth，忘了就会裸奔（没登录也能访问）。</span>
  router.use(<span class="hl-s">"/favorites"</span>, requireAuth);

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 查：GET /favorites（可选 ?site=jlpt）</span>
  <span class="hl-c">// 对应 Java：@GetMapping("/favorites") list(...)  →  repository.findByUserId(userId)</span>
  <span class="hl-c">// ==========================================================================</span>
  router.get(<span class="hl-s">"/favorites"</span>, <span class="hl-k">async</span> (req, res) =&gt; {
    <span class="hl-c">// 来自门卫验证过的 token，前端伪造不了。</span>
    <span class="hl-k">const</span> userId = getUserId(res);

    <span class="hl-c">// ?site=jlpt 是网址里问号后面的参数（叫"查询参数"），在 req.query 里。没传就用默认的 ielts。</span>
    <span class="hl-k">const</span> rawSite = req.query.site;
    <span class="hl-k">const</span> site = rawSite === <span class="hl-k">undefined</span> ? <span class="hl-t">DEFAULT_SITE</span> : rawSite;
    <span class="hl-c">// 不是合法的站点名（比如 ?site=hack）：回复 400，表示"你的请求有问题"。</span>
    <span class="hl-k">if</span> (!isSite(site)) {
      res.status(400).json({ error: <span class="hl-s">"bad_site"</span> });
      <span class="hl-k">return</span>;
    }

    <span class="hl-c">// 对应的 SQL：SELECT id, site, kind, word, status FROM favorite_word</span>
    <span class="hl-c">//             WHERE user_id = ? AND site = ? ORDER BY id ASC</span>
    <span class="hl-c">// 只查这个用户自己的收藏（WHERE user_id = ?）。</span>
    <span class="hl-c">// 按 id 从小到大排（先收藏的在前），前端拿到后自己翻过来让最新的在最上面。</span>
    <span class="hl-c">// 逐行解释：</span>
    <span class="hl-c">//   select(publicColumns)  只取我们允许返回的那几列</span>
    <span class="hl-c">//   from(favoriteWord)     从收藏表</span>
    <span class="hl-c">//   where(and(...))        两个条件同时满足：属于这个用户、属于这个站</span>
    <span class="hl-c">//   orderBy(asc(...))      排序</span>
    <span class="hl-k">const</span> rows = <span class="hl-k">await</span> db
      .select(publicColumns)
      .<span class="hl-k">from</span>(favoriteWord)
      .where(and(eq(favoriteWord.userId, userId), eq(favoriteWord.site, site)))
      .orderBy(asc(favoriteWord.id));

    <span class="hl-c">// 返回数组，自动变成 JSON：[{id,site,kind,word,status}, ...]</span>
    res.json(rows);
  });

  <span class="hl-c">// ==========================================================================</span>
  <span class="hl-c">// 增：POST /favorites，请求体 {"kind":"w","word":"accommodation","status":"unknown","site":"ielts"}</span>
  <span class="hl-c">// 对应 Java：@PostMapping("/favorites") add(...)</span>
  <span class="hl-c">// ==========================================================================</span>
  router.post(<span class="hl-s">"/favorites"</span>, <span class="hl-k">async</span> (req, res) =&gt; {
    <span class="hl-k">const</span> userId = getUserId(res);
    <span class="hl-c">// req.body 在没有请求体时是 undefined，?? {} 让它变成空对象，后面读字段就不会因为 undefined 而崩溃。</span>
    <span class="hl-k">const</span> body = req.body ?? {};

    <span class="hl-c">// 检查前端发来的数据：前端的任何东西都不能直接相信。</span>
    <span class="hl-c">// kind 只能是 w 或 p；word 必须是文字、不能是空的也不能全是空格；site 没传用默认，传了必须合法。</span>
    <span class="hl-c">// 【新增】kind 可以不传，不传就当作 "w"：日语站的收藏不区分单词和短语，只发 {site, word} 就行。</span>
    <span class="hl-c">//   （英语站前端每次都会传 kind，所以不受影响。）</span>
    <span class="hl-c">// 注意顺序：要先算出 site，才能决定 kind 怎么处理（日语站和英语站规则不同）。</span>
    <span class="hl-k">const</span> site = body.site === <span class="hl-k">undefined</span> ? <span class="hl-t">DEFAULT_SITE</span> : body.site;
    <span class="hl-c">// kind 的规则：</span>
