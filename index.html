<span class="hl-k">if</span> (e <span class="hl-k">instanceof</span> <span class="hl-t">Error</span>) console.log(e.message);       <span class="hl-c">// catch 里的 e 默认是 unknown</span></code></pre></article></div></section><section class="sx-sec" id="ts-gen"><h2>泛型 &amp;lt;T&amp;gt;</h2><p class="sx-desc">泛型就是“类型的参数”：同一段代码，可以用在不同类型上，还保持类型安全。</p><div class="sx-grid"><article class="sx-item"><h3><code>泛型函数</code></h3><p class="sx-what">尖括号里的 T 是一个占位符，调用时由传进来的值决定。</p><pre class="code"><code><span class="hl-k">function</span> first&lt;<span class="hl-t">T</span>&gt;(list: <span class="hl-t">T</span>[]): <span class="hl-t">T</span> | <span class="hl-k">undefined</span> { <span class="hl-k">return</span> list[0]; }
first([1, 2, 3]);        <span class="hl-c">// 类型是 number | undefined</span>
first([<span class="hl-s">"a"</span>, <span class="hl-s">"b"</span>]);       <span class="hl-c">// 类型是 string | undefined</span></code></pre></article><article class="sx-item"><h3><code>常见的内置泛型</code></h3><p class="sx-what"><b>Promise&lt;T&gt;</b> 将来会给你一个 T；<b>Array&lt;T&gt;</b>；<b>Record&lt;K, V&gt;</b> 键值字典。</p><pre class="code"><code><span class="hl-k">async</span> <span class="hl-k">function</span> getUser(): <span class="hl-t">Promise</span>&lt;<span class="hl-t">User</span>&gt; { ... }   <span class="hl-c">// 返回"将来的 User"</span>
<span class="hl-k">const</span> counts: <span class="hl-t">Record</span>&lt;<span class="hl-k">string</span>, <span class="hl-k">number</span>&gt; = { w: 3, p: 1 };</code></pre></article><article class="sx-item"><h3><code>工具类型</code></h3><p class="sx-what">从已有类型“加工”出新类型：<b>Partial</b> 全部变可选、<b>Pick</b> 挑几个、<b>Omit</b> 去掉几个、<b>ReturnType</b> 取函数返回值类型。</p><pre class="code"><code><span class="hl-k">type</span> <span class="hl-t">Favorite</span> = { id: <span class="hl-k">number</span>; userId: <span class="hl-k">number</span>; word: <span class="hl-k">string</span>; status: <span class="hl-k">string</span> };
<span class="hl-k">type</span> <span class="hl-t">FavoriteView</span> = <span class="hl-t">Omit</span>&lt;<span class="hl-t">Favorite</span>, <span class="hl-s">"userId"</span>&gt;;        <span class="hl-c">// 返回给前端：去掉 userId</span>
<span class="hl-k">type</span> <span class="hl-t">FavoritePatch</span> = <span class="hl-t">Partial</span>&lt;<span class="hl-t">Pick</span>&lt;<span class="hl-t">Favorite</span>, <span class="hl-s">"word"</span> | <span class="hl-s">"status"</span>&gt;&gt;;  <span class="hl-c">// PUT 时两个都可选</span>
<span class="hl-k">type</span> <span class="hl-t">Db</span> = <span class="hl-t">ReturnType</span>&lt;<span class="hl-k">typeof</span> createDb&gt;;               <span class="hl-c">// 我们后端：Db 的类型直接从函数推出来</span></code></pre></article></div></section><section class="sx-sec" id="ts-cfg"><h2>配置与小技巧</h2><p class="sx-desc">tsconfig.json 和几个经常看到的写法。</p><div class="sx-grid"><article class="sx-item"><h3><code>tsconfig.json 关键项</code></h3><p class="sx-what"><b>strict</b>：打开所有严格检查（一定要开）；<b>target</b>：编译成哪个版本的 JS；<b>module</b>：用哪种模块系统。</p><pre class="code"><code>{
  <span class="hl-s">"compilerOptions"</span>: {
    <span class="hl-s">"strict"</span>: <span class="hl-k">true</span>,            <span class="hl-c">// 严格模式：null 检查、隐式 any 报错……</span>
    <span class="hl-s">"target"</span>: <span class="hl-s">"ES2022"</span>,
    <span class="hl-s">"module"</span>: <span class="hl-s">"NodeNext"</span>,      <span class="hl-c">// Node 的 ESM 规则：导入本地文件要写 .js</span>
    <span class="hl-s">"outDir"</span>: <span class="hl-s">"dist"</span>
  }
}</code></pre></article><article class="sx-item"><h3><code>import type</code></h3><p class="sx-what">只导入类型，编译后整行消失，不会产生运行时依赖。</p><pre class="code"><code><span class="hl-k">import</span> <span class="hl-k">type</span> { <span class="hl-t">Deps</span> } <span class="hl-k">from</span> <span class="hl-s">"../deps.js"</span>;        <span class="hl-c">// 只用到类型</span>
<span class="hl-k">import</span> { createDb } <span class="hl-k">from</span> <span class="hl-s">"./db/client.js"</span>;     <span class="hl-c">// 用到真实的函数</span></code></pre></article><article class="sx-item"><h3><code>as 类型断言</code></h3><p class="sx-what">告诉 TS“按我说的类型来”。它不做任何检查，用错了运行时照样出错，能不用就不用。</p><pre class="code"><code><span class="hl-k">const</span> el = document.getElementById(<span class="hl-s">"app"</span>) <span class="hl-k">as</span> <span class="hl-t">HTMLDivElement</span>;
<span class="hl-k">const</span> v = input <span class="hl-k">as</span> <span class="hl-t">Kind</span>;   <span class="hl-c">// ⚠️ 只是“骗过”编译器，不会真的检查 input</span></code></pre></article></div></section></div>
</div>
</template>
<template id="tpl-sx-node">
<div class="sx" v-pre>
<div class="sx-wrap"><div class="sx-chips"><span class="sx-chip">让 JavaScript 跑在服务器上</span><span class="sx-chip">我们线上后端的运行环境</span><span class="sx-chip">npm 管依赖</span></div><h1 class="sx-h1">Node.js 语法与核心概念</h1><p class="sx-intro">Node.js 不是一门新语言，而是一个「能在电脑 / 服务器上运行 JavaScript 的程序」。浏览器里的 JS 能操作网页，Node 里的 JS 能读写文件、开端口、连数据库。这一篇讲 Node 特有的东西：进程、模块、npm、环境变量、事件循环、文件和网络。</p><nav class="sx-nav" aria-label="章节"><a href="#node-what">Node 是什么</a><a href="#node-npm">npm 与 package.json</a><a href="#node-env">环境变量与配置</a><a href="#node-loop">单线程与事件循环</a><a href="#node-api">常用内置模块</a></nav><section class="sx-sec" id="node-what"><h2>Node 是什么</h2><p class="sx-desc">把它想成「装在服务器上的、没有网页的浏览器引擎」。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 236" role="img" aria-label="同一门语言，换了运行环境，能用的 API 不一样：Node 拿掉了网页相关的，加上了操作系统相关的"><g filter="url(#sxwob)"><rect x="20" y="14" width="260" height="208" rx="12" class="sx-s" fill="var(--blue)" fill-opacity=".35"/><rect x="360" y="14" width="260" height="208" rx="12" class="sx-s" fill="var(--mint)" fill-opacity=".35"/><rect x="36" y="52" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="92" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="132" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="172" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="376" y="52" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="92" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="132" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="172" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/></g><text x="150.0" y="36" text-anchor="middle" font-size="13.5" font-weight="700" class="">浏览器里的 JavaScript</text><text x="490.0" y="36" text-anchor="middle" font-size="13.5" font-weight="700" class="">Node.js 里的 JavaScript</text><text x="150.0" y="72" text-anchor="middle" font-size="12" class="">能用：document、window</text><text x="150.0" y="112" text-anchor="middle" font-size="12" class="">能用：fetch、localStorage</text><text x="150.0" y="152" text-anchor="middle" font-size="12" class="">不能：读写电脑上的文件</text><text x="150.0" y="192" text-anchor="middle" font-size="12" class="">不能：开一个端口等别人来连</text><text x="490.0" y="72" text-anchor="middle" font-size="12" class="">没有：document、window</text><text x="490.0" y="112" text-anchor="middle" font-size="12" class="">能用：fetch、process、fs</text><text x="490.0" y="152" text-anchor="middle" font-size="12" class="">能：读写文件、连数据库</text><text x="490.0" y="192" text-anchor="middle" font-size="12" class="">能：监听 8080 端口当服务器</text></svg><figcaption>同一门语言，换了运行环境，能用的 API 不一样：Node 拿掉了网页相关的，加上了操作系统相关的</figcaption></figure><article class="sx-item"><h3><code>运行一个文件</code></h3><p class="sx-what"><code>node 文件名</code> 就启动一个 Node <b>进程</b>，执行完代码就退出；如果代码里开了服务器（listen），进程会一直开着等请求。</p><pre class="code"><code>node hello.js            <span class="hl-c"># 运行 JavaScript</span>
npx tsx dev/server.ts    <span class="hl-c"># 运行 TypeScript（tsx 先帮你去掉类型再交给 Node）</span>
npm run dev              <span class="hl-c"># 运行 package.json 里写好的 dev 命令</span>
<span class="hl-c"># Ctrl + C：结束这个进程（端口也随之释放）</span></code></pre><p class="sx-tip"><b>记住</b>「端口被占用」= 之前那个进程还没关。</p></article><article class="sx-item"><h3><code>process 对象</code></h3><p class="sx-what">代表「当前这个 Node 进程」。最常用：<b>process.env</b> 读环境变量、<b>process.argv</b> 读命令行参数、<b>process.exit()</b> 结束进程。</p><pre class="code"><code><span class="hl-k">const</span> port = <span class="hl-t">Number</span>(process.env.<span class="hl-t">PORT</span> ?? 8080);
<span class="hl-k">const</span> isProd = process.env.<span class="hl-t">NODE_ENV</span> === <span class="hl-s">"production"</span>;
console.log(process.argv);   <span class="hl-c">// ["node", "/path/server.js", ...命令行后面跟的参数]</span>
process.exit(1);             <span class="hl-c">// 非 0 = 出错退出（CI、部署平台会据此判断失败）</span></code></pre></article></div></section><section class="sx-sec" id="node-npm"><h2>npm 与 package.json</h2><p class="sx-desc">相当于 Java 世界的 Maven + pom.xml。</p><div class="sx-grid"><article class="sx-item"><h3><code>package.json</code></h3><p class="sx-what">项目说明书：名字、依赖、能跑哪些命令。<b>dependencies</b> 运行时要用的；<b>devDependencies</b> 只在开发 / 测试时用。</p><pre class="code"><code>{
  <span class="hl-s">"name"</span>: <span class="hl-s">"ielts-backend-node"</span>,
  <span class="hl-s">"type"</span>: <span class="hl-s">"module"</span>,                  <span class="hl-c">// 用 ESM（import / export）</span>
  <span class="hl-s">"scripts"</span>: {
    <span class="hl-s">"dev"</span>: <span class="hl-s">"tsx watch dev/server.ts"</span>,  <span class="hl-c">// npm run dev</span>
    <span class="hl-s">"test"</span>: <span class="hl-s">"vitest run"</span>,              <span class="hl-c">// npm test</span>
    <span class="hl-s">"db:migrate"</span>: <span class="hl-s">"drizzle-kit migrate"</span>
  },
  <span class="hl-s">"dependencies"</span>: { <span class="hl-s">"express"</span>: <span class="hl-s">"^5.3.0"</span>, <span class="hl-s">"jose"</span>: <span class="hl-s">"^6.2.14"</span> },
  <span class="hl-s">"devDependencies"</span>: { <span class="hl-s">"vitest"</span>: <span class="hl-s">"^5.0.5"</span>, <span class="hl-s">"typescript"</span>: <span class="hl-s">"^5.9.3"</span> }
}</code></pre></article><article class="sx-item"><h3><code>常用命令</code></h3><p class="sx-what">装依赖、跑脚本、临时执行一个包。</p><pre class="code"><code>npm install            <span class="hl-c"># 按 package.json 装好所有依赖到 node_modules/</span>
npm install express    <span class="hl-c"># 新装一个包（会写进 dependencies）</span>
npm install -D vitest  <span class="hl-c"># 装成开发依赖</span>
npm ci                 <span class="hl-c"># 按 package-lock.json 一模一样地装（部署、CI 用）</span>
npm run dev            <span class="hl-c"># 执行 scripts 里的 dev</span>
npx drizzle-kit generate   <span class="hl-c"># 临时运行一个包里的命令</span></code></pre></article><article class="sx-item"><h3><code>版本号 ^5.3.0</code></h3><p class="sx-what">三段：<b>主版本.次版本.补丁</b>。<code>^</code> 表示「允许升级次版本和补丁，不升主版本」。<b>package-lock.json</b> 记下实际装的精确版本，保证大家装出来一样。</p><pre class="code"><code>^5.3.0   →  可以装 5.3.1、5.9.0，不能装 6.0.0
~5.3.0   →  只能装 5.3.x
5.3.0    →  只能是这一个版本</code></pre><p class="sx-tip"><b>记住</b>node_modules 不要提交到 Git，package-lock.json 要提交。</p></article></div></section><section class="sx-sec" id="node-env"><h2>环境变量与配置</h2><p class="sx-desc">密钥、数据库地址不写进代码，而是由「运行这个进程的环境」交给它。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 96" role="img" aria-label="环境变量从哪来：本地放 .env，线上填在 Vercel 设置里；代码只认 process.env，不关心值从哪来"><g filter="url(#sxwob)"><rect x="10.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M151.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="170.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--blue)"/><path d="M312.0 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="331.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--mint)"/><path d="M472.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="491.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--lilac)"/></g><text x="79.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">.env 文件 / Vercel 设置</text><text x="79.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">APP_JWT_SECRET=...</text><text x="239.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">启动进程时带上</text><text x="239.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">操作系统交给进程</text><text x="400.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">process.env</text><text x="400.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">代码里读取</text><text x="560.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">config.ts</text><text x="560.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">集中检查一次</text></svg><figcaption>环境变量从哪来：本地放 .env，线上填在 Vercel 设置里；代码只认 process.env，不关心值从哪来</figcaption></figure><article class="sx-item"><h3><code>dotenv 与 .env</code></h3><p class="sx-what">本地开发时，用 dotenv 把 .env 文件里的「名字=值」读进 process.env。.env 一定要写进 .gitignore。</p><pre class="code"><code><span class="hl-c">// .env（不提交到 Git）</span>
<span class="hl-c">// DATABASE_URL="postgresql://...neon.tech/neondb"</span>
<span class="hl-c">// APP_JWT_SECRET="一串很长的随机字符"</span>

<span class="hl-k">import</span> <span class="hl-s">"dotenv/config"</span>;                 <span class="hl-c">// 一行就把 .env 读进 process.env</span>
<span class="hl-k">const</span> url = process.env.<span class="hl-t">DATABASE_URL</span>;   <span class="hl-c">// 读到了</span></code></pre></article><article class="sx-item"><h3><code>集中读取 + 启动时检查</code></h3><p class="sx-what">所有配置在一个文件里读，生产环境缺关键配置就直接拒绝启动。我们后端的 config.ts 就是这样。</p><pre class="code"><code><span class="hl-k">export</span> <span class="hl-k">function</span> loadConfig(env = process.env) {
  <span class="hl-k">const</span> jwtSecret = env.<span class="hl-t">APP_JWT_SECRET</span> ?? <span class="hl-s">""</span>;
  <span class="hl-k">if</span> (env.<span class="hl-t">NODE_ENV</span> === <span class="hl-s">"production"</span> &amp;&amp; jwtSecret.length &lt; 32) {
    <span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">Error</span>(<span class="hl-s">"生产环境必须设置 APP_JWT_SECRET，且至少 32 个字符"</span>);
  }
  <span class="hl-k">return</span> { jwtSecret, databaseUrl: env.<span class="hl-t">DATABASE_URL</span> };
}</code></pre><p class="sx-tip"><b>记住</b>宁可起不来，也不要带着不安全的配置上线。</p></article></div></section><section class="sx-sec" id="node-loop"><h2>单线程与事件循环</h2><p class="sx-desc">Node 只有一个主线程，却能同时服务很多请求，秘密就是「不等」。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 250" role="img" aria-label="像一个服务员同时照顾很多桌：点完菜交给厨房，不站在厨房门口等，先去招呼下一桌；菜好了再端过去"><g filter="url(#sxwob)"><ellipse cx="320.0" cy="127.0" rx="158" ry="88" class="sx-s sx-dash" fill="none"/><rect x="250.0" y="103.0" width="140" height="48" rx="24" class="sx-s" fill="var(--yellow)"/><rect x="250.0" y="17.0" width="140" height="44" rx="9" class="sx-s" fill="var(--blue)"/><rect x="408.0" y="105.0" width="140" height="44" rx="9" class="sx-s" fill="var(--mint)"/><rect x="250.0" y="193.0" width="140" height="44" rx="9" class="sx-s" fill="var(--yellow)"/><rect x="92.0" y="105.0" width="140" height="44" rx="9" class="sx-s" fill="var(--pink)"/></g><text x="320.0" y="132.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">主线程（只有一个）</text><text x="320.0" y="37.0" text-anchor="middle" font-size="12.5" font-weight="700" class="">请求 A 进来</text><text x="320.0" y="53.0" text-anchor="middle" font-size="10.5" class="sx-sub">执行到 await 查数据库</text><text x="478.0" y="125.0" text-anchor="middle" font-size="12.5" font-weight="700" class="">交给系统去等</text><text x="478.0" y="141.0" text-anchor="middle" font-size="10.5" class="sx-sub">数据库在另一台机器上忙</text><text x="320.0" y="213.0" text-anchor="middle" font-size="12.5" font-weight="700" class="">请求 B 进来</text><text x="320.0" y="229.0" text-anchor="middle" font-size="10.5" class="sx-sub">主线程空着，先处理 B</text><text x="162.0" y="125.00000000000001" text-anchor="middle" font-size="12.5" font-weight="700" class="">A 的结果回来</text><text x="162.0" y="141.0" text-anchor="middle" font-size="10.5" class="sx-sub">回调排队，主线程接着处理 A</text><circle r="6" class="sx-s" fill="var(--pink)"><animateMotion dur="6s" repeatCount="indefinite" path="M320.0 39.0 A 158 88 0 1 1 319.9 39.0"/></circle></svg><figcaption>像一个服务员同时照顾很多桌：点完菜交给厨房，不站在厨房门口等，先去招呼下一桌；菜好了再端过去</figcaption></figure><article class="sx-item"><h3><code>阻塞 vs 不阻塞</code></h3><p class="sx-what">await 一个异步操作不会卡住别人；但一个很久的<b>同步计算</b>（比如死循环、超大 JSON 处理）会卡住所有请求。</p><pre class="code"><code><span class="hl-c">// ✅ 不阻塞：等数据库时，主线程去处理别的请求</span>
<span class="hl-k">const</span> rows = <span class="hl-k">await</span> db.select().<span class="hl-k">from</span>(favoriteWord);

<span class="hl-c">// ❌ 阻塞：这 3 秒里，所有用户的请求都在排队</span>
<span class="hl-k">const</span> end = <span class="hl-t">Date</span>.now() + 3000;
while (<span class="hl-t">Date</span>.now() &lt; end) {}        <span class="hl-c">// 同步死等</span>

<span class="hl-c">// 文件也一样：fs.readFileSync 会阻塞，fs.promises.readFile 不会</span></code></pre><p class="sx-tip"><b>记住</b>和 Java（一个请求一个线程）对比：Java 靠多线程并行，Node 靠「不等」。</p></article></div></section><section class="sx-sec" id="node-api"><h2>常用内置模块</h2><p class="sx-desc">Node 自带的工具箱，不用装。导入时可以加 node: 前缀。</p><div class="sx-grid"><article class="sx-item"><h3><code>fs 文件</code></h3><p class="sx-what">读写文件。推荐用 promise 版本（不阻塞）。</p><pre class="code"><code><span class="hl-k">import</span> { readFile, writeFile } <span class="hl-k">from</span> <span class="hl-s">"node:fs/promises"</span>;
<span class="hl-k">const</span> text = <span class="hl-k">await</span> readFile(<span class="hl-s">"data/words.json"</span>, <span class="hl-s">"utf8"</span>);
<span class="hl-k">await</span> writeFile(<span class="hl-s">"out.txt"</span>, <span class="hl-s">"hello"</span>);</code></pre></article><article class="sx-item"><h3><code>path 路径</code></h3><p class="sx-what">拼路径时用它，自动处理不同系统的斜杠。</p><pre class="code"><code><span class="hl-k">import</span> path <span class="hl-k">from</span> <span class="hl-s">"node:path"</span>;
path.join(<span class="hl-s">"data"</span>, <span class="hl-s">"ielts.db"</span>);        <span class="hl-c">// "data/ielts.db"</span>
path.extname(<span class="hl-s">"index.html"</span>);           <span class="hl-c">// ".html"</span></code></pre></article><article class="sx-item"><h3><code>http 与 listen</code></h3><p class="sx-what">Express 底下其实是 Node 自带的 http 模块。<code>listen(8080)</code> 让进程占住 8080 端口，开始接收请求。</p><pre class="code"><code><span class="hl-k">import</span> http <span class="hl-k">from</span> <span class="hl-s">"node:http"</span>;
<span class="hl-k">const</span> server = http.createServer((req, res) =&gt; {
  res.end(<span class="hl-s">"hello"</span>);                 <span class="hl-c">// 最原始的写法：自己处理每个请求</span>
});
server.listen(8080, () =&gt; console.log(<span class="hl-s">"listening on 8080"</span>));
<span class="hl-c">// 有了 Express，就是 app.listen(8080)</span></code></pre></article><article class="sx-item"><h3><code>fetch / crypto</code></h3><p class="sx-what">Node 18+ 自带 fetch（和浏览器一样）；crypto 生成随机数、哈希。</p><pre class="code"><code><span class="hl-k">const</span> res = <span class="hl-k">await</span> fetch(<span class="hl-s">"https://oauth2.googleapis.com/tokeninfo?id_token=..."</span>);
<span class="hl-k">const</span> data = <span class="hl-k">await</span> res.json();

<span class="hl-k">import</span> { randomBytes } <span class="hl-k">from</span> <span class="hl-s">"node:crypto"</span>;
randomBytes(32).toString(<span class="hl-s">"hex"</span>);   <span class="hl-c">// 生成一个随机密钥</span></code></pre></article></div></section></div>
</div>
</template>
<template id="tpl-sx-express">
<div class="sx" v-pre>
<div class="sx-wrap"><div class="sx-chips"><span class="sx-chip">Node 上最常用的 Web 框架</span><span class="sx-chip">我们线上后端在用 Express 5</span><span class="sx-chip">相当于 Spring MVC</span></div><h1 class="sx-h1">Express 语法</h1><p class="sx-intro">Express 帮你做三件事：接住 HTTP 请求、按「方法 + 路径」找到对应的处理函数、把你的返回值发回去。核心只有两个概念：<b>路由</b>（哪个网址交给谁）和<b>中间件</b>（请求经过的一道道关卡）。</p><nav class="sx-nav" aria-label="章节"><a href="#ex-app">app 与启动</a><a href="#ex-route">路由</a><a href="#ex-mw">中间件</a><a href="#ex-res">返回响应</a><a href="#ex-test">测试 Express</a></nav><section class="sx-sec" id="ex-app"><h2>app 与启动</h2><p class="sx-desc">从零搭一个最小的后端。</p><div class="sx-grid"><article class="sx-item"><h3><code>创建 app、监听端口</code></h3><p class="sx-what">express() 造出一个 app 对象；app.listen 让它开始在端口上等请求。</p><pre class="code"><code><span class="hl-k">import</span> express <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-k">const</span> app = express();                       <span class="hl-c">// 造一个应用</span>
app.get(<span class="hl-s">"/health"</span>, (req, res) =&gt; {           <span class="hl-c">// GET /health 交给这个函数</span>
  res.json({ ok: <span class="hl-k">true</span> });
});
app.listen(8080, () =&gt; console.log(<span class="hl-s">"http://localhost:8080"</span>));</code></pre></article><article class="sx-item"><h3><code>我们后端的结构：createApp(deps)</code></h3><p class="sx-what">把「装配 app」写成一个函数，零件从外面传进来。线上传真数据库，测试传内存数据库，同一套代码。</p><pre class="code"><code><span class="hl-k">export</span> <span class="hl-k">function</span> createApp(deps: <span class="hl-t">Deps</span>) {
  <span class="hl-k">const</span> app = express();
  app.use(cors({ origin: deps.allowedOrigins }));  <span class="hl-c">// 跨域放行条</span>
  app.use(express.json({ limit: <span class="hl-s">"10kb"</span> }));        <span class="hl-c">// 解析 JSON 请求体</span>
  app.get(<span class="hl-s">"/health"</span>, (_req, res) =&gt; res.json({ ok: <span class="hl-k">true</span> }));
  app.use(createAuthRouter(deps));                 <span class="hl-c">// 登录相关接口</span>
  app.use(createFavoritesRouter(deps));            <span class="hl-c">// 收藏相关接口</span>
  app.use((_req, res) =&gt; res.status(404).json({ error: <span class="hl-s">"not_found"</span> }));  <span class="hl-c">// 都没匹配上</span>
  <span class="hl-k">return</span> app;
}</code></pre><p class="sx-tip"><b>记住</b>Spring 自动扫描、自动注入；Express 什么都要你亲手按顺序挂上去。</p></article></div></section><section class="sx-sec" id="ex-route"><h2>路由</h2><p class="sx-desc">「方法 + 路径」对应一个处理函数。</p><div class="sx-grid"><article class="sx-item"><h3><code>app.get / post / put / delete</code></h3><p class="sx-what">第一个参数是路径，第二个是处理函数 (req, res)。</p><pre class="code"><code>app.get(<span class="hl-s">"/favorites"</span>, handler);          <span class="hl-c">// 查</span>
app.post(<span class="hl-s">"/favorites"</span>, handler);         <span class="hl-c">// 增</span>
app.put(<span class="hl-s">"/favorites/:id"</span>, handler);      <span class="hl-c">// 改</span>
app.delete(<span class="hl-s">"/favorites/:id"</span>, handler);   <span class="hl-c">// 删</span></code></pre></article><article class="sx-item"><h3><code>路径参数 / 查询参数 / 请求体 / 请求头</code></h3><p class="sx-what">四个地方取前端传来的东西。</p><pre class="code"><code><span class="hl-c">// DELETE /favorites/12</span>
req.params.id            <span class="hl-c">// "12"（永远是字符串，要自己转数字）</span>

<span class="hl-c">// GET /favorites?site=jlpt</span>
req.query.site           <span class="hl-c">// "jlpt"</span>

<span class="hl-c">// POST /favorites  body: {"word":"abandon"}</span>
req.body.word            <span class="hl-c">// "abandon"（要先挂 express.json() 中间件）</span>

req.headers.authorization  <span class="hl-c">// "Bearer eyJ..."</span></code></pre></article><article class="sx-item"><h3><code>Router：一组路由</code></h3><p class="sx-what">把相关的接口放进一个 Router，再挂到 app 上。相当于 Spring 的一个 @RestController 类。</p><pre class="code"><code><span class="hl-k">export</span> <span class="hl-k">function</span> createFavoritesRouter(deps: <span class="hl-t">Deps</span>) {
  <span class="hl-k">const</span> router = express.<span class="hl-t">Router</span>();
  router.use(<span class="hl-s">"/favorites"</span>, requireAuth(deps.jwt));   <span class="hl-c">// 这组接口都要先过门卫</span>
  router.get(<span class="hl-s">"/favorites"</span>, <span class="hl-k">async</span> (req, res) =&gt; { ... });
  router.post(<span class="hl-s">"/favorites"</span>, <span class="hl-k">async</span> (req, res) =&gt; { ... });
  <span class="hl-k">return</span> router;
}</code></pre></article></div></section><section class="sx-sec" id="ex-mw"><h2>中间件</h2><p class="sx-desc">Express 的灵魂：请求从上到下经过一个个函数，每个都可以「放行」或「拦下」。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 96" role="img" aria-label="中间件流水线：app.use 的顺序就是请求经过的顺序；任何一个不调用 next()，请求就停在那里"><g filter="url(#sxwob)"><rect x="10.0" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--card)"/><path d="M119.4 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="138.4" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--blue)"/><path d="M247.8 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="266.8" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M376.2 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="395.2" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--pink)"/><path d="M504.6 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="523.6" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--mint)"/></g><text x="63.2" y="52.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">请求进来</text><text x="191.60000000000002" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">cors</text><text x="191.60000000000002" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">检查来源</text><text x="320.0" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">express.json</text><text x="320.0" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">解析请求体</text><text x="448.40000000000003" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">requireAuth</text><text x="448.40000000000003" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">验 token</text><text x="576.8000000000001" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">路由处理函数</text><text x="576.8000000000001" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">查库、返回</text></svg><figcaption>中间件流水线：app.use 的顺序就是请求经过的顺序；任何一个不调用 next()，请求就停在那里</figcaption></figure><article class="sx-item"><h3><code>(req, res, next)</code></h3><p class="sx-what">中间件就是一个多了 next 参数的函数。调用 <b>next()</b> 交给下一个；不调用、直接 res.xxx()，就在这里结束。</p><pre class="code"><code><span class="hl-c">// 我们的门卫（简化）</span>
<span class="hl-k">export</span> <span class="hl-k">const</span> requireAuth = (jwt: <span class="hl-t">JwtService</span>) =&gt; <span class="hl-k">async</span> (req, res, next) =&gt; {
  <span class="hl-k">const</span> header = req.headers.authorization ?? <span class="hl-s">""</span>;
  <span class="hl-k">const</span> token = header.startsWith(<span class="hl-s">"Bearer "</span>) ? header.slice(7) : <span class="hl-s">""</span>;
  <span class="hl-k">const</span> userId = <span class="hl-k">await</span> jwt.verify(token);
  <span class="hl-k">if</span> (userId === <span class="hl-k">null</span>) {
    res.status(401).json({ error: <span class="hl-s">"unauthorized"</span> });   <span class="hl-c">// 拦下：不调用 next</span>
    <span class="hl-k">return</span>;
  }
  res.locals.userId = userId;   <span class="hl-c">// 把验过的身份放进这次请求的"小口袋"</span>
  next();                        <span class="hl-c">// 放行，交给下一个</span>
};</code></pre><p class="sx-tip"><b>记住</b>res.locals 只活在这一次请求里，适合放「当前用户是谁」。</p></article><article class="sx-item"><h3><code>错误处理中间件</code></h3><p class="sx-what">参数是 <b>4 个</b>（err, req, res, next），Express 认得它，前面任何地方出错都会跳到这里。要挂在最后。</p><pre class="code"><code>app.use((err, _req, res, _next) =&gt; {
  console.error(err);                                  <span class="hl-c">// 日志里留下详细信息</span>
  res.status(500).json({ error: <span class="hl-s">"internal_error"</span> });   <span class="hl-c">// 给前端的不暴露内部细节</span>
});</code></pre></article></div></section><section class="sx-sec" id="ex-res"><h2>返回响应</h2><p class="sx-desc">res 对象上的方法决定回什么。</p><div class="sx-grid"><article class="sx-item"><h3><code>res.json / res.status / res.send</code></h3><p class="sx-what"><b>res.json(对象)</b>：回 JSON（最常用）；<b>res.status(码)</b>：设状态码，可以链式；<b>res.sendStatus(204)</b>：只回状态码。</p><pre class="code"><code>res.json(rows);                                    <span class="hl-c">// 200 + JSON</span>
res.status(400).json({ error: <span class="hl-s">"bad_request"</span> });    <span class="hl-c">// 400 + 错误说明</span>
res.status(404).json({ error: <span class="hl-s">"not_found"</span> });
res.sendStatus(204);                               <span class="hl-c">// 204 No Content，没有内容</span></code></pre></article><article class="sx-item"><h3><code>一个请求只能回一次</code></h3><p class="sx-what">回完以后再 res.json 会报错「Cannot set headers after they are sent」。所以拦下请求后要 <b>return</b>。</p><pre class="code"><code><span class="hl-k">if</span> (!isKind(kind)) {
  res.status(400).json({ error: <span class="hl-s">"bad_request"</span> });
  <span class="hl-k">return</span>;                <span class="hl-c">// ← 不写 return，下面还会继续执行，再回一次就报错</span>
}
res.json(saved);</code></pre></article></div></section><section class="sx-sec" id="ex-test"><h2>测试 Express</h2><p class="sx-desc">不用真的开端口，用 supertest 直接对 app 发请求。</p><div class="sx-grid"><article class="sx-item"><h3><code>supertest + vitest</code></h3><p class="sx-what">request(app) 模拟一次 HTTP 请求，拿到状态码和返回体来断言。</p><pre class="code"><code><span class="hl-k">import</span> request <span class="hl-k">from</span> <span class="hl-s">"supertest"</span>;
it(<span class="hl-s">"没带 token 返回 401"</span>, <span class="hl-k">async</span> () =&gt; {
  <span class="hl-k">const</span> { app } = <span class="hl-k">await</span> makeApp();                 <span class="hl-c">// 内存数据库的 app</span>
  <span class="hl-k">const</span> r = <span class="hl-k">await</span> request(app).get(<span class="hl-s">"/favorites"</span>);  <span class="hl-c">// 不带 Authorization</span>
  expect(r.status).toBe(401);
});</code></pre></article></div></section></div>
</div>
</template>
<template id="tpl-sx-java">
<div class="sx" v-pre>
<div class="sx-wrap"><div class="sx-chips"><span class="sx-chip">Spring Boot 的语言</span><span class="sx-chip">日本公司后端最常见</span><span class="sx-chip">强类型 + 编译</span></div><h1 class="sx-h1">Java 语法</h1><p class="sx-intro">Java 和 JavaScript 名字像，其实差别很大：Java 先<b>编译</b>再运行、每个变量都必须写明<b>类型</b>、一切代码都写在<b>类</b>里。这一篇按「从一行代码到一个程序」的顺序讲，对照你熟悉的 JavaScript。</p><nav class="sx-nav" aria-label="章节"><a href="#java-run">程序怎么跑起来</a><a href="#java-type">变量与类型</a><a href="#java-flow">流程控制与异常</a><a href="#java-oop">类、对象、方法</a><a href="#java-inter">继承、接口、泛型</a><a href="#java-coll">集合、Optional、Lambda</a></nav><section class="sx-sec" id="java-run"><h2>程序怎么跑起来</h2><p class="sx-desc">理解编译和 JVM，很多报错就知道是在哪一步出的。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 96" role="img" aria-label="Java 要先编译：类型写错、少了分号，在「运行之前」就会被编译器拦下"><g filter="url(#sxwob)"><rect x="10.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--blue)"/><path d="M151.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="170.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M312.0 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="331.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--lilac)"/><path d="M472.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="491.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--mint)"/></g><text x="79.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">Hello.java</text><text x="79.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">你写的源码</text><text x="239.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">javac 编译</text><text x="239.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">检查类型、语法</text><text x="400.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">Hello.class</text><text x="400.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">字节码</text><text x="560.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">JVM 执行</text><text x="560.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">java -jar app.jar</text></svg><figcaption>Java 要先编译：类型写错、少了分号，在「运行之前」就会被编译器拦下</figcaption></figure><article class="sx-item"><h3><code>main 方法：程序入口</code></h3><p class="sx-what">JVM 启动后找到 main 方法开始执行。Spring Boot 项目的 main 里只有一行，把整个框架点着。</p><pre class="code"><code><span class="hl-a">@SpringBootApplication</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">IeltsBackendApplication</span> {
    <span class="hl-k">public</span> <span class="hl-k">static</span> <span class="hl-k">void</span> main(<span class="hl-t">String</span>[] args) {          <span class="hl-c">// 固定写法</span>
        <span class="hl-t">SpringApplication</span>.run(<span class="hl-t">IeltsBackendApplication</span>.<span class="hl-k">class</span>, args);
    }
}</code></pre></article><article class="sx-item"><h3><code>package / import</code></h3><p class="sx-what"><b>package</b>：这个文件属于哪个包（必须和文件夹路径一致）。<b>import</b>：用别的包里的类。同一个包里的类不用 import。</p><pre class="code"><code><span class="hl-k">package</span> com.goenkon.ielts;                       <span class="hl-c">// 文件在 src/main/java/com/goenkon/ielts/</span>

<span class="hl-k">import</span> java.util.<span class="hl-t">List</span>;                           <span class="hl-c">// 用 JDK 里的 List</span>
<span class="hl-k">import</span> org.springframework.web.bind.annotation.<span class="hl-t">GetMapping</span>;
<span class="hl-k">import</span> jakarta.persistence.*;                    <span class="hl-c">// * 表示这个包里的全部</span></code></pre></article></div></section><section class="sx-sec" id="java-type"><h2>变量与类型</h2><p class="sx-desc">Java 最大的特点：每个变量都要写类型，而且写好就不能变。</p><div class="sx-grid"><article class="sx-item"><h3><code>声明变量</code></h3><p class="sx-what">顺序是 <b>类型 名字 = 值;</b>，和 TypeScript 正好相反。<b>var</b> 可以让编译器推断（只能用在局部变量）。</p><pre class="code"><code>int page = 1;                 <span class="hl-c">// 整数</span>
long userId = 5<span class="hl-t">L</span>;             <span class="hl-c">// 大整数，数据库 id 常用</span>
double price = 9.9;
boolean ok = <span class="hl-k">true</span>;
char c = <span class="hl-s">'a'</span>;                 <span class="hl-c">// 单个字符：单引号</span>
<span class="hl-t">String</span> word = <span class="hl-s">"abandon"</span>;      <span class="hl-c">// 字符串：双引号，是对象</span>
<span class="hl-k">var</span> list = <span class="hl-k">new</span> <span class="hl-t">ArrayList</span>&lt;<span class="hl-t">String</span>&gt;();   <span class="hl-c">// var：让编译器推断类型</span>
<span class="hl-k">final</span> int <span class="hl-t">MAX</span> = 200;          <span class="hl-c">// final：之后不能再改（像 JS 的 const）</span></code></pre></article><article class="sx-item"><h3><code>基本类型 vs 包装类型</code></h3><p class="sx-what"><b>int、long、boolean</b> 是值本身，不能是 null；<b>Integer、Long、Boolean</b> 是对象，可以是 null。数据库主键用 <b>Long</b>，因为保存前还没有值（null）。</p><pre class="code"><code>long a = 5;        <span class="hl-c">// 值，永远有值</span>
<span class="hl-t">Long</span> b = <span class="hl-k">null</span>;     <span class="hl-c">// 对象，可以是 null</span>
<span class="hl-t">Long</span> id = user.getId();     <span class="hl-c">// 刚 new 出来还没存数据库时是 null</span>
<span class="hl-k">if</span> (id.equals(otherId)) {}  <span class="hl-c">// 两个 Long 比较用 equals，不要用 ==</span></code></pre><p class="sx-tip"><b>记住</b>对象比较用 equals，== 比的是「是不是同一个对象」（地址）。</p></article><figure class="sx-fig"><svg viewBox="0 0 640 196" role="img" aria-label="和 JavaScript 一样：对象变量里存的是地址。方法结束，栈上的变量消失；堆上没人指着的对象由垃圾回收（GC）清掉"><g filter="url(#sxwob)"><rect x="20" y="14" width="260" height="168" rx="12" class="sx-s" fill="var(--blue)" fill-opacity=".35"/><rect x="360" y="14" width="260" height="168" rx="12" class="sx-s" fill="var(--mint)" fill-opacity=".35"/><rect x="36" y="52" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="92" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="132" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="376" y="52" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="92" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><path d="M264 107 C 320 107, 320 107, 376 107" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M264 147 C 320 147, 320 107, 376 107" class="sx-s sx-dash" marker-end="url(#sxah)"/></g><text x="150.0" y="36" text-anchor="middle" font-size="13.5" font-weight="700" class="">栈：方法里的变量</text><text x="490.0" y="36" text-anchor="middle" font-size="13.5" font-weight="700" class="">堆：new 出来的对象</text><text x="150.0" y="72" text-anchor="middle" font-size="12" class="">page = 1（值）</text><text x="150.0" y="112" text-anchor="middle" font-size="12" class="">user ─→（地址）</text><text x="150.0" y="152" text-anchor="middle" font-size="12" class="">copy ─→（同一个地址）</text><text x="490.0" y="72" text-anchor="middle" font-size="12" class=""></text><text x="490.0" y="112" text-anchor="middle" font-size="12" class="">AppUser{ id=1, name=Goen }</text></svg><figcaption>和 JavaScript 一样：对象变量里存的是地址。方法结束，栈上的变量消失；堆上没人指着的对象由垃圾回收（GC）清掉</figcaption></figure><article class="sx-item"><h3><code>String 常用</code></h3><p class="sx-what">字符串不可变：trim()、substring() 都返回新字符串。</p><pre class="code"><code><span class="hl-t">String</span> s = <span class="hl-s">"  Bearer xyz "</span>;
s.trim();                     <span class="hl-c">// "Bearer xyz"</span>
s.trim().startsWith(<span class="hl-s">"Bearer "</span>);   <span class="hl-c">// true</span>
s.trim().substring(7);        <span class="hl-c">// "xyz"</span>
s.isBlank();                  <span class="hl-c">// 是否为空或全是空格</span>
<span class="hl-s">"a"</span>.equals(b);                <span class="hl-c">// 比较内容</span>
<span class="hl-t">String</span>.valueOf(5);            <span class="hl-c">// "5"</span>
<span class="hl-t">Long</span>.valueOf(<span class="hl-s">"12"</span>);           <span class="hl-c">// 12L</span></code></pre></article></div></section><section class="sx-sec" id="java-flow"><h2>流程控制与异常</h2><p class="sx-desc">if、循环、try/catch 和 JS 基本一样，多了「受检异常」。</p><div class="sx-grid"><article class="sx-item"><h3><code>if / switch / 三元</code></h3><p class="sx-what">条件必须是 boolean，不能像 JS 那样用 0 或空字符串。</p><pre class="code"><code><span class="hl-k">if</span> (word == <span class="hl-k">null</span> || word.isBlank()) <span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.badRequest().build();
<span class="hl-t">String</span> label = kind.equals(<span class="hl-s">"w"</span>) ? <span class="hl-s">"单词"</span> : <span class="hl-s">"短语"</span>;
<span class="hl-k">switch</span> (kind) {
    <span class="hl-k">case</span> <span class="hl-s">"w"</span> -&gt; <span class="hl-t">System</span>.out.println(<span class="hl-s">"单词"</span>);     <span class="hl-c">// Java 14+ 的箭头写法，不用 break</span>
    <span class="hl-k">case</span> <span class="hl-s">"p"</span> -&gt; <span class="hl-t">System</span>.out.println(<span class="hl-s">"短语"</span>);
    <span class="hl-k">default</span> -&gt; <span class="hl-t">System</span>.out.println(<span class="hl-s">"未知"</span>);
}</code></pre></article><article class="sx-item"><h3><code>循环</code></h3><p class="sx-what">增强 for（for-each）最常用，相当于 JS 的 for...of。</p><pre class="code"><code><span class="hl-k">for</span> (<span class="hl-t">FavoriteWord</span> f : favorites) {
    <span class="hl-t">System</span>.out.println(f.getWord());
}
<span class="hl-k">for</span> (int i = 0; i &lt; 3; i++) { }
<span class="hl-k">while</span> (cond) { }</code></pre></article><article class="sx-item"><h3><code>try / catch / finally / throw</code></h3><p class="sx-what">和 JS 一样，但 catch 要写<b>捕获哪一种异常</b>。可以写多个 catch。</p><pre class="code"><code><span class="hl-c">// 我们的 JwtService.verify：任何验证失败都返回 null</span>
<span class="hl-k">public</span> <span class="hl-t">Long</span> verify(<span class="hl-t">String</span> token) {
    <span class="hl-k">try</span> {
        <span class="hl-t">String</span> sub = <span class="hl-t">JWT</span>.require(algo).build().verify(token).getSubject();
        <span class="hl-k">return</span> <span class="hl-t">Long</span>.valueOf(sub);
    } <span class="hl-k">catch</span> (<span class="hl-t">JWTVerificationException</span> e) {   <span class="hl-c">// 只接住"验证失败"这一种</span>
        <span class="hl-k">return</span> <span class="hl-k">null</span>;
    } <span class="hl-k">catch</span> (<span class="hl-t">NumberFormatException</span> e) {      <span class="hl-c">// subject 不是数字</span>
        <span class="hl-k">return</span> <span class="hl-k">null</span>;
    }
}
<span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">IllegalArgumentException</span>(<span class="hl-s">"bad kind"</span>);   <span class="hl-c">// 自己抛一个</span></code></pre></article><figure class="sx-fig"><svg viewBox="0 0 640 200" role="img" aria-label="异常会沿着「谁调用了我」一层层往外找 catch，一直没人接，这个请求就以 500 结束，控制台打印堆栈"><g filter="url(#sxwob)"><rect x="14" y="74" width="150" height="52" rx="10" class="sx-s" fill="var(--blue)"/><rect x="245" y="16" width="170" height="52" rx="10" class="sx-s" fill="var(--mint)"/><rect x="245" y="132" width="170" height="52" rx="10" class="sx-s" fill="var(--pink)"/><rect x="490" y="74" width="136" height="52" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M164 92 C 200 92, 210 42, 243 42" class="sx-s" marker-end="url(#sxah)"/><path d="M164 112 C 200 112, 210 158, 243 158" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M415 42 C 450 42, 460 92, 488 92" class="sx-s" marker-end="url(#sxah)"/><path d="M415 158 C 450 158, 460 112, 488 112" class="sx-s sx-dash" marker-end="url(#sxah)"/></g><text x="89.0" y="96" text-anchor="middle" font-size="13" font-weight="700" class="">方法里出了异常</text><text x="89.0" y="114" text-anchor="middle" font-size="10.5" class="sx-sub">throw</text><text x="330.0" y="38" text-anchor="middle" font-size="13" font-weight="700" class="">有 catch 接住</text><text x="330.0" y="56" text-anchor="middle" font-size="10.5" class="sx-sub">在这里处理</text><text x="330.0" y="154" text-anchor="middle" font-size="13" font-weight="700" class="">没人接住</text><text x="330.0" y="172" text-anchor="middle" font-size="10.5" class="sx-sub">一层层往外抛</text><text x="558.0" y="96" text-anchor="middle" font-size="13" font-weight="700" class="">最外层</text><text x="558.0" y="114" text-anchor="middle" font-size="10.5" class="sx-sub">Spring 回 500</text><text x="200" y="58" text-anchor="middle" font-size="11" class="sx-good">正常</text><text x="200" y="150" text-anchor="middle" font-size="11" class="sx-bad">出错</text></svg><figcaption>异常会沿着「谁调用了我」一层层往外找 catch，一直没人接，这个请求就以 500 结束，控制台打印堆栈</figcaption></figure><article class="sx-item"><h3><code>受检异常 throws</code></h3><p class="sx-what">有些异常（如 IOException）编译器强制你处理：要么 catch，要么在方法上写 <b>throws</b> 交给调用者。RuntimeException（空指针等）不强制。</p><pre class="code"><code><span class="hl-k">public</span> boolean preHandle(<span class="hl-t">HttpServletRequest</span> req, <span class="hl-t">HttpServletResponse</span> res, <span class="hl-t">Object</span> handler)
        <span class="hl-k">throws</span> <span class="hl-t">Exception</span> {          <span class="hl-c">// 声明：我可能抛异常，调用我的人（Spring）来处理</span>
    ...
}</code></pre></article></div></section><section class="sx-sec" id="java-oop"><h2>类、对象、方法</h2><p class="sx-desc">Java 里一切代码都写在类里。</p><div class="sx-grid"><article class="sx-item"><h3><code>class / 字段 / 构造器 / 方法</code></h3><p class="sx-what">类是图纸，new 出对象。构造器和类同名、没有返回类型，在 new 的时候执行。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">Greeting</span> {
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">String</span> message;      <span class="hl-c">// 字段：对象身上的数据</span>
    <span class="hl-k">private</span> <span class="hl-k">final</span> int version;

    <span class="hl-k">public</span> <span class="hl-t">Greeting</span>(<span class="hl-t">String</span> message, int version) {   <span class="hl-c">// 构造器</span>
        <span class="hl-k">this</span>.message = message;        <span class="hl-c">// this.字段 = 参数</span>
        <span class="hl-k">this</span>.version = version;
    }

    <span class="hl-k">public</span> <span class="hl-t">String</span> getMessage() { <span class="hl-k">return</span> message; }   <span class="hl-c">// 方法（getter）</span>
}
<span class="hl-t">Greeting</span> g = <span class="hl-k">new</span> <span class="hl-t">Greeting</span>(<span class="hl-s">"Hello"</span>, 1);</code></pre></article><article class="sx-item"><h3><code>访问修饰符</code></h3><p class="sx-what"><b>public</b> 谁都能用；<b>private</b> 只有本类；<b>protected</b> 本包和子类；不写 = 本包。字段一般 private，通过 getter / setter 访问。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">FavoriteWord</span> {
    <span class="hl-k">private</span> <span class="hl-t">Long</span> id;            <span class="hl-c">// 外面不能直接改</span>
    <span class="hl-k">private</span> <span class="hl-t">String</span> word;
    <span class="hl-k">public</span> <span class="hl-t">String</span> getWord() { <span class="hl-k">return</span> word; }
    <span class="hl-k">public</span> <span class="hl-k">void</span> setWord(<span class="hl-t">String</span> word) { <span class="hl-k">this</span>.word = word; }   <span class="hl-c">// 只给该改的字段写 setter</span>
    <span class="hl-c">// 不写 getUserId()：Spring 转 JSON 靠 getter，没有 getter 就不会把 userId 发给前端</span>
}</code></pre></article><article class="sx-item"><h3><code>static</code></h3><p class="sx-what">属于类本身，不属于某个对象，不用 new 就能用。常用于常量和工具方法。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">AuthInterceptor</span> {
    <span class="hl-k">public</span> <span class="hl-k">static</span> <span class="hl-k">final</span> <span class="hl-t">String</span> <span class="hl-t">USER_ID</span> = <span class="hl-s">"userId"</span>;   <span class="hl-c">// 常量：AuthInterceptor.USER_ID</span>
}
<span class="hl-t">Math</span>.max(3, 9);             <span class="hl-c">// 静态方法，直接用类名调用</span></code></pre></article><article class="sx-item"><h3><code>record</code></h3><p class="sx-what">Java 16+ 的「数据盒子」：一行声明字段，自动生成构造器、取值方法、equals、toString。字段不能改。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-k">record</span> <span class="hl-t">NewFavoriteWord</span>(<span class="hl-t">String</span> kind, <span class="hl-t">String</span> word, <span class="hl-t">String</span> status) {}

<span class="hl-t">NewFavoriteWord</span> n = <span class="hl-k">new</span> <span class="hl-t">NewFavoriteWord</span>(<span class="hl-s">"w"</span>, <span class="hl-s">"abandon"</span>, <span class="hl-k">null</span>);
n.word();       <span class="hl-c">// "abandon"（取值方法名就是字段名，不带 get）</span></code></pre><p class="sx-tip"><b>记住</b>接收前端 JSON（DTO）首选 record：只放允许前端决定的字段。</p></article></div></section><section class="sx-sec" id="java-inter"><h2>继承、接口、泛型</h2><p class="sx-desc">看懂 Spring 代码离不开这三样。</p><div class="sx-grid"><article class="sx-item"><h3><code>interface / implements</code></h3><p class="sx-what">接口只规定「要有哪些方法」，不写实现；类用 implements 承诺实现它们。Spring 靠接口「插入」你的代码。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">CorsConfig</span> <span class="hl-k">implements</span> <span class="hl-t">WebMvcConfigurer</span> {   <span class="hl-c">// 按 Spring 规定的接口来写</span>
    <span class="hl-a">@Override</span>                                            <span class="hl-c">// 重写接口里的方法</span>
    <span class="hl-k">public</span> <span class="hl-k">void</span> addCorsMappings(<span class="hl-t">CorsRegistry</span> registry) {
        registry.addMapping(<span class="hl-s">"/**"</span>).allowedOrigins(<span class="hl-s">"https://ielts.goenkon.com"</span>);
    }
}</code></pre></article><article class="sx-item"><h3><code>extends</code></h3><p class="sx-what">继承父类（或接口继承接口），拿到父类全部能力。Java 类只能单继承，但可以实现多个接口。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-k">interface</span> <span class="hl-t">AppUserRepository</span> <span class="hl-k">extends</span> <span class="hl-t">JpaRepository</span>&lt;<span class="hl-t">AppUser</span>, <span class="hl-t">Long</span>&gt; {
    <span class="hl-c">// 继承后自动拥有 save、findById、findAll、delete……</span>
    <span class="hl-t">Optional</span>&lt;<span class="hl-t">AppUser</span>&gt; findByGoogleSub(<span class="hl-t">String</span> googleSub);   <span class="hl-c">// 再加一个自己的</span>
}</code></pre></article><article class="sx-item"><h3><code>泛型 &lt;T&gt;</code></h3><p class="sx-what">尖括号里写「装的是什么类型」，和 TypeScript 的泛型一样。</p><pre class="code"><code><span class="hl-t">List</span>&lt;<span class="hl-t">String</span>&gt; words = <span class="hl-k">new</span> <span class="hl-t">ArrayList</span>&lt;&gt;();      <span class="hl-c">// 只能装 String</span>
<span class="hl-t">Map</span>&lt;<span class="hl-t">String</span>, <span class="hl-t">Integer</span>&gt; counts = <span class="hl-k">new</span> <span class="hl-t">HashMap</span>&lt;&gt;();
<span class="hl-t">JpaRepository</span>&lt;<span class="hl-t">AppUser</span>, <span class="hl-t">Long</span>&gt;                 <span class="hl-c">// 操作 AppUser，主键是 Long</span>
<span class="hl-t">ResponseEntity</span>&lt;?&gt;                            <span class="hl-c">// ? = 什么类型都行</span></code></pre></article></div></section><section class="sx-sec" id="java-coll"><h2>集合、Optional、Lambda</h2><p class="sx-desc">处理数据时天天用。</p><div class="sx-grid"><article class="sx-item"><h3><code>List / Map / Set</code></h3><p class="sx-what"><b>List</b> 有序列表（像 JS 数组）；<b>Map</b> 键值对；<b>Set</b> 不重复集合。</p><pre class="code"><code><span class="hl-t">List</span>&lt;<span class="hl-t">String</span>&gt; list = <span class="hl-k">new</span> <span class="hl-t">ArrayList</span>&lt;&gt;(<span class="hl-t">List</span>.of(<span class="hl-s">"a"</span>, <span class="hl-s">"b"</span>));
list.add(<span class="hl-s">"c"</span>); list.get(0); list.size();
<span class="hl-t">Map</span>&lt;<span class="hl-t">String</span>, <span class="hl-t">Object</span>&gt; m = <span class="hl-t">Map</span>.of(<span class="hl-s">"error"</span>, <span class="hl-s">"unauthorized"</span>);   <span class="hl-c">// 只读 Map，会被转成 JSON</span>
<span class="hl-t">Set</span>&lt;<span class="hl-t">String</span>&gt; kinds = <span class="hl-t">Set</span>.of(<span class="hl-s">"w"</span>, <span class="hl-s">"p"</span>);
kinds.contains(<span class="hl-s">"g"</span>);    <span class="hl-c">// false</span></code></pre></article><article class="sx-item"><h3><code>Optional</code></h3><p class="sx-what">「可能有、可能没有」的盒子。查数据库可能查不到，用它逼你处理「没找到」的情况，避免空指针。</p><pre class="code"><code><span class="hl-t">Optional</span>&lt;<span class="hl-t">AppUser</span>&gt; found = userRepository.findByGoogleSub(sub);
found.isPresent();                        <span class="hl-c">// 有没有</span>
<span class="hl-t">AppUser</span> u = found.orElse(<span class="hl-k">null</span>);           <span class="hl-c">// 没有就给 null</span>
<span class="hl-t">AppUser</span> user = found.orElseGet(() -&gt; userRepository.save(<span class="hl-k">new</span> <span class="hl-t">AppUser</span>(sub)));  <span class="hl-c">// 没有就新建</span>
found.ifPresent(repo::delete);            <span class="hl-c">// 有才执行</span></code></pre></article><article class="sx-item"><h3><code>Lambda 与方法引用</code></h3><p class="sx-what"><code>参数 -&gt; 表达式</code> 是一小段函数，像 JS 的箭头函数。<code>类::方法</code> 是更短的写法。</p><pre class="code"><code>words.forEach(w -&gt; <span class="hl-t">System</span>.out.println(w));
words.forEach(<span class="hl-t">System</span>.out::println);          <span class="hl-c">// 方法引用：同上</span>
.orElseGet(<span class="hl-k">this</span>::unauthorized)               <span class="hl-c">// 调用本对象的 unauthorized()</span></code></pre></article><article class="sx-item"><h3><code>Stream</code></h3><p class="sx-what">对集合做 map / filter / collect，像 JS 的数组方法链。</p><pre class="code"><code><span class="hl-t">List</span>&lt;<span class="hl-t">String</span>&gt; wordsOnly = favorites.stream()
    .filter(f -&gt; f.getKind().equals(<span class="hl-s">"w"</span>))   <span class="hl-c">// 留下单词</span>
    .map(<span class="hl-t">FavoriteWord</span>::getWord)             <span class="hl-c">// 只要文字</span>
    .toList();                              <span class="hl-c">// 收集成新的 List</span></code></pre></article></div></section></div>
</div>
</template>
<template id="tpl-sx-spring">
<div class="sx" v-pre>
<div class="sx-wrap"><div class="sx-chips"><span class="sx-chip">Java 的 Web 框架</span><span class="sx-chip">@ 开头的都是给框架看的标签</span><span class="sx-chip">IoC 容器 + 依赖注入</span></div><h1 class="sx-h1">Spring Boot 与 @ 注解</h1><p class="sx-intro">Spring 最让人困惑的就是满屏的 <b>@</b>。记住一句话：<b>注解自己什么都不做，它只是贴在类、方法、字段、参数上的一张标签；是 Spring 在启动时（或请求到来时）读到标签，再替你干活。</b>下面先讲 Spring 在干什么，再把每个 @ 按「贴在哪儿」分类讲清楚。</p><nav class="sx-nav" aria-label="章节"><a href="#sp-ioc">Spring 在干什么：IoC 与依赖注入</a><a href="#sp-class">贴在类上的注解</a><a href="#sp-method">贴在方法上的注解</a><a href="#sp-param">贴在参数上的注解</a><a href="#sp-jpa">数据库相关的注解（JPA）</a><a href="#sp-req">一个请求在 Spring 里怎么走</a></nav><section class="sx-sec" id="sp-ioc"><h2>Spring 在干什么：IoC 与依赖注入</h2><p class="sx-desc">先懂这个，@ 注解就都有了着落。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 96" role="img" aria-label="SpringApplication.run 那一行在启动的几秒里做了这五件事；之后每个请求用的都是这批已经造好的对象"><g filter="url(#sxwob)"><rect x="10.0" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--blue)"/><path d="M119.4 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="138.4" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M247.8 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="266.8" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--mint)"/><path d="M376.2 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="395.2" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--lilac)"/><path d="M504.6 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="523.6" y="16" width="106.4" height="64" rx="10" class="sx-s" fill="var(--pink)"/></g><text x="63.2" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">扫描</text><text x="63.2" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">找贴了 @Component 等标签的类</text><text x="191.60000000000002" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">造对象</text><text x="191.60000000000002" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">每个类 new 一个，叫 Bean</text><text x="320.0" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">注入</text><text x="320.0" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">按构造器需要，把 Bean 递过去</text><text x="448.40000000000003" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">登记网址</text><text x="448.40000000000003" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">@GetMapping 等记进路由表</text><text x="576.8000000000001" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">开门</text><text x="576.8000000000001" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">监听 8080，等请求</text></svg><figcaption>SpringApplication.run 那一行在启动的几秒里做了这五件事；之后每个请求用的都是这批已经造好的对象</figcaption></figure><article class="sx-item"><h3><code>控制反转（IoC）</code></h3><p class="sx-what">本来是你自己 new 对象、自己调用；现在是<b>Spring 帮你 new、在合适的时机调用你的方法</b>。控制权从你手里交给了框架，所以叫「反转」。</p><pre class="code"><code><span class="hl-c">// 没有 Spring：自己创建、自己传</span>
<span class="hl-k">var</span> repo = <span class="hl-k">new</span> <span class="hl-t">FavoriteWordRepositoryImpl</span>(dataSource);
<span class="hl-k">var</span> controller = <span class="hl-k">new</span> <span class="hl-t">FavoriteWordController</span>(repo);

<span class="hl-c">// 有 Spring：只声明"我需要什么"，谁来 new、什么时候 new，都不用管</span>
<span class="hl-a">@RestController</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">FavoriteWordController</span> {
    <span class="hl-k">private</span> <span class="hl-k">final</span> <span class="hl-t">FavoriteWordRepository</span> repository;
    <span class="hl-k">public</span> <span class="hl-t">FavoriteWordController</span>(<span class="hl-t">FavoriteWordRepository</span> repository) {   <span class="hl-c">// 构造器注入</span>
        <span class="hl-k">this</span>.repository = repository;   <span class="hl-c">// Spring 启动时把造好的 Repository 传进来</span>
    }
}</code></pre><p class="sx-tip"><b>记住</b>我们全部用「构造器注入」：依赖写成 private final 字段 + 构造器参数，不需要 @Autowired。</p></article><article class="sx-item"><h3><code>Bean 是单例</code></h3><p class="sx-what">每个 Bean 默认整个程序只有一个，所有请求共用。所以 Bean 的字段里<b>不能存某个用户的数据</b>，那会串到别人的请求里。</p><pre class="code"><code><span class="hl-a">@RestController</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">BadController</span> {
    <span class="hl-k">private</span> <span class="hl-t">Long</span> currentUserId;   <span class="hl-c">// ❌ 两个用户同时请求，会互相覆盖</span>
}
<span class="hl-c">// ✅ 每个请求自己的数据放在方法参数 / 局部变量里（在各自线程的栈上）</span></code></pre></article></div></section><section class="sx-sec" id="sp-class"><h2>贴在类上的注解</h2><p class="sx-desc">告诉 Spring：「这个类是什么角色」。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 210" role="img" aria-label="分层：上层只调用下层。每一层用不同的类注解标出身份"><g filter="url(#sxwob)"><rect x="20" y="12" width="600" height="40" rx="9" class="sx-s" fill="var(--blue)"/><rect x="38" y="60" width="564" height="40" rx="9" class="sx-s" fill="var(--yellow)"/><rect x="56" y="108" width="528" height="40" rx="9" class="sx-s" fill="var(--mint)"/><rect x="74" y="156" width="492" height="40" rx="9" class="sx-s" fill="var(--lilac)"/></g><text x="36" y="37" text-anchor="start" font-size="13" font-weight="700" class="">@RestController</text><text x="604" y="37" text-anchor="end" font-size="11" class="sx-sub">接请求，返回 JSON</text><text x="54" y="85" text-anchor="start" font-size="13" font-weight="700" class="">@Service</text><text x="586" y="85" text-anchor="end" font-size="11" class="sx-sub">业务规则、工具</text><text x="72" y="133" text-anchor="start" font-size="13" font-weight="700" class="">@Repository / JpaRepository</text><text x="568" y="133" text-anchor="end" font-size="11" class="sx-sub">访问数据库</text><text x="90" y="181" text-anchor="start" font-size="13" font-weight="700" class="">@Entity</text><text x="550" y="181" text-anchor="end" font-size="11" class="sx-sub">对应一张表</text></svg><figcaption>分层：上层只调用下层。每一层用不同的类注解标出身份</figcaption></figure><article class="sx-item"><h3><code>@SpringBootApplication</code></h3><p class="sx-what">放在入口类上。等于三个注解合体：开启自动配置、开启组件扫描（从这个类所在的包往下找）、这个类本身也是配置类。</p><pre class="code"><code><span class="hl-a">@SpringBootApplication</span>           <span class="hl-c">// 所有其他类都必须在 com.goenkon.ielts 或它的子包里，才扫描得到</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">IeltsBackendApplication</span> { ... }</code></pre></article><article class="sx-item"><h3><code>@Component / @Service / @Repository</code></h3><p class="sx-what">「请 Spring 帮我造这个类的对象并管理它」。三个作用基本一样，名字表达角色：@Service 业务层，@Repository 数据层，@Component 通用。</p><pre class="code"><code><span class="hl-a">@Component</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">GoogleTokenVerifier</span> { ... }   <span class="hl-c">// 通用工具</span>

<span class="hl-a">@Service</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">JwtService</span> { ... }             <span class="hl-c">// 业务工具</span></code></pre></article><article class="sx-item"><h3><code>@RestController</code></h3><p class="sx-what">这个类里的方法都是接口，返回值直接转成 JSON 写进响应。等于 @Controller + @ResponseBody。</p><pre class="code"><code><span class="hl-a">@RestController</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">HelloController</span> {
    <span class="hl-a">@GetMapping</span>(<span class="hl-s">"/hello"</span>)
    <span class="hl-k">public</span> <span class="hl-t">Greeting</span> hello() { <span class="hl-k">return</span> <span class="hl-k">new</span> <span class="hl-t">Greeting</span>(<span class="hl-s">"Hello"</span>, 1); }   <span class="hl-c">// 返回对象 → 自动变 JSON</span>
}</code></pre></article><article class="sx-item"><h3><code>@Configuration + @Bean</code></h3><p class="sx-what">配置类。里面带 @Bean 的方法，返回值会被放进容器（用来手动创建第三方库的对象）。</p><pre class="code"><code><span class="hl-a">@Configuration</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">AppConfig</span> {
    <span class="hl-a">@Bean</span>
    <span class="hl-k">public</span> <span class="hl-t">Clock</span> clock() { <span class="hl-k">return</span> <span class="hl-t">Clock</span>.systemUTC(); }   <span class="hl-c">// 别的类就能注入 Clock 了</span>
}</code></pre></article><article class="sx-item"><h3><code>@RequestMapping（类上）</code></h3><p class="sx-what">给这个类所有接口加一个路径前缀。</p><pre class="code"><code><span class="hl-a">@RestController</span>
<span class="hl-a">@RequestMapping</span>(<span class="hl-s">"/favorites"</span>)      <span class="hl-c">// 下面的 @GetMapping 都以 /favorites 开头</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">FavoriteWordController</span> {
    <span class="hl-a">@GetMapping</span>            <span class="hl-c">// GET /favorites</span>
    <span class="hl-k">public</span> <span class="hl-t">List</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; list(...) { ... }
    <span class="hl-a">@DeleteMapping</span>(<span class="hl-s">"/{id}"</span>)  <span class="hl-c">// DELETE /favorites/{id}</span>
    <span class="hl-k">public</span> <span class="hl-k">void</span> delete(...) { ... }
}</code></pre></article></div></section><section class="sx-sec" id="sp-method"><h2>贴在方法上的注解</h2><p class="sx-desc">告诉 Spring：「什么请求来了调用这个方法」。</p><div class="sx-grid"><article class="sx-item"><h3><code>@GetMapping / @PostMapping / @PutMapping / @DeleteMapping</code></h3><p class="sx-what">对应 HTTP 的四种方法，括号里写路径。启动时被登记进「网址 → 方法」表。</p><pre class="code"><code><span class="hl-a">@GetMapping</span>(<span class="hl-s">"/me"</span>)                 <span class="hl-c">// GET  /me</span>
<span class="hl-a">@PostMapping</span>(<span class="hl-s">"/auth/google"</span>)       <span class="hl-c">// POST /auth/google</span>
<span class="hl-a">@PutMapping</span>(<span class="hl-s">"/favorites/{id}"</span>)     <span class="hl-c">// PUT  /favorites/12</span>
<span class="hl-a">@DeleteMapping</span>(<span class="hl-s">"/favorites/{id}"</span>)  <span class="hl-c">// DELETE /favorites/12</span></code></pre></article><article class="sx-item"><h3><code>@Override</code></h3><p class="sx-what">Java 编译器的注解（不是 Spring 的）：声明「我在重写父类 / 接口的方法」。方法名写错，编译就报错。</p><pre class="code"><code><span class="hl-a">@Override</span>
<span class="hl-k">public</span> <span class="hl-k">void</span> addInterceptors(<span class="hl-t">InterceptorRegistry</span> registry) { ... }</code></pre></article><article class="sx-item"><h3><code>@Transactional</code></h3><p class="sx-what">方法里的所有数据库操作要么全成功、要么全回滚。一次业务要写多张表时用。</p><pre class="code"><code><span class="hl-a">@Transactional</span>
<span class="hl-k">public</span> <span class="hl-k">void</span> transfer(<span class="hl-t">Long</span> from, <span class="hl-t">Long</span> to, int amount) {
    accountRepo.decrease(from, amount);
    accountRepo.increase(to, amount);    <span class="hl-c">// 这里出错，上面那步也会被撤销</span>
}</code></pre></article><article class="sx-item"><h3><code>@ExceptionHandler + @RestControllerAdvice</code></h3><p class="sx-what">全局统一处理异常，把各种异常变成格式一致的错误响应。</p><pre class="code"><code><span class="hl-a">@RestControllerAdvice</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">GlobalErrors</span> {
    <span class="hl-a">@ExceptionHandler</span>(<span class="hl-t">IllegalArgumentException</span>.<span class="hl-k">class</span>)
    <span class="hl-k">public</span> <span class="hl-t">ResponseEntity</span>&lt;?&gt; bad(<span class="hl-t">IllegalArgumentException</span> e) {
        <span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.badRequest().body(<span class="hl-t">Map</span>.of(<span class="hl-s">"error"</span>, e.getMessage()));
    }
}</code></pre></article></div></section><section class="sx-sec" id="sp-param"><h2>贴在参数上的注解</h2><p class="sx-desc">告诉 Spring：「这个参数的值从哪里取」。看懂这一节，就不会再问「这个参数是谁传的」。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 276" role="img" aria-label="每个参数注解，对应请求里的一个位置：Spring 按注解去对应的地方取值，转成参数的类型再调用你的方法"><g filter="url(#sxwob)"><rect x="20" y="14" width="260" height="248" rx="12" class="sx-s" fill="var(--blue)" fill-opacity=".35"/><rect x="360" y="14" width="260" height="248" rx="12" class="sx-s" fill="var(--mint)" fill-opacity=".35"/><rect x="36" y="52" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="92" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="132" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="172" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="212" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="376" y="52" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="92" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="132" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="172" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="212" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><path d="M264 67 C 320 67, 320 67, 376 67" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M264 107 C 320 107, 320 107, 376 107" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M264 147 C 320 147, 320 147, 376 147" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M264 187 C 320 187, 320 187, 376 187" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M264 227 C 320 227, 320 227, 376 227" class="sx-s sx-dash" marker-end="url(#sxah)"/></g><text x="150.0" y="36" text-anchor="middle" font-size="13.5" font-weight="700" class="">一次 HTTP 请求里的东西</text><text x="490.0" y="36" text-anchor="middle" font-size="13.5" font-weight="700" class="">方法参数上的注解</text><text x="150.0" y="72" text-anchor="middle" font-size="12" class="">网址里的 {id}</text><text x="150.0" y="112" text-anchor="middle" font-size="12" class="">?site=jlpt</text><text x="150.0" y="152" text-anchor="middle" font-size="12" class="">请求体 JSON</text><text x="150.0" y="192" text-anchor="middle" font-size="12" class="">请求头 Authorization</text><text x="150.0" y="232" text-anchor="middle" font-size="12" class="">门卫放进的 userId</text><text x="490.0" y="72" text-anchor="middle" font-size="12" class="">@PathVariable</text><text x="490.0" y="112" text-anchor="middle" font-size="12" class="">@RequestParam</text><text x="490.0" y="152" text-anchor="middle" font-size="12" class="">@RequestBody</text><text x="490.0" y="192" text-anchor="middle" font-size="12" class="">@RequestHeader</text><text x="490.0" y="232" text-anchor="middle" font-size="12" class="">@RequestAttribute</text></svg><figcaption>每个参数注解，对应请求里的一个位置：Spring 按注解去对应的地方取值，转成参数的类型再调用你的方法</figcaption></figure><article class="sx-item"><h3><code>@PathVariable</code></h3><p class="sx-what">取路径里 {id} 那一段，自动转成 Long。</p><pre class="code"><code><span class="hl-a">@DeleteMapping</span>(<span class="hl-s">"/favorites/{id}"</span>)
<span class="hl-k">public</span> <span class="hl-k">void</span> delete(<span class="hl-a">@PathVariable</span> <span class="hl-t">Long</span> id, ...) { }   <span class="hl-c">// DELETE /favorites/12 → id = 12</span></code></pre></article><article class="sx-item"><h3><code>@RequestParam</code></h3><p class="sx-what">取问号后面的查询参数。可以设默认值、设为非必需。</p><pre class="code"><code><span class="hl-a">@GetMapping</span>(<span class="hl-s">"/favorites"</span>)
<span class="hl-k">public</span> <span class="hl-t">List</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; list(<span class="hl-a">@RequestParam</span>(defaultValue = <span class="hl-s">"ielts"</span>) <span class="hl-t">String</span> site) { }
<span class="hl-c">// GET /favorites?site=jlpt → site = "jlpt"；不传 → "ielts"</span></code></pre></article><article class="sx-item"><h3><code>@RequestBody</code></h3><p class="sx-what">把请求体里的 JSON 转成对象（Jackson 按字段名对应）。多出来的字段被丢掉。</p><pre class="code"><code><span class="hl-a">@PostMapping</span>(<span class="hl-s">"/favorites"</span>)
<span class="hl-k">public</span> <span class="hl-t">ResponseEntity</span>&lt;?&gt; add(<span class="hl-a">@RequestBody</span> <span class="hl-t">NewFavoriteWord</span> body, ...) {
    body.word();   <span class="hl-c">// 前端发来的 {"word":"abandon"} 里的 word</span>
}</code></pre></article><article class="sx-item"><h3><code>@RequestHeader</code></h3><p class="sx-what">取请求头的某一行。<code>required = false</code>：没有这个头时给 null，而不是自动回 400。</p><pre class="code"><code><span class="hl-a">@GetMapping</span>(<span class="hl-s">"/me"</span>)
<span class="hl-k">public</span> <span class="hl-t">ResponseEntity</span>&lt;?&gt; me(<span class="hl-a">@RequestHeader</span>(value = <span class="hl-s">"Authorization"</span>, required = <span class="hl-k">false</span>) <span class="hl-t">String</span> auth) { }</code></pre></article><article class="sx-item"><h3><code>@RequestAttribute</code></h3><p class="sx-what">取「服务器内部放进这次请求的值」，比如门卫验完 token 放进去的 userId。前端改不了它，所以可信。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-t">List</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; list(<span class="hl-a">@RequestAttribute</span>(<span class="hl-t">AuthInterceptor</span>.<span class="hl-t">USER_ID</span>) <span class="hl-t">Long</span> userId) {
    <span class="hl-k">return</span> repository.findByUserId(userId);   <span class="hl-c">// 身份只从这里来，绝不信前端传的 userId</span>
}</code></pre></article><article class="sx-item"><h3><code>@Value</code></h3><p class="sx-what">从 application.properties 或环境变量读配置，启动时填一次。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-t">JwtService</span>(<span class="hl-a">@Value</span>(<span class="hl-s">"${app.jwt-secret}"</span>) <span class="hl-t">String</span> secret) { ... }
<span class="hl-c">// application.properties:  app.jwt-secret=${APP_JWT_SECRET:本地默认值}</span></code></pre></article></div></section><section class="sx-sec" id="sp-jpa"><h2>数据库相关的注解（JPA）</h2><p class="sx-desc">贴在实体类和字段上，告诉 Hibernate「这个类怎么变成表」。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 162" role="img" aria-label="@Entity 让类对应一张表：每个字段对应一列，驼峰名自动变下划线（googleSub → google_sub）"><g filter="url(#sxwob)"><rect x="16" y="14" width="250" height="138" rx="8" class="sx-s" fill="var(--card)"/><rect x="16" y="14" width="250" height="28" rx="8" class="sx-s" fill="var(--blue)"/><rect x="374" y="14" width="250" height="138" rx="8" class="sx-s" fill="var(--card)"/><rect x="374" y="14" width="250" height="28" rx="8" class="sx-s" fill="var(--mint)"/><path d="M266 82 C 320 82, 320 82, 374 82" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M266 108 C 320 108, 320 108, 374 108" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M266 134 C 320 134, 320 134, 374 134" class="sx-s sx-dash" marker-end="url(#sxah)"/></g><text x="141.0" y="33" text-anchor="middle" font-size="13" font-weight="700" class="">Java 类 AppUser</text><text x="78.5" y="60" text-anchor="middle" font-size="11" font-weight="700" class="sx-sub">字段</text><text x="203.5" y="60" text-anchor="middle" font-size="11" font-weight="700" class="sx-sub">注解</text><text x="78.5" y="86" text-anchor="middle" font-size="11.5" class="">id</text><text x="203.5" y="86" text-anchor="middle" font-size="11.5" class="">@Id</text><text x="78.5" y="112" text-anchor="middle" font-size="11.5" class="">googleSub</text><text x="203.5" y="112" text-anchor="middle" font-size="11.5" class="">@Column(unique)</text><text x="78.5" y="138" text-anchor="middle" font-size="11.5" class="">email</text><text x="203.5" y="138" text-anchor="middle" font-size="11.5" class="">（普通列）</text><text x="499.0" y="33" text-anchor="middle" font-size="13" font-weight="700" class="">表 app_user</text><text x="436.5" y="60" text-anchor="middle" font-size="11" font-weight="700" class="sx-sub">列</text><text x="561.5" y="60" text-anchor="middle" font-size="11" font-weight="700" class="sx-sub">约束</text><text x="436.5" y="86" text-anchor="middle" font-size="11.5" class="">id</text><text x="561.5" y="86" text-anchor="middle" font-size="11.5" class="">主键 自增</text><text x="436.5" y="112" text-anchor="middle" font-size="11.5" class="">google_sub</text><text x="561.5" y="112" text-anchor="middle" font-size="11.5" class="">唯一 非空</text><text x="436.5" y="138" text-anchor="middle" font-size="11.5" class="">email</text><text x="561.5" y="138" text-anchor="middle" font-size="11.5" class=""></text></svg><figcaption>@Entity 让类对应一张表：每个字段对应一列，驼峰名自动变下划线（googleSub → google_sub）</figcaption></figure><article class="sx-item"><h3><code>@Entity / @Table</code></h3><p class="sx-what">@Entity：这个类对应一张表。@Table：指定表名、加联合唯一约束。</p><pre class="code"><code><span class="hl-a">@Entity</span>
<span class="hl-a">@Table</span>(name = <span class="hl-s">"app_user"</span>)      <span class="hl-c">// user 是数据库保留字，所以换个名字</span>
<span class="hl-k">public</span> <span class="hl-k">class</span> <span class="hl-t">AppUser</span> { ... }

<span class="hl-a">@Table</span>(name = <span class="hl-s">"favorite_word"</span>,
       uniqueConstraints = <span class="hl-a">@UniqueConstraint</span>(columnNames = {<span class="hl-s">"user_id"</span>, <span class="hl-s">"kind"</span>, <span class="hl-s">"word"</span>}))</code></pre></article><article class="sx-item"><h3><code>@Id / @GeneratedValue / @Column</code></h3><p class="sx-what">@Id 主键；@GeneratedValue 由数据库自动生成（IDENTITY = 自增）；@Column 设置列的约束。</p><pre class="code"><code><span class="hl-a">@Id</span>
<span class="hl-a">@GeneratedValue</span>(strategy = <span class="hl-t">GenerationType</span>.<span class="hl-t">IDENTITY</span>)
<span class="hl-k">private</span> <span class="hl-t">Long</span> id;                                  <span class="hl-c">// save 之前是 null，之后才有值</span>

<span class="hl-a">@Column</span>(unique = <span class="hl-k">true</span>, nullable = <span class="hl-k">false</span>)
<span class="hl-k">private</span> <span class="hl-t">String</span> googleSub;</code></pre></article><article class="sx-item"><h3><code>Repository 方法名查询</code></h3><p class="sx-what">继承 JpaRepository 后，按规则起方法名，Spring 自动生成 SQL，不用写实现。</p><pre class="code"><code><span class="hl-k">public</span> <span class="hl-k">interface</span> <span class="hl-t">FavoriteWordRepository</span> <span class="hl-k">extends</span> <span class="hl-t">JpaRepository</span>&lt;<span class="hl-t">FavoriteWord</span>, <span class="hl-t">Long</span>&gt; {
    <span class="hl-t">List</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; findByUserId(<span class="hl-t">Long</span> userId);
    <span class="hl-c">// → SELECT * FROM favorite_word WHERE user_id = ?</span>
    <span class="hl-t">Optional</span>&lt;<span class="hl-t">FavoriteWord</span>&gt; findByIdAndUserId(<span class="hl-t">Long</span> id, <span class="hl-t">Long</span> userId);
    <span class="hl-c">// → ... WHERE id = ? AND user_id = ?   （删改时防越权）</span>
}</code></pre><p class="sx-tip"><b>记住</b>字段名拼错，启动时就报错，比运行时才发现好。</p></article><article class="sx-item"><h3><code>@ManyToOne / @OneToMany</code></h3><p class="sx-what">表和表之间的关系（外键）。我们的项目用一个普通的 userId 字段代替，比较简单。</p><pre class="code"><code><span class="hl-a">@ManyToOne</span>
<span class="hl-a">@JoinColumn</span>(name = <span class="hl-s">"user_id"</span>)
<span class="hl-k">private</span> <span class="hl-t">AppUser</span> user;      <span class="hl-c">// 一条收藏属于一个用户</span></code></pre></article></div></section><section class="sx-sec" id="sp-req"><h2>一个请求在 Spring 里怎么走</h2><p class="sx-desc">把上面所有注解串起来。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 306" role="img" aria-label="从外到内一层层经过，到你的方法时，参数已经全部按注解准备好了"><g filter="url(#sxwob)"><rect x="20" y="12" width="600" height="40" rx="9" class="sx-s" fill="var(--blue)"/><rect x="38" y="60" width="564" height="40" rx="9" class="sx-s" fill="var(--yellow)"/><rect x="56" y="108" width="528" height="40" rx="9" class="sx-s" fill="var(--mint)"/><rect x="74" y="156" width="492" height="40" rx="9" class="sx-s" fill="var(--pink)"/><rect x="92" y="204" width="456" height="40" rx="9" class="sx-s" fill="var(--lilac)"/><rect x="110" y="252" width="420" height="40" rx="9" class="sx-s" fill="var(--card)"/></g><text x="36" y="37" text-anchor="start" font-size="13" font-weight="700" class="">Tomcat（端口 8080）</text><text x="604" y="37" text-anchor="end" font-size="11" class="sx-sub">收到字节，解析成 HTTP 请求，分一个线程</text><text x="54" y="85" text-anchor="start" font-size="13" font-weight="700" class="">CorsConfig</text><text x="586" y="85" text-anchor="end" font-size="11" class="sx-sub">跨域放行条</text><text x="72" y="133" text-anchor="start" font-size="13" font-weight="700" class="">DispatcherServlet</text><text x="568" y="133" text-anchor="end" font-size="11" class="sx-sub">查「网址 → 方法」表</text><text x="90" y="181" text-anchor="start" font-size="13" font-weight="700" class="">AuthInterceptor</text><text x="550" y="181" text-anchor="end" font-size="11" class="sx-sub">验 token，放进 userId</text><text x="108" y="229" text-anchor="start" font-size="13" font-weight="700" class="">你的 @GetMapping 方法</text><text x="532" y="229" text-anchor="end" font-size="11" class="sx-sub">参数按注解填好</text><text x="126" y="277" text-anchor="start" font-size="13" font-weight="700" class="">Jackson</text><text x="514" y="277" text-anchor="end" font-size="11" class="sx-sub">返回值转 JSON 发回去</text></svg><figcaption>从外到内一层层经过，到你的方法时，参数已经全部按注解准备好了</figcaption></figure><article class="sx-item"><h3><code>ResponseEntity</code></h3><p class="sx-what">需要自己控制状态码时用它把「状态码 + 头 + 内容」打包返回。</p><pre class="code"><code><span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.ok(user);                                  <span class="hl-c">// 200</span>
<span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.status(401).body(<span class="hl-t">Map</span>.of(<span class="hl-s">"error"</span>, <span class="hl-s">"unauthorized"</span>));
<span class="hl-k">return</span> <span class="hl-t">ResponseEntity</span>.badRequest().build();                      <span class="hl-c">// 400，没有内容</span></code></pre></article></div></section></div>
</div>
