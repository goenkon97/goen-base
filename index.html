<style>
/* 布局概念：今日画面铺满整页（直接画在点点纸上）；入口收进右侧抽屉，手机从右边缘往左滑拉出 */
:root{
  --paper:#F3F5F8;   /* 纸张底色（冷灰）*/
  --dot:#C7CFD9;     /* 纸上的小点点 */
  --card:#FFFFFF;    /* 卡片白 */
  --ink:#23262D;     /* 墨线 / 正文 */
  --ink-soft:#5E6573;/* 次要文字 */
  --yellow:#FFE69A; --blue:#CBE0FF; --pink:#FFD3DC; --mint:#C9EED6; --lilac:#E3DAFF;
  --red:#E5484D;     /* 日历页顶上的红条 */
  --scrim:rgba(35,38,45,.28); /* 抽屉打开时盖住页面的半透明层 */
  --gk:#1F4FD6;
  --hand:"Patrick Hand","Noto Sans SC",system-ui,sans-serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181D;--dot:#2C323B;--card:#1F232A;--ink:#E7E9EE;--ink-soft:#9AA1AE;
  --yellow:#6B5A22;--blue:#28406A;--pink:#6A2E3B;--mint:#245540;--lilac:#433A6E;--red:#F2555A;
  --scrim:rgba(0,0,0,.5);--gk:#6F93FF;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181D;--dot:#2C323B;--card:#1F232A;--ink:#E7E9EE;--ink-soft:#9AA1AE;
  --yellow:#6B5A22;--blue:#28406A;--pink:#6A2E3B;--mint:#245540;--lilac:#433A6E;--red:#F2555A;
  --scrim:rgba(0,0,0,.5);--gk:#6F93FF;color-scheme:dark}

/* 用 height:100% 而不是 100vh，让整页刚好填满一屏 */
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);
  background-size:18px 18px;
  color:var(--ink);font-family:var(--sans);line-height:1.6;
  overflow-x:hidden;
}
/* #app 撑满整屏，里面当前显示的页面（首页或后端图解）再撑满 #app */
#app{min-height:100%;display:flex;flex-direction:column}
#app>*{flex:1 0 auto}
.wrap{width:100%;max-width:1180px;margin:0 auto;box-sizing:border-box;padding-block:14px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}

/* 顶栏：GK 标 + 问候（右边留出空位给抽屉把手） */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-right:44px}
.gk{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:800;font-size:22px;letter-spacing:-1px;color:var(--gk)}
.greet{font-family:var(--hand);font-size:22px}
.greet small{font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-left:6px}

/* ====== 今日画面：占满整页 ======
   电脑：日历在左、插画在右，语录和进度在下面
   手机：日历 → 插画 → 语录 竖着排 */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;min-width:0}

/* 插画区 art：日历 + 插画 + 四张小贴纸拼贴在一起
   电脑：贴纸 两张在日历左边，两张在插画右边
   手机：四张贴纸围在日历左右两边，插画在下面整行 */
.art{display:grid;grid-template-columns:auto 200px minmax(0,1fr) auto;
  grid-template-areas:"s0 cal scene s2" "s1 cal scene s3";gap:14px 22px;align-items:center;justify-items:center}
@media (max-width:620px){.art{grid-template-columns:minmax(0,1fr) 136px minmax(0,1fr);
  grid-template-areas:"s0 cal s2" "s1 cal s3" "scene scene scene";gap:10px 12px}}

/* 小贴纸：小小一张，像随手贴在日历旁边的标签 */
.sticker{display:flex;flex-direction:column;align-items:center;gap:1px;width:86px;max-width:100%;box-sizing:border-box;
  padding:9px 4px 6px;text-align:center;text-decoration:none;color:inherit;position:relative;
  transition:transform .15s,box-shadow .15s;box-shadow:3px 3px 0 var(--shadow) !important}
.s0{grid-area:s0;transform:rotate(-6deg) translateX(6px)}
.s1{grid-area:s1;transform:rotate(4deg)}
.s2{grid-area:s2;transform:rotate(5deg)}
.s3{grid-area:s3;transform:rotate(-4deg) translateX(-6px)}
a.sticker:hover,a.sticker:focus-visible{transform:translateY(-3px) rotate(0)}
a.sticker:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.sticker svg{width:28px;height:28px}
.sticker b{font-family:var(--hand);font-weight:400;font-size:15px;line-height:1.1}
.sticker small{font-size:10px;color:var(--ink-soft);line-height:1.3}
.sticker.soon{opacity:.6;border-style:dashed;cursor:default}
/* 胶带：贴纸顶上一小条半透明胶带 */
.sticker::before{content:"";position:absolute;top:-7px;left:50%;width:30px;height:10px;transform:translateX(-50%) rotate(-4deg);
  background:var(--shadow);opacity:.85;border:1.5px solid var(--ink);border-radius:2px}

/* 撕页日历 */
.cal{grid-area:cal;width:100%;position:relative;background:var(--card);border:2px solid var(--ink);border-radius:12px;
  box-shadow:5px 5px 0 var(--pink);text-align:center;overflow:hidden;transform:rotate(-2.5deg)}
.cal-head{background:var(--red);color:#fff;font-family:var(--hand);font-size:22px;padding:6px 0 3px;border-bottom:2px solid var(--ink)}
.cal-day{font-family:var(--hand);font-size:96px;line-height:1;padding:12px 0 0}
.cal-week{font-weight:700;font-size:16px}
.cal-jp{font-size:12px;color:var(--ink-soft);padding-bottom:12px}
.cal-rings{position:absolute;top:-6px;left:0;right:0;display:flex;justify-content:space-around;padding:0 38px}
.cal-rings i{width:8px;height:16px;border:2px solid var(--ink);border-radius:6px;background:var(--card)}
@media (max-width:620px){.cal-day{font-size:62px}.cal-head{font-size:16px}.cal-week{font-size:14px}.cal-jp{font-size:10.5px}}
/* 进场小仪式：日历页"啪"地翻下来 */
.flip-enter{animation:flip .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes flip{from{transform:perspective(600px) rotateX(-95deg) rotate(-2.5deg);transform-origin:top}
  to{transform:perspective(600px) rotateX(0) rotate(-2.5deg);transform-origin:top}}

.scene{grid-area:scene;width:100%;max-width:560px;height:auto;display:block}
.txt{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:640px;width:100%;margin-inline:auto;text-align:center}
/* 外层 .stage 是 flex 竖排，justify-self 在 flex 里不生效；设了 max-width 的块要靠左右 margin:auto 才能居中 */
.quote{font-family:var(--hand);font-size:30px;line-height:1.2;text-wrap:balance}
.quote-sub{font-size:14px;color:var(--ink-soft)}
@media (max-width:620px){.quote{font-size:24px}}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bar{flex:1;height:9px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}
.bar span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 6px);opacity:.75}

/* ====== 右侧抽屉 ====== */
/* 把手：贴在屏幕右边缘中间的小纸条，点一下也能打开 */
.handle{position:fixed;top:50%;right:0;transform:translateY(-50%);z-index:20;
  margin-right:env(safe-area-inset-right,0px);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 12px 8px;
  background:var(--card);border:2px solid var(--ink);border-right:none;border-radius:12px 0 0 12px;
  box-shadow:-3px 3px 0 var(--yellow);cursor:pointer;color:var(--ink);font:inherit}
.handle span{font-family:var(--hand);font-size:15px;writing-mode:vertical-rl;letter-spacing:2px}
.handle svg{width:16px;height:16px;animation:nudge 2.4s ease-in-out infinite}
.handle:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
@keyframes nudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(-4px)}}

.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(300px,80vw);box-sizing:border-box;
  background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px;
  border-left:2px solid var(--ink);box-shadow:-6px 0 0 var(--blue);
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 18px;
  display:flex;flex-direction:column;gap:16px;overflow-y:auto;
  transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.drawer.dragging{transition:none}  /* 手指拖动时不要过渡动画，要跟手 */
.close{align-self:flex-end;width:36px;height:36px;display:grid;place-items:center;background:var(--card);
  border:2px solid var(--ink);border-radius:50%;cursor:pointer;color:var(--ink)}
.close svg{width:16px;height:16px}
.close:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}

/* 抽屉里的入口贴纸 */
.doodle{background:var(--card);border:2px solid var(--ink);border-radius:14px 18px 12px 16px/16px 12px 18px 14px;
  box-shadow:4px 4px 0 var(--shadow,var(--yellow))}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;padding:10px 6px;text-decoration:none;color:inherit;
  transition:transform .15s,box-shadow .15s}
a.tile:hover,a.tile:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
a.tile:focus-visible{outline:2px dashed var(--ink);outline-offset:4px}
.tile svg{flex:none;width:32px;height:32px}
.tile-body{min-width:0;flex:1}
.tile h3{margin:0;font-family:var(--hand);font-size:16px;font-weight:400;line-height:1.2}
.tile p{margin:2px 0 0;font-size:10.5px;line-height:1.35;color:var(--ink-soft)}
.tile.soon{opacity:.65;border-style:dashed;cursor:default}
.tile{position:relative}
.tag{position:absolute;top:5px;right:8px;font-family:var(--hand);font-size:12px;color:var(--ink-soft)}
.fade-enter-active,.fade-leave-active{transition:opacity .3s}
.fade-enter-from,.fade-leave-to{opacity:0}

/* 小插画里的动画 */
.rays{transform-origin:330px 62px;animation:spin 18s linear infinite}
.flag{transform-origin:224px 46px;animation:wave 1.6s ease-in-out infinite}
.twinkle{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.d2{animation-delay:.8s}.twinkle.d3{animation-delay:1.6s}
.hop{animation:hop 2.8s ease-in-out infinite;transform-origin:center bottom}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg) scaleX(.94)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== 大屏适配（首页）=====================
   思路：手机上的尺寸是固定 px；屏幕变大时，用 clamp(最小值, 随屏幕变化的值, 最大值) 让东西跟着放大，
   vw = 视口宽度的 1%，vh = 视口高度的 1%。同时按"横屏 / 竖屏"分两种排法。 */

/* ① 横屏：电脑、iPad 横着拿 —— 日历 | 插画 一行，贴纸在两边，整体按屏幕放大 */
@media (min-width:621px) and (min-aspect-ratio:1/1){
  .wrap{max-width:1440px}
  .stage{gap:clamp(24px,5vh,64px)}
  .art{grid-template-columns:auto clamp(200px,19vw,300px) minmax(0,1fr) auto;
    gap:clamp(14px,3vh,36px) clamp(22px,3vw,52px)}
  /* 插画最高占屏幕一半，避免矮屏幕（笔记本）上把语录挤出去 */
  .scene{max-width:none;max-height:50vh}
  .cal-head{font-size:clamp(22px,2vw,32px)}
  .cal-day{font-size:clamp(96px,9.5vw,150px)}
  .cal-week{font-size:clamp(16px,1.4vw,21px)}
  .cal-jp{font-size:clamp(12px,1vw,15px);padding-bottom:clamp(12px,1.2vw,18px)}
  .cal-rings i{width:clamp(8px,.7vw,11px);height:clamp(16px,1.4vw,22px)}
  .sticker{width:clamp(86px,8.5vw,132px);padding:clamp(9px,1vw,15px) 6px clamp(6px,.7vw,11px);gap:2px}
  .sticker svg{width:clamp(28px,2.8vw,44px);height:clamp(28px,2.8vw,44px)}
  .sticker b{font-size:clamp(15px,1.5vw,22px)}
  .sticker small{font-size:clamp(10px,.95vw,13px)}
  .sticker::before{width:clamp(30px,3vw,46px);height:clamp(10px,1vw,14px)}
  .txt{max-width:820px;gap:clamp(8px,1.2vh,14px)}
  .quote{font-size:clamp(30px,2.8vw,44px)}
  .quote-sub{font-size:clamp(14px,1.15vw,18px)}
  .meta{font-size:clamp(12px,.95vw,14px)}
  .greet{font-size:clamp(22px,1.8vw,28px)}
  .gk{font-size:clamp(22px,1.8vw,28px)}
}

/* ② 竖屏平板：iPad 竖着拿 —— 和手机一样"贴纸围着日历、插画在下面"，但整体放大 */
@media (min-width:621px) and (max-aspect-ratio:1/1){
  .stage{gap:clamp(24px,4vh,56px)}
  .art{grid-template-columns:minmax(0,1fr) clamp(180px,27vw,270px) minmax(0,1fr);
    grid-template-areas:"s0 cal s2" "s1 cal s3" "scene scene scene";gap:clamp(18px,3vh,32px) clamp(20px,4vw,44px)}
  .scene{max-width:760px;max-height:38vh}
  .cal-head{font-size:clamp(20px,3vw,30px)}
  .cal-day{font-size:clamp(84px,13vw,140px)}
  .cal-week{font-size:clamp(16px,2.2vw,22px)}
  .cal-jp{font-size:clamp(12px,1.6vw,15px);padding-bottom:16px}
  .sticker{width:clamp(110px,16vw,160px);padding:14px 6px 10px;gap:3px}
  .sticker svg{width:clamp(36px,5vw,50px);height:clamp(36px,5vw,50px)}
  .sticker b{font-size:clamp(19px,2.6vw,24px)}
  .sticker small{font-size:clamp(12px,1.6vw,14px)}
  .sticker::before{width:44px;height:13px}
  .txt{max-width:700px}
  .quote{font-size:clamp(28px,4.2vw,40px)}
  .quote-sub{font-size:clamp(14px,1.9vw,17px)}
  .meta{font-size:13px}
  .greet,.gk{font-size:clamp(22px,3vw,28px)}
}

/* ===================== 后端图解页（.bk 里的样式只作用于这个页面）===================== */

/* 布局概念：像笔记本上的手绘小图，每张卡一幅会动的插画 + 两三句话 + 一句结论。冷白纸底，墨蓝线条，彩色填充故意错位。 */
.bk{
  --bg:#f2f5fa; --card:#ffffff; --ink:#1d2433; --sub:#566074; --line:#d8dfeb; --accent:#2a63c9; --chipbg:#e8eefb;
  --f-blue:#bfe0ff; --f-yel:#ffe9a0; --f-grn:#bdeec7; --f-red:#ffc4bf; --f-pur:#dccfff; --f-gry:#e3e7ee;
  --hand:"Patrick Hand","Noto Sans SC",system-ui,sans-serif; --body:"Noto Sans SC",-apple-system,"PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]) .bk{
  --bg:#12151d; --card:#1a1f2d; --ink:#e8ecf5; --sub:#a0aabd; --line:#2b3248; --accent:#8db6ff; --chipbg:#242c42;
  --f-blue:#2d5b8d; --f-yel:#86702a; --f-grn:#2f6a46; --f-red:#8a3b39; --f-pur:#4e4188; --f-gry:#2d3447; color-scheme:dark}}
:root[data-theme="dark"] .bk{
  --bg:#12151d; --card:#1a1f2d; --ink:#e8ecf5; --sub:#a0aabd; --line:#2b3248; --accent:#8db6ff; --chipbg:#242c42;
  --f-blue:#2d5b8d; --f-yel:#86702a; --f-grn:#2f6a46; --f-red:#8a3b39; --f-pur:#4e4188; --f-gry:#2d3447; color-scheme:dark}
.bk *{box-sizing:border-box}
.bk{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--body);padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.bk .bk-wrap{max-width:1020px;margin:0 auto}
.bk h1{font:700 30px/1.2 var(--body);margin:0 0 6px;letter-spacing:.02em;text-wrap:balance}
.bk .lead{color:var(--sub);margin:0 0 26px;max-width:46em}
.bk h2{font:700 13px/1 var(--body);letter-spacing:.14em;color:var(--accent);margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.bk h2::after{content:"";flex:1;height:1px;background:var(--line)}
.bk .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){
.bk .grid{grid-template-columns:minmax(0,1fr)}

/* ===== 插画 ===== */
.bk .wob{filter:url(#bwob)}
.bk .s{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bk .fb{fill:var(--f-blue)}
.bk .fy{fill:var(--f-yel)}
.bk .fg{fill:var(--f-grn)}
.bk .fr{fill:var(--f-red)}
.bk .fp{fill:var(--f-pur)}
.bk .fw{fill:var(--card)}
.bk .fk{fill:var(--f-gry)}
.bk svg text{fill:var(--ink);font-family:var(--hand);font-size:12px}
.bk svg .zh{font-family:var(--body);font-size:11px;font-weight:500}
.bk svg .sm{font-size:10px}
.bk svg .cap{fill:var(--sub);font-family:var(--body);font-size:10px}

.bk .tc{transform-box:fill-box;transform-origin:center}
/* 动画：每个都有"静止时也完整"的初始状态，减少动效时直接停住 */
@keyframes pop{0%,12%{transform:scale(0)}28%,100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounceX{0%,100%{transform:translateX(0)}35%{transform:translateX(34px)}50%{transform:translateX(22px)}62%{transform:translateX(-8px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes ramA{0%,40%{opacity:1}46%,70%{opacity:0}80%,100%{opacity:1}}
@keyframes fromFile{0%,70%{opacity:0}74%,80%{opacity:1}86%,100%{opacity:0}}
@keyframes flashT{0%,38%{opacity:0}44%,54%{opacity:1}60%,100%{opacity:0}}
@keyframes idJ{0%,15%{transform:translate(0,0);opacity:1}45%{transform:translate(62px,0);opacity:1}60%{transform:translate(48px,-14px) rotate(14deg);opacity:1}85%{transform:translate(0,-34px) rotate(40deg);opacity:0}100%{transform:translate(0,0);opacity:0}}
@keyframes wordJ{0%,15%{transform:translate(0,0)}55%,92%{transform:translate(104px,0)}100%{transform:translate(0,0)}}
@keyframes noTk{0%,46%{opacity:1}50%,100%{opacity:0}}
@keyframes yesTk{0%,50%{opacity:0}54%,96%{opacity:1}100%{opacity:0}}
@keyframes step1{0%,18%{opacity:1}22%,100%{opacity:.28}}
@keyframes dashMove{to{stroke-dashoffset:-24}}
@keyframes keyGo{0%,10%{transform:translate(0,0)}50%,90%{transform:translate(104px,0)}100%{transform:translate(0,0)}}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.bk .a-pop{animation:pop 4.2s ease-out infinite}
.bk .a-spin{animation:spin 6s linear infinite}
.bk .a-bounce{animation:bounceX 3.6s ease-in-out infinite}
.bk .a-blink{animation:blink 1.6s ease-in-out infinite}
.bk .a-ram{animation:ramA 7s infinite}
.bk .a-file{animation:fromFile 7s infinite}
.bk .a-flash{animation:flashT 7s infinite}
.bk .a-idj{animation:idJ 5s ease-in-out infinite}
.bk .a-wordj{animation:wordJ 5s ease-in-out infinite}
.bk .a-no{animation:noTk 8s infinite}
.bk .a-yes{animation:yesTk 8s infinite}
.bk .a-st{opacity:.28;animation:step1 7.5s infinite}
.bk .a-dash{stroke-dasharray:8 6;animation:dashMove 1.2s linear infinite}
.bk .a-key{animation:keyGo 5s ease-in-out infinite}
.bk .a-bump{animation:bump 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
.bk *{animation:none!important}
.bk .a-st{opacity:1}
.bk .a-pop{transform:scale(1)}
.bk .a-no,.bk .a-idj{opacity:0}
.bk .a-yes{opacity:1}}
.bk .full{grid-column:1/-1}
.bk .tb{width:100%;border-collapse:collapse;font-size:13px}
.bk .tb td{padding:6px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.bk .tb td:first-child{white-space:nowrap;color:var(--sub)}

.bk{min-height:100%;box-sizing:border-box}
/* 返回按钮：涂鸦风小纸条，固定在左上 */
.bk-back{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:inline-flex;align-items:center;gap:6px;margin:0 0 18px;
  padding:4px 12px 4px 8px;background:var(--card);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--f-pur);
  font-family:var(--hand);font-size:17px;color:var(--ink);text-decoration:none}

</style>

<!-- ===== 首页的模板（路由 / 显示它）===== -->
<template id="tpl-home">
<div class="wrap"
  @touchstart.passive="onTouchStart" @touchmove="onTouchMove" @touchend="onTouchEnd" @touchcancel="onTouchEnd">
  <!-- 顶栏 -->
  <header class="top">
    <span class="gk" aria-label="GK">GK</span>
    <div class="greet">{{ greeting }}, Goen<small>{{ timeText }}</small></div>
  </header>

  <!-- 今日画面：铺满整页 -->
  <main class="stage" aria-label="今天">
    <!-- 插画区：日历 + 插画 + 小贴纸，用 grid-template-areas 拼在一起 -->
    <div class="art">
      <!-- 小贴纸：用下标 i 给每张一个 s0~s3 的位置 class -->
      <component v-for="(m, i) in modules" :key="m.id"
        :is="m.to ? 'router-link' : (m.url ? 'a' : 'div')" :to="m.to"
        :href="m.url || undefined" :target="m.url ? '_blank' : undefined" :rel="m.url ? 'noopener' : undefined"
        class="sticker doodle" :class="['s' + i, { soon: !m.url && !m.to }]" :style="{ '--shadow': `var(--${m.color})` }">
        <svg viewBox="0 0 58 58" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" v-html="m.icon"></svg>
        <b>{{ m.short }}</b>
        <small>{{ (m.url || m.to) ? m.tagline : 'soon' }}</small>
      </component>

    <!-- key 绑定日期：日期变了，Vue 会销毁旧节点再建新节点，翻页动画就会重播 -->
    <div class="cal flip-enter" :key="today.dateKey">
      <div class="cal-rings"><i></i><i></i></div>
      <div class="cal-head">{{ today.year }} · {{ today.month }}月</div>
      <div class="cal-day">{{ today.day }}</div>
      <div class="cal-week">{{ today.weekZh }}</div>
      <div class="cal-jp">{{ today.weekJp }} · {{ today.monthEn }}</div>
    </div>

    <!-- 小插画：小人站在两摞书（英语 / 日语）上举旗，后面太阳升起 -->
    <svg class="scene" viewBox="40 10 390 170" role="img" aria-label="小人站在英语书和日语书上举旗，太阳升起">
      <defs>
        <!-- 手绘抖动滤镜：用噪声把直线轻微扭一扭 -->
        <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
          <feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
      </defs>
      <g filter="url(#wob)" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- 太阳 + 光芒 -->
        <g class="rays">
          <path v-for="a in 12" :key="a" fill="none"
            :d="`M${330+Math.cos(a*Math.PI/6)*38} ${62+Math.sin(a*Math.PI/6)*38} L${330+Math.cos(a*Math.PI/6)*50} ${62+Math.sin(a*Math.PI/6)*50}`"/>
        </g>
        <circle cx="330" cy="62" r="28" fill="var(--yellow)"/>
        <!-- 地平线小山 -->
        <path d="M8 160 Q90 128 170 150 T300 146 T432 156" fill="none"/>
        <path d="M8 168 H432" fill="none" stroke-dasharray="2 9"/>
        <!-- 书堆：EN（蓝）+ 日本語（粉）-->
        <rect x="150" y="128" width="120" height="26" rx="4" fill="var(--blue)"/>
        <rect x="164" y="102" width="98" height="26" rx="4" fill="var(--pink)"/>
        <path d="M160 135 H260 M174 109 H252" fill="none" stroke-width="1.4"/>
        <!-- 小人 -->
        <g class="hop">
          <circle cx="210" cy="62" r="11" fill="var(--card)"/>
          <path d="M206 61 h.1 M214 61 h.1" fill="none" stroke-width="3"/>
          <path d="M206 66 q4 3 8 0" fill="none" stroke-width="1.8"/>
          <path d="M210 73 V90 M210 90 L202 102 M210 90 L218 102 M210 78 L200 86 M210 78 L222 66" fill="none"/>
          <!-- 旗杆 + 旗 -->
          <path d="M222 66 V30" fill="none"/>
          <path class="flag" d="M222 31 L250 37 L222 45 Z" fill="var(--mint)"/>
        </g>
        <!-- 小星星 -->
        <path class="twinkle" d="M70 50 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3z" fill="var(--yellow)" stroke-width="1.6"/>
        <path class="twinkle d2" d="M120 26 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2z" fill="var(--lilac)" stroke-width="1.4"/>
        <path class="twinkle d3" d="M392 120 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2z" fill="var(--pink)" stroke-width="1.4"/>
      </g>
      <!-- 书脊上的字不加抖动，保证清楚 -->
      <text x="210" y="146" text-anchor="middle" font-family="Patrick Hand" font-size="15" fill="var(--ink)">ENGLISH</text>
      <text x="213" y="120" text-anchor="middle" font-family="Noto Sans SC" font-size="13" font-weight="700" fill="var(--ink)">日本語</text>
    </svg>
    </div>

    <!-- 文字区：语录 + 今年进度 -->
    <div class="txt">
      <div class="quote">{{ quote.en }}</div>
      <div class="quote-sub">{{ quote.zh }}　/　{{ quote.jp }}</div>
      <div class="meta">
        <span>第 {{ today.dayOfYear }} 天</span>
        <div class="bar" :title="`今年已过 ${today.yearPct}%`"><span :style="{ width: today.yearPct + '%' }"></span></div>
        <span>还剩 {{ today.daysLeft }} 天</span>
      </div>
    </div>
  </main>

  <!-- 抽屉把手：只在抽屉关着时显示 -->
  <button v-show="!open" class="handle" type="button" aria-label="打开入口" :aria-expanded="open" @click="open = true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 L5 8 L10 13"/></svg>
    <span>入口</span>
  </button>

  <!-- 半透明遮罩：点一下关闭抽屉 -->
  <transition name="fade">
    <div v-if="open || dragX !== null" class="scrim" @click="open = false"></div>
  </transition>

  <!-- 抽屉本体：位置由 drawerStyle 算出来（关着 = 推到屏幕外；拖动中 = 跟着手指） -->
  <aside class="drawer" :class="{ dragging: dragX !== null }" :style="drawerStyle" ref="drawerEl"
    :aria-hidden="!open" :inert="!open || undefined">
    <button class="close" type="button" aria-label="关闭" @click="open = false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3 L13 13 M13 3 L3 13"/></svg>
    </button>
    <div class="tiles">
    <component v-for="m in modules" :key="m.id"
      :is="m.to ? 'router-link' : (m.url ? 'a' : 'div')" :to="m.to"
      :href="m.url || undefined" :target="m.url ? '_blank' : undefined" :rel="m.url ? 'noopener' : undefined"
      class="tile doodle" :class="{ soon: !m.url && !m.to }" :style="{ '--shadow': `var(--${m.color})` }">
      <svg viewBox="0 0 58 58" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" v-html="m.icon"></svg>
      <div class="tile-body">
        <h3>{{ m.title }}</h3>
        <p>{{ m.desc }}</p>
      </div>
      <span v-if="!m.url && !m.to" class="tag">soon</span>
    </component>
    </div>
  </aside>
</div>
</template>

<h2>一 · JAVA：只要看懂这几样</h2>

        <text x="205" y="60" text-anchor="middle" class="sm">Hello</text><text x="205" y="76" text-anchor="middle" class="sm">.class</text>
        <text x="286" y="58" text-anchor="middle" class="zh">JVM</text><text x="286" y="74" text-anchor="middle" class="sm">进程</text>
        <circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4s" repeatCount="indefinite" path="M20,112 L300,112"/></circle>
        <text x="121" y="108" text-anchor="middle" class="zh red" style="font-size:10.5px">类型写错，在这一步就报错</text>
        <text x="8" y="138" class="cap">.class 是字节码，不是机器码；JVM 这个程序把它逐步翻成 CPU 指令</text>
        <text x="8" y="154" class="cap">打包后得到一个 .jar，里面就是一堆 .class</text>
      </svg>
      <ul><li>Java 是强类型：每个变量必须写明类型，写错在运行前就被拦住。</li><li><code>java -jar xxx.jar</code> = 启动一个 JVM 进程去跑它。</li></ul>
      <p class="one">JDK 21 指的就是用哪个版本的 JVM 和编译器。</p>
    </section>
<section class="card">
      <h3>接口、record、注解</h3>
      <svg viewBox="0 0 320 170" role="img" aria-label="接口是合同，record 是只装数据的类，注解是标签">

          <rect class="s fg" x="114" y="26" width="98" height="92" rx="7"/>

        <text x="55" y="64" text-anchor="middle" class="sm">只写“要会做什么”</text><text x="55" y="82" text-anchor="middle" class="sm">save(x)</text><text x="55" y="98" text-anchor="middle" class="sm">find(id)</text>
        <text x="163" y="44" text-anchor="middle" class="zh">record</text>
        <text x="163" y="64" text-anchor="middle" class="sm">一行写完的数据盒</text><text x="163" y="84" text-anchor="middle" class="sm">record Req(</text><text x="163" y="98" text-anchor="middle" class="sm">  String word)</text>
        <text x="268" y="56" text-anchor="middle" class="sm">@Entity</text>
        <text x="268" y="82" text-anchor="middle" class="zh">注解</text><text x="268" y="98" text-anchor="middle" class="sm">贴给 Spring 看的标签</text>

      <ul><li>接口 = 合同，实现类（或 Spring 生成的代理）负责履行。</li><li>record 不可改，自带构造器和取值方法，适合接前端传来的数据。</li></ul>
      <p class="one">看到 @ 开头的，就想：这是在告诉 Spring 做什么。</p>

<section class="card">

        <path class="s a-dash" d="M132 80h56" marker-end="url(#ah)"/><text x="160" y="70" text-anchor="middle" class="zh" style="font-size:10px">启动时</text>

        <text x="163" y="22" text-anchor="middle" class="zh">Map&lt;K,V&gt;</text>

        <text x="8" y="152" class="cap">尖括号里的是元素类型；Optional 逼你先检查“有没有找到”，再取值</text>

        <text x="128" y="54" text-anchor="middle" class="zh">Service</text><text x="128" y="72" text-anchor="middle" class="sm">业务规则</text><text x="128" y="86" text-anchor="middle" class="sm">谁能收藏</text>
        <text x="214" y="54" text-anchor="middle" class="zh">Repository</text><text x="214" y="72" text-anchor="middle" class="sm">查/存</text><text x="214" y="86" text-anchor="middle" class="sm">一张表</text>
        <text x="288" y="76" text-anchor="middle" class="sm">数据库</text>

        <text x="42" y="132" text-anchor="middle" class="sm">@RestController</text><text x="128" y="132" text-anchor="middle" class="sm">@Service</text><text x="214" y="132" text-anchor="middle" class="sm">JpaRepository</text>
        <text x="8" y="158" class="cap">每层只管自己的事，上层调用下层；这样改一处不会牵连全部</text>

      <p class="one">做新功能时先问：它属于哪一层？</p>

<section class="card">
      <h3>启动那几秒发生了什么</h3>
      <svg viewBox="0 0 320 170" role="img" aria-label="Spring 启动：扫描、造对象、注入、登记网址">

        <g class="a-st" style="animation-delay:1.7s"><text x="121" y="58" text-anchor="middle" class="zh">② 造对象</text><text x="121" y="76" text-anchor="middle" class="sm">new 并存起来</text></g>
        <g class="a-st" style="animation-delay:3.4s"><text x="201" y="58" text-anchor="middle" class="zh">③ 注入</text><text x="201" y="76" text-anchor="middle" class="sm">按构造器递过去</text></g>

<section class="card">
      <h3>注解速查</h3>
      <table class="tb">
        <tr><td><code>@SpringBootApplication</code></td><td>入口类，从这里开始扫描</td></tr>
        <tr><td><code>@RestController</code></td><td>这个类接请求，返回 JSON</td></tr>
        <tr><td><code>@GetMapping("/me")</code></td><td>GET 这个网址时调用该方法</td></tr>
        <tr><td><code>@RequestBody</code></td><td>把请求里的 JSON 填进参数对象</td></tr>
        <tr><td><code>@PathVariable</code></td><td>取网址里的 <code>/favorites/12</code> 的 12</td></tr>
        <tr><td><code>@Service</code> / <code>@Component</code></td><td>让 Spring 造并管理这个类</td></tr>
        <tr><td><code>@Configuration</code> + <code>@Bean</code></td><td>手动告诉 Spring 怎么造某个对象</td></tr>
        <tr><td><code>@Entity</code> / <code>@Id</code></td><td>这个类对应一张表 / 主键字段</td></tr>
        <tr><td><code>@Value("${…}")</code></td><td>读配置文件或环境变量</td></tr>
      </table>
      <p class="one">不用背，见到就回这张表查。</p>

<section class="card">
      <h3>SQL 就四句话</h3>
      <table class="tb">
        <tr><td><b>查</b> SELECT</td><td><code>SELECT * FROM favorites WHERE user_id = 1</code></td></tr>
        <tr><td><b>增</b> INSERT</td><td><code>INSERT INTO favorites(word,user_id) VALUES('hence',2)</code></td></tr>
        <tr><td><b>改</b> UPDATE</td><td><code>UPDATE favorites SET word='x' WHERE id = 5</code></td></tr>

      </table>

<section class="card">
      <h3>Entity：类 ↔ 表</h3>
      <svg viewBox="0 0 320 170" role="img" aria-label="Entity 类的字段对应表的列，save 对应 INSERT">

    const now = ref(new Date());

    const today = computed(() => {

      if (h < 5) return "Still up";
      if (h < 11) return "Good morning";
      if (h < 17) return "Good afternoon";
      return "Good evening";
    });
    const timeText = computed(() =>
      now.value.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }));
    const quote = computed(() => QUOTES[today.value.dayOfYear % QUOTES.length]);

    // ---------- 右侧抽屉 ----------
    const open = ref(false);     // 抽屉开没开
    const dragX = ref(null);     // 手指拖动时，抽屉向右偏移了多少 px；null 表示没在拖
    const drawerEl = ref(null);  // 拿到抽屉的真实 DOM，用来读它的宽度

    // 抽屉的位置：没拖动时只有两种状态（0 = 完全打开，100% = 藏在屏幕右边外面）
    const drawerStyle = computed(() => {
      if (dragX.value !== null) return { transform: `translateX(${dragX.value}px)` };
      return { transform: open.value ? "translateX(0)" : "translateX(calc(100% + 12px))" };
    });

    // 手势思路：
    // 1. 手指按下时记住起点；抽屉关着的话，只有从屏幕右边 32px 内开始才算"拉抽屉"
    // 2. 手指移动时，根据横向位移算出抽屉偏移 dragX，抽屉就跟着手指走
    // 3. 手指松开时，看拉过没过一半宽度，决定是"弹开"还是"缩回去"
    let startX = 0, startY = 0, tracking = false, decided = false, width = 320;

    function onTouchStart(e) {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; decided = false;
      width = drawerEl.value ? drawerEl.value.offsetWidth : 320;
      tracking = open.value || startX > window.innerWidth - 32;
    }
    function onTouchMove(e) {
      if (!tracking) return;
      const t = e.touches[0];
      const dx = t.clientX - startX, dy = t.clientY - startY;
      // 先判断这是横着划还是竖着划：竖着划就当成正常滚动，不管它
      if (!decided) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        decided = true;
        if (Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
      }
      e.preventDefault(); // 横着划：阻止浏览器自带的返回手势 / 滚动
      // 关着时从 width 往 0 拉；开着时从 0 往 width 推。限制在 [0, width] 之间
      const base = open.value ? 0 : width;
      dragX.value = Math.min(width, Math.max(0, base + dx));
    }
    function onTouchEnd() {
      if (dragX.value !== null) open.value = dragX.value < width / 2;
      dragX.value = null; tracking = false;
    }

    // 按 Esc 关闭抽屉
    const onKey = (e) => { if (e.key === "Escape") open.value = false; };

    // 抽屉打开时锁住背后页面的滚动
    watch(open, (v) => { document.body.style.overflow = v ? "hidden" : ""; });

    onMounted(() => {
      timer = setInterval(() => (now.value = new Date()), 30000);
      window.addEventListener("keydown", onKey);
    });
    // 组件卸载时清理定时器和事件监听，避免它们在后台一直占着内存
    // 离开首页（比如点进后端图解）时，组件会被卸载：清掉定时器、事件监听，并恢复页面滚动
    onUnmounted(() => {
      clearInterval(timer);
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    });

    return { today, greeting, timeText, quote, modules: MODULES,
      open, dragX, drawerEl, drawerStyle, onTouchStart, onTouchMove, onTouchEnd };
  },
};

// ===================== 页面组件 2：后端图解 =====================
const Backend = {
  template: "#tpl-backend",
  setup() {
    onMounted(() => {
      document.title = "后端图解 · Goen";
      // 系统设置了"减少动效"时，把 SVG 里的 SMIL 动画（<animateMotion>）也停掉
      try {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches)
          document.querySelectorAll(".bk svg").forEach((el) => el.pauseAnimations && el.pauseAnimations());
      } catch (e) {}
    });
    onUnmounted(() => { document.title = "Goen 秘密基地"; });
    return {};
  },
};

// ===================== 路由：网址 → 页面 的对照表 =====================
// 用 hash 模式：网址长这样 index.html#/backend
// 好处：# 后面的部分浏览器不会发给服务器，所以纯静态托管（Vercel、Artifact）也不会 404
// 选路由模式：先"试一下"浏览器允不允许改网址
// - 本地打开、部署到 Vercel：允许 → 用 hash 模式，网址会跟着变，可以存书签
// - Claude 的预览沙箱：不允许改网址，会抛 SecurityError → 换成 memory 模式（路由只记在内存里，网址不动）
function pickHistory() {
  try {
    history.replaceState(history.state, "", location.href);   // 原样写回当前网址，什么都不改，只是测试权限
    if (location.protocol === "about:") throw new Error("srcdoc");  // 预览有时是 about:srcdoc，hash 模式也用不了
    return createWebHashHistory();
  } catch (e) {
    return createMemoryHistory();
  }
}

const router = createRouter({
  history: pickHistory(),
  routes: [
    { path: "/", component: Home },
    { path: "/backend", component: Backend },
    { path: "/:any(.*)", redirect: "/" },   // 乱输的网址一律回首页
  ],
  // 每次切换页面，都滚回顶部
  scrollBehavior: () => ({ top: 0 }),
});

// 创建应用 → 装上路由 → 挂到 #app 上
createApp({}).use(router).mount("#app");
</script>
