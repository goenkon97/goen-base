<!doctype html>
<!-- 标准模式：没有 doctype 时浏览器会进"怪异模式"，不同设备上布局表现不一致 -->
<!-- 告诉浏览器：这个文件是 UTF-8 编码。没有这一行，本地直接打开时浏览器可能按别的编码去猜，中文就会变成乱码 -->
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
/* iPad 横屏修复（和雅思站同一套）：iPad 上的 Chrome 横屏时，页面拿到的"布局宽度"只有约 900px，比屏幕窄，
   于是内容挤在左边、右边空一大截。这里检测到"触屏 + 横屏 + 平板尺寸 + 布局宽度明显小于屏幕"时，
   把 viewport 的宽度直接设成屏幕的长边；竖屏时改回 device-width。手机不受影响（屏幕短边要 >= 700）。 */
(function () {
  var meta = document.getElementById("vp");
  var BASE = "width=device-width,initial-scale=1,viewport-fit=cover";
  function fix() {
    try {
      var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
      var landscape = window.matchMedia("(orientation: landscape)").matches;
      if (navigator.maxTouchPoints > 1 && landscape && short >= 700) {
        if (window.innerWidth < long * 0.9) meta.setAttribute("content", "width=" + long + ",initial-scale=1,viewport-fit=cover");
      } else if (meta.getAttribute("content") !== BASE) {
        meta.setAttribute("content", BASE);
      }
    } catch (e) {}
  }
  fix();
  ["DOMContentLoaded", "load", "orientationchange", "resize"].forEach(function (ev) { window.addEventListener(ev, fix); });
})();
</script>

<style>
/* 布局概念：今日画面铺满整页（直接画在点点纸上）；入口收进右侧抽屉，手机从右边缘往左滑拉出 */
:root{
  --paper:#F3F5F8;   /* 纸张底色（冷灰）*/
  --dot:#C7CFD9;     /* 纸上的小点点 */
  --card:#FFFFFF;    /* 卡片白 */
  --ink:#23262D;     /* 墨线 / 正文 */
  --ink-soft:#5E6573;/* 次要文字 */
  --yellow:#FFE69A; --blue:#CBE0FF; --pink:#FFD3DC; --mint:#C9EED6; --lilac:#E3DAFF;
  --red:#E5484D;     /* 日历页顶上的红条 */
  --scrim:rgba(35,38,45,.28); /* 抽屉打开时盖住页面的半透明层 */
  --gk:#1F4FD6;
  --hand:"Patrick Hand","Noto Sans SC",system-ui,sans-serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181D;--dot:#2C323B;--card:#1F232A;--ink:#E7E9EE;--ink-soft:#9AA1AE;
  --yellow:#6B5A22;--blue:#28406A;--pink:#6A2E3B;--mint:#245540;--lilac:#433A6E;--red:#F2555A;
  --scrim:rgba(0,0,0,.5);--gk:#6F93FF;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181D;--dot:#2C323B;--card:#1F232A;--ink:#E7E9EE;--ink-soft:#9AA1AE;
  --yellow:#6B5A22;--blue:#28406A;--pink:#6A2E3B;--mint:#245540;--lilac:#433A6E;--red:#F2555A;
  --scrim:rgba(0,0,0,.5);--gk:#6F93FF;color-scheme:dark}

/* 用 height:100% 而不是 100vh，让整页刚好填满一屏 */
/* 基础重置：部署后的页面没有预览时那层外壳，浏览器默认给 body 留 8px 外边距，
   全记录这类背景色不同的页面就会在四周（尤其右上角）露出一圈空隙 */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
/* iPad / iPhone 的 Safari 只在 body 上写 overflow-x:hidden 时，藏在屏幕右边外面的抽屉仍然会把页面撑宽，
   横屏时右边就多出一条空白。html 和 body 两层都裁掉横向溢出（clip 不会产生滚动容器，旧浏览器退回 hidden） */
html,body{overflow-x:hidden;overflow-x:clip}
body{
  background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);
  background-size:18px 18px;
  color:var(--ink);font-family:var(--sans);line-height:1.6;
  overflow-x:hidden;
}
/* #app 撑满整屏，里面当前显示的页面（首页或后端图解）再撑满 #app */
#app{min-height:100%;display:flex;flex-direction:column}
#app>*{flex:1 0 auto}
.wrap{width:100%;max-width:1180px;margin:0 auto;box-sizing:border-box;padding-block:14px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}

/* 顶栏：GK 标 + 问候（右边留出空位给抽屉把手） */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-right:44px}
.gk{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:800;font-size:22px;letter-spacing:-1px;color:var(--gk)}
.greet{font-family:var(--hand);font-size:22px}
.greet small{font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-left:6px}

/* ====== 今日画面：占满整页 ======
   电脑：日历在左、插画在右，语录和进度在下面
   手机：日历 → 插画 → 语录 竖着排 */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;min-width:0}

/* 插画区 art：日历 + 插画 + 四张小贴纸拼贴在一起
   电脑：贴纸 两张在日历左边，两张在插画右边
   手机：四张贴纸围在日历左右两边，插画在下面整行 */
.art{display:grid;grid-template-columns:auto 200px minmax(0,1fr) auto;
  grid-template-areas:"s0 cal scene s2" "s1 cal scene s3";gap:14px 22px;align-items:center;justify-items:center}
@media (max-width:620px){.art{grid-template-columns:minmax(0,1fr) 136px minmax(0,1fr);
  grid-template-areas:"s0 cal s2" "s1 cal s3" "scene scene scene";gap:10px 12px}}

/* 小贴纸：小小一张，像随手贴在日历旁边的标签 */
.sticker{display:flex;flex-direction:column;align-items:center;gap:1px;width:86px;max-width:100%;box-sizing:border-box;
  padding:9px 4px 6px;text-align:center;text-decoration:none;color:inherit;position:relative;
  transition:transform .15s,box-shadow .15s;box-shadow:3px 3px 0 var(--shadow) !important}
.s0{grid-area:s0;transform:rotate(-6deg) translateX(6px)}
.s1{grid-area:s1;transform:rotate(4deg)}
.s2{grid-area:s2;transform:rotate(5deg)}
.s3{grid-area:s3;transform:rotate(-4deg) translateX(-6px)}
a.sticker:hover,a.sticker:focus-visible{transform:translateY(-3px) rotate(0)}
a.sticker:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.sticker svg{width:28px;height:28px}
.sticker b{font-family:var(--hand);font-weight:400;font-size:15px;line-height:1.1}
.sticker small{font-size:10px;color:var(--ink-soft);line-height:1.3}
.sticker.soon{opacity:.6;border-style:dashed;cursor:default}
/* 胶带：贴纸顶上一小条半透明胶带 */
.sticker::before{content:"";position:absolute;top:-7px;left:50%;width:30px;height:10px;transform:translateX(-50%) rotate(-4deg);
  background:var(--shadow);opacity:.85;border:1.5px solid var(--ink);border-radius:2px}

/* 撕页日历 */
.cal{grid-area:cal;width:100%;position:relative;background:var(--card);border:2px solid var(--ink);border-radius:12px;
  box-shadow:5px 5px 0 var(--pink);text-align:center;overflow:hidden;transform:rotate(-2.5deg)}
.cal-head{background:var(--red);color:#fff;font-family:var(--hand);font-size:22px;padding:6px 0 3px;border-bottom:2px solid var(--ink)}
.cal-day{font-family:var(--hand);font-size:96px;line-height:1;padding:12px 0 0}
.cal-week{font-weight:700;font-size:16px}
.cal-jp{font-size:12px;color:var(--ink-soft);padding-bottom:12px}
.cal-rings{position:absolute;top:-6px;left:0;right:0;display:flex;justify-content:space-around;padding:0 38px}
.cal-rings i{width:8px;height:16px;border:2px solid var(--ink);border-radius:6px;background:var(--card)}
@media (max-width:620px){.cal-day{font-size:62px}.cal-head{font-size:16px}.cal-week{font-size:14px}.cal-jp{font-size:10.5px}}
/* 进场小仪式：日历页"啪"地翻下来 */
.flip-enter{animation:flip .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes flip{from{transform:perspective(600px) rotateX(-95deg) rotate(-2.5deg);transform-origin:top}
  to{transform:perspective(600px) rotateX(0) rotate(-2.5deg);transform-origin:top}}

.scene{grid-area:scene;width:100%;max-width:560px;height:auto;display:block}
.txt{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:640px;width:100%;margin-inline:auto;text-align:center}
/* 外层 .stage 是 flex 竖排，justify-self 在 flex 里不生效；设了 max-width 的块要靠左右 margin:auto 才能居中 */
.quote{font-family:var(--hand);font-size:30px;line-height:1.2;text-wrap:balance}
.quote-sub{font-size:14px;color:var(--ink-soft)}
@media (max-width:620px){.quote{font-size:24px}}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bar{flex:1;height:9px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}
.bar span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 6px);opacity:.75}

/* ====== 右侧抽屉 ====== */
/* 把手：贴在屏幕右边缘中间的小纸条，点一下也能打开 */
.handle{position:fixed;top:50%;right:0;transform:translateY(-50%);z-index:20;
  margin-right:env(safe-area-inset-right,0px);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 12px 8px;
  background:var(--card);border:2px solid var(--ink);border-right:none;border-radius:12px 0 0 12px;
  box-shadow:-3px 3px 0 var(--yellow);cursor:pointer;color:var(--ink);font:inherit}
.handle span{font-family:var(--hand);font-size:15px;
  /* 竖着排"入口"两个字：不用 writing-mode（不同设备上竖排的高度算法不一样，会挤成一团），
     而是把盒子宽度限制成一个字宽，让两个字自然换行，一上一下 */
  display:block;flex:none;width:1em;line-height:1.2;text-align:center;word-break:break-all}
.handle svg{width:16px;height:16px;animation:nudge 2.4s ease-in-out infinite}
.handle:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
@keyframes nudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(-4px)}}

.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(300px,80vw);box-sizing:border-box;
  background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px;
  border-left:2px solid var(--ink);box-shadow:-6px 0 0 var(--blue);
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 18px;
  display:flex;flex-direction:column;gap:16px;overflow-y:auto;
  transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.drawer.dragging{transition:none}  /* 手指拖动时不要过渡动画，要跟手 */
/* 抽屉关着时：滑出去的动画播完（0.32 秒）再彻底隐藏，不占位置、也不会被 Tab 键或读屏选中 */
.drawer.closed{visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s}
.close{align-self:flex-end;width:36px;height:36px;display:grid;place-items:center;background:var(--card);
  border:2px solid var(--ink);border-radius:50%;cursor:pointer;color:var(--ink)}
.close svg{width:16px;height:16px}
.close:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}

/* 抽屉里的入口贴纸 */
.doodle{background:var(--card);border:2px solid var(--ink);border-radius:14px 18px 12px 16px/16px 12px 18px 14px;
  box-shadow:4px 4px 0 var(--shadow,var(--yellow))}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;padding:10px 6px;text-decoration:none;color:inherit;
  transition:transform .15s,box-shadow .15s}
a.tile:hover,a.tile:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
a.tile:focus-visible{outline:2px dashed var(--ink);outline-offset:4px}
.tile svg{flex:none;width:32px;height:32px}
.tile-body{min-width:0;flex:1}
.tile h3{margin:0;font-family:var(--hand);font-size:16px;font-weight:400;line-height:1.2}
.tile p{margin:2px 0 0;font-size:10.5px;line-height:1.35;color:var(--ink-soft)}
.tile.soon{opacity:.65;border-style:dashed;cursor:default}
.tile{position:relative}
.tag{position:absolute;top:5px;right:8px;font-family:var(--hand);font-size:12px;color:var(--ink-soft)}
.fade-enter-active,.fade-leave-active{transition:opacity .3s}
.fade-enter-from,.fade-leave-to{opacity:0}

/* 小插画里的动画 */
.rays{transform-origin:330px 62px;animation:spin 18s linear infinite}
.flag{transform-origin:224px 46px;animation:wave 1.6s ease-in-out infinite}
.twinkle{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.d2{animation-delay:.8s}.twinkle.d3{animation-delay:1.6s}
.hop{animation:hop 2.8s ease-in-out infinite;transform-origin:center bottom}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg) scaleX(.94)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== 大屏适配（首页）=====================
   思路：手机上的尺寸是固定 px；屏幕变大时，用 clamp(最小值, 随屏幕变化的值, 最大值) 让东西跟着放大，
   vw = 视口宽度的 1%，vh = 视口高度的 1%。同时按"横屏 / 竖屏"分两种排法。 */

/* ① 横屏：电脑、iPad 横着拿 —— 日历 | 插画 一行，贴纸在两边，整体按屏幕放大 */
@media (min-width:621px) and (min-aspect-ratio:1/1){
  .wrap{max-width:1440px}
  .stage{gap:clamp(24px,5vh,64px)}
  .art{grid-template-columns:auto clamp(200px,19vw,300px) minmax(0,1fr) auto;
    gap:clamp(14px,3vh,36px) clamp(22px,3vw,52px)}
  /* 插画最高占屏幕一半，避免矮屏幕（笔记本）上把语录挤出去 */
  .scene{max-width:none;max-height:50vh}
  .cal-head{font-size:clamp(22px,2vw,32px)}
  .cal-day{font-size:clamp(96px,9.5vw,150px)}
  .cal-week{font-size:clamp(16px,1.4vw,21px)}
  .cal-jp{font-size:clamp(12px,1vw,15px);padding-bottom:clamp(12px,1.2vw,18px)}
  .cal-rings i{width:clamp(8px,.7vw,11px);height:clamp(16px,1.4vw,22px)}
  .sticker{width:clamp(86px,8.5vw,132px);padding:clamp(9px,1vw,15px) 6px clamp(6px,.7vw,11px);gap:2px}
  .sticker svg{width:clamp(28px,2.8vw,44px);height:clamp(28px,2.8vw,44px)}
  .sticker b{font-size:clamp(15px,1.5vw,22px)}
  .sticker small{font-size:clamp(10px,.95vw,13px)}
  .sticker::before{width:clamp(30px,3vw,46px);height:clamp(10px,1vw,14px)}
  .txt{max-width:820px;gap:clamp(8px,1.2vh,14px)}
  .quote{font-size:clamp(30px,2.8vw,44px)}
  .quote-sub{font-size:clamp(14px,1.15vw,18px)}
  .meta{font-size:clamp(12px,.95vw,14px)}
  .greet{font-size:clamp(22px,1.8vw,28px)}
  .gk{font-size:clamp(22px,1.8vw,28px)}
}

/* ② 竖屏平板：iPad 竖着拿 —— 和手机一样"贴纸围着日历、插画在下面"，但整体放大 */
@media (min-width:621px) and (max-aspect-ratio:1/1){
  .stage{gap:clamp(24px,4vh,56px)}
  .art{grid-template-columns:minmax(0,1fr) clamp(180px,27vw,270px) minmax(0,1fr);
    grid-template-areas:"s0 cal s2" "s1 cal s3" "scene scene scene";gap:clamp(18px,3vh,32px) clamp(20px,4vw,44px)}
  .scene{max-width:760px;max-height:38vh}
  .cal-head{font-size:clamp(20px,3vw,30px)}
  .cal-day{font-size:clamp(84px,13vw,140px)}
  .cal-week{font-size:clamp(16px,2.2vw,22px)}
  .cal-jp{font-size:clamp(12px,1.6vw,15px);padding-bottom:16px}
  .sticker{width:clamp(110px,16vw,160px);padding:14px 6px 10px;gap:3px}
  .sticker svg{width:clamp(36px,5vw,50px);height:clamp(36px,5vw,50px)}
  .sticker b{font-size:clamp(19px,2.6vw,24px)}
  .sticker small{font-size:clamp(12px,1.6vw,14px)}
  .sticker::before{width:44px;height:13px}
  .txt{max-width:700px}

.bk .card h3{font:700 17px/1.3 var(--body);margin:0}
.bk .card svg{width:100%;height:auto;display:block;border-radius:10px;background:color-mix(in srgb,var(--bg) 70%,var(--card))}
.bk .card ul{margin:0;padding-left:1.15em;color:var(--sub)}
.bk .card li{margin:2px 0}
.bk .one{margin:2px 0 0;padding:7px 10px;border-radius:8px;background:var(--chipbg);font-weight:500}
.bk code{font:500 .92em ui-monospace,Menlo,Consolas,monospace;background:var(--chipbg);padding:1px 5px;border-radius:5px}
/* ===== 插画 ===== */
.bk .wob{filter:url(#bwob)}
.bk .s{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bk .fb{fill:var(--f-blue)}
.bk .fy{fill:var(--f-yel)}
.bk .fg{fill:var(--f-grn)}
.bk .fr{fill:var(--f-red)}
.bk .fp{fill:var(--f-pur)}
.bk .fw{fill:var(--card)}
.bk .fk{fill:var(--f-gry)}
.bk svg text{fill:var(--ink);font-family:var(--hand);font-size:12px}
.bk svg .zh{font-family:var(--body);font-size:11px;font-weight:500}
.bk svg .sm{font-size:10px}
.bk svg .cap{fill:var(--sub);font-family:var(--body);font-size:10px}
.bk svg .red{fill:#d6453d}
.bk svg .grn{fill:#2c9a55}
.bk .tc{transform-box:fill-box;transform-origin:center}
/* 动画：每个都有"静止时也完整"的初始状态，减少动效时直接停住 */
@keyframes pop{0%,12%{transform:scale(0)}28%,100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounceX{0%,100%{transform:translateX(0)}35%{transform:translateX(34px)}50%{transform:translateX(22px)}62%{transform:translateX(-8px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes ramA{0%,40%{opacity:1}46%,70%{opacity:0}80%,100%{opacity:1}}
@keyframes fromFile{0%,70%{opacity:0}74%,80%{opacity:1}86%,100%{opacity:0}}
@keyframes flashT{0%,38%{opacity:0}44%,54%{opacity:1}60%,100%{opacity:0}}
@keyframes idJ{0%,15%{transform:translate(0,0);opacity:1}45%{transform:translate(62px,0);opacity:1}60%{transform:translate(48px,-14px) rotate(14deg);opacity:1}85%{transform:translate(0,-34px) rotate(40deg);opacity:0}100%{transform:translate(0,0);opacity:0}}
@keyframes wordJ{0%,15%{transform:translate(0,0)}55%,92%{transform:translate(104px,0)}100%{transform:translate(0,0)}}
@keyframes noTk{0%,46%{opacity:1}50%,100%{opacity:0}}
@keyframes yesTk{0%,50%{opacity:0}54%,96%{opacity:1}100%{opacity:0}}
@keyframes step1{0%,18%{opacity:1}22%,100%{opacity:.28}}
@keyframes dashMove{to{stroke-dashoffset:-24}}
@keyframes keyGo{0%,10%{transform:translate(0,0)}50%,90%{transform:translate(104px,0)}100%{transform:translate(0,0)}}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.bk .a-pop{animation:pop 4.2s ease-out infinite}
.bk .a-spin{animation:spin 6s linear infinite}
.bk .a-bounce{animation:bounceX 3.6s ease-in-out infinite}
.bk .a-blink{animation:blink 1.6s ease-in-out infinite}
.bk .a-ram{animation:ramA 7s infinite}
.bk .a-file{animation:fromFile 7s infinite}
.bk .a-flash{animation:flashT 7s infinite}
.bk .a-idj{animation:idJ 5s ease-in-out infinite}
.bk .a-wordj{animation:wordJ 5s ease-in-out infinite}
.bk .a-no{animation:noTk 8s infinite}
.bk .a-yes{animation:yesTk 8s infinite}
.bk .a-st{opacity:.28;animation:step1 7.5s infinite}
.bk .a-dash{stroke-dasharray:8 6;animation:dashMove 1.2s linear infinite}
.bk .a-key{animation:keyGo 5s ease-in-out infinite}
.bk .a-bump{animation:bump 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
.bk *{animation:none!important}
.bk .a-st{opacity:1}
.bk .a-pop{transform:scale(1)}
.bk .a-no,.bk .a-idj{opacity:0}
.bk .a-yes{opacity:1}}
.bk .full{grid-column:1/-1}
.bk .tb{width:100%;border-collapse:collapse;font-size:13px}
.bk .tb td{padding:6px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.bk .tb td:first-child{white-space:nowrap;color:var(--sub)}
.bk .tb code{word-break:break-all}

.bk{min-height:100%;box-sizing:border-box}
/* 返回按钮：涂鸦风小纸条，固定在左上 */
.bk-back{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:inline-flex;align-items:center;gap:6px;margin:0 0 18px;
  padding:4px 12px 4px 8px;background:var(--card);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--f-pur);
  font-family:var(--hand);font-size:17px;color:var(--ink);text-decoration:none}
.bk-back svg{width:16px;height:16px}
.bk-back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--f-pur)}
.bk-back:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
</style>

<!-- ===== 首页的模板（路由 / 显示它）===== -->
<template id="tpl-home">
<div class="wrap"
  @touchstart.passive="onTouchStart" @touchmove="onTouchMove" @touchend="onTouchEnd" @touchcancel="onTouchEnd">
  <!-- 顶栏 -->
  <header class="top">
    <span class="gk" aria-label="GK">GK</span>
    <div class="greet">{{ greeting }}, Goen<small>{{ timeText }}</small></div>
  </header>

  <!-- 今日画面：铺满整页 -->
  <main class="stage" aria-label="今天">
    <!-- 插画区：日历 + 插画 + 小贴纸，用 grid-template-areas 拼在一起 -->
    <div class="art">
      <!-- 小贴纸：用下标 i 给每张一个 s0~s3 的位置 class -->
      <component v-for="(m, i) in modules" :key="m.id"
        :is="m.to ? 'router-link' : (m.url ? 'a' : 'div')" :to="m.to"
        :href="m.url || undefined" :target="m.url ? '_blank' : undefined" :rel="m.url ? 'noopener' : undefined"
        class="sticker doodle" :class="['s' + i, { soon: !m.url && !m.to }]" :style="{ '--shadow': `var(--${m.color})` }">
        <svg viewBox="0 0 58 58" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" v-html="m.icon"></svg>
        <b>{{ m.short }}</b>
        <small>{{ (m.url || m.to) ? m.tagline : 'soon' }}</small>
      </component>

    <!-- key 绑定日期：日期变了，Vue 会销毁旧节点再建新节点，翻页动画就会重播 -->
    <div class="cal flip-enter" :key="today.dateKey">
      <div class="cal-rings"><i></i><i></i></div>
      <div class="cal-head">{{ today.year }} · {{ today.month }}月</div>
      <div class="cal-day">{{ today.day }}</div>
      <div class="cal-week">{{ today.weekZh }}</div>
      <div class="cal-jp">{{ today.weekJp }} · {{ today.monthEn }}</div>
    </div>

    <!-- 小插画：小人站在两摞书（英语 / 日语）上举旗，后面太阳升起 -->
    <svg class="scene" viewBox="40 10 390 170" role="img" aria-label="小人站在英语书和日语书上举旗，太阳升起">
      <defs>
        <!-- 手绘抖动滤镜：用噪声把直线轻微扭一扭 -->
        <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
          <feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
      </defs>
      <g filter="url(#wob)" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- 太阳 + 光芒 -->
        <g class="rays">
          <path v-for="a in 12" :key="a" fill="none"
            :d="`M${330+Math.cos(a*Math.PI/6)*38} ${62+Math.sin(a*Math.PI/6)*38} L${330+Math.cos(a*Math.PI/6)*50} ${62+Math.sin(a*Math.PI/6)*50}`"/>
        </g>
        <circle cx="330" cy="62" r="28" fill="var(--yellow)"/>
        <!-- 地平线小山 -->
        <path d="M8 160 Q90 128 170 150 T300 146 T432 156" fill="none"/>
        <path d="M8 168 H432" fill="none" stroke-dasharray="2 9"/>
        <!-- 书堆：EN（蓝）+ 日本語（粉）-->
        <rect x="150" y="128" width="120" height="26" rx="4" fill="var(--blue)"/>
        <rect x="164" y="102" width="98" height="26" rx="4" fill="var(--pink)"/>
        <path d="M160 135 H260 M174 109 H252" fill="none" stroke-width="1.4"/>
        <!-- 小人 -->
        <g class="hop">
          <circle cx="210" cy="62" r="11" fill="var(--card)"/>
          <path d="M206 61 h.1 M214 61 h.1" fill="none" stroke-width="3"/>
          <path d="M206 66 q4 3 8 0" fill="none" stroke-width="1.8"/>
          <path d="M210 73 V90 M210 90 L202 102 M210 90 L218 102 M210 78 L200 86 M210 78 L222 66" fill="none"/>
          <!-- 旗杆 + 旗 -->
          <path d="M222 66 V30" fill="none"/>
          <path class="flag" d="M222 31 L250 37 L222 45 Z" fill="var(--mint)"/>
        </g>
        <!-- 小星星 -->
        <path class="twinkle" d="M70 50 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3z" fill="var(--yellow)" stroke-width="1.6"/>
        <path class="twinkle d2" d="M120 26 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2z" fill="var(--lilac)" stroke-width="1.4"/>
        <path class="twinkle d3" d="M392 120 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2z" fill="var(--pink)" stroke-width="1.4"/>
      </g>
      <!-- 书脊上的字不加抖动，保证清楚 -->
      <text x="210" y="146" text-anchor="middle" font-family="Patrick Hand" font-size="15" fill="var(--ink)">ENGLISH</text>
      <text x="213" y="120" text-anchor="middle" font-family="Noto Sans SC" font-size="13" font-weight="700" fill="var(--ink)">日本語</text>
    </svg>
    </div>

    <!-- 文字区：语录 + 今年进度 -->
    <div class="txt">
      <div class="quote">{{ quote.en }}</div>
      <div class="quote-sub">{{ quote.zh }}　/　{{ quote.jp }}</div>
      <div class="meta">
        <span>第 {{ today.dayOfYear }} 天</span>
        <div class="bar" :title="`今年已过 ${today.yearPct}%`"><span :style="{ width: today.yearPct + '%' }"></span></div>
        <span>还剩 {{ today.daysLeft }} 天</span>
      </div>
    </div>
  </main>

  <!-- 抽屉把手：只在抽屉关着时显示 -->
  <button v-show="!open" class="handle" type="button" aria-label="打开入口" :aria-expanded="open" @click="open = true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 L5 8 L10 13"/></svg>
    <span>入口</span>
  </button>

  <!-- 半透明遮罩：点一下关闭抽屉 -->
  <transition name="fade">
    <div v-if="open || dragX !== null" class="scrim" @click="open = false"></div>
  </transition>

  <!-- 抽屉本体：位置由 drawerStyle 算出来（关着 = 推到屏幕外；拖动中 = 跟着手指） -->
  <aside class="drawer" :class="{ dragging: dragX !== null, closed: !open && dragX === null }" :style="drawerStyle" ref="drawerEl"
    :aria-hidden="!open" :inert="!open || undefined">
    <button class="close" type="button" aria-label="关闭" @click="open = false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3 L13 13 M13 3 L3 13"/></svg>
    </button>
    <div class="tiles">
    <component v-for="m in modules" :key="m.id"
      :is="m.to ? 'router-link' : (m.url ? 'a' : 'div')" :to="m.to"
      :href="m.url || undefined" :target="m.url ? '_blank' : undefined" :rel="m.url ? 'noopener' : undefined"
      class="tile doodle" :class="{ soon: !m.url && !m.to }" :style="{ '--shadow': `var(--${m.color})` }">
      <svg viewBox="0 0 58 58" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" v-html="m.icon"></svg>
      <div class="tile-body">
        <h3>{{ m.title }}</h3>
        <p>{{ m.desc }}</p>
      </div>
      <span v-if="!m.url && !m.to" class="tag">soon</span>
    </component>
    </div>
  </aside>
</div>
</template>

<!-- ===== 后端图解页的模板（路由 /backend 显示它）===== -->
<template id="tpl-bk-diagram">
<div class="bk">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="bwob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter>

</defs></svg>

<div class="bk-wrap">
<h1>后端图解：Java · Spring · 数据库</h1>
<p class="lead">从上往下看：先看三者分工，再一件件拆，最后是机器和网络层。每张图只讲一件事。</p>
<div class="grid"><section class="card full">
      <h3>三者的分工</h3>
      <svg viewBox="0 0 640 150" role="img" aria-label="Java 是语言，Spring 是框架，数据库存数据">
        <g class="wob">
          <rect class="s fy" x="10" y="30" width="190" height="86" rx="10"/>
          <rect class="s fb" x="225" y="30" width="190" height="86" rx="10"/>
          <rect class="s fg" x="440" y="30" width="190" height="86" rx="10"/>
          <path class="s" d="M202 73h20M417 73h20" marker-end="url(#ah)"/>
        </g>
        <text x="105" y="56" text-anchor="middle" class="zh" style="font-size:14px">Java</text>
        <text x="105" y="76" text-anchor="middle" class="zh">语言：你写的一切</text>
        <text x="105" y="94" text-anchor="middle" class="sm">类、方法、判断、循环</text>
        <text x="320" y="56" text-anchor="middle" class="zh" style="font-size:14px">Spring Boot</text>
        <text x="320" y="76" text-anchor="middle" class="zh">框架：接请求、造对象</text>
        <text x="320" y="94" text-anchor="middle" class="sm">用 Java 写的“半成品后端”</text>
        <text x="535" y="56" text-anchor="middle" class="zh" style="font-size:14px">数据库</text>
        <text x="535" y="76" text-anchor="middle" class="zh">仓库：数据放这里</text>
        <text x="535" y="94" text-anchor="middle" class="sm">独立软件，用 SQL 对话</text>
        <circle r="6" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4s" repeatCount="indefinite" path="M20,132 L620,132"/></circle>
        <text x="320" y="146" text-anchor="middle" class="cap">你主要写的，是“Spring 在中间，该怎么处理这条请求”</text>
      </svg>
      <p class="one">类比前端：Java ≈ JS，Spring ≈ Vue（框架替你管流程），数据库 ≈ 一个很大的、不会忘的 localStorage。</p>
    </section></div>
<h2>一 · JAVA：只要看懂这几样</h2>
<div class="grid">
<section class="card">
      <h3>类、字段、方法</h3>
      <svg viewBox="0 0 320 170" role="img" aria-label="类是图纸，有字段和方法，new 出两个对象">
        <g class="wob">
          <rect class="s fb" x="8" y="20" width="136" height="110" rx="7"/><path class="s" d="M8 44h136M8 88h136"/>
          <rect class="s fg tc a-pop" x="196" y="22" width="112" height="44" rx="6" style="animation-delay:0s"/>
          <rect class="s fg tc a-pop" x="196" y="82" width="112" height="44" rx="6" style="animation-delay:.8s"/>
        </g>
        <text x="76" y="37" text-anchor="middle" class="zh">class FavoriteWord</text>
        <text x="18" y="62" class="sm">字段：String word;</text><text x="18" y="78" class="sm">　　　String meaning;</text>
        <text x="18" y="106" class="sm">方法：getWord()</text><text x="18" y="122" class="sm">　　　setMeaning(…)</text>
        <path class="s a-dash" d="M148 76h40" marker-end="url(#ah)"/><text x="168" y="68" text-anchor="middle" class="sm">new</text>
        <text x="252" y="40" text-anchor="middle" class="sm">word=abandon</text><text x="252" y="56" text-anchor="middle" class="sm">对象①</text>
        <text x="252" y="100" text-anchor="middle" class="sm">word=reduce</text><text x="252" y="116" text-anchor="middle" class="sm">对象②</text>
        <text x="8" y="154" class="cap">字段 = 数据，方法 = 能做的事，对象 = 按图纸造出的一份</text>
      </svg>
      <ul><li>每个 <code>.java</code> 文件一个类，文件名 = 类名。</li><li><code>public/private</code> 决定别人能不能碰；字段通常 private，通过 get/set 方法读写。</li></ul>
      <p class="one">类 = 带方法的“数据结构”，比 JS 对象更死板，但更不容易出错。</p>
    </section>
<section class="card">
      <h3>对象在内存里</h3>
      <svg viewBox="0 0 320 170" role="img" aria-label="类是图纸，Spring 启动时按图纸在内存里造出对象">
        <g class="wob">
          <rect class="s fb" x="10" y="44" width="76" height="86" rx="6"/><path class="s" d="M22 64h52M22 80h52M22 96h36"/>
          <rect class="s fk" x="152" y="30" width="158" height="112" rx="10"/>
        </g>
        <text x="48" y="118" text-anchor="middle" class="zh">类 = 图纸</text>
        <text x="231" y="46" text-anchor="middle" class="sm" style="font-size:10px">内存</text>
        <path class="s a-dash" d="M92 87h52" marker-end="url(#ah)"/><text x="118" y="78" text-anchor="middle" class="sm">new</text>
        <g class="wob">
          <rect class="s fg tc a-pop" x="164" y="62" width="40" height="34" rx="6" style="animation-delay:0s"/>
          <rect class="s fg tc a-pop" x="212" y="62" width="40" height="34" rx="6" style="animation-delay:.5s"/>
          <rect class="s fg tc a-pop" x="260" y="62" width="40" height="34" rx="6" style="animation-delay:1s"/>
          <rect class="s fy tc a-pop" x="188" y="104" width="64" height="28" rx="6" style="animation-delay:1.5s"/>
        </g>
        <text x="184" y="84" text-anchor="middle" class="sm">对象</text><text x="232" y="84" text-anchor="middle" class="sm">对象</text><text x="280" y="84" text-anchor="middle" class="sm">对象</text>
        <text x="220" y="122" text-anchor="middle" class="sm">@Component</text>
        <text x="10" y="156" class="cap">Spring 启动时扫描标签，替你 new，再按需要递给别人</text>
      </svg>
      <ul><li>类只是图纸，<code>new</code> 才会在内存里造出真正的对象。</li><li>类上有标签（<code>@Component</code> 等），Spring 就替你造好，并在别的类需要时递过去，这叫依赖注入。</li></ul>
      <p class="one">你没写 new，是 Spring 替你写了。</p>
    </section>
<section class="card">
      <h3>编译：先翻译，再运行</h3>
      <svg viewBox="0 0 320 170" role="img" aria-label="java 源码经 javac 编译成 class 字节码，再由 JVM 运行">
        <g class="wob">
          <rect class="s fy" x="4" y="42" width="66" height="44" rx="6"/><rect class="s fk" x="88" y="42" width="66" height="44" rx="6"/><rect class="s fp" x="172" y="42" width="66" height="44" rx="6"/><rect class="s fg" x="256" y="30" width="60" height="68" rx="8"/>
          <path class="s" d="M70 64h16M154 64h16M238 64h16" marker-end="url(#ah)"/>
        </g>
        <text x="37" y="60" text-anchor="middle" class="sm">Hello</text><text x="37" y="76" text-anchor="middle" class="sm">.java</text>
        <text x="121" y="60" text-anchor="middle" class="zh">javac</text><text x="121" y="76" text-anchor="middle" class="sm">编译器</text>
        <text x="205" y="60" text-anchor="middle" class="sm">Hello</text><text x="205" y="76" text-anchor="middle" class="sm">.class</text>
        <text x="286" y="58" text-anchor="middle" class="zh">JVM</text><text x="286" y="74" text-anchor="middle" class="sm">进程</text>
        <circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4s" repeatCount="indefinite" path="M20,112 L300,112"/></circle>
        <text x="121" y="108" text-anchor="middle" class="zh red" style="font-size:10.5px">类型写错，在这一步就报错</text>
        <text x="8" y="138" class="cap">.class 是字节码，不是机器码；JVM 这个程序把它逐步翻成 CPU 指令</text>
        <text x="8" y="154" class="cap">打包后得到一个 .jar，里面就是一堆 .class</text>
      </svg>
      <ul><li>Java 是强类型：每个变量必须写明类型，写错在运行前就被拦住。</li><li><code>java -jar xxx.jar</code> = 启动一个 JVM 进程去跑它。</li></ul>

<section class="card">
      <h3>接口、record、注解</h3>
      <svg viewBox="0 0 320 170" role="img" aria-label="接口是合同，record 是只装数据的类，注解是标签">

        <text x="163" y="44" text-anchor="middle" class="zh">record</text>
        <text x="163" y="64" text-anchor="middle" class="sm">一行写完的数据盒</text><text x="163" y="84" text-anchor="middle" class="sm">record Req(</text><text x="163" y="98" text-anchor="middle" class="sm">  String word)</text>

      <ul><li>接口 = 合同，实现类（或 Spring 生成的代理）负责履行。</li><li>record 不可改，自带构造器和取值方法，适合接前端传来的数据。</li></ul>
      <p class="one">看到 @ 开头的，就想：这是在告诉 Spring 做什么。</p>

        <text x="163" y="22" text-anchor="middle" class="zh">Map&lt;K,V&gt;</text>

<section class="card">

        <tr><td><code>@RestController</code></td><td>这个类接请求，返回 JSON</td></tr>
        <tr><td><code>@GetMapping("/me")</code></td><td>GET 这个网址时调用该方法</td></tr>
        <tr><td><code>@RequestBody</code></td><td>把请求里的 JSON 填进参数对象</td></tr>
        <tr><td><code>@PathVariable</code></td><td>取网址里的 <code>/favorites/12</code> 的 12</td></tr>
        <tr><td><code>@Service</code> / <code>@Component</code></td><td>让 Spring 造并管理这个类</td></tr>
        <tr><td><code>@Configuration</code> + <code>@Bean</code></td><td>手动告诉 Spring 怎么造某个对象</td></tr>
        <tr><td><code>@Entity</code> / <code>@Id</code></td><td>这个类对应一张表 / 主键字段</td></tr>
        <tr><td><code>@Value("${…}")</code></td><td>读配置文件或环境变量</td></tr>
      </table>
      <p class="one">不用背，见到就回这张表查。</p>

        </g>
        <text x="50" y="82" text-anchor="middle" class="zh">你的电脑</text>
        <text x="262" y="58" text-anchor="middle" class="zh">后端进程</text><text x="262" y="104" text-anchor="middle" class="zh">PostgreSQL</text><text x="262" y="134" text-anchor="middle" class="sm" style="font-size:9.5px">云服务器</text>

      <svg viewBox="0 0 640 170" role="img" aria-label="Java 报错很长，真正原因在最后一个 Caused by">
        <g class="wob"><rect class="s fk" x="8" y="10" width="624" height="116" rx="8"/><rect class="s fy a-blink" x="14" y="94" width="612" height="20" rx="4"/></g>

        <text x="20" y="48" class="sm" style="font-size:11px">  at org.springframework.beans.factory.support… (几十行，不用看)</text>
        <text x="20" y="66" class="sm" style="font-size:11px">Caused by: org.springframework.beans.factory.NoSuchBeanDefinitionException:</text>
        <text x="20" y="84" class="sm" style="font-size:11px">  No qualifying bean of type 'JwtService' available</text>
        <text x="20" y="108" class="zh" style="font-size:12px">Caused by: 缺少 JwtService 对象 → 忘了给它贴 @Service</text>
        <text x="8" y="148" class="cap">最上面是“结果”，最下面的 Caused by 才是“起因”；其间的 at … 是调用路径，只在找位置时才看</text>
        <text x="8" y="164" class="cap">把最后一个 Caused by 和它上面一行发给我，通常就够定位</text>
      </svg>
      <p class="one">读报错的顺序：最后一个 Caused by → 里面的类名/字段名 → 回你自己的代码里找。</p>
    </section>

        <text x="40" y="508" font-size="14.5" font-weight="700">浏览器 localStorage</text><text x="40" y="526">token 存在 ielts_token 里，</text><text x="40" y="542">之后每个请求都带着它</text>
        <text x="412" y="108" font-size="14.5" font-weight="700">前端 fetch</text><text x="412" y="126">请求头带 Authorization: Bearer token</text><text x="412" y="142">先乐观更新界面，失败再回滚</text>
        <text x="412" y="204" font-size="14.5" font-weight="700">CorsConfig</text><text x="412" y="222">浏览器先发 OPTIONS 预检，</text><text x="412" y="238">来源在白名单里才放行</text>
        <text x="412" y="300" font-size="14.5" font-weight="700">AuthInterceptor 门卫</text><text x="412" y="318">验 token，失败直接回 401，</text><text x="412" y="334">成功就把 userId 放进请求便签；</text><text x="412" y="350">WebAuthConfig 规定它只守 /favorites</text>
        <text x="412" y="412" font-size="14.5" font-weight="700">FavoriteWordController</text><text x="412" y="430">@RequestAttribute 取出 userId，</text><text x="412" y="446">校验 kind 和 word，去重，</text><text x="412" y="462">只读写属于这个 userId 的行</text>
        <text x="412" y="524" font-size="14.5" font-weight="700">FavoriteWordRepository → 收藏表</text><text x="412" y="542">findByUserId、findByIdAndUserId 等</text><text x="412" y="558">每个查询都带着 userId 条件</text>
      </g>
    </svg>
    </div>
  </div>
  <p class="note">左边是登录，一个人只走一次；右边是每次点书签都走的路。token 是两条线的接头：登录时签发，之后每个请求都靠它证明身份。粉色那一格是门卫，整套安全设计都押在它身上。</p>
</section>

<section id="config">
  <h2>启动与配置类</h2>

  <details>
    <summary><span class="fn">IeltsBackendApplication</span><span class="one">程序入口</span></summary>
    <div class="body">
<pre><code>@SpringBootApplication
public class IeltsBackendApplication {
    public static void main(String[] args) {
        SpringApplication.run(IeltsBackendApplication.class, args);
    }
}</code></pre>
      <p><b>它干嘛</b>：相当于前端 <code>main.js</code> 里的 <code>createApp(App).mount('#app')</code>。点 IntelliJ 的 Run，Java 虚拟机找到 <code>main</code> 方法开始执行，<code>SpringApplication.run</code> 把整个后端"点着"：开一个进程、占用 8080 端口、创建所有对象、等请求进来。</p>
      <p><code>@SpringBootApplication</code> 做了三件事：</p>
      <ol>
        <li>打开自动配置：看到 classpath 里有 H2、JPA、Web，就自动配好数据库连接、路由、JSON 转换，不用手写。</li>
        <li>打开组件扫描：从这个类所在的包（<code>com.goenkon.ielts</code>）开始往下找所有带 <code>@Component</code>、<code>@RestController</code>、<code>@Configuration</code>、<code>@Entity</code> 的类，自动创建对象。</li>
        <li>允许这个类自己也当配置类用。</li>
      </ol>
      <p><b>所以所有 Java 文件必须放在 <code>com.goenkon.ielts</code> 或它的子包里</b>：放到包外面，扫描不到，就像一个 Vue 组件没被 import，永远不会运行。</p>
      <p><code>args</code> 哪来：命令行启动时跟在后面的参数，比如 <code>java -jar app.jar --server.port=9000</code>。我们现在没传，是空数组。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">application.properties</span><span class="one">配置文件，相当于 .env</span></summary>
    <div class="body">
      <p>启动时 Spring 自动读取 <code>src/main/resources/application.properties</code>，每行一个 <code>key=value</code>。区别是这里的 key 有很多是 Spring 自己认识的"官方 key"，写对了它就自动生效。</p>
      <div class="scroll"><table>
        <tr><th>配置项</th><th>值</th><th>机器会怎么做</th></tr>
        <tr><td><code>spring.application.name</code></td><td>项目名</td><td>只是个名字，日志和监控里显示，不影响功能</td></tr>
        <tr><td><code>spring.datasource.url</code></td><td><code>jdbc:h2:file:./data/ielts</code></td><td>用 H2 数据库，数据存成文件，放在<b>启动目录</b>下的 <code>data/ielts.mv.db</code>。重启后数据还在。写成 <code>jdbc:h2:mem:</code> 就是存内存，重启就没了</td></tr>
        <tr><td><code>spring.datasource.username</code> / <code>password</code></td><td><code>sa</code> / 空</td><td>连数据库的账号密码。H2 默认账号就是 sa，本地练习无所谓；换 PostgreSQL 上线时必须改成真账号并放进环境变量</td></tr>
        <tr><td><code>spring.h2.console.enabled</code></td><td><code>true</code></td><td>打开网页版数据库管理器 <code>http://localhost:8080/h2-console</code>，开发时方便看表。<b>上线必须关掉</b></td></tr>
        <tr><td><code>spring.jpa.hibernate.ddl-auto</code></td><td><code>update</code></td><td>启动时对比"实体类"和"数据库表"：表不存在就建，缺字段就补，<b>不会删</b>数据。开发很方便；上线后常改成 <code>validate</code></td></tr>
        <tr><td><code>spring.jpa.show-sql</code></td><td><code>true</code></td><td>每次访问数据库，把真正执行的 SQL 打印在控制台。学习期很有用，上线可关</td></tr>
        <tr><td><code>google.client-id</code></td><td>你的 Client ID</td><td>验证 Google token 时的"受众"，只接受发给这个应用的 token。它是公开信息，不是密码</td></tr>
        <tr><td><code>app.jwt-secret</code></td><td><code>${APP_JWT_SECRET:local-dev-…}</code></td><td>签发 JWT 的密钥。写法是"先找环境变量 <code>APP_JWT_SECRET</code>，没有就用冒号后面的默认值"。<b>上线必须设置环境变量</b>，否则默认值公开写在代码里，别人能伪造登录</td></tr>

        <li><code>h2</code>（runtime）：H2 数据库本体。<code>runtime</code> 表示只在运行时需要，编译时不用。</li>
        <li><code>spring-boot-h2console</code>：网页版数据库管理器。</li>

        <li>里面空的 <code>&lt;name/&gt;</code>、<code>&lt;licenses&gt;</code> 等是创建项目时留下的元数据，不影响运行，上线前可以清理。</li>

      <span class="takeaway">加新库：往 &lt;dependencies&gt; 里加一段，刷新 Maven，就像 npm install</span>
    </div>
  </details>

  <details>
    <summary><span class="fn">CorsConfig</span><span class="one">跨域白名单</span></summary>
    <div class="body">
      <p><b>为什么需要它</b>：浏览器有"同源策略"。你的页面在 <code>localhost:5500</code> 或 <code>ielts.goenkon.com</code>，后端在 <code>localhost:8080</code>，域名或端口不同，浏览器默认<b>拦截</b>页面读取后端的响应。这是浏览器在保护用户，不是后端坏了。后端要在响应头里明确说"我允许这个来源"，浏览器才放行。</p>
<pre><code>@Configuration
public class CorsConfig implements WebMvcConfigurer {
    @Override
    public void addCorsMappings(CorsRegistry registry) {
        registry.addMapping("/**")
            .allowedOrigins("http://localhost:5500", "https://ielts.goenkon.com")
            .allowedMethods("GET", "POST", "PUT", "DELETE", "OPTIONS")
            .allowedHeaders("*");
    }
}</code></pre>
      <ul>
        <li><code>@Configuration</code>：这是一个配置类，启动时 Spring 会读它、执行里面的设置。</li>
        <li><code>implements WebMvcConfigurer</code>：Spring MVC 预留的"自定义入口"接口。实现它，就能重写它给的方法，插入自己的规则。</li>
        <li><code>@Override</code>：声明"我在重写接口里已有的方法"，写错方法名编译器会报错，是个保险。</li>
        <li><code>addCorsMappings(CorsRegistry registry)</code>：<b>这个方法不是你调用的，是 Spring 启动时调用的</b>，它把一个空的"跨域规则登记表"递给你，你往里登记。</li>
        <li><code>addMapping("/**")</code>：规则适用于所有路径。</li>
        <li><code>allowedOrigins</code>：白名单，<b>精确匹配</b>协议、域名、端口，多一个斜杠或写错 http/https 都不行。新增日语站、新端口都要加在这里。</li>
        <li><code>allowedHeaders("*")</code>：允许前端带任意请求头，我们需要它放行 <code>Authorization</code> 和 <code>Content-Type</code>。</li>
      </ul>
      <p><b>预检请求（preflight）</b>：当前端带 <code>Authorization</code> 头或发 JSON 时，浏览器会先偷偷发一个 <code>OPTIONS</code> 请求问后端"我可以这样发吗"，后端答"可以"之后才发真正的请求。这个应答由上面的配置自动完成。你在浏览器网络面板里看到每次请求前多一条 OPTIONS，就是它。</p>
    </div>
  </details>
</section>

<!-- ===== 登录 ===== -->
<section id="login">
  <h2>登录相关的文件</h2>
  <div class="paper y note">我们不存密码，也不自己认证人。认证交给 Google，我们只做两件事：核对前端交来的 Google 证明书是真是假；是真的，就发一张我们自己的"通行证"（JWT），以后前端靠通行证证明身份。<br>"注册"和"登录"是同一个流程：第一次来的 Google 账号在用户表里找不到，就自动建一行；下次来找得到，直接用。所以没有单独的注册页面。</div>

  <details>
    <summary><span class="fn">GoogleTokenVerifier</span><span class="one">向 Google 核对证明书</span></summary>
    <div class="body">
      <p>前端登录后拿到一串 Google 签发的"身份证明"（ID token），发给后端。后端<b>绝不能直接相信</b>，因为任何人都能伪造一个请求说"我是 xxx@gmail.com"。这个类用 Google 官方库，用 Google 公开的公钥检查三件事：签名是不是 Google 的、有没有过期、这张证明是不是发给我们这个应用的（audience = 我们的 Client ID）。第三项很重要，否则别的网站拿到的 Google token 也能拿来给我们用。</p>
      <ul>
        <li><code>@Component</code>：请 Spring 帮我 new 这个类的对象，全程序共用一个。别的类要用，在构造方法里声明就行，不用自己 new。</li>
        <li>构造方法里 <code>@Value("${google.client-id}")</code>：启动时 Spring 去 <code>application.properties</code> 拿 <code>google.client-id</code> 的值填进参数。这个参数<b>不是任何人调用时传的，是启动时配置文件喂的</b>。</li>
        <li><code>GoogleUser</code> 是一个 <code>record</code>（Java 的简写数据类）：一行声明字段，编译器自动给你构造方法和取值方法。像前端的只读对象 <code>{ sub, email, name, picture }</code>。</li>
        <li><code>verify(String idToken)</code>：验证通过返回 <code>GoogleUser</code>，<b>任何失败都返回 <code>null</code></b>（签名错、过期、受众不对、邮箱未验证），由调用的人判断。</li>
        <li><code>sub</code>：Google 给每个账号的永久唯一编号，比邮箱更稳定（邮箱可以改，sub 不会），所以我们用它判断"是不是同一个人"。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">JwtService</span><span class="one">签发和验证我们自己的 token</span></summary>
    <div class="body">
      <p><b>JWT 是什么</b>：一串带签名的字符串，由三段用点隔开：头、内容（这里存用户 id 和过期时间）、签名。内容谁都能解码看，所以<b>不要在里面放敏感信息</b>；但没有密钥就伪造不出正确的签名。后端只需要用密钥重算一遍签名，对得上就说明"这张通行证是我发的且没被改过"，不用查数据库。</p>
      <ul>
        <li>类上是 <code>@Service</code>，作用和 <code>@Component</code> 一样：让 Spring 启动时创建一个全程序共用的对象，只是名字表示"业务工具类"。所以对象里只放不变的东西，不放某个用户的数据。</li>
        <li>构造器 <code>JwtService(@Value("${app.jwt-secret}") String secret)</code>：参数由 Spring 启动时从配置读出来，用它造好 HS256 签名工具 <code>Algorithm.HMAC256(secret)</code>，存在 <code>algo</code> 字段里，之后每次签发和验证都复用。密钥至少 32 个字符，泄露了别人就能伪造任何用户的 token。</li>
        <li>有效期 7 天，写成常量 <code>EXPIRE_DAYS = 7</code>，以后只改这一处。</li>
        <li><code>create(long userId)</code>：签发。subject 放用户 id（转成字符串），再加发行时间和过期时间，最后 <code>sign</code> 生成 token。不放邮箱和姓名，因为 token 内容没有加密，谁都能解码读出来。</li>
        <li><code>verify(String token)</code>：重新用密钥算一遍签名对比，并检查有没有过期、格式对不对。通过就返回用户 id（<code>Long</code>），任何失败（捕获 <code>JWTVerificationException</code>）一律返回 <code>null</code>，调用方当作"未登录"。</li>
        <li>token 里的 subject 存的是<b>我们自己数据库里的用户 id</b>，不是 Google 的 sub。这样就算换掉 Google 登录，收藏表里的 <code>userId</code> 也不用动。</li>
      </ul>
      <p><b>为什么有了 Google token 还要自己发一张</b>：Google token 只有约一小时有效，且每次验证都要跨网络对照公钥。我们自己发的可以自己决定有效期，验证只是本地计算，快且不依赖 Google 在线。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">AppUser</span><span class="one">用户表对应的类</span></summary>
    <div class="body">
      <p>每一个带 <code>@Entity</code> 的类，就是数据库里的一张表，类的每个字段是表的一列，类的每个对象是表里的一行。启动时因为 <code>ddl-auto=update</code>，Hibernate 看到这个类，就自动建表。</p>
      <ul>
        <li><code>@Table(name = "app_user")</code>：表名叫 <code>app_user</code>，不叫 <code>user</code>，因为 <code>user</code> 是数据库的保留字，当表名会出错（上线用的 PostgreSQL 也一样）。</li>
        <li><code>@Entity</code>：这个类对应一张表。<code>@Id</code> + <code>@GeneratedValue(strategy = GenerationType.IDENTITY)</code>：<code>id</code> 是主键，由数据库自动递增分配，所以刚 new 出来时是 <code>null</code>，<code>save</code> 之后才有值。</li>
        <li><code>googleSub</code>：Google 给每个账号的永久唯一编号。<code>@Column(unique = true, nullable = false)</code>：数据库保证不能为空，也不会有两行一样的。</li>
        <li><code>email</code>、<code>name</code>、<code>picture</code>（头像地址）：只是资料，不当身份用，因为邮箱可能会变。</li>
        <li><code>createdAt</code>（<code>Instant</code>）：第一次登录的时间，在有参构造器里用 <code>Instant.now()</code> 自动记录。</li>
        <li><code>protected AppUser() {}</code>：空构造器，给 JPA 用。从数据库读数据时，JPA 要先 new 一个空对象，再把各列的值填进去，没有它就报错。<code>protected</code> 表示自己的代码不会随手调用它。</li>
        <li>有参构造器 <code>(googleSub, email, name, picture)</code>：给我们自己的代码创建新用户时用。</li>
        <li>只有 getter，没有 setter：用户创建之后，这些字段不允许被随便改。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">AppUserRepository</span><span class="one">查用户表的工具</span></summary>
    <div class="body">
<pre><code>public interface AppUserRepository extends JpaRepository&lt;AppUser, Long&gt; {
    Optional&lt;AppUser&gt; findByGoogleSub(String googleSub);
}</code></pre>
      <p><b>这是个接口，里面没有任何实现代码，却能用。</b>原理：</p>
      <ul>
        <li><code>extends JpaRepository&lt;AppUser, Long&gt;</code>：泛型里第一个是操作哪张表的类，第二个是主键的类型。继承后自动拥有 <code>save</code>（新增或更新）、<code>findById</code>、<code>findAll</code>、<code>delete</code> 等现成方法。</li>
        <li>启动时 Spring 看到这个接口，<b>自动在内存里生成一个实现类</b>并创建对象，谁需要就注入给谁。</li>
        <li><code>findByGoogleSub</code> <b>这个方法名就是查询说明书</b>：Spring 把名字拆开读，<code>findBy</code> = 查询，<code>GoogleSub</code> = 按 <code>googleSub</code> 这个字段匹配，自动生成 <code>select * from app_user where google_sub = ?</code>。字段名拼写必须和实体类一致，写错启动直接报错。</li>
        <li><code>Optional&lt;AppUser&gt;</code>：一个"可能有、可能没有"的盒子。查不到时不返回 <code>null</code>，而是返回一个空盒子，逼你处理"找不到"的情况（像前端的 <code>?.</code> 可选链）。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">AuthController</span><span class="one">登录接口 /auth/google 和 /me</span></summary>
    <div class="body">
      <ul>
        <li><code>@RestController</code>：类里的方法是接口，返回值直接转成 JSON 发给前端。</li>
        <li>类里面定义了三个 <code>record</code>（只装数据的小盒子）：<code>GoogleLoginRequest(String idToken)</code> 用来接前端发来的 <code>{"idToken":"..."}</code>；<code>UserView(id, email, name, picture)</code> 是返回给前端的用户信息，只挑前端需要的字段，<code>googleSub</code> 这类内部信息不给出去；<code>LoginResponse(token, user)</code> 是登录成功时的回复。</li>
        <li>构造器接收 <code>GoogleTokenVerifier</code>、<code>AppUserRepository</code>、<code>JwtService</code>，由 Spring 启动时自动传入（依赖注入），我们从来没写过 <code>new AuthController(...)</code>。</li>
        <li><b><code>POST /auth/google</code></b>（方法 <code>googleLogin</code>）：
          <ol>
            <li><code>verify(body.idToken())</code> 核对 Google 证明书，返回 <code>null</code> 就回 401 <code>{"error":"invalid_google_token"}</code>；</li>
            <li><code>findByGoogleSub(g.sub())</code> 找用户，<code>orElseGet</code> 里 <code>save(new AppUser(...))</code>：只有找不到才新建，这就是"注册和登录是同一个流程"；</li>
            <li><code>jwtService.create(user.getId())</code> 发 token，用的是我们的用户 id；</li>
            <li>回 200，内容是 <code>LoginResponse</code>。</li>
          </ol></li>
        <li><b><code>GET /me</code></b>（方法 <code>me</code>）：<b>这个接口不经过门卫</b>，因为 <code>WebAuthConfig</code> 只守 <code>/favorites</code>。它自己用 <code>@RequestHeader(value = "Authorization", required = false)</code> 读请求头：检查是不是以 <code>Bearer </code> 开头，截出 token，<code>jwtService.verify</code> 验证，再 <code>findById</code> 查人；任何一步失败都回 401 <code>{"error":"unauthorized"}</code>。<code>required = false</code> 是让没带这个头时给我们一个 <code>null</code> 自己处理，而不是 Spring 自动回 400，这样错误格式统一。前端刷新页面时用它恢复登录状态。</li>
        <li>两个私有工具方法：<code>toView(AppUser)</code> 把用户转成 <code>UserView</code>，<code>unauthorized()</code> 统一生成 401 回复，登录和 <code>/me</code> 共用，不重复写。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== 保护 ===== -->
<section id="guard">
  <h2>保护相关的文件</h2>
  <div class="paper b note">收藏接口每个都要知道"是谁在请求"。如果在每个接口里都写一遍"取 token、验证、解出 userId"，代码会重复且容易漏。所以在所有收藏接口前面统一站一个"门卫"，一次写完。前端类比：像 Vue Router 的 <code>beforeEach</code> 导航守卫，每次跳转前先过一道检查。</div>

  <details>
    <summary><span class="fn">AuthInterceptor</span><span class="one">门卫</span></summary>
    <div class="body">
      <p>每一个被守护的请求在进入 Controller 之前，先路过它。按顺序做：</p>
      <ol>
        <li>如果是 <code>OPTIONS</code> 预检请求，直接放行（预检不会带 token，拦了浏览器就永远发不出真正的请求）。</li>
        <li>从请求头取 <code>Authorization</code>，必须以 <code>Bearer </code> 开头，把后面的 token 切出来。</li>
        <li>交给 <code>JwtService.verify</code> 验证。失败（没头、格式不对、签名不对、过期）就直接返回 401，请求到此为止，Controller 根本不会被执行。</li>
        <li>成功就把 userId 放进这次请求的"便签"里：<code>request.setAttribute("userId", userId)</code>，然后返回 <code>true</code> 放行。</li>
      </ol>
      <ul>
        <li><code>implements HandlerInterceptor</code>：Spring 预留的拦截器接口，实现它并重写 <code>preHandle</code> 方法。</li>
        <li><code>preHandle(HttpServletRequest request, HttpServletResponse response, Object handler)</code>：<b>这三个参数都是 Spring 在每次请求到达时自动传进来的</b>。<code>request</code> 是这次请求的全部信息（头、方法、路径、便签），<code>response</code> 是你用来回复的对象，<code>handler</code> 是即将执行的 Controller 方法（我们没用到）。</li>
        <li>返回值：<code>true</code> = 放行；<code>false</code> = 拦住，到此结束。返回 <code>false</code> 之前先 <code>response.setStatus(401)</code> 把状态码设好并写出 <code>{"error":"unauthorized"}</code>。</li>
        <li><code>public static final String USER_ID = "userId"</code>：把便签的名字定义成<b>常量</b>，门卫和 Controller 两边引用同一个，避免一边写 <code>userId</code>、另一边写成 <code>userID</code>。<code>static</code> = 属于类不属于某个对象，<code>final</code> = 不能再改，相当前端的 <code>const</code>。</li>
        <li>它带 <code>@Component</code> 让 Spring 创建它，构造器里接收 <code>JwtService</code>（依赖注入），再由 <code>WebAuthConfig</code> 注册。</li>
      </ul>
      <p class="takeaway">安全设计核心：userId 只能来自验证过的 token，绝不从请求体或路径里取</p>
      <p>否则坐在前端的人把请求里的 userId 改成别人的，就能读写别人的收藏（这类漏洞叫 IDOR）。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">WebAuthConfig</span><span class="one">规定门卫守哪些网址</span></summary>
    <div class="body">
<pre><code>@Configuration
public class WebAuthConfig implements WebMvcConfigurer {
    private final AuthInterceptor authInterceptor;
    public WebAuthConfig(AuthInterceptor authInterceptor) {
        this.authInterceptor = authInterceptor;
    }
    @Override
    public void addInterceptors(InterceptorRegistry registry) {
        registry.addInterceptor(authInterceptor)
                .addPathPatterns("/favorites", "/favorites/**");
    }
}</code></pre>
      <ul>
        <li>一个拦截器写好了也不会自己生效，<b>必须在这里登记</b>，跟 <code>CorsConfig</code> 一样是实现 <code>WebMvcConfigurer</code> 插入规则。</li>
        <li>构造方法里的 <code>AuthInterceptor authInterceptor</code> 参数：Spring 启动时把那个已经创建好的门卫对象传进来（依赖注入）。<code>this.authInterceptor = authInterceptor</code> 把它保存到字段里，后面的方法才能用。</li>
        <li><code>addPathPatterns("/favorites", "/favorites/**")</code>：只守这两类路径。<code>/favorites</code> 是列表和新增，<code>/favorites/**</code> 是带 id 的删除、修改。<code>**</code> 表示任意多层。</li>
        <li><b>没列在里面的路径不会被保护</b>，比如 <code>/auth/google</code>（登录本身不能要求已登录）、早期练习的 <code>/hello</code>、<code>/wrong-items</code>。所以以后新写了需要登录的接口，必须回来这里加路径，忽略这一步会让接口裸奔。</li>
        <li><code>/me</code> 也不在门卫的守护范围内：它在 <code>AuthController</code> 里自己读 <code>Authorization</code> 头、自己验 token。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== 收藏 ===== -->
<section id="fav">
  <h2>收藏相关的文件</h2>
  <div class="paper g note">设计思路：后端只记"谁收藏了什么文字"，单词释义、例句这些详情数据仍然在前端，收藏本里用这段文字去匹配，不靠 ID。后端相当于一张"用户 × 文字"的清单。<br><code>kind</code> 只有两种：<code>w</code> 单词、<code>p</code> 短语，由前端判断：文字里没有空格是单词，有空格是短语。同一个人对同一个文字只能有一条收藏（后端去重），在哪个页面收藏的都算同一条。</div>

  <details>
    <summary><span class="fn">NewFavoriteWord</span><span class="one">前端发来的"新收藏"</span></summary>
    <div class="body">
<pre><code>public record NewFavoriteWord(String kind, String word, String status) {}</code></pre>
      <p>一个只用来接收数据的类（常说的 DTO），只是一个「形状」：告诉 Spring，前端发来的 JSON 里的字段 <code>kind</code>、<code>word</code>、<code>status</code> 要对应填进这三个位置。前端类比：TypeScript 里的 <code>interface NewFav { kind: string; word: string; status: string }</code>。</p>
      <p><b>为什么不直接用 <code>FavoriteWord</code> 来接收</b>：<code>FavoriteWord</code> 里有 <code>id</code> 和 <code>userId</code>，这两个必须由服务器决定，不能让前端传。用一个只包含"允许前端决定的字段"的类来接收，就从源头堵死了前端伪造 <code>userId</code> 的可能。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">FavoriteWord</span><span class="one">收藏表对应的类</span></summary>
    <div class="body">
      <p>和 <code>AppUser</code> 同理，是一个 <code>@Entity</code>，对应数据库表 <code>favorite_word</code>。</p>
      <div class="scroll"><table>
        <tr><th>字段</th><th>说明</th><th>谁填</th></tr>
        <tr><td><code>id</code></td><td>这条收藏记录的编号，主键，自动递增</td><td>数据库</td></tr>
        <tr><td><code>userId</code></td><td>这条收藏属于哪个用户</td><td>后端从 token 里取到后填</td></tr>
        <tr><td><code>kind</code></td><td><code>w</code> 或 <code>p</code></td><td>前端传、后端检查</td></tr>
        <tr><td><code>word</code></td><td>单词或短语的文字</td><td>前端传、后端去掉首尾空格</td></tr>
        <tr><td><code>status</code></td><td>掌握状态，默认 <code>unknown</code></td><td>前端传或默认</td></tr>
      </table></div>
      <ul>
        <li><b>没有 <code>userId</code> 的 getter</b>：Spring 转 JSON 靠 getter，没有 getter 就不会输出。所以前端拿到的收藏列表里只有 <code>id</code>、<code>kind</code>、<code>word</code>、<code>status</code>，用户编号不会露出去。</li>
        <li><b>只有 <code>word</code> 和 <code>status</code> 有 setter</b>：<code>id</code>、<code>userId</code>、<code>kind</code> 创建后不允许再改。只有该改的地方才给开口，这是一个很好的习惯。</li>
        <li>有参构造 <code>(Long userId, String kind, String word, String status)</code>，和一个给 JPA 用的空构造。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">FavoriteWordRepository</span><span class="one">查收藏表的工具</span></summary>
    <div class="body">
      <p>和 <code>AppUserRepository</code> 是同一套路，继承 <code>JpaRepository&lt;FavoriteWord, Long&gt;</code>，有三个我们自己设的查询方法，方法名就是查询条件：</p>
      <div class="scroll"><table>
        <tr><th>方法</th><th>最终的查询含义</th><th>用在哪</th></tr>
        <tr><td><code>findByUserId(Long userId)</code></td><td>找这个用户的所有收藏</td><td>列表</td></tr>
        <tr><td><code>findByIdAndUserId(Long id, Long userId)</code></td><td>找编号是 id 且属于这个用户的那一条</td><td>删除、修改</td></tr>
        <tr><td><code>findByUserIdAndKindAndWord(Long, String, String)</code></td><td>找这个用户、这种类型、这段文字的收藏</td><td>新增时检查是否重复</td></tr>
      </table></div>
      <p class="takeaway">findByIdAndUserId 是安全的关键</p>
      <p>如果只用 id 查，坐在前端的人把 id 改成别人的，就能删别人的收藏。"带上 userId 一起查"，查不到就是"不是你的"，干脆当作不存在处理。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">FavoriteWordController</span><span class="one">四个收藏接口</span></summary>
    <div class="body">
      <p>类上有 <code>@RestController</code> 和 <code>@RequestMapping("/favorites")</code>，后者的意思是这个类里的所有接口路径都以 <code>/favorites</code> 开头。构造方法里接收 <code>FavoriteWordRepository</code>，由 Spring 注入。</p>
      <div class="scroll"><table>
        <tr><th>请求</th><th>干什么</th><th>关键逻辑</th></tr>
        <tr><td><code>GET /favorites</code></td><td>查我的所有收藏</td><td><code>findByUserId(userId)</code></td></tr>
        <tr><td><code>POST /favorites</code></td><td>新增一条收藏</td><td>校验 <code>kind</code> 是 <code>w</code> 或 <code>p</code>、<code>word</code> 不能为空（不对就返回 400）；<code>word</code> 去掉首尾空格；<code>status</code> 为空就用 <code>unknown</code>；已经有同样的就直接返回那条，没有就 <code>save</code></td></tr>
        <tr><td><code>DELETE /favorites/{id}</code></td><td>取消收藏</td><td><code>findByIdAndUserId</code> 找到才删，找不到什么都不做</td></tr>
        <tr><td><code>PUT /favorites/{id}</code></td><td>修改我的某条收藏的 <code>word</code> 或 <code>status</code></td><td>同样先用 <code>findByIdAndUserId</code> 找，找不到返回 <code>null</code></td></tr>
      </table></div>
      <p><b>这几个方法里的参数都从哪来</b>（详细见"参数从哪来"）：</p>
      <ul>
        <li><code>@RequestAttribute(AuthInterceptor.USER_ID) Long userId</code>：门卫放进便签的那个 userId。</li>
        <li><code>@RequestBody NewFavoriteWord body</code>：前端发来的 JSON 请求体，按字段名对应填进 <code>NewFavoriteWord</code>。</li>
        <li><code>@PathVariable Long id</code>：路径 <code>/favorites/12</code> 里的那个 12。</li>
      </ul>
      <p><b>返回值</b>：直接返回对象或列表，Spring 自动转成 JSON，状态码 200。<code>ResponseEntity.badRequest().build()</code> 表示返回 400 且没有内容；<code>ResponseEntity</code> 是把"状态码 + 头 + 内容"打包在一起的返回类型，需要自己控制状态码时才用。</p>
      <p class="takeaway">点一下收藏：乐观更新 → POST（带 token）→ 门卫放行 → 校验去重 → 写表 → 返回带 id 的记录；失败就回滚界面</p>
    </div>
  </details>
</section>

<!-- ===== 参数从哪来 ===== -->
<section id="params">
  <h2>参数从哪来</h2>
  <div class="paper y note">这是初学后端最容易迷的点：方法的括号里写了一堆参数，却找不到谁在调用它。答案是：整个后端程序里，绝大部分方法都不是你的代码调用的，而是 Spring 在合适的时机调用的。Spring 看你参数前面的注解和类型，决定从哪里取值填进来。可以把 Controller 的方法想成前端的事件处理函数：浏览器调用 <code>onClick(event)</code>，你不会自己去调用它，<code>event</code> 也是浏览器填的。</div>

  <h3>总表：每一种参数的来源</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>你看到的写法</th><th>值从哪里来</th><th>什么时候填</th><th>用在哪些文件</th></tr>
    <tr><td><code>@RequestBody X body</code></td><td>前端发来的 HTTP 请求体（JSON），按字段名对应转成 X</td><td>每次请求到达时</td><td>AuthController、FavoriteWordController</td></tr>
    <tr><td><code>@PathVariable Long id</code></td><td>路径里 <code>{id}</code> 的那一段</td><td>每次请求到达时</td><td>FavoriteWordController</td></tr>
    <tr><td><code>@RequestAttribute("userId") Long userId</code></td><td>门卫验证 token 后放进这次请求便签的值</td><td>每次请求到达时，先经过门卫</td><td>FavoriteWordController</td></tr>
    <tr><td><code>@RequestHeader("Authorization") String authorization</code></td><td>请求头里 Authorization 那一行，没有就是 <code>null</code></td><td>每次请求到达时</td><td>AuthController 的 <code>/me</code></td></tr>
    <tr><td>构造方法的参数（如传进来的 <code>Repository</code>、<code>JwtService</code>）</td><td>Spring 创建的那个现成对象</td><td>程序启动时一次</td><td>几乎所有类</td></tr>
    <tr><td><code>@Value("${...}")</code> 的参数</td><td><code>application.properties</code> 里的配置值</td><td>程序启动时一次</td><td>GoogleTokenVerifier、JwtService</td></tr>
    <tr><td><code>HttpServletRequest request</code></td><td>这次请求的全部信息（头、方法、路径）</td><td>每次请求到达时</td><td>AuthInterceptor</td></tr>
    <tr><td><code>HttpServletResponse response</code></td><td>用来回复的对象，可以设置状态码</td><td>每次请求到达时</td><td>AuthInterceptor</td></tr>
    <tr><td><code>CorsRegistry registry</code>、<code>InterceptorRegistry registry</code></td><td>Spring 递给你的"登记表"</td><td>程序启动时一次</td><td>CorsConfig、WebAuthConfig</td></tr>
    <tr><td><code>String[] args</code>（main 方法）</td><td>命令行启动参数</td><td>程序启动时</td><td>IeltsBackendApplication</td></tr>
  </table></div></div>
  <p class="note">记住一个简化的规则：参数分两类。一类是"启动时填一次"（构造方法、<code>@Value</code>、登记表），另一类是"每次请求都重新填"（请求体、路径、便签、request/response）。</p>

  <h3>一次真实请求，参数是怎么被填上的</h3>
  <div class="paper">
    <p style="margin-top:0">以前端请求 <code>DELETE /favorites/12</code> 为例，请求头里带着 <code>Authorization: Bearer xxx</code>：</p>
    <ol>
      <li>浏览器先发 <code>OPTIONS</code> 预检，<code>CorsConfig</code> 的规则让 Spring 自动答"可以"。</li>
      <li>真正的 DELETE 到达。Spring 把这次请求封装成 <code>HttpServletRequest</code> 对象。</li>
      <li>路径 <code>/favorites/12</code> 匹配了 <code>WebAuthConfig</code> 里登记的 <code>/favorites/**</code>，所以先调 <code>AuthInterceptor.preHandle(request, response, handler)</code>。这三个参数都是 Spring 填的。</li>
      <li>门卫验证 token 通过，<code>request.setAttribute("userId", 5)</code>（假设用户编号是 5），返回 <code>true</code>。</li>
      <li>Spring 找到匹配 <code>DELETE /favorites/{id}</code> 的 Controller 方法。看到参数 <code>@PathVariable Long id</code>，去路径里取出 12 并转成 Long；看到 <code>@RequestAttribute("userId") Long userId</code>，去便签里取出 5。</li>
      <li>调用你的方法 <code>delete(12, 5)</code>。</li>
      <li>方法返回后，Spring 把返回值转成 HTTP 响应发回浏览器。</li>
    </ol>
  </div>

  <details>
    <summary><span class="fn">依赖注入</span><span class="one">为什么构造方法里有参数，却从没写过 new</span></summary>
    <div class="body">
<pre><code>public FavoriteWordController(FavoriteWordRepository repository) {
    this.repository = repository;
}</code></pre>
      <ul>
        <li>如果不用注入，你得自己写 <code>new FavoriteWordController(new FavoriteWordRepositoryImpl(...))</code>，每次改一处要改一堆。</li>
        <li>Spring 启动时扫描到所有 <code>@Component</code>、<code>@RestController</code>、<code>@Configuration</code> 等类，按依赖顺序一个个创建对象。看到构造方法需要 <code>FavoriteWordRepository</code>，就先创建那个对象，再传进来。</li>
        <li>每个类只创建一个对象（单例），整个程序共用。所以这些类里的字段不要存"某个用户的数据"，不然会串到别人请求上。每个用户的数据都放在方法的参数和局部变量里，每次请求各用各的。</li>
        <li>字段写成 <code>private final</code>：<code>final</code> 保证只在构造方法里赋值一次，之后不会被改掉。</li>
      </ul>
      <p>这就像 Vue 的 <code>provide / inject</code>，不自己去创建一个 store，而是让框架把现成的传进来。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">@Value 怎么读配置</span><span class="one">启动时从配置文件取值</span></summary>
    <div class="body">
<pre><code>public JwtService(@Value("${app.jwt-secret}") String secret) { ... }</code></pre>
      <ul>
        <li><code>${app.jwt-secret}</code> 是一个占位符，Spring 启动时去 <code>application.properties</code> 里找对应的 key，把值字符串填进 <code>secret</code>。</li>
        <li>key 拼错了，程序<b>启动就报错</b>，这比运行时才发现要好。</li>
        <li>配置值里的 <code>${APP_JWT_SECRET:默认值}</code> 是另一层：先找操作系统环境变量，没有就用默认值。</li>
      </ul>
    </div>
  </details>

  <div class="k">
    <div class="paper p"><b>不可信：来自前端</b><br><code>@RequestBody</code>、<code>@PathVariable</code> 任何人都能用 curl 构造，所以要校验（比如 <code>kind</code> 只能是 w/p）。</div>
    <div class="paper g"><b>可信：来自服务器内部</b><br><code>@RequestAttribute</code> 来自门卫。前端请求里即使写了同名字段，也进不了便签，因为便签只有服务器代码能写。</div>
  </div>
  <p class="note">所以身份信息（userId）永远用 @RequestAttribute，业务数据用 @RequestBody。方法 return 的值，不是给你自己的代码，是给 Spring：它用 Jackson 把对象转成 JSON 写进 HTTP 响应，字段要有 getter 才会输出（<code>record</code> 自带），没有就隐藏，这就是 <code>FavoriteWord</code> 里 <code>userId</code> 不会露出去的原因。</p>
</section>

<!-- ===== 注解词典 ===== -->
<section id="annot">
  <h2>注解小词典</h2>
  <div class="paper b note">注解（以 @ 开头）就是贴在类、方法、字段、参数上的标签，它自己不干活，是 Spring 启动时扫描到标签，再按标签的含义干活。类比前端：像 Vue 模板里的 <code>v-if</code>、<code>v-for</code>、<code>@click</code>，写下指令，框架负责执行。</div>

  <h3>贴在类上：你是谁</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>注解</th><th>意思</th><th>前端类比</th><th>用在</th></tr>
    <tr><td><code>@SpringBootApplication</code></td><td>程序入口类，打开自动配置和组件扫描</td><td><code>createApp(App)</code></td><td>IeltsBackendApplication</td></tr>
    <tr><td><code>@Configuration</code></td><td>这是一个配置类，启动时按它的规则设置</td><td><code>vite.config.js</code></td><td>CorsConfig、WebAuthConfig</td></tr>
    <tr><td><code>@Component</code></td><td>请 Spring 帮我创建并管理这个类的对象</td><td>注册全局组件</td><td>GoogleTokenVerifier、AuthInterceptor</td></tr>
    <tr><td><code>@Service</code></td><td>和 <code>@Component</code> 一样，只是名字表示"业务工具类"</td><td>同上</td><td>JwtService</td></tr>
    <tr><td><code>@RestController</code></td><td>这是接口类，返回值直接转 JSON</td><td>一组 API 路由处理函数</td><td>AuthController、FavoriteWordController</td></tr>
    <tr><td><code>@RequestMapping("/favorites")</code></td><td>这个类所有接口的路径前缀</td><td>路由的父路径</td><td>FavoriteWordController</td></tr>
    <tr><td><code>@Entity</code></td><td>这个类对应一张数据库表</td><td>表结构定义</td><td>AppUser、FavoriteWord</td></tr>
    <tr><td><code>@Table(name = "app_user")</code></td><td>指定表名（避开保留字 user）</td><td>给表起名</td><td>AppUser</td></tr>
  </table></div></div>

  <h3>贴在方法上：这个方法在什么时候执行</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>注解</th><th>意思</th><th>前端类比</th></tr>
    <tr><td><code>@GetMapping</code>、<code>@PostMapping</code>、<code>@PutMapping</code>、<code>@DeleteMapping</code></td><td>这个方法处理对应 HTTP 方法和路径的请求，括号里写路径</td><td><code>router.get('/path', handler)</code></td></tr>
    <tr><td><code>@Override</code></td><td>我在重写父类或接口里的方法，写错会编译报错</td><td>类型标注的保险</td></tr>
  </table></div></div>

  <h3>贴在参数上：这个值从哪来</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>注解</th><th>意思</th></tr>
    <tr><td><code>@RequestBody</code></td><td>从请求体 JSON 填进来</td></tr>
    <tr><td><code>@PathVariable</code></td><td>从路径的 <code>{id}</code> 那一段填进来</td></tr>
    <tr><td><code>@RequestAttribute</code></td><td>从服务器内部的便签里填进来</td></tr>
    <tr><td><code>@RequestHeader(value = "Authorization", required = false)</code></td><td>从请求头的某一行填进来，没有就给 <code>null</code></td></tr>
    <tr><td><code>@Value("${key}")</code></td><td>从配置文件或环境变量里填进来</td></tr>
  </table></div></div>

  <h3>贴在字段上：这一列怎么存</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>注解</th><th>意思</th></tr>
    <tr><td><code>@Id</code></td><td>主键，每行唯一</td></tr>
    <tr><td><code>@GeneratedValue(strategy = GenerationType.IDENTITY)</code></td><td>主键由数据库自动递增分配</td></tr>
    <tr><td><code>@Column(unique = true, nullable = false)</code></td><td>这列不能为空，值不能重复</td></tr>
  </table></div></div>

  <h3>不是注解，但容易混的词</h3>
  <div class="paper">
    <ul style="margin:0;padding-left:1.3em">
      <li><code>record</code>：Java 的简写数据类。一行声明字段，编译器自动给你构造方法、取值方法、<code>equals</code>、<code>toString</code>。字段创建后不能改。</li>
      <li><code>interface</code>：只规定"有哪些方法"，不写具体实现。<code>JpaRepository</code> 就是这样的接口，实现由 Spring 自动生成。</li>
      <li><code>extends</code> / <code>implements</code>：继承某个父类 / 实现某个接口。<code>implements WebMvcConfigurer</code> = "我要按这个接口规定的方法写"。</li>
      <li><code>private final</code>：<code>private</code> 只有本类能访问，<code>final</code> 赋值后不能再改，常用来存注入进来的依赖。</li>
      <li><code>static</code>：属于类本身，不属于某个对象，调用时不需要 new。</li>
      <li><code>Optional&lt;T&gt;</code>：可能有、可能没有的盒子，用 <code>ifPresent</code>、<code>isPresent</code>、<code>orElse</code> 等处理。</li>
      <li>泛型 <code>&lt;AppUser, Long&gt;</code>：尖括号里的类型参数，相当于 TypeScript 的 <code>Array&lt;string&gt;</code>。</li>
    </ul>
    <p class="takeaway">遇到不认识的 @xxx，只问三件事</p>
    <p style="margin-bottom:0">它贴在什么位置？是谁（Spring 还是数据库框架）在读它？它让框架最终做了什么动作？</p>
  </div>
</section>

<!-- ===== 后端是什么 ===== -->
<section id="what">
  <h2>先搞懂：后端到底是什么</h2>
  <div class="paper y note">把整个网站想成一家餐厅。<b>前端</b>是大堂和菜单，客人在这里点菜；<b>后端</b>是厨房，收到点菜单就做菜；<b>数据库</b>是仓库，存着所有食材。客人不能直接进仓库，只能通过厨房拿。后端就是这个"厨房"：一个<b>一直开着的程序</b>，不画界面，只做三件事：<b>收请求 → 处理 → 回响应</b>。</div>

  <h3>一次完整的往返</h3>
  <div class="paper">
    <p style="margin-top:0">你在页面上点一下书签，前端大概执行了这样一段（你前端里的 <code>authFetch</code> 就在干这件事）：</p>
<pre><code>fetch('http://localhost:8080/favorites', {
  method: 'POST',
  headers: { 'Authorization': 'Bearer eyJhbGciOi...', 'Content-Type': 'application/json' },
  body: JSON.stringify({ kind: 'w', word: 'mitigate' })
})</code></pre>
    <p>浏览器把它变成一段<b>纯文字</b>，通过网络发到 8080 端口。这段文字就是 HTTP 请求：</p>
<pre><code>POST /favorites HTTP/1.1                      ← 第一行：方法 + 路径
Host: localhost:8080                          ← 头（Header）：对这次请求的附加说明，一行一个
Authorization: Bearer eyJhbGciOi...           ← 头：出示通行证
Content-Type: application/json                ← 头：告诉后端正文是 JSON
                                              ← 空一行，下面是正文
{"kind":"w","word":"mitigate"}                ← 体（Body）：真正要交给后端的数据</code></pre>
    <p>后端处理完，同样回一段文字，就是 HTTP 响应：</p>
<pre><code>HTTP/1.1 200                                  ← 状态码：200 = 成功
Content-Type: application/json

{"id":4,"kind":"w","word":"mitigate","status":"unknown"}   ← 体：后端返回的数据</code></pre>
    <p>注意响应里没有 <code>userId</code>，因为 <code>FavoriteWord</code> 没写它的 getter，这是故意的。</p>
    <p><b>所以一次请求就是四样东西</b>：<b>方法</b>（想干什么）、<b>路径</b>（对哪个资源）、<b>头</b>（附加说明）、<b>体</b>（数据）。响应是：<b>状态码</b>（结果怎么样）、<b>头</b>、<b>体</b>。你写的每个 Controller 方法，就是在回答"收到这样的请求，该回什么响应"。</p>
  </div>

  <details open>
    <summary><span class="fn">方法：GET / POST / PUT / DELETE / OPTIONS</span><span class="one">"动词"，说明想干什么</span></summary>
    <div class="body">
      <div class="scroll"><table>
        <tr><th>方法</th><th>约定的含义</th><th>你项目里</th></tr>
        <tr><td><code>GET</code></td><td>读取，不改任何数据</td><td><code>GET /favorites</code> 查我的收藏；<code>GET /me</code> 我是谁</td></tr>
        <tr><td><code>POST</code></td><td>新建，或提交数据</td><td><code>POST /favorites</code> 新增收藏；<code>POST /auth/google</code> 登录</td></tr>
        <tr><td><code>PUT</code></td><td>修改已有的</td><td><code>PUT /favorites/3</code> 修改第 3 条</td></tr>
        <tr><td><code>DELETE</code></td><td>删除</td><td><code>DELETE /favorites/3</code> 取消收藏</td></tr>
        <tr><td><code>OPTIONS</code></td><td>浏览器自己发的"预检"，问后端允不允许跨域</td><td>你不会手写它，<code>CorsConfig</code> 自动回答</td></tr>
      </table></div>
      <p>这是约定，不是强制，但大家都遵守，所以一看"方法 + 路径"就能猜出接口在干什么：<code>DELETE /favorites/3</code> = 删除收藏 3。</p>
    </div>
  </details>

  <details open>
    <summary><span class="fn">状态码</span><span class="one">响应第一行的数字，告诉前端结果怎么样</span></summary>
    <div class="body">
      <div class="scroll"><table>
        <tr><th>数字</th><th>名字</th><th>意思</th><th>你项目里什么时候出现</th></tr>
        <tr><td>200</td><td>OK</td><td>成功</td><td>正常返回</td></tr>
        <tr><td>400</td><td>Bad Request</td><td>你发来的请求有问题</td><td><code>kind</code> 不是 w/p，或 <code>word</code> 为空</td></tr>
        <tr><td>401</td><td>Unauthorized</td><td>没通过身份验证</td><td>没带 token、token 过期或是假的</td></tr>
        <tr><td>404</td><td>Not Found</td><td>没有这个路径</td><td>路径拼错</td></tr>
        <tr><td>405</td><td>Method Not Allowed</td><td>路径对，方法不对</td><td>该 POST 的发了 GET</td></tr>
        <tr><td>500</td><td>Internal Server Error</td><td>后端代码自己出错了</td><td>空指针等异常，看后端控制台</td></tr>
      </table></div>
      <p>规律：<b>2xx 成功，4xx 是调用方（前端）的问题，5xx 是后端自己的问题</b>。排查时先看第一位数字，就知道该查前端还是后端。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">JSON 和 Java 对象怎么互相转</span><span class="one">Jackson 在中间翻译</span></summary>
    <div class="body">
      <p>网络上传的只能是文字，所以数据都写成 JSON 文字。前端用 <code>JSON.stringify</code> / <code>JSON.parse</code> 转换，后端有个叫 <b>Jackson</b> 的库自动转换，你不用写。</p>
      <div class="two">
        <div><p style="margin-top:0"><b>请求体 JSON</b></p><pre><code>{"idToken":"eyJ..."}</code></pre></div>
        <div><p style="margin-top:0"><b>对应的 Java</b></p><pre><code>record GoogleLoginRequest(String idToken) {}</code></pre></div>
      </div>
      <ul>
        <li><b>按字段名对应</b>：JSON 里的 <code>idToken</code> 被填进 record 里同名的字段。</li>
        <li>JSON 里多出来的字段（比如有人乱传 <code>userId</code>）因为 record 里没有，会被直接丢掉。<b>这就是为什么要专门定义 <code>NewFavoriteWord</code></b>：它只有三个字段，前端想传别的也进不来。</li>
        <li>反方向：Controller 返回一个对象，Jackson 找它的 getter（record 是自带的取值方法），把字段写成 JSON。<b>没有 getter 的字段就不会出现在 JSON 里</b>。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">"无状态"：为什么每次都要带 token</span><span class="one">后端不记得你是谁</span></summary>
    <div class="body">
      <ul>
        <li>后端不会"记住"上一次是谁来过。每个请求对它来说都是陌生人，所以<b>每次都要出示通行证</b>。就像进电影院，每次进场都要出示票，门口的人不会靠认脸。</li>
        <li><code>Bearer</code> 是"持票人"的意思：谁拿着这张票，谁就被当作这个人。所以 token 一旦泄露，别人就能冒充你，这也是为什么要设 7 天过期，并且线上必须用 HTTPS。</li>
        <li>前端把 token 存在 <code>localStorage</code>，是因为页面刷新后 JS 变量会丢，而 <code>localStorage</code> 会保留。</li>
        <li>这种"服务器不存登录状态，靠每次带票"的设计，叫<b>无状态</b>。好处是服务器可以随便重启、可以同时开多台，用户都不会掉线。</li>
      </ul>
    </div>
  </details>

  <h3>你这个后端现在提供的全部接口</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>请求</th><th>要不要登录</th><th>谁负责检查</th><th>干什么</th></tr>
    <tr><td><code>POST /auth/google</code></td><td>不要</td><td>—（登录本身）</td><td>交 Google 证明书，换我们的 token</td></tr>
    <tr><td><code>GET /me</code></td><td>要</td><td>AuthController 自己验</td><td>返回当前用户信息</td></tr>
    <tr><td><code>GET /favorites</code></td><td>要</td><td>门卫 AuthInterceptor</td><td>列出我的收藏</td></tr>
    <tr><td><code>POST /favorites</code></td><td>要</td><td>门卫</td><td>新增收藏</td></tr>
    <tr><td><code>PUT /favorites/{id}</code></td><td>要</td><td>门卫</td><td>修改收藏</td></tr>
    <tr><td><code>DELETE /favorites/{id}</code></td><td>要</td><td>门卫</td><td>取消收藏</td></tr>
    <tr><td><code>GET /hello</code>、<code>/wrong-items</code></td><td>不要</td><td>无</td><td>早期练习，上线前删除</td></tr>
    <tr><td><code>/h2-console</code></td><td>不要</td><td>无</td><td>开发用的数据库网页，上线前关闭</td></tr>

│   ├── main/
