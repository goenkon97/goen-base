v class="r"><h4>Serverless（我们的 Vercel）</h4><ul><li>有请求来才启动，没人用就休眠</li><li><b>内存不可靠</b>：下次请求可能是另一个实例，状态必须存数据库</li><li>按调用量计费，小站几乎免费</li><li>第一次请求有“冷启动”延迟</li></ul></div></div><ul><li>因此 serverless 里不要把重要数据放在变量里等下次用，<b>一切持久状态都放数据库</b>。</li><li><b>无状态</b>：每个请求自带所有需要的信息（token），后端不靠“记得你”。</li><li>数据库连接也要小心：每个实例都开连接，会把数据库的连接数用光，所以要用 Neon 的连接池（pooler 地址）。</li></ul><p class="one">serverless = 用完即走的函数；状态在数据库，不在内存。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">4</span>设计一个接口：从名字开始</h3><div class="scroll"><table class="tb"><tr><th>要做什么</th><th>方法 + 路径</th><th>成功返回</th></tr><tr><td>看我的全部收藏</td><td><code>GET /favorites</code></td><td>200 + 数组</td></tr><tr><td>加一条</td><td><code>POST /favorites</code></td><td>201 + 新记录 id</td></tr><tr><td>删一条</td><td><code>DELETE /favorites/:id</code></td><td>200 / 204</td></tr><tr><td>我是谁</td><td><code>GET /me</code></td><td>200 + 用户信息</td></tr><tr><td>用 Google 登录</td><td><code>POST /auth/google</code></td><td>200 + token</td></tr><tr><td>后端醒着吗</td><td><code>GET /health</code></td><td>200 {ok:true}</td></tr></table></div><ul><li><b>路径用名词复数，动作交给方法</b>：不要写 <code>/addFavorite</code>、<code>/deleteFavorite</code>。</li><li><b>错误也要规整</b>：{ error: "原因" } + 合适的状态码，前端才好统一处理。</li><li><b>分页</b>：数据多了不能一次全返回。offset 分页（<code>?page=2&amp;size=10</code>）简单；游标分页（“从这个 id 之后的 10 条”）更稳。我们的收藏现在是全部取回、前端分页，量大了再改后端分页。</li></ul><p class="one">接口 = 后端对外的一份“使用说明书”，名字和格式要一致。</p></section><section class="card"><h3><span class="n">5</span>日志：线上出问题怎么知道</h3><pre class="term"><span class="c"># 本地：直接看终端输出</span>
<span class="k">npm run dev</span>
[GET] /favorites 200 12ms
[POST] /favorites <span class="e">500</span>  Error: duplicate key ...

<span class="c"># 线上：Vercel 项目 → Logs，能看到每次请求和 console.log</span>
<span class="c"># 别把密码、token 打进日志</span></pre><ul><li><b>500 的原因只在后端日志里</b>，浏览器只会告诉你“500”。排查后端问题的第一步永远是看日志。</li><li><code>console.log</code> 在 serverless 里会进 Vercel Logs；写清楚是哪个接口、什么参数、什么错误。</li><li>日志里<b>不能出现</b>密码、token、完整连接串。</li></ul><p class="one">后端报错看日志，前端报错看 Console。</p></section><section class="card"><h3><span class="n">6</span>后端要“防着”的几件事</h3><div class="scroll"><table class="tb"><tr><th>情况</th><th>做法</th></tr><tr><td>前端传来乱七八糟的数据</td><td>白名单校验类型、长度，不合格返回 400</td></tr><tr><td>重复提交（连点两下）</td><td>数据库唯一约束 + 前端防连点</td></tr><tr><td>别人乱调接口</td><td>验 token、<code>WHERE user_id=?</code></td></tr><tr><td>被刷（海量请求）</td><td>限流（如每分钟 N 次）</td></tr><tr><td>数据库暂时连不上</td><td>捕获错误，返回 503，别崩</td></tr></table></div><ul><li><b>永远不要相信前端</b>。前端的校验只是为了体验，真正的校验必须在后端。</li></ul><p class="one">后端 = 最后一道防线。</p></section></div></section><section class="panel" id="p-db" aria-label="数据库"><h2>数据库</h2><p class="sec">表、SQL、JOIN、事务、迁移、连接池和备份。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>表 = 一张 Excel，几个关键词</h3><div class="scroll"><table class="tb"><tr><th>id</th><th>user_id</th><th>site</th><th>kind</th><th>word</th></tr><tr><td>41</td><td>1</td><td>ielts</td><td>w</td><td>accommodation</td></tr><tr><td>42</td><td>1</td><td>ielts</td><td>p</td><td>on the other hand</td></tr><tr><td>57</td><td>1</td><td>jlpt</td><td>g</td><td>〜に違いない</td></tr><tr><td>58</td><td>2</td><td>jlpt</td><td>w</td><td>慰める</td></tr></table></div><ul><li><b>表</b>=一类东西；<b>行</b>=一条记录；<b>列</b>=一个属性。</li><li><b>主键</b>（id）：每行独一无二的编号，能精确找到某一行。</li><li><b>外键</b>：user_id 指向用户表里的人，说明“这条属于谁”，数据库会检查这个人必须存在。</li><li><b>唯一约束</b>：(user_id, site, kind, word) 不能重复，所以重复收藏会被数据库本身拒绝，哪怕后端代码漏了检查。</li><li><b>索引</b>：像书的目录，查得更快；代价是写入略慢、占空间。常用的查询条件列要建索引。</li></ul><p class="one">数据库帮你守住规则，是最后一道防线。</p></section><section class="card"><h3><span class="n">2</span>SQL 增删改查（对应 HTTP 四个方法）</h3><pre class="term"><span class="c">-- 查</span>
<span class="k">SELECT</span> id, word <span class="k">FROM</span> favorite_word
  <span class="k">WHERE</span> user_id = 1 <span class="k">AND</span> site = 'ielts'
  <span class="k">ORDER BY</span> id <span class="k">DESC</span> <span class="k">LIMIT</span> 10 <span class="k">OFFSET</span> 0;   <span class="c">-- 分页：每页 10 条</span>

<span class="c">-- 增</span>
<span class="k">INSERT INTO</span> favorite_word (user_id, site, kind, word)
  <span class="k">VALUES</span> (1, 'ielts', 'w', 'accommodation');

<span class="c">-- 改</span>
<span class="k">UPDATE</span> favorite_word <span class="k">SET</span> kind = 'p' <span class="k">WHERE</span> id = 42;

<span class="c">-- 删</span>
<span class="k">DELETE FROM</span> favorite_word <span class="k">WHERE</span> id = 42;</pre><ul><li><b class='no'>UPDATE 和 DELETE 忘了 WHERE，会改/删整张表。</b>习惯：先写 SELECT 看会命中哪些行，没问题再改成 UPDATE。</li><li>字符串用<b>单引号</b>，关键字大小写不敏感，每条语句以分号结束。</li><li><code>COUNT(*)</code>、<code>GROUP BY</code> 用来统计，如“每种类型收藏了多少”。</li></ul><p class="one">增删改查 + WHERE，覆盖 80% 的日常。</p></section><section class="card"><h3><span class="n">3</span>JOIN：把两张表按关系拼起来</h3><svg viewBox="0 0 520 150" role="img" aria-label="JOIN"><g class="wob"><rect class="s fb" x="10" y="14" width="200" height="100" rx="9"/><rect class="s fg" x="310" y="14" width="200" height="100" rx="9"/><path class="s" d="M212 64 L308 64" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="110" y="36" text-anchor="middle" class="zh" style="font-size:13.0px">users</text><text x="110" y="56" text-anchor="middle" class="zh" style="font-size:11.0px">id | name | email</text><text x="110" y="74" text-anchor="middle" class="zh" style="font-size:11.0px">7  | Goen | g@x.com</text><text x="110" y="94" text-anchor="middle" class="cap" style="font-size:10.5px">主键 id</text><text x="410" y="36" text-anchor="middle" class="zh" style="font-size:13.0px">favorite_word</text><text x="410" y="56" text-anchor="middle" class="zh" style="font-size:11.0px">id | user_id | word</text><text x="410" y="74" text-anchor="middle" class="zh" style="font-size:11.0px">42 | 7 | accommodation</text><text x="410" y="94" text-anchor="middle" class="cap" style="font-size:10.5px">user_id 指向 users.id（外键）</text><text x="260" y="58" text-anchor="middle" class="zh" style="font-size:11.0px">对上</text><text x="10" y="138" class="cap">SELECT u.name, f.word FROM favorite_word f JOIN users u ON f.user_id = u.id;</text></svg><ul><li>数据<b>拆开存</b>（用户一张表、收藏一张表），用 id 关联；要一起看时用 JOIN 临时拼起来。</li><li>好处：改名字只改一处；不会在每条收藏里重复存用户的所有信息。</li><li>Drizzle 里也有对应的 join 写法。</li></ul><p class="one">拆表存，需要时 JOIN。</p></section></div><div class="grid"><section class="card"><h3><span class="n">4</span>事务：要么全成，要么全不成</h3><svg viewBox="0 0 640 344" role="img" aria-label="时序图：后端 / 数据库"><g class="wob"><rect class="s fg" x="16.0" y="12" width="298.0" height="40" rx="9"/><path d="M165.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="326.0" y="12" width="298.0" height="40" rx="9"/><path d="M475.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M168.0 86.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 136.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 186.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 286.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="165.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">后端</text><text x="475.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="320.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 BEGIN（开始一个事务）</text><text x="320.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 A 账户 −100</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 B 账户 +100</text><rect class="s fy" x="358.6" y="218.0" width="232.8" height="30" rx="7" style="stroke-width:1.8"/><text x="475.0" y="238" text-anchor="middle" class="zh" style="font-size:11.5px">任何一步失败 → 整个回滚，什么都没发生</text><text x="320.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 COMMIT（全部生效）</text></svg><ul><li>事务保证一组操作<b>不可分割</b>：转账扣了钱必须加上，不能只做一半。</li><li><b>ACID</b>：原子（全成或全不成）、一致（规则不被破坏）、隔离（同时进行的事务互不干扰）、持久（提交后断电也在）。</li><li>我们现在的操作都是单条语句，数据库自动当一个小事务；以后一次要改多张表时就需要显式事务。</li></ul><p class="one">多步操作要么都做，要么都不做。</p></section><section class="card"><h3><span class="n">5</span>迁移 migration：怎么改表结构</h3><svg viewBox="0 0 480 136" role="img" aria-label="改 schema → 生成迁移 → 应用到库 → 提交代码"><g class="wob"><rect class="s fb" x="10.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M112.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="130.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="250.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M352.0 55 h14" marker-end="url(#ah)"/><rect class="s fp" x="370.0" y="20" width="100.0" height="70" rx="9"/></g><g><text x="60.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">改 schema</text><text x="60.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">在代码里加一列</text></g><g><text x="180.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">生成迁移</text><text x="180.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">drizzle-kit</text></g><g><text x="300.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">应用到库</text><text x="300.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">ALTER TABLE</text></g><g><text x="420.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">提交代码</text><text x="420.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">记录变更历史</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L462,108"/></circle><text x="10" y="128" class="cap">表结构的改动也像代码一样有版本</text></svg><ul><li>线上库里已有真实数据，改表不能“删了重建”，要用 <code>ALTER TABLE</code> 一步步改。迁移文件就是这些步骤的记录。</li><li><b>先备份，再迁移；先在测试库跑，再上正式库</b>。</li><li>给已有表加新列，最好给默认值或允许为空，否则旧数据会不合规。</li></ul><p class="one">改结构要留记录，才能在任何环境里重放。</p></section><section class="card"><h3><span class="n">6</span>SQL 与 NoSQL</h3><div class="scroll"><table class="tb"><tr><th></th><th>SQL（PostgreSQL）</th><th>NoSQL（如 MongoDB）</th></tr><tr><td>结构</td><td>表 + 固定的列</td><td>文档（类似 JSON），灵活</td></tr><tr><td>关系</td><td>外键、JOIN 很强</td><td>关系弱，常把数据嵌在一起</td></tr><tr><td>一致性</td><td>事务强</td><td>按产品而定</td></tr><tr><td>适合</td><td>大多数业务：用户、订单、收藏</td><td>结构多变、海量写入</td></tr></table></div><ul><li>入门阶段选 SQL：规则明确，面试也最常问。</li></ul><p class="one">没有“更先进”，只有“更合适”。</p></section><section class="card"><h3><span class="n">7</span>连接串、连接池、备份</h3><pre class="term">DATABASE_URL=<span class="b">postgresql://用户:密码@主机/库?sslmode=require</span>

<span class="b">连接池 pooler</span>：数据库同时能接的连接数有限。
serverless 每个实例都开连接会爆，
所以用带 <span class="k">-pooler</span> 的地址，由池子复用连接。

<span class="b">备份</span>：Neon 支持分支和时间点恢复，
改线上数据前先建一个分支当备份。</pre><ul><li>连接串等同数据库钥匙：只放环境变量；泄露了立刻去 Neon 重置密码。</li><li><b>线上改数据前三步</b>：SELECT 看命中几行 → 确认 WHERE → 再 UPDATE；动作大就先备份。</li></ul><p class="one">先读后写，先小后大。</p></section></div></section><section class="panel" id="p-git" aria-label="Git 与 GitHub"><h2>Git 与 GitHub</h2><p class="sec">三个区域、分支合并、常用命令和撤销，以及“提交”到底提交了什么。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>三个区域：改动怎么变成历史</h3><svg viewBox="0 0 520 134" role="img" aria-label="git 三区"><g class="wob"><rect class="s fb" x="10" y="20" width="140" height="80" rx="10"/><rect class="s fy" x="190" y="20" width="140" height="80" rx="10"/><rect class="s fg" x="370" y="20" width="140" height="80" rx="10"/><path class="s" d="M152 50 L188 50" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M332 50 L368 50" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M368 82 L332 82" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M188 82 L152 82" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="80" y="48" text-anchor="middle" class="zh" style="font-size:13.5px">工作区</text><text x="80" y="66" text-anchor="middle" class="zh" style="font-size:10.5px">你在改的文件</text><text x="260" y="48" text-anchor="middle" class="zh" style="font-size:13.5px">暂存区</text><text x="260" y="66" text-anchor="middle" class="zh" style="font-size:10.5px">准备提交的</text><text x="440" y="48" text-anchor="middle" class="zh" style="font-size:13.5px">本地仓库</text><text x="440" y="66" text-anchor="middle" class="zh" style="font-size:10.5px">历史版本</text><text x="170" y="40" text-anchor="middle" class="zh" style="font-size:11.5px">git add</text><text x="350" y="40" text-anchor="middle" class="zh" style="font-size:11.5px">git commit</text><text x="10" y="124" class="cap">再往右：git push → GitHub（远程仓库）；git pull / clone ← 从 GitHub 取回</text></svg><ul><li><b>add</b>：挑出这次想提交的改动放进暂存区；<b>commit</b>：把暂存区存成一个带说明的版本，永久记录。</li><li><b>push</b> 把本地的版本发到 GitHub；<b>pull</b> 把 GitHub 上别人（或你另一台电脑）的新版本取下来。</li><li>提交说明写“做了什么、为什么”：<code>收藏页加分页</code> 比 <code>update</code> 有用得多。</li><li>VS Code 显示“有更改要提交”，意思就是：工作区里有改动还没 commit。</li></ul><p class="one">改 → add → commit → push，四步把代码送上线。</p></section><section class="card"><h3><span class="n">2</span>分支与合并：并行开发不打架</h3><svg viewBox="0 0 520 134" role="img" aria-label="分支合并"><path class="s" d="M20 90 H500" stroke-width="3"/><path class="s" d="M140 90 Q160 40 190 40 H320 Q350 40 370 90" fill="none" stroke-width="3"/><g class="wob"><circle class="s fb" cx="30" cy="90" r="9"/><circle class="s fb" cx="110" cy="90" r="9"/><circle class="s fy" cx="200" cy="40" r="9"/><circle class="s fy" cx="270" cy="40" r="9"/><circle class="s fy" cx="330" cy="40" r="9"/><circle class="s fb" cx="200" cy="90" r="9"/><circle class="s fg" cx="400" cy="90" r="11"/><circle class="s fb" cx="480" cy="90" r="9"/></g><text x="20" y="120" text-anchor="start" class="zh" style="font-size:12.0px">main</text><text x="200" y="20" text-anchor="middle" class="zh" style="font-size:12.0px">feature/分页（新分支）</text><text x="400" y="120" text-anchor="middle" class="zh" style="font-size:11.5px">merge 合并</text><text x="250" y="118" text-anchor="middle" class="cap" style="font-size:10.5px">main 继续前进</text></svg><ul><li><b>分支</b>是一条独立的开发线：在上面随便试，不影响 <code>main</code>。做好了再<b>合并</b>回来。</li><li><b>Vercel 通常盯着 main</b>：推到 main 就上线；推到别的分支，会得到一个预览网址，可以先看效果。</li><li><b>合并冲突</b>：两条线改了同一处，Git 不知道留谁，会在文件里标出 <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> 让你手动选，改完再提交。</li><li><b>Pull Request</b>：在 GitHub 上申请“把这个分支合进 main”，别人（或自己）可以先看改动再合并。</li></ul><p class="one">分支 = 平行世界，合并 = 把好结果带回主线。</p></section><section class="card"><h3><span class="n">3</span>常用命令一览</h3><pre class="term"><span class="k">git status</span>                 <span class="c">现在什么状态</span>
<span class="k">git diff</span>                   <span class="c">具体改了什么</span>
<span class="k">git add -A</span>                 <span class="c">全部放进暂存区</span>
<span class="k">git commit -m "说明"</span>       <span class="c">存成一个版本</span>
<span class="k">git push</span>                   <span class="c">推到 GitHub</span>
<span class="k">git pull</span>                   <span class="c">取回远程的新版本</span>
<span class="k">git log --oneline</span>          <span class="c">看历史</span>
<span class="k">git switch -c 新分支</span>        <span class="c">新建并切换分支</span>
<span class="k">git restore 文件</span>           <span class="c">丢掉某个文件的未提交改动</span>
<span class="k">git revert 版本号</span>          <span class="c">用一个新提交撤销旧提交（安全）</span></pre><ul><li><b>撤销要小心</b>：<code>git restore</code> 丢掉未提交的改动，丢了就找不回；<code>git reset --hard</code> 同样危险。<b>已推送的提交用 revert，别用 reset 改历史</b>。</li><li><code>.gitignore</code> 列出不要提交的东西：<code>node_modules</code>、<code>.env</code>、系统垃圾文件。</li><li><b>提交了密钥怎么办</b>：先去服务商那里换新密钥；删除提交记录不够，因为别人可能已经拿到。</li></ul><p class="one">先 status 看清楚，再动手。</p></section></div></section><section class="panel" id="p-frontend" aria-label="前端工程"><h2>前端工程</h2><p class="sec">Vue 怎么让页面跟着数据变、组件怎么分工、代码怎么从源码变成线上文件。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>Vue 的响应式：数据变，页面自动变</h3><svg viewBox="0 0 680 294" role="img" aria-label="时序图：你的代码 / Vue 响应式 / 渲染 / 页面"><g class="wob"><rect class="s fb" x="16.0" y="12" width="153.0" height="40" rx="9"/><path d="M92.5 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="181.0" y="12" width="153.0" height="40" rx="9"/><path d="M257.5 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="346.0" y="12" width="153.0" height="40" rx="9"/><path d="M422.5 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="511.0" y="12" width="153.0" height="40" rx="9"/><path d="M587.5 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M95.5 86.0 H252.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M260.5 186.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M425.5 236.0 H582.5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="92.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你的代码</text><text x="92.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">favs.value = [...]</text><text x="257.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Vue 响应式</text><text x="257.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">Proxy 监听</text><text x="422.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">渲染</text><text x="422.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">虚拟 DOM 对比</text><text x="587.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">页面</text><text x="587.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">真实 DOM</text><text x="175.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 给 ref 赋新值</text><rect class="s fy" x="179.5" y="118.0" width="156.0" height="30" rx="7" style="stroke-width:1.8"/><text x="257.5" y="138" text-anchor="middle" class="zh" style="font-size:11.5px">发现：用到它的地方要更新</text><text x="340.0" y="178" text-anchor="middle" class="zh" style="font-size:9.5px">3 重新执行模板，生成新的虚拟 DOM</text><text x="505.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 对比新旧，只改变化的几处</text><text x="505.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">高效：不整页重画</text></svg><ul><li><code>ref()</code> / <code>reactive()</code> 包装的数据，被读取时 Vue 记下“谁在用我”；被修改时通知这些使用者重新计算。</li><li><code>computed</code> 是<b>由别的数据算出来的数据</b>，依赖不变就用缓存。收藏页的 <code>pagedFav</code> 就是 <code>favList</code> 切一页出来。</li><li><code>watch</code> 在某个数据变化时做一件事（比如换了标签就回第一页）。</li><li><b>数据驱动</b>：你只管改数据，页面自己跟着变，不用手动操作 DOM。</li></ul><p class="one">你改数据，Vue 改页面。</p></section><section class="card"><h3><span class="n">2</span>组件通信：props 往下，事件往上</h3><svg viewBox="0 0 520 150" role="img" aria-label="props emit"><g class="wob"><rect class="s fb" x="150" y="12" width="220" height="40" rx="9"/><rect class="s fg" x="150" y="100" width="220" height="40" rx="9"/><path class="s" d="M230 54 L230 98" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M290 98 L290 54" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="260" y="38" text-anchor="middle" class="zh" style="font-size:12.5px">父组件（拥有数据）</text><text x="260" y="126" text-anchor="middle" class="zh" style="font-size:12.5px">子组件（只负责显示）</text><text x="176" y="80" text-anchor="end" class="zh" style="font-size:11.0px">props 传数据</text><text x="304" y="80" text-anchor="start" class="zh" style="font-size:11.0px">emit 事件通知</text></svg><ul><li>数据<b>单向流动</b>：父传给子，子不直接改，而是“喊一声”（emit），由父决定怎么改。这样出了问题只用查一个地方。</li><li>跨很多层的共享数据（如登录状态）放在<b>全局状态</b>（Pinia）里。</li></ul><p class="one">数据向下流，事件向上喊。</p></section><section class="card full"><h3><span class="n">3</span>模块化与构建：从源码到上线文件</h3><svg viewBox="0 0 480 136" role="img" aria-label="源码 → Vite 构建 → dist → 部署"><g class="wob"><rect class="s fb" x="10.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M112.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="130.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="250.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M352.0 55 h14" marker-end="url(#ah)"/><rect class="s fp" x="370.0" y="20" width="100.0" height="70" rx="9"/></g><g><text x="60.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">源码</text><text x="60.0" y="64" text-anchor="middle" class="zh" style="font-size:8.9px" fill-opacity=".85">TS / Vue / 很多文件</text></g><g><text x="180.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">Vite 构建</text><text x="180.0" y="64" text-anchor="middle" class="zh" style="font-size:9.6px" fill-opacity=".85">编译 + 打包 + 压缩</text></g><g><text x="300.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">dist</text><text x="300.0" y="64" text-anchor="middle" class="zh" style="font-size:8.2px" fill-opacity=".85">少量 JS / CSS / HTML</text></g><g><text x="420.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">部署</text><text x="420.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">放到 Vercel</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L462,108"/></circle><text x="10" y="128" class="cap">浏览器只认 HTML / CSS / JS，其余都要先被翻译</text></svg><ul><li><code>import / export</code> 把代码拆成小文件。<b>打包</b>把它们合成少量文件，减少请求数。</li><li>TypeScript 浏览器不认识，构建时被编译成普通 JS；类型检查只发生在写代码和构建时。</li><li><code>package.json</code> 记录依赖和脚本（<code>npm run build</code>）；<code>package-lock.json</code> 锁死具体版本，保证每台机器装的一样。</li><li>我们的两个学习站是<b>单个 index.html</b>，没有构建这一步，所以简单，但文件很大；项目变大后应迁到 Vite。</li></ul><p class="one">构建 = 把方便人写的代码，翻译成方便浏览器跑的代码。</p></section><section class="card"><h3><span class="n">4</span>前端“发请求”的标准写法</h3><pre class="term"><span class="k">const</span> authFetch = <span class="k">async</span> (path, opt = {}) =&gt; {
  <span class="k">const</span> r = <span class="k">await</span> fetch(API + path, {
    ...opt,
    headers: {
      <span class="b">"Content-Type"</span>: <span class="b">"application/json"</span>,
      <span class="b">Authorization</span>: <span class="b">"Bearer " + token</span>,   <span class="c">// 身份放头里</span>
    },
  });
  <span class="k">if</span> (r.status === 401) { <span class="c">/* 过期：清 token、重新登录 */</span> }
  <span class="k">return</span> r;                                 <span class="c">// 调用方自己看 r.ok</span>
};</pre><ul><li><b>封装一次，到处用</b>：把“加 token、处理 401”集中在一个函数里。</li><li><b>乐观更新</b>：先改页面再等后端，失败再改回来并提示。体验更快。<b>防连点</b>：用一个标记记着“这条正在处理”。</li></ul><p class="one">重复的事封装成函数，错误统一处理。</p></section></div></section><section class="panel" id="p-deploy" aria-label="部署与运维"><h2>部署与运维</h2><p class="sec">push 之后到用户看到之间发生的事、域名怎么指过去、环境差异、Docker、监控。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>push 之后，发生了什么</h3><svg viewBox="0 0 680 412" role="img" aria-label="时序图：你 / GitHub / Vercel / 用户"><g class="wob"><rect class="s fb" x="16.0" y="12" width="153.0" height="40" rx="9"/><path d="M92.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="181.0" y="12" width="153.0" height="40" rx="9"/><path d="M257.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="346.0" y="12" width="153.0" height="40" rx="9"/><path d="M422.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="511.0" y="12" width="153.0" height="40" rx="9"/><path d="M587.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M95.5 86.0 H252.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M260.5 136.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M419.5 186.0 H262.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M425.5 286.0 H582.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M584.5 336.0 H427.5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="92.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你</text><text x="92.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">git push</text><text x="257.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">GitHub</text><text x="422.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Vercel</text><text x="422.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">构建服务器</text><text x="587.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">用户</text><text x="587.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">浏览器</text><text x="175.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 推送新提交到 main</text><text x="340.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 Webhook：有新提交了</text><text x="340.0" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">Vercel 一直在盯着仓库</text><text x="340.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 拉取最新代码</text><rect class="s fy" x="350.2" y="218.0" width="144.5" height="30" rx="7" style="stroke-width:1.8"/><text x="422.5" y="238" text-anchor="middle" class="zh" style="font-size:11.5px">安装依赖、构建、跑检查</text><text x="505.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 新版本部署到全球边缘</text><text x="505.0" y="301" text-anchor="middle" class="cap" style="font-size:9.5px">旧版在新版就绪前一直服务，不中断</text><text x="505.0" y="328" text-anchor="middle" class="zh" style="font-size:11.0px">6 刷新后看到新版（若没缓存）</text><text x="10" y="406" class="cap">这条流水线叫 CI/CD：持续集成 + 持续部署</text></svg><ul><li>你只管 <code>git push</code>，剩下的全自动。如果构建失败，线上<b>仍然是旧版本</b>，不会坏。</li><li><b>回滚</b>：Vercel 的 Deployments 里可以一键切回之前的版本，出了问题先回滚，再慢慢查。</li><li><b>预览部署</b>：推到非 main 分支，会生成独立预览网址，先看再合并。</li></ul><p class="one">git push 就是“上线”按钮。</p></section><section class="card"><h3><span class="n">2</span>三种环境</h3><div class="scroll"><table class="tb"><tr><th></th><th>开发 dev</th><th>预览 / 测试</th><th>生产 prod</th></tr><tr><td>在哪</td><td>你的电脑 localhost</td><td>Vercel 预览网址</td><td>真正的域名</td></tr><tr><td>数据库</td><td>测试库</td><td>测试库</td><td><b>真实用户数据</b></td></tr><tr><td>密钥</td><td>本地 .env</td><td>Vercel（预览）</td><td>Vercel（生产）</td></tr><tr><td>出错后果</td><td>只有自己</td><td>只有自己和测试</td><td><b>用户都看到</b></td></tr></table></div><ul><li>“本地好使，线上不行”最常见原因：①线上环境变量没配；②新域名没加进 CORS 白名单；③浏览器缓存了旧版；④本地和线上数据库不是同一个。</li><li><b>任何会改数据的操作，先在测试环境跑一次。</b></li></ul><p class="one">同一份代码，不同环境，配置不同。</p></section><section class="card full"><h3><span class="n">3</span>域名从买到访问的全过程</h3><svg viewBox="0 0 680 394" role="img" aria-label="时序图：你 / 域名商 / Cloudflare / Vercel"><g class="wob"><rect class="s fb" x="16.0" y="12" width="153.0" height="40" rx="9"/><path d="M92.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="181.0" y="12" width="153.0" height="40" rx="9"/><path d="M257.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="346.0" y="12" width="153.0" height="40" rx="9"/><path d="M422.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="511.0" y="12" width="153.0" height="40" rx="9"/><path d="M587.5 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M95.5 86.0 H252.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M95.5 136.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M95.5 186.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M95.5 236.0 H582.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M425.5 336.0 H582.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="92.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你</text><text x="257.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">域名商</text><text x="257.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">买域名</text><text x="422.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Cloudflare</text><text x="422.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">DNS 管理</text><text x="587.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Vercel</text><text x="587.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">托管网站</text><text x="175.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 买 goenkon.com</text><text x="257.5" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 把域名的 DNS 交给 Cloudflare</text><text x="257.5" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">在域名商那里改 nameserver</text><text x="257.5" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 加记录：jlpt → CNAME → cname.vercel-dns.com</text><text x="340.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 在 Vercel 项目里添加域名 jlpt.goenkon.com</text><rect class="s fy" x="484.4" y="268.0" width="189.6" height="30" rx="7" style="stroke-width:1.8"/><text x="579.2" y="288" text-anchor="middle" class="zh" style="font-size:11.5px">验证归属、自动申请 https 证书</text><text x="505.0" y="328" text-anchor="middle" class="zh" style="font-size:8.0px">6 之后用户访问该域名 → DNS 指到 Vercel</text></svg><ul><li><b>CNAME</b>是“别名”：jlpt.goenkon.com 是 cname.vercel-dns.com 的别名，Vercel 那边的真实 IP 变了也不用你管。</li><li>Cloudflare 里的小云朵：<b>橙色</b>是走 Cloudflare 代理（可缓存、防护），<b>灰色</b>只做 DNS。对接 Vercel 时多用灰色（仅 DNS），以免证书和缓存互相打架。</li><li>新加的记录要等 DNS 缓存（TTL）过期才全球生效，可能几分钟到几小时。</li><li>网站没显示新版：先看域名有没有解析到、证书有没有签发、浏览器有没有缓存。</li></ul><p class="one">买域名 → 指到托管平台 → 平台签证书，三步串起来。</p></section><section class="card"><h3><span class="n">4</span>Docker 是什么（以后会遇到）</h3><div class="cmp"><div class="l"><h4>没有 Docker</h4><ul><li>“我电脑上好使”：Node 版本、系统库、配置各不相同</li><li>新同事装环境要半天</li><li>服务器环境和本地不一样，上线出怪问题</li></ul></div><div class="r"><h4>有 Docker</h4><ul><li>把程序和它需要的环境打包成<b>镜像</b></li><li>运行起来的镜像叫<b>容器</b>，到哪里都一样</li><li>一条命令起整套环境（后端 + 数据库）</li></ul></div></div><ul><li>容器比虚拟机轻：它<b>共用宿主机的系统内核</b>，只隔离进程和文件，秒级启动。</li><li>Vercel 帮我们屏蔽了这些细节；去 AWS、公司自己的服务器时，Docker 就是常见门槛，招聘里经常出现。</li></ul><p class="one">Docker = 把“环境”一起打包带走。</p></section><section class="card"><h3><span class="n">5</span>监控与排错：线上出问题怎么发现</h3><div class="scroll"><table class="tb"><tr><th>手段</th><th>看什么</th><th>工具</th></tr><tr><td>日志</td><td>每次请求、报错</td><td>Vercel Logs</td></tr><tr><td>健康检查</td><td>后端是否活着</td><td>访问 <code>/health</code></td></tr><tr><td>错误追踪</td><td>用户那边的报错</td><td>Sentry 之类</td></tr><tr><td>访问统计</td><td>有多少人用</td><td>Vercel Analytics</td></tr><tr><td>可用性监控</td><td>挂了立刻通知</td><td>UptimeRobot</td></tr></table></div><ul><li>个人小项目至少要会看 Vercel Logs；进公司后，监控和告警是工程师的日常。</li></ul><p class="one">上线不是结束，是开始被使用。</p></section></div></section><section class="panel" id="p-debug" aria-label="排错手册"><h2>排错手册</h2><p class="sec">遇到问题时的通用思路，和一张“症状对照表”。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>排错的通用方法：沿着请求走一遍</h3><svg viewBox="0 0 520 116" role="img" aria-label="排错路径"><g class="wob"><rect class="s fb" x="10" y="18" width="92" height="56" rx="9"/><rect class="s fy" x="118" y="18" width="92" height="56" rx="9"/><rect class="s fg" x="226" y="18" width="92" height="56" rx="9"/><rect class="s fp" x="334" y="18" width="92" height="56" rx="9"/><rect class="s fr" x="442" y="18" width="68" height="56" rx="9"/><path class="s" d="M104 46 L116 46" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M212 46 L224 46" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M320 46 L332 46" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M428 46 L440 46" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="56" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">页面</text><text x="56" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">按钮有反应?</text><text x="164" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">网络</text><text x="164" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">请求发了吗?</text><text x="272" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">后端</text><text x="272" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">状态码/日志?</text><text x="380" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="380" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">数据对吗?</text><text x="476" y="42" text-anchor="middle" class="zh" style="font-size:12.5px">返回</text><text x="476" y="58" text-anchor="middle" class="zh" style="font-size:9.5px">渲染对?</text><text x="10" y="104" class="cap">每一站问一个问题：“到这儿了吗？对吗？”问题就缩小到两站之间</text></svg><ul><li><b>最有用的第一问</b>：请求发出去了吗？Network 里有没有？没有 = 前端逻辑问题；有 = 看状态码。</li><li><b>二分法</b>：从中间切开。后端用 curl 直接调，通了就是前端问题，不通就是后端问题。</li><li><b>最小复现</b>：把问题缩到最小的例子，常常缩小的过程中就找到原因了。</li><li><b>一次只改一处</b>：同时改三处，好了也不知道是哪一处。</li></ul><p class="one">bug 排查 = 沿着请求的旅程，一站一站问“到这儿了吗”。</p></section><section class="card full"><h3><span class="n">2</span>症状 → 先看哪 → 多半是什么</h3><div class="scroll"><table class="tb"><tr><th>你看到的</th><th>先看哪</th><th>多半是</th></tr><tr><td>页面空白</td><td>Console 红字</td><td>JS 语法错误、引用了不存在的变量</td></tr><tr><td>点了没反应</td><td>Network 有没有请求</td><td>没发请求 = 前端逻辑；有请求看状态码</td></tr><tr><td><code>401</code></td><td>token 在不在、过期没</td><td>重新登录；token 没带上</td></tr><tr><td><code>403</code></td><td>是不是越权</td><td>没有这个操作的权限</td></tr><tr><td><code>404</code></td><td>路径、方法拼对没</td><td>路径写错，或 history 路由刷新</td></tr><tr><td><code>500</code></td><td>后端日志</td><td>后端代码 / 数据库报错</td></tr><tr><td><code>blocked by CORS</code></td><td>后端白名单</td><td>新域名没加进去</td></tr><tr><td><code>EADDRINUSE</code></td><td><code>lsof -i :端口</code></td><td>端口被旧进程占着，kill 掉</td></tr><tr><td><code>command not found</code></td><td><code>which 命令</code>、PATH</td><td>没装，或装的位置不在 PATH</td></tr><tr><td>改了但页面没变</td><td>页面版本号</td><td>缓存没更新：强制刷新、无痕窗口</td></tr><tr><td>本地好、线上坏</td><td>环境变量、CORS、版本号</td><td>两个环境配置不同</td></tr><tr><td>中文变成乱码</td><td>编码</td><td>文件 / 响应不是 UTF-8</td></tr><tr><td>连点出现两条</td><td>防连点、唯一约束</td><td>没做防重复</td></tr></table></div><ul><li>遇到新报错，<b>把完整报错原文复制下来</b>搜索或发给我，别只描述“报错了”。</li></ul><p class="one">一半的问题，看对地方就解决了。</p></section></div></section>
</div>
</template>

<!-- ===================== 语法速查：8 篇（构建时生成的静态内容，根元素 v-pre，Vue 不解析里面的 {{ }}）===================== -->
<template id="tpl-sx-js">
<div class="sx" v-pre>
<div class="sx-wrap"><div class="sx-chips"><span class="sx-chip">前端 + Node 后端共用</span><span class="sx-chip">ES2015+</span><span class="sx-chip">TypeScript 的底子</span></div><h1 class="sx-h1">JavaScript 语法</h1><p class="sx-intro">你前端写过 JavaScript，这里把容易忘、后端常用的语法系统过一遍：变量、函数、对象数组、解构展开、模块、类、异步（Promise / async / await）、错误处理（try / catch）。每个都配一个小例子，很多例子来自我们自己的收藏后端。</p><nav class="sx-nav" aria-label="章节"><a href="#js-var">变量与数据类型</a><a href="#js-fn">函数</a><a href="#js-obj">对象与数组</a><a href="#js-mod">模块 import / export</a><a href="#js-class">类 class</a><a href="#js-async">异步：Promise / async / await</a><a href="#js-err">错误处理：try / catch / finally / throw</a><a href="#js-misc">其他常用</a></nav><section class="sx-sec" id="js-var"><h2>变量与数据类型</h2><p class="sx-desc">先分清“值”和“引用”：数字、字符串这类是值，对象、数组是引用（指向同一个东西）。</p><div class="sx-grid"><article class="sx-item"><h3><code>let / const</code></h3><p class="sx-what">声明变量。<b>const</b>：之后不能再被赋值（最常用）；<b>let</b>：之后还要改。<b>var</b> 是老写法，作用域奇怪，别用。</p><pre class="code"><code><span class="hl-k">const</span> <span class="hl-t">API_BASE</span> = <span class="hl-s">"https://ielts-backend-node.vercel.app"</span>; <span class="hl-c">// 不会变的用 const</span>
<span class="hl-k">let</span> page = 1;     <span class="hl-c">// 会变的用 let</span>
page = page + 1;  <span class="hl-c">// OK</span>
<span class="hl-c">// API_BASE = "x"; // ❌ TypeError: Assignment to constant variable</span></code></pre><p class="sx-tip"><b>记住</b>默认用 const，确实要改再换成 let。</p></article><article class="sx-item"><h3><code>基本类型</code></h3><p class="sx-what">一共 7 种：<b>string</b> 字符串、<b>number</b> 数字（整数小数都是它）、<b>boolean</b> 真假、<b>null</b> 故意的空、<b>undefined</b> 还没赋值、<b>bigint</b> 超大整数、<b>symbol</b> 唯一标记。</p><pre class="code"><code><span class="hl-k">typeof</span> <span class="hl-s">"abc"</span>      <span class="hl-c">// "string"</span>
<span class="hl-k">typeof</span> 42         <span class="hl-c">// "number"</span>
<span class="hl-k">typeof</span> <span class="hl-k">true</span>       <span class="hl-c">// "boolean"</span>
<span class="hl-k">typeof</span> <span class="hl-k">undefined</span>  <span class="hl-c">// "undefined"</span>
<span class="hl-k">typeof</span> <span class="hl-k">null</span>       <span class="hl-c">// "object"  ← 历史遗留的坑，记住就好</span>
<span class="hl-k">typeof</span> {}         <span class="hl-c">// "object"</span>
<span class="hl-k">typeof</span> []         <span class="hl-c">// "object"  ← 判断数组用 Array.isArray([])</span></code></pre></article><figure class="sx-fig"><svg viewBox="0 0 640 236" role="img" aria-label="值类型直接存在变量里；对象存的是“地址”。copy = fav 只是复制地址，改 copy.word，fav 也跟着变"><g filter="url(#sxwob)"><rect x="20" y="14" width="260" height="208" rx="12" class="sx-s" fill="var(--blue)" fill-opacity=".35"/><rect x="360" y="14" width="260" height="208" rx="12" class="sx-s" fill="var(--mint)" fill-opacity=".35"/><rect x="36" y="52" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="92" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="132" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="36" y="172" width="228" height="30" rx="7" class="sx-s" fill="var(--card)"/><rect x="376" y="52" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="92" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><rect x="376" y="132" width="228" height="30" rx="7" class="sx-s" fill="var(--yellow)"/><path d="M264 147 C 320 147, 320 147, 376 147" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M264 187 C 320 187, 320 147, 376 147" class="sx-s sx-dash" marker-end="url(#sxah)"/></g><text x="150.0" y="36" text-anchor="middle" font-size="13.5" font-weight="700" class="">变量里存的（栈）</text><text x="490.0" y="36" text-anchor="middle" font-size="13.5" font-weight="700" class="">对象本体（堆）</text><text x="150.0" y="72" text-anchor="middle" font-size="12" class="">page = 2</text><text x="150.0" y="112" text-anchor="middle" font-size="12" class="">word = \“abandon\”</text><text x="150.0" y="152" text-anchor="middle" font-size="12" class="">fav ─→（一个地址）</text><text x="150.0" y="192" text-anchor="middle" font-size="12" class="">copy ─→（同一个地址）</text><text x="490.0" y="72" text-anchor="middle" font-size="12" class=""></text><text x="490.0" y="112" text-anchor="middle" font-size="12" class=""></text><text x="490.0" y="152" text-anchor="middle" font-size="12" class="">{ id: 1, word: \“abandon\” }</text></svg><figcaption>值类型直接存在变量里；对象存的是“地址”。copy = fav 只是复制地址，改 copy.word，fav 也跟着变</figcaption></figure><article class="sx-item"><h3><code>值 vs 引用</code></h3><p class="sx-what">把对象赋给另一个变量，两个变量指向<b>同一个对象</b>。想要一份独立的副本，用展开 <code>{...obj}</code> 或 <code>structuredClone(obj)</code>。</p><pre class="code"><code><span class="hl-k">const</span> fav = { id: 1, word: <span class="hl-s">"abandon"</span> };
<span class="hl-k">const</span> copy = fav;          <span class="hl-c">// 复制的是地址</span>
copy.word = <span class="hl-s">"reduce"</span>;
console.log(fav.word);     <span class="hl-c">// "reduce" ← 原来的也变了！</span>
<span class="hl-k">const</span> safe = { ...fav };   <span class="hl-c">// 浅拷贝：新对象</span>
safe.word = <span class="hl-s">"hence"</span>;
console.log(fav.word);     <span class="hl-c">// 还是 "reduce"</span></code></pre><p class="sx-tip"><b>记住</b>前端里“改了一个地方，别处也莫名变了”，十有八九是这个原因。</p></article><article class="sx-item"><h3><code>== 和 ===</code></h3><p class="sx-what"><b>===</b> 严格相等：类型和值都要一样。<b>==</b> 会偷偷转换类型，结果反直觉。一律用 ===。</p><pre class="code"><code>0 == <span class="hl-s">""</span>        <span class="hl-c">// true  ← 奇怪</span>
0 === <span class="hl-s">""</span>       <span class="hl-c">// false</span>
<span class="hl-s">"1"</span> === 1      <span class="hl-c">// false</span>
<span class="hl-k">null</span> == <span class="hl-k">undefined</span>   <span class="hl-c">// true</span>
<span class="hl-k">null</span> === <span class="hl-k">undefined</span>  <span class="hl-c">// false</span></code></pre><p class="sx-tip"><b>记住</b>只用 === 和 !==。</p></article><article class="sx-item"><h3><code>真值 / 假值</code></h3><p class="sx-what">if 里会被当成 false 的只有 6 个：<b>false、0、""、null、undefined、NaN</b>。其他（包括 [] 和 {}）都是 true。</p><pre class="code"><code><span class="hl-k">if</span> (!word) <span class="hl-k">return</span> res.status(400).json({ error: <span class="hl-s">"bad_request"</span> });
<span class="hl-c">// word 是 "" 或 undefined 时都会进来</span>

<span class="hl-k">if</span> ([]) console.log(<span class="hl-s">"空数组也是真值！"</span>);</code></pre></article><article class="sx-item"><h3><code>?? 和 ?.</code></h3><p class="sx-what"><b>??</b>（空值合并）：左边是 null / undefined 才用右边。<b>?.</b>（可选链）：左边是空就直接返回 undefined，不报错。</p><pre class="code"><code><span class="hl-k">const</span> body = req.body ?? {};           <span class="hl-c">// 没有请求体时给个空对象（我们后端真有这行）</span>
<span class="hl-k">const</span> status = body.status ?? <span class="hl-s">"unknown"</span>;
<span class="hl-k">const</span> city = user?.address?.city;      <span class="hl-c">// user 或 address 是空都不会崩</span>

<span class="hl-c">// 和 || 的区别：|| 遇到 0、"" 也会用右边</span>
0 || 10   <span class="hl-c">// 10</span>
0 ?? 10   <span class="hl-c">// 0</span></code></pre><p class="sx-tip"><b>记住</b>给默认值优先用 ??，它不会误伤 0 和空字符串。</p></article><article class="sx-item"><h3><code>模板字符串</code></h3><p class="sx-what">用反引号 <code>`</code>，里面 <code>${}</code> 放变量，可以换行。</p><pre class="code"><code><span class="hl-k">const</span> id = 12;
<span class="hl-k">const</span> url = <span class="hl-s">`/favorites/${id}`</span>;              <span class="hl-c">// "/favorites/12"</span>
<span class="hl-k">const</span> header = <span class="hl-s">`Bearer ${token}`</span>;
<span class="hl-k">const</span> msg = <span class="hl-s">`第 ${page} 页，共 ${total} 条`</span>;</code></pre></article></div></section><section class="sx-sec" id="js-fn"><h2>函数</h2><p class="sx-desc">函数就是“一段可以反复调用的代码”。JS 里函数也是值，可以存进变量、当参数传。</p><div class="sx-grid"><article class="sx-item"><h3><code>函数声明 / 箭头函数</code></h3><p class="sx-what">两种常见写法。箭头函数更短，而且<b>没有自己的 this</b>（用外层的），回调里最常用。</p><pre class="code"><code><span class="hl-k">function</span> add(a, b) { <span class="hl-k">return</span> a + b; }       <span class="hl-c">// 函数声明</span>
<span class="hl-k">const</span> add2 = (a, b) =&gt; a + b;              <span class="hl-c">// 箭头函数：只有一行时可省略 {} 和 return</span>
<span class="hl-k">const</span> square = x =&gt; x * x;                 <span class="hl-c">// 只有一个参数时可省略 ()</span>
<span class="hl-k">const</span> makeUser = (name) =&gt; ({ name });     <span class="hl-c">// 返回对象要包一层 ()</span></code></pre></article><article class="sx-item"><h3><code>默认参数 / 剩余参数</code></h3><p class="sx-what">参数没传时用默认值；<code>...rest</code> 把“剩下的所有参数”收成一个数组。</p><pre class="code"><code><span class="hl-k">function</span> greet(name = <span class="hl-s">"Goen"</span>) { <span class="hl-k">return</span> <span class="hl-s">`Hello, ${name}`</span>; }
greet();          <span class="hl-c">// "Hello, Goen"</span>

<span class="hl-k">function</span> sum(...nums) { <span class="hl-k">return</span> nums.reduce((a, b) =&gt; a + b, 0); }
sum(1, 2, 3);     <span class="hl-c">// 6</span></code></pre></article><article class="sx-item"><h3><code>回调函数</code></h3><p class="sx-what">把函数当参数传给别人，让别人在合适的时候调用。数组方法、事件监听、Express 路由全是这个套路。</p><pre class="code"><code><span class="hl-c">// 我们传一个函数进去，Express 收到 GET /health 请求时才调用它</span>
app.get(<span class="hl-s">"/health"</span>, (req, res) =&gt; {
  res.json({ ok: <span class="hl-k">true</span> });
});

button.addEventListener(<span class="hl-s">"click"</span>, () =&gt; console.log(<span class="hl-s">"点了"</span>));</code></pre><p class="sx-tip"><b>记住</b>看到 (req, res) => {...}，就想：“这是交给框架、等它来调用的”。</p></article><article class="sx-item"><h3><code>闭包</code></h3><p class="sx-what">函数可以“记住”它被创建时外面的变量，即使外面的函数已经执行完了。</p><pre class="code"><code><span class="hl-k">function</span> createCounter() {
  <span class="hl-k">let</span> count = 0;                 <span class="hl-c">// 外面的变量</span>
  <span class="hl-k">return</span> () =&gt; ++count;          <span class="hl-c">// 里面的函数一直记得 count</span>
}
<span class="hl-k">const</span> next = createCounter();
next(); <span class="hl-c">// 1</span>
next(); <span class="hl-c">// 2   ← count 没有被重置</span>

<span class="hl-c">// 我们后端的 createFavoritesRouter(deps) 也是闭包：里面每个路由都记得 deps.db</span></code></pre><p class="sx-tip"><b>记住</b>工厂函数（createXxx）+ 闭包，是 Node 后端不用 class 也能“装配零件”的方式。</p></article></div></section><section class="sx-sec" id="js-obj"><h2>对象与数组</h2><p class="sx-desc">后端每天都在和 JSON 打交道，而 JSON 就是对象和数组。</p><div class="sx-grid"><article class="sx-item"><h3><code>对象</code></h3><p class="sx-what">一组“键: 值”。读写用 <code>.键名</code> 或 <code>[\“键名"]</code>。</p><pre class="code"><code><span class="hl-k">const</span> fav = { id: 1, kind: <span class="hl-s">"w"</span>, word: <span class="hl-s">"abandon"</span> };
fav.word;              <span class="hl-c">// "abandon"</span>
fav[<span class="hl-s">"kind"</span>];           <span class="hl-c">// "w"</span>
fav.status = <span class="hl-s">"known"</span>;  <span class="hl-c">// 新增一个键</span>
delete fav.status;     <span class="hl-c">// 删掉</span>
<span class="hl-t">Object</span>.keys(fav);      <span class="hl-c">// ["id", "kind", "word"]</span>
<span class="hl-k">const</span> name = <span class="hl-s">"Goen"</span>; <span class="hl-k">const</span> user = { name };   <span class="hl-c">// 简写：等于 { name: name }</span></code></pre></article><article class="sx-item"><h3><code>数组常用方法</code></h3><p class="sx-what"><b>map</b> 一个变一个、<b>filter</b> 留下符合条件的、<b>find</b> 找第一个、<b>some</b> 有没有、<b>reduce</b> 汇总、<b>includes</b> 包不包含。它们都<b>不改原数组</b>（返回新的）。</p><pre class="code"><code><span class="hl-k">const</span> favs = [{ word: <span class="hl-s">"a"</span>, kind: <span class="hl-s">"w"</span> }, { word: <span class="hl-s">"b c"</span>, kind: <span class="hl-s">"p"</span> }];
favs.map(f =&gt; f.word);              <span class="hl-c">// ["a", "b c"]</span>
favs.filter(f =&gt; f.kind === <span class="hl-s">"w"</span>);   <span class="hl-c">// [{ word: "a", ... }]</span>
favs.find(f =&gt; f.word === <span class="hl-s">"a"</span>);     <span class="hl-c">// { word: "a", ... }</span>
favs.some(f =&gt; f.kind === <span class="hl-s">"p"</span>);     <span class="hl-c">// true</span>
[<span class="hl-s">"w"</span>, <span class="hl-s">"p"</span>].includes(<span class="hl-s">"g"</span>);           <span class="hl-c">// false ← 我们后端校验 kind 就是这么做的</span>
[1, 2, 3].reduce((sum, x) =&gt; sum + x, 0);  <span class="hl-c">// 6</span></code></pre><p class="sx-tip"><b>记住</b>会改原数组的是 push / pop / splice / sort，用的时候要清楚。</p></article><article class="sx-item"><h3><code>解构</code></h3><p class="sx-what">从对象 / 数组里“拆出”想要的部分，直接变成变量。</p><pre class="code"><code><span class="hl-k">const</span> { kind, word } = req.body;          <span class="hl-c">// 等于 const kind = req.body.kind; ...</span>
<span class="hl-k">const</span> { id: favId } = fav;                <span class="hl-c">// 改个名字</span>
<span class="hl-k">const</span> { site = <span class="hl-s">"ielts"</span> } = body;          <span class="hl-c">// 带默认值</span>
<span class="hl-k">const</span> [first, second] = [<span class="hl-s">"w"</span>, <span class="hl-s">"p"</span>];       <span class="hl-c">// 数组按位置拆</span>
<span class="hl-k">const</span> [existing] = <span class="hl-k">await</span> db.select()...;  <span class="hl-c">// 我们后端：只要查询结果的第一条</span></code></pre></article><article class="sx-item"><h3><code>展开 ...</code></h3><p class="sx-what">把对象 / 数组“摊开”。常用来复制、合并。</p><pre class="code"><code><span class="hl-k">const</span> a = { x: 1 }, b = { y: 2 };
<span class="hl-k">const</span> merged = { ...a, ...b, z: 3 };   <span class="hl-c">// { x: 1, y: 2, z: 3 }</span>
<span class="hl-k">const</span> updated = { ...fav, status: <span class="hl-s">"known"</span> };  <span class="hl-c">// 复制一份并改一个字段（Vue/React 常用）</span>
<span class="hl-k">const</span> all = [...list1, ...list2];
<span class="hl-t">Math</span>.max(...[3, 9, 1]);                <span class="hl-c">// 9</span></code></pre></article><article class="sx-item"><h3><code>JSON</code></h3><p class="sx-what"><b>JSON.stringify</b>：对象 → 字符串（发给后端）；<b>JSON.parse</b>：字符串 → 对象（收到后读）。网络上传的只能是字符串。</p><pre class="code"><code><span class="hl-k">const</span> text = <span class="hl-t">JSON</span>.stringify({ kind: <span class="hl-s">"w"</span>, word: <span class="hl-s">"abandon"</span> });
<span class="hl-c">// '{"kind":"w","word":"abandon"}'</span>
<span class="hl-k">const</span> obj = <span class="hl-t">JSON</span>.parse(text);
obj.word; <span class="hl-c">// "abandon"</span>

<span class="hl-c">// fetch 里：body: JSON.stringify(data)；收到用 await res.json()</span></code></pre></article></div></section><section class="sx-sec" id="js-mod"><h2>模块 import / export</h2><p class="sx-desc">一个文件就是一个模块。export 往外给，import 从别处拿。</p><div class="sx-grid"><article class="sx-item"><h3><code>具名导出 / 默认导出</code></h3><p class="sx-what"><b>export</b>：可以有很多个，导入时名字要对上，用 {}。<b>export default</b>：一个文件只有一个，导入时可以随便起名。</p><pre class="code"><code><span class="hl-c">// jwt.ts</span>
<span class="hl-k">export</span> <span class="hl-k">function</span> createJwtService(secret) { ... }     <span class="hl-c">// 具名导出</span>
<span class="hl-c">// index.ts（线上入口）</span>
<span class="hl-k">export</span> <span class="hl-k">default</span> app;                                  <span class="hl-c">// 默认导出：Vercel 拿它当处理函数</span>

<span class="hl-c">// 别的文件里：</span>
<span class="hl-k">import</span> { createJwtService } <span class="hl-k">from</span> <span class="hl-s">"./auth/jwt.js"</span>;   <span class="hl-c">// 具名：要加 {}，名字要对</span>
<span class="hl-k">import</span> app <span class="hl-k">from</span> <span class="hl-s">"./index.js"</span>;                         <span class="hl-c">// 默认：不加 {}</span>
<span class="hl-k">import</span> express <span class="hl-k">from</span> <span class="hl-s">"express"</span>;                       <span class="hl-c">// 从 npm 包导入</span></code></pre></article><article class="sx-item"><h3><code>ESM 和 CommonJS</code></h3><p class="sx-what">两套模块系统。新的 <b>ESM</b> 用 import / export；老的 <b>CommonJS</b> 用 require / module.exports。我们的 package.json 里写了 <code>"type": "module"</code>，所以用 ESM。</p><pre class="code"><code><span class="hl-c">// ESM（我们用的）</span>
<span class="hl-k">import</span> express <span class="hl-k">from</span> <span class="hl-s">"express"</span>;
<span class="hl-k">export</span> <span class="hl-k">const</span> x = 1;

<span class="hl-c">// CommonJS（老项目、很多教程里还能看到）</span>
<span class="hl-k">const</span> express = require(<span class="hl-s">"express"</span>);
module.exports = { x: 1 };</code></pre><p class="sx-tip"><b>记住</b>ESM 里导入本地文件要写 .js 后缀（哪怕源文件是 .ts），这是我们后端 import 都带 .js 的原因。</p></article></div></section><section class="sx-sec" id="js-class"><h2>类 class</h2><p class="sx-desc">class 是“造对象的图纸”。JS 的 class 本质上是函数 + 原型的语法糖。</p><div class="sx-grid"><article class="sx-item"><h3><code>class / constructor / 方法</code></h3><p class="sx-what">constructor 在 new 的时候执行，用来设置初始值；方法写在类里，所有对象共用。</p><pre class="code"><code><span class="hl-k">class</span> <span class="hl-t">Counter</span> {
  #count = 0;                      <span class="hl-c">// # 开头：私有字段，外面访问不到</span>
  constructor(start = 0) { <span class="hl-k">this</span>.#count = start; }
  next() { <span class="hl-k">return</span> ++<span class="hl-k">this</span>.#count; }
  get value() { <span class="hl-k">return</span> <span class="hl-k">this</span>.#count; }   <span class="hl-c">// getter：像读属性一样调用</span>
  static create() { <span class="hl-k">return</span> <span class="hl-k">new</span> <span class="hl-t">Counter</span>(); }  <span class="hl-c">// 静态方法：Counter.create()</span>
}
<span class="hl-k">const</span> c = <span class="hl-k">new</span> <span class="hl-t">Counter</span>(5);
c.next();   <span class="hl-c">// 6</span>
c.value;    <span class="hl-c">// 6</span></code></pre></article><article class="sx-item"><h3><code>extends / super</code></h3><p class="sx-what">继承：子类拿到父类的全部能力，super 调用父类的构造器或方法。</p><pre class="code"><code><span class="hl-k">class</span> <span class="hl-t">HttpError</span> <span class="hl-k">extends</span> <span class="hl-t">Error</span> {
  constructor(status, message) {
    <span class="hl-k">super</span>(message);          <span class="hl-c">// 先让父类 Error 把 message 设好</span>
    <span class="hl-k">this</span>.status = status;
  }
}
<span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">HttpError</span>(404, <span class="hl-s">"not_found"</span>);</code></pre></article></div></section><section class="sx-sec" id="js-async"><h2>异步：Promise / async / await</h2><p class="sx-desc">后端最重要的一章。查数据库、调 Google、读文件都要“等”，JS 不会傻等，而是先去干别的。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 250" role="img" aria-label="事件循环：主线程只有一个。要等的事交给系统去等，等好了把回调排进队列，主线程空下来就一个个取出来执行"><g filter="url(#sxwob)"><ellipse cx="320.0" cy="127.0" rx="158" ry="88" class="sx-s sx-dash" fill="none"/><rect x="250.0" y="103.0" width="140" height="48" rx="24" class="sx-s" fill="var(--yellow)"/><rect x="250.0" y="17.0" width="140" height="44" rx="9" class="sx-s" fill="var(--blue)"/><rect x="408.0" y="105.0" width="140" height="44" rx="9" class="sx-s" fill="var(--mint)"/><rect x="250.0" y="193.0" width="140" height="44" rx="9" class="sx-s" fill="var(--yellow)"/><rect x="92.0" y="105.0" width="140" height="44" rx="9" class="sx-s" fill="var(--pink)"/></g><text x="320.0" y="132.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">调用栈（正在执行）</text><text x="320.0" y="37.0" text-anchor="middle" font-size="12.5" font-weight="700" class="">同步代码</text><text x="320.0" y="53.0" text-anchor="middle" font-size="10.5" class="sx-sub">从上往下立刻执行</text><text x="478.0" y="125.0" text-anchor="middle" font-size="12.5" font-weight="700" class="">Web API / 系统</text><text x="478.0" y="141.0" text-anchor="middle" font-size="10.5" class="sx-sub">定时器、网络、数据库在别处等</text><text x="320.0" y="213.0" text-anchor="middle" font-size="12.5" font-weight="700" class="">任务队列</text><text x="320.0" y="229.0" text-anchor="middle" font-size="10.5" class="sx-sub">等好了的回调排队</text><text x="162.0" y="125.00000000000001" text-anchor="middle" font-size="12.5" font-weight="700" class="">事件循环</text><text x="162.0" y="141.0" text-anchor="middle" font-size="10.5" class="sx-sub">栈空了就取下一个</text><circle r="6" class="sx-s" fill="var(--pink)"><animateMotion dur="6s" repeatCount="indefinite" path="M320.0 39.0 A 158 88 0 1 1 319.9 39.0"/></circle></svg><figcaption>事件循环：主线程只有一个。要等的事交给系统去等，等好了把回调排进队列，主线程空下来就一个个取出来执行</figcaption></figure><article class="sx-item"><h3><code>Promise</code></h3><p class="sx-what">一个“将来才会有结果”的盒子。三种状态：<b>pending</b>（等待中）→ <b>fulfilled</b>（成功，有值）或 <b>rejected</b>（失败，有错误）。</p><pre class="code"><code><span class="hl-k">const</span> p = fetch(<span class="hl-s">"/favorites"</span>);     <span class="hl-c">// 立刻返回一个 Promise，结果还没回来</span>
p.then(res =&gt; res.json())          <span class="hl-c">// 成功后做什么</span>
 .then(data =&gt; console.log(data))
 .<span class="hl-k">catch</span>(err =&gt; console.error(err)) <span class="hl-c">// 任何一步失败都会到这里</span>
 .<span class="hl-k">finally</span>(() =&gt; hideLoading());     <span class="hl-c">// 不管成功失败都执行</span></code></pre></article><article class="sx-item"><h3><code>async / await</code></h3><p class="sx-what">Promise 的“同步写法”。<b>async</b> 标在函数前，函数就一定返回 Promise；<b>await</b> 只能在 async 函数里用，意思是“等这个 Promise 有结果再往下走”。</p><pre class="code"><code><span class="hl-c">// 我们后端的收藏列表接口（简化）</span>
router.get(<span class="hl-s">"/favorites"</span>, <span class="hl-k">async</span> (req, res) =&gt; {
  <span class="hl-k">const</span> userId = getUserId(res);
  <span class="hl-k">const</span> rows = <span class="hl-k">await</span> db.select().<span class="hl-k">from</span>(favoriteWord)    <span class="hl-c">// 等数据库返回</span>
                       .where(eq(favoriteWord.userId, userId));
  res.json(rows);
});</code></pre><p class="sx-tip"><b>记住</b>await 不会卡住整个程序，只是暂停“这一个函数”，主线程趁机去处理别人的请求。</p></article><figure class="sx-fig"><svg viewBox="0 0 640 96" role="img" aria-label="Promise 的一生：从等待开始，最后要么成功、要么失败，只会变一次"><g filter="url(#sxwob)"><rect x="10.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--blue)"/><path d="M151.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="170.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M312.0 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="331.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--mint)"/><path d="M472.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="491.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--pink)"/></g><text x="79.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">发请求</text><text x="79.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">fetch(...)</text><text x="239.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">pending</text><text x="239.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">等待中</text><text x="400.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">fulfilled</text><text x="400.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">拿到结果</text><text x="560.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">rejected</text><text x="560.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">出错 → catch</text></svg><figcaption>Promise 的一生：从等待开始，最后要么成功、要么失败，只会变一次</figcaption></figure><article class="sx-item"><h3><code>Promise.all</code></h3><p class="sx-what">同时发出多个请求，全部完成后一起拿结果，比一个个 await 快。</p><pre class="code"><code><span class="hl-k">const</span> [user, favs] = <span class="hl-k">await</span> <span class="hl-t">Promise</span>.all([
  fetch(<span class="hl-s">"/me"</span>).then(r =&gt; r.json()),
  fetch(<span class="hl-s">"/favorites"</span>).then(r =&gt; r.json()),
]);
<span class="hl-c">// 任何一个失败，整个 Promise.all 就失败；想要“各管各的”用 Promise.allSettled</span></code></pre></article><article class="sx-item"><h3><code>setTimeout</code></h3><p class="sx-what">过一段时间再执行（异步）。哪怕写 0 毫秒，也要等当前同步代码全部跑完。</p><pre class="code"><code>console.log(<span class="hl-s">"1"</span>);
setTimeout(() =&gt; console.log(<span class="hl-s">"3"</span>), 0);
console.log(<span class="hl-s">"2"</span>);
<span class="hl-c">// 输出顺序：1 2 3</span></code></pre></article></div></section><section class="sx-sec" id="js-err"><h2>错误处理：try / catch / finally / throw</h2><p class="sx-desc">程序出错时不让它直接崩掉，而是“接住”错误，给用户一个合理的回应。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 200" role="img" aria-label="try 里一旦出错，后面的语句不再执行，直接跳到 catch；finally 不管成功失败都会执行（适合收尾：关加载动画、释放资源）"><g filter="url(#sxwob)"><rect x="14" y="74" width="150" height="52" rx="10" class="sx-s" fill="var(--blue)"/><rect x="245" y="16" width="170" height="52" rx="10" class="sx-s" fill="var(--mint)"/><rect x="245" y="132" width="170" height="52" rx="10" class="sx-s" fill="var(--pink)"/><rect x="490" y="74" width="136" height="52" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M164 92 C 200 92, 210 42, 243 42" class="sx-s" marker-end="url(#sxah)"/><path d="M164 112 C 200 112, 210 158, 243 158" class="sx-s sx-dash" marker-end="url(#sxah)"/><path d="M415 42 C 450 42, 460 92, 488 92" class="sx-s" marker-end="url(#sxah)"/><path d="M415 158 C 450 158, 460 112, 488 112" class="sx-s sx-dash" marker-end="url(#sxah)"/></g><text x="89.0" y="96" text-anchor="middle" font-size="13" font-weight="700" class="">try { }</text><text x="89.0" y="114" text-anchor="middle" font-size="10.5" class="sx-sub">先试着执行</text><text x="330.0" y="38" text-anchor="middle" font-size="13" font-weight="700" class="">顺利执行完</text><text x="330.0" y="56" text-anchor="middle" font-size="10.5" class="sx-sub">跳过 catch</text><text x="330.0" y="154" text-anchor="middle" font-size="13" font-weight="700" class="">catch (e) { }</text><text x="330.0" y="172" text-anchor="middle" font-size="10.5" class="sx-sub">接住错误</text><text x="558.0" y="96" text-anchor="middle" font-size="13" font-weight="700" class="">finally { }</text><text x="558.0" y="114" text-anchor="middle" font-size="10.5" class="sx-sub">总会执行</text><text x="200" y="58" text-anchor="middle" font-size="11" class="sx-good">正常</text><text x="200" y="150" text-anchor="middle" font-size="11" class="sx-bad">出错</text></svg><figcaption>try 里一旦出错，后面的语句不再执行，直接跳到 catch；finally 不管成功失败都会执行（适合收尾：关加载动画、释放资源）</figcaption></figure><article class="sx-item"><h3><code>try / catch / finally</code></h3><p class="sx-what">把可能出错的代码放进 try；出错时跳到 catch，变量 e 就是错误对象；finally 最后一定执行。</p><pre class="code"><code><span class="hl-k">async</span> <span class="hl-k">function</span> loadFavs() {
  showLoading();
  <span class="hl-k">try</span> {
    <span class="hl-k">const</span> res = <span class="hl-k">await</span> fetch(<span class="hl-s">"/favorites"</span>, { headers: { <span class="hl-t">Authorization</span>: <span class="hl-s">`Bearer ${token}`</span> } });
    <span class="hl-k">if</span> (!res.ok) <span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">Error</span>(<span class="hl-s">`HTTP ${res.status}`</span>);  <span class="hl-c">// 状态码不对也当成错误</span>
    favs = <span class="hl-k">await</span> res.json();
  } <span class="hl-k">catch</span> (e) {
    console.error(e);                 <span class="hl-c">// 打印出来方便排查</span>
    toast(<span class="hl-s">"收藏加载失败，请重试"</span>);     <span class="hl-c">// 给用户看的话</span>
  } <span class="hl-k">finally</span> {
    hideLoading();                    <span class="hl-c">// 成功失败都要关掉加载动画</span>
  }
}</code></pre><p class="sx-tip"><b>记住</b>fetch 只有网络断了才会抛错；404、500 不会，要自己检查 res.ok。</p></article><article class="sx-item"><h3><code>throw / Error</code></h3><p class="sx-what">自己“抛出”一个错误，交给外面的 catch 去处理。最好抛 Error 对象（带堆栈信息），不要抛字符串。</p><pre class="code"><code><span class="hl-k">function</span> parseId(raw) {
  <span class="hl-k">const</span> id = <span class="hl-t">Number</span>(raw);
  <span class="hl-k">if</span> (!<span class="hl-t">Number</span>.isInteger(id) || id &lt;= 0) <span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">Error</span>(<span class="hl-s">"bad_id"</span>);
  <span class="hl-k">return</span> id;
}
<span class="hl-k">try</span> { parseId(<span class="hl-s">"abc"</span>); }
<span class="hl-k">catch</span> (e) { console.log(e.message); }   <span class="hl-c">// "bad_id"</span></code></pre></article><article class="sx-item"><h3><code>Promise 的错误</code></h3><p class="sx-what">async 函数里 await 一个失败的 Promise，会像 throw 一样被 try/catch 接住；不用 try 的话，用 .catch()。</p><pre class="code"><code><span class="hl-c">// 写法一：try / catch</span>
<span class="hl-k">try</span> { <span class="hl-k">await</span> db.insert(...); } <span class="hl-k">catch</span> (e) { ... }

<span class="hl-c">// 写法二：.catch</span>
<span class="hl-k">await</span> db.insert(...).<span class="hl-k">catch</span>(e =&gt; { ... });

<span class="hl-c">// 没人接住的 Promise 错误会变成 "UnhandledPromiseRejection"，Node 里可能直接让进程退出</span></code></pre><p class="sx-tip"><b>记住</b>Express 5 会自动接住 async 路由里抛出的错误，交给错误处理中间件，所以我们的路由里不用到处写 try。</p></article></div></section><section class="sx-sec" id="js-misc"><h2>其他常用</h2><p class="sx-desc">零碎但天天见。</p><div class="sx-grid"><article class="sx-item"><h3><code>条件写法</code></h3><p class="sx-what">三元运算 <code>a ? b : c</code>；短路 <code>&&</code>；switch。</p><pre class="code"><code><span class="hl-k">const</span> label = kind === <span class="hl-s">"w"</span> ? <span class="hl-s">"单词"</span> : <span class="hl-s">"短语"</span>;
isLoggedIn &amp;&amp; loadFavs();            <span class="hl-c">// 左边为真才执行右边</span>
<span class="hl-k">switch</span> (kind) {
  <span class="hl-k">case</span> <span class="hl-s">"w"</span>: <span class="hl-k">return</span> <span class="hl-s">"单词"</span>;
  <span class="hl-k">case</span> <span class="hl-s">"p"</span>: <span class="hl-k">return</span> <span class="hl-s">"短语"</span>;
  <span class="hl-k">default</span>:  <span class="hl-k">return</span> <span class="hl-s">"未知"</span>;
}</code></pre></article><article class="sx-item"><h3><code>循环</code></h3><p class="sx-what"><b>for...of</b> 遍历数组的值（最常用）；<b>for...in</b> 遍历对象的键；<b>forEach</b> 数组方法（不能 break）。</p><pre class="code"><code><span class="hl-k">for</span> (<span class="hl-k">const</span> fav <span class="hl-k">of</span> favs) console.log(fav.word);
<span class="hl-k">for</span> (<span class="hl-k">const</span> key <span class="hl-k">in</span> fav) console.log(key, fav[key]);
favs.forEach((f, i) =&gt; console.log(i, f.word));
<span class="hl-k">for</span> (<span class="hl-k">let</span> i = 0; i &lt; 3; i++) { <span class="hl-k">if</span> (i === 1) <span class="hl-k">continue</span>; }</code></pre></article><article class="sx-item"><h3><code>Number / String 常用</code></h3><p class="sx-what">字符串和数字互转、去空格、截取。</p><pre class="code"><code><span class="hl-t">Number</span>(<span class="hl-s">"12"</span>);             <span class="hl-c">// 12</span>
<span class="hl-t">Number</span>.isInteger(12.5);   <span class="hl-c">// false</span>
<span class="hl-s">"  abc "</span>.trim();          <span class="hl-c">// "abc"   ← 我们后端存词前会 trim</span>
<span class="hl-s">"Bearer xyz"</span>.startsWith(<span class="hl-s">"Bearer "</span>);  <span class="hl-c">// true</span>
<span class="hl-s">"Bearer xyz"</span>.slice(7);    <span class="hl-c">// "xyz"</span>
<span class="hl-s">"a,b"</span>.split(<span class="hl-s">","</span>);         <span class="hl-c">// ["a", "b"]</span>
(3.14159).toFixed(2);     <span class="hl-c">// "3.14"</span></code></pre></article><article class="sx-item"><h3><code>Map / Set</code></h3><p class="sx-what"><b>Map</b>：键可以是任何东西的字典；<b>Set</b>：不重复的集合。</p><pre class="code"><code><span class="hl-k">const</span> seen = <span class="hl-k">new</span> <span class="hl-t">Set</span>([<span class="hl-s">"w"</span>, <span class="hl-s">"p"</span>]);
seen.has(<span class="hl-s">"g"</span>);    <span class="hl-c">// false</span>
seen.add(<span class="hl-s">"g"</span>);

<span class="hl-k">const</span> byWord = <span class="hl-k">new</span> <span class="hl-t">Map</span>();
byWord.set(<span class="hl-s">"abandon"</span>, [1, 2]);
byWord.get(<span class="hl-s">"abandon"</span>);   <span class="hl-c">// [1, 2]  ← 日语站收藏本按文字合并旧数据就是用 Map</span></code></pre></article></div></section></div>
</div>
</template>
<template id="tpl-sx-ts">
<div class="sx" v-pre>
<div class="sx-wrap"><div class="sx-chips"><span class="sx-chip">我们 Node 后端用的语言</span><span class="sx-chip">= JavaScript + 类型</span><span class="sx-chip">写代码时检查，运行时消失</span></div><h1 class="sx-h1">TypeScript 语法</h1><p class="sx-intro">TypeScript 就是“带类型的 JavaScript”。你写的类型只在写代码、编译时帮你检查错误，编译成 JavaScript 以后类型全部消失。所以它防得住“自己手滑”，防不住“前端传来的坏数据”。</p><nav class="sx-nav" aria-label="章节"><a href="#ts-why">它是什么、怎么跑起来</a><a href="#ts-basic">基础类型</a><a href="#ts-shape">描述对象：type / interface</a><a href="#ts-union">联合类型与收窄</a><a href="#ts-gen">泛型 &amp;lt;T&amp;gt;</a><a href="#ts-cfg">配置与小技巧</a></nav><section class="sx-sec" id="ts-why"><h2>它是什么、怎么跑起来</h2><p class="sx-desc">先理解“类型擦除”，后面很多事就说得通了。</p><div class="sx-grid"><figure class="sx-fig"><svg viewBox="0 0 640 96" role="img" aria-label="类型擦除：TypeScript 只活在编写和编译阶段，真正运行的是去掉类型后的 JavaScript"><g filter="url(#sxwob)"><rect x="10.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--blue)"/><path d="M151.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="170.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--yellow)"/><path d="M312.0 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="331.0" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--mint)"/><path d="M472.5 48.0 h14" class="sx-s" marker-end="url(#sxah)"/><rect x="491.5" y="16" width="138.5" height="64" rx="10" class="sx-s" fill="var(--lilac)"/></g><text x="79.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">app.ts</text><text x="79.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">带类型的代码</text><text x="239.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">tsc / tsx</text><text x="239.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">检查类型 + 去掉类型</text><text x="400.25" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">app.js</text><text x="400.25" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">普通 JavaScript</text><text x="560.75" y="44.0" text-anchor="middle" font-size="13.5" font-weight="700" class="">Node.js 执行</text><text x="560.75" y="62.0" text-anchor="middle" font-size="11" class="sx-sub">根本不知道有过类型</text></svg><figcaption>类型擦除：TypeScript 只活在编写和编译阶段，真正运行的是去掉类型后的 JavaScript</figcaption></figure><article class="sx-item"><h3><code>类型标注</code></h3><p class="sx-what">在变量、参数、返回值后面写 <code>: 类型</code>。写错了编辑器立刻标红，不用等运行。</p><pre class="code"><code><span class="hl-k">let</span> page: <span class="hl-k">number</span> = 1;
<span class="hl-k">const</span> site: <span class="hl-k">string</span> = <span class="hl-s">"jlpt"</span>;
<span class="hl-k">function</span> add(a: <span class="hl-k">number</span>, b: <span class="hl-k">number</span>): <span class="hl-k">number</span> { <span class="hl-k">return</span> a + b; }
add(1, <span class="hl-s">"2"</span>);   <span class="hl-c">// ❌ 编辑器报错：string 不能给 number</span>

<span class="hl-c">// 很多时候不用写，TS 会自己推断：</span>
<span class="hl-k">const</span> word = <span class="hl-s">"abandon"</span>;   <span class="hl-c">// 推断出 string</span></code></pre><p class="sx-tip"><b>记住</b>能推断的就别写，函数参数和对外导出的东西要写。</p></article><article class="sx-item"><h3><code>运行时还是要自己检查</code></h3><p class="sx-what">前端发来的 JSON 在运行时才到，那时类型早就没了。所以收到的数据先当 <code>unknown</code>，检查过再用。</p><pre class="code"><code><span class="hl-c">// 我们后端：req.body 来自网络，不能相信</span>
<span class="hl-k">const</span> kind = body.kind;                 <span class="hl-c">// 运行时可能是任何东西</span>
<span class="hl-k">if</span> (!isKind(kind)) {                    <span class="hl-c">// 自己写的检查函数</span>
  res.status(400).json({ error: <span class="hl-s">"bad_request"</span> });
  <span class="hl-k">return</span>;
}
<span class="hl-c">// 这里往下，TS 才知道 kind 是 "w" | "p"</span></code></pre><p class="sx-tip"><b>记住</b>TS 管“写对”，校验管“防坏人”，两件事都要做。</p></article></div></section><section class="sx-sec" id="ts-basic"><h2>基础类型</h2><p class="sx-desc">比 JS 多了几个“只在类型层面存在”的东西。</p><div class="sx-grid"><article class="sx-item"><h3><code>string / number / boolean / 数组</code></h3><p class="sx-what">基本类型直接写名字；数组写 <code>类型[]</code> 或 <code>Array&lt;类型&gt;</code>。</p><pre class="code"><code><span class="hl-k">const</span> ids: <span class="hl-k">number</span>[] = [1, 2, 3];
<span class="hl-k">const</span> words: <span class="hl-t">Array</span>&lt;<span class="hl-k">string</span>&gt; = [<span class="hl-s">"a"</span>, <span class="hl-s">"b"</span>];
<span class="hl-k">const</span> pair: [<span class="hl-k">string</span>, <span class="hl-k">number</span>] = [<span class="hl-s">"abandon"</span>, 1];   <span class="hl-c">// 元组：固定长度、每一位类型固定</span></code></pre></article><article class="sx-item"><h3><code>any / unknown / never / void</code></h3><p class="sx-what"><b>any</b>：关掉检查（尽量别用）；<b>unknown</b>：可能是任何东西，但用之前必须先检查（安全版 any）；<b>void</b>：函数不返回值；<b>never</b>：永远不会发生。</p><pre class="code"><code><span class="hl-k">function</span> log(msg: <span class="hl-k">string</span>): <span class="hl-k">void</span> { console.log(msg); }

<span class="hl-k">const</span> data: <span class="hl-k">unknown</span> = <span class="hl-t">JSON</span>.parse(text);
data.word;                       <span class="hl-c">// ❌ 不检查不让用</span>
<span class="hl-k">if</span> (<span class="hl-k">typeof</span> data === <span class="hl-s">"object"</span> &amp;&amp; data !== <span class="hl-k">null</span> &amp;&amp; <span class="hl-s">"word"</span> <span class="hl-k">in</span> data) { <span class="hl-c">/* 才能用 */</span> }

<span class="hl-k">function</span> fail(msg: <span class="hl-k">string</span>): <span class="hl-k">never</span> { <span class="hl-k">throw</span> <span class="hl-k">new</span> <span class="hl-t">Error</span>(msg); }</code></pre></article><article class="sx-item"><h3><code>null / undefined 与可选</code></h3><p class="sx-what">开启 strict 后，null 和 undefined 要明确写出来。<code>?</code> 表示“可以没有”。</p><pre class="code"><code><span class="hl-k">let</span> token: <span class="hl-k">string</span> | <span class="hl-k">null</span> = <span class="hl-k">null</span>;      <span class="hl-c">// 可能是字符串，也可能是空</span>
<span class="hl-k">function</span> greet(name?: <span class="hl-k">string</span>) {       <span class="hl-c">// name 可以不传（类型是 string | undefined）</span>
  <span class="hl-k">return</span> <span class="hl-s">`Hello, ${name ?? "Goen"}`</span>;
}
<span class="hl-k">const</span> len = token!.length;   <span class="hl-c">// ! 非空断言：“我保证它不是空的”，慎用</span></code></pre></article></div></section><section class="sx-sec" id="ts-shape"><h2>描述对象：type / interface</h2><p class="sx-desc">后端里到处都是“一个对象长什么样”的描述：请求体、数据库行、零件清单。</p><div class="sx-grid"><article class="sx-item"><h3><code>type 和 interface</code></h3><p class="sx-what">都能描述对象的形状。interface 可以继承、可以重复声明合并；type 更灵活（能写联合类型）。项目里统一一种就行。</p><pre class="code"><code><span class="hl-c">// 我们后端 src/deps.ts：程序需要的零件清单</span>
<span class="hl-k">export</span> <span class="hl-k">type</span> <span class="hl-t">Deps</span> = {
  db: <span class="hl-t">Db</span>;                 <span class="hl-c">// 数据库</span>
  jwt: <span class="hl-t">JwtService</span>;        <span class="hl-c">// 发 / 验 token 的工具</span>
  google: <span class="hl-t">GoogleVerifier</span>; <span class="hl-c">// 核对 Google 证明书的工具</span>
  allowedOrigins: <span class="hl-k">string</span>[];
};

<span class="hl-k">interface</span> <span class="hl-t">User</span> { id: <span class="hl-k">number</span>; email: <span class="hl-k">string</span>; name?: <span class="hl-k">string</span>; }   <span class="hl-c">// name 可选</span>
<span class="hl-k">interface</span> <span class="hl-t">Admin</span> <span class="hl-k">extends</span> <span class="hl-t">User</span> { role: <span class="hl-s">"admin"</span>; }                 <span class="hl-c">// 继承</span></code></pre></article><article class="sx-item"><h3><code>readonly / 可选属性</code></h3><p class="sx-what"><b>readonly</b>：创建后不能改；<b>?</b>：可以没有这个字段。</p><pre class="code"><code><span class="hl-k">type</span> <span class="hl-t">Favorite</span> = {
  <span class="hl-k">readonly</span> id: <span class="hl-k">number</span>;   <span class="hl-c">// 编号创建后不能改</span>
  word: <span class="hl-k">string</span>;
  status?: <span class="hl-k">string</span>;       <span class="hl-c">// 可以没有</span>
};
<span class="hl-k">const</span> f: <span class="hl-t">Favorite</span> = { id: 1, word: <span class="hl-s">"abandon"</span> };
f.id = 2;   <span class="hl-c">// ❌ 只读</span></code></pre></article><article class="sx-item"><h3><code>函数类型</code></h3><p class="sx-what">描述“一个函数接收什么、返回什么”，常用于回调和依赖。</p><pre class="code"><code><span class="hl-k">type</span> <span class="hl-t">GoogleVerifier</span> = (idToken: <span class="hl-k">string</span>) =&gt; <span class="hl-t">Promise</span>&lt;<span class="hl-t">GoogleUser</span> | <span class="hl-k">null</span>&gt;;
<span class="hl-c">// 读法：一个函数，参数是字符串，返回一个 Promise，里面是 GoogleUser 或 null</span>

<span class="hl-c">// 测试里可以塞一个假的进去，类型对得上就行：</span>
<span class="hl-k">const</span> fakeGoogle: <span class="hl-t">GoogleVerifier</span> = <span class="hl-k">async</span> (t) =&gt; (t.startsWith(<span class="hl-s">"google:"</span>) ? { sub: t } <span class="hl-k">as</span> <span class="hl-t">GoogleUser</span> : <span class="hl-k">null</span>);</code></pre></article></div></section><section class="sx-sec" id="ts-union"><h2>联合类型与收窄</h2><p class="sx-desc">TypeScript 最好用的能力：值只能是几种之一，并且在 if 里自动“收窄”。</p><div class="sx-grid"><article class="sx-item"><h3><code>联合类型 |</code></h3><p class="sx-what">值是几种类型之一。配合字面量，能把“只能是这几个字”写进类型里。</p><pre class="code"><code><span class="hl-k">type</span> <span class="hl-t">Kind</span> = <span class="hl-s">"w"</span> | <span class="hl-s">"p"</span>;               <span class="hl-c">// 只能是这两个字</span>
<span class="hl-k">type</span> <span class="hl-t">Site</span> = <span class="hl-s">"ielts"</span> | <span class="hl-s">"jlpt"</span>;
<span class="hl-k">let</span> k: <span class="hl-t">Kind</span> = <span class="hl-s">"w"</span>;
k = <span class="hl-s">"g"</span>;                             <span class="hl-c">// ❌ 编辑器直接报错</span>
<span class="hl-k">type</span> <span class="hl-t">Result</span> = { ok: <span class="hl-k">true</span>; data: <span class="hl-k">string</span> } | { ok: <span class="hl-k">false</span>; error: <span class="hl-k">string</span> };</code></pre></article><article class="sx-item"><h3><code>as const + typeof 推导</code></h3><p class="sx-what">从一个常量数组<b>推导</b>出联合类型，改规则只改一处。我们后端就是这么写的。</p><pre class="code"><code><span class="hl-k">const</span> <span class="hl-t">KINDS</span> = [<span class="hl-s">"w"</span>, <span class="hl-s">"p"</span>] <span class="hl-k">as</span> <span class="hl-k">const</span>;     <span class="hl-c">// as const：当成固定不变的字面量</span>
<span class="hl-k">type</span> <span class="hl-t">Kind</span> = (<span class="hl-k">typeof</span> <span class="hl-t">KINDS</span>)[<span class="hl-k">number</span>];    <span class="hl-c">// 推导出 "w" | "p"</span>
<span class="hl-c">// 以后加一个类型，只改上面那个数组，类型自动跟着变</span></code></pre></article><article class="sx-item"><h3><code>类型守卫 v is T</code></h3><p class="sx-what">自己写一个检查函数，告诉 TS：“如果我返回 true，这个值就是某种类型”。</p><pre class="code"><code><span class="hl-k">const</span> isKind = (v: <span class="hl-k">unknown</span>): v is <span class="hl-t">Kind</span> =&gt; <span class="hl-t">KINDS</span>.includes(v <span class="hl-k">as</span> <span class="hl-t">Kind</span>);

<span class="hl-k">function</span> save(kind: <span class="hl-k">unknown</span>) {
  <span class="hl-k">if</span> (!isKind(kind)) <span class="hl-k">return</span>;   <span class="hl-c">// 不合格就走</span>
  kind;                        <span class="hl-c">// ← 这里 TS 已经知道它是 "w" | "p"</span>
}</code></pre><p class="sx-tip"><b>记住</b>unknown 进来、守卫检查、收窄成确定类型，是处理外部数据的标准三步。</p></article><article class="sx-item"><h3><code>typeof / in / instanceof 收窄</code></h3><p class="sx-what">TS 能看懂这些判断，判断之后自动缩小类型范围。</p><pre class="code"><code><span class="hl-k">function</span> show(x: <span class="hl-k">string</span> | <span class="hl-k">number</span>) {
  <span class="hl-k">if</span> (<span class="hl-k">typeof</span> x === <span class="hl-s">"string"</span>) <span class="hl-k">return</span> x.toUpperCase();  <span class="hl-c">// 这里 x 是 string</span>
  <span class="hl-k">return</span> x.toFixed(2);                                <span class="hl-c">// 这里 x 是 number</span>
}
