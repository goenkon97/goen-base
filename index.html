<h2>五 · 安全：最该记住的三件事（面试会问）</h2>
<div class="grid">
<section class="card"><h3><span class="n">1</span>userId 只来自 token</h3><svg viewBox="0 0 320 118" role="img" aria-label="userId 来自 token"><g class="wob"><rect class="s fr" x="10" y="20" width="132" height="54" rx="8"/><rect class="s fg" x="178" y="20" width="132" height="54" rx="8"/></g><text x="76" y="42" text-anchor="middle" class="zh" style="font-size:12.0px">前端传 userId=2</text><text x="76" y="60" text-anchor="middle" class="zh bad" style="font-size:12.0px">✗ 不信</text><text x="244" y="42" text-anchor="middle" class="zh" style="font-size:12.0px">token 里的 userId</text><text x="244" y="60" text-anchor="middle" class="zh good" style="font-size:12.0px">✓ 只信这个</text><text x="10" y="104" class="cap">前端的任何东西都可以被改。只有签过名的 token 改不了。</text></svg><ul><li>前端发来的请求，用 curl 就能随便改。所以前端传的 userId 谁也不能信。</li><li>门卫验过 token 后放进请求的 userId，才是可信的。</li></ul><p class="one">否则改一个数字，就能看到别人的收藏。</p></section>
<section class="card"><h3><span class="n">2</span>删改都要带上 user_id</h3><svg viewBox="0 0 320 116" role="img" aria-label="按 id 和 user_id 查询"><g class="wob"><rect class="s fw" x="10" y="20" width="300" height="40" rx="8"/></g><text x="160" y="46" text-anchor="middle" class="zh" style="font-size:10.4px">DELETE FROM favorite WHERE id = ? AND user_id = ?</text><text x="10" y="84" class="cap">只写 id：别人的 id 也能删掉。</text><text x="10" y="102" class="cap">加上 user_id：不是自己的，匹配不到，什么都不会发生。</text></svg><ul><li>不管删除还是修改，查询条件都是“编号 + 用户”两个一起。</li><li>这类漏洞有名字：IDOR，不安全的直接对象引用。</li></ul><p class="one">“是我的”这件事，必须在数据库查询里就写清楚。</p></section>
<section class="card"><h3><span class="n">3</span>密钥不进代码</h3><svg viewBox="0 0 320 120" role="img" aria-label="密钥放环境变量"><g class="wob"><rect class="s fw" x="10" y="20" width="132" height="62" rx="8" stroke-dasharray="6 5"/><rect class="s fy" x="178" y="20" width="132" height="62" rx="8"/></g><text x="76" y="42" text-anchor="middle" class="zh" style="font-size:12.0px">GitHub / 代码</text><text x="76" y="62" text-anchor="middle" class="zh bad" style="font-size:12.0px">✗ 不放密钥</text><text x="244" y="42" text-anchor="middle" class="zh" style="font-size:12.0px">环境变量</text><text x="244" y="62" text-anchor="middle" class="zh good" style="font-size:12.0px">✓ 放这里</text><text x="10" y="106" class="cap">上线前：换一把新的随机密钥，不要用代码里的默认值。</text></svg><ul><li>签名密钥泄露 = 任何人能伪造任何用户的通行证。</li><li>开发时用一个本地默认值没关系，上线必须换成长而随机的真密钥。</li></ul><p class="one">Java 版的小隐患：忘了设就会悄悄用公开的默认值。Node 版改成直接拒绝启动。</p></section>
</div>
<h2>六 · Java 版做完后，我们发现的小问题</h2>
<div class="grid">
<section class="card"><h3><span class="n">1</span>为什么后来又写了 Node 版</h3><svg viewBox="0 0 320 136" role="img" aria-label="Java 进程 → 免费托管 → 再次访问"><g class="wob"><rect class="s fy" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fr" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fr" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">Java 进程</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">一直开着</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">免费托管</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">闲置就休眠</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">再次访问</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">等几十秒</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">不是 Java 不好，而是它和“免费 + 随时可用”不太搭</text></svg><ul><li>Java 后端是一个常驻进程，启动慢、占内存多。免费托管闲置后会让它休眠，下次访问要等它重新启动。</li><li>Node.js 后端更轻，能放进 Vercel 这类“来了才醒”的平台，而且和前端是同一种语言。</li></ul><p class="one">两套都保留：Java 当作演示，Node 版真正上线。</p></section>
<section class="card"><h3><span class="n">2</span>代码层面的 4 个小遗憾</h3><div class="scroll"><table class="tb"><tr><th>问题</th><th>Node 版怎么改</th></tr><tr><td>先查再存：同时点两下可能存成两条</td><td>直接插入，让数据库的唯一约束兜底</td></tr><tr><td>只能做一个网站</td><td>加 <code>site</code> 列，英语和日语共用后端</td></tr><tr><td>改不存在的收藏返回空</td><td>返回标准的 404</td></tr><tr><td>没设密钥会用公开默认值</td><td>生产环境没设直接拒绝启动</td></tr></table></div><ul><li>这些都是做完之后复盘才发现的，很正常。</li><li>每一条都能在面试里讲成“我发现了什么、怎么改的”。</li></ul><p class="one">能说出自己代码的不足，比说“我的很完美”更可信。</p></section>
</div>

<div class="grid">
<section class="card full"><h3>全栈的地图</h3><div class="scroll"><table class="tb"><tr><th>层</th><th>你亲手做过的</th></tr><tr><td>前端</td><td>Vue 页面、fetch 调接口、localStorage 存 token、Google 登录按钮</td></tr><tr><td>后端</td><td>接口（CRUD）、校验、登录、门卫、CORS、配置、密钥</td></tr><tr><td>数据库</td><td>表设计、一对多、Entity/Repository、唯一约束、索引</td></tr><tr><td>安全</td><td>JWT、userId 来自 token、IDOR、密钥管理</td></tr><tr><td>上线</td><td>域名、HTTPS、环境变量、数据库换成线上的</td></tr></table></div><ul><li>每一行都能对应到你项目里真实的一段代码。</li><li>面试时，从“用户点一下收藏”讲到“数据存进哪张表”，就是一个完整的全栈故事。</li></ul><p class="one">不需要背细节，要能顺着一次请求，把整条路讲出来。</p></section>

<h1>Node.js 后端：同样的功能，换一套工具重写</h1>
<p class="lead">这是我们用 Node.js + TypeScript 把收藏后端重写并上线的全过程：先定契约、再一层层搭、测试、部署，以及每个文件对应 Java 版里的谁。每张卡只讲一件事。</p>
<h2>一 · 先看全貌：同一个后端，换了一套工具重写</h2>
<div class="grid">
<section class="card full"><h3>线上现在长这样</h3><svg viewBox="0 0 640 136" role="img" aria-label="前端页面 → Vercel → Neon"><g class="wob"><rect class="s fb" x="10.0" y="20" width="189.3" height="70" rx="9"/><path class="s" d="M201.3 55 h20" marker-end="url(#ah)"/><rect class="s fy" x="225.3" y="20" width="189.3" height="70" rx="9"/><path class="s" d="M416.7 55 h20" marker-end="url(#ah)"/><rect class="s fg" x="440.7" y="20" width="189.3" height="70" rx="9"/></g><g><text x="104.7" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">前端页面</text><text x="104.7" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">ielts / jlpt</text><text x="104.7" y="79" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">网站</text></g><g><text x="320.0" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">Vercel</text><text x="320.0" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">Express 后端</text><text x="320.0" y="79" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">来了才醒</text></g><g><text x="535.3" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">Neon</text><text x="535.3" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">PostgreSQL</text><text x="535.3" y="79" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">线上数据库</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L622,108"/></circle><text x="10" y="128" class="cap">手机、电脑登录同一个账号，看到的是同一份收藏，因为数据在线上的 Neon 里</text></svg><ul><li>接口和 Java 版<b>完全一样</b>（POST /auth/google、GET /favorites……），所以英语站前端几乎不用改。</li><li>英语站和日语站共用这一个后端、这一个数据库，用表里的 <code>site</code> 列区分。</li></ul><p class="one">契约不变，换掉的只是里面的零件。</p></section>
</div>
<h2>二 · Java ↔ Node：每个零件对应什么</h2>
<p class="sec">你已经学过 Java 版，这张对照表就是“翻译词典”。看到 Node 的东西，想想它在 Java 里是谁。</p>
<div class="grid">
<section class="card full"><h3>一对一翻译表</h3><div class="scroll"><table class="tb"><tr><th>Java 世界</th><th>Node 世界</th><th>它是干嘛的</th></tr><tr><td>Java</td><td>TypeScript（运行在 Node.js 上）</td><td>写代码用的语言和运行环境</td></tr><tr><td>Spring Boot</td><td>Express</td><td>接请求、分发给处理函数的 Web 框架</td></tr><tr><td>@RestController 类</td><td>Router + 处理函数</td><td>一组相关接口放一起</td></tr><tr><td>HandlerInterceptor（门卫）</td><td>中间件 requireAuth</td><td>请求到达接口之前的统一检查</td></tr><tr><td>application.properties + @Value</td><td>环境变量 + config.ts</td><td>配置和密钥</td></tr><tr><td>@Entity + JpaRepository</td><td>Drizzle 的 schema + 查询</td><td>表的描述和数据库读写</td></tr><tr><td>依赖注入（Spring 自动）</td><td>Deps 清单（手动传）</td><td>把数据库等零件递给需要的人</td></tr><tr><td>Maven + pom.xml</td><td>npm + package.json</td><td>装依赖、跑脚本</td></tr><tr><td>H2 文件库</td><td>PGlite（本地）· Neon（线上）</td><td>存数据的数据库</td></tr><tr><td>JUnit + MockMvc</td><td>Vitest + supertest</td><td>自动化测试</td></tr><tr><td>Tomcat 一请求一线程</td><td>单线程 + async/await</td><td>同时处理很多请求的方式</td></tr></table></div><ul><li>想法几乎一样：接请求 → 检查 → 查数据库 → 返回 JSON。差别在“零件的名字”和“谁来接线”。</li><li>最大的概念差别：Node 只有一个主线程。访问数据库要等，等的时候它去处理别的请求，这就是 <code>async/await</code> 的用处。</li></ul><p class="one">学会一套，另一套换名字就能上手。</p></section>
</div>
<h2>三 · 我们是怎么一步步做出来的</h2>
<p class="sec">这次是“重写”，所以先定死接口，再从底往上一层层搭，每搭一层就验证一层。</p>
<div class="grid">
<section class="card"><h3><span class="n">1</span>先定契约：接口不能变</h3><svg viewBox="0 0 320 136" role="img" aria-label="英语站前端 → 同样的接口 → 新后端"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">英语站前端</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">不想改</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">同样的接口</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:8.2px" fill-opacity=".85">路径 · 入参 · 出参</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">新后端</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">随便换零件</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">契约是前后端之间的合同</text></svg><p class="why"><b>要做的事：</b>用 Node.js + TypeScript 重写，而且前端不用大改。</p><ul><li>把 Java 版每个接口的路径、请求体、返回、错误码列出来，新后端照着做。</li><li>只加不改：多出来的 <code>site</code>、<code>/health</code> 都是可选的，老前端不传也能用。</li></ul><p class="one">接口一旦被前端用上，就不能随便改。</p></section>
<section class="card"><h3><span class="n">2</span>搭项目：npm + TypeScript</h3><svg viewBox="0 0 320 136" role="img" aria-label="npm init → 装依赖 → tsconfig"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">npm init</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">package.json</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">装依赖</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">express 等</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">tsconfig</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">写 TS</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">package.json = pom.xml</text></svg><p class="why"><b>遇到的问题：</b>Java 的类型在运行时还在，TS 的不在。</p><ul><li><code>package.json</code> 列出用了哪些库和能跑哪些命令（<code>npm run dev</code>、<code>npm test</code>）。</li><li>TypeScript 的类型只在写代码时帮你检查，运行时不存在。所以<b>前端发来的数据还是要手动检查</b>。</li></ul><p class="one">TS 帮你写对，不帮你防坏人。</p></section>
<section class="card"><h3><span class="n">3</span>读配置：config.ts</h3><svg viewBox="0 0 320 136" role="img" aria-label="环境变量 → config.ts → 别处"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">环境变量</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">密钥 · 地址</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">config.ts</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">集中读取</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">别处</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">只从这拿</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">所有“配置项”只看这一个文件</text></svg><p class="why"><b>要做的事：</b>密钥和数据库地址不能写进代码。</p><ul><li>环境变量是操作系统递给进程的“名字=值”。本地放 <code>.env</code> 文件，线上放 Vercel 的设置页。</li><li>上线时如果没设 <code>APP_JWT_SECRET</code>（或太短），程序直接拒绝启动。</li></ul><p class="one">宁可起不来，也不要带着不安全的状态上线。</p></section>
<section class="card"><h3><span class="n">4</span>数据库：schema → SQL → Neon</h3><svg viewBox="0 0 320 136" role="img" aria-label="schema.ts → drizzle-kit → migrate"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">schema.ts</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">描述表</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.4px">drizzle-kit</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">生成 SQL</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">migrate</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">执行到 Neon</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">建表语句是看得见的文件，不是偷偷改</text></svg><p class="why"><b>遇到的问题：</b>要用线上数据库，手机也能访问同一份数据。</p><ul><li>Java 是启动时自动改表；这里是先生成一个 <code>0000_init.sql</code> 文件，再执行。上线后有真实数据，这样更安全。</li><li>我们在 Neon 注册了免费库，复制 <code>DATABASE_URL</code>，放进 <code>.env</code>。</li></ul><p class="one">改了 schema.ts 不会自动改数据库，要 generate 再 migrate。</p></section>
<section class="card"><h3><span class="n">5</span>登录：google.ts + jwt.ts</h3><svg viewBox="0 0 320 136" role="img" aria-label="核对证明书 → 找或建用户 → 发 JWT"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">核对证明书</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">Google 官方库</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">找或建用户</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">冲突就跳过</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">发 JWT</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">jose · 7 天</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">routes/auth.ts 把三步串起来</text></svg><ul><li>逻辑和 Java 版一样。区别：找或建用户时，先“尝试插入、冲突就跳过”，再查。同时点两下也只会有一个用户。</li><li>JWT 用 <code>jose</code> 库签发，HS256，7 天有效，里面只放用户编号。</li></ul><p class="one">同样的流程，把“先查再存”的空隙补上了。</p></section>
<section class="card"><h3><span class="n">6</span>门卫：middleware.ts</h3><svg viewBox="0 0 320 136" role="img" aria-label="请求 → requireAuth → 处理函数"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">请求</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">Bearer token</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.4px">requireAuth</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">验 token</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">处理函数</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">取 userId</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">没 token → 401，处理函数不会被执行</text></svg><ul><li>中间件是个带 <code>next</code> 的函数：放行就调用 <code>next()</code>，拦住就直接回复 401。</li><li>验过的用户编号放在这次请求自带的小口袋 <code>res.locals.userId</code> 里，别人改不了。</li></ul><p class="one">和 Java 的 Interceptor 做的是同一件事。</p></section>
<section class="card"><h3><span class="n">7</span>收藏：routes/favorites.ts</h3><svg viewBox="0 0 320 136" role="img" aria-label="GET → POST → PUT → DELETE"><g class="wob"><rect class="s fb" x="10.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M72.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="90.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M152.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="170.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fp" x="250.0" y="20" width="60.0" height="70" rx="9"/></g><g><text x="40.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">GET</text><text x="40.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">查</text></g><g><text x="120.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">POST</text><text x="120.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">增</text></g><g><text x="200.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">PUT</text><text x="200.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">改</text></g><g><text x="280.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">DELETE</text><text x="280.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">删</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">都带 WHERE user_id = 自己</text></svg><ul><li>新增时直接插入，撞上唯一约束就返回已有那条。删和改的条件是 <code>id 和 user_id 都对</code>。</li><li>比 Java 版多了：<code>site</code> 区分英语/日语；<code>kind</code> 不传默认 <code>w</code>；输入长度有上限。</li></ul><p class="one">数据层的规则，交给数据库的约束去兜底。</p></section>
<section class="card"><h3><span class="n">8</span>装配：create-app.ts</h3><svg viewBox="0 0 320 136" role="img" aria-label="cors → json → 路由 → 错误处理"><g class="wob"><rect class="s fb" x="10.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M72.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="90.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M152.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="170.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fr" x="250.0" y="20" width="60.0" height="70" rx="9"/></g><g><text x="40.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">cors</text><text x="40.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">放行条</text></g><g><text x="120.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">json</text><text x="120.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">解析请求体</text></g><g><text x="200.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">路由</text><text x="200.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">接口</text></g><g><text x="280.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">错误处理</text><text x="280.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">兜底 500</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">从上到下，就是请求经过的顺序</text></svg><ul><li>Express 没有自动扫描，所有环节你亲手按顺序 <code>app.use(...)</code> 挂上去。</li><li><code>createApp(deps)</code> 接收零件清单：线上递真数据库，测试递内存数据库，同一套代码。</li></ul><p class="one">顺序就是流程，所以顺序很重要。</p></section>
<section class="card"><h3><span class="n">9</span>测试：22 个自动化检查</h3><svg viewBox="0 0 320 136" role="img" aria-label="makeApp → 假 Google → 发请求"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">makeApp</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">内存数据库</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">假 Google</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">google:alice</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">发请求</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">supertest</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">不用联网、不用真账号</text></svg><ul><li>测了登录、收藏增删改查、别人不能删我的、CORS、各种坏输入。改完代码跑一次 <code>npm test</code>。</li><li>数据库用 PGlite，是在进程里运行的真 PostgreSQL，和线上行为一致。</li></ul><p class="one">测试通过，才敢推上线。</p></section>
<section class="card"><h3><span class="n">10</span>本地联调：三个东西同时开</h3><svg viewBox="0 0 320 136" role="img" aria-label="前端 → 后端 → Neon"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">前端</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:9.8px" fill-opacity=".85">localhost:5500</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">后端</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:9.8px" fill-opacity=".85">localhost:8080</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">Neon</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">线上库</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">本地后端也可以直接连线上数据库</text></svg><ul><li>前端用 Live Server 开在 5500；后端 <code>npm run dev</code> 开在 8080；<code>.env</code> 里有 <code>DATABASE_URL</code> 就连 Neon。</li><li>遇到过的坑：旧的后端进程还占着 8080，新的起不来；要用 <code>localhost</code> 而不是 <code>127.0.0.1</code> 才能通过 Google 授权。</li></ul><p class="one">每个坑都是“哪个进程占了端口 / 哪个地址没登记”。</p></section>

<h2>六 · 线上和本地，为什么入口不一样</h2>
<div class="grid">
<section class="card full"><h3>常驻进程 vs 来了才醒</h3><div class="scroll"><table class="tb"><tr><th></th><th>Java / 本地 dev</th><th>Vercel 线上</th></tr><tr><td>运行方式</td><td>一个进程一直开着，占端口 8080</td><td>没请求时暂停，请求来了才唤醒</td></tr><tr><td>入口</td><td><code>listen(8080)</code></td><td>只 <code>export default app</code>，端口平台管</td></tr><tr><td>数据库连接</td><td>长连接 + 连接池</td><td>每条 SQL 一次 HTTPS 请求（neon-http）</td></tr><tr><td>闲置后第一次</td><td>进程一直活着，很快</td><td>冷启动，要多等几秒</td></tr></table></div><ul><li>这就是为什么页面一打开要先悄悄请求 <code>/health</code>：让它在你点收藏之前就醒来。</li><li>代价：<code>neon-http</code> 驱动不支持事务。我们现在每个接口只做一条语句，用不到。</li></ul><p class="one">不是 Node 比 Java 快，而是这种平台只按“用的时候”计费，闲置时就让你睡。</p></section>
</div>
<h2>七 · 比 Java 版多想的地方（面试加分）</h2>
<div class="grid">
<section class="card full"><h3>改进清单</h3><div class="scroll"><table class="tb"><tr><th>改进</th><th>为什么</th></tr><tr><td>登录、收藏都“先尝试插入，冲突不管”</td><td>同时点两下，也不会出现重复用户或重复收藏</td></tr><tr><td>联合唯一索引（用户+站点+类型+词）</td><td>重复由数据库拒绝，比代码里检查更可靠</td></tr><tr><td>外键 + 删除级联</td><td>用户被删，收藏跟着删，不留孤儿数据</td></tr><tr><td>返回字段里没有 userId</td><td>前端不需要，也不该知道</td></tr><tr><td>PUT 只改传了的字段</td><td>前端只传一个时，另一个不会被改成空</td></tr><tr><td>改不存在的收藏返回 404</td><td>比返回空更明确</td></tr><tr><td>长度上限 + 请求体 10KB 上限</td><td>挡住垃圾数据和超大请求</td></tr><tr><td>生产环境没密钥就拒绝启动</td><td>不让不安全的状态上线</td></tr></table></div><ul><li>每一条都对应一个“可能出事的场景”。面试时说场景，比说技术名词更有说服力。</li></ul><p class="one">能讲清“为什么这样写”，比写出来更重要。</p></section>
</div>

<h1>日语站：登录 + 收藏，是怎么接上后端的</h1>
<p class="lead">这次我们给日语学习站加了 Google 登录和收藏（单词、语法）。重点是：后端几乎没改，因为表当初就设计成能放多个站、多种类型。每张卡片说清一件事。</p>
<h2>一 · 先看全貌：日语站接上了同一个后端</h2>
<div class="grid">
<section class="card full"><h3>现在两个站是这样连的</h3><svg viewBox="0 0 640 136" role="img" aria-label="英语站 → 日语站 → 同一个后端 → 同一个数据库"><g class="wob"><rect class="s fb" x="10.0" y="20" width="135.5" height="70" rx="9"/><path class="s" d="M147.5 55 h20" marker-end="url(#ah)"/><rect class="s fy" x="171.5" y="20" width="135.5" height="70" rx="9"/><path class="s" d="M309.0 55 h20" marker-end="url(#ah)"/><rect class="s fg" x="333.0" y="20" width="135.5" height="70" rx="9"/><path class="s" d="M470.5 55 h20" marker-end="url(#ah)"/><rect class="s fp" x="494.5" y="20" width="135.5" height="70" rx="9"/></g><g><text x="77.8" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">英语站</text><text x="77.8" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">ielts.goenkon.com</text><text x="77.8" y="79" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">网站</text></g><g><text x="239.2" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">日语站</text><text x="239.2" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">jlpt.goenkon.com</text><text x="239.2" y="79" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">这次接上</text></g><g><text x="400.8" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">同一个后端</text><text x="400.8" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">Vercel · Express</text></g><g><text x="562.2" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">同一个数据库</text><text x="562.2" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">Neon</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L622,108"/></circle><text x="10" y="128" class="cap">一个后端、一个数据库、一个 Google 账号，服务两个网站</text></svg><ul><li>同一个账号登录两个站都行；但收藏<b>各看各的</b>：数据库里每条收藏记着它属于哪个站（<code>site</code> 列）。</li><li>这次我们<b>没有新建后端项目、没有新建表</b>，只在后端改了一行，其余全是日语站前端的工作。</li></ul><p class="one">后端不用重建，因为当初表就是按“多个站、多种类型”设计的。</p></section>

<h2>二 · 为什么后端只改了一行</h2>
<p class="sec">答案在表的设计里。所有人、所有站、所有类型的收藏，都放在同一张 favorite_word 表，靠三列区分。</p>
<div class="grid">
<section class="card full"><h3>favorite_word 表里长这样</h3><div class="scroll"><table class="tb"><tr><th>user_id</th><th>site</th><th>kind</th><th>word</th></tr><tr><td>1</td><td>ielts</td><td>w（单词）</td><td>accommodation</td></tr><tr><td>1</td><td>ielts</td><td>p（短语）</td><td>on the other hand</td></tr><tr><td>1</td><td>jlpt</td><td>w（单词）</td><td>確認する</td></tr><tr><td>1</td><td>jlpt</td><td>g（语法）</td><td>〜に違いない</td></tr><tr><td>2</td><td>jlpt</td><td>w（单词）</td><td>慰める</td></tr></table></div><ul><li><b>user_id</b> 说明这条是谁的；<b>site</b> 说明是哪个站的；<b>kind</b> 说明是什么类型；<b>word</b> 就是一段文字。</li><li>语法的文型也是一段文字，所以放得进 <code>word</code> 这一列，<b>表结构一点都不用改</b>。</li><li>联合唯一约束是 (user_id, site, kind, word)：同一个人在同一个站，同样的东西只能收藏一次。</li></ul><p class="one">表设计对了，后面加功能就像加一个字母。</p></section>
</div>
<h2>三 · 这次我们一步步做了什么</h2>
<div class="grid">
<section class="card"><h3><span class="n">1</span>后端：放行“语法”这个类型</h3><svg viewBox="0 0 320 136" role="img" aria-label="前端发来 → 后端校验 → 数据库"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">前端发来</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">kind: "g"</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">后端校验</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">isKind 白名单</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">照存不误</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">KINDS = ["w", "p", "g"]</text></svg><p class="why"><b>要做的事：</b>日语站要收藏语法，后端得认识这个类型。</p><ul><li>后端有一份“允许的类型”清单。以前是 w 单词、p 短语，现在加上 <b>g 语法</b>，校验就放行了。</li><li>为什么要有清单：不能让前端随便塞一个乱七八糟的类型进数据库。<b>白名单</b>是最常用的防乱写办法。</li><li>顺手加了 1 个自动化测试，现在一共 23 个，全部通过。</li></ul><p class="one">改的是“规则清单”，不是表。</p></section>
<section class="card"><h3><span class="n">2</span>前端：登录，照着英语站搬</h3><svg viewBox="0 0 320 136" role="img" aria-label="Google 按钮 → 后端核对 → 拿到 token"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">Google 按钮</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">点一下</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">后端核对</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">/auth/google</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">拿到 token</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">存 jlpt_token</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">流程和英语站一模一样</text></svg><p class="why"><b>要做的事：</b>让日语站也有账号。</p><ul><li>Google 的证明书发给后端核对，后端返回<b>我们自己的 token</b>，前端存进浏览器。刷新页面时，带着 token 问后端“我是谁”，就恢复登录。</li><li>token 在浏览器里的名字改成 <code>jlpt_token</code>，和英语站的分开存，互不干扰。</li><li>Google 控制台要加上日语站的域名（你已经加好了），否则按钮会报错。</li></ul><p class="one">同一套流程，复制过来改几个名字。</p></section>
<section class="card"><h3><span class="n">3</span>前端：点书签，页面先变，后台再确认</h3><svg viewBox="0 0 320 136" role="img" aria-label="点书签 → 发请求 → 成功就保留"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">点书签</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">图标立刻变红</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">发请求</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">带 token</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">成功就保留</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">失败就改回来</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">这叫“先显示，再确认”</text></svg><p class="why"><b>要做的事：</b>每一项都能收藏、取消收藏。</p><ul><li>如果等后端回复再变，用户会觉得卡一下。所以<b>先在页面上变</b>，同时发请求；请求失败再改回去并提示。</li><li>为了防止连点两下发出两个请求，用一个小记号记着“这一条正在处理”。</li><li>同义词里每一组有三个单词，<b>每个单词右边各有自己的书签</b>；语法和 N2 词汇每一项也各有一个。</li></ul><p class="one">让人感觉快，同时不骗人。</p></section>
<section class="card"><h3><span class="n">4</span>前端：收藏本里怎么显示完整内容</h3><svg viewBox="0 0 320 136" role="img" aria-label="后端只存 → 按文字查词库 → 画成完整卡片"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">后端只存</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">那一段文字</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">按文字查词库</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">页面本地</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">画成完整卡片</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">例句 · 解析</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">数据库存得少，页面显示得多</text></svg><p class="why"><b>要做的事：</b>收藏本像英语站一样横着排下去，并带例句和解析。</p><ul><li>后端只记“谁收藏了哪段文字”，释义、例句、解析都在网页自己带的词库里。收藏本用这段文字去词库里<b>找回完整内容</b>。</li><li>好处：数据库很小；以后词库更新，收藏本里的内容也自动更新。</li><li>不分类了，改成一条条竖着排，每页 10 条，加分页器。</li></ul><p class="one">后端只管“谁收藏了什么”，内容留在前端。</p></section>
<section class="card"><h3><span class="n">5</span>没真的登录，怎么提前测</h3><svg viewBox="0 0 320 136" role="img" aria-label="假后端 → 真页面 → 点一遍"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">假后端</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">测试里造一个</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">真页面</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">手机宽度打开</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">点一遍</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:8.2px" fill-opacity=".85">收藏 · 取消 · 翻页</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">用电脑模拟，先排除明显的错</text></svg><p class="why"><b>遇到的问题：</b>我没法替你真的点 Google 登录。</p><ul><li>我在电脑上用浏览器自动化工具打开页面，再拦截对后端的请求，给它一个<b>假后端</b>。这样不用真的登录，也能测点书签、取消、分页、刷新后恢复登录。</li><li>能测出写错的代码，但测不了真实的 Google 登录和线上数据库，所以最后要你线上再试一遍（你已经试过，没问题）。</li></ul><p class="one">先在家里排练，再上真舞台。</p></section>
<section class="card"><h3><span class="n">6</span>顺手修了两个手机/iPad 显示问题</h3><svg viewBox="0 0 320 136" role="img" aria-label="iPad 横屏 → iPhone 横屏 → 原因"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">iPad 横屏</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">两边空白</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">iPhone 横屏</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">两侧有条边</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">原因</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">浏览器给的宽度</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">都不是 CSS 写错，是浏览器行为</text></svg><p class="why"><b>遇到的问题：</b>电脑上看着没事，iPad 和手机上不对。</p><ul><li><b>iPad 的 Chrome</b> 横屏时，把页面“排版宽度”定在约 900px，屏幕却更宽。我们在 iPad 横屏时让它按真实屏幕宽度排版。</li><li><b>iPhone 横屏</b> 时，刘海两侧各留一条页面画不进去的区域，浏览器用页面底色填。我们让页面背景和那个底色变成同一种纯色，就看不出分界。</li><li>这些改法都记进了记忆，方便你让其他两个会话照着改。</li></ul><p class="one">遇到“只有某台设备不对”，先怀疑是设备的行为，不要先怀疑自己的代码。</p></section>
</div>
<h2>四 · 点一次书签，到底发生了什么</h2>

<section class="card full"><h3>一次收藏的完整旅程</h3><svg viewBox="0 0 640 136" role="img" aria-label="浏览器 → 带 token 请求 → 后端门卫 → 数据库 → 返回编号"><g class="wob"><rect class="s fb" x="10.0" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M115.2 55 h20" marker-end="url(#ah)"/><rect class="s fy" x="139.2" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M244.4 55 h20" marker-end="url(#ah)"/><rect class="s fg" x="268.4" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M373.6 55 h20" marker-end="url(#ah)"/><rect class="s fp" x="397.6" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M502.8 55 h20" marker-end="url(#ah)"/><rect class="s fr" x="526.8" y="20" width="103.2" height="70" rx="9"/></g><g class="a-st" style="animation-delay:0.0s"><text x="61.6" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">浏览器</text><text x="61.6" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">toggleFav</text></g><g class="a-st" style="animation-delay:1.2s"><text x="190.8" y="46" text-anchor="middle" class="zh" style="font-size:13.5px">带 token 请求</text><text x="190.8" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">POST /favorites</text></g><g class="a-st" style="animation-delay:2.4s"><text x="320.0" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">后端门卫</text><text x="320.0" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">验 token</text></g><g class="a-st" style="animation-delay:3.6s"><text x="449.2" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">数据库</text><text x="449.2" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">INSERT</text></g><g class="a-st" style="animation-delay:4.8s"><text x="578.4" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">返回编号</text><text x="578.4" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">页面记下</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L622,108"/></circle><text x="10" y="128" class="cap">日语站发的请求里多带了 site: "jlpt" 和 kind: "w" 或 "g"</text></svg><ul><li><b>用户编号不是前端传的</b>：后端从 token 里取出来。所以别人没法冒充你收藏。</li><li>取消收藏是 <code>DELETE /favorites/编号</code>，后端用“编号 + 用户编号”一起找，别人的收藏碰不到。</li><li>你可以试着不看笔记，用自己的话把这条线从头讲一遍；卡住的地方就是要补的。</li></ul><p class="one">能讲清这条线，登录、收藏、安全三个概念就都串起来了。</p></section>

<section class="card full"><h3>三句话</h3><svg viewBox="0 0 640 136" role="img" aria-label="场景 → 做法 → 收获"><g class="wob"><rect class="s fb" x="10.0" y="20" width="189.3" height="70" rx="9"/><path class="s" d="M201.3 55 h20" marker-end="url(#ah)"/><rect class="s fy" x="225.3" y="20" width="189.3" height="70" rx="9"/><path class="s" d="M416.7 55 h20" marker-end="url(#ah)"/><rect class="s fg" x="440.7" y="20" width="189.3" height="70" rx="9"/></g><g><text x="104.7" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">场景</text><text x="104.7" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">两个学习网站</text></g><g><text x="320.0" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">做法</text><text x="320.0" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">共用一套后端</text></g><g><text x="535.3" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">收获</text><text x="535.3" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">设计对了很省事</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L622,108"/></circle><text x="10" y="128" class="cap">每一句都能展开讲</text></svg><ul><li><b>场景：</b>我有英语和日语两个学习网站，需要同一个账号、云端收藏，手机和电脑同步。</li><li><b>做法：</b>两个站共用一个 Node 后端和一个数据库，表里用 site、kind 两列区分；日语站接入时，后端只加了一个类型，不用新建项目和表。</li><li><b>收获：</b>前期把表设计成“多站点、多类型”，后面扩展的成本很低；我也做了测试和安全检查（用户编号只来自 token、类型用白名单）。</li></ul><p class="one">讲得出“为什么这样设计”，比讲“用了什么”更打动人。</p></section>

lass="wob"><rect class="s fb" x="10.0" y="20" width="140.0" height="70" rx="9"/><path class="s" d="M152.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="170.0" y="20" width="140.0" height="70" rx="9"/><path class="s" d="M312.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="330.0" y="20" width="140.0" height="70" rx="9"/></g><g><text x="80.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">终端</text><text x="80.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">那个窗口</text><text x="80.0" y="79" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">只管显示</text></g><g><text x="240.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">shell (zsh)</text><text x="240.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">听懂你的话</text></g><g><text x="400.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">命令程序</text><text x="400.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">ls git node</text><text x="400.0" y="79" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">真正干活</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L462,108"/></circle><text x="10" y="128" class="cap">你敲一行字 → shell 拆开 → 找到程序 → 系统开一个进程运行</text></svg><ul><li><b>终端</b>只是个窗口：把你敲的字交出去，把结果显示出来。换成 iTerm、VS Code 里的终端，shell 照样工作。</li><li><b>shell</b> 是窗口里真正听你说话的程序，Mac 默认是 <code>zsh</code>。它读一行，拆成“程序名 + 参数”，去找这个程序。</li><li><b>命令</b>就是一个可执行文件（<code>ls</code>、<code>git</code>、<code>node</code>……）。回车 = 操作系统新开一个<b>进程</b>去跑它，跑完退出，shell 再等你。</li><li>打开：<code>⌘ + 空格</code> 输入“终端”。VS Code 里 <code>⌃ + `</code> 直接开一个，已经在项目目录里了。</li></ul><p class="one">窗口显示、shell 翻译、命令干活。</p></section><section class="card"><h3><span class="n">2</span>一行命令里每一块是什么</h3><pre class="term"><span class="p">goenkon@MacBook ~ %</span> <span class="k">ls</span> <span class="b">-la</span> <span class="c">Documents</span>

<span class="p">goenkon@MacBook ~ %</span>
   │        │       │  └─ % 表示等你输入（root 用户是 #）
   │        │       └──── ~ 当前所在文件夹（家目录）

<span class="k">ls</span>         = 命令：运行哪个程序
<span class="b">-la</span>       = 选项：怎么运行（l 详细 + a 含隐藏）
<span class="c">Documents</span> = 参数：对谁运行</pre><ul><li><b>命令 选项 参数</b>，空格隔开。选项以 <code>-</code> 开头；<code>--help</code> 之类的长选项用两个横线。</li><li><code>-la</code> 是 <code>-l -a</code> 的合写。</li><li>不知道怎么用：<code>命令 --help</code>，或 <code>man 命令</code>（按 <code>q</code> 退出）。</li></ul><p class="one">所有命令都是这个句式。</p></section><section class="card"><h3><span class="n">3</span>文件夹像一棵树，路径就是走法</h3><pre class="term"><span class="b">/</span>                         <span class="c">← 根，整台电脑的起点</span>

│       │       └── ielts-learning  <span class="c">← 项目在这</span>
│       └── Documents
└── etc  usr  bin  ...        <span class="c">← 系统自己用，别乱动</span></pre><ul><li><b>绝对路径</b>从根 <code>/</code> 或 <code>~</code> 写起：<code>~/Downloads/Developer</code>，在哪都指向同一处。</li><li><b>相对路径</b>从“我现在站的位置”写起：站在 Downloads 里，<code>cd Developer</code> 就够了。</li><li><code>.</code> = 这里，<code>..</code> = 上一层，所以 <code>cd ../..</code> 往上走两层。</li><li>把文件夹<b>拖进终端窗口</b>，路径自动补全。路径含空格要加引号。</li></ul><p class="one">任何文件，都能用一串“从哪出发、怎么走”指出来。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">4</span>每天用的命令</h3><div class="scroll"><table class="tb"><tr><th>命令</th><th>干什么</th><th>提醒</th></tr><tr><td><code>pwd</code></td><td>我在哪</td><td>迷路时第一条</td></tr><tr><td><code>ls</code> / <code>ls -la</code></td><td>看有什么</td><td><code>-a</code> 能看到 .git、.env 这类隐藏文件</td></tr><tr><td><code>cd 目录</code></td><td>进入</td><td><code>cd</code> 不带参数 = 回家；<code>cd -</code> = 回到上一个位置</td></tr><tr><td><code>mkdir 名</code></td><td>新建文件夹</td><td><code>-p</code> 可一次建多层</td></tr><tr><td><code>touch 文件</code></td><td>新建空文件</td><td></td></tr><tr><td><code>cp 源 目标</code></td><td>复制</td><td>文件夹要加 <code>-r</code></td></tr><tr><td><code>mv 源 目标</code></td><td>移动 / 改名</td><td>同一文件夹里 mv = 改名</td></tr><tr><td><code>rm 文件</code></td><td><b class='no'>永久删除</b></td><td><b>没有回收站</b>。<code>rm -rf 路径</code> 最危险，回车前再看一遍</td></tr><tr><td><code>cat / head / tail</code></td><td>看文件内容</td><td><code>tail -f 日志</code> 实时盯着新增内容</td></tr><tr><td><code>open .</code></td><td>在 Finder 里打开这里</td><td><code>open 文件</code> 用默认程序打开</td></tr><tr><td><code>code .</code></td><td>用 VS Code 打开这个文件夹</td><td>需要先在 VS Code 里装 code 命令</td></tr><tr><td><code>grep 词 文件</code></td><td>在文件里搜文字</td><td><code>grep -rn 词 .</code> 递归搜整个项目</td></tr><tr><td><code>find . -name "*.ts"</code></td><td>按名字找文件</td><td></td></tr><tr><td><code>du -sh *</code> / <code>df -h</code></td><td>文件夹多大 / 磁盘剩多少</td><td><code>-h</code> = 人看得懂的 MB、GB</td></tr><tr><td><code>history</code></td><td>敲过的命令清单</td><td></td></tr></table></div><ul><li>命令不用背。要的时候回来查，或问我。</li></ul><p class="one">先掌握 pwd / ls / cd / mkdir / mv，其余用到再学。</p></section><section class="card"><h3><span class="n">5</span>键盘快捷键，比命令还省力</h3><div class="scroll"><table class="tb"><tr><th>按键</th><th>效果</th></tr><tr><td><code>Tab</code></td><td>自动补全文件名或命令。敲几个字母按 Tab，不用打全</td></tr><tr><td><code>↑ / ↓</code></td><td>调出之前敲过的命令</td></tr><tr><td><code>⌃ + R</code></td><td>搜历史命令：输入片段，找到按回车</td></tr><tr><td><code>⌃ + C</code></td><td><b>强制停止</b>正在跑的程序（服务器、卡住的命令）</td></tr><tr><td><code>⌃ + D</code></td><td>结束输入 / 退出当前 shell</td></tr><tr><td><code>⌃ + L</code></td><td>清屏（历史还在）</td></tr><tr><td><code>⌃ + A / E</code></td><td>光标跳到行首 / 行尾</td></tr><tr><td><code>⌥ + ← / →</code></td><td>按单词跳</td></tr><tr><td><code>⌘ + T</code></td><td>新标签页（服务器占着窗口时用）</td></tr></table></div><ul><li>复制：<code>⌘ + C</code> 是复制，<code>⌃ + C</code> 是中断，两个不一样。</li></ul><p class="one">Tab + ↑ + Ctrl+C 三个键，顶一半效率。</p></section></div><div class="grid"><section class="card"><h3><span class="n">6</span>管道和重定向：把命令拼起来</h3><svg viewBox="0 0 520 124" role="img" aria-label="管道示意"><g class="wob"><rect class="s fb" x="10" y="30" width="130" height="50" rx="9"/><rect class="s fy" x="190" y="30" width="130" height="50" rx="9"/><rect class="s fg" x="370" y="30" width="130" height="50" rx="9"/><path class="s" d="M142 55 L188 55" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M322 55 L368 55" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="75" y="52" text-anchor="middle" class="zh" style="font-size:12.5px">cat log.txt</text><text x="75" y="68" text-anchor="middle" class="zh" style="font-size:10.0px">输出一堆文字</text><text x="255" y="52" text-anchor="middle" class="zh" style="font-size:12.5px">grep ERROR</text><text x="255" y="68" text-anchor="middle" class="zh" style="font-size:10.0px">只留带 ERROR 的行</text><text x="435" y="52" text-anchor="middle" class="zh" style="font-size:12.5px">&gt; err.txt</text><text x="435" y="68" text-anchor="middle" class="zh" style="font-size:10.0px">写进文件</text><text x="165" y="44" text-anchor="middle" class="zh" style="font-size:18.0px">|</text><text x="345" y="44" text-anchor="middle" class="zh" style="font-size:18.0px">|</text><text x="10" y="112" class="cap">cat log.txt | grep ERROR &gt; err.txt   ：先读，再过滤，最后保存</text></svg><ul><li><code>|</code> 管道：左边命令的<b>输出</b>变成右边命令的<b>输入</b>。每个命令只做一件小事，拼起来就很强。</li><li><code>&gt;</code> 把输出<b>覆盖写入</b>文件；<code>&gt;&gt;</code> 追加到文件末尾。</li><li><code>&amp;&amp;</code> 前一个成功才执行后一个：<code>git add -A &amp;&amp; git commit -m "x"</code>。</li><li><code>&amp;</code> 放在末尾 = 丢到后台去跑，不占着窗口。</li></ul><p class="one">小命令 + 管道 = 大本事。</p></section><section class="card"><h3><span class="n">7</span>文件权限：ls -l 前面那串字母</h3><pre class="term"><span class="c">-rwxr-xr--  1 goenkon  staff  420  deploy.sh</span>
<span class="k">-</span> <span class="b">rwx</span> <span class="b">r-x</span> <span class="b">r--</span>
│  │    │    └─ 其他人：只能读
│  │    └────── 同组的人：读 + 执行
│  └─────────── 我自己：读 + 写 + 执行
└────────────── 类型：- 文件，d 文件夹

<span class="k">chmod</span> <span class="b">+x</span> deploy.sh    <span class="c">给它执行权限</span>
<span class="k">chmod</span> <span class="b">644</span> a.txt        <span class="c">数字写法：rw-r--r--</span>
<span class="k">sudo</span> 命令              <span class="c">以管理员身份运行（输密码时不显示）</span></pre><ul><li><b>r 读（4）、w 写（2）、x 执行（1）</b>，数字是相加：7=rwx，6=rw-，5=r-x，4=r--。</li><li>“Permission denied”就是权限不够。先想清楚为什么，别一上来就 <code>sudo</code>。</li><li><code>sudo</code> 权力太大，别人给你的陌生命令别加 sudo 运行。</li></ul><p class="one">三类人（我、同组、其他）× 三种权限（读、写、执行）。</p></section><section class="card"><h3><span class="n">8</span>进程：看谁在跑、关掉它</h3><pre class="term"><span class="k">ps</span> aux | <span class="k">grep</span> node        <span class="c">找出所有 node 进程</span>
<span class="b">goenkon  48213  0.3 ...  node server.js</span>
         └─ 进程号 PID

<span class="k">lsof</span> -i :3000                <span class="c">谁占着 3000 端口？</span>
<span class="k">kill</span> 48213                   <span class="c">请它自己退出（温和）</span>
<span class="k">kill</span> -9 48213                <span class="c">强制杀掉（最后手段）</span>

<span class="c"># 活动监视器 ≈ 图形版的 ps</span></pre><ul><li>每个运行中的程序是一个<b>进程</b>，系统给它一个编号 PID。</li><li><code>EADDRINUSE: address already in use :::3000</code> = 3000 端口被上一次没关掉的服务占着：lsof 找到 PID，kill 它。</li><li>端口同一时刻只能被一个进程占用。</li></ul><p class="one">进程有编号，端口有占用，都能查到。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">9</span>环境变量：不写进代码的配置</h3><svg viewBox="0 0 520 128" role="img" aria-label="环境变量"><g class="wob"><rect class="s fg" x="10" y="18" width="200" height="96" rx="10"/><rect class="s fy" x="260" y="18" width="250" height="40" rx="10"/><rect class="s fb" x="260" y="74" width="250" height="40" rx="10"/><path class="s" d="M212 52 L258 40" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M212 80 L258 94" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="110" y="40" text-anchor="middle" class="zh" style="font-size:13.0px">同一份代码</text><text x="110" y="58" text-anchor="middle" class="zh" style="font-size:10.5px">process.env.DATABASE_URL</text><text x="110" y="76" text-anchor="middle" class="zh" style="font-size:10.5px">process.env.JWT_SECRET</text><text x="110" y="96" text-anchor="middle" class="cap" style="font-size:10.0px">代码里只写变量的名字</text><text x="385" y="42" text-anchor="middle" class="zh" style="font-size:12.0px">你电脑：.env 文件</text><text x="385" y="54" text-anchor="middle" class="cap" style="font-size:10.0px">测试库、测试密钥</text><text x="385" y="98" text-anchor="middle" class="zh" style="font-size:12.0px">Vercel：Environment Variables</text><text x="385" y="110" text-anchor="middle" class="cap" style="font-size:10.0px">正式库、正式密钥</text></svg><ul><li><b>环境变量</b>是由“运行环境”提供给程序的一组名字 = 值，比如 <code>DATABASE_URL=postgresql://…</code>。程序里用 <code>process.env.DATABASE_URL</code> 读取。</li><li><b>为什么不直接写进代码：</b>①代码会推到 GitHub，密码就泄露了；②本地和线上要连<b>不同</b>的数据库，同一份代码不能写死；③换密码不用改代码、不用重新提交。</li><li><b>放哪</b>：本地用项目根目录的 <code>.env</code> 文件（且必须写进 <code>.gitignore</code>，不提交）；线上在 Vercel 项目的 Settings → Environment Variables 里填。</li><li><b>前端特别注意</b>：前端代码最终会发到每个人的浏览器里，用户能看到全部内容。所以前端的“环境变量”（如 Vite 的 <code>VITE_</code> 开头）<b>不是秘密</b>，真正的秘密只能放后端。</li><li><b>终端里也有环境变量</b>：<code>echo $HOME</code> 看家目录，<code>export NAME=值</code> 只在当前窗口临时设置；<code>env</code> 列出全部。</li><li>改完环境变量，要<b>重启服务 / 重新部署</b>才生效，因为程序只在启动时读一次。</li></ul><p class="one">代码写“要什么”，环境决定“给什么”。密码、密钥、连接串永远走环境变量。</p></section><section class="card"><h3><span class="n">10</span>PATH：为什么装了却“command not found”</h3><pre class="term"><span class="k">echo</span> $PATH
/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
  └── 用冒号隔开的一串文件夹

你敲 <span class="k">node</span> → shell 按顺序去这些文件夹里找叫 node 的程序
  找到第一个就运行；都没有 → <span class="e">command not found</span>

<span class="k">which</span> node        <span class="c">它到底在哪一个文件夹找到的</span>
<span class="c"># 永久改配置：写进 ~/.zshrc，再 source ~/.zshrc 生效</span></pre><ul><li><b>PATH</b> 是一个特殊的环境变量：告诉 shell“去哪些文件夹找命令”。</li><li><code>brew install</code> 或 <code>npm install -g</code> 装好后找不到，多半是它所在的文件夹不在 PATH 里。</li><li><code>~/.zshrc</code> 是 zsh 每次打开时自动运行的配置文件，别名、PATH 都写在这里。</li></ul><p class="one">命令 = PATH 里某个文件夹里的某个文件。</p></section><section class="card"><h3><span class="n">11</span>装东西的几种方式</h3><div class="scroll"><table class="tb"><tr><th>工具</th><th>装什么</th><th>例子</th></tr><tr><td><b>Homebrew</b> (<code>brew</code>)</td><td>Mac 上的软件和命令行工具</td><td><code>brew install node git</code></td></tr><tr><td><b>npm</b></td><td>JavaScript 的包</td><td>项目里 <code>npm install</code>；<code>-g</code> 全局装</td></tr><tr><td><b>pip</b></td><td>Python 的包</td><td><code>pip install requests</code></td></tr><tr><td><b>App Store / dmg</b></td><td>图形界面应用</td><td>VS Code、Chrome</td></tr></table></div><ul><li><b>项目依赖</b>（npm install 在项目里装的）放在项目的 <code>node_modules</code>；<b>全局工具</b>放在系统别处。两者不要混。</li><li><code>node_modules</code> 可以随时删了重装，所以不提交到 Git，靠 <code>package.json</code> 记着要装什么。</li></ul><p class="one">包管理器 = 软件的应用商店，命令行版。</p></section></div></section><section class="panel" id="p-computer" aria-label="计算机基础"><h2>计算机基础</h2><p class="sec">写网站其实一直在和这些东西打交道：内存、进程、事件循环、编码、数据格式。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>一台电脑里谁负责什么</h3><svg viewBox="0 0 520 182" role="img" aria-label="CPU 内存 硬盘"><g class="wob"><rect class="s fb" x="10" y="14" width="140" height="64" rx="10"/><rect class="s fy" x="190" y="14" width="140" height="64" rx="10"/><rect class="s fg" x="370" y="14" width="140" height="64" rx="10"/><path class="s" d="M152 46 L188 46" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M332 46 L368 46" marker-end="url(#ah)" style="stroke-width:2"/><rect class="s fp" x="10" y="108" width="500" height="44" rx="10"/></g><text x="80" y="42" text-anchor="middle" class="zh" style="font-size:14.0px">CPU</text><text x="80" y="60" text-anchor="middle" class="zh" style="font-size:10.5px">计算、做决定</text><text x="260" y="42" text-anchor="middle" class="zh" style="font-size:14.0px">内存 RAM</text><text x="260" y="60" text-anchor="middle" class="zh" style="font-size:10.5px">正在用的东西</text><text x="440" y="42" text-anchor="middle" class="zh" style="font-size:14.0px">硬盘 SSD</text><text x="440" y="60" text-anchor="middle" class="zh" style="font-size:10.5px">长期保存</text><text x="260" y="134" text-anchor="middle" class="zh" style="font-size:11.5px">操作系统 (macOS)：分配 CPU 时间、分配内存、管理文件、管理网络</text><text x="10" y="172" class="cap">速度：CPU ≫ 内存 ≫ 硬盘 ≫ 网络；容量反过来：硬盘最大，内存次之</text></svg><ul><li><b>内存</b>断电就清空，但快；<b>硬盘</b>断电还在，但慢。程序运行时，先从硬盘装进内存，CPU 只和内存打交道。</li><li><b>变量、数组、对象</b>都活在内存里，所以<b>刷新页面 / 重启服务，内存里的东西就没了</b>。要保留，必须写到硬盘或数据库。</li><li><b>数据库</b>本质就是一个专门替你管理硬盘文件的程序，加上索引、事务这些保证。</li><li>内存不够会变卡（开始借用硬盘当内存，很慢）；服务器的“内存溢出”崩溃就是这个。</li></ul><p class="one">存在内存里的是临时的，存在硬盘 / 数据库里的才是持久的。</p></section><section class="card"><h3><span class="n">2</span>程序、进程、线程</h3><svg viewBox="0 0 520 150" role="img" aria-label="程序进程线程"><g class="wob"><rect class="s fk" x="10" y="14" width="110" height="60" rx="10"/><rect class="s fb" x="190" y="8" width="150" height="130" rx="10"/><rect class="s fg" x="205" y="40" width="54" height="30" rx="6"/><rect class="s fg" x="270" y="40" width="54" height="30" rx="6"/><rect class="s fy" x="205" y="86" width="119" height="40" rx="6"/><path class="s" d="M122 44 L188 44" marker-end="url(#ah)" style="stroke-width:2"/><rect class="s fr" x="380" y="8" width="130" height="130" rx="10"/><rect class="s fy" x="392" y="40" width="106" height="40" rx="6"/></g><text x="65" y="40" text-anchor="middle" class="zh" style="font-size:13.0px">程序</text><text x="65" y="56" text-anchor="middle" class="zh" style="font-size:10.0px">硬盘上的文件</text><text x="265" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">进程 A（node）</text><text x="232" y="59" text-anchor="middle" class="zh" style="font-size:11.0px">线程</text><text x="297" y="59" text-anchor="middle" class="zh" style="font-size:11.0px">线程</text><text x="264" y="110" text-anchor="middle" class="zh" style="font-size:11.0px">各自的内存空间</text><text x="445" y="30" text-anchor="middle" class="zh" style="font-size:12.0px">进程 B（Chrome）</text><text x="445" y="64" text-anchor="middle" class="zh" style="font-size:11.0px">各自的内存</text><text x="445" y="110" text-anchor="middle" class="zh" style="font-size:11.0px">互相看不到</text></svg><ul><li><b>程序</b>是躺在硬盘里的文件；<b>双击运行 = 创建一个进程</b>，操作系统给它一块独立的内存。</li><li><b>进程之间互相隔离</b>：Chrome 崩了不会带走 VS Code。需要沟通就得靠网络或文件（这也是为什么前后端要用 HTTP 说话）。</li><li><b>线程</b>是进程里“同时干活的人”，共用这块内存。Node.js 的 JavaScript 只有<b>一个主线程</b>，一次只执行一件事，靠“异步”处理等待。</li></ul><p class="one">进程是运行中的程序，线程是进程里干活的人。</p></section><section class="card"><h3><span class="n">3</span>JS 为什么能一边等网络一边不卡（事件循环）</h3><svg viewBox="0 0 520 160" role="img" aria-label="事件循环"><g class="wob"><rect class="s fb" x="10" y="12" width="150" height="120" rx="10"/><rect class="s fy" x="200" y="12" width="150" height="56" rx="10"/><rect class="s fg" x="200" y="82" width="150" height="50" rx="10"/><rect class="s fp" x="390" y="12" width="120" height="120" rx="10"/><path class="s" d="M352 40 L388 40" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M388 106 L352 106" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M300 82 L300 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M160 106 Q180 130 198 106" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="85" y="32" text-anchor="middle" class="zh" style="font-size:13.0px">调用栈</text><text x="85" y="48" text-anchor="middle" class="zh" style="font-size:10.0px">正在执行的代码</text><text x="85" y="100" text-anchor="middle" class="zh" style="font-size:11.0px">一次只做一件</text><text x="85" y="116" text-anchor="middle" class="zh" style="font-size:10.0px">做完才取下一件</text><text x="275" y="36" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器后台</text><text x="275" y="54" text-anchor="middle" class="zh" style="font-size:10.0px">计时器·网络·点击</text><text x="275" y="104" text-anchor="middle" class="zh" style="font-size:12.5px">任务队列</text><text x="275" y="120" text-anchor="middle" class="zh" style="font-size:10.0px">等着被执行的回调</text><text x="450" y="34" text-anchor="middle" class="zh" style="font-size:12.5px">事件循环</text><text x="450" y="54" text-anchor="middle" class="zh" style="font-size:10.0px">栈空了就从队列</text><text x="450" y="68" text-anchor="middle" class="zh" style="font-size:10.0px">取下一个任务</text><text x="10" y="150" class="cap">fetch() 发出去就交给后台去等，主线程继续往下走；响应回来，回调排队，轮到它再执行</text></svg><ul><li><code>fetch(...)</code> 不会让页面卡住：请求交给浏览器去等，主线程继续做别的事。响应回来后，<code>then / await</code> 后面的代码被放进队列，主线程空闲时执行。</li><li>所以代码顺序 ≠ 完成顺序：<code>setTimeout(f, 0)</code> 也要等当前这一轮代码跑完才执行。</li><li><b>一直占着主线程的计算（死循环、超大 for）会让整个页面卡死</b>，因为其他事件都排不上队。</li></ul><p class="one">异步 = “先交代出去，回头再来取”。</p></section></div><div class="grid"><section class="card"><h3><span class="n">4</span>二进制与文字：为什么会有乱码</h3><div class="scroll"><table class="tb"><tr><th>概念</th><th>意思</th><th>例子</th></tr><tr><td>bit / byte</td><td>最小单位 0/1；8 个 bit = 1 byte</td><td>1 KB = 约 1000 byte</td></tr><tr><td>字符编码</td><td>“字” ↔ “一串字节”的对照规则</td><td>UTF-8 是现在的标准</td></tr><tr><td>ASCII</td><td>只有英文字母数字</td><td>一个字符 1 byte</td></tr><tr><td>UTF-8</td><td>兼容 ASCII；中文日文通常 3 byte 一个</td><td>「语」= 3 byte</td></tr><tr><td>乱码</td><td>用 A 规则写，用 B 规则读</td><td><code>æ–‡å­—</code></td></tr></table></div><ul><li><b>文件本身只是一串字节</b>，怎么变成字，取决于读的人用什么编码。网页要写 <code>&lt;meta charset="utf-8"&gt;</code>，就是告诉浏览器用 UTF-8 读。</li><li>网址里放中文会被转成 <code>%E8%AF%AD</code> 这种百分号编码（见“地址栏”）。</li><li>数据库、接口、文件统一用 UTF-8，几乎不会再见到乱码。</li></ul><p class="one">乱码 = 读写双方对不上编码。</p></section><section class="card"><h3><span class="n">5</span>数据类型：JSON 是前后端的通用语</h3><pre class="term"><span class="c">// JSON：所有语言都能读写的数据格式</span>
{
  <span class="b">"id"</span>: <span class="k">42</span>,                   <span class="c">数字</span>
  <span class="b">"word"</span>: <span class="k">"accommodation"</span>,   <span class="c">字符串（必须双引号）</span>
  <span class="b">"kind"</span>: <span class="k">"w"</span>,
  <span class="b">"tags"</span>: [<span class="k">"IELTS"</span>, <span class="k">"A2"</span>],  <span class="c">数组</span>
  <span class="b">"done"</span>: <span class="k">false</span>,               <span class="c">布尔：true / false</span>
  <span class="b">"note"</span>: <span class="k">null</span>                 <span class="c">空值</span>
}
<span class="c">// JSON.stringify(对象) → 字符串 ； JSON.parse(字符串) → 对象</span></pre><ul><li>网络上传的永远是<b>字节 / 文字</b>，不是 JS 对象。所以发送前要 <code>JSON.stringify</code> 变成字符串，收到后 <code>r.json()</code> 变回对象。</li><li>JSON 的规矩：key 必须双引号，最后一项后面不能有逗号，不能写注释。</li></ul><p class="one">前后端之间的数据，是一段 JSON 文字。</p></section><section class="card"><h3><span class="n">6</span>同步 / 异步，用点咖啡来想</h3><div class="cmp"><div class="l"><h4>同步：排队等</h4><ul><li>点单，站在柜台等咖啡做好</li><li>后面的人全卡住</li><li>一个请求没回来，页面不能动</li></ul></div><div class="r"><h4>异步：拿号去坐</h4><ul><li>点单拿号，坐下看手机</li><li>咖啡好了叫你</li><li>请求发出去，页面照常响应</li></ul></div></div><ul><li>JS 里的 <code>async / await</code> 写起来像同步，实际是异步：<code>await</code> 那一行会“拿号等通知”，其他代码照跑。</li><li><code>await</code> 只能在 <code>async</code> 函数里用；忘了写 await，拿到的是一个“还没兑现的承诺”（Promise）而不是结果，这是新手最常见的 bug。</li><li>多个互不依赖的请求用 <code>Promise.all([...])</code> 并行发，比逐个 await 快。</li></ul><p class="one">没写 await 却想用结果 = 拿着号码牌当咖啡喝。</p></section></div></section><section class="panel" id="p-network" aria-label="网络"><h2>网络</h2><p class="sec">一次访问背后：分层、DNS、握手、加密、端口、CDN。每个概念都配了一张“发生了什么”的图。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>网络分层：每一层只管自己的事</h3><svg viewBox="0 0 640 332" role="img" aria-label="分层：应用层  HTTP / DNS / SMTP / 安全层  TLS / 传输层  TCP / UDP / 网络层  IP / 链路层  Wi-Fi / 网线"><g class="wob"><rect class="s fb" x="10" y="8" width="347.2" height="52" rx="9"/><rect class="s fy" x="10" y="68" width="347.2" height="52" rx="9"/><rect class="s fg" x="10" y="128" width="347.2" height="52" rx="9"/><rect class="s fp" x="10" y="188" width="347.2" height="52" rx="9"/><rect class="s fr" x="10" y="248" width="347.2" height="52" rx="9"/></g><text x="183.6" y="30" text-anchor="middle" class="zh" style="font-size:13.5px">应用层  HTTP / DNS / SMTP</text><text x="183.6" y="48" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">你写的前后端在这一层说话</text><path class="s" d="M361.2 34 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="38.0" text-anchor="start" class="zh" style="font-size:11.5px">我们的接口：GET /favorites</text><text x="183.6" y="90" text-anchor="middle" class="zh" style="font-size:13.5px">安全层  TLS</text><text x="183.6" y="108" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">加密、验明身份</text><path class="s" d="M361.2 94 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="98.0" text-anchor="start" class="zh" style="font-size:11.5px">https 的 s 就是它</text><text x="183.6" y="150" text-anchor="middle" class="zh" style="font-size:13.5px">传输层  TCP / UDP</text><text x="183.6" y="168" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">可靠送达、分端口</text><path class="s" d="M361.2 154 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="158.0" text-anchor="start" class="zh" style="font-size:11.5px">端口号：443、3000</text><text x="183.6" y="210" text-anchor="middle" class="zh" style="font-size:13.5px">网络层  IP</text><text x="183.6" y="228" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">找到那台机器</text><path class="s" d="M361.2 214 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="218.0" text-anchor="start" class="zh" style="font-size:11.5px">IP 地址：怎么走到对方</text><text x="183.6" y="270" text-anchor="middle" class="zh" style="font-size:13.5px">链路层  Wi-Fi / 网线</text><text x="183.6" y="288" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">在一段线路上传比特</text><path class="s" d="M361.2 274 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="278.0" text-anchor="start" class="zh" style="font-size:11.5px">你的 Wi-Fi、光纤</text><text x="10" y="326" class="cap">发送：从上往下一层层包装；接收：从下往上一层层拆开</text></svg><ul><li>像寄快递：<b>应用层</b>是信的内容，<b>传输层</b>写“几号房”（端口），<b>网络层</b>写“哪栋楼”（IP），<b>链路层</b>是具体的送货路线。</li><li><b>每一层只和对方的同一层“说话”</b>，不管下面是 Wi-Fi 还是网线。所以换了网络，你的网站代码不用改。</li><li>日常开发主要在应用层；碰到连不上、很慢、证书错误，再往下一层层排查。</li></ul><p class="one">一层管一件事，分层让复杂的网络变得可拆解。</p></section><section class="card full"><h3><span class="n">2</span>DNS：域名怎么变成 IP</h3><svg viewBox="0 0 680 462" role="img" aria-label="时序图：浏览器 / 本地缓存 / 递归 DNS / 根 / .com / 权威 DNS"><g class="wob"><rect class="s fb" x="16.0" y="12" width="120.0" height="40" rx="9"/><path d="M76.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fk" x="148.0" y="12" width="120.0" height="40" rx="9"/><path d="M208.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="280.0" y="12" width="120.0" height="40" rx="9"/><path d="M340.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="412.0" y="12" width="120.0" height="40" rx="9"/><path d="M472.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="544.0" y="12" width="120.0" height="40" rx="9"/><path d="M604.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M79.0 86.0 H203.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M211.0 136.0 H335.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M343.0 186.0 H467.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M469.0 236.0 H345.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M343.0 286.0 H599.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M601.0 336.0 H345.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M337.0 386.0 H81.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="76.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="208.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">本地缓存</text><text x="208.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">电脑 / 路由器</text><text x="340.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">递归 DNS</text><text x="340.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">如 8.8.8.8</text><text x="472.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">根 / .com</text><text x="472.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">名录服务器</text><text x="604.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">权威 DNS</text><text x="604.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">Cloudflare</text><text x="142.0" y="78" text-anchor="middle" class="zh" style="font-size:11.0px">1 jlpt.goenkon.com？</text><text x="142.0" y="101" text-anchor="middle" class="cap" style="font-size:9.5px">先问自己有没有记过</text><text x="274.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 不知道，帮我查</text><text x="406.0" y="178" text-anchor="middle" class="zh" style="font-size:10.1px">3 谁管 .com？→ 去问权威</text><text x="406.0" y="228" text-anchor="middle" class="zh" style="font-size:9.5px">4 指路：去 Cloudflare 问</text><text x="472.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 jlpt.goenkon.com 是？</text><text x="472.0" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 指向 Vercel 的 IP</text><text x="472.0" y="351" text-anchor="middle" class="cap" style="font-size:9.5px">A 或 CNAME 记录</text><text x="208.0" y="378" text-anchor="middle" class="zh" style="font-size:11.5px">7 答案 + 缓存一段时间 (TTL)</text><text x="10" y="456" class="cap">结果会按 TTL 缓存：所以改了 DNS 要等一阵才全球生效</text></svg><ul><li>DNS 是<b>分层的电话簿</b>：根 → .com → 你的域名自己的服务器，一层层指路，最后拿到 IP。</li><li>你买域名，其实是买了“在 .com 的名录里登记一行”的资格；这一行写着“我的 DNS 由 Cloudflare 管”。</li><li><b>记录类型</b>：A（域名→IPv4）、AAAA（→IPv6）、CNAME（域名→另一个域名，像别名）、TXT（放文字，常用来验证域名归属）、MX（邮件）。我们的 jlpt 子域名就是一条指向 Vercel 的 CNAME。</li><li>排错：<code>nslookup jlpt.goenkon.com</code> 或 <code>dig jlpt.goenkon.com</code> 直接看解析结果。</li></ul><p class="one">DNS 只干一件事：名字 → 地址。</p></section><section class="card full"><h3><span class="n">3</span>TCP 三次握手 + TLS：连接是怎么建起来的</h3><svg viewBox="0 0 640 462" role="img" aria-label="时序图：浏览器 / 服务器"><g class="wob"><rect class="s fb" x="16.0" y="12" width="298.0" height="40" rx="9"/><path d="M165.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="326.0" y="12" width="298.0" height="40" rx="9"/><path d="M475.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M168.0 86.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 136.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 186.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 236.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 286.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 336.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 386.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="165.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="475.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">服务器</text><text x="475.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">443 端口</text><text x="320.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 SYN：我想连你</text><text x="320.0" y="101" text-anchor="middle" class="cap" style="font-size:9.5px">TCP 握手第一步</text><text x="320.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 SYN+ACK：好，我也准备好了</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 ACK：收到，开始吧</text><text x="320.0" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">连接建好，可靠通道</text><text x="320.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 ClientHello：我支持这些加密方式</text><text x="320.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">TLS 开始</text><text x="320.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 证书 + 选定的加密方式</text><text x="320.0" y="301" text-anchor="middle" class="cap" style="font-size:9.5px">证书证明“我真的是这个域名”</text><text x="320.0" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 用证书里的公钥协商出会话密钥</text><text x="320.0" y="378" text-anchor="middle" class="zh" style="font-size:11.5px">7 之后全是加密的 HTTP 请求</text><text x="320.0" y="401" text-anchor="middle" class="cap" style="font-size:9.5px">对称加密，快</text><text x="10" y="456" class="cap">握手花的往返越多越慢：所以服务器离你近、保持连接复用都能提速</text></svg><ul><li><b>TCP</b>保证“按顺序、不丢、不重复”：丢了会自动重发。代价是需要先握手建立连接。</li><li><b>TLS</b>解决两件事：①<b>加密</b>：路上的人看到的是乱码；②<b>验明身份</b>：证书由权威机构签发，证明这个域名真的属于这个服务器，防冒充。</li><li><b>证书</b>有期限，要续期。Vercel 会自动帮我们签发和续期，所以一般碰不到“证书过期”。</li><li><b>UDP</b>不握手、不保证送达，换来很快，用于视频通话、游戏。</li></ul><p class="one">先建可靠通道（TCP），再加锁（TLS），然后才说 HTTP。</p></section></div><div class="grid"><section class="card"><h3><span class="n">4</span>端口和 localhost</h3><svg viewBox="0 0 520 176" role="img" aria-label="端口"><g class="wob"><rect class="s fk" x="10" y="12" width="500" height="150" rx="12"/><rect class="s fb" x="30" y="40" width="130" height="50" rx="8"/><rect class="s fy" x="195" y="40" width="130" height="50" rx="8"/><rect class="s fg" x="360" y="40" width="130" height="50" rx="8"/><path class="s" d="M95 140 L95 92" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M260 140 L260 92" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M425 140 L425 92" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="260" y="32" text-anchor="middle" class="zh" style="font-size:11.0px">你的电脑（IP: 192.168.0.12，别名 localhost = 127.0.0.1）</text><text x="95" y="62" text-anchor="middle" class="zh" style="font-size:12.5px">前端 dev</text><text x="95" y="78" text-anchor="middle" class="zh" style="font-size:11.0px">端口 5173</text><text x="260" y="62" text-anchor="middle" class="zh" style="font-size:12.5px">后端 dev</text><text x="260" y="78" text-anchor="middle" class="zh" style="font-size:11.0px">端口 3000</text><text x="425" y="62" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="425" y="78" text-anchor="middle" class="zh" style="font-size:11.0px">端口 5432</text><text x="95" y="154" text-anchor="middle" class="zh" style="font-size:11.5px">localhost:5173</text><text x="260" y="154" text-anchor="middle" class="zh" style="font-size:11.5px">localhost:3000</text><text x="425" y="154" text-anchor="middle" class="zh" style="font-size:11.5px">localhost:5432</text></svg><ul><li><b>IP 找到机器，端口找到机器上的哪个程序</b>。一台机器最多 65535 个端口，一个端口同一时刻只给一个程序用。</li><li>常见默认：<code>80</code> http、<code>443</code> https、<code>22</code> ssh、<code>5432</code> PostgreSQL、<code>3000</code> / <code>5173</code> 前端开发服务器。</li><li><code>localhost</code> = <code>127.0.0.1</code> = “我自己”：数据包不出电脑，直接回给自己。<b>别人输入你的 localhost 看到的是他自己的电脑</b>。</li><li>想让同一个 Wi-Fi 下的手机访问你的电脑开发服务器：用电脑的局域网 IP（如 192.168.x.x:5173），且服务要监听 <code>0.0.0.0</code>。</li></ul><p class="one">IP 是楼，端口是门牌号。</p></section><section class="card full"><h3><span class="n">5</span>代理、反向代理、CDN：中间的“中间人”</h3><svg viewBox="0 0 640 412" role="img" aria-label="时序图：你 / CDN 边缘节点 / 源站"><g class="wob"><rect class="s fb" x="16.0" y="12" width="194.7" height="40" rx="9"/><path d="M113.3 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="222.7" y="12" width="194.7" height="40" rx="9"/><path d="M320.0 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="429.3" y="12" width="194.7" height="40" rx="9"/><path d="M526.7 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M116.3 86.0 H315.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M317.0 136.0 H118.3" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M116.3 186.0 H315.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M323.0 236.0 H521.7" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 286.0 H325.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M317.0 336.0 H118.3" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="113.3" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你</text><text x="113.3" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">浏览器</text><text x="320.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">CDN 边缘节点</text><text x="320.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">离你最近的机房</text><text x="526.7" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">源站</text><text x="526.7" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">Vercel / 你的服务器</text><text x="216.7" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 请求 /logo.png</text><text x="216.7" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 我有缓存，直接给你</text><text x="216.7" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">命中缓存：快，不打扰源站</text><text x="216.7" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 请求 /api/favorites</text><text x="423.3" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 没缓存，我替你去问</text><text x="423.3" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">反向代理：用户只认识前台</text><text x="423.3" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 返回数据</text><text x="216.7" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 转交给你（可能顺便存一份）</text><text x="10" y="406" class="cap">CDN 和反向代理站在服务器前面，替它挡流量、省距离</text></svg><ul><li><b>CDN</b>：把静态文件（图片、JS、CSS）复制到全球很多机房，用户从最近的拿，所以快。我们的语音包放在 Cloudflare R2 + CDN 也是这个思路。</li><li><b>反向代理</b>：站在服务器前面接客，再转给后面真正干活的服务器。能做加密、限流、负载均
