<!-- ===== 读一行代码 ===== -->
<section id="read">
  <h2>先学会拆一行 Java</h2>
  <div class="paper y note">Java 的每一行都是"几个词按固定顺序排好"。认得每个位置放什么，陌生代码就不再吓人。下面把你项目里的两行拆开。</div>

  <h3>一个字段</h3>
  <div class="paper">
    <div class="anat"><span class="t1">private</span> <span class="t2">final</span> <span class="t3">FavoriteWordRepository</span> <span class="t4">repository</span><span class="t5">;</span></div>
    <div class="legend"><span class="t1">谁能访问</span><span class="t2">能不能改</span><span class="t3">类型</span><span class="t4">变量名</span><span class="t5">语句结束</span></div>
    <p>读法：一个<b>只有本类能访问</b>、<b>赋值一次后不能再改</b>的变量，类型是 <code>FavoriteWordRepository</code>，名字叫 <code>repository</code>。顺序固定：<b>修饰词 → 类型 → 名字</b>。和 TypeScript 相反，类型写在名字前面，没有 <code>:</code>。</p>
  </div>

  <h3>一个方法</h3>
  <div class="paper">
    <div class="anat"><span class="t1">public</span> <span class="t3">ResponseEntity&lt;?&gt;</span> <span class="t4">googleLogin</span>(<span class="t2">@RequestBody</span> <span class="t3">GoogleLoginRequest</span> <span class="t4">body</span>) <span class="t5">{ ... }</span></div>
    <div class="legend"><span class="t1">谁能访问</span><span class="t3">返回类型 / 参数类型</span><span class="t4">方法名 / 参数名</span><span class="t2">参数上的标签</span><span class="t5">方法体</span></div>
    <p>读法：一个公开方法，名字叫 <code>googleLogin</code>，接收一个参数 <code>body</code>（类型 <code>GoogleLoginRequest</code>，值由 Spring 从请求体 JSON 里填），做完返回一个 <code>ResponseEntity</code>。顺序固定：<b>修饰词 → 返回类型 → 方法名 → (参数类型 参数名)</b>。</p>
    <p>对照前端：<code>async function googleLogin(body: GoogleLoginRequest): Promise&lt;Response&gt;</code>，只是 Java 把类型挪到了前面。</p>
  </div>
</section>

<!-- ===== 基础语法 ===== -->
<section id="syntax">
  <h2>基础语法</h2>

  <details open>
    <summary><span class="fn">分号 ; 和大括号 { }</span><span class="one">哪里要写，哪里不写</span></summary>
    <div class="body">
      <ul>
        <li><b>分号 <code>;</code> 表示"这一条语句结束了"</b>。Java 不看换行，只认分号，所以一行可以写多条，一条也可以拆成多行。漏了分号，编译器直接报错。</li>
        <li><b>大括号 <code>{ }</code> 圈出一个"代码块"</b>：类体、方法体、<code>if</code> 体、<code>try</code> 体都用它。<b>块的结尾 <code>}</code> 后面不写分号</b>。</li>
        <li>需要分号：<code>this.repository = repository;</code>（赋值）、<code>return x;</code>、<code>import ...;</code>、<code>package ...;</code>、字段声明、方法调用。</li>
        <li>不需要分号：<code>if (...) { }</code> 的 <code>}</code>、方法的 <code>}</code>、类的 <code>}</code>。</li>
        <li>接口里的方法声明<b>没有方法体</b>，所以用分号直接结束：<code>Optional&lt;AppUser&gt; findByGoogleSub(String googleSub);</code>。</li>
        <li><code>record Greeting(String message, int version) {}</code>：空的 <code>{}</code> 是方法体位置，里面没东西，后面也不写分号。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">package 和 import</span><span class="one">文件放哪、用了谁</span></summary>
    <div class="body">
      <ul>
        <li><code>package com.goenkon.ielts;</code>：这个文件属于哪个"文件夹"（包）。必须和它在项目里的实际目录一致：<code>src/main/java/com/goenkon/ielts/</code>。包名反过来写域名是 Java 的惯例，用来避免和别人的类重名。</li>
        <li><code>import org.springframework.stereotype.Component;</code>：告诉编译器"下面用到的 <code>Component</code> 是这个包里的那个"。相当于前端的 <code>import { Component } from '...'</code>。</li>
        <li>同一个包里的类不用 import，直接用（所以 <code>AuthController</code> 用 <code>JwtService</code> 不用写 import）。</li>
        <li><code>import jakarta.persistence.*;</code>：星号表示"这个包里的全部"。</li>
        <li><code>java.lang</code> 包（<code>String</code>、<code>Long</code>、<code>Integer</code>、<code>Object</code>）是自动导入的，不用写。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">类、对象、字段、方法、构造方法</span><span class="one">五个最基本的名词</span></summary>
    <div class="body">
      <ul>
        <li><b>类（class）</b>：图纸。<code>class AppUser</code> 描述"一个用户长什么样、能做什么"。</li>
        <li><b>对象（object）</b>：按图纸造出来的实物，占内存。<code>new AppUser(...)</code> 造一个。</li>
        <li><b>字段（field）</b>：对象身上的数据，比如 <code>private String email;</code>。</li>
        <li><b>方法（method）</b>：对象能做的事，比如 <code>getEmail()</code>。</li>
        <li><b>构造方法（constructor）</b>：和类同名、<b>没有返回类型</b>的特殊方法，在 <code>new</code> 的时候被调用，用来给字段赋初始值。</li>
        <li><b><code>this</code></b>：指"这个对象自己"。<code>this.email = email;</code> 左边是对象的字段，右边是参数，同名时用 <code>this.</code> 区分。</li>
        <li><b><code>new</code></b>：在内存里造一个对象，返回它的引用（地址）。我们自己写 <code>new</code> 的地方很少，大部分对象由 Spring 代为 new。</li>
        <li><b>getter / setter</b>：Java 习惯字段都 <code>private</code>，只通过 <code>getXxx()</code> / <code>setXxx()</code> 读写。这样想"不让某个字段被改"，只要不写它的 setter。Spring 转 JSON 也是靠 getter 找字段。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">if / null / return / try-catch</span><span class="one">流程控制</span></summary>
    <div class="body">
<pre><code>if (g == null) {                       // 条件必须是 boolean
    return ResponseEntity.status(401)...;   // return：结束方法并把值交出去
}

try {
    return Long.valueOf(JWT.require(algo).build().verify(token).getSubject());
} catch (JWTVerificationException e) {
    return null;                        // 出错时走这里，程序不会崩
}</code></pre>
      <ul>
        <li><code>null</code> 表示"这个引用没有指向任何对象"。对 <code>null</code> 调用方法会抛 <code>NullPointerException</code>（空指针，最常见的 Java 错误）。</li>
        <li><code>==</code> 比较的是"是不是同一个东西"：对数字等基本类型是比较值；对对象是比较<b>地址</b>。比较字符串内容要用 <code>"a".equals(b)</code>，不能用 <code>==</code>。<code>"OPTIONS".equals(request.getMethod())</code> 把确定不为 null 的写在前面，是为了避免空指针。</li>
        <li><code>try { } catch (类型 e) { }</code>：先试着执行 try 里的代码，中途抛异常就跳到 catch，而不是让程序崩溃。<code>e</code> 是异常对象，描述出了什么错。</li>
        <li><code>throws Exception</code>：写在方法声明后面，表示"这个方法里可能抛出异常，我不处理，交给调用我的人"。</li>
        <li><code>return</code>：结束当前方法。<code>void</code> 方法不返回值，其余都要 <code>return</code> 对应类型的值。</li>
        <li>逻辑运算：<code>&amp;&amp;</code> 且、<code>||</code> 或、<code>!</code> 非。<code>authorization == null || !authorization.startsWith("Bearer ")</code>：左边为真就不再算右边，所以先判 null 再用它是安全的。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">-&gt; 和 ::</span><span class="one">lambda 与方法引用</span></summary>
    <div class="body">
<pre><code>userRepository.findByGoogleSub(g.sub())
    .orElseGet(() -&gt; userRepository.save(new AppUser(...)));

.orElseGet(this::unauthorized);
repository.findByIdAndUserId(id, userId).ifPresent(repository::delete);</code></pre>
      <ul>
        <li><code>() -&gt; 表达式</code> 是 <b>lambda</b>，"一小段待执行的代码"，类似 JS 的 <code>() =&gt; ...</code>。括号里是参数，箭头右边是做的事。<code>orElseGet(() -&gt; ...)</code> 只有在 Optional 是空的时才会执行括号里的内容。</li>
        <li><code>类::方法</code> 是<b>方法引用</b>，lambda 的简写：<code>repository::delete</code> 等于 <code>x -&gt; repository.delete(x)</code>。<code>this::unauthorized</code> 是"调用本对象的 unauthorized 方法"。</li>
        <li><b>链式调用</b>：每个方法返回一个对象，可以接着 <code>.</code> 调用下一个，像 JS 的 <code>promise.then().catch()</code>。<code>JWT.create().withSubject(...).withIssuedAt(...).sign(algo)</code> 就是一条链，最后一个方法才真正产出结果。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">注释</span><span class="one">三种写法</span></summary>
    <div class="body">
      <ul>
        <li><code>// 单行注释</code></li>
        <li><code>/* 多行注释 */</code></li>
        <li><code>/** 文档注释 */</code>：写在类或方法上面，IDE 悬停时会显示。</li>
        <li>注释不会被编译，也不影响运行。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== 修饰符与关键字 ===== -->
<section id="mods">
  <h2>修饰符与关键字</h2>
  <div class="paper"><div class="scroll"><table>
    <tr><th>词</th><th>意思</th><th>你项目里的例子</th></tr>
    <tr><td><code>public</code></td><td>谁都能访问</td><td><code>public class AuthController</code></td></tr>
    <tr><td><code>private</code></td><td>只有本类内部能访问</td><td><code>private final JwtService jwtService;</code></td></tr>
    <tr><td><code>protected</code></td><td>本包和子类能访问</td><td><code>protected AppUser() {}</code></td></tr>
    <tr><td>（什么都不写）</td><td>只有同一个包能访问</td><td>很少用</td></tr>
    <tr><td><code>static</code></td><td>属于类本身，不属于某个对象；不用 new 就能用，整个程序只有一份</td><td><code>public static final String USER_ID</code></td></tr>
    <tr><td><code>final</code></td><td>赋值一次后不能再改。字段 final = 常量；类 final = 不能被继承</td><td><code>private final Algorithm algo;</code></td></tr>
    <tr><td><code>void</code></td><td>这个方法不返回任何值</td><td><code>public void addCorsMappings(...)</code></td></tr>
    <tr><td><code>class</code></td><td>声明一个类（图纸）</td><td><code>public class CorsConfig</code></td></tr>
    <tr><td><code>interface</code></td><td>只规定"有哪些方法"，不写实现</td><td><code>public interface AppUserRepository</code></td></tr>
    <tr><td><code>record</code></td><td>只装数据的简写类，自动生成构造器、取值方法；字段创建后不能改</td><td><code>public record NewFavoriteWord(String kind, ...)</code></td></tr>
    <tr><td><code>extends</code></td><td>继承：拿到父类的全部能力。接口继承接口也用它</td><td><code>extends JpaRepository&lt;AppUser, Long&gt;</code></td></tr>
    <tr><td><code>implements</code></td><td>实现接口：承诺写出接口规定的所有方法</td><td><code>implements WebMvcConfigurer</code></td></tr>
    <tr><td><code>throws</code></td><td>声明方法里可能抛出的异常</td><td><code>preHandle(...) throws Exception</code></td></tr>
    <tr><td><code>this</code></td><td>当前对象自己</td><td><code>this.algo = Algorithm.HMAC256(secret);</code></td></tr>
    <tr><td><code>new</code></td><td>在内存里创建对象</td><td><code>new AppUser(g.sub(), ...)</code></td></tr>
  </table></div></div>
  <p class="note">四个访问级别按"开放程度"排：public &gt; protected &gt; 默认 &gt; private。原则：能小就小，字段默认 private，需要给别人用的方法才 public。</p>
</section>

<!-- ===== 类型 ===== -->
<section id="types">
  <h2>类型：Long、String、Optional 这一大堆</h2>

  <h3>基本类型和它们的"对象版本"</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>基本类型</th><th>对象版本</th><th>范围 / 说明</th></tr>
    <tr><td><code>int</code></td><td><code>Integer</code></td><td>32 位整数，约 ±21 亿</td></tr>
    <tr><td><code>long</code></td><td><code>Long</code></td><td>64 位整数，约 ±9.2×10<sup>18</sup>。数据库主键、时间戳常用，不怕用完</td></tr>
    <tr><td><code>double</code></td><td><code>Double</code></td><td>小数（64 位浮点）</td></tr>
    <tr><td><code>boolean</code></td><td><code>Boolean</code></td><td><code>true</code> 或 <code>false</code></td></tr>
    <tr><td><code>char</code></td><td><code>Character</code></td><td>单个字符，用单引号 <code>'a'</code></td></tr>
  </table></div></div>
  <div class="paper y">
    <p style="margin-top:0"><b><code>long</code> 和 <code>Long</code> 到底差在哪</b></p>
    <ul style="margin:0;padding-left:1.3em">
      <li><code>long</code>（小写）是<b>值本身</b>，直接存数字，<b>永远有值</b>，不能是 <code>null</code>，没有方法可调。</li>
      <li><code>Long</code>（大写）是<b>装着数字的对象</b>，要通过引用访问，所以<b>可以是 <code>null</code></b>，也有方法（<code>Long.valueOf</code> 等）。</li>
      <li>为什么我们用 <code>Long</code>：<code>AppUser</code> 的 <code>id</code> 刚 new 出来还没存数据库时<b>没有值</b>，要用 <code>null</code> 表示"还没分配"，所以只能用 <code>Long</code>。<code>JwtService.verify</code> 返回 <code>Long</code> 也是因为"验证失败"要返回 <code>null</code>。</li>
      <li>Java 会在两者之间<b>自动转换</b>（装箱、拆箱）。注意：两个 <code>Long</code> 比较要用 <code>.equals()</code>，别用 <code>==</code>。</li>
      <li>泛型尖括号里只能放对象版本：<code>List&lt;Long&gt;</code> 可以，<code>List&lt;long&gt;</code> 不行。</li>
    </ul>
  </div>

  <details>
    <summary><span class="fn">String</span><span class="one">字符串</span></summary>
    <div class="body">
      <ul>
        <li>是对象，不是基本类型；字符串用<b>双引号</b>，单引号是 char。</li>
        <li><b>不可变</b>：一旦创建，内容不能改。<code>s.trim()</code> 不是修改 <code>s</code>，而是返回一个新字符串。所以要写 <code>word = word.trim();</code>。</li>
        <li>常用：<code>trim()</code> 去首尾空格、<code>isBlank()</code> 是否为空或全空白、<code>startsWith("Bearer ")</code>、<code>substring(7)</code> 从第 7 位截取、<code>equals(x)</code> 比较内容、<code>String.valueOf(5)</code> 把别的类型转成字符串。</li>
        <li><code>Long.valueOf("5")</code> 反过来，把字符串转成 <code>Long</code>。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">泛型 &lt; &gt; 和 ?</span><span class="one">尖括号里是什么</span></summary>
    <div class="body">
      <ul>
        <li>尖括号表示"这个容器里装什么类型"，相当于 TypeScript 的 <code>Array&lt;string&gt;</code>。<code>List&lt;FavoriteWord&gt;</code> = 装收藏的列表。</li>
        <li><code>JpaRepository&lt;AppUser, Long&gt;</code>：两个参数，依次是"操作哪个实体"和"主键什么类型"。</li>
        <li><code>ResponseEntity&lt;?&gt;</code>：问号是"类型不固定，什么都行"。我们的方法成功时返回 <code>LoginResponse</code>，失败时返回 <code>Map</code>，所以用问号。</li>
        <li><code>Optional&lt;AppUser&gt;</code>：一个盒子，装着 <code>AppUser</code> 或空。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">Optional</span><span class="one">"可能有，可能没有"的盒子</span></summary>
    <div class="body">
      <ul>
        <li>查数据库可能查不到。直接返回 <code>null</code> 容易让人忘记检查，忘了就空指针。<code>Optional</code> 把"可能没有"写进类型里，逼你处理。</li>
        <li><code>isPresent()</code>：里面有没有东西。<code>get()</code> 取出来（空的会抛异常，不推荐直接用）。</li>
        <li><code>ifPresent(x -&gt; ...)</code>：有的话才执行。</li>
        <li><code>orElse(默认值)</code>、<code>orElseGet(() -&gt; 计算默认值)</code>：没有就用默认值。后者只在真的为空时才执行括号里的代码，适合"没有就去创建"。</li>
        <li><code>map(u -&gt; 转换)</code>：有的话把里面的东西转成别的，再装进新盒子。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">List、Map、Instant</span><span class="one">容器与时间</span></summary>
    <div class="body">
      <ul>
        <li><code>List&lt;T&gt;</code>：有顺序的列表，像 JS 数组。Spring 返回它会自动变成 JSON 数组。</li>
        <li><code>Map&lt;K, V&gt;</code>：键值对，像 JS 对象。<code>Map.of("error", "unauthorized")</code> 创建一个只读的，会被转成 <code>{"error":"unauthorized"}</code>。</li>
        <li><code>Instant</code>：时间轴上的某一个时刻，精确到毫秒，和时区无关。<code>Instant.now()</code> 取现在，<code>now.plus(7, ChronoUnit.DAYS)</code> 加 7 天。展示给用户时才转成某个时区。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== 接口、继承与注解原理 ===== -->
<section id="oop">
  <h2>接口、继承、注解：它们到底是怎么回事</h2>

  <details open>
    <summary><span class="fn">接口 interface 和 implements</span><span class="one">像一份"合同"</span></summary>
    <div class="body">
      <p>类比：手机充电口有统一标准（比如 Type-C），任何厂家只要按标准做，就能互相插。<b>接口就是这份"标准"</b>：只写"必须有哪些方法"，不写怎么做。</p>
      <ul>
        <li><code>WebMvcConfigurer</code> 是 Spring 定好的接口，里面写着"可以重写 <code>addCorsMappings</code>、<code>addInterceptors</code>……"。</li>
        <li><code>class CorsConfig implements WebMvcConfigurer</code> = "我按这份合同来做"。然后你只重写自己关心的那个方法，其他的用默认的。</li>
        <li>Spring 不认识你的 <code>CorsConfig</code>，但认识 <code>WebMvcConfigurer</code> 这个"插口"，所以能调用你。<b>这就是"框架在调用你"的机制：它只依赖接口，不依赖你的具体类</b>。</li>
        <li><code>@Override</code>：重写时贴上，意思是"我确实是在重写合同里的方法"。方法名或参数写错，编译器会立刻报错，而不是悄悄变成一个不会被调用的新方法。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">继承 extends</span><span class="one">拿到父类的全部本事</span></summary>
    <div class="body">
      <ul>
        <li><code>interface AppUserRepository extends JpaRepository&lt;AppUser, Long&gt;</code>：你的接口"继承"了 <code>JpaRepository</code>，自动拥有 <code>save</code>、<code>findById</code>、<code>findAll</code>、<code>delete</code> 等几十个方法，你一行都没写。</li>
        <li>子类可以再加自己的：你加了 <code>findByGoogleSub</code>。</li>
        <li><code>implements</code> 用于"类实现接口"，<code>extends</code> 用于"类继承类"或"接口继承接口"。</li>
      </ul>
    </div>
  </details>

  <details open>
    <summary><span class="fn">为什么 Repository 是空接口却能用</span><span class="one">Spring 在启动时偷偷造了一个类</span></summary>
    <div class="body">
      <ol>
        <li>启动时，Spring 扫描到 <code>AppUserRepository</code> 是个接口，没有实现类。</li>
        <li>它用一种叫<b>动态代理</b>的技术，在内存里<b>临时生成一个实现了这个接口的类</b>，并 new 出一个对象。你在磁盘上找不到这个类的文件，它只存在于运行中的内存里。</li>
        <li>这个临时类里每个方法的做法是：看方法名（<code>findByGoogleSub</code> → 查 <code>googleSub</code> 列）→ 生成 SQL → 交给 Hibernate 执行 → 把结果包装成返回类型。</li>
        <li>这个对象放进"对象仓库"。别的类（比如 <code>AuthController</code>）构造方法里要 <code>AppUserRepository</code>，Spring 递过去的就是它。</li>
      </ol>
      <p>你看到的是接口，运行时真正干活的是那个临时生成的类。</p>
    </div>
  </details>

  <details open>
    <summary><span class="fn">注解到底是怎么起作用的</span><span class="one">标签自己什么都不做</span></summary>
    <div class="body">
      <ul>
        <li>注解本身<b>只是一张贴纸，上面写着信息</b>，没有任何执行能力。类比 HTML 里的 <code>data-*</code> 属性：<code>&lt;div data-role="admin"&gt;</code> 自己不会让 div 变成管理员，必须有 JS 去读它。</li>
        <li>读这些贴纸的是<b>框架</b>：Spring 启动时用<b>反射</b>（程序在运行时检查自己有哪些类、方法、注解的能力），扫描每个类，看到 <code>@RestController</code> 就把它登记为接口类，看到 <code>@GetMapping("/me")</code> 就在"网址 → 方法"表里记一条。</li>
        <li><b>所以</b>：忘了贴 <code>@Component</code>，Spring 不知道要创建这个对象，用它时会报"找不到 Bean"；<code>@GetMapping</code> 路径写错，请求就找不到方法，返回 404。<b>绝大部分"明明写了代码却不生效"，都是这张贴纸没贴对。</b></li>
        <li>括号里的内容是给贴纸"填空"：<code>@Column(unique = true, nullable = false)</code> 的意思是"列的属性：唯一、非空"；<code>@GetMapping("/me")</code> 括号里只有一个值时可以省略参数名。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">三种"形状"：为什么要分 NewFavoriteWord、FavoriteWord、UserView</span><span class="one">入口、存储、出口各有各的</span></summary>
    <div class="body">
      <div class="scroll"><table>
        <tr><th>形状</th><th>例子</th><th>管什么</th><th>为什么单独定义</th></tr>
        <tr><td>进来的</td><td><code>NewFavoriteWord</code>、<code>GoogleLoginRequest</code></td><td>前端能传什么</td><td>只放前端该决定的字段，堵死前端伪造 <code>userId</code>、<code>id</code></td></tr>
        <tr><td>存起来的</td><td><code>FavoriteWord</code>、<code>AppUser</code></td><td>数据库一行长什么样</td><td>包含全部字段，包括内部的</td></tr>
        <tr><td>出去的</td><td><code>UserView</code>、<code>LoginResponse</code></td><td>前端能看到什么</td><td>只给前端需要的，<code>googleSub</code> 这类不外露</td></tr>
      </table></div>
      <p>看上去很啰嗦，但这是后端最基本的安全习惯：<b>进来的、存的、出去的，分开控制</b>。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">异常：抛出、捕获、读堆栈</span><span class="one">出错了程序是怎么反应的</span></summary>
    <div class="body">
      <ul>
        <li><b>异常</b>是"出错了"的信号。代码里 <code>throw</code> 一个（或库替你抛），程序会立刻<b>中断当前方法，一层层往外找能处理它的 <code>catch</code></b>。一直找不到，这次请求就以 500 结束。</li>
        <li><code>catch (JWTVerificationException e)</code>：只接住这一种异常。你的 <code>JwtService.verify</code> 就靠它把"所有验证失败"统一变成 <code>null</code>。</li>
        <li>两大类：<b>受检异常</b>（编译器强制你处理或用 <code>throws</code> 声明），和<b>运行时异常</b>（如空指针，不强制）。</li>
        <li><b>堆栈（stack trace）</b>是出错时打印的一长串，列出"出错时一层层调用了哪些方法"。<b>第一行是什么异常，往下第一条以 <code>com.goenkon.ielts</code> 开头的行就是你自己的代码出事的位置</b>，其余是框架内部的，先不用看。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== 机器在做什么 ===== -->
<section id="jvm">
  <h2>机器在做什么</h2>
  <div class="paper b note">前端代码跑在浏览器里，页面交互是它的主要工作。后端是一个<b>常驻的进程</b>：启动后一直占着内存和一个端口，等着别人来敲门。下面是几块底层知识，理解了它们，很多"为什么这样写"就通了。</div>

  <details open>
    <summary><span class="fn">从 .java 到跑起来</span><span class="one">编译、打包、JVM</span></summary>
    <div class="body">
      <ol>
        <li>你写 <code>.java</code> 源码（人看得懂）。</li>
        <li><b>编译</b>：<code>javac</code> 把它变成 <code>.class</code> 字节码（JVM 看得懂，CPU 看不懂）。拼写错误、类型不对、漏分号都在这一步报错，所以 Java 的错误很多出在"启动之前"。</li>
        <li><b>打包</b>：<code>mvn package</code> 把所有 <code>.class</code> 和依赖的 jar 合成一个可运行的大 jar。</li>
        <li><b>运行</b>：<code>java -jar app.jar</code> 启动一个<b>JVM（Java 虚拟机）进程</b>。JVM 读字节码，边解释边把热点代码编译成机器码执行。</li>
      </ol>
      <p>"Write once, run anywhere"：同一份 jar 在 Mac、Linux 服务器上都能跑，因为各平台上装的 JVM 负责翻译。所以服务器上只要装 JDK 或 JRE，就能运行你在 Mac 上打的包。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">内存：栈和堆</span><span class="one">变量和对象住在哪</span></summary>
    <div class="body">
      <ul>
        <li><b>栈（stack）</b>：每次调用一个方法，就在栈上开一小块，放这个方法的局部变量和参数；方法一结束，这块就自动回收。速度很快。</li>
        <li><b>堆（heap）</b>：<code>new</code> 出来的对象都放在堆上，体积较大、存活时间不固定。栈上的变量里存的只是一个<b>引用（地址）</b>，指向堆里的对象。</li>
        <li>所以 <code>AppUser user = ...</code>：<code>user</code> 在栈上，是个地址；真正的用户数据在堆上。<code>null</code> 就是"这个地址什么也没指"。</li>
        <li><b>垃圾回收（GC）</b>：JVM 定期找出堆里"已经没有任何引用指着"的对象并回收内存。Java 不用你手动释放内存，这是它和 C 的一个大区别。</li>
        <li><code>long</code>、<code>int</code> 这些基本类型的值直接放在栈上或对象里；<code>Long</code>、<code>String</code> 是对象，放堆上。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">端口、进程、线程</span><span class="one">请求是怎么被接住的</span></summary>
    <div class="body">
      <ul>
        <li><b>进程</b>：运行中的程序，操作系统给它独立的内存。你点 Run，就是启动了一个 JVM 进程。</li>
        <li><b>端口</b>：一台机器上的"门牌号"。我们的后端在 <b>8080</b> 端口监听，别的程序想用同一个端口会报"Port 8080 was already in use"，通常是因为你上一次启动的后端还没关。</li>
        <li><b>内嵌 Tomcat</b>：Spring Boot 把一个叫 Tomcat 的服务器打包在程序里。它负责在 8080 监听、把网络上一串字节解析成 HTTP 请求。</li>
        <li><b>线程</b>：一个进程里可以同时有多条执行线。Tomcat 有一个线程池，<b>每个到来的请求由一个线程处理</b>，同时来 100 个请求就有大约 100 个线程在并行跑你的 Controller 方法。</li>
        <li><b>所以单例对象里不能存"某个用户的数据"</b>：<code>FavoriteWordController</code> 整个程序只有一个对象，所有线程共用它。如果在字段里存 <code>currentUserId</code>，两个请求同时进来就会互相覆盖。每个请求自己的数据放在方法参数和局部变量里，它们在各自线程的栈上，互不干扰。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">文件和数据库在哪</span><span class="one">H2 文件、jar、配置</span></summary>
    <div class="body">
      <ul>
        <li><code>jdbc:h2:file:./data/ielts</code>：<code>./</code> 是<b>启动命令所在的目录</b>。在 IntelliJ 里运行，就是项目目录下生成一个 <code>data/ielts.mv.db</code> 文件，数据库的内容都在这个文件里。把它删了，数据就没了。</li>
        <li>部署平台（云服务器、容器）重启后文件系统常常是全新的，所以上线要用独立的数据库服务（如 PostgreSQL），不能靠本地文件。</li>
        <li>环境变量：操作系统给进程的一组键值，进程启动时带着。<code>${APP_JWT_SECRET:默认值}</code> 就是读它。密钥这类东西放环境变量，不写进代码，也不推到 GitHub。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== Spring 核心 ===== -->
<section id="spring">
  <h2>Spring 核心思想</h2>

  <details open>
    <summary><span class="fn">它到底是什么</span><span class="one">一个"帮你 new 对象并接线"的框架</span></summary>
    <div class="body">
      <p>没有 Spring 时，你要自己写：创建数据库连接、创建 Repository、创建 Controller、把它们互相传来传去、监听端口、解析 HTTP……Spring 把这些通用工作全包了，你只写"业务那一小段"。</p>
      <ul>
        <li><b>IoC 容器（对象仓库）</b>：Spring 启动时创建所有被标记的对象，放进一个仓库里，这些对象叫 <b>Bean</b>。</li>
        <li><b>依赖注入（DI）</b>：一个对象需要别的对象时，在构造方法里声明，Spring 从仓库里取出来递给它。你从不写 <code>new</code> 它们。</li>
        <li><b>组件扫描</b>：从启动类所在的包往下，找所有带 <code>@Component / @Service / @RestController / @Configuration</code> 的类，登记成 Bean。</li>
        <li><b>自动配置</b>：看到 classpath 里有 H2、JPA、Web 等库，就自动做好对应的配置。<code>pom.xml</code> 里的 <code>starter</code> 就是"一包相关的依赖加自动配置"。</li>
        <li><b>控制反转</b>：本来是你的代码去创建、调用别人；现在是<b>框架创建你的对象、在合适的时机调用你的方法</b>。控制权反过来了，所以叫"反转"。</li>
      </ul>
    </div>
  </details>

  <details open>
    <summary><span class="fn">一个请求在 Spring 里的旅程</span><span class="one">从 8080 到 JSON</span></summary>
    <div class="body">
      <ol>
        <li><b>Tomcat</b> 在 8080 收到一串字节，解析成 HTTP 请求，从线程池拿一个线程来处理。</li>
        <li><b>CORS 检查</b>：如果是 OPTIONS 预检，按 <code>CorsConfig</code> 的规则直接应答。</li>
        <li><b>DispatcherServlet</b>（Spring MVC 的总调度）根据 <b>方法 + 路径</b>，查启动时登记好的"网址 → 方法"表，找到该调用哪个 Controller 方法。</li>
        <li><b>拦截器</b>：如果路径在 <code>WebAuthConfig</code> 登记的范围里，先执行 <code>AuthInterceptor.preHandle</code>。返回 <code>false</code> 就在这里结束。</li>
        <li><b>参数解析</b>：Spring 看着方法参数上的注解（<code>@RequestBody</code>、<code>@PathVariable</code>、<code>@RequestAttribute</code>……），从请求里取出对应的值，转成参数类型。请求体 JSON 由 <b>Jackson</b> 转成 Java 对象。</li>
        <li><b>调用你的方法</b>。</li>
        <li><b>返回值转换</b>：Jackson 把返回的对象转成 JSON 字符串，写进 HTTP 响应，状态码默认 200；如果返回的是 <code>ResponseEntity</code>，就用你指定的状态码。</li>
        <li>响应从同一个 Tomcat 连接发回浏览器，线程回到线程池。</li>
      </ol>
    </div>
  </details>

  <details>
    <summary><span class="fn">Controller → Repository → 数据库</span><span class="one">三层分工</span></summary>
    <div class="body">
      <ul>
        <li><b>Controller</b>：接请求、校验参数、决定返回什么状态码和内容。<b>只管"HTTP 这一层"</b>。</li>
        <li><b>Service</b>（业务层，我们的 <code>JwtService</code> 是个例子）：放"业务规则"。业务变复杂后，Controller 里的逻辑应该下沉到 Service，我们现在规模小，直接写在 Controller 里。</li>
        <li><b>Repository</b>：只负责和数据库打交道，增删改查。</li>
        <li><b>Entity</b>：和数据库表一一对应的类。</li>
        <li>分层的好处：换数据库只改 Repository 一层；加登录方式只改 Auth 相关；每一层只做一件事，出错时更容易定位。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">Spring Boot 的"约定大于配置"</span><span class="one">为什么写得这么少就能跑</span></summary>
    <div class="body">
      <ul>
        <li>端口默认 8080、配置文件默认叫 <code>application.properties</code>、静态资源默认放哪里……都有默认值，你只改要改的。</li>
        <li>配置文件里的 <code>spring.xxx</code> 全是官方定义的 key；想改端口就写 <code>server.port=9000</code>。</li>
        <li>文件放对位置就生效：<code>src/main/java</code> 放代码，<code>src/main/resources</code> 放配置，<code>src/test/java</code> 放测试。位置错了，Spring 看不到它们。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== 走一遍 googleLogin ===== -->
<section id="walk">
  <h2>把 googleLogin 一行行走一遍</h2>
  <div class="paper y note">场景：Goen 第一次点"用 Google 登录"。前端把 Google 给的证明书发来：<code>POST /auth/google</code>，请求体 <code>{"idToken":"eyJ...xyz"}</code>。下面是机器逐步在做的事，以及每一步之后"内存里有什么"。</div>
  <div class="paper"><div class="scroll"><table>
    <tr><th>步骤</th><th>代码</th><th>机器在做什么</th><th>这时内存里</th></tr>
    <tr><td>0<br>启动时</td><td>构造器 <code>AuthController(verifier, repo, jwt)</code></td><td>Spring 先创建那三个对象，再 <code>new AuthController</code>，把三个对象存进字段。<b>只发生一次</b>，之后所有请求共用</td><td>堆里有 4 个长期存在的对象，互相指着</td></tr>
    <tr><td>1<br>请求到达</td><td>—（框架）</td><td>Tomcat 收到字节，解析成 HTTP 请求，分配一个线程；DispatcherServlet 查表找到 <code>googleLogin</code>；Jackson 把请求体 JSON 变成 <code>GoogleLoginRequest</code> 对象</td><td>栈：参数 <code>body</code> → 堆里的对象，里面 <code>idToken = "eyJ...xyz"</code></td></tr>
    <tr><td>2</td><td><code>googleTokenVerifier.verify(body.idToken())</code></td><td>先取出字符串；verifier 用 Google 公钥核对签名、有效期、受众，通过后 new 一个 <code>GoogleUser</code></td><td>栈：<code>g</code> → <code>GoogleUser(sub="1045…", email, name, picture)</code></td></tr>
    <tr><td>3</td><td><code>if (g == null) return 401</code></td><td>这里 <code>g</code> 不是 null，条件为假，直接跳过这个块</td><td>不变</td></tr>
    <tr><td>4</td><td><code>userRepository.findByGoogleSub(g.sub())</code></td><td>临时代理对象生成 <code>select ... where google_sub = ?</code>，从连接池借一条连接发给 H2。<b>新用户，没查到</b>，返回空的 <code>Optional</code></td><td>栈上一个空 Optional（还没赋给 <code>user</code>）</td></tr>
    <tr><td>5</td><td><code>.orElseGet(() -&gt; userRepository.save(new AppUser(...)))</code></td><td>盒子是空的，所以<b>现在才执行 lambda</b>：new 一个 <code>AppUser</code>（<code>id = null</code>、<code>createdAt = 现在</code>），<code>save</code> 发出 <code>INSERT</code>，H2 自增分配 <code>id = 1</code>，回填到对象上，返回它</td><td>栈：<code>user</code> → 堆里的 <code>AppUser(id=1, googleSub=…)</code>。数据库多了一行</td></tr>
    <tr><td>6</td><td><code>jwtService.create(user.getId())</code></td><td><code>1</code> 转成字符串 <code>"1"</code>，加上发行和过期时间，用密钥做 HMAC 签名，拼成 <code>"头.内容.签名"</code></td><td>栈：<code>token</code> → 字符串 <code>"eyJ…"</code></td></tr>
    <tr><td>7</td><td><code>ResponseEntity.ok(new LoginResponse(token, toView(user)))</code></td><td><code>toView</code> 只挑 id、email、name、picture 造一个 <code>UserView</code>（没有 googleSub），再包进 <code>LoginResponse</code>，包进状态 200 的 <code>ResponseEntity</code></td><td>堆里新增几个短命对象</td></tr>
    <tr><td>8<br>收尾</td><td><code>return</code></td><td>方法结束，栈上的 <code>body</code>、<code>g</code>、<code>user</code>、<code>token</code> 随之消失。Spring 用 Jackson 把返回值转成 JSON，状态码 200，发回浏览器，线程回线程池。堆里没人指着的对象等 GC 回收；<b>数据库里那行用户会一直在</b></td><td>方法局部变量全部清空</td></tr>
  </table></div></div>
  <p class="note"><b>同一个人第二次登录时</b>：步骤 4 会查到用户，返回里面装着 <code>AppUser</code> 的 Optional；步骤 5 里 <code>orElseGet</code> 发现盒子不空，<b>括号里的 lambda 根本不执行</b>，直接拿现成的用户。这就是"注册和登录是同一个流程"的全部秘密。</p>
</section>

<!-- ===== 数据库 ===== -->
<section id="db">
  <h2>数据库</h2>
  <div class="paper g note">数据库就是"一组表格，加一套查询它们的语言（SQL）"。你可以把一张表想成一个 Excel 工作表：表头是<b>列</b>，每一行是一条<b>记录</b>。</div>

  <details open>
    <summary><span class="fn">你的两张表</span><span class="one">app_user 和 favorite_word</span></summary>
    <div class="body">
      <div class="two">
        <div>
          <p style="margin-top:0"><b>app_user</b></p>
          <div class="scroll"><table>
            <tr><th>id</th><th>google_sub</th><th>email</th><th>name</th></tr>
            <tr><td>1</td><td>1045…</td><td>a@gmail.com</td><td>Goen</td></tr>
            <tr><td>2</td><td>9921…</td><td>b@gmail.com</td><td>Amy</td></tr>
          </table></div>
        </div>
        <div>
          <p style="margin-top:0"><b>favorite_word</b></p>
          <div class="scroll"><table>
            <tr><th>id</th><th>user_id</th><th>kind</th><th>word</th><th>status</th></tr>
            <tr><td>1</td><td>1</td><td>w</td><td>mitigate</td><td>unknown</td></tr>
            <tr><td>2</td><td>1</td><td>p</td><td>give rise to</td><td>unknown</td></tr>
            <tr><td>3</td><td>2</td><td>w</td><td>mitigate</td><td>unknown</td></tr>
          </table></div>
        </div>
      </div>
      <p><code>favorite_word.user_id</code> 的值指向 <code>app_user.id</code>：这就是"这条收藏属于谁"。同一个单词 <code>mitigate</code> 在两个用户名下各有一行。</p>
      <p>Java 字段 <code>googleSub</code> 在数据库里自动变成列名 <code>google_sub</code>（驼峰变下划线）。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">表里的几个基本概念</span><span class="one">主键、唯一、非空、外键、索引</span></summary>
    <div class="body">
      <ul>
        <li><b>主键（primary key）</b>：每一行唯一的身份编号。<code>@Id</code> 标出来，数据库保证不重复、不为空。</li>
        <li><b>自增</b>：<code>GenerationType.IDENTITY</code>，每插入一行数据库自动给下一个编号，所以你 <code>save</code> 之前 id 是 null，之后才有值。</li>
        <li><b>唯一约束（unique）</b>：这一列的值不能重复。<code>googleSub</code> 就设了，数据库本身保证同一个 Google 账号不会有两行。</li>
        <li><b>非空（not null）</b>：这一列必须有值。</li>
        <li><b>外键（foreign key）</b>：一列的值必须指向另一张表的主键。我们目前没有设数据库层面的外键，<code>userId</code> 只是个普通数字，"它指向谁"由代码保证。关系变复杂后会用 <code>@ManyToOne</code> 等声明。</li>
        <li><b>索引（index）</b>：像书的目录，让"按某一列查"变快。主键和唯一列自带索引。数据量变大后，经常用来查的列（比如 <code>user_id</code>）应该加索引。</li>
      </ul>
    </div>
  </details>

  <details open>
    <summary><span class="fn">SQL：四个基本动作</span><span class="one">增、删、改、查</span></summary>
    <div class="body">
      <p>你的 Controller 每个方法，最终都变成其中一条 SQL，运行时 <code>show-sql=true</code> 会把它们打印在控制台：</p>
<pre><code>-- 查：GET /favorites → findByUserId(1)
SELECT * FROM favorite_word WHERE user_id = 1;

-- 增：POST /favorites → save(new FavoriteWord(...))
INSERT INTO favorite_word (user_id, kind, word, status)
VALUES (1, 'w', 'mitigate', 'unknown');

-- 改：PUT /favorites/3 → 改完 status 再 save
UPDATE favorite_word SET status = 'known' WHERE id = 3 AND user_id = 1;

-- 删：DELETE /favorites/3 → delete(...)
DELETE FROM favorite_word WHERE id = 3;</code></pre>
      <ul>
        <li><code>WHERE</code> 是条件。<code>AND</code> 连接多个条件，<code>findByIdAndUserId</code> 里的 <code>And</code> 就对应它。</li>
        <li>不写 <code>WHERE</code> 的 <code>DELETE</code> 会删掉整张表。所以删除一定要带条件。</li>
        <li>字符串在 SQL 里用单引号。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">JPA / Hibernate</span><span class="one">不写 SQL 也能操作数据库</span></summary>
    <div class="body">
      <ul>
        <li><b>JDBC</b>：Java 连接数据库的最底层标准，自己写 SQL、自己处理结果集，繁琐。</li>
        <li><b>JPA</b>：一套"用 Java 对象操作数据库"的规范；<b>Hibernate</b> 是它最常用的实现。这类工具叫 <b>ORM</b>（对象关系映射）：类 ↔ 表，对象 ↔ 行，字段 ↔ 列。</li>
        <li>启动时 Hibernate 读 <code>@Entity</code> 类，按 <code>ddl-auto</code> 的设置建表或补列。</li>
        <li><code>repository.save(x)</code>：如果 <code>x.id</code> 是 <code>null</code>，生成 <code>INSERT</code>；有 id 就生成 <code>UPDATE</code>。</li>
        <li>派生查询：<code>findByUserIdAndKindAndWord</code> 这个方法名被 Spring Data 拆成 <code>WHERE user_id = ? AND kind = ? AND word = ?</code>。字段名写错启动就报错。</li>
        <li><b>JDBC 地址</b>：<code>jdbc:h2:file:./data/ielts</code> 从左到右是：<b>协议 jdbc : 数据库类型 h2 : 存储方式 file : 路径</b>。换成 PostgreSQL 会变成 <code>jdbc:postgresql://主机:5432/库名</code>。</li>
        <li><b>连接池</b>：每次请求都新建数据库连接很慢，所以 Spring Boot 默认用 HikariCP 提前建好几条连接放着，请求来了借一条，用完还回去。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">H2 和 PostgreSQL</span><span class="one">为什么上线要换</span></summary>
    <div class="body">
      <div class="scroll"><table>
        <tr><th></th><th>H2</th><th>PostgreSQL</th></tr>
        <tr><td>运行方式</td><td>嵌在你的 Java 程序里，数据是一个文件</td><td>独立的数据库服务器，另一个进程，通过网络连接</td></tr>
        <tr><td>适合</td><td>本地开发、练习</td><td>上线、多用户、长期保存</td></tr>
        <tr><td>数据位置</td><td>启动目录下的 <code>data/</code></td><td>数据库服务器自己的磁盘</td></tr>
        <tr><td>多个程序同时用</td><td>基本不行</td><td>可以，很多服务可以连同一个库</td></tr>
        <tr><td>账号权限</td><td>只有默认的 <code>sa</code></td><td>完整的用户和权限管理，要用环境变量保存账号密码</td></tr>
      </table></div>
      <p>你的 Java 代码<b>几乎不用改</b>，因为都是通过 JPA 操作的，只需换 <code>pom.xml</code> 里的驱动依赖和 <code>application.properties</code> 里的连接信息。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">事务和并发</span><span class="one">两个请求同时来会怎样</span></summary>
    <div class="body">
      <ul>
        <li><b>事务（transaction）</b>：一组数据库操作，要么全部成功，要么全部撤销，像转账"扣钱和加钱必须一起成功"。<code>@Transactional</code> 就是声明这一点。</li>
        <li>我们现在每个接口基本只做一次写入，不需要显式事务。</li>
        <li><b>一个潜在问题</b>：新增收藏的流程是"先查有没有 → 没有就写入"。如果同一个用户连点两次，两个请求几乎同时到达，两个线程都查到"没有"，就都会写入，出现重复。上线前的稳妥做法是在数据库里给 <code>(user_id, kind, word)</code> 加一个<b>联合唯一约束</b>，让数据库本身拒绝重复，代码里的检查只当第一道关。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== 联合唯一约束 ===== -->
<section id="unique">
  <h2>上线前建议加的一道保险：联合唯一约束</h2>
  <div class="paper p note">问题：新增收藏是"先查有没有，没有再写入"。查和写之间有一个间隙。同一个人连点两下，两个请求几乎同时到达，两个线程都查到"没有"，就会各写一条，出现重复收藏。<br>解法：让<b>数据库自己</b>拒绝重复。数据库在写入的那一刻原子地检查，不会有间隙。</div>

  <details open>
    <summary><span class="fn">怎么改（三步，改的都是你已有的文件）</span><span class="one">不着急，上线前做就行</span></summary>
    <div class="body">
      <p><b>第一步：在 <code>FavoriteWord</code> 类上加约束。</b>找到类上面的 <code>@Entity</code>，在它下面加一行 <code>@Table</code>：</p>
<pre><code>@Entity
@Table(
    name = "favorite_word",
    uniqueConstraints = @UniqueConstraint(columnNames = {"user_id", "kind", "word"})
)
public class FavoriteWord {</code></pre>
      <ul>
        <li><code>@Table</code>：指定表名并附加约束。这里表名保持默认的 <code>favorite_word</code>。</li>
        <li><code>@UniqueConstraint(columnNames = {...})</code>：这三列<b>合起来</b>不能重复。同一个人的 <code>(w, mitigate)</code> 只能有一行；不同的人可以各有一行。</li>
        <li><code>columnNames</code> 里写的是<b>数据库的列名</b>（下划线），不是 Java 字段名：<code>userId</code> → <code>user_id</code>。</li>
        <li>文件顶部要能识别 <code>@Table</code> 和 <code>@UniqueConstraint</code>：如果你的 import 是 <code>import jakarta.persistence.*;</code> 就已经包含；如果是一个个 import 的，补上 <code>import jakarta.persistence.Table;</code> 和 <code>import jakarta.persistence.UniqueConstraint;</code>。</li>
      </ul>
      <p><b>第二步：让 Controller 在撞到约束时优雅处理。</b>现在 <code>POST</code> 里的"先查再存"保留，它是第一道关。只在极少数并发时才会撞到约束，那时 <code>save</code> 会抛出 <code>DataIntegrityViolationException</code>。把 <code>save</code> 那一句包进 <code>try/catch</code>，捕获后重新查一次并返回已有的那条：</p>
<pre><code>try {
    return repository.save(new FavoriteWord(userId, kind, word, status));
} catch (DataIntegrityViolationException e) {
    // 另一个请求刚好抢先写入了同一条：直接返回那一条
    return repository.findByUserIdAndKindAndWord(userId, kind, word).orElseThrow();
}</code></pre>
      <p>需要 <code>import org.springframework.dao.DataIntegrityViolationException;</code>。变量名请换成你 Controller 里实际用的那几个。<code>orElseThrow()</code> 表示"盒子是空的就抛异常"，这里理论上不会空。</p>
      <p><b>第三步：重启后检查。</b>启动时看控制台，因为 <code>ddl-auto=update</code>，Hibernate 会尝试给已有的表加上这个约束。<b>如果你的 <code>favorite_word</code> 里已经有重复的行，加约束会失败</b>（会在日志里报错但不一定停止启动）。先在 H2 控制台查一下：</p>
<pre><code>SELECT user_id, kind, word, COUNT(*) FROM favorite_word
GROUP BY user_id, kind, word HAVING COUNT(*) &gt; 1;</code></pre>
      <p>没有结果就没有重复；有结果就把多余的行 <code>DELETE</code> 掉再重启。上线用的是全新的 PostgreSQL，不会有这个问题，建表时就直接带着约束。</p>
    </div>
  </details>
</section>

  <h2>自己动手看一遍：比读十遍都有用</h2>
  <div class="paper g note">下面三件事都不会改动你的代码，只是"看"。看到真实的数据，概念就不再模糊了。</div>

  <details open>
    <summary><span class="fn">一、用断点看变量（IntelliJ Debug）</span><span class="one">亲眼看 googleLogin 一步步走</span></summary>

<!-- ===== 常见报错 ===== -->
<section id="err">
  <h2>常见报错对照表</h2>
  <div class="paper"><div class="scroll"><table>
    <tr><th>你看到的</th><th>大概意思</th><th>先查什么</th></tr>
    <tr><td><code>Port 8080 was already in use</code></td><td>8080 端口已经被占用</td><td>上一次启动的后端没关，先 Stop 再 Run</td></tr>
    <tr><td>浏览器报 CORS error</td><td>后端没有允许你页面的来源</td><td><code>CorsConfig</code> 的 <code>allowedOrigins</code> 有没有这个 <b>协议+域名+端口</b>；改完要重启后端</td></tr>
    <tr><td><code>400 Bad Request</code></td><td>请求格式不对，或被我们的校验拒绝</td><td>JSON 字段名对不对；<code>kind</code> 是不是 w/p；<code>word</code> 是不是空</td></tr>
    <tr><td><code>401 Unauthorized</code></td><td>没带 token、token 过期、token 是假的</td><td>请求头有没有 <code>Authorization: Bearer ...</code>；token 是不是过期（7 天）；密钥有没有变</td></tr>
    <tr><td><code>404 Not Found</code></td><td>没有这个路径</td><td>路径和方法有没有拼错；类有没有被扫描到（包位置对不对）</td></tr>
    <tr><td><code>405 Method Not Allowed</code></td><td>路径对，但方法不对</td><td>该用 POST 却发了 GET</td></tr>
    <tr><td><code>500 Internal Server Error</code></td><td>后端代码出了异常</td><td>看控制台里的红色堆栈，找第一条 <code>com.goenkon...</code> 开头的行，就是出错位置</td></tr>
    <tr><td><code>NullPointerException</code></td><td>对 <code>null</code> 调用了方法</td><td>堆栈指出的那一行里，哪个变量可能是 null</td></tr>
    <tr><td>启动时 <code>Could not resolve placeholder 'xxx'</code></td><td><code>@Value</code> 找不到这个配置 key</td><td><code>application.properties</code> 里有没有拼错</td></tr>
    <tr><td>启动时 <code>No property 'xxx' found for type</code></td><td>Repository 方法名里的字段，在实体类里不存在</td><td>方法名里的字段拼写，要和实体类字段一致</td></tr>
    <tr><td>改了代码但行为没变</td><td>后端没有重新启动</td><td>先 Stop 再 Run；前端改了要刷新页面</td></tr>
  </table></div></div>
  <p class="note">看堆栈的诀窍：从上往下找第一条以你自己包名 <code>com.goenkon.ielts</code> 开头的行，那里就是你的代码出事的地方；框架内部的行先不管。</p>
</section>

<!-- ===== 名词表 ===== -->
<section id="gloss">
  <h2>名词表：遇到就来查</h2>
  <div class="paper"><div class="scroll"><table>
    <tr><th>名词</th><th>白话</th></tr>
    <tr><td>后端 / 服务器</td><td>一直开着、收请求、回响应的程序</td></tr>
    <tr><td>接口 / API / endpoint</td><td>后端对外开放的一个"方法 + 路径"，比如 <code>POST /favorites</code>（注意和 Java 的 <code>interface</code> 是两个概念）</td></tr>
    <tr><td>请求 / 响应</td><td>前端发来的一段文字 / 后端回的一段文字</td></tr>
    <tr><td>JSON</td><td>网络上传数据用的文字格式，和 JS 对象写法几乎一样</td></tr>
    <tr><td>端口</td><td>一台机器上的"门牌号"，我们在 8080</td></tr>
    <tr><td>进程 / 线程</td><td>运行中的程序 / 程序里同时跑的多条执行线</td></tr>
    <tr><td>JDK / JVM</td><td>Java 开发工具包 / 运行字节码的虚拟机</td></tr>
    <tr><td>Maven</td><td>管理依赖、编译、打包的工具；<code>pom.xml</code> 是它的说明书</td></tr>
    <tr><td>jar</td><td>Java 的打包文件，可以是库，也可以是整个可运行的程序</td></tr>
    <tr><td>依赖（dependency）</td><td>你的项目用到的外部库</td></tr>
    <tr><td>classpath</td><td>JVM 找类和库的位置清单</td></tr>
    <tr><td>Spring / Spring Boot</td><td>帮你创建对象、接线、处理请求的框架 / 把它预先配好的版本</td></tr>
    <tr><td>Bean</td><td>被 Spring 创建并放进对象仓库管理的对象</td></tr>
    <tr><td>IoC / 控制反转</td><td>不是你调用框架，而是框架创建对象并调用你</td></tr>
    <tr><td>DI / 依赖注入</td><td>对象需要的东西，由 Spring 通过构造方法递给它</td></tr>
    <tr><td>单例</td><td>某个类全程序只创建一个对象，所有请求共用</td></tr>
    <tr><td>Controller / Service / Repository / Entity</td><td>接请求的层 / 业务规则层 / 访问数据库的层 / 和表对应的类</td></tr>
    <tr><td>DTO</td><td>只用来传数据的"盒子"，比如 <code>NewFavoriteWord</code></td></tr>
    <tr><td>ORM / JPA / Hibernate</td><td>用对象操作数据库的技术 / 它的规范 / 它的常用实现</td></tr>
    <tr><td>SQL</td><td>查询和修改数据库的语言</td></tr>
    <tr><td>主键 / 外键 / 索引</td><td>每行唯一编号 / 指向别的表的编号 / 加速查询的"目录"</td></tr>
    <tr><td>事务</td><td>一组操作要么全成功要么全撤销</td></tr>
    <tr><td>连接池</td><td>提前建好的几条数据库连接，请求来了借用</td></tr>
    <tr><td>CORS / 跨域</td><td>浏览器规定：网页只能读"自己同一个来源"的响应，除非对方明确允许</td></tr>
    <tr><td>预检（preflight）</td><td>浏览器正式请求前，先发一个 OPTIONS 问对方允不允许</td></tr>
    <tr><td>拦截器</td><td>请求进入 Controller 之前的检查站（门卫）</td></tr>
    <tr><td>JWT</td><td>带签名的字符串，里面写着用户 id 和过期时间，后端用密钥验证真伪</td></tr>
    <tr><td>Bearer</td><td>"持票人"：请求头里 <code>Authorization: Bearer token</code> 的格式</td></tr>
    <tr><td>OAuth / Google 登录</td><td>让 Google 帮你确认"这个人是谁"，我们不碰密码</td></tr>
    <tr><td>IDOR</td><td>改个 id 就能操作别人的数据的漏洞；解法是永远带上 userId 一起查</td></tr>
    <tr><td>环境变量</td><td>操作系统给进程的一组键值，用来放密钥等不想写进代码的东西</td></tr>
    <tr><td>无状态</td><td>服务器不记得你，每个请求都要自己出示身份</td></tr>
    <tr><td>堆栈（stack trace）</td><td>出错时打印的"调用路径"，找以你包名开头的第一行</td></tr>
    <tr><td>GC（垃圾回收）</td><td>JVM 自动回收没人引用的对象的内存</td></tr>
  </table></div></div>
</section>

<!-- ===== 和前端的区别 ===== -->
<section id="diff">
  <h2>先回答：后端和前端的思路差在哪</h2>
  <div class="paper y note">前端是<b>从用户看到的东西开始想</b>：这个页面长什么样、有哪些组件、点了会怎样，所以按<b>页面和组件</b>来组织。后端没有页面，用户看不到它，所以是<b>从"数据和规则"开始想</b>：要存什么、谁能碰、碰之前要检查什么，按<b>功能（资源）和职责</b>来组织。</div>
  <div class="paper"><div class="scroll"><table>
    <tr><th></th><th>前端</th><th>后端</th></tr>
    <tr><td>起点</td><td>设计稿、页面</td><td>要存的数据、接口约定</td></tr>
    <tr><td>代码按什么分</td><td>页面 / 组件</td><td>功能（收藏、登录）+ 职责（接请求、查数据库、放配置）</td></tr>
    <tr><td>一个文件</td><td>一个页面或组件，里面混着模板、样式、逻辑</td><td>一个类，只干<b>一件事</b></td></tr>
    <tr><td>谁调用你的代码</td><td>浏览器（用户点击）</td><td>框架（收到请求）</td></tr>
    <tr><td>最怕什么</td><td>界面错位、体验卡</td><td><b>数据错、权限漏、重复写、并发</b></td></tr>
    <tr><td>怎么验证</td><td>打开页面看</td><td>用 curl、前端页面或断点发请求，看返回和数据库</td></tr>
    <tr><td>出错的代价</td><td>用户看到难看的界面</td><td>数据被改错、别人的数据被看到，<b>更严重，也更难撤回</b></td></tr>
  </table></div></div>
  <p class="note">所以后端有一条贯穿始终的习惯：<b>写每一段代码前，先问"谁能调用它、它会改什么数据、出错了怎么办"</b>。</p>

<section id="file">

  <h3>Java 的两条规则</h3>

      <li>所以"文件 = 类"。想知道一个文件干嘛，看它的类名和类上面的注解。</li>

        <text x="40" y="166" font-size="14.5" font-weight="700">（Service 业务规则）</text><text x="40" y="184">我们的项目规则少，写在 Controller 里</text><text x="40" y="198" font-size="11.5">规则变复杂后再拆出来</text>
        <text x="40" y="258" font-size="14.5" font-weight="700">Repository 访问数据库</text><text x="40" y="276">FavoriteWordRepository</text><text x="40" y="290" font-size="11.5">只负责查、存、删</text>
        <text x="40" y="350" font-size="14.5" font-weight="700">Entity 和表对应</text><text x="40" y="368">FavoriteWord → favorite_word 表</text><text x="40" y="382" font-size="11.5">一个对象 = 表里一行</text>
        <text x="420" y="74" font-size="14.5" font-weight="700">DTO 请求/响应的形状</text><text x="420" y="92">NewFavoriteWord（进来的）</text><text x="420" y="106" font-size="11.5">只放前端该决定的字段</text>
        <text x="420" y="166" font-size="14.5" font-weight="700">Config 配置类</text><text x="420" y="184">WebAuthConfig、CorsConfig</text><text x="420" y="198" font-size="11.5">规定全局规则：谁被保护、谁能跨域</text>
      </g>
      <text x="404" y="250" font-size="13" fill="var(--mute)" stroke="none">虚线：这些文件配合 Controller 工作，但不在</text>
      <text x="404" y="268" font-size="13" fill="var(--mute)" stroke="none">"Controller → 数据库"这条主线上。</text>
    </svg>
    <p style="margin-bottom:0">主线是<b>Controller → (Service) → Repository → Entity → 数据库</b>。每一层只认识下一层，不越级：Controller 不直接写 SQL，Repository 不管 HTTP 状态码。这样出了问题能一层层往下查，改一处也不会牵动全部。</p>
  </div>

  <h3>判断"这个东西该放哪个文件"的问法</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>如果它是……</th><th>就放</th><th>你项目里的例子</th></tr>
    <tr><td>"收到一个请求该怎么回"</td><td>Controller</td><td><code>FavoriteWordController</code>、<code>AuthController</code></td></tr>
    <tr><td>"数据库里的一张表长什么样"</td><td>Entity</td><td><code>AppUser</code>、<code>FavoriteWord</code></td></tr>
    <tr><td>"怎么查这张表"</td><td>Repository</td><td><code>AppUserRepository</code></td></tr>
    <tr><td>"前端发来的数据长什么样 / 我们回什么样"</td><td>DTO（record）</td><td><code>NewFavoriteWord</code>、<code>UserView</code></td></tr>
    <tr><td>"一段可复用的业务能力，和 HTTP 无关"</td><td>Service / 工具类</td><td><code>JwtService</code>、<code>GoogleTokenVerifier</code></td></tr>
    <tr><td>"全局的规则或设置"</td><td>Config</td><td><code>CorsConfig</code>、<code>WebAuthConfig</code></td></tr>
    <tr><td>"进入 Controller 之前的统一检查"</td><td>Interceptor</td><td><code>AuthInterceptor</code></td></tr>
  </table></div></div>
  <p class="note">一个最实用的信号：<b>一个类要是同时在处理 HTTP、写 SQL、还算业务规则，就太杂了，该拆</b>。反过来，一个文件只有两行也不用担心，职责单一是好事。</p>
</section>

<!-- ===== 新功能的顺序 ===== -->
<section id="order">
  <h2>写一个新功能，先干嘛、后干嘛</h2>
  <div class="paper y note">总原则：<b>先想清楚，再动手；先定"接口约定"，再从底往上一层层写；每写完一层，就验证一层</b>。别一口气写完五个文件再启动，出错了你都不知道是哪层的问题。下面以"收藏"为例。</div>

  <details open>
    <summary><span class="fn">第 0 步：用三句话写下需求</span><span class="one">还没写任何代码</span></summary>
    <div class="body">
      <ul>
        <li><b>谁</b>可以做<b>什么</b>？——"登录的用户可以收藏、取消收藏、查看自己的单词和短语。"</li>
        <li>要<b>存什么数据</b>？——"哪个用户收藏了什么文字，类型是单词还是短语，掌握状态。"</li>
        <li>有什么<b>规则</b>？——"同一个人对同一段文字只能收藏一次；只能操作自己的收藏。"</li>
      </ul>
      <p>这三句话回答了：<b>接口有哪些、表有哪些列、要检查什么</b>。写不出这三句话就别写代码，先继续想。</p>
    </div>
  </details>

  <details open>
    <summary><span class="fn">第 1 步：定接口约定（契约）</span><span class="one">前后端先对好暗号</span></summary>
    <div class="body">
      <p>把每个接口的"输入、输出、谁能调、错了怎么回"写下来。这就是前后端之间的合同，前端也按这份合同写：</p>
      <div class="scroll"><table>
        <tr><th>接口</th><th>要登录</th><th>请求体</th><th>成功返回</th><th>出错返回</th></tr>
        <tr><td><code>GET /favorites</code></td><td>是</td><td>无</td><td>我的收藏列表</td><td>401</td></tr>
        <tr><td><code>POST /favorites</code></td><td>是</td><td><code>{kind, word, status?}</code></td><td>那条收藏（带 id）</td><td>400 参数不对 / 401</td></tr>
        <tr><td><code>DELETE /favorites/{id}</code></td><td>是</td><td>无</td><td>200</td><td>401</td></tr>
      </table></div>
      <p>为什么先做这个：接口一旦被前端用上，再改就要两边同时改。<b>契约先定，后面才不返工</b>。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 2 步：设计数据（表）</span><span class="one">想清楚存什么，比想清楚怎么写更重要</span></summary>
    <div class="body">
      <ul>
        <li>列出每一列：<code>id</code>、<code>user_id</code>、<code>kind</code>、<code>word</code>、<code>status</code>。</li>
        <li>问自己：<b>每一列允许为空吗？要唯一吗？谁来填？</b>（<code>id</code> 数据库填，<code>user_id</code> 后端从 token 填，不让前端填）</li>
        <li>数据是后端最难改的部分：代码改了重启就行，<b>表里已有的数据要迁移</b>。所以表设计要多想一会儿。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 3 步：写 Entity</span><span class="one">把表翻译成 Java 类</span></summary>
    <div class="body">
      <ul>
        <li>新建 <code>FavoriteWord.java</code>，写字段、构造器、getter。<b>先贴 <code>@Entity</code>、<code>@Id</code>、<code>@GeneratedValue</code></b>（它们定义了"这是一张表、主键是谁"，是类的身份）。</li>
        <li>启动一次，看控制台和 H2 控制台：表有没有建出来，列名对不对。<b>这是第一个验证点</b>。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 4 步：写 Repository</span><span class="one">先只写用得上的查询</span></summary>
    <div class="body">
      <ul>
        <li>新建 <code>FavoriteWordRepository</code> 接口，继承 <code>JpaRepository&lt;FavoriteWord, Long&gt;</code>。</li>
        <li>按第 1 步的契约，想一想需要哪些查询：列表要 <code>findByUserId</code>；删除要 <code>findByIdAndUserId</code>；去重要 <code>findByUserIdAndKindAndWord</code>。<b>用到才加，不预先加一堆</b>。</li>
        <li>验证：启动不报错（方法名里的字段拼写错了会在这时报错）。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 5 步：写 DTO</span><span class="one">定好"进来"和"出去"的形状</span></summary>
    <div class="body">
      <ul>
        <li>新建 <code>NewFavoriteWord(kind, word, status)</code>，只放前端<b>有权决定</b>的字段。</li>
        <li>如果返回的内容要隐藏某些字段（比如 <code>userId</code>），在这里想好，别把 Entity 原样丢给前端。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 6 步：先写一个"最小能跑"的 Controller</span><span class="one">先通，再对</span></summary>
    <div class="body">
      <ul>
        <li>只写 <code>GET /favorites</code>：贴 <code>@RestController</code>、<code>@RequestMapping("/favorites")</code>、<code>@GetMapping</code>，里面先调 Repository 返回列表，<b>先不加校验和权限</b>。</li>
        <li>启动，用 curl 或浏览器访问，看到 <code>[]</code> 或一个 JSON，说明<b>整条链已经通了</b>：请求 → Controller → Repository → 数据库 → JSON。</li>
        <li>通了再逐个加 POST、DELETE。先通再对，出错时范围小。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 7 步：加上规则：校验、权限、去重</span><span class="one">后端最重要的一步</span></summary>
    <div class="body">
      <p>对每个接口过一遍清单：</p>
      <ol>
        <li><b>身份</b>：这个接口需要登录吗？需要就让它被门卫保护（见"配置"一章），userId 从 token 取。</li>
        <li><b>归属</b>：操作的是不是"我自己的"数据？查询要带上 <code>userId</code>。</li>
        <li><b>校验</b>：前端传来的每个字段都不可信。<code>kind</code> 只能 w/p、<code>word</code> 不能空。</li>
        <li><b>重复</b>：同样的数据能不能被存两次？</li>
        <li><b>找不到</b>：查不到时回什么？</li>
        <li><b>失败</b>：数据库写入失败了怎么办？</li>
      </ol>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 8 步：配置</span><span class="one">让它真正被保护、被前端访问</span></summary>
    <div class="body">
      <ul>
        <li>把新路径加进 <code>WebAuthConfig</code> 的保护范围（<code>/favorites</code>、<code>/favorites/**</code>）。<b>漏了这一步，接口就是裸奔的</b>。</li>
        <li>前端来自新域名时，加进 <code>CorsConfig</code> 的白名单。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 9 步：自己先测，再让前端接</span><span class="one">用 curl 测"好的"和"坏的"两种情况</span></summary>
    <div class="body">
      <ul>
        <li><b>好的</b>：带正确 token，新增、查看、删除都应该成功。</li>
        <li><b>坏的</b>：不带 token（要 401）；kind 传 <code>x</code>（要 400）；删别人的 id（要查不到）；同一条存两次（只有一条）。</li>
        <li>看控制台里的 SQL，核对每个请求生成的查询是不是你想的那样。</li>
        <li>都过了，再让前端对接。前端出问题时，你已经知道后端是可靠的，排查范围小一半。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 10 步：整理、提交</span><span class="one">收尾</span></summary>
    <div class="body">
      <ul>
        <li>删掉调试用的打印、没用的代码、临时测试数据。</li>
        <li>检查有没有把密钥、数据库文件写进要提交的东西里。</li>
        <li>一次提交只做一件事，提交说明写清楚做了什么。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== @ 什么时候写 ===== -->
<section id="at">
  <h2>@ 标签：一开始就写，还是逻辑写完再加？</h2>
  <div class="paper g note">答案：<b>创建文件的时候就写，不是事后补</b>。因为注解定义了"这个东西是什么"，不是装饰品。没有它，Spring 根本不知道这个类、这个方法存在。</div>

  <div class="paper"><div class="scroll"><table>
    <tr><th>什么时候写</th><th>哪些注解</th><th>原因</th></tr>
    <tr><td><b>新建文件、写类名的同时</b></td><td><code>@Entity</code>、<code>@RestController</code>、<code>@Component</code>、<code>@Service</code>、<code>@Configuration</code></td><td>它们决定这个类的<b>身份</b>。先想"这个类是什么"，再写里面的东西</td></tr>
    <tr><td><b>写字段时</b></td><td><code>@Id</code>、<code>@GeneratedValue</code>、<code>@Column</code></td><td>设计数据时就已经想好"主键是谁、能不能为空"，顺手写上</td></tr>
    <tr><td><b>写方法签名时</b></td><td><code>@GetMapping</code>、<code>@PostMapping</code>、<code>@DeleteMapping</code></td><td>这是第 1 步接口契约的直接翻译：方法 + 路径</td></tr>
    <tr><td><b>写参数时</b></td><td><code>@RequestBody</code>、<code>@PathVariable</code>、<code>@RequestAttribute</code>、<code>@Value</code></td><td>参数怎么来的，和这个参数的类型是同一个决定</td></tr>
    <tr><td><b>重写接口方法时</b></td><td><code>@Override</code></td><td>写上，写错名字编译器会立刻提醒</td></tr>
  </table></div></div>

  <details open>
    <summary><span class="fn">新建一个类的"固定动作"</span><span class="one">每次都按这个顺序，不容易漏</span></summary>
    <div class="body">
      <ol>
        <li><b>想</b>：这个类是什么角色？（接请求 / 表 / 查询 / 工具 / 配置）</li>
        <li><b>放对位置</b>：文件在 <code>com.goenkon.ielts</code> 包里，文件名 = 类名。</li>
        <li><b>先贴身份注解</b>：比如这是接口类，先写 <code>@RestController</code>。</li>
        <li><b>写需要的依赖</b>：想想它要用别的什么对象？写成 <code>private final</code> 字段 + 构造方法参数。</li>
        <li><b>写方法</b>：每个方法先写签名和路径注解，再写里面的逻辑。</li>
        <li><b>启动一次</b>：看有没有 Bean 找不到、路径冲突之类的启动错误。</li>
      </ol>
    </div>
  </details>

  <details>
    <summary><span class="fn">忘了写会怎样</span><span class="one">对症下药</span></summary>
    <div class="body">
      <div class="scroll"><table>
        <tr><th>忘了</th><th>症状</th></tr>
        <tr><td><code>@RestController</code></td><td>访问路径返回 404，Spring 不知道有这个接口类</td></tr>
        <tr><td><code>@Component</code> / <code>@Service</code></td><td>别的类要用它时，启动报"找不到这个类型的 Bean"</td></tr>
        <tr><td><code>@Entity</code></td><td>表没建出来，Repository 启动报"不是被管理的实体"</td></tr>
        <tr><td><code>@RequestBody</code></td><td>请求体没被读进来，参数的字段全是 <code>null</code></td></tr>
        <tr><td>在 <code>WebAuthConfig</code> 里登记路径</td><td>接口不报错，但<b>没有任何保护</b>，最危险，因为没有错误提示</td></tr>
        <tr><td>方法上的路径注解</td><td>访问该路径 404 或 405</td></tr>
      </table></div>
      <p class="takeaway">没有报错的"漏"最危险，所以权限类的配置一定要靠测试去验证</p>
    </div>
  </details>
</section>

<!-- ===== 配置什么时候写 ===== -->
<section id="conf">
  <h2>配置什么时候写</h2>
  <div class="paper b note">原则：<b>配置跟着功能走，用到才加</b>。不要一开始就配一大堆"以后可能用得上"的东西，那样你自己都不知道每一行是干什么的。</div>

  <h3>三类配置，三个时机</h3>
  <div class="paper"><div class="scroll"><table>
    <tr><th>什么时候</th><th>配什么</th><th>你项目里的例子</th></tr>
    <tr><td><b>创建项目时</b></td><td>基础：项目名、依赖清单。用 Spring Initializr（或 IntelliJ 的新建 Spring 项目）选好依赖，会自动生成 <code>pom.xml</code> 和空的 <code>application.properties</code></td><td><code>spring.application.name</code>、<code>pom.xml</code> 里的 starter</td></tr>
    <tr><td><b>第一次用到某个能力时</b></td><td>那个能力需要的配置，<b>当场加</b></td><td>用数据库 → <code>datasource</code>、<code>ddl-auto</code>；用 Google 登录 → <code>google.client-id</code>；签 token → <code>app.jwt-secret</code>；前端来访问 → <code>CorsConfig</code>；要保护接口 → <code>WebAuthConfig</code></td></tr>
    <tr><td><b>准备上线时</b></td><td>生产环境的差异：关调试项、换真密钥、换数据库</td><td>关 <code>h2-console</code>、<code>APP_JWT_SECRET</code> 环境变量、PostgreSQL、改 CORS 白名单</td></tr>
  </table></div></div>

  <details open>
    <summary><span class="fn">配置放哪：三个地方</span><span class="one">按"会不会变、能不能公开"选</span></summary>
    <div class="body">
      <div class="scroll"><table>
        <tr><th>放哪</th><th>适合</th><th>例子</th></tr>
        <tr><td><b>写死在代码里</b></td><td>永远不会变、不同环境一样的东西</td><td><code>EXPIRE_DAYS = 7</code>（要改就改代码）</td></tr>
        <tr><td><b><code>application.properties</code></b></td><td>可能变、但可以公开的设置，且各环境基本一致</td><td>数据库类型、<code>google.client-id</code>（公开信息）</td></tr>
        <tr><td><b>环境变量</b></td><td><b>密钥、密码</b>，以及每个环境不同的值（开发和上线不一样）</td><td><code>APP_JWT_SECRET</code>、上线后的数据库账号密码</td></tr>
      </table></div>
      <p>判断口诀：<b>泄露了会出事 → 环境变量；各环境不同 → 环境变量或配置文件；永远不变 → 代码常量</b>。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">配置错了的症状</span><span class="one">看到这些，先查配置</span></summary>
    <div class="body">
      <ul>
        <li>启动时报 <code>Could not resolve placeholder 'xxx'</code>：<code>@Value</code> 里写的 key，配置文件里没有。</li>
        <li>浏览器报跨域错误：<code>CorsConfig</code> 白名单里没有当前页面的来源（协议、域名、端口要完全一致）。</li>
        <li>改了配置没效果：配置只在<b>启动时读一次</b>，必须重启后端。</li>
        <li>连不上数据库：<code>datasource.url</code>、账号密码拼错，或数据库服务没开。</li>
      </ul>
    </div>
  </details>
</section>

<!-- ===== 实战：加备注 ===== -->
<section id="demo">
  <h2>实战演练：给收藏加一个"备注"字段</h2>
  <div class="paper y note">需求：用户可以给每条收藏写一句备注。看看按上面的思路，要改哪些地方、什么顺序。这是进公司后<b>最常见的活儿</b>：在现有代码上加东西，而不是从零写。</div>
  <div class="paper"><div class="scroll"><table>
    <tr><th>顺序</th><th>改哪里</th><th>改什么</th><th>为什么</th></tr>
    <tr><td>0</td><td>想</td><td>备注可以为空吗？有长度限制吗？可以改吗？</td><td>先想规则</td></tr>
    <tr><td>1</td><td>契约</td><td><code>POST</code> 请求体加 <code>note</code>（可选）；<code>PUT</code> 允许修改 <code>note</code>；响应里带 <code>note</code></td><td>前后端先对好</td></tr>
    <tr><td>2</td><td><code>FavoriteWord</code>（Entity）</td><td>加字段 <code>note</code>；构造器和 getter/setter 补上</td><td>表多一列，<code>ddl-auto=update</code> 启动时自动加</td></tr>
    <tr><td>3</td><td><code>NewFavoriteWord</code>（DTO）</td><td>record 里加 <code>String note</code></td><td>允许前端传这个字段</td></tr>
    <tr><td>4</td><td><code>FavoriteWordController</code></td><td>POST 里把 <code>note</code> 存进去（可限制长度，去首尾空格）；PUT 里允许更新</td><td>规则落在这里</td></tr>
    <tr><td>5</td><td>配置</td><td>不用改：路径没变</td><td>"配置不用动"也是一个结论</td></tr>
    <tr><td>6</td><td>自己测</td><td>带备注新增、不带备注新增、修改备注、备注过长（应拒绝）</td><td>好的和坏的各测一遍</td></tr>
    <tr><td>7</td><td>前端</td><td>输入框、发送、展示</td><td>后端稳了再接</td></tr>
    <tr><td>8</td><td>老数据</td><td>已有的行 <code>note</code> 是 <code>null</code>，前端要能处理空值</td><td><b>改表一定要想到已有数据</b></td></tr>
    <tr><td>9</td><td>上线</td><td>换成 PostgreSQL 且表已存在时，要用迁移脚本加这一列，不能靠自动更新</td><td>生产库不能随便让框架改</td></tr>
  </table></div></div>
  <p class="note">这张表就是"一个完整的小需求"的节奏：<b>想规则 → 定契约 → 改数据层 → 改接口层 → 配置 → 测试 → 前端 → 老数据 → 上线</b>。每个新功能都是这个形状。</p>
</section>

<!-- ===== 刚进公司 ===== -->
<section id="job">
  <h2>刚进公司，第一周做什么</h2>
  <div class="paper p note">先说一个现实：公司里的后端，<b>绝大多数时候不是从零写，而是读别人写的代码、改它</b>。所以"怎么读一个陌生项目"比"怎么从零写"更重要。下面是一般的流程，具体公司会有差异。</div>

  <details open>
    <summary><span class="fn">第 1 天：把项目跑起来</span><span class="one">跑得起来，才算入门</span></summary>
    <div class="body">
      <ol>
        <li>拉代码、读 README：怎么装环境、怎么启动、有哪些环境（开发、测试、正式）。</li>
        <li>装好 JDK、IDE，点 Run 启动。<b>启动失败是最常见的第一道坎</b>：缺环境变量、数据库连不上。别慌，问同事，同时把"我是怎么解决的"记下来。</li>
        <li>找到配置文件，弄清：连的是哪个数据库？端口多少？有哪些外部服务？</li>
        <li>访问一个现有接口，看到返回。</li>
      </ol>
    </div>
  </details>

  <details open>
    <summary><span class="fn">第 2–3 天：顺藤摸瓜读一个接口</span><span class="one">读懂陌生项目的核心技巧</span></summary>
    <div class="body">
      <p>选一个简单的接口，按这条线追下去，每一步都在 IDE 里按住 Ctrl/Cmd 点击跳转：</p>
      <ol>
        <li>从<b>路径</b>开始，全局搜索 <code>"/favorites"</code>，找到 <code>@RequestMapping</code> 或 <code>@GetMapping</code> → 找到 <b>Controller</b> 方法。</li>
        <li>看方法的<b>参数</b>（请求怎么进来）和<b>返回值</b>（回什么）。</li>
        <li>看方法里调用了哪个 <b>Service / Repository</b>，点进去。</li>
        <li>Repository 返回的是哪个 <b>Entity</b>，点进去，看对应哪张表。</li>
        <li>在数据库里（H2 或开发库）找到这张表，看看真实数据。</li>
        <li>回头看有没有<b>拦截器、权限检查</b>在这条线上。</li>
      </ol>
      <p class="takeaway">练习：现在就对 DELETE /favorites/3 做一遍，从路径追到表</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">第 1 周：理解项目的"地图"</span><span class="one">有了地图，才不会迷路</span></summary>
    <div class="body">
      <ul>
        <li>画一张简单的图：有哪几个功能模块？每个模块有哪些 Controller、Entity？</li>
        <li>弄清项目有哪几层、命名习惯（比如 Service 实现类叫 <code>XxxServiceImpl</code> 还是别的）。</li>
        <li>知道<b>日志在哪看</b>。出了问题，日志是第一线索。</li>
        <li>知道<b>代码怎么提交、怎么审查</b>：分支规范、Pull Request、有没有测试要跑。</li>
        <li>记下不懂的名词，攒着一次性问，比一个个问更受欢迎。</li>
      </ul>
    </div>
  </details>

  <details>
    <summary><span class="fn">第一个任务通常是什么</span><span class="one">小、安全、能看到成果</span></summary>
    <div class="body">
      <ul>
        <li>改一个小 bug：返回的字段拼错、一个校验漏了。</li>
        <li>加一个字段（正是上面"加备注"那种）。</li>
        <li>新增一个很简单的查询接口。</li>
        <li>补一个测试。</li>
      </ul>
      <p>做法：<b>先复现问题 → 定位到哪一层 → 最小的改动 → 本地验证 → 提交审查</b>。不要一上来就大改别人的代码结构。</p>
    </div>
  </details>

  <details>
    <summary><span class="fn">遇到不会的怎么问</span><span class="one">好的提问让对方愿意回答</span></summary>
    <div class="body">
      <ol>
        <li>说<b>你想做什么</b>。</li>
        <li>说<b>你已经试过什么</b>、看到了什么现象或哪段日志。</li>
        <li>说<b>你的猜测</b>："我怀疑是这里……，对吗？"</li>
      </ol>
      <p>在日本职场，及时<b>报联相</b>（报告、联络、相谈）：做之前简单说一声，卡住了半小时内就说，比一个人闷头硬撑一整天好得多。</p>
    </div>
  </details>
</section>

<!-- ===== 常见坑 ===== -->
<section id="pit">
  <h2>新手最常踩的坑</h2>
  <div class="paper"><div class="scroll"><table>
    <tr><th>坑</th><th>怎么避免</th></tr>
    <tr><td>一口气写完五个文件再启动</td><td>每层写完就启动验证一次，出错范围小</td></tr>
    <tr><td>先写 Controller，数据层没想清楚</td><td>先想数据（表）和契约，再写代码</td></tr>
    <tr><td>所有逻辑塞进 Controller</td><td>规则复杂时抽到 Service，Controller 只管 HTTP</td></tr>
    <tr><td>相信前端传来的一切</td><td>每个字段都校验，身份只信 token</td></tr>
    <tr><td>忘了给新接口加保护</td><td>新接口的清单里固定有一项："要不要登录？登记了吗？"</td></tr>
    <tr><td>只测"好的"情况</td><td>每个接口至少测一个"坏的"：没 token、参数错、别人的数据</td></tr>
    <tr><td>改了代码不重启 / 前端不刷新</td><td>先 Stop 再 Run；前端 F5</td></tr>
    <tr><td>类放到包外面</td><td>所有类放在启动类所在的包或其子包里</td></tr>
    <tr><td>密钥写进代码推到 GitHub</td><td>密钥一开始就走环境变量</td></tr>
    <tr><td>改表忘了老数据</td><td>加列时想：已有行的这一列是什么值？</td></tr>
  </table></div></div>
</section>

<!-- ===== 一页纸总结 ===== -->
<section id="one">
  <h2>一页纸总结</h2>
  <div class="k">
    <div class="paper y"><b>思路</b><br>后端从"数据和规则"想起，不是从页面想起。写每段代码先问：谁能调、改什么、出错怎么办。</div>
    <div class="paper b"><b>一个文件</b><br>= 一个类 = 一个职责。一个功能由 Controller、Repository、Entity、DTO、Config 几个文件配合完成。</div>
    <div class="paper g"><b>顺序</b><br>想三句话 → 定接口契约 → 设计表 → Entity → Repository → DTO → 最小 Controller → 加规则 → 配置 → 测好坏两种 → 前端。</div>
    <div class="paper p"><b>@ 标签</b><br>新建类、字段、方法、参数时<b>当场写</b>，它们定义"这是什么"，不是事后装饰。</div>
    <div class="paper y"><b>配置</b><br>跟着功能走，用到才加；密钥和各环境不同的值用环境变量；上线前再统一过一遍。</div>
    <div class="paper b"><b>进公司</b><br>多数时候是读和改。从路径找到 Controller，一路点到表。先跑起来，再读一个接口，再做小任务。</div>
  </div>
</section>

<footer>后端写代码的思路 · 笔记涂鸦风</footer>
</div>
</div>

<h1>Java 后端：从第一个接口到 Google 登录</h1>
<p class="lead">这是我们用 Java 做出雅思收藏本后端的全过程：先遇到什么问题、学了什么、每个文件干嘛、一次登录和收藏怎么走完。每张卡只讲一件事。</p>
<h2>一 · 先看全貌：我们造了什么</h2>

<h2>二 · 一路是怎么走过来的（每一步解决一个问题）</h2>
<p class="sec">按我们做的先后顺序排列。每一步都是：先遇到一个问题，再学一个新东西去解决它。</p>
<div class="grid">
<section class="card"><h3><span class="n">1</span>第一个接口 /hello</h3><svg viewBox="0 0 320 136" role="img" aria-label="浏览器 → HelloController → JSON"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">GET /hello</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:9.1px">HelloController</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">一个类</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">JSON</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">{message}</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">最小的后端：一个类 + 一个方法</text></svg><p class="why"><b>遇到的问题：</b>后端是什么样？怎么证明前端和后端连得上？</p><ul><li><code>@RestController</code> 告诉 Spring：这个类接请求。<code>@GetMapping("/hello")</code> 告诉它：哪个网址、哪个方法。</li><li>方法返回一个 record（<code>Greeting</code>），Spring 自动把它变成 JSON。</li></ul><p class="one">先让最小的东西跑通，再往上加。</p></section>
<section class="card"><h3><span class="n">2</span>错题本：增删改查（放内存）</h3><svg viewBox="0 0 320 136" role="img" aria-label="POST 新增 → ArrayList → 重启"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fr" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">POST 新增</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">存进列表</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">ArrayList</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">在内存里</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">重启</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">没了</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">WrongItemController：4 个方法对应 4 种请求</text></svg><p class="why"><b>遇到的问题：</b>怎么处理“增删改查”？数据存哪？</p><ul><li>GET 查、POST 增、PUT 改、DELETE 删，这四个就是 CRUD，几乎所有后端都是这套。</li><li>数据存在一个 <code>ArrayList</code> 里，也就是内存里。程序一关，全部消失。</li></ul><p class="one">内存会忘。要让数据留下来，需要数据库。</p></section>
<section class="card"><h3><span class="n">3</span>接数据库：Entity + Repository</h3><svg viewBox="0 0 320 136" role="img" aria-label="Entity 类 → Repository → H2 文件"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">Entity 类</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">FavoriteWord</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">Repository</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">只写方法名</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">H2 文件</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">表 + 数据</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">类 ↔ 表，Spring 替你翻译成 SQL</text></svg><p class="why"><b>遇到的问题：</b>怎么让数据在重启后还在？</p><ul><li><code>@Entity</code> 的类 = 一张表，字段 = 列。启动时 <code>ddl-auto=update</code> 自动建表。</li><li>Repository 只声明方法名（如 <code>findByUserId</code>），Spring 启动时生成真正的 SQL。</li></ul><p class="one">数据写进文件，重启也不丢。</p></section>
<section class="card"><h3><span class="n">4</span>收藏本接口 /favorites</h3><svg viewBox="0 0 320 136" role="img" aria-label="前端 → Controller → Repository → 数据库"><g class="wob"><rect class="s fb" x="10.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M72.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="90.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M152.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="170.0" y="20" width="60.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fp" x="250.0" y="20" width="60.0" height="70" rx="9"/></g><g><text x="40.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">前端</text><text x="40.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">点收藏</text></g><g><text x="120.0" y="46" text-anchor="middle" class="zh" style="font-size:8.9px">Controller</text><text x="120.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">接请求</text></g><g><text x="200.0" y="46" text-anchor="middle" class="zh" style="font-size:8.9px">Repository</text><text x="200.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">查/存/删</text></g><g><text x="280.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">查 GET · 增 POST · 删 DELETE · 改 PUT</text></svg><p class="why"><b>要做的事：</b>把网站上的“收藏”存到后端。</p><ul><li><code>kind</code> 只有两种：<code>w</code> 单词、<code>p</code> 短语。同一段文字，同一个人只能收藏一次。</li><li>前端传来的东西都要检查：kind 对不对、word 是不是空的。</li></ul><p class="one">这是第一个“真”功能：有数据、有规则。</p></section>
<section class="card"><h3><span class="n">5</span>每个人一份：多存一列 user_id</h3><svg viewBox="0 0 320 160" role="img" aria-label="收藏表多一列 user_id"><g class="wob"><rect class="s fw" x="14" y="22" width="292" height="104" rx="6"/><rect class="s fb" x="14" y="22" width="292" height="26" rx="6"/><path class="s" d="M14 74h292M14 100h292M92 22v104M200 22v104"/><rect class="s fr" x="14" y="74" width="292" height="26" opacity=".5"/></g><text x="53" y="40" text-anchor="middle" class="zh" style="font-size:12.0px">id</text><text x="146" y="40" text-anchor="middle" class="zh" style="font-size:12.0px">word</text><text x="253" y="40" text-anchor="middle" class="zh" style="font-size:12.0px">user_id</text><text x="53" y="66" text-anchor="middle" class="zh" style="font-size:11.0px">1</text><text x="146" y="66" text-anchor="middle" class="zh" style="font-size:11.0px">abandon</text><text x="253" y="66" text-anchor="middle" class="zh" style="font-size:11.0px">1</text><text x="53" y="92" text-anchor="middle" class="zh" style="font-size:11.0px">2</text><text x="146" y="92" text-anchor="middle" class="zh" style="font-size:11.0px">reduce</text><text x="253" y="92" text-anchor="middle" class="zh" style="font-size:11.0px">1</text><text x="53" y="118" text-anchor="middle" class="zh" style="font-size:11.0px">3</text><text x="146" y="118" text-anchor="middle" class="zh" style="font-size:11.0px">hence</text><text x="253" y="118" text-anchor="middle" class="zh" style="font-size:11.0px">2</text><text x="10" y="150" class="cap">每一行多存一列 user_id：这条收藏是谁的</text></svg><p class="why"><b>遇到的问题：</b>别人登录后，不能看到我的收藏。</p><ul><li>所有人的收藏都放在<b>同一张表</b>里，靠 <code>user_id</code> 区分。</li><li>查询永远写成 <code>WHERE user_id = ?</code>，只拿到自己的那几行。</li></ul><p class="one">per-user 的全部秘密，就是多存这一列。</p></section>
<section class="card"><h3><span class="n">6</span>Google 登录：证明你是谁</h3><svg viewBox="0 0 320 136" role="img" aria-label="Google → 核对 → 找或建用户"><g class="wob"><rect class="s fb" x="10.0" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M98.7 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="116.7" y="20" width="86.7" height="70" rx="9"/><path class="s" d="M205.3 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="223.3" y="20" width="86.7" height="70" rx="9"/></g><g><text x="53.3" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">Google</text><text x="53.3" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">给证明书</text></g><g><text x="160.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">核对</text><text x="160.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">验证书</text></g><g><text x="266.7" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">找或建用户</text><text x="266.7" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">AppUser</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L302,108"/></circle><text x="10" y="128" class="cap">我们从头到尾碰不到你的 Google 密码</text></svg><p class="why"><b>遇到的问题：</b>后端怎么知道请求是谁发的？</p><ul><li>前端拿到 Google 给的证明书（idToken）发给后端。后端核对：签名对不对、是不是发给我们网站的、有没有过期。</li><li>用 Google 给的永久编号 <code>sub</code> 在用户表里找人，找不到就新建。所以“注册”和“登录”是同一步。</li></ul><p class="one">不存密码，只认 Google 说“这个人是谁”。</p></section>
<section class="card"><h3><span class="n">7</span>JWT：我们自己发的通行证</h3><svg viewBox="0 0 320 146" role="img" aria-label="JWT 三段结构"><g class="wob"><rect class="s fy" x="10" y="26" width="86" height="46" rx="8"/><rect class="s fb" x="112" y="26" width="108" height="46" rx="8"/><rect class="s fr" x="236" y="26" width="74" height="46" rx="8"/></g><text x="53" y="46" text-anchor="middle" class="zh" style="font-size:13.0px">头部</text><text x="53" y="62" text-anchor="middle" class="zh" style="font-size:10.0px">用什么算法</text><text x="166" y="46" text-anchor="middle" class="zh" style="font-size:13.0px">内容</text><text x="166" y="62" text-anchor="middle" class="zh" style="font-size:10.0px">用户编号 + 过期时间</text><text x="273" y="46" text-anchor="middle" class="zh" style="font-size:13.0px">签名</text><text x="273" y="62" text-anchor="middle" class="zh" style="font-size:10.0px">用密钥盖章</text><text x="101" y="52" class="zh" text-anchor="middle" style="font-size:18px">.</text><text x="228" y="52" class="zh" text-anchor="middle" style="font-size:18px">.</text><g class="a-blink"><text x="160" y="104" text-anchor="middle" class="zh bad" style="font-size:12px">有人改了内容 → 签名对不上 → 拒绝</text></g><text x="10" y="132" class="cap">内容只是编码，不是加密；签名只证明“没被改、是我们发的”</text></svg><p class="why"><b>遇到的问题：</b>总不能每个请求都去问 Google 吧？</p><ul><li>登录成功后，后端发一张 JWT：头部.内容.签名，7 天有效。前端存起来，之后每个请求都带上。</li><li>后端不用记谁登录了，只看签名对不对。印章（密钥）只有后端知道。</li></ul><p class="one">密钥一旦泄露，别人就能自己造任何人的通行证。</p></section>
<section class="card"><h3><span class="n">8</span>门卫：AuthInterceptor</h3><svg viewBox="0 0 320 160" role="img" aria-label="门卫拦截未登录请求"><g class="wob"><rect class="s fb" x="6" y="44" width="62" height="50" rx="7"/><rect class="s fy" x="100" y="34" width="86" height="70" rx="8"/><rect class="s fg" x="224" y="44" width="90" height="50" rx="7"/><path class="s" d="M68 69h28M186 69h34" stroke-dasharray="3 5" marker-end="url(#ah)"/></g><text x="37" y="66" text-anchor="middle" class="zh" style="font-size:12.0px">请求</text><text x="37" y="82" text-anchor="middle" class="zh" style="font-size:10.0px">带 Bearer</text><text x="143" y="62" text-anchor="middle" class="zh" style="font-size:13.0px">门卫</text><text x="143" y="78" text-anchor="middle" class="zh" style="font-size:9.5px">AuthInterceptor</text><text x="143" y="93" text-anchor="middle" class="zh" style="font-size:10.0px">验 token</text><text x="269" y="66" text-anchor="middle" class="zh" style="font-size:12.0px">Controller</text><text x="269" y="82" text-anchor="middle" class="zh" style="font-size:10.0px">/favorites</text><g class="a-no"><text x="143" y="128" text-anchor="middle" class="zh bad" style="font-size:12px">没有 / 假 token → 401，进不去</text></g><g class="a-yes"><text x="143" y="128" text-anchor="middle" class="zh good" style="font-size:12px">验过 → 把 userId 交给 Controller</text></g><text x="8" y="152" class="cap">验证写在一个地方，所有被保护的接口自动安全</text></svg><p class="why"><b>遇到的问题：</b>每个接口都要检查登录，不能漏。</p><ul><li>收藏的每个接口都要知道“是谁”。与其每个都写一遍，不如在它们前面站一个门卫。</li><li>门卫验好 token，把用户编号放进这次请求里。Controller 直接取，<b>绝不信前端自己传的 userId</b>。</li></ul><p class="one">身份只来自 token。前端传的 userId，一律当成假的。</p></section>
<section class="card"><h3><span class="n">9</span>CORS：浏览器在把门</h3><svg viewBox="0 0 320 156" role="img" aria-label="CORS"><g class="wob"><rect class="s fb" x="6" y="46" width="76" height="62" rx="8"/><rect class="s fy" x="238" y="46" width="76" height="62" rx="8"/><rect class="s fp" x="120" y="34" width="80" height="86" rx="8"/><path class="s" d="M84 77h34M202 77h34" stroke-dasharray="3 5" marker-end="url(#ah)"/></g><text x="44" y="74" text-anchor="middle" class="zh" style="font-size:13.0px">:5500</text><text x="44" y="92" text-anchor="middle" class="zh" style="font-size:10.0px">前端页面</text><text x="276" y="74" text-anchor="middle" class="zh" style="font-size:13.0px">:8080</text><text x="276" y="92" text-anchor="middle" class="zh" style="font-size:10.0px">后端</text><text x="160" y="70" text-anchor="middle" class="zh" style="font-size:12.0px">浏览器</text><text x="160" y="88" text-anchor="middle" class="zh" style="font-size:11.0px">守门</text><g class="a-no"><text x="160" y="140" text-anchor="middle" class="zh bad" style="font-size:11.5px">后端没说“允许”：浏览器拦下结果</text></g><g class="a-yes"><text x="160" y="140" text-anchor="middle" class="zh good" style="font-size:11.5px">后端说了“允许这个网站”：放行</text></g></svg><p class="why"><b>遇到的问题：</b>前端明明发出了请求，却报“跨域”错误。</p><ul><li>前端 :5500 和后端 :8080 端口不同，算“不同的源”。浏览器默认不让页面读后端的回复。</li><li>后端要在回复里声明“允许哪些网站”。我们在 <code>CorsConfig</code> 里列了白名单。</li></ul><p class="one">拦住的是浏览器，不是后端。它是为了保护用户，不是为了防攻击者。</p></section>
<section class="card"><h3><span class="n">10</span>配置和密钥</h3><svg viewBox="0 0 320 156" role="img" aria-label="配置文件与环境变量"><g class="wob"><rect class="s fw" x="8" y="24" width="140" height="92" rx="7"/><rect class="s fy" x="188" y="24" width="124" height="92" rx="9"/><path class="s" d="M150 70h34" marker-end="url(#ah)" stroke-dasharray="3 5"/></g><text x="78" y="44" text-anchor="middle" class="zh" style="font-size:10.0px">application.properties</text><text x="78" y="66" text-anchor="middle" class="zh" style="font-size:10.0px">google.client-id=…</text><text x="78" y="84" text-anchor="middle" class="zh" style="font-size:10.0px">secret=${环境变量名</text><text x="78" y="100" text-anchor="middle" class="zh" style="font-size:10.0px">:默认值}</text><text x="250" y="44" text-anchor="middle" class="zh" style="font-size:12.0px">运行中的进程</text><text x="250" y="76" text-anchor="middle" class="zh" style="font-size:11.0px">环境变量</text><text x="250" y="94" text-anchor="middle" class="zh" style="font-size:9.5px">APP_JWT_SECRET</text><text x="8" y="142" class="cap">配置文件可以上传 GitHub；真正的密钥只放环境变量</text></svg><p class="why"><b>遇到的问题：</b>密码、密钥不能被别人看到。</p><ul><li><code>application.properties</code> 是配置文件，数据库地址、Client ID 写在里面。</li><li>密钥不写死。配置文件里写“去读环境变量 APP_JWT_SECRET”，真值放在运行的机器上。</li></ul><p class="one">代码可以上 GitHub，密钥不行。</p></section>

<h2>三 · 每个文件是干嘛的</h2>
<div class="legend"><span class="b">入口 · 配置</span><span class="y">接请求</span><span class="g">数据（表）</span><span class="p">登录 · 安全</span><span class="k">练手，可删</span></div>
<div class="files"><div class="file b"><b>IeltsBackendApplication.java</b><span>入口。<code>main</code> 里一行 <code>SpringApplication.run</code>，整个程序从这里点着。</span><i>Node 对应：src/index.ts</i></div><div class="file b"><b>application.properties</b><span>配置：数据库地址、Client ID、密钥从哪读。</span><i>Node 对应：环境变量 + config.ts</i></div><div class="file b"><b>pom.xml</b><span>依赖清单：用了 Spring、JPA、H2、Google、JWT 这些库。</span><i>Node 对应：package.json</i></div><div class="file b"><b>CorsConfig.java</b><span>跨域白名单：允许哪些网站访问后端。</span><i>Node 对应：cors 中间件</i></div><div class="file b"><b>WebAuthConfig.java</b><span>登记哪些路径要过门卫（/favorites）。</span><i>Node 对应：router.use(requireAuth)</i></div><div class="file y"><b>FavoriteWordController.java</b><span>收藏的 4 个接口：查、增、删、改，还有输入检查。</span><i>Node 对应：routes/favorites.ts</i></div><div class="file y"><b>NewFavoriteWord.java</b><span>前端发来的收藏数据长什么样（kind、word、status）。</span><i>Node 对应：POST 里手动检查 req.body</i></div><div class="file g"><b>FavoriteWord.java</b><span>收藏表：id、userId、kind、word、status。</span><i>Node 对应：schema.ts 里的 favoriteWord</i></div><div class="file g"><b>FavoriteWordRepository.java</b><span>查收藏：按用户查、按 id+用户查、查重。</span><i>Node 对应：Drizzle 查询</i></div><div class="file g"><b>AppUser.java</b><span>用户表：id、googleSub、邮箱、名字、头像。</span><i>Node 对应：schema.ts 里的 appUser</i></div><div class="file g"><b>AppUserRepository.java</b><span>按 googleSub 找用户。</span><i>Node 对应：Drizzle 查询</i></div><div class="file p"><b>AuthController.java</b><span>登录 /auth/google 和“我是谁” /me。</span><i>Node 对应：routes/auth.ts</i></div><div class="file p"><b>GoogleTokenVerifier.java</b><span>向 Google 核对证明书：签名、受众、过期、邮箱已验证。</span><i>Node 对应：auth/google.ts</i></div><div class="file p"><b>JwtService.java</b><span>发 token、验 token，7 天有效。</span><i>Node 对应：auth/jwt.ts</i></div><div class="file p"><b>AuthInterceptor.java</b><span>门卫：验 token，把 userId 放进请求。</span><i>Node 对应：auth/middleware.ts</i></div><div class="file k"><b>HelloController · Greeting</b><span>第一个接口 /hello。上线时不需要，可以删。</span></div><div class="file k"><b>WrongItem* (3 个文件)</b><span>内存版错题本，学增删改查用的。上线前应删掉。</span></div></div>
<h2>四 · 一次登录 + 一次收藏，从头走到尾</h2>
<div class="grid">

.85">前端存起来</text></g><text x="10" y="128" class="cap">箭头依次亮起：这条链走完，前端手里就有了我们自己的 token</text></svg><ul><li>前端把 token 存进 <code>localStorage</code>，下次打开页面先拿它问 <code>/me</code>，有效就直接是登录状态。</li><li>Google 的证明书到此用完，之后全程只用我们自己的 token。</li></ul><p class="one">登录只是为了换到一张 token。</p></section>
<section class="card full"><h3><span class="n">B</span>收藏一个单词（每次点击）</h3><svg viewBox="0 0 640 136" role="img" aria-label="点收藏 → POST /favorites → 门卫验证 → Controller → 存数据库"><g class="wob"><rect class="s fb" x="10.0" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M115.2 55 h20" marker-end="url(#ah)"/><rect class="s fy" x="139.2" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M244.4 55 h20" marker-end="url(#ah)"/><rect class="s fg" x="268.4" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M373.6 55 h20" marker-end="url(#ah)"/><rect class="s fp" x="397.6" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M502.8 55 h20" marker-end="url(#ah)"/><rect class="s fr" x="526.8" y="20" width="103.2" height="70" rx="9"/></g><g class="a-st" style="animation-delay:0.0s"><text x="61.6" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">点收藏</text><text x="61.6" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">前端</text></g><g class="a-st" style="animation-delay:1.2s"><text x="190.8" y="46" text-anchor="middle" class="zh" style="font-size:11.1px">POST /favorites</text><text x="190.8" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">带 Bearer token</text></g><g class="a-st" style="animation-delay:2.4s"><text x="320.0" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">门卫验证</text><text x="320.0" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">取出 userId</text></g><g class="a-st" style="animation-delay:3.6s"><text x="449.2" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">Controller</text><text x="449.2" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">检查 + 去重</text></g><g class="a-st" style="animation-delay:4.8s"><text x="578.4" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">存数据库</text><text x="578.4" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">返回带 id 的记录</text></g><text x="10" y="128" class="cap">userId 来自门卫，不来自前端</text></svg><ul><li>Controller 先检查 kind 和 word，再看这个人是不是已经收藏过同一条，没有才存。</li><li>删除和修改时，查询条件是 <code>id = ? AND user_id = ?</code>：只有是自己的才操作得了。</li></ul><p class="one">每一步都有人把关：门卫管身份，Controller 管规则，数据库管数据。</p></section>
