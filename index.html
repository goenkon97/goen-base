<h1>全栈基础笔记</h1>
<p class="lead">从 Mac 终端、计算机原理，到网络、HTTP、浏览器、安全、后端、数据库、Git、部署。每个概念配一张“发生了什么”的图。共 74 张卡片，分 13 个标签页，上面的数字是每页的卡片数。</p>
<nav class="nav" aria-label="分类"><div class="row" role="tablist"><button type="button" role="tab" id="t-terminal" aria-selected="false" aria-controls="p-terminal">终端<small>11</small></button><button type="button" role="tab" id="t-computer" aria-selected="false" aria-controls="p-computer">计算机基础<small>6</small></button><button type="button" role="tab" id="t-network" aria-selected="false" aria-controls="p-network">网络<small>6</small></button><button type="button" role="tab" id="t-http" aria-selected="false" aria-controls="p-http">HTTP<small>8</small></button><button type="button" role="tab" id="t-url" aria-selected="false" aria-controls="p-url">地址栏与路由<small>5</small></button><button type="button" role="tab" id="t-browser" aria-selected="false" aria-controls="p-browser">浏览器<small>4</small></button><button type="button" role="tab" id="t-security" aria-selected="false" aria-controls="p-security">登录与安全<small>7</small></button><button type="button" role="tab" id="t-backend" aria-selected="false" aria-controls="p-backend">后端<small>6</small></button><button type="button" role="tab" id="t-db" aria-selected="false" aria-controls="p-db">数据库<small>7</small></button><button type="button" role="tab" id="t-git" aria-selected="false" aria-controls="p-git">Git<small>3</small></button><button type="button" role="tab" id="t-frontend" aria-selected="false" aria-controls="p-frontend">前端工程<small>4</small></button><button type="button" role="tab" id="t-deploy" aria-selected="false" aria-controls="p-deploy">部署运维<small>5</small></button><button type="button" role="tab" id="t-debug" aria-selected="false" aria-controls="p-debug">排错手册<small>2</small></button></div></nav><section class="panel" id="p-terminal" aria-label="终端与 Shell"><h2>终端与 Shell</h2><p class="sec">Mac 终端从零到常用：窗口和 shell 的区别、路径、命令、快捷键、管道、权限、进程、环境变量和 PATH。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>终端、shell、命令：三个东西三个角色</h3><svg viewBox="0 0 480 136" role="img" aria-label="终端 → shell (zsh) → 命令程序"><g class="wob"><rect class="s fb" x="10.0" y="20" width="140.0" height="70" rx="9"/><path class="s" d="M152.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="170.0" y="20" width="140.0" height="70" rx="9"/><path class="s" d="M312.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="330.0" y="20" width="140.0" height="70" rx="9"/></g><g><text x="80.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">终端</text><text x="80.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">那个窗口</text><text x="80.0" y="79" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">只管显示</text></g><g><text x="240.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">shell (zsh)</text><text x="240.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">听懂你的话</text></g><g><text x="400.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">命令程序</text><text x="400.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">ls git node</text><text x="400.0" y="79" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">真正干活</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L462,108"/></circle><text x="10" y="128" class="cap">你敲一行字 → shell 拆开 → 找到程序 → 系统开一个进程运行</text></svg><ul><li><b>终端</b>只是个窗口：把你敲的字交出去，把结果显示出来。换成 iTerm、VS Code 里的终端，shell 照样工作。</li><li><b>shell</b> 是窗口里真正听你说话的程序，Mac 默认是 <code>zsh</code>。它读一行，拆成“程序名 + 参数”，去找这个程序。</li><li><b>命令</b>就是一个可执行文件（<code>ls</code>、<code>git</code>、<code>node</code>……）。回车 = 操作系统新开一个<b>进程</b>去跑它，跑完退出，shell 再等你。</li><li>打开：<code>⌘ + 空格</code> 输入“终端”。VS Code 里 <code>⌃ + `</code> 直接开一个，已经在项目目录里了。</li></ul><p class="one">窗口显示、shell 翻译、命令干活。</p></section><section class="card"><h3><span class="n">2</span>一行命令里每一块是什么</h3><pre class="term"><span class="p">goenkon@MacBook ~ %</span> <span class="k">ls</span> <span class="b">-la</span> <span class="c">Documents</span>

<span class="p">goenkon@MacBook ~ %</span>
   │        │       │  └─ % 表示等你输入（root 用户是 #）
   │        │       └──── ~ 当前所在文件夹（家目录）
   │        └──────────── 这台电脑的名字
   └───────────────────── 当前用户

<span class="k">ls</span>         = 命令：运行哪个程序
<span class="b">-la</span>       = 选项：怎么运行（l 详细 + a 含隐藏）
<span class="c">Documents</span> = 参数：对谁运行</pre><ul><li><b>命令 选项 参数</b>，空格隔开。选项以 <code>-</code> 开头；<code>--help</code> 之类的长选项用两个横线。</li><li><code>-la</code> 是 <code>-l -a</code> 的合写。</li><li>不知道怎么用：<code>命令 --help</code>，或 <code>man 命令</code>（按 <code>q</code> 退出）。</li></ul><p class="one">所有命令都是这个句式。</p></section><section class="card"><h3><span class="n">3</span>文件夹像一棵树，路径就是走法</h3><pre class="term"><span class="b">/</span>                         <span class="c">← 根，整台电脑的起点</span>
├── Applications
├── Users
│   └── <span class="k">goenkon</span>              <span class="c">← ~ 家目录（你的地盘）</span>
│       ├── Downloads
│       │   └── Developer
│       │       ├── ielts-backend
│       │       └── ielts-learning  <span class="c">← 项目在这</span>
│       └── Documents
└── etc  usr  bin  ...        <span class="c">← 系统自己用，别乱动</span></pre><ul><li><b>绝对路径</b>从根 <code>/</code> 或 <code>~</code> 写起：<code>~/Downloads/Developer</code>，在哪都指向同一处。</li><li><b>相对路径</b>从“我现在站的位置”写起：站在 Downloads 里，<code>cd Developer</code> 就够了。</li><li><code>.</code> = 这里，<code>..</code> = 上一层，所以 <code>cd ../..</code> 往上走两层。</li><li>把文件夹<b>拖进终端窗口</b>，路径自动补全。路径含空格要加引号。</li></ul><p class="one">任何文件，都能用一串“从哪出发、怎么走”指出来。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">4</span>每天用的命令</h3><div class="scroll"><table class="tb"><tr><th>命令</th><th>干什么</th><th>提醒</th></tr><tr><td><code>pwd</code></td><td>我在哪</td><td>迷路时第一条</td></tr><tr><td><code>ls</code> / <code>ls -la</code></td><td>看有什么</td><td><code>-a</code> 能看到 .git、.env 这类隐藏文件</td></tr><tr><td><code>cd 目录</code></td><td>进入</td><td><code>cd</code> 不带参数 = 回家；<code>cd -</code> = 回到上一个位置</td></tr><tr><td><code>mkdir 名</code></td><td>新建文件夹</td><td><code>-p</code> 可一次建多层</td></tr><tr><td><code>touch 文件</code></td><td>新建空文件</td><td></td></tr><tr><td><code>cp 源 目标</code></td><td>复制</td><td>文件夹要加 <code>-r</code></td></tr><tr><td><code>mv 源 目标</code></td><td>移动 / 改名</td><td>同一文件夹里 mv = 改名</td></tr><tr><td><code>rm 文件</code></td><td><b class='no'>永久删除</b></td><td><b>没有回收站</b>。<code>rm -rf 路径</code> 最危险，回车前再看一遍</td></tr><tr><td><code>cat / head / tail</code></td><td>看文件内容</td><td><code>tail -f 日志</code> 实时盯着新增内容</td></tr><tr><td><code>open .</code></td><td>在 Finder 里打开这里</td><td><code>open 文件</code> 用默认程序打开</td></tr><tr><td><code>code .</code></td><td>用 VS Code 打开这个文件夹</td><td>需要先在 VS Code 里装 code 命令</td></tr><tr><td><code>grep 词 文件</code></td><td>在文件里搜文字</td><td><code>grep -rn 词 .</code> 递归搜整个项目</td></tr><tr><td><code>find . -name "*.ts"</code></td><td>按名字找文件</td><td></td></tr><tr><td><code>du -sh *</code> / <code>df -h</code></td><td>文件夹多大 / 磁盘剩多少</td><td><code>-h</code> = 人看得懂的 MB、GB</td></tr><tr><td><code>history</code></td><td>敲过的命令清单</td><td></td></tr></table></div><ul><li>命令不用背。要的时候回来查，或问我。</li></ul><p class="one">先掌握 pwd / ls / cd / mkdir / mv，其余用到再学。</p></section><section class="card"><h3><span class="n">5</span>键盘快捷键，比命令还省力</h3><div class="scroll"><table class="tb"><tr><th>按键</th><th>效果</th></tr><tr><td><code>Tab</code></td><td>自动补全文件名或命令。敲几个字母按 Tab，不用打全</td></tr><tr><td><code>↑ / ↓</code></td><td>调出之前敲过的命令</td></tr><tr><td><code>⌃ + R</code></td><td>搜历史命令：输入片段，找到按回车</td></tr><tr><td><code>⌃ + C</code></td><td><b>强制停止</b>正在跑的程序（服务器、卡住的命令）</td></tr><tr><td><code>⌃ + D</code></td><td>结束输入 / 退出当前 shell</td></tr><tr><td><code>⌃ + L</code></td><td>清屏（历史还在）</td></tr><tr><td><code>⌃ + A / E</code></td><td>光标跳到行首 / 行尾</td></tr><tr><td><code>⌥ + ← / →</code></td><td>按单词跳</td></tr><tr><td><code>⌘ + T</code></td><td>新标签页（服务器占着窗口时用）</td></tr></table></div><ul><li>复制：<code>⌘ + C</code> 是复制，<code>⌃ + C</code> 是中断，两个不一样。</li></ul><p class="one">Tab + ↑ + Ctrl+C 三个键，顶一半效率。</p></section></div><div class="grid"><section class="card"><h3><span class="n">6</span>管道和重定向：把命令拼起来</h3><svg viewBox="0 0 520 124" role="img" aria-label="管道示意"><g class="wob"><rect class="s fb" x="10" y="30" width="130" height="50" rx="9"/><rect class="s fy" x="190" y="30" width="130" height="50" rx="9"/><rect class="s fg" x="370" y="30" width="130" height="50" rx="9"/><path class="s" d="M142 55 L188 55" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M322 55 L368 55" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="75" y="52" text-anchor="middle" class="zh" style="font-size:12.5px">cat log.txt</text><text x="75" y="68" text-anchor="middle" class="zh" style="font-size:10.0px">输出一堆文字</text><text x="255" y="52" text-anchor="middle" class="zh" style="font-size:12.5px">grep ERROR</text><text x="255" y="68" text-anchor="middle" class="zh" style="font-size:10.0px">只留带 ERROR 的行</text><text x="435" y="52" text-anchor="middle" class="zh" style="font-size:12.5px">&gt; err.txt</text><text x="435" y="68" text-anchor="middle" class="zh" style="font-size:10.0px">写进文件</text><text x="165" y="44" text-anchor="middle" class="zh" style="font-size:18.0px">|</text><text x="345" y="44" text-anchor="middle" class="zh" style="font-size:18.0px">|</text><text x="10" y="112" class="cap">cat log.txt | grep ERROR &gt; err.txt   ：先读，再过滤，最后保存</text></svg><ul><li><code>|</code> 管道：左边命令的<b>输出</b>变成右边命令的<b>输入</b>。每个命令只做一件小事，拼起来就很强。</li><li><code>&gt;</code> 把输出<b>覆盖写入</b>文件；<code>&gt;&gt;</code> 追加到文件末尾。</li><li><code>&amp;&amp;</code> 前一个成功才执行后一个：<code>git add -A &amp;&amp; git commit -m "x"</code>。</li><li><code>&amp;</code> 放在末尾 = 丢到后台去跑，不占着窗口。</li></ul><p class="one">小命令 + 管道 = 大本事。</p></section><section class="card"><h3><span class="n">7</span>文件权限：ls -l 前面那串字母</h3><pre class="term"><span class="c">-rwxr-xr--  1 goenkon  staff  420  deploy.sh</span>
<span class="k">-</span> <span class="b">rwx</span> <span class="b">r-x</span> <span class="b">r--</span>
│  │    │    └─ 其他人：只能读
│  │    └────── 同组的人：读 + 执行
│  └─────────── 我自己：读 + 写 + 执行
└────────────── 类型：- 文件，d 文件夹

<span class="k">chmod</span> <span class="b">+x</span> deploy.sh    <span class="c">给它执行权限</span>
<span class="k">chmod</span> <span class="b">644</span> a.txt        <span class="c">数字写法：rw-r--r--</span>
<span class="k">sudo</span> 命令              <span class="c">以管理员身份运行（输密码时不显示）</span></pre><ul><li><b>r 读（4）、w 写（2）、x 执行（1）</b>，数字是相加：7=rwx，6=rw-，5=r-x，4=r--。</li><li>“Permission denied”就是权限不够。先想清楚为什么，别一上来就 <code>sudo</code>。</li><li><code>sudo</code> 权力太大，别人给你的陌生命令别加 sudo 运行。</li></ul><p class="one">三类人（我、同组、其他）× 三种权限（读、写、执行）。</p></section><section class="card"><h3><span class="n">8</span>进程：看谁在跑、关掉它</h3><pre class="term"><span class="k">ps</span> aux | <span class="k">grep</span> node        <span class="c">找出所有 node 进程</span>
<span class="b">goenkon  48213  0.3 ...  node server.js</span>
         └─ 进程号 PID

<span class="k">lsof</span> -i :3000                <span class="c">谁占着 3000 端口？</span>
<span class="k">kill</span> 48213                   <span class="c">请它自己退出（温和）</span>
<span class="k">kill</span> -9 48213                <span class="c">强制杀掉（最后手段）</span>

<span class="c"># 活动监视器 ≈ 图形版的 ps</span></pre><ul><li>每个运行中的程序是一个<b>进程</b>，系统给它一个编号 PID。</li><li><code>EADDRINUSE: address already in use :::3000</code> = 3000 端口被上一次没关掉的服务占着：lsof 找到 PID，kill 它。</li><li>端口同一时刻只能被一个进程占用。</li></ul><p class="one">进程有编号，端口有占用，都能查到。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">9</span>环境变量：不写进代码的配置</h3><svg viewBox="0 0 520 128" role="img" aria-label="环境变量"><g class="wob"><rect class="s fg" x="10" y="18" width="200" height="96" rx="10"/><rect class="s fy" x="260" y="18" width="250" height="40" rx="10"/><rect class="s fb" x="260" y="74" width="250" height="40" rx="10"/><path class="s" d="M212 52 L258 40" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M212 80 L258 94" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="110" y="40" text-anchor="middle" class="zh" style="font-size:13.0px">同一份代码</text><text x="110" y="58" text-anchor="middle" class="zh" style="font-size:10.5px">process.env.DATABASE_URL</text><text x="110" y="76" text-anchor="middle" class="zh" style="font-size:10.5px">process.env.JWT_SECRET</text><text x="110" y="96" text-anchor="middle" class="cap" style="font-size:10.0px">代码里只写变量的名字</text><text x="385" y="42" text-anchor="middle" class="zh" style="font-size:12.0px">你电脑：.env 文件</text><text x="385" y="54" text-anchor="middle" class="cap" style="font-size:10.0px">测试库、测试密钥</text><text x="385" y="98" text-anchor="middle" class="zh" style="font-size:12.0px">Vercel：Environment Variables</text><text x="385" y="110" text-anchor="middle" class="cap" style="font-size:10.0px">正式库、正式密钥</text></svg><ul><li><b>环境变量</b>是由“运行环境”提供给程序的一组名字 = 值，比如 <code>DATABASE_URL=postgresql://…</code>。程序里用 <code>process.env.DATABASE_URL</code> 读取。</li><li><b>为什么不直接写进代码：</b>①代码会推到 GitHub，密码就泄露了；②本地和线上要连<b>不同</b>的数据库，同一份代码不能写死；③换密码不用改代码、不用重新提交。</li><li><b>放哪</b>：本地用项目根目录的 <code>.env</code> 文件（且必须写进 <code>.gitignore</code>，不提交）；线上在 Vercel 项目的 Settings → Environment Variables 里填。</li><li><b>前端特别注意</b>：前端代码最终会发到每个人的浏览器里，用户能看到全部内容。所以前端的“环境变量”（如 Vite 的 <code>VITE_</code> 开头）<b>不是秘密</b>，真正的秘密只能放后端。</li><li><b>终端里也有环境变量</b>：<code>echo $HOME</code> 看家目录，<code>export NAME=值</code> 只在当前窗口临时设置；<code>env</code> 列出全部。</li><li>改完环境变量，要<b>重启服务 / 重新部署</b>才生效，因为程序只在启动时读一次。</li></ul><p class="one">代码写“要什么”，环境决定“给什么”。密码、密钥、连接串永远走环境变量。</p></section><section class="card"><h3><span class="n">10</span>PATH：为什么装了却“command not found”</h3><pre class="term"><span class="k">echo</span> $PATH
/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
  └── 用冒号隔开的一串文件夹

你敲 <span class="k">node</span> → shell 按顺序去这些文件夹里找叫 node 的程序
  找到第一个就运行；都没有 → <span class="e">command not found</span>

<span class="k">which</span> node        <span class="c">它到底在哪一个文件夹找到的</span>
<span class="c"># 永久改配置：写进 ~/.zshrc，再 source ~/.zshrc 生效</span></pre><ul><li><b>PATH</b> 是一个特殊的环境变量：告诉 shell“去哪些文件夹找命令”。</li><li><code>brew install</code> 或 <code>npm install -g</code> 装好后找不到，多半是它所在的文件夹不在 PATH 里。</li><li><code>~/.zshrc</code> 是 zsh 每次打开时自动运行的配置文件，别名、PATH 都写在这里。</li></ul><p class="one">命令 = PATH 里某个文件夹里的某个文件。</p></section><section class="card"><h3><span class="n">11</span>装东西的几种方式</h3><div class="scroll"><table class="tb"><tr><th>工具</th><th>装什么</th><th>例子</th></tr><tr><td><b>Homebrew</b> (<code>brew</code>)</td><td>Mac 上的软件和命令行工具</td><td><code>brew install node git</code></td></tr><tr><td><b>npm</b></td><td>JavaScript 的包</td><td>项目里 <code>npm install</code>；<code>-g</code> 全局装</td></tr><tr><td><b>pip</b></td><td>Python 的包</td><td><code>pip install requests</code></td></tr><tr><td><b>App Store / dmg</b></td><td>图形界面应用</td><td>VS Code、Chrome</td></tr></table></div><ul><li><b>项目依赖</b>（npm install 在项目里装的）放在项目的 <code>node_modules</code>；<b>全局工具</b>放在系统别处。两者不要混。</li><li><code>node_modules</code> 可以随时删了重装，所以不提交到 Git，靠 <code>package.json</code> 记着要装什么。</li></ul><p class="one">包管理器 = 软件的应用商店，命令行版。</p></section></div></section><section class="panel" id="p-computer" aria-label="计算机基础"><h2>计算机基础</h2><p class="sec">写网站其实一直在和这些东西打交道：内存、进程、事件循环、编码、数据格式。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>一台电脑里谁负责什么</h3><svg viewBox="0 0 520 182" role="img" aria-label="CPU 内存 硬盘"><g class="wob"><rect class="s fb" x="10" y="14" width="140" height="64" rx="10"/><rect class="s fy" x="190" y="14" width="140" height="64" rx="10"/><rect class="s fg" x="370" y="14" width="140" height="64" rx="10"/><path class="s" d="M152 46 L188 46" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M332 46 L368 46" marker-end="url(#ah)" style="stroke-width:2"/><rect class="s fp" x="10" y="108" width="500" height="44" rx="10"/></g><text x="80" y="42" text-anchor="middle" class="zh" style="font-size:14.0px">CPU</text><text x="80" y="60" text-anchor="middle" class="zh" style="font-size:10.5px">计算、做决定</text><text x="260" y="42" text-anchor="middle" class="zh" style="font-size:14.0px">内存 RAM</text><text x="260" y="60" text-anchor="middle" class="zh" style="font-size:10.5px">正在用的东西</text><text x="440" y="42" text-anchor="middle" class="zh" style="font-size:14.0px">硬盘 SSD</text><text x="440" y="60" text-anchor="middle" class="zh" style="font-size:10.5px">长期保存</text><text x="260" y="134" text-anchor="middle" class="zh" style="font-size:11.5px">操作系统 (macOS)：分配 CPU 时间、分配内存、管理文件、管理网络</text><text x="10" y="172" class="cap">速度：CPU ≫ 内存 ≫ 硬盘 ≫ 网络；容量反过来：硬盘最大，内存次之</text></svg><ul><li><b>内存</b>断电就清空，但快；<b>硬盘</b>断电还在，但慢。程序运行时，先从硬盘装进内存，CPU 只和内存打交道。</li><li><b>变量、数组、对象</b>都活在内存里，所以<b>刷新页面 / 重启服务，内存里的东西就没了</b>。要保留，必须写到硬盘或数据库。</li><li><b>数据库</b>本质就是一个专门替你管理硬盘文件的程序，加上索引、事务这些保证。</li><li>内存不够会变卡（开始借用硬盘当内存，很慢）；服务器的“内存溢出”崩溃就是这个。</li></ul><p class="one">存在内存里的是临时的，存在硬盘 / 数据库里的才是持久的。</p></section><section class="card"><h3><span class="n">2</span>程序、进程、线程</h3><svg viewBox="0 0 520 150" role="img" aria-label="程序进程线程"><g class="wob"><rect class="s fk" x="10" y="14" width="110" height="60" rx="10"/><rect class="s fb" x="190" y="8" width="150" height="130" rx="10"/><rect class="s fg" x="205" y="40" width="54" height="30" rx="6"/><rect class="s fg" x="270" y="40" width="54" height="30" rx="6"/><rect class="s fy" x="205" y="86" width="119" height="40" rx="6"/><path class="s" d="M122 44 L188 44" marker-end="url(#ah)" style="stroke-width:2"/><rect class="s fr" x="380" y="8" width="130" height="130" rx="10"/><rect class="s fy" x="392" y="40" width="106" height="40" rx="6"/></g><text x="65" y="40" text-anchor="middle" class="zh" style="font-size:13.0px">程序</text><text x="65" y="56" text-anchor="middle" class="zh" style="font-size:10.0px">硬盘上的文件</text><text x="265" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">进程 A（node）</text><text x="232" y="59" text-anchor="middle" class="zh" style="font-size:11.0px">线程</text><text x="297" y="59" text-anchor="middle" class="zh" style="font-size:11.0px">线程</text><text x="264" y="110" text-anchor="middle" class="zh" style="font-size:11.0px">各自的内存空间</text><text x="445" y="30" text-anchor="middle" class="zh" style="font-size:12.0px">进程 B（Chrome）</text><text x="445" y="64" text-anchor="middle" class="zh" style="font-size:11.0px">各自的内存</text><text x="445" y="110" text-anchor="middle" class="zh" style="font-size:11.0px">互相看不到</text></svg><ul><li><b>程序</b>是躺在硬盘里的文件；<b>双击运行 = 创建一个进程</b>，操作系统给它一块独立的内存。</li><li><b>进程之间互相隔离</b>：Chrome 崩了不会带走 VS Code。需要沟通就得靠网络或文件（这也是为什么前后端要用 HTTP 说话）。</li><li><b>线程</b>是进程里“同时干活的人”，共用这块内存。Node.js 的 JavaScript 只有<b>一个主线程</b>，一次只执行一件事，靠“异步”处理等待。</li></ul><p class="one">进程是运行中的程序，线程是进程里干活的人。</p></section><section class="card"><h3><span class="n">3</span>JS 为什么能一边等网络一边不卡（事件循环）</h3><svg viewBox="0 0 520 160" role="img" aria-label="事件循环"><g class="wob"><rect class="s fb" x="10" y="12" width="150" height="120" rx="10"/><rect class="s fy" x="200" y="12" width="150" height="56" rx="10"/><rect class="s fg" x="200" y="82" width="150" height="50" rx="10"/><rect class="s fp" x="390" y="12" width="120" height="120" rx="10"/><path class="s" d="M352 40 L388 40" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M388 106 L352 106" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M300 82 L300 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M160 106 Q180 130 198 106" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="85" y="32" text-anchor="middle" class="zh" style="font-size:13.0px">调用栈</text><text x="85" y="48" text-anchor="middle" class="zh" style="font-size:10.0px">正在执行的代码</text><text x="85" y="100" text-anchor="middle" class="zh" style="font-size:11.0px">一次只做一件</text><text x="85" y="116" text-anchor="middle" class="zh" style="font-size:10.0px">做完才取下一件</text><text x="275" y="36" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器后台</text><text x="275" y="54" text-anchor="middle" class="zh" style="font-size:10.0px">计时器·网络·点击</text><text x="275" y="104" text-anchor="middle" class="zh" style="font-size:12.5px">任务队列</text><text x="275" y="120" text-anchor="middle" class="zh" style="font-size:10.0px">等着被执行的回调</text><text x="450" y="34" text-anchor="middle" class="zh" style="font-size:12.5px">事件循环</text><text x="450" y="54" text-anchor="middle" class="zh" style="font-size:10.0px">栈空了就从队列</text><text x="450" y="68" text-anchor="middle" class="zh" style="font-size:10.0px">取下一个任务</text><text x="10" y="150" class="cap">fetch() 发出去就交给后台去等，主线程继续往下走；响应回来，回调排队，轮到它再执行</text></svg><ul><li><code>fetch(...)</code> 不会让页面卡住：请求交给浏览器去等，主线程继续做别的事。响应回来后，<code>then / await</code> 后面的代码被放进队列，主线程空闲时执行。</li><li>所以代码顺序 ≠ 完成顺序：<code>setTimeout(f, 0)</code> 也要等当前这一轮代码跑完才执行。</li><li><b>一直占着主线程的计算（死循环、超大 for）会让整个页面卡死</b>，因为其他事件都排不上队。</li></ul><p class="one">异步 = “先交代出去，回头再来取”。</p></section></div><div class="grid"><section class="card"><h3><span class="n">4</span>二进制与文字：为什么会有乱码</h3><div class="scroll"><table class="tb"><tr><th>概念</th><th>意思</th><th>例子</th></tr><tr><td>bit / byte</td><td>最小单位 0/1；8 个 bit = 1 byte</td><td>1 KB = 约 1000 byte</td></tr><tr><td>字符编码</td><td>“字” ↔ “一串字节”的对照规则</td><td>UTF-8 是现在的标准</td></tr><tr><td>ASCII</td><td>只有英文字母数字</td><td>一个字符 1 byte</td></tr><tr><td>UTF-8</td><td>兼容 ASCII；中文日文通常 3 byte 一个</td><td>「语」= 3 byte</td></tr><tr><td>乱码</td><td>用 A 规则写，用 B 规则读</td><td><code>æ–‡å­—</code></td></tr></table></div><ul><li><b>文件本身只是一串字节</b>，怎么变成字，取决于读的人用什么编码。网页要写 <code>&lt;meta charset="utf-8"&gt;</code>，就是告诉浏览器用 UTF-8 读。</li><li>网址里放中文会被转成 <code>%E8%AF%AD</code> 这种百分号编码（见“地址栏”）。</li><li>数据库、接口、文件统一用 UTF-8，几乎不会再见到乱码。</li></ul><p class="one">乱码 = 读写双方对不上编码。</p></section><section class="card"><h3><span class="n">5</span>数据类型：JSON 是前后端的通用语</h3><pre class="term"><span class="c">// JSON：所有语言都能读写的数据格式</span>
{
  <span class="b">"id"</span>: <span class="k">42</span>,                   <span class="c">数字</span>
  <span class="b">"word"</span>: <span class="k">"accommodation"</span>,   <span class="c">字符串（必须双引号）</span>
  <span class="b">"kind"</span>: <span class="k">"w"</span>,
  <span class="b">"tags"</span>: [<span class="k">"IELTS"</span>, <span class="k">"A2"</span>],  <span class="c">数组</span>
  <span class="b">"done"</span>: <span class="k">false</span>,               <span class="c">布尔：true / false</span>
  <span class="b">"note"</span>: <span class="k">null</span>                 <span class="c">空值</span>
}
<span class="c">// JSON.stringify(对象) → 字符串 ； JSON.parse(字符串) → 对象</span></pre><ul><li>网络上传的永远是<b>字节 / 文字</b>，不是 JS 对象。所以发送前要 <code>JSON.stringify</code> 变成字符串，收到后 <code>r.json()</code> 变回对象。</li><li>JSON 的规矩：key 必须双引号，最后一项后面不能有逗号，不能写注释。</li></ul><p class="one">前后端之间的数据，是一段 JSON 文字。</p></section><section class="card"><h3><span class="n">6</span>同步 / 异步，用点咖啡来想</h3><div class="cmp"><div class="l"><h4>同步：排队等</h4><ul><li>点单，站在柜台等咖啡做好</li><li>后面的人全卡住</li><li>一个请求没回来，页面不能动</li></ul></div><div class="r"><h4>异步：拿号去坐</h4><ul><li>点单拿号，坐下看手机</li><li>咖啡好了叫你</li><li>请求发出去，页面照常响应</li></ul></div></div><ul><li>JS 里的 <code>async / await</code> 写起来像同步，实际是异步：<code>await</code> 那一行会“拿号等通知”，其他代码照跑。</li><li><code>await</code> 只能在 <code>async</code> 函数里用；忘了写 await，拿到的是一个“还没兑现的承诺”（Promise）而不是结果，这是新手最常见的 bug。</li><li>多个互不依赖的请求用 <code>Promise.all([...])</code> 并行发，比逐个 await 快。</li></ul><p class="one">没写 await 却想用结果 = 拿着号码牌当咖啡喝。</p></section></div></section><section class="panel" id="p-network" aria-label="网络"><h2>网络</h2><p class="sec">一次访问背后：分层、DNS、握手、加密、端口、CDN。每个概念都配了一张“发生了什么”的图。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>网络分层：每一层只管自己的事</h3><svg viewBox="0 0 640 332" role="img" aria-label="分层：应用层  HTTP / DNS / SMTP / 安全层  TLS / 传输层  TCP / UDP / 网络层  IP / 链路层  Wi-Fi / 网线"><g class="wob"><rect class="s fb" x="10" y="8" width="347.2" height="52" rx="9"/><rect class="s fy" x="10" y="68" width="347.2" height="52" rx="9"/><rect class="s fg" x="10" y="128" width="347.2" height="52" rx="9"/><rect class="s fp" x="10" y="188" width="347.2" height="52" rx="9"/><rect class="s fr" x="10" y="248" width="347.2" height="52" rx="9"/></g><text x="183.6" y="30" text-anchor="middle" class="zh" style="font-size:13.5px">应用层  HTTP / DNS / SMTP</text><text x="183.6" y="48" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">你写的前后端在这一层说话</text><path class="s" d="M361.2 34 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="38.0" text-anchor="start" class="zh" style="font-size:11.5px">我们的接口：GET /favorites</text><text x="183.6" y="90" text-anchor="middle" class="zh" style="font-size:13.5px">安全层  TLS</text><text x="183.6" y="108" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">加密、验明身份</text><path class="s" d="M361.2 94 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="98.0" text-anchor="start" class="zh" style="font-size:11.5px">https 的 s 就是它</text><text x="183.6" y="150" text-anchor="middle" class="zh" style="font-size:13.5px">传输层  TCP / UDP</text><text x="183.6" y="168" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">可靠送达、分端口</text><path class="s" d="M361.2 154 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="158.0" text-anchor="start" class="zh" style="font-size:11.5px">端口号：443、3000</text><text x="183.6" y="210" text-anchor="middle" class="zh" style="font-size:13.5px">网络层  IP</text><text x="183.6" y="228" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">找到那台机器</text><path class="s" d="M361.2 214 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="218.0" text-anchor="start" class="zh" style="font-size:11.5px">IP 地址：怎么走到对方</text><text x="183.6" y="270" text-anchor="middle" class="zh" style="font-size:13.5px">链路层  Wi-Fi / 网线</text><text x="183.6" y="288" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">在一段线路上传比特</text><path class="s" d="M361.2 274 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="278.0" text-anchor="start" class="zh" style="font-size:11.5px">你的 Wi-Fi、光纤</text><text x="10" y="326" class="cap">发送：从上往下一层层包装；接收：从下往上一层层拆开</text></svg><ul><li>像寄快递：<b>应用层</b>是信的内容，<b>传输层</b>写“几号房”（端口），<b>网络层</b>写“哪栋楼”（IP），<b>链路层</b>是具体的送货路线。</li><li><b>每一层只和对方的同一层“说话”</b>，不管下面是 Wi-Fi 还是网线。所以换了网络，你的网站代码不用改。</li><li>日常开发主要在应用层；碰到连不上、很慢、证书错误，再往下一层层排查。</li></ul><p class="one">一层管一件事，分层让复杂的网络变得可拆解。</p></section><section class="card full"><h3><span class="n">2</span>DNS：域名怎么变成 IP</h3><svg viewBox="0 0 680 462" role="img" aria-label="时序图：浏览器 / 本地缓存 / 递归 DNS / 根 / .com / 权威 DNS"><g class="wob"><rect class="s fb" x="16.0" y="12" width="120.0" height="40" rx="9"/><path d="M76.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fk" x="148.0" y="12" width="120.0" height="40" rx="9"/><path d="M208.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="280.0" y="12" width="120.0" height="40" rx="9"/><path d="M340.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="412.0" y="12" width="120.0" height="40" rx="9"/><path d="M472.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="544.0" y="12" width="120.0" height="40" rx="9"/><path d="M604.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M79.0 86.0 H203.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M211.0 136.0 H335.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M343.0 186.0 H467.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M469.0 236.0 H345.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M343.0 286.0 H599.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M601.0 336.0 H345.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M337.0 386.0 H81.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="76.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="208.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">本地缓存</text><text x="208.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">电脑 / 路由器</text><text x="340.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">递归 DNS</text><text x="340.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">如 8.8.8.8</text><text x="472.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">根 / .com</text><text x="472.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">名录服务器</text><text x="604.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">权威 DNS</text><text x="604.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">Cloudflare</text><text x="142.0" y="78" text-anchor="middle" class="zh" style="font-size:11.0px">1 jlpt.goenkon.com？</text><text x="142.0" y="101" text-anchor="middle" class="cap" style="font-size:9.5px">先问自己有没有记过</text><text x="274.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 不知道，帮我查</text><text x="406.0" y="178" text-anchor="middle" class="zh" style="font-size:10.1px">3 谁管 .com？→ 去问权威</text><text x="406.0" y="228" text-anchor="middle" class="zh" style="font-size:9.5px">4 指路：去 Cloudflare 问</text><text x="472.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 jlpt.goenkon.com 是？</text><text x="472.0" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 指向 Vercel 的 IP</text><text x="472.0" y="351" text-anchor="middle" class="cap" style="font-size:9.5px">A 或 CNAME 记录</text><text x="208.0" y="378" text-anchor="middle" class="zh" style="font-size:11.5px">7 答案 + 缓存一段时间 (TTL)</text><text x="10" y="456" class="cap">结果会按 TTL 缓存：所以改了 DNS 要等一阵才全球生效</text></svg><ul><li>DNS 是<b>分层的电话簿</b>：根 → .com → 你的域名自己的服务器，一层层指路，最后拿到 IP。</li><li>你买域名，其实是买了“在 .com 的名录里登记一行”的资格；这一行写着“我的 DNS 由 Cloudflare 管”。</li><li><b>记录类型</b>：A（域名→IPv4）、AAAA（→IPv6）、CNAME（域名→另一个域名，像别名）、TXT（放文字，常用来验证域名归属）、MX（邮件）。我们的 jlpt 子域名就是一条指向 Vercel 的 CNAME。</li><li>排错：<code>nslookup jlpt.goenkon.com</code> 或 <code>dig jlpt.goenkon.com</code> 直接看解析结果。</li></ul><p class="one">DNS 只干一件事：名字 → 地址。</p></section><section class="card full"><h3><span class="n">3</span>TCP 三次握手 + TLS：连接是怎么建起来的</h3><svg viewBox="0 0 640 462" role="img" aria-label="时序图：浏览器 / 服务器"><g class="wob"><rect class="s fb" x="16.0" y="12" width="298.0" height="40" rx="9"/><path d="M165.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="326.0" y="12" width="298.0" height="40" rx="9"/><path d="M475.0 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M168.0 86.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 136.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 186.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 236.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 286.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 336.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 386.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="165.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="475.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">服务器</text><text x="475.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">443 端口</text><text x="320.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 SYN：我想连你</text><text x="320.0" y="101" text-anchor="middle" class="cap" style="font-size:9.5px">TCP 握手第一步</text><text x="320.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 SYN+ACK：好，我也准备好了</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 ACK：收到，开始吧</text><text x="320.0" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">连接建好，可靠通道</text><text x="320.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 ClientHello：我支持这些加密方式</text><text x="320.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">TLS 开始</text><text x="320.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 证书 + 选定的加密方式</text><text x="320.0" y="301" text-anchor="middle" class="cap" style="font-size:9.5px">证书证明“我真的是这个域名”</text><text x="320.0" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 用证书里的公钥协商出会话密钥</text><text x="320.0" y="378" text-anchor="middle" class="zh" style="font-size:11.5px">7 之后全是加密的 HTTP 请求</text><text x="320.0" y="401" text-anchor="middle" class="cap" style="font-size:9.5px">对称加密，快</text><text x="10" y="456" class="cap">握手花的往返越多越慢：所以服务器离你近、保持连接复用都能提速</text></svg><ul><li><b>TCP</b>保证“按顺序、不丢、不重复”：丢了会自动重发。代价是需要先握手建立连接。</li><li><b>TLS</b>解决两件事：①<b>加密</b>：路上的人看到的是乱码；②<b>验明身份</b>：证书由权威机构签发，证明这个域名真的属于这个服务器，防冒充。</li><li><b>证书</b>有期限，要续期。Vercel 会自动帮我们签发和续期，所以一般碰不到“证书过期”。</li><li><b>UDP</b>不握手、不保证送达，换来很快，用于视频通话、游戏。</li></ul><p class="one">先建可靠通道（TCP），再加锁（TLS），然后才说 HTTP。</p></section></div><div class="grid"><section class="card"><h3><span class="n">4</span>端口和 localhost</h3><svg viewBox="0 0 520 176" role="img" aria-label="端口"><g class="wob"><rect class="s fk" x="10" y="12" width="500" height="150" rx="12"/><rect class="s fb" x="30" y="40" width="130" height="50" rx="8"/><rect class="s fy" x="195" y="40" width="130" height="50" rx="8"/><rect class="s fg" x="360" y="40" width="130" height="50" rx="8"/><path class="s" d="M95 140 L95 92" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M260 140 L260 92" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M425 140 L425 92" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="260" y="32" text-anchor="middle" class="zh" style="font-size:11.0px">你的电脑（IP: 192.168.0.12，别名 localhost = 127.0.0.1）</text><text x="95" y="62" text-anchor="middle" class="zh" style="font-size:12.5px">前端 dev</text><text x="95" y="78" text-anchor="middle" class="zh" style="font-size:11.0px">端口 5173</text><text x="260" y="62" text-anchor="middle" class="zh" style="font-size:12.5px">后端 dev</text><text x="260" y="78" text-anchor="middle" class="zh" style="font-size:11.0px">端口 3000</text><text x="425" y="62" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="425" y="78" text-anchor="middle" class="zh" style="font-size:11.0px">端口 5432</text><text x="95" y="154" text-anchor="middle" class="zh" style="font-size:11.5px">localhost:5173</text><text x="260" y="154" text-anchor="middle" class="zh" style="font-size:11.5px">localhost:3000</text><text x="425" y="154" text-anchor="middle" class="zh" style="font-size:11.5px">localhost:5432</text></svg><ul><li><b>IP 找到机器，端口找到机器上的哪个程序</b>。一台机器最多 65535 个端口，一个端口同一时刻只给一个程序用。</li><li>常见默认：<code>80</code> http、<code>443</code> https、<code>22</code> ssh、<code>5432</code> PostgreSQL、<code>3000</code> / <code>5173</code> 前端开发服务器。</li><li><code>localhost</code> = <code>127.0.0.1</code> = “我自己”：数据包不出电脑，直接回给自己。<b>别人输入你的 localhost 看到的是他自己的电脑</b>。</li><li>想让同一个 Wi-Fi 下的手机访问你的电脑开发服务器：用电脑的局域网 IP（如 192.168.x.x:5173），且服务要监听 <code>0.0.0.0</code>。</li></ul><p class="one">IP 是楼，端口是门牌号。</p></section><section class="card full"><h3><span class="n">5</span>代理、反向代理、CDN：中间的“中间人”</h3><svg viewBox="0 0 640 412" role="img" aria-label="时序图：你 / CDN 边缘节点 / 源站"><g class="wob"><rect class="s fb" x="16.0" y="12" width="194.7" height="40" rx="9"/><path d="M113.3 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="222.7" y="12" width="194.7" height="40" rx="9"/><path d="M320.0 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="429.3" y="12" width="194.7" height="40" rx="9"/><path d="M526.7 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M116.3 86.0 H315.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M317.0 136.0 H118.3" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M116.3 186.0 H315.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M323.0 236.0 H521.7" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 286.0 H325.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M317.0 336.0 H118.3" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="113.3" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你</text><text x="113.3" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">浏览器</text><text x="320.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">CDN 边缘节点</text><text x="320.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">离你最近的机房</text><text x="526.7" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">源站</text><text x="526.7" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">Vercel / 你的服务器</text><text x="216.7" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 请求 /logo.png</text><text x="216.7" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 我有缓存，直接给你</text><text x="216.7" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">命中缓存：快，不打扰源站</text><text x="216.7" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 请求 /api/favorites</text><text x="423.3" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 没缓存，我替你去问</text><text x="423.3" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">反向代理：用户只认识前台</text><text x="423.3" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 返回数据</text><text x="216.7" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 转交给你（可能顺便存一份）</text><text x="10" y="406" class="cap">CDN 和反向代理站在服务器前面，替它挡流量、省距离</text></svg><ul><li><b>CDN</b>：把静态文件（图片、JS、CSS）复制到全球很多机房，用户从最近的拿，所以快。我们的语音包放在 Cloudflare R2 + CDN 也是这个思路。</li><li><b>反向代理</b>：站在服务器前面接客，再转给后面真正干活的服务器。能做加密、限流、负载均衡。Vercel、Cloudflare 都扮演了这个角色。</li><li><b>正向代理 / VPN</b>：站在<b>你</b>前面，替你去访问别的网站。</li><li>代价：改了文件，用户可能还在读缓存里的旧版本。这就是为什么我们页面有“版本号”，也是改了没生效时要“强制刷新”的原因。</li></ul><p class="one">离用户近、替服务器挡一挡，网站就更快更稳。</p></section><section class="card"><h3><span class="n">6</span>HTTP 的几个版本</h3><div class="scroll"><table class="tb"><tr><th>版本</th><th>特点</th><th>你需要知道的</th></tr><tr><td>HTTP/1.1</td><td>一个连接一次处理一个请求，文字格式</td><td>最经典，本笔记里的报文就是它的样子</td></tr><tr><td>HTTP/2</td><td>一个连接同时跑很多请求，头部压缩</td><td>现在大多数网站在用，对你的代码是透明的</td></tr><tr><td>HTTP/3</td><td>基于 UDP（QUIC），弱网更稳</td><td>同样透明，浏览器和服务器自动协商</td></tr><tr><td>WebSocket</td><td>连接建好后双向随时发消息</td><td>聊天、实时行情；普通接口不需要</td></tr></table></div><ul><li>你写的代码（fetch、Express）在三个版本里<b>完全一样</b>，升级由浏览器和服务器自己谈好。</li></ul><p class="one">版本影响速度，不影响你怎么写。</p></section></div></section><section class="panel" id="p-http" aria-label="HTTP"><h2>HTTP</h2><p class="sec">前后端之间说话的语法：报文怎么写、方法、状态码、头、数据放哪里、缓存、CORS。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>一个真实请求，一行行解剖</h3><div class="an"><code class="b">POST /favorites HTTP/1.1</code><em><b>请求行</b>：方法 + 路径 + 协议版本</em><code class="y">Host: ielts-backend-node.vercel.app</code><em>要访问哪个域名（一台机器可放多个网站）</em><code class="y">Authorization: Bearer eyJhbGci...</code><em>登录凭证 token</em><code class="y">Content-Type: application/json</code><em>请求体的格式</em><code class="y">Origin: https://ielts.goenkon.com</code><em>我是从哪个网站发起的（CORS 靠它）</em><code class="k">（一个空行）</code><em><b>头结束的标志</b></em><code class="g">{"kind":"w","word":"accommodation"}</code><em><b>请求体</b>：真正要交给后端的数据</em></div><ul><li>HTTP 报文就是<b>一段有格式的文字</b>：第一行说做什么，接着若干行“名字: 值”，一个空行，最后是内容。</li><li>后端框架（Express）做的，就是把这段文字拆好，递到你手里：<code>req.method</code>、<code>req.path</code>、<code>req.headers</code>、<code>req.body</code>。</li><li>GET 请求通常没有体。</li></ul><p class="one">请求 = 请求行 + 头 + 空行 + 体。</p></section><section class="card"><h3><span class="n">2</span>响应也是三段</h3><div class="an"><code class="b">HTTP/1.1 201 Created</code><em><b>状态行</b>：版本 + 状态码 + 说明</em><code class="y">Content-Type: application/json</code><em>体的格式，所以前端才能 r.json()</em><code class="y">Access-Control-Allow-Origin: https://ielts.goenkon.com</code><em>允许这个网站的 JS 读响应（CORS）</em><code class="y">Cache-Control: no-store</code><em>不要缓存这份内容</em><code class="g">{"id":42}</code><em><b>响应体</b>：结果数据</em></div><ul><li>前端：<code>r.ok</code>（状态码 200–299 为 true）判断成功，<code>await r.json()</code> 读体，<code>r.status</code> 看具体数字。</li><li><b>fetch 遇到 404/500 不会抛错</b>，只有网络断了才抛错，所以必须自己检查 <code>r.ok</code>。</li></ul><p class="one">状态行告诉你成没成，体告诉你结果是什么。</p></section><section class="card"><h3><span class="n">3</span>方法：想对资源做什么</h3><div class="scroll"><table class="tb"><tr><th>方法</th><th>意思</th><th>对应 SQL</th><th>例子</th></tr><tr><td>GET</td><td>读</td><td>SELECT</td><td><code>GET /favorites</code></td></tr><tr><td>POST</td><td>新建</td><td>INSERT</td><td><code>POST /favorites</code></td></tr><tr><td>PUT</td><td>整个替换</td><td>UPDATE</td><td>替换一整条记录</td></tr><tr><td>PATCH</td><td>改一部分</td><td>UPDATE</td><td>只改学习状态</td></tr><tr><td>DELETE</td><td>删除</td><td>DELETE</td><td><code>DELETE /favorites/42</code></td></tr></table></div><ul><li><b>方法是动词，路径是名词</b>。同一路径不同方法，做的事不同：这就是 REST 风格。</li><li><b>安全方法</b>（GET）：只读，不改数据，所以可以缓存、可以随意重试。<b>幂等</b>：同一请求发 1 次和发 10 次结果一样（GET、PUT、DELETE 是；POST 不是，重复 POST 会新建多条）。</li><li>地址栏回车 / 点链接只能发 GET；POST、DELETE 必须靠 JS 的 <code>fetch</code>、表单发。</li></ul><p class="one">读用 GET，增 POST，改 PATCH，删 DELETE。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">4</span>数据怎么交给后端：三种位置</h3><div class="cmp"><div class="l"><h4>路径 / 查询：放在网址里</h4><ul><li><code>/favorites/42</code>：要操作哪一个</li><li><code>/favorites?site=jlpt&amp;page=2</code>：筛选、分页</li><li>会出现在历史、日志里，<b>别放秘密</b></li></ul></div><div class="r"><h4>请求体：放在 body 里</h4><ul><li>创建、修改时要提交的内容（JSON）</li><li>容量大，不显示在网址里</li><li>只有 POST / PUT / PATCH 有体</li></ul></div></div><ul><li><b>路径参数</b> 说“是谁”；<b>查询参数</b> 说“怎么筛、怎么排”；<b>请求体</b> 说“内容是什么”；<b>请求头</b> 说“我是谁、什么格式”。</li><li>Express 里分别是 <code>req.params.id</code>、<code>req.query.page</code>、<code>req.body</code>、<code>req.headers.authorization</code>。</li><li>常见的体格式：<code>application/json</code>（接口最常用）、<code>application/x-www-form-urlencoded</code>（传统表单）、<code>multipart/form-data</code>（上传文件）。</li></ul><p class="one">四个位置各有用途，别把秘密放进网址。</p></section><section class="card"><h3><span class="n">5</span>状态码：看第一位就知道谁的问题</h3><div class="scroll"><table class="tb"><tr><th>开头</th><th>意思</th><th>常见</th></tr><tr><td>1xx</td><td>处理中</td><td>101 切换协议（WebSocket）</td></tr><tr><td>2xx</td><td><span class='ok'>成功</span></td><td>200 好 · 201 已创建 · 204 成功但没有内容</td></tr><tr><td>3xx</td><td>去别处看 / 用缓存</td><td>301 永久跳转 · 302 临时跳转 · 304 没变化，用你缓存的</td></tr><tr><td>4xx</td><td><span class='no'>请求有问题（前端）</span></td><td>400 格式错 · 401 没登录/过期 · 403 没权限 · 404 没这个 · 409 冲突（如重复收藏）· 429 请求太频繁</td></tr><tr><td>5xx</td><td><span class='no'>服务器出问题（后端）</span></td><td>500 代码/数据库出错 · 502/504 上游没响应 · 503 暂时不可用</td></tr></table></div><ul><li>不用背数字：<b>4 查前端发的东西，5 查后端日志</b>。</li><li><b>401 和 403 的区别</b>：401 = 我不知道你是谁（没登录）；403 = 我知道你是谁，但你不能这样做。</li></ul><p class="one">看第一位，决定去哪找问题。</p></section><section class="card"><h3><span class="n">6</span>常见的头，分门别类</h3><div class="scroll"><table class="tb"><tr><th>头</th><th>方向</th><th>作用</th></tr><tr><td>Host</td><td>请求</td><td>访问哪个域名</td></tr><tr><td>Authorization</td><td>请求</td><td>身份凭证：<code>Bearer token</code></td></tr><tr><td>Content-Type</td><td>双向</td><td>体的格式</td></tr><tr><td>Accept</td><td>请求</td><td>我希望收到什么格式</td></tr><tr><td>User-Agent</td><td>请求</td><td>浏览器 / 系统是谁</td></tr><tr><td>Origin / Referer</td><td>请求</td><td>从哪个网站发起 / 从哪个页面点来的</td></tr><tr><td>Cookie / Set-Cookie</td><td>请求 / 响应</td><td>浏览器自动带的小数据 / 服务器要求保存的</td></tr><tr><td>Cache-Control</td><td>响应</td><td>能缓存多久</td></tr><tr><td>ETag / If-None-Match</td><td>响应 / 请求</td><td>内容指纹，没变就返回 304</td></tr><tr><td>Access-Control-Allow-*</td><td>响应</td><td>CORS 许可</td></tr></table></div><ul><li>头是<b>元信息</b>：描述这次通信，不是业务数据。</li><li>token 放头里：不进历史记录、不进分享链接、每个接口统一读取。</li></ul><p class="one">业务数据放体，身份和格式放头。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">7</span>缓存：为什么“改了却没变”</h3><svg viewBox="0 0 640 344" role="img" aria-label="时序图：浏览器 / 服务器"><g class="wob"><rect class="s fb" x="16.0" y="12" width="298.0" height="40" rx="9"/><path d="M165.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="326.0" y="12" width="298.0" height="40" rx="9"/><path d="M475.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M168.0 86.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 136.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 186.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 236.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="165.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="475.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">服务器</text><text x="320.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 GET /app.js</text><text x="320.0" y="101" text-anchor="middle" class="cap" style="font-size:9.5px">第一次，什么都没有</text><text x="320.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 200 + 内容 + ETag: "v276"</text><text x="320.0" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">浏览器存一份</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 GET /app.js  If-None-Match: "v276"</text><text x="320.0" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">再次访问，带上指纹问问</text><text x="320.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 304 没变化</text><text x="320.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">不传内容，省流量，用本地的</text><rect class="s fy" x="77.3" y="268.0" width="175.3" height="30" rx="7" style="stroke-width:1.8"/><text x="165.0" y="288" text-anchor="middle" class="zh" style="font-size:11.5px">强制刷新 = 无视缓存，重新要</text></svg><ul><li><b>强缓存</b>（<code>Cache-Control: max-age=…</code>）：期限内根本不发请求，直接用本地的。<b>协商缓存</b>（ETag）：发请求问“变了吗”，没变就 304。</li><li>我们的页面有 <b>VER 版本号</b>：刷新后看版本号对不对，就知道拿到的是新页面还是旧缓存。</li><li>强制刷新：Mac <code>⌘ + ⇧ + R</code>；开发者工具 Network 勾选 <b>Disable cache</b> 开发时很有用。</li><li><b>Service Worker</b> 是页面自己装的“缓存管家”，我们的离线语音包就是靠它。它缓存太积极时，需要在 Application 里 Unregister 才能看到新版。</li></ul><p class="one">缓存让网站快，也是“明明改了却没变”的头号原因。</p></section><section class="card full"><h3><span class="n">8</span>CORS：浏览器替用户把的关</h3><svg viewBox="0 0 640 412" role="img" aria-label="时序图：ielts 站的 JS / 浏览器 / 后端"><g class="wob"><rect class="s fb" x="16.0" y="12" width="194.7" height="40" rx="9"/><path d="M113.3 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="222.7" y="12" width="194.7" height="40" rx="9"/><path d="M320.0 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="429.3" y="12" width="194.7" height="40" rx="9"/><path d="M526.7 52 V386" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M116.3 86.0 H315.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M323.0 136.0 H521.7" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 186.0 H325.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M323.0 236.0 H521.7" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 286.0 H325.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M317.0 336.0 H118.3" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="113.3" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">ielts 站的 JS</text><text x="113.3" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">ielts.goenkon.com</text><text x="320.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="526.7" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">后端</text><text x="526.7" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">vercel.app</text><text x="216.7" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 我要 DELETE 后端的数据</text><text x="423.3" y="128" text-anchor="middle" class="zh" style="font-size:9.8px">2 OPTIONS 预检：这个站点能 DELETE 吗？</text><text x="423.3" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">Origin: ielts.goenkon.com</text><text x="423.3" y="178" text-anchor="middle" class="zh" style="font-size:9.9px">3 允许：Allow-Origin / Allow-Methods</text><text x="423.3" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">白名单里有它</text><text x="423.3" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 真正的 DELETE 请求</text><text x="423.3" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 200 + 数据 + Allow-Origin 头</text><text x="216.7" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 头里有许可 → 让 JS 读到结果</text><text x="216.7" y="351" text-anchor="middle" class="cap" style="font-size:9.5px">没有许可 → 红字 CORS 报错</text><text x="10" y="406" class="cap">拦截发生在浏览器，而不是后端；后端其实收到了请求</text></svg><ul><li><b>同源</b> = 协议 + 域名 + 端口都相同。浏览器默认不让 A 站的 JS 读 B 站的响应：防止恶意网站借你的登录状态偷数据。</li><li>后端通过响应头 <code>Access-Control-Allow-Origin</code> 声明<b>允许哪些网站</b>。我们后端把 ielts、jlpt、localhost 加进了白名单。</li><li>带 <code>Authorization</code>、JSON、或 DELETE/PATCH 的请求是“非简单请求”，浏览器会先发一次 <b>OPTIONS 预检</b>。</li><li><b>CORS 只管浏览器</b>：curl、Postman 不受它限制。所以“curl 通、网页不通”基本就是 CORS。</li></ul><p class="one">CORS 红字报错 = 后端的白名单没有这个网站。</p></section></div></section><section class="panel" id="p-url" aria-label="地址栏与路由"><h2>地址栏与路由</h2><p class="sec">为什么有的东西显示在网址里、有的不显示；单页应用怎么“换页面”。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>一个网址的六个部分</h3><div class="urlb"><span>https://<i>协议</i></span><span>jlpt.goenkon.com<i>域名</i></span><span>:443<i>端口(可省略)</i></span><span>/api/favorites<i>路径</i></span><span>?page=2&amp;site=jlpt<i>查询</i></span><span>#/fav<i>hash</i></span></div><p class="lab">服务器看得到前五个，<b>看不到 # 后面的</b>。</p><ul><li><b>路径</b>：要哪个资源。<b>查询</b>（? 后面，<code>key=value</code>，用 <code>&amp;</code> 连）：附加条件，如页码、搜索词。</li><li><b>hash</b>（# 后面）只存在于浏览器，<b>不会发给服务器</b>。改它不会刷新页面，只触发 <code>hashchange</code> 事件。日语站的 <code>#/fav</code> 就靠这个切换页面。</li><li>中文、空格、特殊符号放进网址会被编码成百分号形式：<code>语</code> → <code>%E8%AF%AD</code>，空格 → <code>%20</code>。JS 里用 <code>encodeURIComponent()</code> 编码。</li></ul><p class="one"># 之后的东西，服务器永远不知道。</p></section><section class="card full"><h3><span class="n">2</span>为什么点删除，网址里却看不到 id</h3><svg viewBox="0 0 640 362" role="img" aria-label="时序图：页面按钮 / JS (Vue) / 网络 / 地址栏"><g class="wob"><rect class="s fb" x="16.0" y="12" width="143.0" height="40" rx="9"/><path d="M87.5 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="171.0" y="12" width="143.0" height="40" rx="9"/><path d="M242.5 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fr" x="326.0" y="12" width="143.0" height="40" rx="9"/><path d="M397.5 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fk" x="481.0" y="12" width="143.0" height="40" rx="9"/><path d="M552.5 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M90.5 86.0 H237.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M245.5 186.0 H392.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M394.5 236.0 H247.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M245.5 286.0 H547.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="87.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">页面按钮</text><text x="242.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">JS (Vue)</text><text x="397.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">网络</text><text x="397.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">后台通信</text><text x="552.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">地址栏</text><text x="165.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 点“取消收藏”</text><rect class="s fy" x="147.2" y="118.0" width="190.5" height="30" rx="7" style="stroke-width:1.8"/><text x="242.5" y="138" text-anchor="middle" class="zh" style="font-size:11.5px">先把页面上这条去掉（乐观更新）</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:9.2px">3 fetch DELETE /favorites/42</text><text x="320.0" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">id 在请求里，不在地址栏</text><text x="320.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 200 成功</text><text x="397.5" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 （什么都没发生）</text><text x="397.5" y="301" text-anchor="middle" class="cap" style="font-size:9.5px">地址栏一直是 jlpt.goenkon.com/#/fav</text><text x="10" y="356" class="cap">地址栏只在“导航”时才会变，fetch 是后台通信，不是导航</text></svg><ul><li><b>地址栏 = 当前页面的地址</b>。只在你点链接、输入网址、改 hash 或用 History API 时才变。</li><li><code>DELETE /favorites/42</code> 是页面里的 JS 用 <code>fetch</code> 在<b>后台</b>发的，那个网址是<b>请求的目标</b>，不是<b>页面的地址</b>。</li><li>这就是现代前端（<b>SPA 单页应用</b>）：页面只加载一次，之后只在后台和服务器交换数据，用 JS 局部更新。老式网站每次点击都整页跳转、网址一定变。</li><li>想看到这些后台请求：开发者工具 Network。</li></ul><p class="one">地址栏显示“我在哪个页面”，Network 显示“页面在后台和谁说话”。</p></section><section class="card"><h3><span class="n">3</span>两种“换页面”：变量切换 vs 路由</h3><div class="cmp"><div class="l"><h4>变量切换（英语站）</h4><ul><li><code>view = 'fav'</code>，v-if 显示对应块</li><li>地址栏不变</li><li>刷新回到首页、不能分享链接、后退键不回上一块</li></ul></div><div class="r"><h4>路由（日语站 #/fav）</h4><ul><li>hash（或路径）和页面绑定</li><li>地址栏跟着变</li><li>刷新还在、能发链接、后退键有效</li></ul></div></div><ul><li>变量切换改的只是 Vue 里的一个变量，浏览器根本不知道“页面换了”。</li><li>想让它们联动：监听 <code>hashchange</code>，根据 hash 设置 view；换页时 <code>location.hash = '#/fav'</code>。</li><li><b>动态路由</b>：<code>#/word/accommodation</code> 里的最后一段是参数，前端读出来再去后端要这个词的数据。后端对应写法 <code>/favorites/:id</code>。</li></ul><p class="one">想要刷新不丢、能分享，就得让地址栏参与进来。</p></section><section class="card"><h3><span class="n">4</span>hash 路由 vs history 路由</h3><svg viewBox="0 0 640 294" role="img" aria-label="时序图：浏览器 / 服务器"><g class="wob"><rect class="s fb" x="16.0" y="12" width="298.0" height="40" rx="9"/><path d="M165.0 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="326.0" y="12" width="298.0" height="40" rx="9"/><path d="M475.0 52 V286" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M168.0 86.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 136.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M168.0 186.0 H470.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M472.0 236.0 H170.0" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="165.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">浏览器</text><text x="475.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">服务器</text><text x="475.0" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">只有 index.html</text><text x="320.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 hash：GET /   （#/fav 不会发出去）</text><text x="320.0" y="128" text-anchor="middle" class="zh" style="font-size:11.5px">2 index.html，JS 看 hash 显示收藏页</text><text x="320.0" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 history：刷新 GET /fav</text><text x="320.0" y="201" text-anchor="middle" class="cap" style="font-size:9.5px">服务器上根本没有 /fav 这个文件</text><text x="320.0" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 404</text><text x="320.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">要配置“所有路径都回 index.html”</text></svg><ul><li><b>hash</b>：纯静态网站最省心，刷新不会 404。<b>history</b>：网址好看（<code>/fav</code>），做 SEO 有利，但要在服务器配置“找不到文件就回 index.html”。</li><li>Vercel 可以在 <code>vercel.json</code> 里写 rewrites 做这件事；Next.js / Nuxt 自动处理。</li></ul><p class="one">小站用 hash，大站用 history。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">5</span>信息放哪里：七个地方一张表</h3><div class="scroll"><table class="tb"><tr><th>放哪里</th><th>刷新还在？</th><th>能发给别人？</th><th>服务器看得到？</th><th>我们的例子</th></tr><tr><td>路径 <code>/favorites/42</code></td><td>是</td><td>是</td><td>是</td><td>操作哪一条</td></tr><tr><td>查询 <code>?page=2</code></td><td>是</td><td>是</td><td>是</td><td>页码、筛选（可以放）</td></tr><tr><td>hash <code>#/fav</code></td><td>是</td><td>是</td><td><b class='no'>否</b></td><td>日语站切页面</td></tr><tr><td>请求体 body</td><td>否</td><td>否</td><td>是</td><td>收藏的单词内容</td></tr><tr><td>请求头 header</td><td>否</td><td>否</td><td>是</td><td><code>Authorization</code></td></tr><tr><td>localStorage</td><td>是</td><td>否</td><td>否（要手动带）</td><td><code>ielts_token</code></td></tr><tr><td>Vue 变量（内存）</td><td><b class='no'>否</b></td><td>否</td><td>否</td><td>当前页码、弹窗开关</td></tr></table></div><ul><li>选位置时问三个问题：<b>刷新后要保留吗？要发链接给别人吗？服务器要知道吗？</b></li><li><b>秘密不能放网址里</b>：网址会进历史记录、书签、服务器日志、聊天记录。</li><li>收藏页的页码现在在内存里，所以刷新回第 1 页；想保留，可以放进 hash（<code>#/fav?p=2</code>）或 localStorage。</li></ul><p class="one">不显示在网址里的东西，是故意放在别处的。</p></section></div></section><section class="panel" id="p-browser" aria-label="浏览器"><h2>浏览器</h2><p class="sec">浏览器怎么把代码变成画面，能存什么，怎么调试，网页安全的第一课。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>从 HTML 到屏幕：浏览器的渲染流水线</h3><svg viewBox="0 0 640 136" role="img" aria-label="HTML → DOM 树 → 样式计算 → 布局 → 绘制"><g class="wob"><rect class="s fb" x="10.0" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M115.2 55 h20" marker-end="url(#ah)"/><rect class="s fy" x="139.2" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M244.4 55 h20" marker-end="url(#ah)"/><rect class="s fg" x="268.4" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M373.6 55 h20" marker-end="url(#ah)"/><rect class="s fp" x="397.6" y="20" width="103.2" height="70" rx="9"/><path class="s" d="M502.8 55 h20" marker-end="url(#ah)"/><rect class="s fr" x="526.8" y="20" width="103.2" height="70" rx="9"/></g><g><text x="61.6" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">HTML</text><text x="61.6" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">文字</text></g><g><text x="190.8" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">DOM 树</text><text x="190.8" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">元素的结构</text></g><g><text x="320.0" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">样式计算</text><text x="320.0" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">CSS 对上号</text></g><g><text x="449.2" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">布局</text><text x="449.2" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">算位置大小</text></g><g><text x="578.4" y="46" text-anchor="middle" class="zh" style="font-size:14.0px">绘制</text><text x="578.4" y="64" text-anchor="middle" class="zh" style="font-size:11.0px" fill-opacity=".85">画到屏幕</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L622,108"/></circle><text x="10" y="128" class="cap">JS 改了 DOM 或样式，这条流水线会重新走一部分</text></svg><ul><li>浏览器把 HTML 文字解析成<b>DOM 树</b>，CSS 解析成样式规则，两者合并算出每个元素的位置、大小，最后画出来。</li><li><b>改布局的操作（宽高、位置）比只改颜色更贵</b>，因为要重新排版。大量元素频繁改动会卡。</li><li><b>Vue 为什么快</b>：数据变了，它算出“哪几个元素需要改”，只动那一小部分 DOM，而不是整页重画。</li><li><code>script</code> 默认会<b>阻塞</b>解析，所以常放页面末尾，或加 <code>defer</code>。</li></ul><p class="one">页面 = HTML 结构 + CSS 样式 + JS 行为，浏览器把三者合成屏幕上的画面。</p></section><section class="card full"><h3><span class="n">2</span>浏览器里能存东西的地方</h3><div class="scroll"><table class="tb"><tr><th>名字</th><th>存多久</th><th>容量</th><th>自动发给服务器？</th><th>典型用途</th></tr><tr><td>内存（JS 变量）</td><td>刷新就没</td><td>—</td><td>否</td><td>页面当前状态</td></tr><tr><td>sessionStorage</td><td>关掉标签页</td><td>约 5MB</td><td>否</td><td>一次性临时数据</td></tr><tr><td>localStorage</td><td>一直在</td><td>约 5MB</td><td>否</td><td><b>token</b>、主题、偏好</td></tr><tr><td>Cookie</td><td>按过期时间</td><td>约 4KB</td><td><b class='ok'>是，每个请求自动带</b></td><td>传统登录会话</td></tr><tr><td>IndexedDB / Cache</td><td>一直在</td><td>大</td><td>否</td><td>离线语音包</td></tr></table></div><ul><li><b>同源才能读</b>：ielts.goenkon.com 读不到 jlpt.goenkon.com 的 localStorage，所以两个站 token 名字分开，互不影响。</li><li>localStorage 里的东西，页面上任何 JS 都能读：一旦网站被注入恶意脚本（XSS），token 会被偷。</li></ul><p class="one">能存多久、会不会自动发给服务器，是区分它们的两条线。</p></section><section class="card"><h3><span class="n">3</span>开发者工具：五个标签各看什么</h3><div class="scroll"><table class="tb"><tr><th>标签</th><th>看什么</th><th>什么时候用</th></tr><tr><td>Elements</td><td>当前的 HTML 和 CSS，可以直接改着试</td><td>样式不对、元素没出来</td></tr><tr><td>Console</td><td>报错和 console.log 输出，也能直接敲 JS</td><td>页面空白、点了报错</td></tr><tr><td>Network</td><td>每一个请求的头、体、状态码、耗时</td><td>接口失败、慢、CORS</td></tr><tr><td>Application</td><td>localStorage、Cookie、Service Worker、缓存</td><td>登录丢了、旧版缓存</td></tr><tr><td>Sources</td><td>打断点一步步执行代码</td><td>逻辑不对但不报错</td></tr></table></div><ul><li>打开：<code>⌘ + ⌥ + I</code>。手机上的网页可以用 Mac 的 Safari 连接 iPhone 来调试。</li><li><b>排错顺序</b>：Console 有没有红字 → Network 请求发了没、状态码 → Application 数据在不在。</li></ul><p class="one">出了问题，先打开它。</p></section><section class="card full"><h3><span class="n">4</span>XSS：别把用户输入当 HTML</h3><svg viewBox="0 0 640 344" role="img" aria-label="时序图：攻击者 / 你的网站 / 别的用户"><g class="wob"><rect class="s fr" x="16.0" y="12" width="194.7" height="40" rx="9"/><path d="M113.3 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="222.7" y="12" width="194.7" height="40" rx="9"/><path d="M320.0 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fb" x="429.3" y="12" width="194.7" height="40" rx="9"/><path d="M526.7 52 V336" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M116.3 86.0 H315.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 186.0 H325.0" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M323.0 236.0 H521.7" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M523.7 286.0 H118.3" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="113.3" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">攻击者</text><text x="320.0" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你的网站</text><text x="526.7" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">别的用户</text><text x="216.7" y="78" text-anchor="middle" class="zh" style="font-size:9.8px">1 评论里写 &lt;script&gt;偷token()&lt;/script&gt;</text><rect class="s fy" x="247.8" y="118.0" width="144.5" height="30" rx="7" style="stroke-width:1.8"/><text x="320.0" y="138" text-anchor="middle" class="zh" style="font-size:11.5px">没处理，原样存进数据库</text><text x="320.0" y="158" text-anchor="middle" class="cap" style="font-size:9.5px">错误做法</text><text x="423.3" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 打开评论页</text><text x="423.3" y="228" text-anchor="middle" class="zh" style="font-size:11.5px">4 页面把评论当 HTML 渲染</text><text x="423.3" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">恶意脚本在用户浏览器里运行</text><text x="320.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 token 被发到攻击者那里</text></svg><ul><li><b>跨站脚本（XSS）</b>：恶意脚本借网站之手跑进别人的浏览器，能读 localStorage、冒充用户操作。</li><li>防法：<b>默认把用户内容当文字，不当 HTML</b>。Vue 的 <code>{{ }}</code> 会自动转义，是安全的；<code>v-html</code> 会按 HTML 渲染，<b>只能用于自己信任的内容</b>。</li><li>我们站的单词、例句来自自己的词库，可控；将来做评论、笔记这类用户输入的功能时要特别小心。</li></ul><p class="one">显示用户内容时，用 {{ }}，慎用 v-html。</p></section></div></section><section class="panel" id="p-security" aria-label="登录与安全"><h2>登录与安全</h2><p class="sec">登录链路、token、越权、注入、密码，以及一份上线检查清单。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>Google 登录这一整条链，谁在和谁说话</h3><svg viewBox="0 0 680 462" role="img" aria-label="时序图：你 / Google / 我们的后端 / 数据库"><g class="wob"><rect class="s fb" x="16.0" y="12" width="153.0" height="40" rx="9"/><path d="M92.5 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fy" x="181.0" y="12" width="153.0" height="40" rx="9"/><path d="M257.5 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fg" x="346.0" y="12" width="153.0" height="40" rx="9"/><path d="M422.5 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><rect class="s fp" x="511.0" y="12" width="153.0" height="40" rx="9"/><path d="M587.5 52 V436" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 6" fill="none"/><path class="s" d="M95.5 86.0 H252.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M254.5 136.0 H97.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M95.5 186.0 H417.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M419.5 236.0 H262.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M425.5 286.0 H582.5" marker-end="url(#ah)" style="stroke-width:2.2"/><path class="s" d="M419.5 336.0 H97.5" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2.2"/></g><text x="92.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">你</text><text x="92.5" y="45" text-anchor="middle" class="cap" style="font-size:9.5px">浏览器</text><text x="257.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">Google</text><text x="422.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">我们的后端</text><text x="587.5" y="30" text-anchor="middle" class="zh" style="font-size:12.5px">数据库</text><text x="175.0" y="78" text-anchor="middle" class="zh" style="font-size:11.5px">1 点“用 Google 登录”</text><text x="175.0" y="128" text-anchor="middle" class="zh" style="font-size:10.4px">2 确认是你本人 → 发 ID Token</text><text x="175.0" y="151" text-anchor="middle" class="cap" style="font-size:9.5px">一张 Google 签名的证明书</text><text x="257.5" y="178" text-anchor="middle" class="zh" style="font-size:11.5px">3 POST /auth/google  {idToken}</text><text x="340.0" y="228" text-anchor="middle" class="zh" style="font-size:10.6px">4 验证签名（用 Google 公钥）</text><text x="340.0" y="251" text-anchor="middle" class="cap" style="font-size:9.5px">确认真的是 Google 发的</text><text x="505.0" y="278" text-anchor="middle" class="zh" style="font-size:11.5px">5 按邮箱找用户，没有就创建</text><text x="257.5" y="328" text-anchor="middle" class="zh" style="font-size:11.5px">6 我们自己的 token（jose 签名）</text><text x="257.5" y="351" text-anchor="middle" class="cap" style="font-size:9.5px">有效期 + 用户编号</text><rect class="s fy" x="6.0" y="368.0" width="228.2" height="30" rx="7" style="stroke-width:1.8"/><text x="120.1" y="388" text-anchor="middle" class="zh" style="font-size:11.5px">存进 localStorage，之后每个请求带上</text><text x="10" y="456" class="cap">Google 只负责证明“你是谁”，之后的登录状态由我们自己的 token 管</text></svg><ul><li>为什么不让前端直接说“我是 a@x.com”？因为前端的话<b>不可信</b>，任何人都能改。所以要拿“Google 签了名的证明”给后端验。</li><li>后端验证通过后，签发<b>自己的 token</b>：以后每个请求带着它，不用每次去问 Google。</li><li>刷新页面时，前端从 localStorage 读出 token，请求 <code>/me</code> 确认“我是谁”，从而恢复登录。token 过期或被改过，后端返回 401，前端清掉它并要求重新登录。</li></ul><p class="one">身份永远来自后端验过的 token，不来自前端自己报的名字。</p></section><section class="card"><h3><span class="n">2</span>JWT：一张盖了章的通行证</h3><pre class="term"><span class="b">eyJhbGciOiJIUzI1NiJ9</span>.<span class="k">eyJzdWIiOiI3IiwiZXhwIjoxNzMwfQ</span>.<span class="e">x9fK2m...</span>

头部：{"alg":"HS256"}                  <span class="c">用什么算法签名</span>
载荷：{"sub":"7","exp":1730000000}     <span class="c">7 号用户，到期时间</span>
签名：用只有后端知道的 <span class="e">JWT_SECRET</span> 算出来</pre><ul><li>三段用点连成：头部、载荷、签名。载荷<b>只是编码，不是加密</b>，谁都能解开看，所以<b>别往里放密码、手机号</b>。</li><li><b>签名</b>防篡改：有人改了载荷，签名就对不上，后端一验就知道是假的。</li><li>后端<b>不用查数据库</b>就能确认“这是我发的、没被改、没过期”，这叫<b>无状态</b>，很适合 serverless。</li><li><b>JWT_SECRET 泄露 = 任何人都能伪造任意用户的 token</b>：只放环境变量，绝不提交。</li></ul><p class="one">token 里的内容谁都看得到，但谁都改不了。</p></section><section class="card"><h3><span class="n">3</span>Session / Cookie 与 JWT 对比</h3><div class="scroll"><table class="tb"><tr><th></th><th>Session + Cookie</th><th>JWT + Authorization 头</th></tr><tr><td>谁记住你</td><td><b>服务器</b>存一份会话</td><td><b>token 自己</b>带着信息</td></tr><tr><td>浏览器存</td><td>Cookie，自动带</td><td>localStorage，JS 手动带</td></tr><tr><td>能否立刻让某人下线</td><td>能，删会话就行</td><td>难，要等过期（或维护黑名单）</td></tr><tr><td>多台服务器</td><td>要共享会话存储</td><td>天然适合</td></tr><tr><td>常见风险</td><td>CSRF（跨站伪造请求）</td><td>XSS（脚本偷 token）</td></tr></table></div><ul><li>没有哪种“更好”，是取舍。我们用 JWT，因为后端是 serverless，不方便存会话。</li></ul><p class="one">取舍：谁来记住“你已登录”。</p></section></div><div class="grid"><section class="card full"><h3><span class="n">4</span>IDOR：改个 id 就能删别人的东西？</h3><div class="cmp"><div class="l"><h4>只按 id 删（危险）</h4><ul><li>DELETE FROM favorite_word WHERE id = 42</li><li>任何登录用户把 42 改成别人的编号，就删掉别人的</li><li>这是最常见的越权漏洞</li></ul></div><div class="r"><h4>id + 用户一起判断（我们）</h4><ul><li>WHERE id = 42 <b>AND user_id = 当前登录用户</b></li><li>user_id 来自后端验证过的 token，不是前端传的</li><li>别人的记录条件不成立，一行也不会删</li></ul></div></div><ul><li>原则：<b>前端传来的任何东西都不可信</b>，包括 id、价格、用户名。谁在操作，只认 token 里验过的那个。</li><li>所以后端从 <code>req.user.id</code>（token 验出来的）取用户，而不是从请求体里读 <code>userId</code>。</li></ul><p class="one">每条数据都要问：这个人有权碰它吗？</p></section><section class="card"><h3><span class="n">5</span>SQL 注入：别拼接 SQL</h3><pre class="term"><span class="e">✘ 危险：把用户输入拼进语句</span>
<span class="c">const sql = "SELECT * FROM users WHERE name = '" + name + "'"</span>
<span class="c">name = ' OR '1'='1   →  变成 WHERE name='' OR '1'='1'  → 全部返回！</span>

<span class="p">✔ 安全：参数化，输入永远只是“数据”</span>
<span class="c">db.select().from(users).where(eq(users.name, name))   // Drizzle</span>
<span class="c">pool.query('SELECT * FROM users WHERE name = $1', [name])</span></pre><ul><li>把用户输入直接拼进 SQL，攻击者就能让数据库执行他写的语句。</li><li><b>参数化查询 / ORM</b>：SQL 模板和数据分开发送，数据库永远把输入当“值”而不是“命令”。我们用 Drizzle，天然避免了这个问题。</li></ul><p class="one">永远别手工拼 SQL 字符串。</p></section><section class="card"><h3><span class="n">6</span>密码为什么要“哈希 + 加盐”</h3><svg viewBox="0 0 480 136" role="img" aria-label="密码 abc123 → 加盐 → 哈希 bcrypt → 存哈希值"><g class="wob"><rect class="s fb" x="10.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M112.0 55 h14" marker-end="url(#ah)"/><rect class="s fy" x="130.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M232.0 55 h14" marker-end="url(#ah)"/><rect class="s fg" x="250.0" y="20" width="100.0" height="70" rx="9"/><path class="s" d="M352.0 55 h14" marker-end="url(#ah)"/><rect class="s fp" x="370.0" y="20" width="100.0" height="70" rx="9"/></g><g><text x="60.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">密码 abc123</text><text x="60.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">用户输入</text></g><g><text x="180.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">加盐</text><text x="180.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">+ 随机字符串</text></g><g><text x="300.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">哈希 bcrypt</text><text x="300.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">单向不可逆</text></g><g><text x="420.0" y="46" text-anchor="middle" class="zh" style="font-size:12.5px">存哈希值</text><text x="420.0" y="64" text-anchor="middle" class="zh" style="font-size:10.0px" fill-opacity=".85">不存原文</text></g><circle r="5" class="fr" stroke="var(--ink)" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M18,108 L462,108"/></circle><text x="10" y="128" class="cap">我们用 Google 登录，所以数据库里压根没有密码，这是它的好处</text></svg><ul><li><b>哈希</b>是单向函数：原文能算出哈希，哈希算不回原文。登录时把输入再哈希一遍，和库里的比。</li><li><b>加盐</b>：每个人加一段随机字符串，防止“相同密码得到相同哈希”和彩虹表攻击。</li><li><b>绝不明文存密码</b>。数据库泄露时，哈希过的密码至少不能直接用。</li><li>用别人的登录（Google）的好处：不用自己管密码。</li></ul><p class="one">存哈希，不存密码。</p></section><section class="card full"><h3><span class="n">7</span>上线前的安全小清单</h3><div class="scroll"><table class="tb"><tr><th>检查项</th><th>我们的做法</th></tr><tr><td>密钥 / 连接串不在代码里</td><td>环境变量，.env 在 .gitignore</td></tr><tr><td>全程 https</td><td>Vercel 自动签发证书</td></tr><tr><td>验证每一个输入</td><td>后端白名单校验 kind、site</td></tr><tr><td>只信 token 里的身份</td><td>WHERE id=? AND user_id=?</td></tr><tr><td>CORS 只放自己的站</td><td>白名单：ielts / jlpt / localhost</td></tr><tr><td>错误信息不暴露内部细节</td><td>只回通用信息，细节写进日志</td></tr><tr><td>依赖及时更新</td><td><code>npm audit</code> 看已知漏洞</td></tr><tr><td>限流</td><td>防刷接口（可以后续加）</td></tr></table></div><ul><li>安全不是一个功能，是每一步的习惯：<b>不信前端、不存明文、不泄密钥、最小权限</b>。</li></ul><p class="one">把这八条放进每个项目的收尾检查里。</p></section></div></section><section class="panel" id="p-backend" aria-label="后端"><h2>后端</h2><p class="sec">后端怎么组织：请求流水线、分层、serverless、接口设计、日志。</p><div class="grid"><section class="card full"><h3><span class="n">1</span>后端到底在做什么：一个请求穿过哪些关卡</h3><svg viewBox="0 0 520 178" role="img" aria-label="中间件管线"><g class="wob"><rect class="s fb" x="10" y="40" width="70" height="60" rx="9"/><rect class="s fy" x="105" y="40" width="80" height="60" rx="9"/><rect class="s fy" x="205" y="40" width="80" height="60" rx="9"/><rect class="s fg" x="305" y="40" width="80" height="60" rx="9"/><rect class="s fp" x="405" y="40" width="100" height="60" rx="9"/><path class="s" d="M82 70 L103 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M187 70 L203 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M287 70 L303 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M387 70 L403 70" marker-end="url(#ah)" style="stroke-width:2"/><path class="s" d="M455 102 Q330 150 200 130" stroke-dasharray="7 5" marker-end="url(#ah)" style="stroke-width:2"/></g><text x="45" y="66" text-anchor="middle" class="zh" style="font-size:12.0px">请求</text><text x="45" y="82" text-anchor="middle" class="zh" style="font-size:11.0px">进来</text><text x="145" y="62" text-anchor="middle" class="zh" style="font-size:12.0px">CORS</text><text x="145" y="78" text-anchor="middle" class="zh" style="font-size:10.5px">中间件</text><text x="245" y="62" text-anchor="middle" class="zh" style="font-size:11.0px">解析 JSON</text><text x="245" y="78" text-anchor="middle" class="zh" style="font-size:10.5px">中间件</text><text x="345" y="62" text-anchor="middle" class="zh" style="font-size:11.0px">验证 token</text><text x="345" y="78" text-anchor="middle" class="zh" style="font-size:10.5px">中间件</text><text x="455" y="60" text-anchor="middle" class="zh" style="font-size:12.0px">路由处理</text><text x="455" y="76" text-anchor="middle" class="zh" style="font-size:10.5px">查库、写库</text><text x="455" y="90" text-anchor="middle" class="zh" style="font-size:10.5px">返回响应</text><text x="10" y="26" class="cap">Express：请求依次通过一串“中间件”，每一个检查或加工，最后到路由处理函数</text><text x="10" y="168" class="cap">任何一关出错就直接返回错误（如 token 无效 → 401），后面的关卡不再执行</text></svg><ul><li><b>路由</b>：“什么方法 + 什么路径 → 执行哪段代码”。如 <code>POST /favorites</code> 对应“新增收藏”。</li><li><b>中间件</b>：夹在请求和处理函数之间的小关卡，共同点是能读写 <code>req</code>/<code>res</code>，最后调用 <code>next()</code> 放行。常见：CORS、解析 JSON 体、验 token、日志。</li><li><b>统一的好处</b>：验 token 只写一次，所有需要登录的路由都套上它。</li><li><b>统一的错误出口</b>：任何地方抛错，都由最后一个“错误处理中间件”转成规整的 JSON 响应，不让内部细节漏给用户。</li></ul><p class="one">请求像过安检：一道一道关，错了就拦下。</p></section><section class="card"><h3><span class="n">2</span>后端分层：每层只管一件事</h3><svg viewBox="0 0 640 272" role="img" aria-label="分层：路由 routes / 校验 / 业务 / 数据访问 / 数据库"><g class="wob"><rect class="s fb" x="10" y="8" width="347.2" height="52" rx="9"/><rect class="s fy" x="10" y="68" width="347.2" height="52" rx="9"/><rect class="s fg" x="10" y="128" width="347.2" height="52" rx="9"/><rect class="s fp" x="10" y="188" width="347.2" height="52" rx="9"/></g><text x="183.6" y="30" text-anchor="middle" class="zh" style="font-size:13.5px">路由 routes</text><text x="183.6" y="48" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">接请求、读参数、回响应</text><path class="s" d="M361.2 34 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="38.0" text-anchor="start" class="zh" style="font-size:11.5px">favorites.ts：哪个网址对应哪段逻辑</text><text x="183.6" y="90" text-anchor="middle" class="zh" style="font-size:13.5px">校验 / 业务</text><text x="183.6" y="108" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">规则：kind 是否合法、能否重复</text><path class="s" d="M361.2 94 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="98.0" text-anchor="start" class="zh" style="font-size:11.5px">白名单 KINDS、去重</text><text x="183.6" y="150" text-anchor="middle" class="zh" style="font-size:13.5px">数据访问</text><text x="183.6" y="168" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">用 ORM 读写表</text><path class="s" d="M361.2 154 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="158.0" text-anchor="start" class="zh" style="font-size:11.5px">Drizzle 的 insert / select</text><text x="183.6" y="210" text-anchor="middle" class="zh" style="font-size:13.5px">数据库</text><text x="183.6" y="228" text-anchor="middle" class="zh" style="font-size:10.5px" fill-opacity=".8">真正存数据</text><path class="s" d="M361.2 214 h16" marker-end="url(#ah)" style="stroke-width:1.8"/><text x="383.2" y="218.0" text-anchor="start" class="zh" style="font-size:11.5px">Neon PostgreSQL</text><text x="10" y="266" class="cap">上层调用下层，下层不知道上层是谁：改数据库不用动路由</text></svg><ul><li>分层让代码好读、好测、好改。比如“收藏的规则变了”只动业务层，不用碰网址和数据库。</li><li>我们的测试（23 个）就是模拟请求，检查从路由到数据库的整条链路对不对。</li></ul><p class="one">路由接客，业务定规矩，数据层存取。</p></section><section class="card full"><h3><span class="n">3</span>常驻服务器 vs Serverless</h3><div class="cmp"><div class="l"><h4>常驻服务器（传统）</h4><ul><li>一台机器一直开着，进程一直活着</li><li>内存里的变量一直在</li><li>不管有没有人用都在计费</li><li>要自己管系统、扩容</li></ul></div><di
