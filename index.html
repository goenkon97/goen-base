<script>
// 从全局 Vue 对象里拿出要用的函数（CDN 版没有 import，所以这样解构）
const { createApp, ref, computed, watch, onMounted, onUnmounted, nextTick } = Vue;

// ===================== 版本号 =====================
// 每次改完准备发布，就改这两行：VERSION 往上加一，UPDATED 写当时的时间。
// 首页左上角 GK 旁边会显示它们，这样打开网站一眼就知道是不是最新版
const VERSION = "v1.3";
const UPDATED = "2026-10-30 21:10";
const { createRouter, createWebHashHistory, createMemoryHistory } = VueRouter;

// 激励语录：按"今年第几天"轮换，每天一句（都是自己写的短句）
const QUOTES = [
  { en: "Small steps still move you forward.", zh: "小步也是在往前走。", jp: "小さな一歩でも前に進んでいる。" },
  { en: "Today's practice is tomorrow's ease.", zh: "今天的练习，是明天的轻松。", jp: "今日の練習が明日の余裕になる。" },
  { en: "Show up first. Motivation comes later.", zh: "先坐下来，动力会随后赶到。", jp: "まず始めよう。やる気は後から来る。" },
  { en: "One word a day is 365 words a year.", zh: "一天一个词，一年就是 365 个。", jp: "一日一語で一年三百六十五語。" },
  { en: "Slow is fine. Stopping is the only loss.", zh: "慢没关系，停下才是真的输。", jp: "遅くてもいい。止まらなければ。" },
  { en: "You are building your own base, brick by brick.", zh: "你在一块砖一块砖地搭自己的基地。", jp: "自分の基地を一つずつ積み上げている。" },
  { en: "Done is better than perfect.", zh: "做完比做完美更重要。", jp: "完璧より、まず完成。" },
];

const WEEK_ZH = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const WEEK_JP = ["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"];
const MONTH_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// 每个入口的数据。以后接后端时，这一段就会变成从接口拿到的 JSON
const MODULES = [
  { id: "ielts", title: "IELTS 雅思学习", short: "IELTS", tagline: "雅思学习", desc: "同义词 · 话题文章 · 英美音", url: "https://ielts.goenkon.com", color: "blue",
    icon: '<rect x="10" y="12" width="38" height="34" rx="4" fill="var(--blue)"/><path d="M29 12 V46"/><path d="M15 20 h9 M15 26 h9 M34 20 h9 M34 26 h6"/>' },
  { id: "jlpt", title: "JLPT 日语学习", short: "JLPT", tagline: "日语学习", desc: "近义词 · 文章 · 语法 · 动词变形", url: "https://jlpt.goenkon.com", color: "pink",
    icon: '<circle cx="29" cy="29" r="18" fill="var(--pink)"/><circle cx="29" cy="29" r="7" fill="var(--red)" stroke="none"/>' },
  { id: "goals", title: "今日小目标", short: "Today", tagline: "今日小目标", desc: "每天几件事，做完打个勾", url: "", color: "mint",
    icon: '<rect x="12" y="10" width="34" height="40" rx="4" fill="var(--mint)"/><path d="M18 22 l3 3 6-6 M18 34 l3 3 6-6 M32 22 h8 M32 34 h8"/>' },
  { id: "backend", title: "后端学习笔记", short: "Backend", tagline: "后端笔记", desc: "图解 · 地图 · 速查 · 思路 · 全记录", url: "", to: "/backend", color: "lilac",
    icon: '<rect x="10" y="14" width="38" height="12" rx="3" fill="var(--lilac)"/><rect x="10" y="32" width="38" height="12" rx="3" fill="var(--lilac)"/><path d="M16 20 h.1 M16 38 h.1 M36 20 h6 M36 38 h6" stroke-width="3"/>' },
];

// ===================== 页面组件 1：首页 =====================
// 一个"组件"就是一个普通对象：template 指向上面的 <template id="tpl-home">，setup 里放数据和方法
const Home = {
  template: "#tpl-home",
  setup() {
    // ---------- 时间 / 日历 ----------
    // now 是一个"响应式"的时间：它一变，所有用到它的 computed 都会自动重新计算
    const now = ref(new Date());
    let timer = null;

    const today = computed(() => {
      const d = now.value;
      const y = d.getFullYear();
      const start = new Date(y, 0, 1);            // 今年 1 月 1 日 0 点
      const startNext = new Date(y + 1, 0, 1);    // 明年 1 月 1 日 0 点
      const msDay = 86400000;                     // 一天的毫秒数
      const dayOfYear = Math.round((new Date(y, d.getMonth(), d.getDate()) - start) / msDay) + 1;
      const total = Math.round((startNext - start) / msDay); // 365 或 366
      return {
        year: y, month: d.getMonth() + 1, day: d.getDate(),
        weekZh: WEEK_ZH[d.getDay()], weekJp: WEEK_JP[d.getDay()], monthEn: MONTH_EN[d.getMonth()],
        dayOfYear, daysLeft: total - dayOfYear,
        yearPct: Math.round((dayOfYear / total) * 100),
        dateKey: `${y}-${d.getMonth()}-${d.getDate()}`,
      };
    });

    const greeting = computed(() => {
      const h = now.value.getHours();
      if (h < 5) return "Still up";
      if (h < 11) return "Good morning";
      if (h < 17) return "Good afternoon";
      return "Good evening";
    });
    const timeText = computed(() =>
      now.value.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }));
    const quote = computed(() => QUOTES[today.value.dayOfYear % QUOTES.length]);

    // ---------- 右侧抽屉 ----------
    const open = ref(false);     // 抽屉开没开
    const dragX = ref(null);     // 手指拖动时，抽屉向右偏移了多少 px；null 表示没在拖
    const drawerEl = ref(null);  // 拿到抽屉的真实 DOM，用来读它的宽度

    // 抽屉的位置：没拖动时只有两种状态（0 = 完全打开，100% = 藏在屏幕右边外面）
    const drawerStyle = computed(() => {
      if (dragX.value !== null) return { transform: `translateX(${dragX.value}px)` };
      return { transform: open.value ? "translateX(0)" : "translateX(calc(100% + 12px))" };
    });

    // 手势思路：
    // 1. 手指按下时记住起点；抽屉关着的话，只有从屏幕右边 32px 内开始才算"拉抽屉"
    // 2. 手指移动时，根据横向位移算出抽屉偏移 dragX，抽屉就跟着手指走
    // 3. 手指松开时，看拉过没过一半宽度，决定是"弹开"还是"缩回去"
    let startX = 0, startY = 0, tracking = false, decided = false, width = 320;

    function onTouchStart(e) {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; decided = false;
      width = drawerEl.value ? drawerEl.value.offsetWidth : 320;
      tracking = open.value || startX > window.innerWidth - 32;
    }
    function onTouchMove(e) {
      if (!tracking) return;
      const t = e.touches[0];
      const dx = t.clientX - startX, dy = t.clientY - startY;
      // 先判断这是横着划还是竖着划：竖着划就当成正常滚动，不管它
      if (!decided) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        decided = true;
        if (Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
      }
      e.preventDefault(); // 横着划：阻止浏览器自带的返回手势 / 滚动
      // 关着时从 width 往 0 拉；开着时从 0 往 width 推。限制在 [0, width] 之间
      const base = open.value ? 0 : width;
      dragX.value = Math.min(width, Math.max(0, base + dx));
    }
    function onTouchEnd() {
      if (dragX.value !== null) open.value = dragX.value < width / 2;
      dragX.value = null; tracking = false;
    }

    // 按 Esc 关闭抽屉
    const onKey = (e) => { if (e.key === "Escape") open.value = false; };

    // 抽屉打开时锁住背后页面的滚动
    watch(open, (v) => { document.body.style.overflow = v ? "hidden" : ""; });

    onMounted(() => {
      timer = setInterval(() => (now.value = new Date()), 30000);
      window.addEventListener("keydown", onKey);
    });
    // 组件卸载时清理定时器和事件监听，避免它们在后台一直占着内存
    // 离开首页（比如点进后端图解）时，组件会被卸载：清掉定时器、事件监听，并恢复页面滚动
    onUnmounted(() => {
      clearInterval(timer);
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    });

    return { today, greeting, timeText, quote, modules: MODULES, version: VERSION, updated: UPDATED,
      open, dragX, drawerEl, drawerStyle, onTouchStart, onTouchMove, onTouchEnd };
  },
};

// ===================== 页面组件 2：后端笔记外壳（分类栏）=====================
// ===================== 后端笔记的分类数据 =====================
// 两大类：基础概念（不看自己的代码，先弄懂后端）/ 项目实战（我自己的收藏后端，按做的先后排）
// 以后加新笔记：在对应组的 notes 里加一行，再写模板、加路由
// level：对我（前端转全栈）的优先级 —— must 必读 / key 重要 / ref 查阅（不用通读，用到再查）
// why：为什么这篇对我重要（显示在目录卡片上）
// keys：这篇里面的重点章节 id（会在章节导航和标题上标 ★）

// ===================== 页面组件 2：后端笔记外壳（顶部栏）=====================
const BackendLayout = {
  template: "#tpl-bk-layout",
  setup() {
    const root = ref(null);
    const route = VueRouter.useRoute();   // 拿到"当前网址"对象，网址一变它就跟着变
    // 当前打开的笔记属于哪一组；在目录页（/backend）时找不到，就是 null
    const group = computed(() => BK_GROUPS.find((g) => g.notes.some((n) => n.to === route.path)) || null);
    // 笔记里原来有自己的小脚本（章节跳转、全部展开/收起），嵌进来以后统一在这里处理：
    // 用"事件委托"——只在最外层监听一次点击，再看点到的是什么
    function onClick(e) {
      // ① 章节导航 <a href="#flow">：不能让它改网址（会被路由当成新页面），改成直接滚动过去
      const a = e.target.closest('.nb a[href^="#"], .bk a[href^="#"]');
      if (a && !a.getAttribute("href").startsWith("#/")) {
        e.preventDefault();
        const el = root.value.querySelector(a.getAttribute("href"));
        if (el) {
          const first = el.querySelector("details");
          if (first) first.open = true;
          el.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        return;
      }
      // ② "全部展开 / 全部收起" 按钮
      const btn = e.target.closest("button");
      if (btn && (btn.id === "openAll" || btn.id === "closeAll")) {
        root.value.querySelectorAll("details").forEach((d) => (d.open = btn.id === "openAll"));
      }
    }
    // 当前这篇笔记的数据（找不到就是 null，比如在目录页）
    const note = computed(() => (group.value ? group.value.notes.find((n) => n.to === route.path) : null));
    // 给重点章节打星：笔记内容是静态 HTML，所以等它画到页面上之后，直接找到对应的元素加 class
    //  - 章节导航里的链接 <a href="#id">、全栈基础里的分类按钮 #t-id → 加 is-key，CSS 在后面画 ★
    //  - 章节标题（section#id 或面板 #p-id 里的 h2）→ 前面插一个"重点"小标签
    function markKeys() {
      const n = note.value;
      if (!n || !n.keys || !n.keys.length || !root.value) return;
      n.keys.forEach((id) => {
        root.value.querySelectorAll(`a[href="#${id}"], #t-${id}`).forEach((el) => el.classList.add("is-key"));
        const sec = root.value.querySelector(`#${id}, #p-${id}`);
        const h2 = sec && sec.querySelector("h2");
        if (h2 && !h2.querySelector(".key-badge")) {
          const tag = document.createElement("span");
          tag.className = "key-badge";
          tag.textContent = "★ 重点";
          h2.prepend(tag);
        }
      });
    }
    // 网址一变（换了一篇），等新内容渲染完再打星；immediate 让第一次进来也执行
    watch(() => route.path, () => nextTick(markKeys), { immediate: true });
    onMounted(() => nextTick(markKeys));
    return { root, group, onClick };
  },
};

const LV = { must: "必读", key: "重要", ref: "查阅" };   // 徽章上显示的中文

const BkDiagram = {
  template: "#tpl-bk-diagram",
  setup() {
    onMounted(() => {
      // 系统设置了"减少动效"时，把 SVG 里的 SMIL 动画（<animateMotion>）也停掉
      try {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches)
          document.querySelectorAll(".bk svg").forEach((el) => el.pauseAnimations && el.pauseAnimations());
      } catch (e) {}
    });
    return {};
  },
};
const BkMap = { template: "#tpl-bk-map" };
const BkJava = { template: "#tpl-bk-java" };
const BkMindset = { template: "#tpl-bk-mindset" };
// Java / Node 两篇"全记录"：里面也有 SVG 动画，减少动效时一样要停掉
const pauseSvg = () => {
  try {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches)
      document.querySelectorAll(".rec svg").forEach((el) => el.pauseAnimations && el.pauseAnimations());
  } catch (e) {}
};
const BkJavaLog = { template: "#tpl-bk-java-log", setup() { onMounted(pauseSvg); return {}; } };
const BkNodeLog = { template: "#tpl-bk-node-log", setup() { onMounted(pauseSvg); return {}; } };
// 全栈基础笔记：页面里自带 13 个分类标签（终端、网络、HTTP……），原来靠一段小脚本切换。
// 嵌进来后把那段脚本改写在这里：组件挂到页面上（onMounted）后，给每个标签按钮绑定点击事件
const BkFullstack = {
  template: "#tpl-bk-fullstack",
  setup() {
    onMounted(() => {
      const root = document.querySelector(".fs");
      if (!root) return;
      const btns = [...root.querySelectorAll('.nav [role="tab"]')];          // 13 个标签按钮
      const panels = btns.map((b) => document.getElementById(b.getAttribute("aria-controls")));  // 每个按钮对应的内容面板
      // 记住上次看到哪一类：存在浏览器里（只是个小方便，读写失败也不影响使用）
      let last = 0;
      try { last = Math.max(0, btns.findIndex((b) => b.id === localStorage.getItem("fs_tab"))); } catch (e) {}
      // 显示第 i 个面板，其余隐藏；同时更新按钮的选中状态（aria-selected 决定黄色高亮）
      function show(i, scroll) {
        btns.forEach((b, k) => {
          const on = k === i;
          b.setAttribute("aria-selected", on ? "true" : "false");
          b.tabIndex = on ? 0 : -1;
          if (panels[k]) panels[k].hidden = !on;
        });
        try { localStorage.setItem("fs_tab", btns[i].id); } catch (e) {}
        if (scroll) {
          window.scrollTo(0, 0);
          btns[i].scrollIntoView({ block: "nearest", inline: "center" });   // 让选中的标签在横条里滚到中间
        }
      }
      btns.forEach((b, i) => {
        b.addEventListener("click", () => show(i, true));
        // 键盘左右方向键切换标签（无障碍习惯）
        b.addEventListener("keydown", (e) => {
          const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
          if (!d) return;
          const m = (i + d + btns.length) % btns.length;
          show(m, true); btns[m].focus();
        });
      });
      show(last, false);
      pauseSvg();
    });
    return {};
  },
};
const BkJlptLog = { template: "#tpl-bk-jlpt-log", setup() { onMounted(pauseSvg); return {}; } };

// ===================== 路由：网址 → 页面 的对照表 =====================
// 用 hash 模式：网址长这样 index.html#/backend
// 好处：# 后面的部分浏览器不会发给服务器，所以纯静态托管（Vercel、Artifact）也不会 404
// 选路由模式：先"试一下"浏览器允不允许改网址
// - 本地打开、部署到 Vercel：允许 → 用 hash 模式，网址会跟着变，可以存书签
// - Claude 的预览沙箱：不允许改网址，会抛 SecurityError → 换成 memory 模式（路由只记在内存里，网址不动）
function pickHistory() {
  try {
    history.replaceState(history.state, "", location.href);   // 原样写回当前网址，什么都不改，只是测试权限
    if (location.protocol === "about:") throw new Error("srcdoc");  // 预览有时是 about:srcdoc，hash 模式也用不了
    return createWebHashHistory();
  } catch (e) {
    return createMemoryHistory();
  }
}

const router = createRouter({
  history: pickHistory(),
  routes: [
    { path: "/", component: Home },
    // 嵌套路由：/backend 是外壳，children 是它里面的四个分类；进 /backend 默认打开第一篇
    {
      path: "/backend",
      component: BackendLayout,
      children: [
        { path: "", component: BkIndex, meta: { title: "后端笔记" } },   // 进 /backend 先看目录
        { path: "diagram", component: BkDiagram, meta: { title: "后端图解" } },
        { path: "map", component: BkMap, meta: { title: "后端代码地图" } },
        { path: "java", component: BkJava, meta: { title: "Java 与 Spring 速查" } },
        { path: "mindset", component: BkMindset, meta: { title: "后端写代码的思路" } },
        { path: "java-log", component: BkJavaLog, meta: { title: "Java 后端全记录" } },
        { path: "node-log", component: BkNodeLog, meta: { title: "Node 后端全记录" } },
        { path: "jlpt", component: BkJlptLog, meta: { title: "日语站接入后端" } },
        { path: "fullstack", component: BkFullstack, meta: { title: "全栈基础笔记" } },
      ],
    },
    { path: "/:any(.*)", redirect: "/" },   // 乱输的网址一律回首页
  ],
  // 每次切换页面，都滚回顶部
  scrollBehavior: () => ({ top: 0 }),
});

// 每次切换页面后，按路由里写的 meta.title 改浏览器标签页标题
router.afterEach((to, from) => {
  // 换到另一页时滚回顶部。路由自带的 scrollBehavior 在某些情况下（比如 memory 模式、或新页面还没渲染完）不生效，
  // 这里等新页面画到屏幕上（nextTick）之后再滚一次，保证每篇笔记都从标题开始看
  if (to.path !== from.path) Vue.nextTick(() => window.scrollTo(0, 0));
  document.title = to.meta.title ? `${to.meta.title} · Goen` : "Goen 秘密基地";
});

// ===================== 调试用：网址后面加 ?dbg 就在右下角显示尺寸信息 =====================
// 用来排查 iPad / iPhone 上的空白：看页面拿到的宽度（innerWidth）和屏幕真实宽度（screen）差多少
if (location.search.includes("dbg")) {
  const box = document.createElement("pre");
  box.style.cssText = "position:fixed;right:8px;bottom:8px;z-index:9999;margin:0;padding:8px 10px;font:11px/1.4 ui-monospace,monospace;background:rgba(0,0,0,.78);color:#fff;border-radius:8px;max-width:90vw;white-space:pre-wrap;pointer-events:none";
  const show = () => {
    const vv = window.visualViewport;
    box.textContent = [
      "版本 " + VERSION,
      "innerWidth×innerHeight: " + innerWidth + "×" + innerHeight,
      "documentElement.clientWidth: " + document.documentElement.clientWidth,
      "scrollWidth: " + document.documentElement.scrollWidth,
      "visualViewport: " + (vv ? Math.round(vv.width) + "×" + Math.round(vv.height) + " scale " + vv.scale.toFixed(2) : "无"),
      "screen: " + screen.width + "×" + screen.height + "  dpr " + devicePixelRatio,
      "viewport meta: " + document.getElementById("vp").content,
      navigator.userAgent,
    ].join("\n");
  };
  document.body.appendChild(box); show();
  ["resize", "orientationchange", "scroll"].forEach((ev) => window.addEventListener(ev, show));
}

// 创建应用 → 装上路由 → 挂到 #app 上
createApp({}).use(router).mount("#app");
</script>
